<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shape Shifter Safari: Tessellation Edition</title>
    <style>
        :root {
            --primary: #ec4899;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --success: #10b981;
            --bg: #090d16;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --avatar-color: #60a5fa;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 1024px;
            height: 576px;
            background-color: #0b1329;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        @media (max-width: 1050px), (max-height: 600px) { #game-container { transform: scale(0.9); } }
        @media (max-width: 930px), (max-height: 540px) { #game-container { transform: scale(0.75); } }
        @media (max-width: 780px), (max-height: 440px) { #game-container { transform: scale(0.6); } }
        @media (max-width: 620px), (max-height: 350px) { #game-container { transform: scale(0.45); } }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Splash Screen Branding */
        #splash-screen {
            background-color: #ffffff;
            z-index: 100;
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pulseLogo 2s infinite ease-in-out;
        }

        .innovine-logo {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #ff1f5a, #4a00e0);
            border-radius: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(74,0,224,0.3);
        }

        .innovine-logo::before {
            content: 'I';
            font-size: 110px;
            font-weight: 900;
            color: #ffffff;
            font-family: 'Arial Black', sans-serif;
        }

        .brand-text {
            margin-top: 20px;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #111111, #444444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #instruction-screen { background: rgba(9, 13, 22, 0.95); }
        
        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--secondary);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
        }

        h2 {
            color: var(--accent);
            font-size: 34px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(135deg, var(--secondary), #1d4ed8);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6); }
        .btn:active { transform: scale(0.95); }

        /* HUD Navigation Dashboard */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 85px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .hud-element {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-weight: bold;
            font-size: 15px;
        }

        .score-tag { color: var(--success); }
        .coin-tag { color: var(--accent); font-weight: 800; }

        .shop-btn {
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(168,85,247,0.3);
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 14px;
            border-radius: 30px;
        }
        .volume-slider { width: 60px; cursor: pointer; accent-color: var(--accent); }

        /* Pedagogical Hint Block Overlay */
        #hint-overlay {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid var(--primary);
            color: #f1f5f9;
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            max-width: 600px;
            z-index: 22;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            animation: fadeIn 0.3s ease;
        }

        /* Avatar Reward Modal Panel */
        #shop-modal {
            position: absolute;
            top: 95px;
            right: 20px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid var(--secondary);
            border-radius: 16px;
            padding: 15px;
            width: 260px;
            z-index: 30;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            color: white;
        }
        .shop-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: var(--accent); text-align: center;}
        .shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .skin-option {
            height: 45px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;
        }
        .skin-option.locked { background: #334155 !important; color: #94a3b8; cursor: not-allowed; }

        /* Graphics Planes */
        #game-canvas, #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #game-canvas { z-index: 1; }
        #fx-canvas { z-index: 15; pointer-events: none; }
        #interaction-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

        /* Interactive Tokens styling */
        .draggable-token {
            position: absolute;
            width: 95px;
            height: 95px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid var(--accent);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
