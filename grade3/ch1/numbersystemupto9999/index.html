<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏰 Number Kingdom</title>
<link href="https://fonts.googleapis.com/css2?family=Arbutus&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Arbutus',cursive;background:linear-gradient(#dbeafe,#f0f9ff);color:#333}
#splash,#game,#endScreen{width:100%;height:100vh;display:none;flex-direction:column;align-items:center;overflow:auto}
#splash{justify-content:center}
#splash img{width:220px;max-width:70%}
#progressContainer{width:90%;height:18px;background:#ddd;border-radius:20px;margin-top:12px;overflow:hidden}
#progress{height:100%;width:0;background:#22c55e;transition:.3s}
#topBar{width:90%;display:flex;justify-content:space-between;margin:10px 0}
#starDisplay{color:#f59e0b;font-weight:bold}
#gateTitle{text-align:center;color:#4b2e83;padding:0 10px}
#imageArea img{max-width:90%;max-height:50vh;border-radius:12px;display:block;margin:10px 0}
#feedback{height:36px;font-weight:bold;text-align:center}
#questionBox{width:90%;display:flex;flex-direction:column;gap:10px}
.option-btn{padding:14px;border:none;border-radius:10px;background:#7b3fbd;color:#fff;cursor:pointer}
.option-btn:active{opacity:0.7}
#treasurePopup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:24px;border-radius:16px;box-shadow:0 0 20px rgba(0,0,0,.3);text-align:center}
#endScreen{justify-content:center;text-align:center}
#playAgain{padding:14px 24px;background:#22c55e;color:#fff;border:none;border-radius:10px;cursor:pointer;margin-top:20px}
.confetti{position:fixed;width:10px;height:10px;top:-10px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<div id="splash">
<img src="assets/logo.png" alt="Logo">
<h1>Number Kingdom</h1>
</div>

<div id="game">
<div id="progressContainer"><div id="progress"></div></div>
<div id="topBar">
<div id="starDisplay">⭐ Stars: 0</div>
<div id="gateCounter">Gate 1</div>
</div>
<h2 id="gateTitle"></h2>
<div id="imageArea"></div>
<div id="feedback"></div>
<div id="questionBox"></div>
</div>

<div id="treasurePopup">🎁 Treasure Chest Found!<br><br>⭐ Bonus Star Earned!</div>

<div id="endScreen">
<h1 id="endMessage"></h1>
<button id="playAgain">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
let currentGate=1, stars=0, isAnswered=false;

const gates=[
{question:"Which number is shown?",image:"assets/q1.png",options:["4578","4857","4587","5487"],answer:"4587"},
{question:"What number does the abacus show?",image:"assets/q2.png",options:["3264","3245","3524","3254"],answer:"3254"},
{question:"What is the place value of 5 in the given number?",image:"assets/q3.png",options:["5","50","500","5000"],answer:"500"},
{question:"What is the face value of 5 in 4587?",image:"assets/q4.png",options:["50","5","5000","500"],answer:"5"},
{question:"Choose the expanded form of 4587.",image:"assets/q5.png",options:["4000 + 500 + 80 + 7","4000 + 500 + 87","4500 + 80 + 7","4000 + 580 + 7"],answer:"4000 + 500 + 80 + 7"},
{question:"What is the standard form of 3000 + 100 + 70 + 9?",image:"assets/q6.png",options:["3197","3170","3179","3107"],answer:"3179"},
{question:"Compare 6346 ▢ 6620",image:"assets/q7.png",options:["=","<",">","≠"],answer:"<"},
{question:"Arrange numbers in ascending order.",image:"assets/gate8_path.png",options:["2100,1234,3245,4321","1234,2100,3245,4321","1234,3245,2100,4321","4321,3245,2100,1234"],answer:"1234,2100,3245,4321"},
{question:"What is the successor of 5620?",image:"assets/q9.png",options:["5621","5630","5625","5619"],answer:"5621"},
{question:"What is the predecessor of 9553?",image:"assets/q10.png",options:["9552","9543","9563","9544"],answer:"9552"},
{question:"Form the largest 4-digit number using 4, 2, 9, 7.",image:"assets/q11.png",options:["9742","9724","9247","9472"],answer:"9742"},
{question:"Form the smallest 4-digit number using 4, 2, 9, 7.",image:"assets/q12.png",options:["4279","2479","2794","2947"],answer:"2479"},
{question:"Is 4587 odd or even?",image:"assets/q13.png",options:["Even","Odd"],answer:"Odd"},
{question:"Round 4587 to nearest 10, 100, 1000.",image:"assets/q14.png",options:["4590,4600,5000","4580,4500,4000","4587,4500,4000","4590,4500,4000"],answer:"4590,4600,5000"},
{question:"Convert 24 into Roman Numerals.",image:"assets/q15.png",options:["XLIV","XXIV","XXVI","XIV"],answer:"XXIV"}
];

const splash=document.getElementById("splash"),
game=document.getElementById("game"),
endScreen=document.getElementById("endScreen"),
gateTitle=document.getElementById("gateTitle"),
imageArea=document.getElementById("imageArea"),
questionBox=document.getElementById("questionBox"),
progressBar=document.getElementById("progress"),
feedback=document.getElementById("feedback"),
starDisplay=document.getElementById("starDisplay"),
gateCounter=document.getElementById("gateCounter"),
treasurePopup=document.getElementById("treasurePopup"),
endMessage=document.getElementById("endMessage"),
correctSound=document.getElementById("correctSound"),
wrongSound=document.getElementById("wrongSound"),
clapSound=document.getElementById("clapSound");

function showSplash(){splash.style.display="flex";setTimeout(()=>{splash.style.display="none";showGate(1)},3000);}

function showGate(level){
isAnswered=false; feedback.textContent="";
game.style.display="flex";
const gate=gates[level-1];
gateCounter.textContent=`Gate ${level}/${gates.length}`;
gateTitle.textContent=gate.question;
imageArea.innerHTML=`<img src="${gate.image}" alt="Question" onerror="this.style.display='none'">`;
questionBox.innerHTML="";
gate.options.forEach(opt=>{
const b=document.createElement("button");
b.className="option-btn"; b.textContent=opt;
b.onclick=()=>checkAnswer(opt,gate.answer);
questionBox.appendChild(b);
});
progressBar.style.width=`${((level-1)/gates.length)*100}%`;
starDisplay.textContent=`⭐ Stars: ${stars}`;
}

function checkAnswer(selected,correct){
if(isAnswered) return;
if(selected===correct){
isAnswered=true; stars++;
starDisplay.textContent=`⭐ Stars: ${stars}`;
feedback.textContent="🎉 Correct!"; feedback.style.color="green";
document.querySelectorAll(".option-btn").forEach(b=>b.disabled=true);
correctSound.play().catch(()=>{});
setTimeout(()=>{
if(currentGate===5||currentGate===10){showTreasure();} else {nextGate();}
},800);
}else{
feedback.textContent="❌ Try Again!"; feedback.style.color="red";
wrongSound.play().catch(()=>{});
}
}

function showTreasure(){
stars++;
starDisplay.textContent=`⭐ Stars: ${stars}`;
treasurePopup.style.display="block";
setTimeout(()=>{treasurePopup.style.display="none"; nextGate();},2000);
}

function nextGate(){currentGate++; if(currentGate>gates.length){showEnd();} else{showGate(currentGate);}}

function showEnd(){
game.style.display="none";
endScreen.style.display="flex";
clapSound.play().catch(()=>{});
for(let i=0;i<100;i++){
const c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=`hsl(${Math.random()*360},100%,50%)`;
c.style.animationDuration=(2+Math.random()*3)+"s";
document.body.appendChild(c);
setTimeout(()=>c.remove(),5000);
}
endMessage.innerHTML=`🎉 Congratulations!<br><br>⭐ Stars Collected: ${stars}/${stars}`;
}

document.getElementById("playAgain").onclick=()=>{
currentGate=1; stars=0; endScreen.style.display="none"; progressBar.style.width="0%"; showGate(1);
};

window.onload=showSplash;
</script>
</body>
</html>
