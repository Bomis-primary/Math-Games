<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Number Kingdom</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:url('assets/castle-background.jpg');
background-size:cover;
background-position:center;
min-height:100vh;
text-align:center;
}

.header{
background:white;
padding:10px;
box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.logo{
height:70px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.screen{
display:none;
}

.active{
display:block;
}

.card{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
margin-top:20px;
}

.btn{
background:#8e44ad;
color:white;
border:none;
padding:14px 24px;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

.btn:hover{
background:#71368a;
}

.question{
font-size:24px;
margin-bottom:20px;
}

.option{
display:block;
width:100%;
margin:10px 0;
padding:15px;
border:none;
border-radius:10px;
background:#8e44ad;
color:white;
font-size:18px;
cursor:pointer;
}

.option:hover{
background:#71368a;
}

.image-area{
margin:20px auto;
}

.object-image{
width:250px;
height:250px;
object-fit:contain;
}

.progress-container{
width:100%;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin:15px 0;
}

.progress-bar{
height:22px;
width:0%;
background:#2ecc71;
transition:.3s;
}

#message{
font-size:20px;
font-weight:bold;
height:30px;
margin-top:15px;
}

.gate{
font-size:22px;
font-weight:bold;
color:#27ae60;
}

.win-text{
font-size:32px;
color:#e67e22;
}

</style>
</head>

<body>

<div class="header">
<img src="assets/innovine-logo.png" class="logo">
</div>

<div class="container">

<div id="startScreen" class="screen active">

<div class="card">

<h1>🏰 Number Kingdom</h1>

<br>

<p>
Unlock all kingdom gates and become the Royal Number Keeper.
</p>

<button class="btn" onclick="showInstructions()">
Enter Kingdom
</button>

</div>

</div>

<div id="instructionScreen" class="screen">

<div class="card">

<h2>📖 Instructions</h2>

<br>

<p>✔ Read 4-digit numbers</p>
<p>✔ Use place value</p>
<p>✔ Solve number challenges</p>
<p>✔ Learn Roman numerals</p>
<p>✔ Unlock all gates</p>

<button class="btn" onclick="startGame()">
Start Adventure
</button>

</div>

</div>

<div id="gameScreen" class="screen">

<div class="card">

<div class="gate" id="gateCount">
Gate 1 / 15
</div>

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<div id="question" class="question"></div>

<div class="image-area" id="imageArea"></div>

<div id="options"></div>

<div id="message"></div>

</div>

</div>

<div id="winScreen" class="screen">

<div class="card">

<div class="win-text">
🏆 Royal Number Keeper
</div>

<br>

<img src="assets/royal-badge.png" width="180">

<br><br>

<p>
You unlocked all kingdom gates.
</p>

<br>

<button class="btn" onclick="location.reload()">
Play Again
</button>

</div>

</div>

</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="winSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

let level=1;
let correctAnswer="";

function switchScreen(id){
document.querySelectorAll(".screen").forEach(screen=>{
screen.classList.remove("active");
});
document.getElementById(id).classList.add("active");
}

function showInstructions(){
switchScreen("instructionScreen");
}

function startGame(){
switchScreen("gameScreen");
generateQuestion();
}

function shuffle(array){
return array.sort(()=>Math.random()-0.5);
}
  function generateQuestion(){

if(level>15){
showWinScreen();
return;
}

document.getElementById("message").innerHTML="";

let question="";
let answer="";
let options=[];
let image="assets/castle-gate.png";

if(level===1){

question="🏰 Gate 1: Which number is shown?";

answer="4587";

options=[
"4587",
"4857",
"4578",
"5487"
];

}

if(level===2){

question="🏰 Gate 2: What number does the abacus show?";

image="assets/abacus.png";

answer="3254";

options=[
"3254",
"3524",
"3245",
"2354"
];

}

if(level===3){

question="🏰 Gate 3: What is the place value of 5 in 4587?";

answer="500";

options=[
"5",
"50",
"500",
"5000"
];

}

if(level===4){

question="🏰 Gate 4: What is the face value of 5 in 4587?";

answer="5";

options=[
"5",
"50",
"500",
"5000"
];

}

if(level===5){

question="🏰 Gate 5: Choose the expanded form of 4587.";

answer="4000 + 500 + 80 + 7";

options=[
"4000 + 500 + 80 + 7",
"4000 + 500 + 87",
"4500 + 80 + 7",
"4000 + 580 + 7"
];

}

if(level===6){

question="🏰 Gate 6: What is the standard form of 4000 + 300 + 20 + 1?";

answer="4321";

options=[
"4321",
"4231",
"4312",
"3421"
];

}

if(level===7){

question="🏰 Gate 7: Compare 4587 and 4857.";

answer="<";

options=[
"<",
">",
"=",
"≠"
];

}

if(level===8){

question="🏰 Gate 8: Arrange in ascending order.";

answer="1234, 2100, 3245, 4321";

options=[
"1234, 2100, 3245, 4321",
"4321, 3245, 2100, 1234",
"2100, 1234, 3245, 4321",
"1234, 3245, 2100, 4321"
];

}

if(level===9){

question="🏰 Gate 9: What is the successor of 4587?";

answer="4588";

options=[
"4588",
"4586",
"4597",
"4687"
];

}

if(level===10){

question="🏰 Gate 10: What is the predecessor of 4587?";

answer="4586";

options=[
"4588",
"4586",
"4577",
"4487"
];

}

if(level===11){

question="🏰 Gate 11: Form the largest 4-digit number using 4, 2, 9, 7.";

answer="9742";

options=[
"9742",
"9724",
"9472",
"9247"
];

}

if(level===12){

question="🏰 Gate 12: Form the smallest 4-digit number using 4, 2, 9, 7.";

answer="2479";

options=[
"2479",
"2794",
"2947",
"4279"
];

}

if(level===13){

question="🏰 Gate 13: Is 4587 odd or even?";

answer="Odd";

options=[
"Odd",
"Even",
"Both",
"Neither"
];

}

if(level===14){

question="🏰 Gate 14: Round 4587 to the nearest 100.";

answer="4600";

options=[
"4500",
"4600",
"5000",
"4580"
];

}

if(level===15){

image="assets/roman-scroll.png";

question="🏰 Gate 15: Convert 24 into Roman Numerals.";

answer="XXIV";

options=[
"XXIV",
"XIV",
"XXVI",
"XLIV"
];

}

correctAnswer=answer;

options=shuffle(options);

document.getElementById("question").innerHTML=
question;

document.getElementById("imageArea").innerHTML=
`<img src="${image}" class="object-image">`;

let html="";

options.forEach(option=>{

html += `
<button class="option"
onclick="checkAnswer('${option}')">
${option}
</button>
`;

});

document.getElementById("options").innerHTML=
html;

}

function checkAnswer(selected){

if(selected===correctAnswer){

document.getElementById("correctSound").play();

document.getElementById("message").innerHTML=
"✅ Gate Unlocked!";

level++;

document.getElementById("gateCount").innerHTML=
`Gate ${Math.min(level,15)} / 15`;

document.getElementById("progressBar").style.width=
((level-1)*(100/15))+"%";

}
else{
  document.getElementById("wrongSound").play();

document.getElementById("message").innerHTML=
`❌ Correct Answer: ${correctAnswer}`;

}

setTimeout(generateQuestion,1500);

}

function showWinScreen(){

document.getElementById("winSound").play();

switchScreen("winScreen");

document.getElementById("progressBar").style.width="100%";

}

</script>

</body>
</html>
