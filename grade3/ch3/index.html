<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Subtraction Café - Magical Baking Mission</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --espresso: #3D2314;
            --latte-cream: #FFFDF9;
            --chalkboard-bg: #1E291B;
            --pastry-pink: #FF8EA3;
            --mint-fresh: #A8E6CF;
            --berry-red: #E63946;
            --warm-caramel: #D4A373;
            --gold: #FFD166;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        h1, h2, h3, .action-btn, .confirm-btn, .instruction-banner, .hud-bar {
            font-family: 'Fredoka One', sans-serif;
        }

        body {
            background: linear-gradient(rgba(61, 35, 20, 0.4), rgba(61, 35, 20, 0.4)), 
                        radial-gradient(circle at center, #FAEDCD 0%, #D4A373 100%);
            background-size: cover;
            color: var(--espresso);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 15px;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .splash-logo { max-width: 240px; height: auto; }

        /* --- CARDS & DIALOGS --- */
        .adventure-card {
            width: 100%;
            max-width: 650px;
            background: var(--latte-cream);
            color: var(--espresso);
            border: 6px solid var(--warm-caramel);
            box-shadow: 0 20px 40px rgba(61, 35, 20, 0.3);
            border-radius: 32px;
            padding: 40px 30px;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .avatar-view {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            background: #FAEDCD;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border: 4px dashed var(--warm-caramel);
            animation: bounceChef 3s infinite alternate ease-in-out;
            overflow: hidden;
        }
        
        .avatar-view img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        @keyframes bounceChef {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        .card-title {
            font-size: 2.4rem;
            color: var(--espresso);
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #FFF;
        }

        .scroll-text {
            font-size: 1.2rem;
            line-height: 1.6;
            background: #FFF;
            padding: 25px;
            border-radius: 20px;
            border: 3px dashed var(--warm-caramel);
            margin-bottom: 30px;
            text-align: left;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.02);
        }

        .action-btn {
            background: linear-gradient(135deg, #FFD166, #F4A261);
            color: var(--espresso);
            border: 3px solid var(--espresso);
            padding: 16px 50px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--espresso);
            transition: all 0.1s ease;
        }
        .action-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 transparent;
        }

        /* --- GAME SCREEN --- */
        #game-container {
            width: 100%;
            max-width: 700px;
            background: var(--latte-cream);
            border: 6px solid var(--espresso);
            border-radius: 36px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.25);
            display: none;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--espresso);
            color: #FFF;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .progress-container {
            width: 100%;
            background: #EED9C4;
            height: 14px;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid var(--espresso);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--pastry-pink), #FF4D6D);
            transition: width 0.4s ease;
        }

        #temple-wall {
            width: 100%;
            height: 140px;
            background: #F3E1CE;
            border-radius: 24px;
            border: 4px solid var(--espresso);
            margin-bottom: 25px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -12px 0 #E5C4A3;
        }

        #vault-door {
            font-size: 5rem;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #vault-door.open {
            transform: scale(0) rotate(180deg);
            opacity: 0;
        }

        .puzzle-console {
            background: var(--chalkboard-bg);
            border-radius: 24px;
            padding: 25px;
            border: 8px solid #5C4033;
            color: #FFF;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 8px 16px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            text-align: center;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .instruction-banner {
            font-size: 1rem;
            letter-spacing: 1.5px;
            color: var(--gold);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .equation-layout {
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.6;
        }

        .entry-deck {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stone-input {
            width: 200px;
            padding: 15px;
            font-size: 1.6rem;
            font-weight: 900;
            text-align: center;
            background: #FFF;
            border: 4px solid var(--espresso);
            border-radius: 20px;
            color: var(--espresso);
            outline: none;
            transition: all 0.2s;
        }
        .stone-input:focus {
            border-color: var(--pastry-pink);
            box-shadow: 0 0 15px rgba(255, 142, 163, 0.4);
        }
