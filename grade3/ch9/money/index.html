<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Math - Money Game</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e0f7fa, #fff9c4);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }
        
        /* 5-Second Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }
        .splash-logo {
            max-width: 80%;
            max-height: 180px;
            object-fit: contain;
            animation: pulseLogo 2s infinite ease-in-out;
        }
        @keyframes pulseLogo {
            0% { transform: scale(0.95); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.9; }
        }

        /* Main Content Container */
        .game-container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #4caf50;
            text-align: center;
            position: relative;
            overflow: hidden;
            opacity: 0; /* Stays hidden during splash screen */
            transition: opacity 0.5s ease-in;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            max-height: 50px;
            object-fit: contain;
        }
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f1f8e9;
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid #c5e1a5;
        }
        .audio-controls label {
            font-size: 12px;
            font-weight: bold;
            color: #33691e;
        }
        .volume-slider {
            width: 70px;
            cursor: pointer;
        }
        .progress-bar {
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .score-board {
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .question-box {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            min-height: 50px;
        }
        .asset-display {
            margin-bottom: 25px;
            min-height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .asset-display img {
            max-height: 130px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 8px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        @media(min-width: 400px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .btn-option {
            background-color: #fff;
            border: 3px solid #b3e5fc;
            border-radius: 15px;
            padding: 15px 10px;
            font-size: 18px;
            font-weight: bold;
            color: #0277bd;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 #b3e5fc;
        }
        .btn-option:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }
        .btn-option.correct {
            background-color: #c8e6c9 !important;
            border-color: #4caf50 !important;
            color: #2e7d32 !important;
            box-shadow: 0 4px 0 #4caf50 !important;
        }
        .btn-option.wrong {
            background-color: #ffcdd2 !important;
            border-color: #f44336 !important;
            color: #c62828 !important;
            box-shadow: 0 4px 0 #f44336 !important;
        }
        .btn-restart {
            background: linear-gradient(145deg, #ff9800, #f57c00);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #e65100;
            margin-top: 15px;
            display: none;
        }
        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 transparent;
        }
        #canvas-confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- 5-Second Brand Introduction View -->
    <div class="splash-screen" id="splash-screen">
        <img class="splash-logo" src="assets/logo.png" alt="Innovine Logo" onerror="this.src='https://placehold.co/300x120?text=Innovine'">
    </div>

    <div class="game-container" id="game-container">
        <canvas id="canvas-confetti"></canvas>
        
        <div class="header">
            <img class="logo" src="assets/logo.png" alt="Logo" onerror="this.style.display='none'">
            <div class="audio-controls">
                <label for="volume">🔊 Vol:</label>
                <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.1" value="0.8">
            </div>
        </div>

        <div class="score-board">
            Question <span id="current-idx">1</span> of <span id="total-count">10</span> | Score: <span id="score-val">0</span>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress-line"></div>
        </div>

        <div class="question-box" id="question-text">Loading question...</div>

        <div class="asset-display" id="asset-container"></div>

        <div class="options-grid" id="options-box"></div>

        <button class="btn-restart" id="btn-restart" onclick="initGame()">🔄 Play Again</button>
    </div>

    <!-- Audio Targets pointing to your local asset sub-folder structure -->
    <audio id="snd-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="snd-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="snd-cheer" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <script>
        // Item Bank based on your uploaded assets and learning outcomes
        const itemBank = [
            { q: "Identify this Indian coin:", img: "assets/coin1.png", answers: ["₹1", "₹2", "₹5", "₹10"], correct: "₹1" },
            { q: "Identify this Indian coin:", img: "assets/coin2.png", answers: ["₹1", "₹2", "₹5", "₹10"], correct: "₹2" },
            { q: "Identify this Indian coin:", img: "assets/coin5.png", answers: ["₹1", "₹2", "₹5", "₹10"], correct: "₹5" },
            { q: "Identify this Indian currency note:", img: "assets/note10.png", answers: ["₹10", "₹20", "₹50", "₹100"], correct: "₹10" },
            { q: "Identify this Indian currency note:", img: "assets/note20.png", answers: ["₹10", "₹20", "₹50", "₹100"], correct: "₹20" },
            { q: "Identify this Indian currency note:", img: "assets/note50.png", answers: ["₹10", "₹20", "₹50", "₹100"], correct: "₹50" },
            { q: "Identify this Indian currency note:", img: "assets/note200.png", answers: ["₹100", "₹200", "₹500", "₹2000"], correct: "₹200" },
            { q: "Convert ₹5 into paise.", img: "", answers: ["50 p", "500 p", "5 p", "5000 p"], correct: "500 p" },
            { q: "Convert 200p into Rupees.", img: "", answers: ["₹20", "₹2", "₹0.2", "₹200"], correct: "₹2" },
            { q: "Express 15 rupees and 50 paise using the correct decimal layout.", img: "", answers: ["₹15.05", "₹155.0", "₹15.50", "15.50p"], correct: "₹15.50" },
            { q: "Sita bought a notebook for ₹50 and a pen for ₹20. How much total money did she spend?", img: "", answers: ["₹70", "₹60", "₹80", "₹100"], correct: "₹70" },
            { q: "If you buy a toy for ₹150 and pay with a ₹200 note, how much change will you get back?", img: "assets/note200.png", answers: ["₹10", "₹20", "₹50", "₹5"], correct: "₹50" }
        ];

        let gameQuestions = [];
        let activeIndex = 0;
        let runningScore = 0;
        let blocksInteraction = false;

        const volumeSlider = document.getElementById('volume');
        const sndCorrect = document.getElementById('snd-correct');
        const sndWrong = document.getElementById('snd-wrong');
        const sndCheer = document.getElementById('snd-cheer');

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // Handle splash entry countdown management
        window.onload = function() {
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                const gameContainer = document.getElementById('game-container');
                
                // Fade out splash layout smoothly
                splash.style.opacity = '0';
                
                // Switch focus context
                setTimeout(() => {
                    splash.style.display = 'none';
                    gameContainer.style.opacity = '1';
                    initGame();
                }, 800); // Syncs up perfectly with CSS transitions
            }, 5000); // 5-second complete active display window
        };

        function initGame() {
            activeIndex = 0;
            runningScore = 0;
            blocksInteraction = false;
            document.getElementById('btn-restart').style.display = 'none';
            document.getElementById('options-box').style.display = 'grid';
            
            gameQuestions = shuffle([...itemBank]).slice(0, 10);
            
            document.getElementById('total-count').textContent = gameQuestions.length;
            document.getElementById('score-val').textContent = runningScore;
            
            renderQuestion();
        }

        function renderQuestion() {
            blocksInteraction = false;
            if(activeIndex >= gameQuestions.length) {
                endGame();
                return;
            }

            document.getElementById('current-idx').textContent = activeIndex + 1;
            document.getElementById('score-val').textContent = runningScore;
            
            let progressPercent = (activeIndex / gameQuestions.length) * 100;
            document.getElementById('progress-line').style.width = progressPercent + '%';

            let currentItem = gameQuestions[activeIndex];
            document.getElementById('question-text').textContent = currentItem.q;

            const assetBox = document.getElementById('asset-container');
            assetBox.innerHTML = '';
            if(currentItem.img) {
                const graphic = document.createElement('img');
                graphic.src = currentItem.img;
                graphic.alt = "Currency Asset";
                graphic.onerror = function() {
                    assetBox.innerHTML = `<span style='color:#7f8c8d; font-style:italic;'>[Visual Clue: ${currentItem.correct}]</span>`;
                };
                assetBox.appendChild(graphic);
            }

            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';
            
            let shuffledChoices = shuffle([...currentItem.answers]);
            shuffledChoices.forEach(choice => {
                const optionBtn = document.createElement('button');
                optionBtn.className = 'btn-option';
                optionBtn.textContent = choice;
                optionBtn.onclick = () => verifyChoice(optionBtn, choice, currentItem.correct);
                optionsBox.appendChild(optionBtn);
            });
        }

        function verifyChoice(buttonElement, picked, actualRight) {
            if(blocksInteraction) return;
            blocksInteraction = true;

            let volumeLevel = volumeSlider.value;
            sndCorrect.volume = volumeLevel;
            sndWrong.volume = volumeLevel;

            if(picked === actualRight) {
                buttonElement.classList.add('correct');
                runningScore++;
                document.getElementById('score-val').textContent = runningScore;
                try { sndCorrect.play(); } catch(e){}
                triggerConfettiEffect();
            } else {
                buttonElement.classList.add('wrong');
                try { sndWrong.play(); } catch(e){}
                
                Array.from(document.getElementById('options-box').children).forEach(btn => {
                    if(btn.textContent === actualRight) {
                        btn.classList.add('correct');
                    }
                });
            }

            setTimeout(() => {
                activeIndex++;
                renderQuestion();
            }, 2000);
        }

        function endGame() {
            document.getElementById('progress-line').style.width = '100%';
            document.getElementById('question-text').textContent = `Awesome Job! 🎉 Final Score: ${runningScore} / ${gameQuestions.length}`;
            document.getElementById('asset-container').innerHTML = '';
            document.getElementById('options-box').style.display = 'none';
            document.getElementById('btn-restart').style.display = 'inline-block';
            
            let volumeLevel = volumeSlider.value;
            sndCheer.volume = volumeLevel;
            try { sndCheer.play(); } catch(e){}
            triggerConfettiEffect();
        }

        // Canvas Confetti implementation Engine
        const canvas = document.getElementById('canvas-confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function triggerConfettiEffect() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight;
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * canvas.height,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            if (particles.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncremental;
                p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                p.tilt = Math.sin(p.tiltAngle - index / 3) * 15;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                ctx.stroke();

                if (p.y > canvas.height) {
                    particles[index] = {
                        x: Math.random() * canvas.width,
                        y: -20,
                        r: p.r,
                        d: p.d,
                        color: p.color,
                        tilt: p.tilt,
                        tiltAngleIncremental: p.tiltAngleIncremental,
                        tiltAngle: p.tiltAngle
                    };
                }
            });

            if (particles.some(p => p.y < canvas.height)) {
                requestAnimationFrame(animateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
