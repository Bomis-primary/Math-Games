<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazaar Run: Money Master</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 600px;
            background: #ffffff;
            border: 4px solid #4a90e2;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .hidden { display: none !important; }

        /* Splash Screen */
        #logo-screen { background-color: #ffffff; }
        #logo-screen img { max-width: 250px; animation: pulse 1.5s infinite; }

        /* Instructions */
        #instruction-screen { background: #eef7ff; }
        h2 { color: #2c3e50; margin-bottom: 15px; font-size: 28px; }
        p { color: #555; font-size: 18px; margin-bottom: 25px; max-width: 80%; }
        
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        button:active { transform: scale(0.95); }

        /* Gameplay Layout */
        #scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: #4a90e2;
            color: white;
            font-weight: bold;
            font-size: 18px;
            position: absolute;
            top: 0;
            left: 0;
        }

        #question-box {
            margin-top: 45px;
            padding: 10px 15px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            min-height: 105px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .question-visual-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .question-img-wrapper {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .question-asset-img {
            height: 50px;
            object-fit: contain;
            animation: popIn 0.3s ease-out;
        }

        #workspace {
            width: 90%;
            height: 135px;
            border: 3px dashed #bdc3c7;
            border-radius: 10px;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 10px;
            overflow-y: auto;
        }

        /* 2-row layout grid tray */
        #asset-shelf {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            justify-items: center;
            align-items: center;
            margin-bottom: 12px;
            width: 90%;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        /* Increased size of currency tray icons for better visibility */
        .money-asset {
            height: 68px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.1s;
            -webkit-user-drag: none;
        }
        .money-asset:hover { transform: scale(1.08); }

        /* Increased size of dropped currency items inside the workspace */
        .workspace-item {
            height: 64px;
            object-fit: contain;
            cursor: pointer;
            animation: popIn 0.15s ease-out;
        }

        .controls { display: flex; gap: 15px; margin-bottom: 5px; }
        .btn-clear { background-color: #e74c3c; }
        .btn-submit { background-color: #3498db; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="game-container">

    <div id="logo-screen" class="screen">
        <img src="./assets/logo.png" alt="Innovine Logo">
    </div>

    <div id="instruction-screen" class="screen hidden">
        <h2>Welcome to the Great Indian Bazaar!</h2>
        <p>Help shoppers count out the exact money or change using Indian coins and banknotes. Read carefully and get a perfect score!</p>
        <button onclick="startGame()">Start Playing</button>
    </div>

    <div id="gameplay-screen" class="screen hidden">
        <div id="scoreboard">
            <span id="txt-progress">Task: 1 / 10</span>
            <span id="txt-score">Score: 0</span>
        </div>

        <div id="question-box">Loading question...</div>

        <div id="workspace">
            </div>

        <div id="asset-shelf">
            <img src="./assets/coin1.png" class="money-asset" data-val="1" onclick="addAsset(1, './assets/coin1.png')">
            <img src="./assets/coin2.png" class="money-asset" data-val="2" onclick="addAsset(2, './assets/coin2.png')">
            <img src="./assets/coin5.png" class="money-asset" data-val="5" onclick="addAsset(5, './assets/coin5.png')">
            <img src="./assets/note10.png" class="money-asset" data-val="10" onclick="addAsset(10, './assets/note10.png')">
            
            <img src="./assets/note20.png" class="money-asset" data-val="20" onclick="addAsset(20, './assets/note20.png')">
            <img src="./assets/note50.png" class="money-asset" data-val="50" onclick="addAsset(50, './assets/note50.png')">
            <img src="./assets/note200.png" class="money-asset" data-val="200" onclick="addAsset(200, './assets/note200.png')">
            <div></div> </div>

        <div class="controls">
            <button class="btn-clear" onclick="clearWorkspace()">Clear</button>
            <button class="btn-submit" onclick="validateAnswer()">Submit</button>
        </div>
    </div>

    <div id="completion-screen" class="screen hidden">
        <h2>🎉 Challenge Completed! 🎉</h2>
        <p id="final-score-text">Your Total Score: 0/100</p>
        <button onclick="restartGame()">Play Again</button>
    </div>

</div>

<script>
    const soundClaps = new Audio('./assets/claps.mp3');
    const soundWrong = new Audio('./assets/wrong.mp3');

    const masterPool = [
        { q: "Give the shopkeeper exactly ₹12.00 using assets.", target: 12, items: [] },
        { q: "Count out exactly ₹215.00 for a book box.", target: 215, items: [] },
        { q: "Convert 500p into Rupees. Pay that amount to the stall.", target: 5, items: [] },
        { q: "Convert 700p into Rupees. Place the matching notes/coins here.", target: 7, items: [] },
        { 
            q: "Rohan bought a muffin for ₹20 and a candy for ₹10. Pay the total.", 
            target: 30, 
            items: [
                { src: "./assets/muffin.png", count: 1 },
                { src: "./assets/candy.png", count: 1 }
            ] 
        },
        { 
            q: "Each pack of chips costs ₹15. You buy these packs. Pay the total:", 
            target: 30, 
            items: [
                { src: "./assets/chips.png", count: 2 }
            ] 
        },
        { q: "Riya wants to pay ₹75.00. Help her put together the right assets.", target: 75, items: [] },
        { q: "Sam gave a ₹200 note for a toy costing ₹150. Drag the change he gets back.", target: 50, items: [] },
        { 
            q: "Karan buys a muffin for ₹45 and a candy for ₹5. What is the sum?", 
            target: 50, 
            items: [
                { src: "./assets/muffin.png", count: 1 },
                { src: "./assets/candy.png", count: 1 }
            ] 
        },
        { q: "You split a ₹40 meal evenly with a friend. How much do you owe?", target: 20, items: [] }
    ];

    let gameQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let attempts = 2;
    let selectedAssets = [];
    let totalSelectedVal = 0;

    window.onload = function() {
        setTimeout(() => {
            showScreen('instruction-screen');
        }, 5000);
    };

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    function startGame() {
        gameQuestions = [...masterPool].sort(() => Math.random() - 0.5);
        currentIdx = 0;
        score = 0;
        attempts = 2;
        showScreen('gameplay-screen');
        loadQuestion();
    }

    function loadQuestion() {
        attempts = 2;
        clearWorkspace();
        document.getElementById('txt-progress').innerText = `Task: ${currentIdx + 1} / 10`;
        document.getElementById('txt-score').innerText = `Score: ${score}`;
        
        let qBox = document.getElementById('question-box');
        let currentQuestion = gameQuestions[currentIdx];
        
        qBox.innerText = currentQuestion.q;

        if (currentQuestion.items && currentQuestion.items.length > 0) {
            let visualRow = document.createElement('div');
            visualRow.className = 'question-visual-row';
            
            currentQuestion.items.forEach(item => {
                let wrapper = document.createElement('div');
                wrapper.className = 'question-img-wrapper';
                
                for (let i = 0; i < item.count; i++) {
                    let img = document.createElement('img');
                    img.src = item.src;
                    img.className = 'question-asset-img';
                    wrapper.appendChild(img);
                }
                visualRow.appendChild(wrapper);
            });
            qBox.appendChild(visualRow);
        }
    }

    function addAsset(value, src) {
        selectedAssets.push(value);
        totalSelectedVal += value;
        
        const img = document.createElement('img');
        img.src = src;
        img.className = 'workspace-item';
        img.onclick = () => removeSpecificAsset(value, img);
        document.getElementById('workspace').appendChild(img);
    }

    function removeSpecificAsset(value, element) {
        const index = selectedAssets.indexOf(value);
        if (index > -1) {
            selectedAssets.splice(index, 1);
            totalSelectedVal -= value;
            element.remove();
        }
    }

    function clearWorkspace() {
        selectedAssets = [];
        totalSelectedVal = 0;
        document.getElementById('workspace').innerHTML = '';
    }

    function validateAnswer() {
        let currentTarget = gameQuestions[currentIdx].target;

        if (totalSelectedVal === currentTarget) {
            soundClaps.play();
            score += 10;
            alert("Excellent! That's correct! 🌟");
            advanceNext();
        } else {
            attempts--;
            soundWrong.play();
            
            if (attempts > 0) {
                alert(`Not quite right. Let's check! You have ${attempts} attempt left. Try again!`);
                clearWorkspace();
            } else {
                alert(`Nice try! The correct target was ₹${currentTarget}. Let's move to the next marketplace stall.`);
                advanceNext();
            }
        }
    }

    function advanceNext() {
        currentIdx++;
        if (currentIdx >= 10) {
            showScreen('completion-screen');
            document.getElementById('final-score-text').innerText = `Great Job! Your Total Score: ${score}/100`;
        } else {
            loadQuestion();
        }
    }

    function restartGame() {
        startGame();
    }
</script>

</body>
</html>
