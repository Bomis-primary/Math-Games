<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Cargo Grouping Station!</title>
    <style>
        :root {
            --space-dark: #0B0F19;
            --alien-green: #22C55E;
            --neon-pink: #EC4899;
            --cosmic-blue: #3B82F6;
            --star-yellow: #EAB308;
            --card-bg: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, #020617 0%, #0F172A 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            color: #F8FAFC;
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen img { max-width: 60%; max-height: 50%; object-fit: contain; }

        .game-container {
            background: var(--card-bg);
            border: 6px solid #475569;
            border-radius: 36px;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-shadow: 0 20px 0px #0F172A;
            position: relative;
        }

        h1 {
            color: var(--star-yellow);
            font-size: 2rem;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 8px;
        }

        .progress-bar-container {
            background: #334155;
            border: 3px solid #64748B;
            height: 20px;
            border-radius: 15px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 7%;
            background: linear-gradient(90deg, #A855F7, #EC4899, #3B82F6);
            transition: width 0.4s ease;
        }

        .hud-stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            background: #0F172A;
            padding: 8px 20px;
            border-radius: 20px;
            border: 3px solid #475569;
            margin-bottom: 12px;
        }

        .viewport-panel {
            background: #020617;
            border: 5px solid #475569;
            border-radius: 24px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: inset 0 8px 0 rgba(0,0,0,0.5);
            background-image: radial-gradient(white 0.7px, transparent 0);
            background-size: 24px 24px;
            margin-bottom: 15px;
        }

        .mission-bubble {
            background: #1E293B;
            border: 3px solid var(--cosmic-blue);
            border-radius: 16px;
            padding: 10px 15px;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 15px;
        }

        .source-cargo-bin {
            background: rgba(30, 41, 59, 0.5);
            border: 3px dashed #475569;
            border-radius: 16px;
            padding: 10px;
            min-height: 90px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .cargo-item {
            font-size: 2.2rem;
            cursor: grab;
            display: inline-block;
            transition: transform 0.2s;
            animation: bobble 2s ease-in-out infinite alternate;
        }
        .cargo-item:active { cursor: grabbing; scale: 1.1; }

        @keyframes bobble {
            from { transform: translateY(0px); }
            to { transform: translateY(-4px); }
        }

        .distribution-zone {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }

        .drop-pod {
            background: #0F172A;
            border: 4px solid #334155;
            border-radius: 16px;
            min-width: 100px;
            flex-grow: 1;
            flex-basis: 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 5px;
            transition: all 0.2s;
            position: relative;
        }
        .drop-pod.drag-hover {
            border-color: var(--alien-green);
            background: rgba(34, 197, 94, 0.1);
        }

        .drop-pod-title {
            font-size: 0.8rem;
            color: #64748B;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .drop-pod-items {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            width: 100%;
        }

        .drop-pod-counter {
            position: absolute;
            bottom: -12px;
            background: var(--cosmic-blue);
            color: white;
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            border: 2px solid #000;
        }

        .workspace-calculator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 15px 0;
            font-size: 2rem;
            font-weight: bold;
        }

        .math-input-box {
            width: 100px;
            height: 60px;
            background: #0F172A;
            border: 4px solid #64748B;
            border-radius: 16px;
            text-align: center;
            color: #FFFFFF;
            font-size: 1.8rem;
            font-weight: bold;
            outline: none;
        }
        .quotient-active { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); }
        .remainder-active { border-color: var(--star-yellow); box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }

        .label-sub {
            font-size: 0.85rem;
            color: #94A3B8;
            text-align: center;
            margin-top: 4px;
            font-weight: bold;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            border: 4px solid #000;
            cursor: pointer;
            color: white;
            text-shadow: 1px 1px 0 #000;
            background: var(--alien-green);
            box-shadow: 0 5px 0 #166534;
        }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }

        .fun-popup {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            border: 6px solid var(--alien-green);
            animation: popUpArt 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }
        @keyframes popUpArt { from { scale: 0.7; opacity: 0; } to { scale: 1; opacity: 1; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img id="splashLogo" src="assets/logo.png" alt="Logo">
    </div>

    <audio id="audioRight" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audioWrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audioApplause" src="assets/claps.mp3" preload="auto"></audio>

    <div class="game-container">
        
        <div id="popupCelebration" class="fun-popup hidden">
            <div style="font-size: 5rem; animation: bobble 0.5s infinite alternate;" id="popEmoji">🛸</div>
            <h2 style="font-size: 2.2rem; color: var(--alien-green); margin: 10px 0;">Perfect Distribution!</h2>
            <p style="font-size: 1.2rem; color: #94A3B8; margin-bottom: 25px;">You successfully grouped the items perfectly!</p>
            <button class="btn-action" style="width:auto; padding: 10px 40px;" onclick="nextMissionLevel()">Next Mission Run 🚀</button>
        </div>

        <div id="arenaStage">
            <h1>Space Cargo Grouping! 🛸⚡</h1>
            
            <div class="progress-bar-container"><div id="progressFill"></div></div>
            
            <div class="hud-stats">
                <span id="txtMissionNum">Mission: 1 / 10</span>
                <span id="txtScore">Score: 0 ⭐</span>
            </div>

            <div class="viewport-panel">
                <div class="mission-bubble" id="txtInstruction">Loading space log charts...</div>
                <div class="source-cargo-bin" id="sourceCargoBin" ondragover="allowDrop(event)" ondrop="dropToSource(event)"></div>
                <div class="distribution-zone" id="distributionZone"></div>
            </div>

            <div class="workspace-calculator">
                <span id="valDividend">0</span>
                <span>÷</span>
                <span id="valDivisor">0</span>
                <span>=</span>
                <div>
                    <input type="number" class="math-input-box quotient-active" id="inputQuotient" readonly>
                    <div class="label-sub">Items per Pod</div>
                </div>
                <span id="labelRSign">R</span>
                <div>
                    <input type="number" class="math-input-box remainder-active" id="inputRemainder" readonly>
                    <div class="label-sub">Leftovers</div>
                </div>
            </div>

            <button class="btn-action" onclick="verifyCargoDivision()">Verify Groups ✔️</button>
        </div>

        <div id="endStudioPanel" class="hidden" style="text-align: center; padding: 20px;">
            <h2 style="font-size: 2.6rem; color: var(--star-yellow);">Master Fleet Commander! 🏆</h2>
            <div style="font-size: 5.5rem; margin: 15px 0;">🪐🛸⭐</div>
            <p id="endScoreValue" style="font-size: 1.8rem; font-weight: bold; margin-bottom: 30px;"></p>
            <button class="btn-action" style="width:auto; padding: 12px 35px;" onclick="replayCargoEngine()">Play Mission Again! 🎉</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.style.opacity = 0;
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 1500);
            startCargoEngine();
        };

        function playSound(type) {
            const el = document.getElementById(type === 'right' ? 'audioRight' : type === 'wrong' ? 'audioWrong' : 'audioApplause');
            if(el) { el.currentTime = 0; el.play().catch(()=>{}); }
        }

        let levelIndex = 0;
        let totalScore = 0;

        const missionBook = [
            { task: "Share 6 gems equally between 2 drop pods.", dividend: 6, divisor: 2, icon: "💎" },
            { task: "Sort 12 space-donuts equally into 3 pods.", dividend: 12, divisor: 3, icon: "🍩" },
            { task: "Distribute 10 biscuits equally among 2 pods.", dividend: 10, divisor: 2, icon: "🍪" },
            { task: "Place 15 fuel canisters equally into 4 pods. Notice the leftovers!", dividend: 15, divisor: 4, icon: "🔋" },
            { task: "Pack 14 lunar samples equally into 3 pods.", dividend: 14, divisor: 3, icon: "🧪" },
            { task: "Divide 18 power cells evenly across 5 pods.", dividend: 18, divisor: 5, icon: "⚡" },
            { task: "Share 8 mechanical items into 3 helper pods.", dividend: 8, divisor: 3, icon: "⚙️" },
            { task: "Distribute 16 star charts equally into 4 tracking pods.", dividend: 16, divisor: 4, icon: "⭐" },
            { task: "Sort 22 antenna components into 5 fleet pods.", dividend: 22, divisor: 5, icon: "📡" },
            { task: "Final Run: Group 25 cargo bolts evenly into 6 maintenance pods.", dividend: 25, divisor: 6, icon: "🔩" }
        ];

        function startCargoEngine() {
            levelIndex = 0; totalScore = 0;
            loadMissionLevel();
        }

        function loadMissionLevel() {
            const data = missionBook[levelIndex];

            document.getElementById('txtMissionNum').innerText = `Mission: ${levelIndex + 1} / ${missionBook.length}`;
            document.getElementById('txtScore').innerText = `Score: ${totalScore} ⭐`;
            document.getElementById('progressFill').style.width = `${((levelIndex + 1) / missionBook.length) * 100}%`;
            document.getElementById('txtInstruction').innerText = data.task;

            document.getElementById('valDividend').innerText = data.dividend;
            document.getElementById('valDivisor').innerText = data.divisor;

            const sourceBin = document.getElementById('sourceCargoBin');
            const zone = document.getElementById('distributionZone');
            sourceBin.innerHTML = '';
            zone.innerHTML = '';

            for (let i = 0; i < data.dividend; i++) {
                let span = document.createElement('span');
                span.className = "cargo-item";
                span.innerText = data.icon;
                span.id = `cargo-item-${i}`;
                span.draggable = true;
                
                span.ondragstart = (e) => { e.dataTransfer.setData("text/plain", span.id); };
                span.onclick = () => handleMobileTapGrouping(span);

                sourceBin.appendChild(span);
            }

            for (let j = 0; j < data.divisor; j++) {
                let pod = document.createElement('div');
                pod.className = "drop-pod";
                pod.id = `drop-pod-${j}`;
                pod.setAttribute("ondragover", "allowDrop(event)");
                pod.setAttribute("ondragleave", "leaveDrop(event)");
                pod.setAttribute("ondrop", "dropToPod(event)");
                pod.onclick = () => handleMobileTargetPod(pod);

                let title = document.createElement('div');
                title.className = "drop-pod-title";
                title.innerText = `Pod ${j + 1}`;

                let itemTray = document.createElement('div');
                itemTray.className = "drop-pod-items";
                itemTray.id = `pod-tray-${j}`;

                let counter = document.createElement('div');
                counter.className = "drop-pod-counter";
                counter.id = `pod-count-${j}`;
                counter.innerText = "0";

                pod.appendChild(title);
                pod.appendChild(itemTray);
                pod.appendChild(counter);
                zone.appendChild(pod);
            }

            calculateLiveGroupingValues();
        }

        function allowDrop(e) { e.preventDefault(); if(e.currentTarget.classList.contains('drop-pod')) e.currentTarget.classList.add('drag-hover'); }
        function leaveDrop(e) { e.currentTarget.classList.remove('drag-hover'); }

        function dropToPod(e) {
            e.preventDefault();
            const pod = e.currentTarget;
            pod.classList.remove('drag-hover');
            const id = e.dataTransfer.getData("text/plain");
            const element = document.getElementById(id);
            if(element) {
                pod.querySelector('.drop-pod-items').appendChild(element);
                calculateLiveGroupingValues();
            }
        }

        function dropToSource(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData("text/plain");
            const element = document.getElementById(id);
            if(element) {
                document.getElementById('sourceCargoBin').appendChild(element);
                calculateLiveGroupingValues();
            }
        }

        let selectedMobileItem = null;
        function handleMobileTapGrouping(itemEl) {
            if(selectedMobileItem) { selectedMobileItem.style.border = "none"; }
            selectedMobileItem = itemEl;
            itemEl.style.border = "3px solid var(--neon-pink)";
            itemEl.style.borderRadius = "8px";
        }

        function handleMobileTargetPod(podEl) {
            if(selectedMobileItem) {
                podEl.querySelector('.drop-pod-items').appendChild(selectedMobileItem);
                selectedMobileItem.style.border = "none";
                selectedMobileItem = null;
                calculateLiveGroupingValues();
            }
        }

        document.getElementById('sourceCargoBin').addEventListener('click', (e) => {
            if(e.target.id === 'sourceCargoBin' && selectedMobileItem) {
                document.getElementById('sourceCargoBin').appendChild(selectedMobileItem);
                selectedMobileItem.style.border = "none";
                selectedMobileItem = null;
                calculateLiveGroupingValues();
            }
        });

        function calculateLiveGroupingValues() {
            const data = missionBook[levelIndex];
            let counts = [];

            for (let j = 0; j < data.divisor; j++) {
                const tray = document.getElementById(`pod-tray-${j}`);
                const count = tray ? tray.children.length : 0;
                counts.push(count);
                
                const countBadge = document.getElementById(`pod-count-${j}`);
                if(countBadge) countBadge.innerText = count;
            }

            const uniqueCounts = [...new Set(counts)];
            const itemsPerPodInput = document.getElementById('inputQuotient');
            
            if(uniqueCounts.length === 1) {
                itemsPerPodInput.value = uniqueCounts[0];
            } else if(uniqueCounts.length === 2 && uniqueCounts.includes(0)) {
                itemsPerPodInput.value = counts.every(v => v === counts[0]) ? counts[0] : ""; 
            } else {
                itemsPerPodInput.value = ""; 
            }

            const leftovers = document.getElementById('sourceCargoBin').children.length;
            document.getElementById('inputRemainder').value = leftovers;
        }

        function verifyCargoDivision() {
            const data = missionBook[levelIndex];
            let counts = [];

            for (let j = 0; j < data.divisor; j++) {
                counts.push(document.getElementById(`pod-tray-${j}`).children.length);
            }

            const uniqueCounts = [...new Set(counts)];
            const leftovers = document.getElementById('sourceCargoBin').children.length;

            if(uniqueCounts.length > 1) {
                playSound('wrong');
                alert("Division requires EQUAL groupings! Make sure every pod contains the exact same number of items.");
                return;
            }

            const currentQuotientValue = uniqueCounts[0] || 0;

            if(currentQuotientValue === Math.floor(data.dividend / data.divisor) && leftovers === (data.dividend % data.divisor)) {
                totalScore++;
                playSound('right');
                showWinModal();
            } else {
                playSound('wrong');
                alert("Incorrect grouping partition. Keep moving objects until groups match up perfectly!");
            }
        }

        function showWinModal() {
            const popup = document.getElementById('popupCelebration');
            popup.classList.remove('hidden');
            playSound('applause');
        }

        function nextMissionLevel() {
            document.getElementById('popupCelebration').classList.add('hidden');
            levelIndex++;
            if(levelIndex < missionBook.length) {
                loadMissionLevel();
            } else {
                showFinalSummaryScreen();
            }
        }

        function showFinalSummaryScreen() {
            document.getElementById('arenaStage').classList.add('hidden');
            document.getElementById('endStudioPanel').classList.remove('hidden');
            document.getElementById('endScoreValue').innerText = `Final Grouping Score: ${totalScore} / ${missionBook.length} Levels Perfected!`;
            playSound('applause');
        }

        function replayCargoEngine() {
            document.getElementById('endStudioPanel').classList.add('hidden');
            document.getElementById('arenaStage').classList.remove('hidden');
            startCargoEngine();
        }
    </script>
</body>
</html>
