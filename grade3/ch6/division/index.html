<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Cargo Divider!</title>
    <style>
        :root {
            --space-dark: #0B0F19;
            --alien-green: #22C55E;
            --neon-pink: #EC4899;
            --cosmic-blue: #3B82F6;
            --star-yellow: #EAB308;
            --card-bg: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, #020617 0%, #0F172A 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            color: #F8FAFC;
        }

        /* Splash Loader Container */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen img { max-width: 60%; max-height: 50%; object-fit: contain; }

        .game-container {
            background: var(--card-bg);
            border: 6px solid #475569;
            border-radius: 36px;
            width: 100%;
            max-width: 720px;
            padding: 25px;
            box-shadow: 0 20px 0px #0F172A;
            position: relative;
        }

        h1 {
            color: var(--star-yellow);
            font-size: 2.2rem;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 10px;
        }

        /* Responsive Progress Station Bar */
        .progress-bar-container {
            background: #334155;
            border: 3px solid #64748B;
            height: 24px;
            border-radius: 15px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 7%;
            background: linear-gradient(90deg, #A855F7, #EC4899, #3B82F6);
            transition: width 0.4s ease;
        }

        .hud-stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            background: #0F172A;
            padding: 10px 20px;
            border-radius: 20px;
            border: 3px solid #475569;
            margin-bottom: 15px;
        }

        /* Main Viewport Panel Graphic System */
        .viewport-panel {
            background: #020617;
            border: 5px solid #475569;
            border-radius: 24px;
            min-height: 280px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow: hidden;
            box-shadow: inset 0 8px 0 rgba(0,0,0,0.5);
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 24px 24px;
        }

        .mission-bubble {
            background: #1E293B;
            border: 3px solid var(--cosmic-blue);
            border-radius: 16px;
            padding: 12px 18px;
            font-size: 1.15rem;
            text-align: center;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            line-height: 1.5;
        }

        /* Visual Counter Graphic Inventory Tray */
        .visual-display-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin: 10px 0;
            max-height: 110px;
            overflow-y: auto;
            padding: 5px;
        }
        .cargo-item {
            font-size: 2rem;
            animation: float-item 3s ease-in-out infinite alternate;
        }
        @keyframes float-item {
            from { transform: translateY(0px) rotate(0deg); }
            to { transform: translateY(-5px) rotate(5deg); }
        }

        /* Dynamic Mathematics Input Box Configurations */
        .workspace-calculator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            font-size: 2.3rem;
            font-weight: bold;
        }

        .math-input-box {
            width: 90px;
            height: 70px;
            background: #0F172A;
            border: 4px solid #64748B;
            border-radius: 16px;
            text-align: center;
            color: #FFFFFF;
            font-size: 2.2rem;
            font-weight: bold;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .math-input-box.focused-node {
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
        }
        .math-input-box.remainder-box.focused-node {
            border-color: var(--star-yellow);
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.6);
        }

        .label-sub {
            font-size: 0.9rem;
            color: #94A3B8;
            text-align: center;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Tactile Keypad System */
        .control-room {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: #0F172A;
            padding: 12px;
            border-radius: 20px;
            border: 3px solid #334155;
        }
        .num-btn {
            background: #334155;
            color: white;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1E293B;
            transition: background-color 0.1s;
        }
        .num-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1E293B;
        }

        .btn-action-row {
            display: flex;
            gap: 15px;
        }
        .btn-action {
            flex-grow: 1;
            padding: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            border: 4px solid #000;
            cursor: pointer;
            color: white;
            text-shadow: 1px 1px 0 #000;
        }
        .btn-reset { background: #64748B; box-shadow: 0 5px 0 #334155; }
        .btn-verify { background: var(--alien-green); box-shadow: 0 5px 0 #166534; }
        .btn-action:active { transform: translateY(4px); box-shadow: none; }

        /* Celebration Overlays Modal */
        .fun-popup {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            border: 6px solid var(--alien-green);
            animation: popUpArt 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }
        @keyframes popUpArt { from { scale: 0.7; opacity: 0; } to { scale: 1; opacity: 1; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img id="splashLogo" src="assets/innovine-logo.png" alt="Logo">
    </div>

    <audio id="audioRight" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audioWrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audioApplause" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div class="game-container">
        
        <div id="popupCelebration" class="fun-popup hidden">
            <div style="font-size: 5rem; animation: float-item 0.5s infinite alternate;" id="popEmoji">🛸</div>
            <h2 style="font-size: 2.2rem; color: var(--alien-green); margin: 10px 0;">Cargo Distributed!</h2>
            <p style="font-size: 1.2rem; color: #94A3B8; margin-bottom: 25px;" id="popMsg">Excellent mathematical sorting!</p>
            <button class="btn-action btn-verify" style="flex-grow:0; padding: 10px 40px;" onclick="nextMissionLevel()">Next Cargo Run 🚀</button>
        </div>

        <div id="arenaStage">
            <h1>Space Cargo Divider! 🛸⚡</h1>
            
            <div class="progress-bar-container"><div id="progressFill"></div></div>
            
            <div class="hud-stats">
                <span id="txtMissionNum">Mission: 1 / 14</span>
                <span id="txtScore">Score: 0 ⭐</span>
            </div>

            <div class="viewport-panel">
                <div class="mission-bubble" id="txtInstruction">Initializing space flight logs...</div>
                <div class="visual-display-area" id="cargoDisplayBox"></div>
            </div>

            <div class="workspace-calculator">
                <span id="valDividend">0</span>
                <span>÷</span>
                <span id="valDivisor">0</span>
                <span>=</span>
                <div>
                    <input type="number" class="math-input-box" id="inputQuotient" readonly placeholder="?">
                    <div class="label-sub">Quotient</div>
                </div>
                <span id="labelRSign" class="hidden">R</span>
                <div id="wrapperRemainder" class="hidden">
                    <input type="number" class="math-input-box remainder-box" id="inputRemainder" readonly placeholder="?">
                    <div class="label-sub">Remainder</div>
                </div>
            </div>

            <div class="control-room">
                <div class="numpad-grid">
                    <button class="num-btn" onclick="typeNumber(1)">1</button>
                    <button class="num-btn" onclick="typeNumber(2)">2</button>
                    <button class="num-btn" onclick="typeNumber(3)">3</button>
                    <button class="num-btn" onclick="typeNumber(4)">4</button>
                    <button class="num-btn" onclick="typeNumber(5)">5</button>
                    <button class="num-btn" onclick="typeNumber(6)">6</button>
                    <button class="num-btn" onclick="typeNumber(7)">7</button>
                    <button class="num-btn" onclick="typeNumber(8)">8</button>
                    <button class="num-btn" onclick="typeNumber(9)">9</button>
                    <button class="num-btn" onclick="typeNumber(0)">0</button>
                </div>

                <div class="btn-action-row">
                    <button class="btn-action btn-reset" onclick="clearActiveInputs()">Clear ❌</button>
                    <button class="btn-action btn-verify" onclick="verifyCargoDivision()">Verify Distribution ✔️</button>
                </div>
            </div>
        </div>

        <div id="endStudioPanel" class="hidden" style="text-align: center; padding: 20px;">
            <h2 style="font-size: 2.6rem; color: var(--star-yellow);">Fleet Fleet Commander! 🏆</h2>
            <div style="font-size: 5.5rem; margin: 15px 0;">🪐🛸⭐</div>
            <p id="endScoreValue" style="font-size: 1.8rem; font-weight: bold; margin-bottom: 30px;"></p>
            <button class="btn-action btn-verify" style="flex-grow:0;" onclick="replayCargoEngine()">Play Mission Again! 🎉</button>
        </div>

    </div>

    <script>
        window.onload = function() {
            const logo = document.getElementById('splashLogo');
            if(logo) { logo.onerror = function() { this.src = 'assets/logo.png'; }; }
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.style.opacity = 0;
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 1800);
            startCargoEngine();
        };

        function playSound(type) {
            const el = document.getElementById(type === 'right' ? 'audioRight' : type === 'wrong' ? 'audioWrong' : 'audioApplause');
            if(el) { el.currentTime = 0; el.play().catch(()=>{}); }
        }

        let levelIndex = 0;
        let totalScore = 0;
        let attemptTracking = false;
        let activeFocusedInput = 'quotient';

        // 14 Curriculum-aligned custom division questions
        const missionBook = [
            // === LEVEL 1: BASIC FACTS ===
            {
                task: "🚀 Basic Facts: Help Captain Leo share 18 glowing star-gems equally among 3 crew members. How many gems does each alien get?",
                dividend: 18, divisor: 3, correctQ: 6, correctR: 0, hasR: false, icon: "💎"
            },
            {
                task: "🪐 Solar Sorting: 32 floating space-donuts need to be placed into 4 delivery boxes equally. How many donuts go into each box?",
                dividend: 32, divisor: 4, correctQ: 8, correctR: 0, hasR: false, icon: "🍩"
            },
            {
                task: "👾 Alien Pets: 42 crunchy space-biscuits are distributed equally among 6 friendly space puppies. How many biscuits does each puppy receive?",
                dividend: 42, divisor: 6, correctQ: 7, correctR: 0, hasR: false, icon: "🍪"
            },
            {
                task: "🛰️ Satellite Repair: A mechanic has 56 shiny metallic bolts to attach equally onto 7 solar wings. How many bolts go onto each wing?",
                dividend: 56, divisor: 7, correctQ: 8, correctR: 0, hasR: false, icon: "🔩"
            },

            // === LEVEL 2: 2-DIGIT DIVIDENDS WITH LEFTOVERS (REMAINDERS) ===
            {
                task: "🛸 Space Cargo: Share 29 cosmic energy fuel blocks equally among 5 explorer rockets. What is each rocket's share and the remainder left over?",
                dividend: 29, divisor: 5, correctQ: 5, correctR: 4, hasR: true, icon: "🔋"
            },
            {
                task: "🌙 Moon Exploration: 45 sample jars are loaded equally onto 6 lunar rovers. How many jars does each rover take, and how many are left behind?",
                dividend: 45, divisor: 6, correctQ: 7, correctR: 3, hasR: true, icon: "🧪"
            },
            {
                task: "🍦 Asteroid Treats: 53 space-ice cream cones are handed out equally to 8 astro-scouts. Find the quotient and the remainder!",
                dividend: 53, divisor: 8, correctQ: 6, correctR: 5, hasR: true, icon: "🍦"
            },
            {
                task: "🛸 Galaxy Fleets: 67 high-tech control antennas are distributed equally among 9 fighter ships. Work out the quotient and the remainder!",
                dividend: 67, divisor: 9, correctQ: 7, correctR: 4, hasR: true, icon: "📡"
            },

            // === LEVEL 3: DIVIDING BY 10 ===
            {
                task: "⚡ Power Distribution: 90 high-voltage power batteries are shared equally across 10 main decks. How many batteries does each deck get?",
                dividend: 90, divisor: 10, correctQ: 9, correctR: 0, hasR: false, icon: "⚡"
            },
            {
                task: "🌌 Star Map Tracking: An astronomer maps out 130 distant stars evenly into 10 constellations. How many stars are in each constellation?",
                dividend: 130, divisor: 10, correctQ: 13, correctR: 0, hasR: false, icon: "⭐"
            },
            {
                task: "🤖 Robot Workforce: 270 mechanical helper gears are distributed evenly among 10 worker droids. How many gears does each droid get?",
                dividend: 270, divisor: 10, correctQ: 27, correctR: 0, hasR: false, icon: "⚙️"
            },

            // === LEVEL 4: 3 & 4-DIGIT CHALLENGES (LONG DIVISION) ===
            {
                task: "🏆 Commander Medals: Divide 148 hyperdrive flight medals equally among 6 fleet commanders. Calculate the final quotient and remainder!",
                dividend: 148, divisor: 6, correctQ: 24, correctR: 4, hasR: true, icon: "🏅"
            },
            {
                task: "💎 Cosmic Crystals: 645 raw space diamond shards are sorted evenly into 4 treasure vaults. Find how many shards fill each vault and the remaining leftovers!",
                dividend: 645, divisor: 4, correctQ: 161, correctR: 1, hasR: true, icon: "🔮"
            },
            {
                task: "🛰️ Quantum Codes: A supercomputer processes 1235 encrypted data signals evenly through 3 receiver antennas. Work out the quotient and remainder!",
                dividend: 1235, divisor: 3, correctQ: 411, correctR: 2, hasR: true, icon: "📟"
            }
        ];

        function startCargoEngine() {
            levelIndex = 0; totalScore = 0;
            loadMissionLevel();
        }

        function loadMissionLevel() {
            const data = missionBook[levelIndex];
            attemptTracking = false;
            activeFocusedInput = 'quotient';

            document.getElementById('txtMissionNum').innerText = `Mission: ${levelIndex + 1} / ${missionBook.length}`;
            document.getElementById('txtScore').innerText = `Score: ${totalScore} ⭐`;
            document.getElementById('progressFill').style.width = `${((levelIndex + 1) / missionBook.length) * 100}%`;
            document.getElementById('txtInstruction').innerText = data.task;

            document.getElementById('valDividend').innerText = data.dividend;
            document.getElementById('valDivisor').innerText = data.divisor;

            const qBox = document.getElementById('inputQuotient');
            const rBox = document.getElementById('inputRemainder');
            qBox.value = '';
            rBox.value = '';
            
            qBox.className = 'math-input-box focused-node';
            rBox.className = 'math-input-box remainder-box';

            if(data.hasR) {
                document.getElementById('labelRSign').classList.remove('hidden');
                document.getElementById('wrapperRemainder').classList.remove('hidden');
            } else {
                document.getElementById('labelRSign').classList.add('hidden');
                document.getElementById('wrapperRemainder').classList.add('hidden');
            }

            const cargoDisplay = document.getElementById('cargoDisplayBox');
            cargoDisplay.innerHTML = '';
            
            let visualCount = Math.min(data.dividend, 26);
            for(let i=0; i<visualCount; i++) {
                let span = document.createElement('span');
                span.className = "cargo-item";
                span.innerText = data.icon;
                cargoDisplay.appendChild(span);
            }
            if(data.dividend > 26) {
                let infoText = document.createElement('span');
                infoText.style = "font-size:0.95rem; color:#A855F7; align-self:center; font-weight:bold; margin-left:5px;";
                infoText.innerText = `(+${data.dividend - 26} more items)`;
                cargoDisplay.appendChild(infoText);
            }

            qBox.onclick = () => {
                activeFocusedInput = 'quotient';
                qBox.classList.add('focused-node');
                rBox.classList.remove('focused-node');
            };
            rBox.onclick = () => {
                activeFocusedInput = 'remainder';
                rBox.classList.add('focused-node');
                qBox.classList.remove('focused-node');
            };
        }

        function typeNumber(num) {
            const box = activeFocusedInput === 'quotient' ? document.getElementById('inputQuotient') : document.getElementById('inputRemainder');
            if(box.value.length < 3) {
                box.value += num;
            }
        }

        function clearActiveInputs() {
            const box = activeFocusedInput === 'quotient' ? document.getElementById('inputQuotient') : document.getElementById('inputRemainder');
            box.value = '';
        }

        function verifyCargoDivision() {
            const data = missionBook[levelIndex];
            const userQ = parseInt(document.getElementById('inputQuotient').value) || 0;
            const userR = data.hasR ? (parseInt(document.getElementById('inputRemainder').value) || 0) : 0;

            if(userQ === data.correctQ && userR === data.correctR) {
                totalScore++;
                playSound('right');
                showWinModal();
            } else {
                if(!attemptTracking) {
                    attemptTracking = true;
                    playSound('wrong');
                    alert("Cargo values do not compute! Recount groups or try dividing again.");
                } else {
                    playSound('wrong');
                    document.getElementById('inputQuotient').value = data.correctQ;
                    if(data.hasR) document.getElementById('inputRemainder').value = data.correctR;
                    alert(`Distribution solved: ${data.dividend} ÷ ${data.divisor} = ${data.correctQ} R ${data.correctR}`);
                    setTimeout(nextMissionLevel, 3200);
                }
            }
        }

        function showWinModal() {
            const popup = document.getElementById('popupCelebration');
            const emojis = ["🚀💎", "🍩🪐", "🍪👾", "🛰️🔩", "🔋🛸", "🧪🌙", "🍦☄️", "📡🌌", "⚡🔌", "⭐🗺️", "⚙️🤖", "🏅🏆", "🔮👑", "📟📡"];
            document.getElementById('popEmoji').innerText = emojis[levelIndex] || "🛸";
            popup.classList.remove('hidden');
            playSound('applause');
        }

        function nextMissionLevel() {
            document.getElementById('popupCelebration').classList.add('hidden');
            levelIndex++;
            if(levelIndex < missionBook.length) {
                loadMissionLevel();
            } else {
                showFinalSummaryScreen();
            }
        }

        function showFinalSummaryScreen() {
            document.getElementById('arenaStage').classList.add('hidden');
            document.getElementById('endStudioPanel').classList.remove('hidden');
            document.getElementById('endScoreValue').innerText = `Final Score: ${totalScore} / ${missionBook.length} Space Missions Completed!`;
            playSound('applause');
        }

        function replayCargoEngine() {
            document.getElementById('endStudioPanel').classList.add('hidden');
            document.getElementById('arenaStage').classList.remove('hidden');
            startCargoEngine();
        }
    </script>
</body>
</html>
