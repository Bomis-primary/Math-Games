<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Multiplication: The Great Pet Festival Parade</title>
    <style>
        :root {
            --primary-navy: #1E293B;
            --park-green: #10B981;
            --sky-blue: #0EA5E9;
            --sun-yellow: #F59E0B;
            --coral-pink: #F43F5E;
            --soft-purple: #8B5CF6;
            --text-dark: #334155;
            --premium-red: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            user-select: none;
        }

        body {
            /* STYLIZED IMAGERY: Playful festival environment using high-performance CSS gradients */
            background: 
                radial-gradient(circle at 50% -20%, rgba(255,255,255,0.25) 0%, transparent 55%),
                linear-gradient(to bottom, #0ea5e9 0%, #38bdf8 38%, #fef08a 38%, #fef08a 41%, #4ade80 41%, #22c55e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* Floating cartoon clouds backdrop decoration */
        body::before {
            content: "☁️  ☁️  🎈  ☁️  🎈  ☁️";
            position: absolute;
            top: 4%;
            font-size: 2.2rem;
            opacity: 0.3;
            letter-spacing: 140px;
            animation: floatClouds 70s linear infinite;
            white-space: nowrap;
            width: 100%;
            pointer-events: none;
        }

        @keyframes floatClouds {
            0% { transform: translateX(-20%); }
            100% { transform: translateX(100%); }
        }

        /* --- 5-SECOND SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-out;
        }
        
        .splash-logo-image {
            max-width: 280px;
            max-height: 150px;
            object-fit: contain;
            margin-bottom: 35px;
        }

        .timer-loader { 
            width: 140px; 
            height: 8px; 
            background: #E2E8F0; 
            border-radius: 4px; 
            overflow: hidden; 
        }
        
        .timer-progress { 
            width: 0%; 
            height: 100%; 
            background: var(--sun-yellow); 
            animation: fillSplashBar 5s linear forwards; 
        }
        
        @keyframes fillSplashBar { 100% { width: 100%; } }

        /* --- STAGE STRUCTURE CONTAINER --- */
        #game-container {
            width: 100%;
            max-width: 950px;
            height: 720px;
            background: rgba(255, 255, 255, 0.93); /* Semi-transparent tint to harmonize with the colorful background */
            backdrop-filter: blur(6px);
            border-radius: 32px;
            border: 8px solid var(--primary-navy);
            box-shadow: 0 30px 60px -15px rgba(15, 23, 42, 0.65);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- INTERACTIVE OVERLAYS --- */
        .overlay-card {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            z-index: 100;
        }
        .story-capsule {
