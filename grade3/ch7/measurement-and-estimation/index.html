<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bob's Bridge Builder Game!</title>
    <style>
        :root {
            --bright-yellow: #ffca28;
            --safety-orange: #ff9800;
            --sky-blue: #ade4ff;
            --brick-red: #d32f2f;
            --grass-green: #66bb6a;
            --mud-brown: #8d6e63;
            --dark-blue: #1565c0;
            --cozy-white: #fffdf7;
            --text-color: #263238;
            --pop-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Ubuntu', sans-serif;
        }

        body {
            background-color: #e3f2fd;
            background-image: radial-gradient(var(--bright-yellow) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            user-select: none;
        }

        /* --- SPLASH/LOADING SCREEN WITH LOGO --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #29b6f6, var(--dark-blue));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .loading-box {
            background: white; padding: 35px; border-radius: 30px;
            box-shadow: var(--pop-shadow); text-align: center; width: 90%; max-width: 420px;
            border: 5px solid var(--bright-yellow);
            display: flex; flex-direction: column; align-items: center;
        }
        .innovine-logo-container {
            margin-bottom: 25px;
            background: #ffffff; /* Perfectly blank white background */
            padding: 15px;
            border-radius: 15px;
            border: none; /* No subheadings or decorative borders */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            width: 100%;
        }
        .innovine-logo-img {
            max-height: 65px;
            max-width: 100%;
            object-fit: contain;
        }
        .loading-bar { width: 100%; height: 15px; background: #e0e0e0; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .loading-fill { width: 100%; height: 100%; background: var(--safety-orange); transform: translateX(-100%); animation: load 1.5s forwards ease-in-out; }
        @keyframes load { 100% { transform: translateX(0); } }

        /* --- GAME BOX --- */
        .game-box {
            width: 100%;
            max-width: 820px;
            background: var(--cozy-white);
            border-radius: 35px;
            box-shadow: var(--pop-shadow);
            border: 6px solid var(--bright-yellow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 640px;
            position: relative;
        }

        .game-page {
            display: none; flex-direction: column; flex: 1; padding: 30px; opacity: 0; transition: opacity 0.3s ease;
        }
        .game-page.active { display: flex; opacity: 1; }

        /* --- STARTING SCREEN --- */
        #page-welcome { text-align: center; justify-content: center; align-items: center; }
        .jumping-crew { font-size: 5.5rem; margin-bottom: 10px; animation: jump 1.5s infinite alternate ease-in-out; }
        @keyframes jump { 0% { transform: translateY(0); } 100% { transform: translateY(-15px); } }

        .story-scroll {
            background: #fff9c4; border: 4px dashed var(--safety-orange); padding: 22px;
            border-radius: 25px; text-align: left; max-width: 650px; margin: 20px 0;
            font-size: 1.25rem; line-height: 1.6; box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .story-scroll h2 { color: var(--dark-blue); text-align: center; margin-bottom: 12px; font-size: 1.8rem; }

        .yellow-button {
            background: linear-gradient(to bottom, #ffeb3b, #fbc02d);
            border: none; color: #5d4037; font-size: 1.5rem; font-weight: bold;
            padding: 15px 45px; border-radius: 50px; cursor: pointer;
            box-shadow: 0 6px 0 #f57f17, 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.1s ease; border: 2px solid #fff;
        }
        .yellow-button:hover { transform: scale(1.03); }
        .yellow-button:active { transform: translateY(4px); box-shadow: 0 2px 0 #f57f17, 0 4px 6px rgba(0,0,0,0.1); }

        /* --- CANYON DRAWING ENGINE --- */
        .canyon-view {
            background: var(--sky-blue);
            border: 4px solid #455a64; border-radius: 25px;
            height: 150px; position: relative; margin-bottom: 25px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }
        .rocky-wall { width: 75px; height: 100%; background: var(--mud-brown); position: absolute; bottom: 0; }
        .left-wall { left: 0; border-radius: 20px 0 0 20px; border-right: 4px solid #4e342e; }
        .right-wall { right: 0; border-radius: 0 20px 20px 0; border-left: 4px solid #4e342e; }
        
        .bridge-track {
            position: absolute; bottom: 35px; left: 75px; right: 75px; height: 32px;
            display: flex; gap: 4px; padding: 0 2px; justify-content: space-between; align-items: center;
        }
        .bridge-block {
            flex: 1; height: 20px; background: transparent; 
            border: 2px dashed #b0bec5; border-radius: 4px; transition: all 0.4s ease;
        }
        .bridge-block.fixed {
            background: linear-gradient(to bottom, var(--brick-red), #b71c1c);
            border: 2px solid #3e2723; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 3px 5px rgba(0,0,0,0.15);
            animation: slamBlock 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }
        @keyframes slamBlock { 0% { transform: scale(1.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* --- KIDS HEADS-UP DISPLAY --- */
        .kids-hud {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center;
            font-size: 1.25rem; font-weight: bold; padding-bottom: 12px;
            margin-bottom: 15px; border-bottom: 4px dotted var(--bright-yellow);
        }
        .phase-tag { background: var(--dark-blue); color: white; padding: 4px 18px; border-radius: 15px; font-size: 0.95rem; text-transform: uppercase; }

        /* --- QUESTION AREA --- */
        .bubble-question {
            background: #f1f8e9; border: 3px solid var(--grass-green);
            padding: 20px; border-radius: 20px; margin-bottom: 20px;
            font-size: 1.3rem; line-height: 1.5; font-weight: bold; text-align: center;
        }

        /* --- CONTROLS WORKSPACE --- */
        .workspace { display: flex; justify-content: center; align-items: center; min-height: 120px; }
        .options-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; width: 100%; }
        
        .option-button {
            background: white; border: 3px solid #cfd8dc; border-radius: 20px; padding: 15px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; text-align: left;
            transition: all 0.2s ease; display: flex; align-items: center; box-shadow: 0 4px 0 #b0bec5;
        }
        .option-button:hover { border-color: var(--safety-orange); background: #fffde7; }
        .option-button:active { transform: translateY(3px); box-shadow: none; }
        .option
