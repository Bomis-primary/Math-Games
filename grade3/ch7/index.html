<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyburst Arithmetic: Balloon Blast!</title>
    <style>
        :root {
            --sky-blue: #a0e0ff;
            --sunny-yellow: #ffdf00;
            --balloon-red: #ff4a4a;
            --balloon-blue: #3a86ff;
            --grass-green: #4ade80;
            --cloud-white: #ffffff;
            --text-dark: #2c3e50;
            --pop-orange: #ff9f43;
            --glow-shadow: 0 8px 20px rgba(58, 134, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Trebuchet MS', sans-serif;
        }

        body {
            background-color: var(--sky-blue);
            background-image: 
                radial-gradient(circle at 10% 10%, var(--sunny-yellow) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255,255,255,0.6) 0%, transparent 25%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
            user-select: none;
        }

        /* --- SPLASH SCREEN --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #bfeeff, var(--sky-blue));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.6s ease;
        }
        .loading-box {
            background: rgba(255, 255, 255, 0.9); padding: 35px; border-radius: 30px;
            box-shadow: var(--glow-shadow); text-align: center; width: 90%; max-width: 420px;
            border: 3px solid #fff; display: flex; flex-direction: column; align-items: center;
        }
        .innovine-logo-container {
            margin-bottom: 25px; background: #ffffff; padding: 15px; border-radius: 15px;
            display: inline-flex; align-items: center; justify-content: center; min-height: 70px; width: 100%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .innovine-logo-img { max-height: 65px; max-width: 100%; object-fit: contain; }
        .loading-bar { width: 100%; height: 12px; background: #e0f4ff; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .loading-fill { width: 100%; height: 100%; background: var(--balloon-blue); transform: translateX(-100%); animation: load 5s linear forwards; }
        @keyframes load { 100% { transform: translateX(0); } }

        /* --- CONTAINER --- */
        .game-box {
            width: 100%;
            max-width: 850px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(0, 50, 100, 0.15);
            border: 6px solid var(--cloud-white);
            min-height: 660px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .game-page { display: none; flex-direction: column; flex: 1; padding: 25px; opacity: 0; transition: opacity 0.3s ease; }
        .game-page.active { display: flex; opacity: 1; }

        /* --- TITLE SCREEN --- */
        #page-welcome { text-align: center; justify-content: center; align-items: center; }
        .balloon-animation { font-size: 5rem; animation: floatUp 3s infinite alternate ease-in-out; margin-bottom: 15px; }
        @keyframes floatUp { 0% { transform: translateY(10px) scale(1); } 100% { transform: translateY(-15px) scale(1.05); } }

        .sunny-button {
            background: linear-gradient(135deg, #ff9f43, #ff6b6b);
            border: none; color: #fff; font-size: 1.4rem; font-weight: bold; text-transform: uppercase;
            padding: 15px 45px; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .sunny-button:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6); }

        /* --- GAMEPLAY ZONE --- */
        .hud-top {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--cloud-white); padding: 15px 25px; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .target-alert-badge {
            background: linear-gradient(135deg, var(--balloon-blue), #1a66ff);
            padding: 10px 25px; border-radius: 20px; font-size: 1.4rem; font-weight: bold;
            color: white; box-shadow: 0 4px 15px rgba(58, 134, 255, 0.3); text-align: center;
        }

        /* SUNNY SKY PLAYGROUND (THE BALLOON ZONE) */
        .sky-play-bay {
            flex: 1; background: linear-gradient(to bottom, #e0f6ff, #ffffff); border: 3px dashed #bfeeff; border-radius: 25px;
            margin: 20px 0; position: relative; overflow: hidden; min-height: 300px;
        }

        /* INTERACTIVE FLOATING BALLOONS */
        .floating-balloon {
            position: absolute; width: 85px; height: 105px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset -8px -8px 15px rgba(0,0,0,0.1), 0 10px 15px rgba(0,0,0,0.08); 
            transition: transform 0.1s, opacity 0.15s;
            animation: sway 3s infinite alternate ease-in-out;
        }
        /* Balloon Knot/String Helper */
        .floating-balloon::after {
            content: ""; position: absolute; bottom: -6px; width: 0; height: 0;
            border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-bottom: 8px solid currentColor; filter: brightness(0.9);
        }
        
        .floating-balloon .metric-tag { font-weight: bold; color: #fff; font-size: 1.2rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); z-index: 2; }

        @keyframes sway {
            0% { transform: translateX(0) rotate(-4deg); }
            100% { transform: translateX(15px) rotate(4deg); }
        }

        /* BASKET PROGRESS GAUGES */
        .dashboard-gauges { display: flex; gap: 20px; justify-content: center; align-items: center; padding: 10px; }
        .basket-gauge-container { width: 60%; background: #e0eaf0; height: 38px; border-radius: 50px; border: 3px solid var(--cloud-white); overflow: hidden; position: relative; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        .basket-gauge-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #4ade80, #2ecc71); transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .basket-gauge-text { position: absolute; width: 100%; text-align: center; top: 6px; font-weight: bold; font-size: 1.15rem; color: var(--text-dark); }

        .control-btns-row { display: flex; gap: 15px; justify-content: center; margin-top: 5px; }
        .clear-btn { background: #fee2e2; border: 2px solid #ef4444; color: #ef4444; padding: 8px 25px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .clear-btn:hover { background: #ef4444; color: #fff; }

        /* RECAP CONFIGS */
        #page-end { text-align: center; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <audio id="sound-yes" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="sound-no" src="assets/wrong.mp3" preload="auto"></audio>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <div class="loading-box">
            <div class="innovine-logo-container">
                <img class="innovine-logo-img" src="assets/logo.png" alt="Innovine Logo">
            </div>
            <div class="loading-bar"><div class="loading-fill"></div></div>
        </div>
    </div>

    <div class="game-box">
        
        <!-- TITLE WELCOME -->
        <div class="game-page active" id="page-welcome">
            <div class="balloon-animation">🎈☀️🎈</div>
            <h1 style="font-size: 2.6rem; color: var(--text-dark); font-weight: 800;">Skyburst Arithmetic</h1>
            <h3 style="color: var(--balloon-blue); letter-spacing: 1.5px; margin-bottom: 20px; font-weight: 700;">BALLOON BLAST!</h3>
            <p style="max-width: 520px; margin-bottom: 35px; font-size: 1.25rem; line-height: 1.6; color: #576574;">
                Look at the sun-badge to find your target math total! Pop the floating balloons by clicking them to add their numbers into your collection basket!
            </p>
            <button class="sunny-button" onclick="launchGameCore()">Let's Pop! 🎈</button>
        </div>

        <!-- ACTIVE GAMEPLAY PAGE -->
        <div class="game-page" id="page-play">
            <div class="hud-top">
                <div style="font-size: 1.25rem; font-weight: bold; color: var(--text-dark);">Round: <span id="hud-level-text">1 / 5</span></div>
                <div class="target-alert-badge" id="hud-target-display">Target: Loading...</div>
                <div style="font-size: 1.25rem; font-weight: bold; color: #ff9f43;">Score: <span id="hud-score-val">0</span> ⭐</div>
            </div>

            <!-- INTERACTIVE BALLOON SKY ENVIRONMENT -->
            <div class="sky-play-bay" id="sky-balloon-playground"></div>

            <!-- PROGRESS TRACKING DYNAMIC SYSTEM -->
            <div class="dashboard-gauges">
                <div style="font-weight: bold; font-size: 1.2rem; color: var(--text-dark);">Your Basket Total:</div>
                <div class="basket-gauge-container">
                    <div class="basket-gauge-fill" id="gauge-fill-bar"></div>
                    <div class="basket-gauge-text" id="gauge-readout-label">0 / 0</div>
                </div>
            </div>

            <div class="control-btns-row">
                <button class="clear-btn" onclick="dumpCurrentHold()">Empty Basket 🗑️</button>
            </div>
        </div>

        <!-- RECAP SCREEN -->
        <div class="game-page" id="page-end">
            <div style="font-size: 5.5rem; animation: floatUp 2s infinite alternate ease-in-out;">🏆🎈🎉</div>
            <h1 style="color: var(--grass-green); font-size: 2.7rem; margin: 15px 0; font-weight: 800;">Phenomenal Job!</h1>
            <p style="font-size: 1.35rem; margin-bottom: 30px; color: #576574;" id="end-telemetry-msg"></p>
            <button class="sunny-button" onclick="restartWholeGame()">Play Again 🔄</button>
        </div>

    </div>

    <script>
        let currentLevel = 0;
        let score = 0;
        let currentHoldValue = 0;
        let currentLevelTarget = 0;
        let currentUnitType = "";

        const gameLevelsBlueprints = [
            {
                target: 80,
                unit: "Liters",
                display: "Pop exactly 80 Liters of water!",
                optionsPool: [10, 20, 35, 45, 50, 15]
            },
            {
                target: 500,
                unit: "mL",
                display: "Pop exactly 500 mL of juice!",
                optionsPool: [100, 200, 300, 50, 150]
            },
            {
                target: 15,
                unit: "kg",
                display: "Gather exactly 15 kg of apples!",
                optionsPool: [2, 3, 5, 7, 10, 1]
            },
            {
                target: 600,
                unit: "grams",
                display: "Collect exactly 600g of flour!",
                optionsPool: [100, 250, 350, 50, 200]
            },
            {
                target: 12,
                unit: "meters",
                display: "Reach exactly 12m of kite string!",
                optionsPool: [2, 4, 6, 3, 5, 1]
            }
        ];

        const balloonColors = ['#ff4a4a', '#3a86ff', '#ff9f43', '#a855f7', '#06b6d4', '#ec4899'];

        function launchGameCore() {
            document.getElementById('page-welcome').classList.remove('active');
            document.getElementById('page-play').classList.add('active');
            currentLevel = 0;
            score = 0;
            initiateSkyRound();
        }

        function initiateSkyRound() {
            if(currentLevel >= gameLevelsBlueprints.length) {
                gameOverShowdown();
                return;
            }

            currentHoldValue = 0;
            let currentData = gameLevelsBlueprints[currentLevel];
            currentLevelTarget = currentData.target;
            currentUnitType = currentData.unit;

            document.getElementById('hud-level-text').innerText = `${currentLevel + 1} / ${gameLevelsBlueprints.length}`;
            document.getElementById('hud-score-val').innerText = score;
            document.getElementById('hud-target-display').innerText = currentData.display;

            updateVisualHoldGauge();
            populateFloatingBalloons(currentData);
        }

        function populateFloatingBalloons(levelData) {
            const playground = document.getElementById('sky-balloon-playground');
            playground.innerHTML = "";

            levelData.optionsPool.forEach((val, idx) => {
                let balloon = document.createElement('div');
                balloon.className = "floating-balloon";
                balloon.innerHTML = `<span class="metric-tag">${val}</span>`;
                
                // Distribute bright theme colors dynamically
                let randomColor = balloonColors[idx % balloonColors.length];
                balloon.style.backgroundColor = randomColor;
                balloon.style.color = randomColor; // Used for knot currentColor matching

                // Set random positions around the sunny sky playground box boundaries safely
                let randomX = Math.floor(Math.random() * 80); 
                let randomY = Math.floor(Math.random() * 55);
                
                balloon.style.left = `${randomX + 5}%`;
                balloon.style.top = `${randomY + 5}%`;
                balloon.style.animationDelay = `${idx * 0.25}s`;

                balloon.onclick = () => {
                    popBalloonAction(val, balloon);
                };

                playground.appendChild(balloon);
            });
        }

        function popBalloonAction(amount, element) {
            currentHoldValue += amount;
            updateVisualHoldGauge();

            // Direct visual animation effect for bursting balloons
            element.style.transform = "scale(1.4)";
            element.style.opacity = "0";
            element.style.pointerEvents = "none";
            setTimeout(() => { element.remove(); }, 120);

            // Instant addition targets accuracy checkers
            if (currentHoldValue === currentLevelTarget) {
                score += 100;
                document.getElementById('sound-yes').play().catch(()=>{});
                currentLevel++;
                setTimeout(initiateSkyRound, 700);
            } else if (currentHoldValue > currentLevelTarget) {
                document.getElementById('sound-no').play().catch(()=>{});
                alert(`Oops! Your basket overflowed past ${currentLevelTarget} ${currentUnitType}. Let's reset this round!`);
                dumpCurrentHold();
            }
        }

        function dumpCurrentHold() {
            currentHoldValue = 0;
            updateVisualHoldGauge();
            populateFloatingBalloons(gameLevelsBlueprints[currentLevel]);
        }

        function updateVisualHoldGauge() {
            let pct = (currentHoldValue / currentLevelTarget) * 100;
            if(pct > 100) pct = 100;
            document.getElementById('gauge-fill-bar').style.width = `${pct}%`;
            document.getElementById('gauge-readout-label').innerText = `${currentHoldValue} / ${currentLevelTarget} ${currentUnitType}`;
        }

        function gameOverShowdown() {
            document.getElementById('page-play').classList.remove('active');
            document.getElementById('page-end').classList.add('active');
            document.getElementById('end-telemetry-msg').innerText = `Sensors clean! You achieved a fantastic score of ${score} metric points! Every balloon round was perfectly calculated!`;
        }

        function restartWholeGame() {
            document.getElementById('page-end').classList.remove('active');
            document.getElementById('page-welcome').classList.add('active');
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                let splash = document.getElementById('loading-screen');
                if(splash) {
                    splash.style.opacity = 0;
                    setTimeout(() => splash.remove(), 600);
                }
            }, 5000);
        });
    </script>
</body>
</html>
