<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Maths: Measurement & Estimation Interactive</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #2b5c8f;
            --secondary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --background: #f4f7f6;
            --surface: #ffffff;
            --text: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Splash Screen - Logo Only */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash-screen img {
            max-width: 220px;
            height: auto;
            object-fit: contain;
        }

        /* Screens Visibility */
        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
        }

        p.description {
            text-align: center;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* HUD elements */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #edf2f7;
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .timer-box {
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Question Frame */
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Options Stack */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f7fafc;
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--success) !important;
            color: #2e7d32;
        }

        .option-btn.wrong {
            background-color: #ffebee !important;
            border-color: var(--danger) !important;
            color: #c62828;
        }

        /* Feedback Panels */
        .feedback-box {
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
            font-weight: 500;
            display: none;
            line-height: 1.4;
        }

        .feedback-box.hint {
            background-color: #fffde7;
            border-left: 5px solid var(--warning);
            color: #f57f17;
        }

        .feedback-box.explanation {
            background-color: #e3f2fd;
            border-left: 5px solid var(--secondary);
            color: #1565c0;
        }

        /* Primary Controls */
        .action-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(43,92,143,0.2);
        }

        .action-btn:hover {
            background: #224a73;
        }

        /* Score screen metrics */
        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #edf2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px auto;
            color: var(--primary);
            border: 4px solid var(--secondary);
        }

        /* Mobile specific spacing */
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .question-text { font-size: 1.05rem; }
            .option-btn { padding: 14px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen with Only the Logo -->
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo" onerror="this.style.display='none';">
    </div>

    <audio id="audio-correct" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="container">
        
        <div id="welcome-screen" class="screen active">
            <h1>Measurement & Estimation</h1>
            <p class="description">Test your real-world understanding of tool selection, weight, capacity, length estimation, and problem-solving through this interactive math challenge!</p>
            <button class="action-btn" onclick="startInteractive()">Start Challenge</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="hud">
                <div id="progress-text">Question: 1/12</div>
                <div id="score-text">Score: 0</div>
                <div class="timer-box">⏱️ <span id="timer-counter">60</span>s</div>
            </div>

            <div id="question-box">
                <div class="question-text" id="target-question">Loading text question...</div>
                <div class="options-container" id="target-options"></div>
            </div>

            <div id="hint-feedback" class="feedback-box hint"></div>
            <div id="explain-feedback" class="feedback-box explanation"></div>

            <button id="next-btn" class="action-btn" style="display: none;" onclick="advanceQuestion()">Next Question</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>Challenge Complete!</h2>
            <div class="score-circle" id="final-score-value">0/12</div>
            <p class="description" id="final-status-msg">Loading score analysis...</p>
            <button class="action-btn" onclick="resetInteractive()">Try Again</button>
        </div>

    </div>

    <script>
        const questionBank = [
            {
                type: "Scenario-Based MCQ",
                question: "Kabir wants to measure how long his school notebook is. Which tool is the most appropriate for him to use?",
                options: [
                    "A long measuring tape used for houses",
                    "A standard 15-centimeter plastic pocket ruler",
                    "A kitchen measuring cup",
                    "A weighing balance scale"
                ],
                answer: 1,
                hint: "Think about which small straight tool easily fits in your pencil box to measure paper.",
                explanation: "A standard 15-cm pocket ruler is best because a notebook is small, flat, and its length can be easily measured in centimeters."
            },
            {
                type: "Scenario-Based MCQ",
                question: "Ananya needs to measure the exact amount of water required to bake a batch of vanilla cupcakes. What unit should she look for?",
                options: [
                    "Kilograms (kg)",
                    "Meters (m)",
                    "Milliliters (mL)",
                    "Kilometers (km)"
                ],
                answer: 2,
                hint: "Water is a fluid item found in small culinary recipes. Look for liquid capacity units.",
                explanation: "Milliliters (mL) are explicitly used to track accurate small values of liquid capacity like water or milk in cooking."
            },
            {
                type: "Scenario-Based MCQ",
                question: "Aarav has a long piece of decorative ribbon that measures 3 meters. He needs to rewrite its length in centimeters to cut it accurately. What is the value?",
                options: [
                    "30 centimeters",
                    "300 centimeters",
                    "3,000 centimeters",
                    "3 centimeters"
                ],
                answer: 1,
                hint: "Remember that every 1 single meter (1 m) contains exactly 100 centimeters (100 cm).",
                explanation: "Since 1 m = 100 cm, multiplying 3 meters by 100 gives 300 cm."
            },
            {
                type: "Scenario-Based MCQ",
                question: "A delivery driver drives a vehicle exactly 4 kilometers from the distribution hub straight to Rohan's building. How many meters did the driver travel?",
                options: [
                    "40 meters",
                    "400 meters",
                    "4,000 meters",
                    "40,000 meters"
                ],
                answer: 2,
                hint: "Think about basic long-distance conversions: 1 kilometer is equivalent to 1,000 meters.",
                explanation: "Since 1 km = 1,000 m, 4 kilometers translates directly to 4,000 meters."
            },
            {
                type: "Data-Based MCQ",
                question: "Sania checks four items on a kitchen storage shelf. Which item's real-world weight is most likely close to 1 kilogram?",
                options: [
                    "A tiny single metal paperclip",
                    "A large sack containing a heavy family pack of rice",
                    "A standard full packet of table salt",
                    "A massive wooden dining room table"
                ],
                answer: 2,
                hint: "1 kilogram isn't ultra-light like paper, but it can easily be picked up in one hand.",
                explanation: "A packet of table salt standardly weighs around 1 kg. A paperclip is much lighter (grams), while a table or heavy rice bag weighs much more."
            },
            {
                type: "Estimation MCQ",
                question: "Meera is filling up an empty household plastic bucket using a water tap to wash her bicycle. What is the best estimation of this bucket's capacity?",
                options: [
                    "About 10 milliliters",
                    "About 10 liters",
                    "About 500 liters",
                    "About 10 meters"
                ],
                answer: 1,
                hint: "A spoonful is roughly 5 mL, and a large overhead water tank holds 500 liters. Choose the logical middle value.",
                explanation: "A typical home utility washing bucket holds roughly 10 Liters of volume. 10 mL is a drop, and 500 L is a massive industrial tank storage."
            },
            {
                type: "Estimation MCQ",
                question: "Look at your typical classroom door. What is the most reasonable estimate for the physical height of a standard room doorway?",
                options: [
                    "About 2 centimeters",
                    "About 2 meters",
                    "About 20 kilometers",
                    "About 200 meters"
                ],
                answer: 1,
                hint: "An adult person can stand upright safely inside a doorway. Adults are generally between 1.5 to 1.8 meters tall.",
                explanation: "A standard doorway is roughly 2 meters tall. 2 cm is too tiny to notice, and 200 meters matches skyscraper proportions."
            },
            {
                type: "Error Detection MCQ",
                question: "Rahul writes down these weight conversion calculations in his notebook. Which equation contains a major math error?",
                options: [
                    "1 kg = 1,000 g",
                    "2 kg = 2,000 g",
                    "5 kg = 500 g",
                    "3 kg = 3,000 g"
                ],
                answer: 2,
                hint: "Review your base metric conversion unit line: 1 kilogram must always equal 1,000 grams.",
                explanation: "The equation '5 kg = 500 g' is incorrect. It should be 5,000 grams because 5 × 1,000 = 5,000."
            },
            {
                type: "Assertion-Reason MCQ",
                question: "Assertion: A large glass jar of honey is measured using a kitchen weighing scale in Grams/Kilograms instead of using a long ruler.\nReason: Honey is an item that has weight, and scales find how heavy an object is.",
                options: [
                    "Both Assertion and Reason are correct, and the Reason perfectly explains the Assertion.",
                    "Both Assertion and Reason are correct, but the Reason does not explain the Assertion.",
                    "The Assertion is correct, but the Reason is completely false.",
                    "Both the Assertion and the Reason are completely false."
                ],
                answer: 0,
                hint: "Are rulers used to check the weight of jars? Think about what metric parameter scales analyze.",
                explanation: "Both statements are correct. A weighing scale is designed specifically to calculate how heavy an object is, which is why we use mass metrics rather than lengths."
            },
            {
                type: "Final Challenge (Case Study)",
                question: "Case Story Part 1: Chef Rohit has a large container containing 3 Liters of soup broth. During the lunch rush, he pours out exactly 1,200 milliliters to serve customers. How many milliliters of broth are still left in his container?",
                options: [
                    "1,800 milliliters",
                    "2,800 milliliters",
                    "800 milliliters",
                    "200 milliliters"
                ],
                answer: 0,
                hint: "Convert 3 Liters to milliliters first (3,000 mL) and subtract the 1,200 mL served.",
                explanation: "3 Liters = 3,000 mL. Subtracting 1,200 mL leaves exactly 1,800 mL of soup broth inside the container."
            },
            {
                type: "Final Challenge (Case Study)",
                question: "Case Story Part 2: Chef Rohit takes the remaining soup broth (1,800 mL) and wants to split it equally into 2 smaller serving bowls. How much broth will enter each bowl?",
                options: [
                    "800 milliliters",
                    "900 milliliters",
                    "1,000 milliliters",
                    "500 milliliters"
                ],
                answer: 1,
                hint: "Divide the total leftover broth volume (1,800 mL) by 2.",
                explanation: "Splitting 1,800 mL into two equal portions yields 900 mL per bowl (1,800 ÷ 2 = 900)."
            },
            {
                type: "Final Challenge (Problem Solving)",
                question: "Case Story Part 3: To prepare a fresh vegetable dessert dish later, Chef Rohit purchases 400 grams of green grapes and 600 grams of red apples. What is the combined weight of his purchased fruits?",
                options: [
                    "100 grams",
                    "1,000 kilograms",
                    "1 kilogram",
                    "500 grams"
                ],
                answer: 2,
                hint: "Add the two numbers together (400 g + 600 g = 1,000 g). Convert those grams into kilograms.",
                explanation: "400 g + 600 g = 1,000 grams. Since 1,000 grams equals exactly 1 kilogram, option C is correct."
            }
        ];

        let currentIndex = 0;
        let runningScore = 0;
        let attemptTracker = 0; 
        let countdownTimer;
        let activeSeconds = 60;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 2000);
        });

        function startInteractive() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            displayQuestion();
        }

        function displayQuestion() {
            clearInterval(countdownTimer);
            activeSeconds = 60;
            attemptTracker = 0;
            
            document.getElementById('timer-counter').innerText = activeSeconds;
            document.getElementById('hint-feedback').style.display = 'none';
            document.getElementById('explain-feedback').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            let qData = questionBank[currentIndex];
            document.getElementById('progress-text').innerText = `Question: ${currentIndex + 1}/${questionBank.length}`;
            document.getElementById('target-question').innerText = `[${qData.type}] ${qData.question}`;
            
            const optionsBox = document.getElementById('target-options');
            optionsBox.innerHTML = '';

            qData.options.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.setAttribute('onclick', `evaluateSelection(this, ${index})`);
                optionsBox.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                activeSeconds--;
                document.getElementById('timer-counter').innerText = activeSeconds;
                if(activeSeconds <= 0) {
                    clearInterval(countdownTimer);
                    lockButtonsOnTimeout();
                }
            }, 1000);
        }

        function lockButtonsOnTimeout() {
            let qData = questionBank[currentIndex];
            disableAllOptions();
            const explBox = document.getElementById('explain-feedback');
            explBox.innerHTML = `<strong>Time's Up!</strong> ${qData.explanation}`;
            explBox.style.display = 'block';
            playSound('wrong');
            document.getElementById('next-btn').style.display = 'block';
        }

        function triggerConfetti() {
            try {
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.7 }
                });
            } catch (e) {
                console.log("Confetti script block not found.");
            }
        }

        function evaluateSelection(selectedBtn, chosenIdx) {
            let qData = questionBank[currentIndex];
            
            if (chosenIdx === qData.answer) {
                clearInterval(countdownTimer);
                selectedBtn.classList.add('correct');
                disableAllOptions();
                
                if (attemptTracker === 0) {
                    runningScore++;
                    document.getElementById('score-text').innerText = `Score: ${runningScore}`;
                }
                
                triggerConfetti();
                playSound('correct');
                
                const explBox = document.getElementById('explain-feedback');
                explBox.innerHTML = `<strong>Correct!</strong> ${qData.explanation}`;
                explBox.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';

            } else {
                attemptTracker++;
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                playSound('wrong');

                if (attemptTracker === 1) {
                    const hintBox = document.getElementById('hint-feedback');
                    hintBox.innerHTML = `<strong>Hint:</strong> ${qData.hint}`;
                    hintBox.style.display = 'block';
                } else {
                    clearInterval(countdownTimer);
                    disableAllOptions();
                    
                    const optionsList = document.getElementById('target-options').children;
                    optionsList[qData.answer].classList.add('correct');

                    document.getElementById('hint-feedback').style.display = 'none';

                    const explBox = document.getElementById('explain-feedback');
                    explBox.innerHTML = `<strong>Not quite!</strong> ${qData.explanation}`;
                    explBox.style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }

        function disableAllOptions() {
            const buttons = document.getElementsByClassName('option-btn');
            for(let btn of buttons) {
                btn.disabled = true;
            }
        }

        function playSound(type) {
            const audio = document.getElementById(`audio-${type}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio presentation skipped."));
            }
        }

        function advanceQuestion() {
            currentIndex++;
            if (currentIndex < questionBank.length) {
                displayQuestion();
            } else {
                showFinalResults();
            }
        }

        function showFinalResults() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            document.getElementById('final-score-value').innerText = `${runningScore}/${questionBank.length}`;
            
            let finalPercentage = (runningScore / questionBank.length) * 100;
            let statusText = "";

            if (finalPercentage >= 75) {
                statusText = "Good job!";
                triggerConfetti();
                setTimeout(triggerConfetti, 300);
            } else if (finalPercentage >= 40) {
                statusText = "Review this chapter and try again.";
            } else {
                statusText = "Let’s practise more.";
            }
            
            document.getElementById('final-status-msg').innerText = statusText;
        }

        function resetInteractive() {
            currentIndex = 0;
            runningScore = 0;
            document.getElementById('score-text').innerText = `Score: 0`;
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('welcome-screen').classList.add('active');
        }
    </script>
</body>
</html>
