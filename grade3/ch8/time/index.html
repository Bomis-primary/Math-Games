<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G3 Time Explorer</title>
<style>
body {
  margin:0;
  font-family:'Arial', sans-serif;
  background: linear-gradient(135deg, #ffe6f0, #e0f7ff);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
#game-container { width:100%; max-width:700px; text-align:center; position:relative; }
#logo-slide, #end-slide, #question-slide, #timeline-slide { display:none; }
.option {
  background-color:#fff;
  border:2px solid #cfa;
  border-radius:10px;
  padding:15px 25px;
  margin:10px;
  display:inline-block;
  cursor:pointer;
  font-size:1.2em;
  transition:transform 0.2s;
}
.option:hover { transform:scale(1.05); }
.correct { border-color:green; background-color:#cfc; }
.wrong { border-color:red; background-color:#fcc; animation:jiggle 0.3s; }
@keyframes jiggle {
  0%{transform:translateX(0);} 25%{transform:translateX(-5px);} 50%{transform:translateX(5px);}
  75%{transform:translateX(-5px);} 100%{transform:translateX(0);}
}
#confetti-canvas { position:absolute; top:0; left:0; pointer-events:none; }
#instruction { background-color:#ffd; padding:10px; border-radius:8px; font-weight:bold; margin-bottom:15px; }
#play-again-btn { padding:12px 25px; font-size:1.2em; border-radius:12px; border:none; background-color:#ffcc66; cursor:pointer; margin-top:20px; }
#timeline-cards { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:15px; }
.timeline-card { width:100px; padding:10px; background:#fff; border-radius:10px; cursor:grab; user-select:none; text-align:center; font-weight:bold; border:2px solid #ccc; }
.timeline-drop { width:100px; height:120px; border:2px dashed #aaa; border-radius:10px; margin:10px; display:inline-block; vertical-align:top; }
</style>
</head>
<body>

<div id="game-container">

<!-- Logo Slide -->
<div id="logo-slide">
<img src="assets/logo.png" alt="Innovine Logo" style="width:200px;">
</div>

<!-- Question Slide -->
<div id="question-slide">
<div id="instruction"></div>
<img id="clock-image" style="width:250px; margin:15px 0;"><br>
<div id="options-container"></div>
</div>

<!-- Timeline Slide -->
<div id="timeline-slide">
<div id="instruction"></div>
<div id="timeline-drop-container"></div>
<div id="timeline-cards"></div>
</div>

<!-- End Slide -->
<div id="end-slide">
<h2>🎉 Well Done! All objectives completed! 🎉</h2>
<button id="play-again-btn">Play Again</button>
</div>

</div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>
<audio id="applause-sound" src="assets/freesound_community-claps-44774.mp3"></audio>

<canvas id="confetti-canvas"></canvas>

<script>
// --- Lesson-Aligned Game Data ---
const rounds = [
  // Tap-the-correct clock: recall reading analog to minute & quarters
  { type:'tap', instruction:"Read the clock to the minute:", image:"assets/analog-3-15.png", options:["3:00","3:15","3:30"], answer:1 },
  { type:'tap', instruction:"Read the clock to the minute:", image:"assets/analog-7-45.png", options:["7:30","7:45","8:00"], answer:1 },
  { type:'tap', instruction:"Read the clock to the minute:", image:"assets/analog-2-15.png", options:["2:00","2:15","2:30"], answer:1 },
  { type:'tap', instruction:"Read the clock to the minute:", image:"assets/analog-1-30.png", options:["1:15","1:30","1:45"], answer:1 },
  
  // Compare estimated vs actual
  { type:'tap', instruction:"Walk takes 10 min. Actual: 12 min. Select correct time:", image:"assets/digital-12.png", options:["10 min","12 min"], answer:1 },
  
  // Identify today, tomorrow, day after tomorrow
  { type:'tap', instruction:"If today is Monday, what is the day after tomorrow?", image:"assets/digital-3.png", options:["Tuesday","Wednesday","Thursday"], answer:1 },
  
  // Year calculations
  { type:'tap', instruction:"If this year is 2026, next year is:", image:"assets/digital-6-45.png", options:["2026","2027","2028"], answer:1 },
  { type:'tap', instruction:"If this year is 2026, the year two years from now is:", image:"assets/digital-8-20.png", options:["2027","2028","2029"], answer:1 },
  
  // Timeline sequencing
  { type:'timeline', instruction:"Arrange the events in correct order:", cards:["Birth","Start School","Win a Prize","Birthday","Family Trip"], order:["Birth","Start School","Win a Prize","Birthday","Family Trip"] }
];

let currentRound=-1, attempt=0;

// --- Elements ---
const logoSlide=document.getElementById("logo-slide");
const questionSlide=document.getElementById("question-slide");
const timelineSlide=document.getElementById("timeline-slide");
const endSlide=document.getElementById("end-slide");
const instructionEl=document.getElementById("instruction");
const optionsContainer=document.getElementById("options-container");
const clockImage=document.getElementById("clock-image");
const timelineDropContainer=document.getElementById("timeline-drop-container");
const timelineCardsEl=document.getElementById("timeline-cards");
const correctSound=document.getElementById("correct-sound");
const wrongSound=document.getElementById("wrong-sound");
const applauseSound=document.getElementById("applause-sound");
const playAgainBtn=document.getElementById("play-again-btn");
const confettiCanvas=document.getElementById("confetti-canvas");

// --- Game Flow ---
function startGame(){
  logoSlide.style.display="block"; questionSlide.style.display="none"; timelineSlide.style.display="none"; endSlide.style.display="none";
  currentRound=-1; attempt=0; setTimeout(nextRound,3000);
}

function nextRound(){
  currentRound++; attempt=0;
  if(currentRound>=rounds.length){ showEndSlide(); return; }
  const round=rounds[currentRound];
  if(round.type==='tap'){ showTapQuestion(round); }
  else if(round.type==='timeline'){ showTimeline(round); }
}

// --- Tap Question ---
function showTapQuestion(round){
  logoSlide.style.display="none"; questionSlide.style.display="block"; timelineSlide.style.display="none"; endSlide.style.display="none";
  instructionEl.textContent=round.instruction;
  clockImage.src=round.image;
  optionsContainer.innerHTML="";
  round.options.forEach((opt,idx)=>{
    const btn=document.createElement("div"); btn.classList.add("option"); btn.textContent=opt;
    btn.addEventListener("click",()=>handleTapAnswer(idx)); optionsContainer.appendChild(btn);
  });
}

function handleTapAnswer(selectedIdx){
  const round=rounds[currentRound];
  const buttons=optionsContainer.children;
  if(selectedIdx===round.answer){
    buttons[selectedIdx].classList.add("correct"); correctSound.play(); setTimeout(nextRound,1000);
  } else {
    buttons[selectedIdx].classList.add("wrong"); wrongSound.play(); attempt++;
    if(attempt>=2){ buttons[round.answer].classList.add("correct"); setTimeout(nextRound,1500); }
  }
}

// --- Timeline Drag & Drop ---
function showTimeline(round){
  logoSlide.style.display="none"; questionSlide.style.display="none"; timelineSlide.style.display="block"; endSlide.style.display="none";
  instructionEl.textContent=round.instruction;
  timelineDropContainer.innerHTML=""; timelineCardsEl.innerHTML="";
  // create drop zones
  round.order.forEach(o=>{
    const div=document.createElement("div"); div.classList.add("timeline-drop"); div.dataset.accept=o; div.addEventListener("dragover",e=>e.preventDefault());
    div.addEventListener("drop",dropCard); timelineDropContainer.appendChild(div);
  });
  // create draggable cards
  round.cards.forEach(c=>{
    const div=document.createElement("div"); div.classList.add("timeline-card"); div.draggable=true; div.textContent=c;
    div.addEventListener("dragstart",dragStart); timelineCardsEl.appendChild(div);
  });
}

let dragged=null;
function dragStart(e){ dragged=e.target; }
function dropCard(e){
  e.preventDefault();
  if(!dragged) return;
  if(e.target.children.length===0){
    e.target.appendChild(dragged);
    dragged.style.cursor="default";
    dragged.draggable=false;
  }
  checkTimelineComplete();
}

function checkTimelineComplete(){
  const round=rounds[currentRound];
  const drops=document.querySelectorAll(".timeline-drop");
  let correct=true;
  drops.forEach(d=>{
    if(d.children.length===0 || d.children[0].textContent!==d.dataset.accept) correct=false;
  });
  if(correct){ correctSound.play(); setTimeout(nextRound,1000); }
}

// --- End Slide ---
function showEndSlide(){ questionSlide.style.display="none"; timelineSlide.style.display="none"; endSlide.style.display="block"; applauseSound.play(); launchConfetti(); }

playAgainBtn.addEventListener("click",()=>{ clearConfetti(); startGame(); });

// --- Confetti ---
let confettiCtx=confettiCanvas.getContext('2d'); confettiCanvas.width=window.innerWidth; confettiCanvas.height=window.innerHeight; let confettiPieces=[];
function launchConfetti(){ confettiPieces=[]; for(let i=0;i<150;i++){ confettiPieces.push({x:Math.random()*confettiCanvas.width,y:Math.random()*confettiCanvas.height,r:Math.random()*6+2,d:Math.random()*20,color:`hsl(${Math.random()*360},100%,50%)`,tilt:Math.random()*10-10}); } requestAnimationFrame(drawConfetti);}
function drawConfetti(){ confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height); confettiPieces.forEach(p=>{ confettiCtx.beginPath(); confettiCtx.lineWidth=p.r/2; confettiCtx.strokeStyle=p.color; confettiCtx.moveTo(p.x+p.tilt+p.r/4,p.y); confettiCtx.lineTo(p.x+p.tilt,p.y+p.r); confettiCtx.stroke(); p.y+=Math.cos(0.1+p.d)*2+1; p.x+=Math.sin(0.05)*2; if(p.y>confettiCanvas.height){p.y=0;p.x=Math.random()*confettiCanvas.width;} }); if(endSlide.style.display==="block") requestAnimationFrame(drawConfetti);}
function clearConfetti(){ confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height); }

window.onload=startGame;
</script>
</body>
</html>
