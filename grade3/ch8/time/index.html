<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Machine II: Quantum Paradox</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            user-select: none;
        }

        body {
            background-color: #2c3e50;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* --- BLANK WHITE SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        #splash-screen img { max-width: 280px; height: auto; }

        /* --- ARCADE CABINET --- */
        .arcade-cabinet {
            background: linear-gradient(135deg, #111, #222);
            border: 6px solid #00f0ff;
            border-radius: 24px;
            padding: 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 45px rgba(0,240,255,0.3);
            color: #fff;
        }

        /* --- GRAPHICS STAGE --- */
        .graphics-stage {
            background: #1a252f;
            width: 100%;
            height: 240px;
            border-radius: 16px;
            border: 4px solid #00f0ff;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Analog Clock Layout */
        .toy-clock {
            width: 170px;
            height: 170px;
            background: #fff8e1;
            border: 4px solid #f39c12;
            border-radius: 50%;
            position: relative;
            display: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        
        /* Dynamic CSS Clock Numbers */
        .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: bold;
            color: #333;
            font-size: 14px;
            padding: 4px;
        }
        .n12 { transform: rotate(0deg); } .n12 span { display: inline-block; transform: rotate(0deg); }
        .n3 { transform: rotate(90deg); } .n3 span { display: inline-block; transform: rotate(-90deg); }
        .n6 { transform: rotate(180deg); } .n6 span { display: inline-block; transform: rotate(-180deg); }
        .n9 { transform: rotate(270deg); } .n9 span { display: inline-block; transform: rotate(-270deg); }

        .clock-center {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            background: #212121;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .hand {
            position: absolute;
            bottom: 50%; left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            transition: transform 0.2s ease-out;
        }
        .hour-hand { width: 6px; height: 42px; background: #212121; transform: translate(-50%, 0) rotate(0deg); z-index: 5; }
        .minute-hand { width: 4px; height: 62px; background: #00f0ff; transform: translate(-50%, 0) rotate(0deg); z-index: 6; }

        /* Digital Readout Indicator */
        .digital-readout {
            position: absolute;
            bottom: 10px;
            background: rgba(0,0,0,0.85);
            border: 1px solid #00f0ff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #00f0ff;
            font-family: monospace;
            display: none;
        }

        .badge-display {
            max-height: 150px;
            width: auto;
            object-fit: contain;
            display: none;
        }

        /* --- CONTROL CONSOLE --- */
        .control-board {
            background: #f4f6f7;
            border: 4px solid #333;
            border-radius: 16px;
            padding: 15px;
            color: #333;
        }
        .meta-strip {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .task-card {
            background: #fff;
            border: 3px dashed #00f0ff;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
            border-radius: 10px;
            color: #2c3e50;
            text-align: center;
            min-height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* Student-Facing Digital Target Layout */
        .target-digital-badge {
            display: inline-block;
            background: #23395d;
            color: #00ff00;
            border: 3px solid #34495e;
            padding: 4px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 8px;
            letter-spacing: 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .input-view { display: none; }
        .crank-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .action-row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Buttons styling */
        .btn-game {
            background: #34495e;
            color: #fff;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2c3e50;
            transition: transform 0.1s;
        }
        .btn-game:hover:not(:disabled) { background: #455a64; }
        .btn-game:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #2c3e50; }
        
        .btn-game.correct { background: #2ecc71 !important; box-shadow: 0 4px 0 #27ae60 !important; color: white !important; }
        .btn-game.wrong { background: #e74c3c !important; box-shadow: 0 4px 0 #c0392b !important; color: white !important; }

        .btn-submit {
            background: #00f0ff;
            color: #111;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #00b8d4;
            margin-top: 5px;
        }
        .btn-submit:active { transform: translateY(4px); box-shadow: 0 1px 0 #00b8d4; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.src='https://placehold.co/280x150?text=Innovine+Logo'">
    </div>

    <div class="arcade-cabinet">
        
        <div class="graphics-stage" id="stage-area">
            <div class="toy-clock" id="visual-clock">
                <div class="clock-number n12"><span>12</span></div>
                <div class="clock-number n3"><span>3</span></div>
                <div class="clock-number n6"><span>6</span></div>
                <div class="clock-number n9"><span>9</span></div>
                <div class="clock-center"></div>
                <div id="hr-needle" class="hand hour-hand"></div>
                <div id="min-needle" class="hand minute-hand"></div>
            </div>
            <div class="digital-readout" id="clock-digital">Current: 12:00</div>

            <img class="badge-display" id="visual-image" src="" alt="Paradox Monitor" onerror="this.style.display='none';">
        </div>

        <div class="control-board">
            <div class="meta-strip">
                <span id="label-level">QUANTUM CORE ACTIVE</span>
                <div>🔊 <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7" style="width:50px; vertical-align:middle; cursor:pointer;"></div>
            </div>

            <div class="task-card" id="display-prompt">Booting paradox containment shields...</div>

            <div id="router-panel">
                
                <div id="view-prologue" class="input-view" style="display: block;">
                    <button class="btn-submit" onclick="advanceToLevel(1)">INITIALIZE MACHINE 🚀</button>
                </div>

                <div id="view-transition" class="input-view">
                    <button class="btn-submit" style="background:#9b59b6; box-shadow:0 5px 0 #8e44ad; color:white;" onclick="startLoadedLevel()">ENGAGE ZONE CONVERGENCE ⚡</button>
                </div>

                <div id="view-l1" class="input-view">
                    <div class="crank-box">
                        <button class="btn-game" onclick="turnGears(1, 0)">⚙️ +1 Hour</button>
                        <button class="btn-game" onclick="turnGears(0, 15)" style="background:#00b8d4;">⚙️ +15 Min (Quarter)</button>
                        <button class="btn-game" onclick="turnGears(0, 5)" style="background:#2e4053;">⚙️ +5 Min</button>
                        <button class="btn-game" onclick="turnGears(0, 1)" style="background:#7f8c8d;">⚙️ +1 Min Precision</button>
                    </div>
                    <div class="action-row">
                        <button class="btn-game" style="background: #e67e22; box-shadow: 0 4px 0 #d35400;" onclick="resetHandsToTwelve()">🔄 Reset</button>
                        <button class="btn-submit" style="background:#2ecc71; box-shadow:0 5px 0 #27ae60; margin-top:0;" onclick="verifyLevel1State()">LOCK TIME MATRIX 🕹️</button>
                    </div>
                </div>

                <div id="view-grid" class="input-view">
                    <div class="grid-choices" id="grid-container"></div>
                </div>

                <div id="view-epilogue" class="input-view">
                    <button class="btn-submit" style="background:#e67e22; box-shadow:0 5px 0 #d35400;" onclick="resetEngine()">REBOOT ENGINE MATRIX 🔄</button>
                </div>

            </div>
        </div>

    </div>

    <audio id="sound-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="sound-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <script>
        // Confined structure setting up Q1 text and Q2, Q3, Q4 digital clock types
        const level1Puzzles = [
            { isDigital: false, text: "CRITICAL SYNC: Move hands to exactly quarter past 3 o'clock! (3:15)", h: 3, m: 15 },
            { isDigital: true, text: "⏰ Look at the digital clock below. Change the analog clock to match it:", displayTime: "06:42", h: 6, m: 42 },
            { isDigital: true, text: "⏰ Look at the digital clock below. Change the analog clock to match it:", displayTime: "08:45", h: 8, m: 45 },
            { isDigital: true, text: "⏰ Look at the digital clock below. Change the analog clock to match it:", displayTime: "11:07", h: 11, m: 7 }
        ];

        const level2Puzzles = [
            { text: "QUANTUM SHIFT: Today is Tuesday. Jump to 'the day after tomorrow'. What day is it?", choices: ["Thursday", "Wednesday", "Friday", "Monday"], correct: "Thursday" },
            { text: "QUANTUM SHIFT: The current calendar tracker reads 2026. Jump precisely 'two years from now'. What year is it?", choices: ["2028", "2027", "2025", "2024"], correct: "2028" },
            { text: "QUANTUM SHIFT: If tomorrow is Sunday, what day is today?", choices: ["Saturday", "Sunday", "Friday", "Monday"], correct: "Saturday" },
            { text: "QUANTUM SHIFT: The warp drive says the current year is 2026. What was the 'previous year'?", choices: ["2025", "2024", "2027", "2026"], correct: "2025" }
        ];

        const level3Puzzles = [
            { text: "TIMELINE REPAIR: Which history log lists events in the correct, sequential timeline order?", choices: ["Past ➔ Present ➔ Future", "Present ➔ Past ➔ Future", "Future ➔ Past ➔ Present", "Past ➔ Future ➔ Present"], correct: "Past ➔ Present ➔ Future" },
            { text: "TIMELINE REPAIR: Arrange these sequence metrics safely from shortest duration to longest duration:", choices: ["Minute ➔ Hour ➔ Day", "Hour ➔ Minute ➔ Day", "Day ➔ Hour ➔ Minute", "Minute ➔ Day ➔ Hour"], correct: "Minute ➔ Hour ➔ Day" },
            { text: "TIMELINE REPAIR: Choose the sequence ordered correctly by timeline logic:", choices: ["Yesterday ➔ Today ➔ Tomorrow", "Tomorrow ➔ Today ➔ Yesterday", "Today ➔ Tomorrow ➔ Yesterday", "Yesterday ➔ Tomorrow ➔ Today"], correct: "Yesterday ➔ Today ➔ Tomorrow" }
        ];

        let currentLevel = 0;
        let puzzleIndex = 0;
        let activePool = [];
        let inputLock = false;
        let attemptsUsed = 0;

        let hValue = 12;
        let mValue = 0;

        const clipWin = document.getElementById('sound-correct');
        const clipLose = document.getElementById('sound-wrong');

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('display-prompt').innerHTML = "Quantum anomalies detected! Synchronize the clock coordinates, bridge calendar wormholes, and realign chronological timelines!";
                }, 500);
            }, 3000);
        });

        function clearViewPorts() {
            document.querySelectorAll('.input-view').forEach(v => v.style.display = 'none');
            document.getElementById('visual-clock').style.display = 'none';
            document.getElementById('clock-digital').style.display = 'none';
            document.getElementById('visual-image').style.display = 'none';
        }

        function advanceToLevel(targetLevelId) {
            currentLevel = targetLevelId;
            puzzleIndex = 0;
            clearViewPorts();

            const promptBox = document.getElementById('display-prompt');
            const visualImg = document.getElementById('visual-image');

            if (currentLevel === 1) {
                document.getElementById('label-level').textContent = "MATRIX LEVEL 1";
                visualImg.src = "assets/clock-face.png";
                visualImg.style.display = "block";
                promptBox.innerHTML = "⚡ <strong>ZONE 1: PRECISION CLOCKWORK LOGS</strong><br>The gears are loose! Sync the analog dial mechanism to the exact minutes and specific hour quarter intervals.";
                document.getElementById('view-transition').style.display = 'block';
            }
            else if (currentLevel === 2) {
                document.getElementById('label-level').textContent = "MATRIX LEVEL 2";
                visualImg.src = "assets/calendar.png";
                visualImg.style.display = "block";
                promptBox.innerHTML = "🌀 <strong>ZONE 2: CALENDAR CALIBRATION DRIVES</strong><br>The chronological anchors are slipstreaming. Solve relative day shifts and jump multiple calendar years into the continuum!";
                document.getElementById('view-transition').style.display = 'block';
            }
            else if (currentLevel === 3) {
                document.getElementById('label-level').textContent = "MATRIX LEVEL 3";
                visualImg.src = "assets/time-bg.png";
                visualImg.style.display = "block";
                promptBox.innerHTML = "📜 <strong>ZONE 3: CHRONOLOGICAL SEQUENCE REPAIR</strong><br>Final Paradox! Order structural blocks and sequential timelines to freeze history arrays in their proper, linear paths.";
                document.getElementById('view-transition').style.display = 'block';
            }
        }

        function startLoadedLevel() {
            clearViewPorts();
            attemptsUsed = 0;

            if (currentLevel === 1) {
                document.getElementById('label-level').textContent = "L1: ANALOG CHRONO-METRICS";
                document.getElementById('visual-clock').style.display = 'block';
                document.getElementById('clock-digital').style.display = 'block';
                document.getElementById('view-l1').style.display = 'block';
                
                // Shuffle Level 1 setup variables cleanly
                activePool = [...level1Puzzles].sort(() => Math.random() - 0.5);
                
                hValue = 12;
                mValue = 0;
                calculateHandRotations();
                executeStageLoad();
            }
            else if (currentLevel === 2) {
                document.getElementById('label-level').textContent = "L2: QUANTUM LEAP CALENDAR";
                document.getElementById('visual-image').src = "assets/calendar.png";
                document.getElementById('visual-image').style.display = 'block';
                document.getElementById('view-grid').style.display = 'block';
                activePool = [...level2Puzzles].sort(() => Math.random() - 0.5);
                executeStageLoad();
            }
            else if (currentLevel === 3) {
                document.getElementById('label-level').textContent = "L3: TIMELINE SEQUENCERS";
                document.getElementById('visual-image').src = "assets/time-bg.png";
                document.getElementById('visual-image').style.display = 'block';
                document.getElementById('view-grid').style.display = 'block';
                activePool = [...level3Puzzles].sort(() => Math.random() - 0.5);
                executeStageLoad();
            }
        }

        function executeStageLoad() {
            inputLock = false;
            const puzzle = activePool[puzzleIndex];
            
            // Output text for words or render structural layout box for digital questions
            if (currentLevel === 1 && puzzle.isDigital) {
                document.getElementById('display-prompt').innerHTML = `
                    <div style="margin-bottom: 4px;">${puzzle.text}</div>
                    <div class="target-digital-badge">${puzzle.displayTime}</div>
                `;
            } else {
                document.getElementById('display-prompt').textContent = puzzle.text;
            }

            // GUARANTEE 12:00 AT EVERY FRESH ENTRY PIPELINE
            if (currentLevel === 1) {
                hValue = 12;
                mValue = 0;
                calculateHandRotations();
            }

            if (currentLevel === 2 || currentLevel === 3) {
                const container = document.getElementById('grid-container');
                container.innerHTML = '';
                
                let matrixMix = [...puzzle.choices].sort(() => Math.random() - 0.5);
                matrixMix.forEach(choiceText => {
                    const choiceBtn = document.createElement('button');
                    choiceBtn.className = 'btn-game';
                    choiceBtn.textContent = choiceText;
                    choiceBtn.onclick = () => parseGridSelection(choiceBtn, choiceText === puzzle.correct);
                    container.appendChild(choiceBtn);
                });
            }
        }

        // --- CLOCK MECHANICS ---
        function turnGears(hrDelta, minDelta) {
            if (inputLock) return;
            mValue += minDelta;
            if (mValue >= 60) {
                let extraHours = Math.floor(mValue / 60);
                mValue = mValue % 60;
                hValue += extraHours;
            }
            hValue += hrDelta;
            while (hValue > 12) hValue -= 12;
            calculateHandRotations();
        }

        function resetHandsToTwelve() {
            if (inputLock) return;
            hValue = 12;
            mValue = 0;
            calculateHandRotations();
        }

        function calculateHandRotations() {
            const rotMin = mValue * 6;
            const rotHr = (hValue * 30) + (mValue * 0.5);
            document.getElementById('min-needle').style.transform = `translate(-50%, 0) rotate(${rotMin}deg)`;
            document.getElementById('hr-needle').style.transform = `translate(-50%, 0) rotate(${rotHr}deg)`;
            
            let displayMin = mValue < 10 ? '0' + mValue : mValue;
            document.getElementById('clock-digital').textContent = `Your Clock: ${hValue}:${displayMin}`;
        }

        function verifyLevel1State() {
            if (inputLock) return;
            const challenge = activePool[puzzleIndex];
            
            if (hValue === challenge.h && mValue === challenge.m) {
                processValidationSuccess();
            } else {
                handleIncorrectAttempt(null);
            }
        }

        // --- CHOICE SELECTION LOGIC ---
        function parseGridSelection(clickedElement, pointsMatch) {
            if (inputLock) return;

            if (pointsMatch) {
                inputLock = true;
                clickedElement.classList.add('correct');
                processValidationSuccess();
            } else {
                clickedElement.classList.add('wrong');
                clickedElement.disabled = true; 
                handleIncorrectAttempt(clickedElement);
            }
        }

        // --- ATTEMPT DISPATCH ENGINE ---
        function handleIncorrectAttempt(clickedElement) {
            attemptsUsed++;
            try { clipLose.play(); } catch(err){}

            if (attemptsUsed < 2) {
                const puzzle = activePool[puzzleIndex];
                let retryPrompt = "⚠️ <strong>Mismatch!</strong> Readjust the gears and try once more!";
                
                if (currentLevel === 1 && puzzle.isDigital) {
                    document.getElementById('display-prompt').innerHTML = `
                        <div style="margin-bottom: 4px;">${retryPrompt}</div>
                        <div class="target-digital-badge">${puzzle.displayTime}</div>
                    `;
                } else {
                    document.getElementById('display-prompt').innerHTML = retryPrompt;
                }
                if (currentLevel === 1) inputLock = false; 
            } else {
                inputLock = true;
                document.getElementById('display-prompt').innerHTML = "❌ <strong>Grid Overheated!</strong> Forcing safety sync override...";
                
                if (currentLevel === 1) {
                    const challenge = activePool[puzzleIndex];
                    hValue = challenge.h;
                    mValue = challenge.m;
                    setTimeout(() => { calculateHandRotations(); }, 500);
                } else {
                    const buttons = document.querySelectorAll('.grid-choices .btn-game');
                    buttons.forEach(btn => {
                        if (btn.textContent === activePool[puzzleIndex].correct) btn.classList.add('correct');
                        btn.disabled = true;
                    });
                }

                puzzleIndex++;
                setTimeout(() => { evaluateGameProgression(); }, 2500);
            }
        }

        function processValidationSuccess() {
            inputLock = true;
            try { clipWin.play(); } catch(err){}
            confetti({ particleCount: 50, spread: 60 });

            puzzleIndex++;
            setTimeout(() => { evaluateGameProgression(); }, 1800);
        }

        function evaluateGameProgression() {
            attemptsUsed = 0; 
            
            if (puzzleIndex < activePool.length) {
                executeStageLoad();
            } else {
                if (currentLevel === 1) advanceToLevel(2);
                else if (currentLevel === 2) advanceToLevel(3);
                else triggerVictoryEpilogue();
            }
        }

        function triggerVictoryEpilogue() {
            clearViewPorts();
            document.getElementById('label-level').textContent = "ALL LOGIC STABLE";
            
            const trophyAsset = document.getElementById('visual-image');
            trophyAsset.src = "assets/innovine-logo.png";
            trophyAsset.style.display = 'block';

            document.getElementById('display-prompt').innerHTML = "🏆 <strong>QUANTUM CONVERGENCE SECURED!</strong><br>All analog variables, timeline directions, and chronological grids are completely stable!";
            document.getElementById('view-epilogue').style.display = 'block';
            confetti({ particleCount: 150, spread: 85 });
        }

        function resetEngine() {
            advanceToLevel(1);
        }
    </script>
</body>
</html>
