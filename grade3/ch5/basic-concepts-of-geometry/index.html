<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Art Quest!</title>
    <style>
        :root {
            --sky: #38BDF8;
            --grass: #4ADE80;
            --dark: #0F172A;
            --purple: #4F46E5;
            --amber: #F59E0B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Splash Screen - Clean Solo Logo */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen img { max-width: 60%; max-height: 50%; object-fit: contain; }

        .game-machine {
            background: #FFFFFF;
            border: 8px solid var(--dark);
            border-radius: 40px;
            width: 100%;
            max-width: 760px;
            padding: 25px;
            box-shadow: 0 24px 0px var(--dark);
            position: relative;
        }

        h1 {
            color: var(--purple);
            font-size: 2.3rem;
            text-shadow: 3px 3px 0px #DDD;
            margin-bottom: 10px;
        }

        /* Progress Station bar */
        .progress-station {
            background: #E2E8F0;
            border: 4px solid var(--dark);
            height: 30px;
            border-radius: 20px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, #FF007F, #FFB600, #00F0FF);
            transition: width 0.4s ease;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
            background: #F8FAFC;
            padding: 10px 20px;
            border-radius: 20px;
            border: 4px solid var(--dark);
            margin-bottom: 15px;
        }

        /* LARGE GRAPHIC ART CANVAS SCREEN */
        .art-canvas {
            background: #7DD3FC; 
            border: 6px solid var(--dark);
            border-radius: 32px;
            height: 380px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow: hidden;
            box-shadow: inset 0 10px 0 rgba(0,0,0,0.1);
        }

        .speech-bubble {
            background: white;
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 10px 18px;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--dark);
            width: 95%;
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
            z-index: 10;
            margin-bottom: 10px;
        }

        /* VISUAL SCENE LAYOUT GRAPHICS */
        .art-back-scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🏠 House Scene Elements */
        .house-body {
            width: 220px; height: 140px; background: #EF4444;
            border: 4px solid var(--dark); position: absolute; bottom: 30px;
            border-radius: 12px;
        }
        .house-door {
            width: 50px; height: 80px; background: #FDE047;
            border: 4px solid var(--dark); position: absolute; bottom: 0; left: 85px;
            border-radius: 6px 6px 0 0;
        }

        /* ☀️ Sun Scene Elements */
        .sun-body {
            width: 130px; height: 130px; background: #F59E0B;
            border-radius: 50%; border: 5px solid var(--dark);
            position: absolute; left: 60px; top: 120px;
        }

        /* 🍦 Ice Cream Cone Scene Elements */
        .cone-waffle {
            width: 0; height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-top: 140px solid #D97706;
            position: absolute; bottom: 20px;
        }

        /* 🏰 Castle Tower Fence Elements */
        .castle-wall {
            width: 280px; height: 100px; background: #94A3B8;
            border: 5px solid var(--dark); position: absolute; bottom: 0;
            display: flex; justify-content: space-around;
        }
        .castle-fort { width: 40px; height: 40px; background: #64748B; border: 4px solid var(--dark); margin-top: -25px; }

        /* DROP TARGET TARGET TRACK CHANNELS ON DRAWINGS */
        .line-drop-target {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border: 4px dashed #FFFF00;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 8;
            box-shadow: 0 0 15px rgba(252, 211, 77, 0.6);
        }
        .line-drop-target.hovered {
            background: rgba(254, 240, 138, 0.8);
            border-style: solid;
        }
        .line-drop-target.filled {
            border: 4px solid #22C55E;
            background: transparent;
            box-shadow: none;
        }

        /* GEOMETRIC LINE COMPONENT ASSETS */
        .geo-line-asset {
            height: 16px;
            border-radius: 10px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            pointer-events: auto;
        }
        .geo-line-asset:active { cursor: grabbing; }

        /* Color profiles per type */
        .asset-segment { background: #EF4444; width: 200px; }
        .asset-ray { background: #10B981; width: 200px; }
        .asset-line { background: #3B82F6; width: 200px; }

        /* Vector caps endings definitions */
        .cap-dot {
            width: 24px; height: 24px; background: #EF4444;
            border: 3px solid white; border-radius: 50%;
            position: absolute;
        }
        .cap-dot.left { left: -12px; }
        .cap-dot.right { right: -12px; }

        .cap-arrow-r {
            width: 0; height: 0;
            border-top: 14px solid transparent; border-bottom: 14px solid transparent;
            border-left: 22px solid #10B981; position: absolute; right: -14px;
        }
        .cap-arrow-l {
            width: 0; height: 0;
            border-top: 14px solid transparent; border-bottom: 14px solid transparent;
            border-right: 22px solid #3B82F6; position: absolute; left: -14px;
        }
        .cap-arrow-r-blue {
            width: 0; height: 0;
            border-top: 14px solid transparent; border-bottom: 14px solid transparent;
            border-left: 22px solid #3B82F6; position: absolute; right: -14px;
        }

        /* PARTS TRAY STORAGE WIDGET */
        .tray-station-wrapper {
            background: #F1F5F9; border: 4px solid var(--dark);
            border-radius: 28px; padding: 15px;
            display: flex; justify-content: center; gap: 20px;
            margin-bottom: 20px; box-shadow: inset 0 6px 0 #CBD5E1;
            min-height: 100px; align-items: center;
        }
        .tray-slot-bin {
            background: white; border: 4px solid #94A3B8; border-radius: 20px;
            padding: 10px 20px; min-width: 220px; height: 75px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 0 #94A3B8;
        }

        /* ACTIONS PANEL CONTROLS */
        .control-room { display: flex; gap: 15px; }
        .btn-trash {
            background: #EF4444; color: white; font-size: 1.3rem; font-weight: bold;
            padding: 12px 25px; border: 4px solid var(--dark); border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 0 var(--dark);
        }
        .btn-trash:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--dark); }

        .btn-go {
            flex-grow: 1; background: #22C55E; color: white; font-size: 1.6rem; font-weight: bold;
            padding: 12px 30px; border: 4px solid var(--dark); border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 0 var(--dark); text-shadow: 2px 2px 0 var(--dark);
        }
        .btn-go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--dark); }

        /* CELEBRATION MODAL OVERLAY */
        .fun-popup {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98); border-radius: 32px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; padding: 20px; border: 6px solid var(--purple);
            animation: popUpArt 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }
        @keyframes popUpArt { from { scale: 0.7; opacity: 0; } to { scale: 1; opacity: 1; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img id="splashLogo" src="assets/innovine-logo.png" alt="Logo">
    </div>

    <audio id="audioRight" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audioWrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audioApplause" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div class="game-machine">
        
        <div id="popupCelebration" class="fun-popup hidden">
            <div style="font-size: 5.5rem; animation: bounce 0.5s infinite alternate;" id="popEmoji">🎉</div>
            <h2 style="font-size: 2.3rem; color: var(--purple); margin: 10px 0;" id="popTitle">Awesome Drawing!</h2>
            <p style="font-size: 1.3rem; font-weight: bold; color: #475569; margin-bottom: 20px;" id="popMsg">It looks perfect!</p>
            <button class="btn-go" style="flex-grow:0; padding: 10px 40px;" onclick="nextQuestLevel()">Next Drawing 🚀</button>
        </div>

        <div id="arenaStage">
            <h1>Art Geometry Quest! 🎨</h1>
            
            <div class="progress-station"><div id="progressFill"></div></div>
            
            <div class="score-board">
                <span id="txtQuestNum">Drawing: 1 / 4</span>
                <span id="txtScore">Score: 0 ⭐</span>
            </div>

            <div class="art-canvas" id="canvasScreenView">
                <div class="speech-bubble" id="txtInstruction">Loading Mission...</div>
                
                <div class="art-back-scene" id="vectorSceneBackdrop"></div>
            </div>

            <p style="text-align: left; font-weight: bold; color: var(--dark); margin-bottom: 8px;">
                🎁 Drag the right line right into the blinking yellow box to complete the drawing!
            </p>
            <div class="tray-station-wrapper" id="toyTrayBox"></div>

            <div class="control-room">
                <button class="btn-trash" onclick="clearActiveLineDrop()">Reset 🔄</button>
                <button class="btn-go" onclick="verifyActiveArtwork()">Check Artwork! ✔️</button>
            </div>
        </div>

        <div id="endStudioPanel" class="hidden" style="text-align: center; padding: 20px;">
            <h2 style="font-size: 2.8rem; color: var(--purple);">Art Studio Complete! 🏆</h2>
            <div style="font-size: 6rem; margin: 15px 0;">👑🌟🎨</div>
            <p id="endScoreValue" style="font-size: 2rem; font-weight: bold; color: var(--dark); margin-bottom: 30px;"></p>
            <button class="btn-go" style="flex-grow:0;" onclick="replayQuestEngine()">Play Again! 🎉</button>
        </div>

    </div>

    <script>
        window.onload = function() {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.style.opacity = 0;
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 2000);
            startQuestEngine();
        };

        function playSound(type) {
            const el = document.getElementById(type === 'right' ? 'audioRight' : type === 'wrong' ? 'audioWrong' : 'audioApplause');
            if(el) { el.currentTime = 0; el.play().catch(()=>{}); }
        }

        let currentLevel = 0;
        let runningScore = 0;
        let secondChance = false;
        let draggedLineType = null;
        let placedLineType = null;

        // Custom child challenges mapping explicit line models to direct scenery targets
        const questBook = [
            {
                msg: "🏠 Complete the House Roof! A horizontal roof beam needs 2 fixed endpoints. Drag the RED LINE SEGMENT to finish the house!",
                sceneClass: "house-body",
                innerHtml: '<div class="house-door"></div>',
                targetStyle: "width: 210px; height: 24px; bottom: 170px;",
                correctLine: "segment",
                trayOptions: ["segment", "ray", "line"]
            },
            {
                msg: "☀️ Draw the Missing Sun Ray! A sun ray starts at a point and shoots outward forever. Drag the GREEN RAY into the sky box!",
                sceneClass: "sun-body",
                innerHtml: '',
                targetStyle: "width: 210px; height: 24px; left: 160px; top: 80px; transform: rotate(-35deg);",
                correctLine: "ray",
                trayOptions: ["line", "ray", "segment"]
            },
            {
                msg: "🍦 Complete the Ice Cream Cone! A scoop needs a perfectly straight flat top that goes on forever both ways. Drag the BLUE LINE onto the cone!",
                sceneClass: "cone-waffle",
                innerHtml: '',
                targetStyle: "width: 210px; height: 24px; bottom: 156px;",
                correctLine: "line",
                trayOptions: ["segment", "line", "ray"]
            },
            {
                msg: "🏰 Finish the Castle Guard Post! A vertical fence barrier needs two solid endpoints. Drag the RED LINE SEGMENT up onto the castle wall!",
                sceneClass: "castle-wall",
                innerHtml: '<div class="castle-fort"></div><div class="castle-fort" style="margin-left:80px;"></div>',
                targetStyle: "width: 24px; height: 130px; bottom: 90px; left: 360px;",
                correctLine: "segment",
                trayOptions: ["ray", "segment", "line"]
            }
        ];

        function startQuestEngine() {
            currentLevel = 0; runningScore = 0; secondChance = false;
            loadArtQuestLevel();
        }

        function loadArtQuestLevel() {
            const levelData = questBook[currentLevel];
            placedLineType = null;
            secondChance = false;

            document.getElementById('txtQuestNum').innerText = `Drawing: ${currentLevel + 1} / 4`;
            document.getElementById('txtScore').innerText = `Score: ${runningScore} ⭐`;
            document.getElementById('progressFill').style.width = `${((currentLevel + 1) / 4) * 100}%`;
            document.getElementById('txtInstruction').innerText = levelData.msg;

            // Render Back Scene Art Landmark
            const backdrop = document.getElementById('vectorSceneBackdrop');
            backdrop.innerHTML = '';
            
            const landmark = document.createElement('div');
            landmark.className = levelData.sceneClass;
            landmark.innerHTML = levelData.innerHtml;
            backdrop.appendChild(landmark);

            // Wipe old target configurations if present
            const oldTarget = document.getElementById('activeArtTargetZone');
            if(oldTarget) oldTarget.remove();

            // Append live Interactive Drag/Drop slot box over scene artwork
            const canvas = document.getElementById('canvasScreenView');
            const targetZone = document.createElement('div');
            targetZone.id = "activeArtTargetZone";
            targetZone.className = "line-drop-target";
            targetZone.style = levelData.targetStyle;

            targetZone.addEventListener('dragover', (e) => { e.preventDefault(); targetZone.classList.add('hovered'); });
            targetZone.addEventListener('dragleave', () => targetZone.classList.remove('hovered'));
            targetZone.addEventListener('drop', (e) => {
                e.preventDefault();
                targetZone.classList.remove('hovered');
                dropLineIntoArtwork(targetZone);
            });
            targetZone.addEventListener('click', () => clearActiveLineDrop());

            canvas.appendChild(targetZone);

            // Render Tray Line Assets Box
            const tray = document.getElementById('toyTrayBox');
            tray.innerHTML = '';

            levelData.trayOptions.forEach(type => {
                const bin = document.createElement('div');
                bin.className = "tray-slot-bin";

                const lineAsset = document.createElement('div');
                lineAsset.className = `geo-line-asset asset-${type}`;
                lineAsset.draggable = true;
                lineAsset.innerHTML = getLineMarkup(type);

                // Check vertical orientation layout adjustment for Level 4 Castle Fence post
                if (currentLevel === 3) {
                    lineAsset.style.width = "16px";
                    lineAsset.style.height = "60px";
                }

                lineAsset.addEventListener('dragstart', () => { draggedLineType = type; });

                bin.appendChild(lineAsset);
                tray.appendChild(bin);
            });
        }

        function getLineMarkup(type) {
            if(type === 'segment') {
                return '<div class="cap-dot left"></div><div class="cap-dot right"></div>';
            } else if(type === 'ray') {
                return '<div class="cap-dot left" style="background:#10B981;"></div><div class="cap-arrow-r"></div>';
            } else if(type === 'line') {
                return '<div class="cap-arrow-l"></div><div class="cap-arrow-r-blue"></div>';
            }
            return '';
        }

        function dropLineIntoArtwork(targetZoneElement) {
            if(!draggedLineType) return;
            placedLineType = draggedLineType;
            targetZoneElement.classList.add('filled');
            
            // Re-render matching line inside canvas zone perfectly scaled
            targetZoneElement.innerHTML = `<div class="geo-line-asset asset-${placedLineType}" style="width:100%; height:100%;">${getLineMarkup(placedLineType)}</div>`;
        }

        function clearActiveLineDrop() {
            placedLineType = null;
            const targetZone = document.getElementById('activeArtTargetZone');
            if(targetZone) {
                targetZone.classList.remove('filled');
                targetZone.innerHTML = '';
            }
        }

        function verifyActiveArtwork() {
            const levelData = questBook[currentLevel];

            if(placedLineType === levelData.correctLine) {
                runningScore++;
                playSound('right');
                showWinModal();
            } else {
                if(!secondChance) {
                    secondChance = true;
                    playSound('wrong');
                    alert("Not quite fitting perfectly! Look closely at the caps/arrows of your line and try another one!");
                } else {
                    playSound('wrong');
                    // Guide them visually by auto-placing the correct piece
                    const targetZone = document.getElementById('activeArtTargetZone');
                    if(targetZone) {
                        targetZone.classList.add('filled');
                        targetZone.innerHTML = `<div class="geo-line-asset asset-${levelData.correctLine}" style="width:100%; height:100%;">${getLineMarkup(levelData.correctLine)}</div>`;
                    }
                    alert("Let's look at how the correct line object completes this picture!");
                    setTimeout(nextQuestLevel, 2600);
                }
            }
        }

        function showWinModal() {
            const popup = document.getElementById('popupCelebration');
            const emojis = ["🎉🏠", "☀️✨", "🍦🍦", "🏰👑"];
            document.getElementById('popEmoji').innerText = emojis[currentLevel];
            popup.classList.remove('hidden');
            playSound('applause');
        }

        function nextQuestLevel() {
            document.getElementById('popupCelebration').classList.add('hidden');
            currentLevel++;
            if(currentLevel < 4) {
                loadArtQuestLevel();
            } else {
                showFinalStudioScreen();
            }
        }

        function showFinalStudioScreen() {
            document.getElementById('arenaStage').classList.add('hidden');
            document.getElementById('endStudioPanel').classList.remove('hidden');
            document.getElementById('endScoreValue').innerText = `Final Score: ${runningScore} / 4 Drawings Completed!`;
            playSound('applause');
        }

        function replayQuestEngine() {
            document.getElementById('endStudioPanel').classList.add('hidden');
            document.getElementById('arenaStage').classList.remove('hidden');
            startQuestEngine();
        }
    </script>
</body>
</html>
