<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Challenge</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f7f3fc, #e0f7fa);
}
#gameCanvas {
  display: block;
  margin: 20px auto;
  border: 2px solid #ccc;
  touch-action: none;
  background: #fff;
}
#instruction {
  text-align: center;
  font-size: 18px;
  margin: 5px;
  color: #333;
}
#endScreen {
  display: none;
  text-align: center;
  font-size: 28px;
  color: #2e7d32;
  padding-top: 50px;
}
button {
  padding: 10px 20px;
  font-size: 18px;
  margin-top: 20px;
  cursor: pointer;
}
</style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="500"></canvas>
<div id="instruction">Loading...</div>
<div id="endScreen">
  <div>🎉 Well Done! 🎉</div>
  <button id="playAgainBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const instruction = document.getElementById('instruction');
const endScreen = document.getElementById('endScreen');
const playAgainBtn = document.getElementById('playAgainBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');

let level = 0;
let attempts = 0;

// Points
const points = [
  {x:100, y:100, label:'A'}, 
  {x:300, y:100, label:'B'}, 
  {x:100, y:300, label:'C'}, 
  {x:300, y:300, label:'D'}
];

// Levels
const levels = [
  {type:'identifyPoint', question:'Tap point B', answer:'B'},
  {type:'lineSegment', question:'Draw a line segment from A to B', from:'A', to:'B'},
  {type:'ray', question:'Draw a ray from C through D', from:'C', to:'D'},
  {type:'shape', question:'Which shape is formed by points A, B, D, C?', options:['Triangle','Square','Rectangle'], answer:'Square'},
  {type:'mcq', question:'A line segment has two endpoints. True or False?', options:['True','False'], answer:'True'}
];

let dragging = false;
let dragStart = null;

// Draw points
function drawPoints() {
  points.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x, p.y, 12, 0, Math.PI*2);
    ctx.fillStyle = '#ff5722';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = '16px Arial';
    ctx.fillText(p.label, p.x-5, p.y-15);
  });
}

// Start a level
function startLevel() {
  attempts = 0;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawPoints();
  const lv = levels[level];
  instruction.innerText = lv.question;

  // Remove old listeners
  canvas.replaceWith(canvas.cloneNode(true));
  const newCanvas = document.getElementById('gameCanvas');
  canvas = newCanvas;

  if(lv.type==='identifyPoint') canvas.addEventListener('click', handlePointClick);
  else if(lv.type==='lineSegment'||lv.type==='ray'){
    canvas.addEventListener('pointerdown', startDrag);
    canvas.addEventListener('pointermove', dragMove);
    canvas.addEventListener('pointerup', endDrag);
  } else if(lv.type==='shape'||lv.type==='mcq'){
    drawOptions(lv);
  }
}

// Utilities
function getPointByLabel(label){ return points.find(p=>p.label===label); }

// Identify point
function handlePointClick(e){
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const lv = levels[level];
  const clickedPoint = points.find(p=>Math.hypot(x-p.x, y-p.y)<15);
  if(clickedPoint){
    if(clickedPoint.label===lv.answer) correct();
    else wrong();
  }
}

// Line & ray drag
function startDrag(e){
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const lv = levels[level];
  const fromPoint = getPointByLabel(lv.from);
  if(Math.hypot(x-fromPoint.x, y-fromPoint.y)<15){ dragging=true; dragStart=fromPoint; }
}
function dragMove(e){
  if(!dragging) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawPoints();
  ctx.beginPath();
  ctx.moveTo(dragStart.x, dragStart.y);
  ctx.lineTo(x, y);
  ctx.strokeStyle = '#2196f3';
  ctx.lineWidth = 4;
  ctx.stroke();
}
function endDrag(e){
  if(!dragging) return;
  dragging=false;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const lv = levels[level];
  const toPoint = getPointByLabel(lv.to);
  if(Math.hypot(x-toPoint.x, y-toPoint.y)<25) correct();
  else wrong();
}

// Draw MCQ options
function drawOptions(lv){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawPoints();
  const startY=380;
  lv.options.forEach((opt,i)=>{
    ctx.fillStyle='#80deea';
    ctx.fillRect(50, startY+i*50, 300, 40);
    ctx.fillStyle='#000';
    ctx.font='18px Arial';
    ctx.fillText(opt, 70, startY+i*50+28);
  });
  canvas.addEventListener('click', function(e){
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    lv.options.forEach((opt,i)=>{
      if(x>50 && x<350 && y>startY+i*50 && y<startY+i*50+40){
        if(opt===lv.answer) correct();
        else wrong();
      }
    });
  });
}

// Feedback
function correct(){
  correctSound.play();
  showConfetti();
  setTimeout(nextLevel, 700);
}
function wrong(){
  wrongSound.play();
  attempts++;
  if(attempts>=2) setTimeout(nextLevel,700);
}

// Next level
function nextLevel(){
  level++;
  if(level<levels.length) startLevel();
  else showEndScreen();
}

// End screen
function showEndScreen(){
  canvas.style.display='none';
  instruction.style.display='none';
  endScreen.style.display='block';
}

// Play again
playAgainBtn.addEventListener('click', ()=>{
  canvas.style.display='block';
  instruction.style.display='block';
  endScreen.style.display='none';
  level=0;
  startLevel();
});

// Confetti animation
function showConfetti(){
  const confetti = [];
  for(let i=0;i<100;i++){
    confetti.push({x:Math.random()*canvas.width, y:0, dy:Math.random()*4+2, color:`hsl(${Math.random()*360},100%,50%)`});
  }
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawPoints();
    confetti.forEach(c=>{
      ctx.fillStyle=c.color;
      ctx.fillRect(c.x, c.y, 5, 10);
      c.y+=c.dy;
    });
    if(confetti.some(c=>c.y<canvas.height)) requestAnimationFrame(animate);
  }
  animate();
}

// Start first level
window.onload = startLevel;
</script>
</body>
</html>
