<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Art Quest!</title>
    <style>
        :root {
            --sky: #38BDF8;
            --grass: #4ADE80;
            --dark: #0F172A;
            --purple: #4F46E5;
            --amber: #F59E0B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* --- SOLID WHITE SPLASH SCREEN (EXACTLY 5 SECONDS) --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen img { max-width: 60%; max-height: 50%; object-fit: contain; }

        .game-machine {
            background: #FFFFFF;
            border: 8px solid var(--dark);
            border-radius: 40px;
            width: 100%;
            max-width: 760px;
            padding: 25px;
            box-shadow: 0 24px 0px var(--dark);
            position: relative;
        }

        h1 {
            color: var(--purple);
            font-size: 2.3rem;
            text-shadow: 3px 3px 0px #DDD;
            margin-bottom: 10px;
        }

        .progress-station {
            background: #E2E8F0;
            border: 4px solid var(--dark);
            height: 30px;
            border-radius: 20px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 25%;
            background: linear-gradient(90deg, #FF007F, #FFB600, #00F0FF);
            transition: width 0.4s ease;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
            background: #F8FAFC;
            padding: 10px 20px;
            border-radius: 20px;
            border: 4px solid var(--dark);
            margin-bottom: 15px;
        }

        /* CANVAS MAIN SCREEN */
        .art-canvas {
            background: #7DD3FC; 
            border: 6px solid var(--dark);
            border-radius: 32px;
            height: 380px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow: hidden;
            box-shadow: inset 0 10px 0 rgba(0,0,0,0.1);
        }

        .speech-bubble {
            background: white;
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 10px 18px;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--dark);
            width: 95%;
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
            z-index: 10;
            margin-bottom: 10px;
        }

        /* BACKGROUND SCENE ARTWORKS */
        .art-back-scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        /* House Scene */
        .house-body {
            width: 220px; height: 140px; background: #EF4444;
            border: 4px solid var(--dark); position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            border-radius: 12px;
        }
        .house-door {
            width: 50px; height: 80px; background: #FDE047;
            border: 4px solid var(--dark); position: absolute; bottom: 0; left: 81px;
            border-radius: 6px 6px 0 0;
        }

        /* Sun Scene */
        .sun-body {
            width: 120px; height: 120px; background: #F59E0B;
            border-radius: 50%; border: 5px solid var(--dark);
            position: absolute; left: 50px; top: 60px;
        }

        /* Ice Cream Cone Scene */
        .cone-waffle {
            width: 0; height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-top: 140px solid #D97706;
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        }

        /* Castle Scene */
        .castle-wall {
            width: 280px; height: 100px; background: #94A3B8;
            border: 5px solid var(--dark); position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            display: flex; justify-content: space-around;
        }
        .castle-fort { width: 40px; height: 40px; background: #64748B; border: 4px solid var(--dark); margin-top: -25px; }

        /* DROP TARGET HIGHLIGHTS */
        .line-drop-target {
            position: absolute;
            background: rgba(255, 255, 255, 0.35);
            border: 4px dashed #FFFF00;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 20;
            box-shadow: 0 0 15px rgba(252, 211, 77, 0.7);
            transition: background-color 0.2s, border-color 0.2s;
        }
        .line-drop-target.hovered {
            background: rgba(254, 240, 138, 0.7);
            border-style: solid;
        }
        .line-drop-target.filled {
            border: 4px solid transparent;
            background: transparent;
            box-shadow: none;
        }

        /* SYSTEM LINE VECTOR STRUCTURES */
        .geo-line-asset {
            width: 100%;
            height: 16px;
            border-radius: 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tray-slot-bin .geo-line-asset {
            width: 180px;
            cursor: grab;
        }
        .tray-slot-bin .geo-line-asset:active { cursor: grabbing; }

        .asset-segment { background: #EF4444; }
        .asset-ray { background: #10B981; }
        .asset-line { background: #3B82F6; }

        .cap-dot {
            width: 24px; height: 24px; background: #EF4444;
            border: 3px solid white; border-radius: 50%;
            position: absolute; z-index: 5;
        }
        .cap-dot.left { left: -10px; }
        .cap-dot.right { right: -10px; }
        .asset-ray .cap-dot.left { background: #10B981; }

        .cap-arrow-r {
            width: 0; height: 0;
            border-top: 14px solid transparent; border-bottom: 14px solid transparent;
            border-left: 22px solid #10B981; position: absolute; right: -14px; z-index: 5;
        }
        .cap-arrow-l {
            width: 0; height: 0;
            border-top: 14px solid transparent; border-bottom: 14px solid transparent;
            border-right: 22px solid #3B82F6; position: absolute; left: -14px; z-index: 5;
        }
        .cap-arrow-r-blue {
            width: 0; height: 0;
            border-top: 14px solid transparent; border-bottom: 14px solid transparent;
            border-left: 22px solid #3B82F6; position: absolute; right: -14px; z-index: 5;
        }

        /* ASSET SELECTION TRAY */
        .tray-station-wrapper {
            background: #F1F5F9; border: 4px solid var(--dark);
            border-radius: 28px; padding: 15px;
            display: flex; justify-content: center; gap: 20px;
            margin-bottom: 20px; box-shadow: inset 0 6px 0 #CBD5E1;
            min-height: 100px; align-items: center;
        }
        .tray-slot-bin {
            background: white; border: 4px solid #94A3B8; border-radius: 20px;
            padding: 10px 25px; min-width: 210px; height: 75px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 0 #94A3B8;
        }

        /* CONTROL BUTTONS */
        .control-room { display: flex; gap: 15px; }
        .btn-trash {
            background: #EF4444; color: white; font-size: 1.3rem; font-weight: bold;
            padding: 12px 25px; border: 4px solid var(--dark); border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 0 var(--dark);
        }
        .btn-trash:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--dark); }

        .btn-go {
            flex-grow: 1; background: #22C55E; color: white; font-size: 1.6rem; font-weight: bold;
            padding: 12px 30px; border: 4px solid var(--dark); border-radius: 50px;
            cursor: pointer; box-shadow: 0 6px 0 var(--dark); text-shadow: 2px 2px 0 var(--dark);
        }
        .btn-go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--dark); }

        /* THEMED HUD POPUPS (REPLACES PLAIN BROWSER ALERTS) */
        .fun-popup {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98); border-radius: 32px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 30; padding: 20px; border: 6px solid var(--purple);
            animation: popUpArt 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }
        @keyframes popUpArt { from { scale: 0.7; opacity: 0; } to { scale: 1; opacity: 1; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img id="splashLogo" src="assets/logo.png" alt="Logo">
    </div>

    <audio id="audioRight" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="audioWrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="game-machine">
        
        <div id="popupCelebration" class="fun-popup hidden">
            <div style="font-size: 5.5rem;" id="popEmoji">🎉</div>
            <h2 style="font-size: 2.3rem; color: var(--purple); margin: 10px 0;" id="popTitle">Awesome Drawing!</h2>
            <p style="font-size: 1.3rem; font-weight: bold; color: #475569; margin-bottom: 20px;" id="popMsg">It looks perfect!</p>
            <button id="popActionBtn" class="btn-go" style="flex-grow:0; padding: 10px 40px;" onclick="handlePopupDismissal()">Next Drawing 🚀</button>
        </div>

        <div id="arenaStage">
            <h1>Art Geometry Quest! 🎨</h1>
            
            <div class="progress-station"><div id="progressFill"></div></div>
            
            <div class="score-board">
                <span id="txtQuestNum">Drawing: 1 / 4</span>
                <span id="txtScore">Score: 0 ⭐</span>
            </div>

            <div class="art-canvas" id="canvasScreenView">
                <div class="speech-bubble" id="txtInstruction">Loading Mission...</div>
                <div class="art-back-scene" id="vectorSceneBackdrop"></div>
            </div>

            <p style="text-align: left; font-weight: bold; color: var(--dark); margin-top: 12px; margin-bottom: 8px;">
                🎁 Drag the right line into the flashing yellow box to complete the drawing!
            </p>
            <div class="tray-station-wrapper" id="toyTrayBox"></div>

            <div class="control-room">
                <button class="btn-trash" onclick="clearActiveLineDrop()">Reset 🔄</button>
                <button class="btn-go" onclick="verifyActiveArtwork()">Check Artwork! ✔️</button>
            </div>
        </div>

        <div id="endStudioPanel" class="hidden" style="text-align: center; padding: 20px;">
            <h2 style="font-size: 2.8rem; color: var(--purple);">Art Studio Complete! 🏆</h2>
            <div style="font-size: 6rem; margin: 15px 0;">👑🌟🎨</div>
            <p id="endScoreValue" style="font-size: 2rem; font-weight: bold; color: var(--dark); margin-bottom: 30px;"></p>
            <button class="btn-go" style="flex-grow:0;" onclick="replayQuestEngine()">Play Again! 🎉</button>
        </div>

    </div>

    <script>
        window.onload = function() {
            // Unconditional 5-second splash bypass trigger
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.style.opacity = 0;
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 5000); 
            startQuestEngine();
        };

        function playSound(type) {
            const el = document.getElementById(type === 'right' ? 'audioRight' : 'audioWrong');
            if(el) { el.currentTime = 0; el.play().catch(()=>{}); }
        }

        let currentLevel = 0;
        let runningScore = 0;
        let secondChance = false;
        let draggedLineType = null;
        let placedLineType = null;
        let isIncorrectPopupState = false;

        const questBook = [
            {
                msg: "🏠 Complete the House Roof! A horizontal roof beam needs 2 fixed endpoints. Drag the RED LINE SEGMENT to finish the house!",
                sceneHtml: '<div class="house-body"><div class="house-door"></div></div>',
                targetStyle: "width: 210px; height: 24px; bottom: 164px; left: 50%; transform: translateX(-50%);",
                correctLine: "segment",
                trayOptions: ["segment", "ray", "line"]
            },
            {
                msg: "☀️ Draw the Missing Sun Ray! A sun ray starts at a point on the sun and shoots slanting downward. Drag the GREEN RAY into the box!",
                sceneHtml: '<div class="sun-body"></div>',
                targetStyle: "width: 200px; height: 24px; left: 160px; top: 155px; transform: rotate(35deg); transform-origin: left center;",
                correctLine: "ray",
                trayOptions: ["line", "ray", "segment"]
            },
            {
                msg: "🍦 Complete the Ice Cream Cone! A scoop needs a straight flat top going on forever both ways. Drag the BLUE LINE onto the cone!",
                sceneHtml: '<div class="cone-waffle"></div>',
                targetStyle: "width: 210px; height: 24px; bottom: 156px; left: 50%; transform: translateX(-50%);",
                correctLine: "line",
                trayOptions: ["segment", "line", "ray"]
            },
            {
                msg: "🏰 Finish the Castle Guard Post! A vertical fence barrier needs two solid endpoints. Drag the RED LINE SEGMENT up onto the castle wall!",
                sceneHtml: '<div class="castle-wall"><div class="castle-fort"></div><div class="castle-fort"></div></div>',
                targetStyle: "width: 24px; height: 130px; bottom: 90px; left: 50%; transform: translateX(-50%);",
                correctLine: "segment",
                trayOptions: ["ray", "segment", "line"]
            }
        ];

        function startQuestEngine() {
            currentLevel = 0; runningScore = 0; secondChance = false;
            loadArtQuestLevel();
        }

        function loadArtQuestLevel() {
            const levelData = questBook[currentLevel];
            placedLineType = null;
            secondChance = false;

            document.getElementById('txtQuestNum').innerText = `Drawing: ${currentLevel + 1} / 4`;
            document.getElementById('txtScore').innerText = `Score: ${runningScore} ⭐`;
            document.getElementById('progressFill').style.width = `${((currentLevel + 1) / 4) * 100}%`;
            document.getElementById('txtInstruction').innerText = levelData.msg;

            const backdrop = document.getElementById('vectorSceneBackdrop');
            backdrop.innerHTML = levelData.sceneHtml;

            const oldTarget = document.getElementById('activeArtTargetZone');
            if(oldTarget) oldTarget.remove();

            const canvas = document.getElementById('canvasScreenView');
            const targetZone = document.createElement('div');
            targetZone.id = "activeArtTargetZone";
            targetZone.className = "line-drop-target";
            targetZone.style = levelData.targetStyle;

            targetZone.addEventListener('dragover', (e) => { e.preventDefault(); targetZone.classList.add('hovered'); });
            targetZone.addEventListener('dragleave', () => targetZone.classList.remove('hovered'));
            targetZone.addEventListener('drop', (e) => {
                e.preventDefault();
                targetZone.classList.remove('hovered');
                dropLineIntoArtwork(targetZone);
            });
            targetZone.addEventListener('click', () => clearActiveLineDrop());

            canvas.appendChild(targetZone);

            const tray = document.getElementById('toyTrayBox');
            tray.innerHTML = '';

            levelData.trayOptions.forEach(type => {
                const bin = document.createElement('div');
                bin.className = "tray-slot-bin";

                const lineAsset = document.createElement('div');
                lineAsset.className = `geo-line-asset asset-${type}`;
                lineAsset.draggable = true;
                lineAsset.innerHTML = getLineMarkup(type);

                lineAsset.addEventListener('dragstart', () => { draggedLineType = type; });
                bin.appendChild(lineAsset);
                tray.appendChild(bin);
            });
        }

        function getLineMarkup(type) {
            if(type === 'segment') {
                return '<div class="cap-dot left"></div><div class="cap-dot right"></div>';
            } else if(type === 'ray') {
                return '<div class="cap-dot left"></div><div class="cap-arrow-r"></div>';
            } else if(type === 'line') {
                return '<div class="cap-arrow-l"></div><div class="cap-arrow-r-blue"></div>';
            }
            return '';
        }

        function dropLineIntoArtwork(targetZoneElement) {
            if(!draggedLineType) return;
            placedLineType = draggedLineType;
            targetZoneElement.classList.add('filled');
            
            let orientationStyles = (currentLevel === 3) ? 'width:100%; height:100%; flex-direction: column;' : 'width:100%; height:100%;';
            targetZoneElement.innerHTML = `<div class="geo-line-asset asset-${placedLineType}" style="${orientationStyles}">${getLineMarkup(placedLineType)}</div>`;
        }

        function clearActiveLineDrop() {
            placedLineType = null;
            const targetZone = document.getElementById('activeArtTargetZone');
            if(targetZone) {
                targetZone.classList.remove('filled');
                targetZone.innerHTML = '';
            }
        }

        function verifyActiveArtwork() {
            const levelData = questBook[currentLevel];

            if(placedLineType === levelData.correctLine) {
                runningScore++;
                playSound('right');
                showFeedbackPopup(true, "Awesome Drawing!", "It looks perfect! Ready for the next project.");
            } else {
                playSound('wrong');
                if(!secondChance) {
                    secondChance = true;
                    showFeedbackPopup(false, "Not Quite Right!", "Look closely at the arrow tips or dots on your geometric line and try another one!");
                } else {
                    const targetZone = document.getElementById('activeArtTargetZone');
                    if(targetZone) {
                        targetZone.classList.add('filled');
                        let orientationStyles = (currentLevel === 3) ? 'width:100%; height:100%; flex-direction: column;' : 'width:100%; height:100%;';
                        targetZone.innerHTML = `<div class="geo-line-asset asset-${levelData.correctLine}" style="${orientationStyles}">${getLineMarkup(levelData.correctLine)}</div>`;
                    }
                    showFeedbackPopup(false, "Let's Complete It!", "Let's see how this vector line completes our structural layout beautifully!");
                    isIncorrectPopupState = true;
                }
            }
        }

        function showFeedbackPopup(isCorrect, title, message) {
            const popup = document.getElementById('popupCelebration');
            const emojiEl = document.getElementById('popEmoji');
            const titleEl = document.getElementById('popTitle');
            const msgEl = document.getElementById('popMsg');
            const btnEl = document.getElementById('popActionBtn');

            titleEl.innerText = title;
            msgEl.innerText = message;
            isIncorrectPopupState = false;

            if(isCorrect) {
                const emojis = ["🏠🎉", "☀️✨", "🍦🍭", "🏰⚔️"];
                emojiEl.innerText = emojis[currentLevel];
                btnEl.innerText = "Next Drawing 🚀";
            } else {
                emojiEl.innerText = "🔍❌";
                btnEl.innerText = "Try Again 🔄";
            }
            popup.classList.remove('hidden');
        }

        function handlePopupDismissal() {
            document.getElementById('popupCelebration').classList.add('hidden');
            if (isIncorrectPopupState || secondChance === false) {
                currentLevel++;
                if(currentLevel < 4) {
                    loadArtQuestLevel();
                } else {
                    showFinalStudioScreen();
                }
            }
        }

        function showFinalStudioScreen() {
            document.getElementById('arenaStage').classList.add('hidden');
            document.getElementById('endStudioPanel').classList.remove('hidden');
            document.getElementById('endScoreValue').innerText = `Final Score: ${runningScore} / 4 Artwork Designs Correctly Built!`;
            playSound('right');
        }

        function replayQuestEngine() {
            document.getElementById('endStudioPanel').classList.add('hidden');
            document.getElementById('arenaStage').classList.remove('hidden');
            startQuestEngine();
        }
    </script>
</body>
</html>
