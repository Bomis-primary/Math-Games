<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2: Build the Golden Sun Castle</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f0f7ff;        /* Soft sky blue */
            --glass-bg: #ffffff;
            --glass-border: #cbd5e1;
            
            --primary: #3b82f6;
            --secondary: #ff70a6;
            --accent: #4ade80;
            
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            --font-ui: 'Quicksand', sans-serif;
            --font-title: 'Fredoka', sans-serif;
            
            --transition-bounce: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(#e0f2fe 3px, transparent 3px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }

        .splash-logo-container {
            margin-bottom: 2rem;
            text-align: center;
        }

        .splash-fallback-text {
            font-family: var(--font-title);
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 2px 2px 0px #e0f2fe, 5px 5px 0px rgba(59, 130, 246, 0.1);
            letter-spacing: 1px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 6px solid #f1f5f9;
            border-bottom-color: #ff70a6;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- MAIN LAYOUT WINDOW --- */
        .game-wrapper {
            position: relative;
            z-index: 1;
            width: 92vw;
            max-width: 1150px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 2.2rem;
            box-shadow: 0 30px 60px rgba(148, 163, 184, 0.12);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-family: var(--font-title);
            font-size: 2.4rem;
            font-weight: 700;
            color: #0f172a;
        }

        .progress-container {
            width: 260px;
            background: #f1f5f9;
            height: 16px;
            border-radius: 99px;
            overflow: hidden;
            border: 2px solid #e2e8f0;
        }

        .progress-bar {
            height: 100%;
            width: 0%; 
            background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
            border-radius: 99px;
            transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- CANVASES MAP VIEWER --- */
        .canvas-container {
            position: relative;
            background: #ffffff;
            border: 3px solid #cbd5e1;
            border-radius: 24px;
            padding: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.01);
            transition: var(--transition-bounce);
        }

        .canvas-container.target-active {
            border-color: var(--primary);
            background: #fdfdfd;
            transform: scale(1.002);
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* --- GEOMETRIC GROOVE TILES BAR --- */
        .toolbar-section {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .toolbar-title {
            font-family: var(--font-title);
            font-size: 1.2rem;
            color: #475569;
            font-weight: 600;
        }

        .assets-shelf {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            background: #f8fafc;
            border: 3px dashed #cbd5e1;
            padding: 1.2rem;
            border-radius: 24px;
            min-height: 140px;
            align-items: center;
            justify-content: center;
        }

        /* Groove Shape Draggable Tiles */
        .shape-tile {
            background: #ffffff;
            border: 3px solid #e2e8f0;
            padding: 1rem;
            border-radius: 20px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            transition: var(--transition-bounce);
            user-select: none;
            width: 130px;
            box-shadow: 0 6px 12px rgba(148, 163, 184, 0.08);
        }

        .shape-tile:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 16px 24px rgba(59, 130, 246, 0.12);
        }

        .shape-tile:active {
            cursor: grabbing;
            transform: translateY(0) scale(0.92);
        }

        /* SVG Shape Render Styling */
        .groove-svg {
            width: 70px;
            height: 55px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
        }

        .tile-text {
            font-weight: 700;
            font-size: 0.9rem;
            color: #475569;
            text-align: center;
        }

        .shape-tile.placed {
            opacity: 0.15;
            pointer-events: none;
            transform: scale(0.85);
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-fallback-text">🏰 GOLDEN SUN CASTLE ☀️</div>
        </div>
        <div class="loader"></div>
    </div>

    <div class="game-wrapper">
        
        <header class="game-header">
            <h1 class="game-title" id="studio-title">Level 2: Build the Golden Sun Castle</h1>
            <div class="progress-container">
                <div class="progress-bar" id="studio-progress"></div>
            </div>
        </header>

        <div class="canvas-container" id="canvas-viewport">
            <canvas id="studioCanvas" width="900" height="420"></canvas>
        </div>

        <section class="toolbar-section">
            <h2 class="toolbar-title">Complete the drawing by placing the shape tiles! 👇</h2>
            <div class="assets-shelf" id="shapes-shelf">
                </div>
        </section>

    </div>

    <script>
        // Audio Element Polyfills
        function createSafeAudio(src) {
            const audio = new Audio(src);
            audio.addEventListener('error', () => {
                audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==';
            });
            return audio;
        }
        const soundClaps = createSafeAudio('assets/claps.mp3');

        // Castle Architecture Blueprint Map Configuration
        const castleLevel = {
            targets: [
                { id: "trapezoid-wall", type: "trapezoid", x: 450, y: 310, color: "#4ade80", label: "Trapezoid Wall", completed: false },
                { id: "arched-window", type: "arch", x: 450, y: 220, color: "#a855f7", label: "Arched Window", completed: false },
                { id: "rhombus-banner", type: "rhombus", x: 450, y: 75, color: "#06b6d4", label: "Rhombus Banner", completed: false },
                { id: "turrent-base", type: "pentagon", x: 230, y: 240, color: "#f97316", label: "Turret Base", completed: false },
                { id: "round-tower-top", type: "circle", x: 670, y: 150, color: "#facc15", label: "Round Tower Top", completed: false }
            ],
            // Master coordinates array for the exquisite dotted lines map vector sketch background
            dottedLines: [
                // Ground Base Arc
                { type: "arc", cx: 450, cy: 580, r: 240, sA: Math.PI, eA: 0 },
                // Center Main Tower Frame
                { type: "line", x1: 380, y1: 370, x2: 380, y2: 150 },
                { type: "line", x1: 520, y1: 370, x2: 520, y2: 150 },
                { type: "line", x1: 380, y1: 150, x2: 450, y2: 70 },
                { type: "line", x1: 520, y1: 150, x2: 450, y2: 70 },
                // Left Spire Tower Side
                { type: "line", x1: 230, y1: 370, x2: 230, y2: 200 },
                { type: "line", x1: 300, y1: 370, x2: 300, y2: 200 },
                { type: "line", x1: 230, y1: 200, x2: 265, y2: 110 },
                { type: "line", x1: 300, y1: 200, x2: 265, y2: 110 },
                // Right Circle Tower Side
                { type: "line", x1: 600, y1: 370, x2: 600, y2: 180 },
                { type: "line", x1: 670, y1: 370, x2: 670, y2: 180 },
                // Connecting Walls
                { type: "line", x1: 300, y1: 280, x2: 380, y2: 280 },
                { type: "line", x1: 520, y1: 280, x2: 600, y2: 280 }
            ],
            // Little pink dots mapping key geometric corners
            dots: [
                {x: 380, y: 370}, {x: 520, y: 370}, {x: 450, y: 70}, 
                {x: 230, y: 370}, {x: 300, y: 370}, {x: 265, y: 110},
                {x: 600, y: 370}, {x: 670, y: 370}
            ]
        };

        // Complete SVG Graphic Path Dictionary for the Custom Grooved Block look
        const svgShapeTemplates = {
            trapezoid: `<path d="M15,45 L25,10 L45,10 L55,45 Z" fill="#4ade80" stroke="#16a34a" stroke-width="3"/>
                        <path d="M20,40 L28,16 L42,16 L50,40 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>`,
            arch: `<path d="M20,45 L20,25 A15,15 0 0,1 50,25 L50,45 Z" fill="#a855f7" stroke="#7e22ce" stroke-width="3"/>
                   <path d="M25,45 L25,26 A10,10 0 0,1 45,26 L45,45 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>`,
            rhombus: `<path d="M35,5 L55,27 L35,49 L15,27 Z" fill="#06b6d4" stroke="#0891b2" stroke-width="3"/>
                      <path d="M35,11 L48,27 L35,43 L22,27 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>`,
            pentagon: `<path d="M35,8 L55,24 L47,48 L23,48 L15,24 Z" fill="#f97316" stroke="#ea580c" stroke-width="3"/>
                       <path d="M35,14 L50,27 L43,44 L27,44 L20,27 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>`,
            circle: `<circle cx="35" cy="27" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
                     <circle cx="35" cy="27" r="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>`
        };

        let draggedDataId = null;
        const canvas = document.getElementById('studioCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('canvas-viewport');

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => { splash.remove(); initGame(); }, 500);
                }
            }, 5000);
        });

        function initGame() {
            renderShelf();
            drawCanvas();
            setupDragDrop();
        }

        function renderShelf() {
            const shelf = document.getElementById('shapes-shelf');
            shelf.innerHTML = '';

            castleLevel.targets.forEach(shape => {
                const tile = document.createElement('div');
                tile.className = 'shape-tile';
                if(shape.completed) tile.classList.add('placed');
                tile.setAttribute('draggable', 'true');
                tile.setAttribute('data-id', shape.id);

                // Build custom inner inline SVG container matching the user visual look
                const svgContainer = document.createElement('div');
                svgContainer.className = 'groove-svg';
                svgContainer.innerHTML = `<svg viewBox="0 0 70 54" width="100%" height="100%">${svgShapeTemplates[shape.type]}</svg>`;
                
                const label = document.createElement('span');
                label.className = 'tile-text';
                label.innerText = shape.label;

                tile.appendChild(svgContainer);
                tile.appendChild(label);

                tile.addEventListener('dragstart', () => {
                    draggedDataId = shape.id;
                    viewport.classList.add('target-active');
                });
                tile.addEventListener('dragend', () => viewport.classList.remove('target-active'));

                shelf.appendChild(tile);
            });

            // Handle progress track alignment computations
            const finished = castleLevel.targets.filter(t => t.completed).length;
            document.getElementById('studio-progress').style.width = `${(finished / castleLevel.targets.length) * 100}%`;
        }

        // Dedicated Vector Geometry Draw Factory for Canvas Shapes
        function drawGrooveShapeOnCanvas(type, x, y, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // Generate precise matching base path alignments
            ctx.beginPath();
            if (type === "trapezoid") {
                ctx.moveTo(-40, 25); ctx.lineTo(-25, -25); ctx.lineTo(25, -25); ctx.lineTo(40, 25);
            } else if (type === "arch") {
                ctx.moveTo(-25, 30); ctx.lineTo(-25, -5); ctx.arc(0, -5, 25, Math.PI, 0); ctx.lineTo(25, 30);
            } else if (type === "rhombus") {
                ctx.moveTo(0, -32); ctx.lineTo(32, 0); ctx.lineTo(0, 32); ctx.lineTo(-32, 0);
            } else if (type === "pentagon") {
                for (let i = 0; i < 5; i++) {
                    let angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
                    ctx.lineTo(32 * Math.cos(angle), 32 * Math.sin(angle));
                }
            } else if (type === "circle") {
                ctx.arc(0, 0, 26, 0, Math.PI * 2);
            }
            ctx.closePath();
            ctx.fill();

            // Draw crisp solid inner accent groove lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            if (type === "trapezoid") {
                ctx.moveTo(-32, 17); ctx.lineTo(-20, -17); ctx.lineTo(20, -17); ctx.lineTo(32, 17);
            } else if (type === "arch") {
                ctx.moveTo(-18, 30); ctx.lineTo(-18, -5); ctx.arc(0, -5, 18, Math.PI, 0); ctx.lineTo(18, 30);
            } else if (type === "rhombus") {
                ctx.moveTo(0, -22); ctx.lineTo(22, 0); ctx.lineTo(0, 22); ctx.lineTo(-22, 0);
            } else if (type === "pentagon") {
                for (let i = 0; i < 5; i++) {
                    let angle = (i * 2 * Math.PI / 5) - Math.PI / 2;
                    ctx.lineTo(22 * Math.cos(angle), 22 * Math.sin(angle));
                }
            } else if (type === "circle") {
                ctx.arc(0, 0, 17, 0, Math.PI * 2);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Creative Landscape Background (Beautiful cartoon hill backdrop context)
            ctx.fillStyle = '#e8f7e6';
            ctx.beginPath();
            ctx.arc(450, 590, 240, Math.PI, 0);
            ctx.fill();

            // 1. Draw Master Dotted-Line Castle Blueprint Guide Maps
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;
            ctx.setLineDash([6, 6]);
            castleLevel.dottedLines.forEach(item => {
                ctx.beginPath();
                if (item.type === "line") {
                    ctx.moveTo(item.x1, item.y1); ctx.lineTo(item.x2, item.y2);
                } else if (item.type === "arc") {
                    ctx.arc(item.cx, item.cy, item.r, item.sA, item.eA);
                }
                ctx.stroke();
            });
            ctx.setLineDash([]); // Reset line mask

            // 2. Draw Target Pieces Guidelines
            castleLevel.targets.forEach(target => {
                if (!target.completed) {
                    // Transparent grey placeholders for empty slots
                    ctx.save();
                    ctx.globalAlpha = 0.12;
                    drawGrooveShapeOnCanvas(target.type, target.x, target.y, "#475569");
                    ctx.restore();
                } else {
                    // Draw full vivid color groove shape blocks once placed successfully
                    drawGrooveShapeOnCanvas(target.type, target.x, target.y, target.color);
                }
            });

            // 3. Highlight Castle Map Node Vertices with soft pink map dots
            castleLevel.dots.forEach(dot => {
                ctx.fillStyle = '#ff70a6';
                ctx.beginPath(); ctx.arc(dot.x, dot.y, 6, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();
            });
        }

        function setupDragDrop() {
            viewport.addEventListener('dragover', (e) => e.preventDefault());
            viewport.addEventListener('drop', (e) => {
                e.preventDefault();
                viewport.classList.remove('target-active');

                const currentMatch = castleLevel.targets.find(t => t.id === draggedDataId);
                if (currentMatch && !currentMatch.completed) {
                    currentMatch.completed = true;
                    soundClaps.play().catch(() => {});
                    renderShelf();
                    drawCanvas();

                    // Check level finish conditions
                    if (castleLevel.targets.every(t => t.completed)) {
                        setTimeout(() => {
                            document.getElementById('studio-title').innerText = "✨ Magic Golden Castle Built! ✨";
                            viewport.style.background = "#fffbeb"; /* Radiant yellow sun win glow tint */
                            viewport.style.borderColor = "var(--accent)";
                        }, 300);
                    }
                }
            });
        }
    </script>
</body>
</html>
