<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 5: Magic Geometry Art Studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CHILD-FRIENDLY LIGHT DESIGN SYSTEM --- */
        :root {
            --bg-color: #f8fafc;        /* Ultra light, clean canvas background */
            --glass-bg: #ffffff;        /* Pure white card containers */
            --glass-border: #e2e8f0;    /* Soft grey definition borders */
            
            --primary: #3b82f6;       /* Playful Sky Blue */
            --secondary: #ff70a6;     /* Bubblegum Pink */
            --accent: #4ade80;        /* Bright Mint Green */
            
            --text-main: #1e293b;     /* High contrast charcoal */
            --text-muted: #64748b;
            
            --font-ui: 'Quicksand', sans-serif;
            --font-title: 'Fredoka', sans-serif;
            
            --transition-bounce: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- RESET & BASE STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-color);
            /* Super soft, clean geometric blueprint grid for drawing backdrop context */
            background-image: linear-gradient(rgba(226, 232, 240, 0.6) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(226, 232, 240, 0.6) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }

        .splash-logo-container {
            margin-bottom: 2rem;
            text-align: center;
        }

        .splash-logo {
            max-width: 180px;
            height: auto;
        }

        .splash-fallback-text {
            font-family: var(--font-title);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 2px 2px 0px #f0fdf4, 4px 4px 0px rgba(59, 130, 246, 0.1);
            letter-spacing: 1px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 6px solid #f1f5f9;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- MAIN STUDIO WORKBENCH CARD --- */
        .game-wrapper {
            position: relative;
            z-index: 1;
            width: 90vw;
            max-width: 1100px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(148, 163, 184, 0.15);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* --- HEADER & LOADING TRACK --- */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-title {
            font-family: var(--font-title);
            font-size: 2.2rem;
            font-weight: 700;
            color: #0f172a;
        }

        .progress-container {
            width: 240px;
            background: #f1f5f9;
            height: 14px;
            border-radius: 99px;
            overflow: hidden;
            border: 2px solid #e2e8f0;
        }

        .progress-bar {
            height: 100%;
            width: 0%; 
            background: linear-gradient(90deg, var(--secondary) 0%, #f43f5e 100%);
            border-radius: 99px;
            transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- DIGITAL ART WORKSPACE --- */
        .canvas-container {
            position: relative;
            background: #ffffff;
            border: 3px solid #cbd5e1;
            border-radius: 24px;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: var(--transition-bounce);
        }

        /* Interactive pulse state when element drag is active */
        .canvas-container.target-active {
            border-color: var(--primary);
            background: #f8fafc;
            transform: scale(1.005);
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }

        /* --- DRAGGABLE LINE TOOLBAR --- */
        .toolbar-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .toolbar-title {
            font-family: var(--font-title);
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .assets-shelf {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            background: #f8fafc;
            border: 3px dashed #e2e8f0;
            padding: 1.5rem;
            border-radius: 20px;
            min-height: 90px;
            align-items: center;
        }

        /* Bright Candy Pill Elements */
        .line-pill {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            cursor: grab;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1rem;
            color: #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: var(--transition-bounce);
            user-select: none;
        }

        .line-pill:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(59, 130, 246, 0.1);
        }

        .line-pill:active {
            cursor: grabbing;
            transform: translateY(0) scale(0.95);
        }

        .line-pill::before {
            content: '';
            width: 16px;
            height: 6px;
            background: var(--secondary);
            border-radius: 99px;
            display: inline-block;
        }

        .line-pill.placed {
            opacity: 0.25;
            pointer-events: none;
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-logo-container">
            <img src="assets/logo.png" alt="" class="splash-logo" onerror="this.style.display='none'; document.getElementById('fallback-ui').style.display='block';">
            <div id="fallback-ui" class="splash-fallback-text">🎨 ART STUDIO ✨</div>
        </div>
        <div class="loader"></div>
    </div>

    <div class="game-wrapper">
        
        <header class="game-header">
            <h1 class="game-title" id="studio-title">Level 1: The Magic Diamond</h1>
            <div class="progress-container">
                <div class="progress-bar" id="studio-progress"></div>
            </div>
        </header>

        <div class="canvas-container" id="canvas-viewport">
            <canvas id="studioCanvas" width="800" height="380"></canvas>
        </div>

        <section class="toolbar-section">
            <h2 class="toolbar-title">Drag the pieces up to complete the drawing! 👇</h2>
            <div class="assets-shelf" id="lines-shelf">
                </div>
        </section>

    </div>

    <script>
        // Audio Architecture Hooks
        function createSafeAudio(src) {
            const audio = new Audio(src);
            audio.addEventListener('error', () => {
                audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==';
            });
            return audio;
        }

        const soundClaps = createSafeAudio('assets/claps.mp3');
        const soundWrong = createSafeAudio('assets/wrong.mp3');

        // Artwork Coordinates & Layout Configurations
        const artworkLevel = {
            title: "Level 1: Trace the Diamond Castle",
            targets: [
                { id: "line-1", x1: 400, y1: 60,  x2: 520, y2: 180, label: "Roof Line A", completed: false },
                { id: "line-2", x1: 520, y1: 180, x2: 400, y2: 320, label: "Floor Line B", completed: false },
                { id: "line-3", x1: 400, y1: 320, x2: 280, y2: 180, label: "Floor Line C", completed: false },
                { id: "line-4", x1: 280, y1: 180, x2: 400, y2: 60,  label: "Roof Line D", completed: false }
            ],
            staticLines: [
                { x1: 280, y1: 180, x2: 520, y2: 180 }, 
                { x1: 400, y1: 60,  x2: 400, y2: 320 }  
            ]
        };

        let draggedDataId = null;
        const canvas = document.getElementById('studioCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('canvas-viewport');

        // Handles 5 second initialization handover phase
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.remove();
                        initStudioLevel();
                    }, 500);
                }
            }, 5000);
        });

        function initStudioLevel() {
            document.getElementById('studio-title').innerText = artworkLevel.title;
            renderPillShelf();
            drawCanvas();
            setupDragAndDrop();
        }

        function renderPillShelf() {
            const shelf = document.getElementById('lines-shelf');
            shelf.innerHTML = '';

            artworkLevel.targets.forEach(line => {
                const pill = document.createElement('div');
                pill.className = 'line-pill';
                pill.innerText = line.label;
                pill.setAttribute('draggable', 'true');
                pill.setAttribute('data-id', line.id);
                
                if(line.completed) pill.classList.add('placed');

                pill.addEventListener('dragstart', () => {
                    draggedDataId = line.id;
                    viewport.classList.add('target-active');
                });

                pill.addEventListener('dragend', () => {
                    viewport.classList.remove('target-active');
                });

                shelf.appendChild(pill);
            });

            const completedCount = artworkLevel.targets.filter(t => t.completed).length;
            const progressPercent = (completedCount / artworkLevel.targets.length) * 100;
            document.getElementById('studio-progress').style.width = `${progressPercent}%`;
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Light Background Drawing Detail: Subtle decorative landscape backdrop behind geometry art
            ctx.fillStyle = '#f0fdf4'; // Soft mint green ground arc
            ctx.beginPath();
            ctx.arc(400, 500, 220, Math.PI, 0);
            ctx.fill();

            // 1. Static drawing background elements (Soft pastel blue reference frame)
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            artworkLevel.staticLines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.x1, line.y1);
                ctx.lineTo(line.x2, line.y2);
                ctx.stroke();
            });

            // 2. Tracing Guidelines (Light gray dots indicating incomplete zones)
            artworkLevel.targets.forEach(target => {
                if (!target.completed) {
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([8, 8]);
                    ctx.beginPath();
                    ctx.moveTo(target.x1, target.y1);
                    ctx.lineTo(target.x2, target.y2);
                    ctx.stroke();
                    ctx.setLineDash([]); 
                } else {
                    // 3. Completed Lines (Vibrant bright blue strokes)
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 8;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(target.x1, target.y1);
                    ctx.lineTo(target.x2, target.y2);
                    ctx.stroke();
                }
            });

            // High-contrast pink map nodes for alignment points
            drawNodeDot(400, 60, '#ff70a6');
            drawNodeDot(520, 180, '#ff70a6');
            drawNodeDot(400, 320, '#ff70a6');
            drawNodeDot(280, 180, '#ff70a6');
        }

        function drawNodeDot(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function setupDragAndDrop() {
            viewport.addEventListener('dragover', (e) => e.preventDefault());

            viewport.addEventListener('drop', (e) => {
                e.preventDefault();
                viewport.classList.remove('target-active');

                const targetLine = artworkLevel.targets.find(t => t.id === draggedDataId);
                
                if (targetLine && !targetLine.completed) {
                    targetLine.completed = true;
                    soundClaps.play().catch(() => {});
                    
                    renderPillShelf();
                    drawCanvas();
                    checkArtCompletion();
                } else {
                    soundWrong.play().catch(() => {});
                }
            });
        }

        function checkArtCompletion() {
            const allDone = artworkLevel.targets.every(t => t.completed);
            if (allDone) {
                setTimeout(() => {
                    document.getElementById('studio-title').innerText = "✨ Magic Art Completed! ✨";
                    viewport.style.borderColor = "var(--accent)";
                    viewport.style.background = "#f0fdf4";
                }, 400);
            }
        }
    </script>
</body>
</html>
