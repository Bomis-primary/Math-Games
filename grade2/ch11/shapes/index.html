<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafting Patterns & Symmetry</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #70b7ff 0%, #9ed3ff 50%, #5c8e32 50%, #87bc43 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Splash Screen Configuration */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .splash-logo {
            max-width: 260px;
            max-height: 260px;
            margin-bottom: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            animation: pulseLogo 2s infinite ease-in-out;
        }
        .splash-loading-bar {
            width: 280px;
            height: 16px;
            background: #333;
            border: 3px solid #555;
            border-radius: 8px;
            overflow: hidden;
        }
        .splash-progress {
            width: 0%;
            height: 100%;
            background: #8ae8ff;
            box-shadow: 0 0 10px #8ae8ff;
            animation: fillProgress 5s linear forwards;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Expanded Workspace Container */
        #game-container {
            display: none; 
            width: 95%;
            max-width: 650px;
            background: rgba(35, 35, 35, 0.95);
            border: 5px solid #3c3c3c;
            border-radius: 16px;
            margin: 30px auto;
            padding: 25px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }
        h1 {
            font-size: 2.2rem;
            margin: 5px 0 15px 0;
            color: #8ae8ff;
            text-shadow: 3px 3px #000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #555;
        }
        .status-item {
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffcd2b;
            text-shadow: 1.5px 1.5px #000;
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-container label {
            font-size: 1rem;
            color: #bbb;
            font-weight: bold;
        }
        .volume-slider {
            width: 100px;
            height: 8px;
            cursor: pointer;
        }
        #question-box {
            background: #111;
            border: 3px solid #555;
            border-radius: 12px;
            padding: 25px 15px;
            margin-bottom: 25px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .instructions {
            font-size: 1.35rem;
            margin-bottom: 20px;
            color: #fff;
            font-weight: bold;
            text-shadow: 1.5px 1.5px #000;
            transition: color 0.3s ease;
        }
        .instructions.hint-mode {
            color: #ffcd2b; /* Highlights the hint text in yellow */
        }
        .pattern-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        /* Jumbo Block Elements */
        .voxel {
            width: 65px;
            height: 65px;
            border-radius: 6px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.1rem;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            border: 4px solid rgba(0,0,0,0.35);
            box-shadow: inset 4px 4px 0 rgba(255,255,255,0.25), inset -4px -4px 0 rgba(0,0,0,0.25);
        }
        .voxel.grass { background-color: #5c8e32; border-top-color: #87bc43; }
        .voxel.dirt { background-color: #866043; }
        .voxel.stone { background-color: #737373; }
        .voxel.wood { background-color: #b48a4c; }
        .voxel.brick { background-color: #943a2c; }
        
        .voxel.blank {
            background-color: #222;
            border: 4px dashed #ffcd2b;
            color: #ffcd2b;
            font-size: 2.3rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        /* Grid Options Container */
        #options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 15px;
        }
        .btn-option {
            background: #4a4a4a;
            border: 3px solid #222;
            border-bottom: 7px solid #111;
            border-radius: 12px;
            padding: 18px;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-option:active {
            transform: scale(0.97);
            border-bottom-width: 3px;
            margin-top: 4px;
        }
        .btn-option.disabled-option {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-option.correct-flash {
            background-color: #2e7d32 !important;
            border-color: #1b5e20 !important;
        }
        .btn-option.wrong-flash {
            background-color: #c62828 !important;
            border-color: #b71c1c !important;
        }
        
        #end-screen {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }
        .victory-title {
            font-size: 2.5rem;
            color: #5af75e;
            text-shadow: 2px 2px #000;
            margin-bottom: 20px;
        }
        .final-score {
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 30px;
        }
        #btn-restart {
            background: #ff9800;
            border: 3px solid #e65100;
            border-bottom: 7px solid #b33600;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 16px 40px;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #btn-restart:active {
            transform: scale(0.97);
            border-bottom-width: 3px;
        }
        
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img class="splash-logo" src="assets/logo.png" alt="Logo">
        <div class="splash-loading-bar">
            <div class="splash-progress"></div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="confetti-canvas"></canvas>
        
        <h1>Block Patterns</h1>
        
        <div class="controls-row">
            <div class="status-item" id="progress-text">Question: 1/10</div>
            <div class="volume-container">
                <label for="volume">🔊 Vol</label>
                <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.1" value="0.8">
            </div>
        </div>

        <div id="quiz-content">
            <div id="question-box">
                <div class="instructions" id="instructions-text">Complete the pattern!</div>
                <div class="pattern-display" id="pattern-area"></div>
            </div>

            <div id="options-container"></div>
        </div>

        <div id="end-screen">
            <div class="victory-title">👑 Level Complete!</div>
            <div class="final-score" id="score-text">You got 10 out of 10 correct!</div>
            <button id="btn-restart">Play Again</button>
        </div>
    </div>

    <audio id="audio-correct" src="assets/correct.mp3"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3"></audio>

    <script>
        const BLOCKS = {
            grass: { name: 'Grass', class: 'grass', emoji: '🌱' },
            dirt: { name: 'Dirt', class: 'dirt', emoji: '🟫' },
            stone: { name: 'Stone', class: 'stone', emoji: '🪨' },
            wood: { name: 'Wood', class: 'wood', emoji: '🪵' },
            brick: { name: 'Brick', class: 'brick', emoji: '🧱' }
        };

        const QUESTION_TEMPLATES = [
            { type: 'repeating', instructions: 'Find the repeating pattern rule: ABABAB...', sequence: ['grass', 'dirt', 'grass', 'dirt', 'grass', 'blank'], answer: 'dirt' },
            { type: 'repeating', instructions: 'Find the repeating pattern rule: ABCABC...', sequence: ['stone', 'brick', 'wood', 'stone', 'brick', 'blank'], answer: 'wood' },
            { type: 'repeating', instructions: 'Complete the double repeat pattern: AABBAA...', sequence: ['brick', 'brick', 'wood', 'wood', 'brick', 'blank'], answer: 'brick' },
            { type: 'growing', instructions: 'Growing pattern! Watch the block counts grow.', sequence: ['grass', 'stone', 'grass', 'grass', 'stone', 'grass', 'grass', 'blank'], answer: 'grass' },
            { type: 'growing', instructions: 'Growing pattern! Every block set increases.', sequence: ['wood', 'dirt', 'wood', 'wood', 'dirt', 'wood', 'wood', 'blank'], answer: 'wood' },
            { type: 'symmetry', instructions: 'Mirror Symmetry! Complete the reflection sides.', sequence: ['stone', 'brick', 'grass', 'blank', 'brick', 'stone'], answer: 'grass' },
            { type: 'symmetry', instructions: 'Mirror Symmetry! Complete the center reflections.', sequence: ['wood', 'wood', 'dirt', 'blank', 'wood', 'wood'], answer: 'dirt' },
            { type: 'tiling', instructions: 'Tiling Pattern! Alternating layers row.', sequence: ['brick', 'stone', 'brick', 'stone', 'brick', 'blank'], answer: 'stone' },
            { type: 'repeating', instructions: 'Complete the block sequence pattern.', sequence: ['dirt', 'stone', 'dirt', 'stone', 'dirt', 'blank'], answer: 'stone' },
            { type: 'growing', instructions: 'Growing pattern! Find the next block step.', sequence: ['brick', 'wood', 'brick', 'brick', 'wood', 'brick', 'brick', 'blank'], answer: 'brick' }
        ];

        let gameQuestions = [];
        let currentQuestionIdx = 0;
        let score = 0;
        let acceptsInput = true;
        let attemptsOnCurrentQuestion = 0; // Tracks first or second try

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId = null;

        const splashScreen = document.getElementById('splash-screen');
        const gameContainer = document.getElementById('game-container');
        const progressText = document.getElementById('progress-text');
        const instructionsText = document.getElementById('instructions-text');
        const patternArea = document.getElementById('pattern-area');
        const optionsContainer = document.getElementById('options-container');
        const quizContent = document.getElementById('quiz-content');
        const endScreen = document.getElementById('end-screen');
        const scoreText = document.getElementById('score-text');
        const btnRestart = document.getElementById('btn-restart');
        const volumeSlider = document.getElementById('volume');
        const audioCorrect = document.getElementById('audio-correct');
        const audioWrong = document.getElementById('audio-wrong');

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    gameContainer.style.display = 'block';
                    initGame();
                }, 500);
            }, 5000); 
        });

        function initGame() {
            gameQuestions = [...QUESTION_TEMPLATES].sort(() => Math.random() - 0.5);
            currentQuestionIdx = 0;
            score = 0;
            acceptsInput = true;
            
            quizContent.style.display = 'block';
            endScreen.style.display = 'none';
            stopConfetti();
            
            loadQuestion();
        }

        function loadQuestion() {
            acceptsInput = true;
            attemptsOnCurrentQuestion = 0;
            instructionsText.classList.remove('hint-mode');
            progressText.innerText = `Question: ${currentQuestionIdx + 1}/10`;
            
            const currentQ = gameQuestions[currentQuestionIdx];
            instructionsText.innerText = currentQ.instructions;
            
            patternArea.innerHTML = '';
            currentQ.sequence.forEach(blockType => {
                const blockDiv = document.createElement('div');
                if (blockType === 'blank') {
                    blockDiv.className = 'voxel blank';
                    blockDiv.innerText = '?';
                } else {
                    blockDiv.className = `voxel ${BLOCKS[blockType].class}`;
                    blockDiv.innerText = BLOCKS[blockType].emoji;
                }
                patternArea.appendChild(blockDiv);
            });

            optionsContainer.innerHTML = '';
            const uniqueKeys = Object.keys(BLOCKS);
            let choices = [currentQ.answer];
            
            while (choices.length < 4) {
                let randKey = uniqueKeys[Math.floor(Math.random() * uniqueKeys.length)];
                if (!choices.includes(randKey)) {
                    choices.push(randKey);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choiceKey => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerHTML = `<span class="voxel ${BLOCKS[choiceKey].class}" style="width:42px; height:42px; font-size:1.3rem; border-width:2px; box-shadow:none;">${BLOCKS[choiceKey].emoji}</span> ${BLOCKS[choiceKey].name}`;
                btn.addEventListener('click', () => handleAnswer(choiceKey, btn));
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedKey, clickedBtn) {
            if (!acceptsInput) return;

            const currentQ = gameQuestions[currentQuestionIdx];
            const volumeValue = volumeSlider.value;
            
            audioCorrect.volume = volumeValue;
            audioWrong.volume = volumeValue;

            if (selectedKey === currentQ.answer) {
                acceptsInput = false;
                score++;
                clickedBtn.classList.add('correct-flash');
                audioCorrect.play().catch(e => {});
                startConfetti();
                setTimeout(() => stopConfetti(), 1200);

                setTimeout(() => {
                    advanceGame();
                }, 1800);
            } else {
                attemptsOnCurrentQuestion++;
                audioWrong.play().catch(e => {});

                if (attemptsOnCurrentQuestion === 1) {
                    // Give 1 more chance with a targeted tip/hint
                    clickedBtn.classList.add('wrong-flash');
                    clickedBtn.classList.add('disabled-option'); // Disable this wrong item

                    // Create friendly hints based on question type
                    let hint = "💡 Try again! Look carefully at the block sequence layout.";
                    if (currentQ.type === 'repeating') {
                        // Find what block precedes the blank space
                        hint = `💡 Hint: What block usually comes right after the previous block?`;
                    } else if (currentQ.type === 'symmetry') {
                        hint = "💡 Hint: It is a mirror reflection! Look at the matching opposite side.";
                    } else if (currentQ.type === 'growing') {
                        hint = "💡 Hint: The pattern is expanding! Count how many blocks grow each time.";
                    }

                    instructionsText.innerText = hint;
                    instructionsText.classList.add('hint-mode');
                } else {
                    // Out of chances, lock choices and highlight correct answer
                    acceptsInput = false;
                    clickedBtn.classList.add('wrong-flash');
                    
                    Array.from(optionsContainer.children).forEach(btn => {
                        if (btn.innerText.includes(BLOCKS[currentQ.answer].name)) {
                            btn.classList.add('correct-flash');
                        }
                    });

                    setTimeout(() => {
                        advanceGame();
                    }, 2000);
                }
            }
        }

        function advanceGame() {
            currentQuestionIdx++;
            if (currentQuestionIdx < 10) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            quizContent.style.display = 'none';
            endScreen.style.display = 'block';
            scoreText.innerText = `You completed ${score} out of 10 structural patterns!`;
            startConfetti();
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        function startConfetti() {
            resizeCanvas();
            confettiParticles = [];
            for (let i = 0; i < 70; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 7 + 4,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    speedX: Math.random() * 2 - 1,
                    speedY: Math.random() * 3 + 3
                });
            }
            if (!confettiAnimationId) {
                animateConfetti();
            }
        }

        function stopConfetti() {
            if (confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
                confettiAnimationId = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let livingParticles = false;
            
            confettiParticles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < canvas.height) livingParticles = true;
            });

            if (livingParticles) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            } else {
                confettiAnimationId = null;
            }
        }

        btnRestart.addEventListener('click', initGame);
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
