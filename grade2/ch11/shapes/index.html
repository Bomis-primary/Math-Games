<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafting Patterns & Symmetry</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #70b7ff 0%, #9ed3ff 60%, #5c8e32 60%, #87bc43 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Splash Screen Container */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .splash-logo {
            max-width: 180px;
            max-height: 180px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            animation: pulseLogo 2s infinite ease-in-out;
        }
        .splash-loading-bar {
            width: 200px;
            height: 10px;
            background: #333;
            border: 2px solid #555;
            border-radius: 5px;
            overflow: hidden;
        }
        .splash-progress {
            width: 0%;
            height: 100%;
            background: #8ae8ff;
            box-shadow: 0 0 8px #8ae8ff;
            animation: fillProgress 5s linear forwards;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Main Game Content Container */
        #game-container {
            display: none; /* Hidden until splash screen ends */
            width: 100%;
            max-width: 500px;
            background: rgba(40, 40, 40, 0.95);
            border: 4px solid #3c3c3c;
            border-radius: 12px;
            margin: 20px auto;
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
        }
        h1 {
            font-size: 1.6rem;
            margin: 5px 0;
            color: #8ae8ff;
            text-shadow: 2px 2px #000;
            text-transform: uppercase;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 2px solid #555;
        }
        .status-item {
            font-weight: bold;
            font-size: 0.95rem;
            color: #ffcd2b;
            text-shadow: 1px 1px #000;
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .volume-container label {
            font-size: 0.8rem;
            color: #bbb;
        }
        .volume-slider {
            width: 70px;
            cursor: pointer;
        }
        #question-box {
            background: #111;
            border: 3px solid #555;
            border-radius: 8px;
            padding: 15px 10px;
            margin-bottom: 15px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .instructions {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #fff;
            font-weight: 600;
            text-shadow: 1px 1px #000;
        }
        .pattern-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

            height: 50px;

            align-items: center;
            font-size: 1.5rem;
