<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Kingdom Multiplication</title>
<style>
body { margin:0; font-family: Arial; background: linear-gradient(#a0e0ff, #00bfff); color: #03396c; text-align:center; }
button { padding:10px 20px; font-size:18px; margin:5px; border-radius:8px; cursor:pointer; }
.correct { background-color: #4caf50; color: white; }
.wrong { animation: shake 0.5s; }
@keyframes shake { 0% {transform:translateX(0);} 25%{transform:translateX(-5px);}50%{transform:translateX(5px);}75%{transform:translateX(-5px);}100%{transform:translateX(0);} }
#treasure { display:none; }
</style>
</head>
<body>

<div id="logoScreen">
  <img src="innovine-logo.png" alt="Innovine Logo" width="200">
</div>

<div id="gameScreen" style="display:none;">
  <h2 id="story">Welcome to Coral Kingdom!</h2>
  <p id="question"></p>
  <div id="options"></div>
</div>

<div id="endScreen" style="display:none;">
  <h2>🎉 Great Job! Coral Kingdom thanks you! 🎉</h2>
  <button onclick="restartGame()">Play Again</button>
</div>

<div id="treasure">
  <img src="treasure-chest.png" width="200">
</div>

<script>
const questions = [
  {q:"3 fish each have 4 pearls. How many pearls in total?", options:[7,12,9], answer:12},
  {q:"Crab has 2 claws, each holds 5 shells. Total shells?", options:[10,12,8], answer:10},
  {q:"Seahorses swimming in 3 groups of 6. Total?", options:[18,20,15], answer:18},
  {q:"Starfish in 10 groups, 2 in each?", options:[20,12,22], answer:20},
  {q:"Coral reef has 4 rows of 10 stones. Total?", options:[40,30,50], answer:40},
  {q:"12 tiny fish in 3 groups. Total?", options:[36,32,30], answer:36},
  {q:"15 shells, each with 2 pearls. Total?", options:[25,30,28], answer:30},
  {q:"5 treasure boxes, each 10 coins. Total?", options:[50,45,40], answer:50},
  {q:"Crab carries 8 shells, each 6 pearls. Total?", options:[42,48,44], answer:48},
  {q:"20 sea stars, each with 3 points of light. Total?", options:[60,50,55], answer:60}
];

let currentQ = 0;

function startGame() {
  document.getElementById('logoScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  showQuestion();
}

function showQuestion() {
  const q = questions[currentQ];
  document.getElementById('question').innerText = q.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.sort(()=>Math.random()-0.5);
  q.options.forEach(o=>{
    const btn = document.createElement('button');
    btn.innerText=o;
    btn.onclick = ()=>checkAnswer(o,btn);
    opts.appendChild(btn);
  });
}

function checkAnswer(val,btn) {
  if(val===questions[currentQ].answer){
    btn.classList.add('correct');
    setTimeout(()=>{
      currentQ++;
      if(currentQ<questions.length) showQuestion();
      else endGame();
    },500);
  } else {
    btn.classList.add('wrong');
    setTimeout(()=>{ btn.classList.remove('wrong'); },500);
  }
}

function endGame() {
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('endScreen').style.display='block';
  document.getElementById('treasure').style.display='block';
}

function restartGame() {
  currentQ=0;
  document.getElementById('endScreen').style.display='none';
  document.getElementById('treasure').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  showQuestion();
}

setTimeout(startGame, 3000); // Logo screen 3 sec
</script>

</body>
</html>
