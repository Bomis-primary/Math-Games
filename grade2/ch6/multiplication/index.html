<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt in Coral Kingdom</title>
    <style>
        :root {
            --coral-dark: #0f172a;
            --ocean-blue: #0284c7;
            --gold-yellow: #f59e0b;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            user-select: none;
        }

        body {
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- 5-SECOND SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease-out;
        }
        .splash-logo { max-width: 260px; height: auto; margin-bottom: 20px; }
        .timer-loader {
            width: 120px; height: 6px; background: #E0E0E0; border-radius: 3px; overflow: hidden;
        }
        .timer-progress {
            width: 0%; height: 100%; background: var(--gold-yellow);
            animation: fillBar 5s linear forwards;
        }
        @keyframes fillBar { 100% { width: 100%; } }

        /* --- CORE GAME FRAMEWORK --- */
        #game-container {
            width: 95%;
            max-width: 860px;
            height: 680px;
            background: #ffffff;
            border-radius: 24px;
            border: 6px solid var(--coral-dark);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            display: none; 
            flex-direction: column;
            overflow: hidden;
        }

        /* --- OVERLAYS --- */
        .overlay-card {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            z-index: 50;
        }
        .story-box {
            font-size: 1.35rem; line-height: 1.6; margin: 20px 0; max-width: 580px;
            background: #e0f2fe; padding: 25px; border-radius: 16px; border: 3px dashed var(--ocean-blue);
            color: #0369a1; font-weight: bold;
        }
        .game-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7); color: white;
            border: none; padding: 16px 45px; font-size: 1.4rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #0369a1;
            transition: transform 0.1s;
        }
        .game-btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent; }

        /* --- HUD PANEL --- */
        .hud-header {
            background: var(--coral-dark);
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.25rem;
            z-index: 30;
        }

        /* --- STAGE PLAYFIELD --- */
        .sea-field {
            flex: 1;
            background: url('assets/underwater-bg.png') no-repeat center center;
            background-size: cover;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
        }

        /* --- TOP QUESTION PANEL --- */
        #question-card-wrapper {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #0284c7;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            padding: 16px;
            z-index: 20;
        }

        .scenario-banner {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            color: #166534;
            line-height: 1.4;
        }

        /* --- ILLUSTRATION STAGE --- */
        #character-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            flex: 1;
            margin: 15px 0;
            z-index: 10;
        }

        /* Full scene wrapper box for your beautiful generated illustrations */
        .full-scene-view {
            width: 100%;
            height: 250px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 20px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.2));
        }

        /* --- OPTIONS SHELF --- */
        #options-shelf {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 5px;
            z-index: 20;
        }

        .swim-node {
            position: relative;
            width: 140px;
            height: 140px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .swim-img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.3));
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .swim-node:hover .swim-img {
            transform: scale(1.15);
        }
        .swim-badge {
            position: absolute;
            color: #1e3a8a;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff;
            z-index: 5;
            pointer-events: none;
        }

        .green-glow {
            filter: drop-shadow(0 0 30px var(--success-green)) brightness(1.25) !important;
        }
        .pop-sparkle {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            pointer-events: none; z-index: 40;
        }
    </style>
</head>

        <div class="timer-loader"><div class="timer-progress"></div></div>
    </div>

    <div id="game-container">
