<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star-Pet Pictograph Studio!</title>
    <style>
        :root {
            --space-bg: #090D16;
            --cosmic-purple: #4F46E5;
            --neon-pink: #EC4899;
            --cyan-glow: #06B6D4;
            --gold-star: #F59E0B;
            --mint-green: #10B981;
            --panel-bg: #1E1B4B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, var(--space-bg) 0%, #111827 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            color: #F3F4F6;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen img { max-width: 60%; max-height: 50%; object-fit: contain; }

        .game-container {
            background: var(--panel-bg);
            border: 6px solid var(--cosmic-purple);
            border-radius: 36px;
            width: 100%;
            max-width: 750px;
            padding: 22px;
            box-shadow: 0 16px 0px #090526;
            position: relative;
        }

        h1 {
            color: var(--gold-star);
            font-size: 2rem;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 8px;
        }

        /* Progress Bar */
        .progress-container {
            background: #312E81;
            border: 3px solid var(--cosmic-purple);
            height: 22px;
            border-radius: 15px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, var(--neon-pink), var(--cyan-glow), var(--mint-green));
            transition: width 0.4s ease;
        }

        .hud-display {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            background: #090526;
            padding: 10px 20px;
            border-radius: 18px;
            border: 3px solid #312E81;
            margin-bottom: 15px;
        }

        /* Viewport Canvas Panel */
        .studio-viewport {
            background: #03001C;
            border: 5px solid var(--cosmic-purple);
            border-radius: 24px;
            min-height: 310px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
            box-shadow: inset 0 8px 0 rgba(0,0,0,0.6);
        }

        .instruction-bubble {
            background: #312E81;
            border: 3px solid var(--cyan-glow);
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 1.1rem;
            text-align: center;
            width: 100%;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        /* PICTOGRAPH GRAPH GRID SHEET */
        .graph-board {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            padding: 15px;
            border-radius: 18px;
            border: 2px dashed #4338CA;
        }

        .graph-row {
            display: flex;
            align-items: center;
            background: rgba(49, 46, 129, 0.4);
            border-radius: 12px;
            padding: 8px 12px;
            min-height: 55px;
        }

        .row-label {
            width: 110px;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--cyan-glow);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .row-cells-container {
            display: flex;
            flex-grow: 1;
            gap: 8px;
            align-items: center;
            padding-left
