<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addition Racing Game - Fixed Layout</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin:0; background: linear-gradient(to bottom, #a8d8ff, #e0f0ff);}
  #race-track {width: 90%; height: 300px; margin: 30px auto; position: relative; border-radius: 15px; overflow: hidden; border: 2px solid #333;}
  #race-track img#trackBg {position:absolute; top:0; left:0; width:100%; height:100%; z-index:0;}
  #playerCar {width: 150px; position: absolute; bottom: 20px; left: 0; transform: rotate(180deg); transition: left 0.5s; z-index:1;}
  #finishLine {position:absolute; right:10px; top:0; bottom:0; width:15px; background:red; border-radius:5px; z-index:2;}
  .question-box {margin: 20px auto; font-size: 28px; background-color: #ffd700; padding: 15px 25px; border-radius: 15px; width: fit-content;}
  .options {margin-top: 15px;}
  .options button {
    font-size: 26px;
    padding: 20px 30px;
    margin: 10px;
    cursor: pointer;
    border-radius: 15px;
    border: none;
    background: linear-gradient(to right, #ff7f50, #ff6347);
    color: white;
    transition: transform 0.2s;
  }
  .options button:hover { transform: scale(1.1); }
  #finishMessage {font-size: 36px; color: green; display:none; margin-top:20px;}
</style>
</head>
<body>

<h1>Addition Racing Game</h1>
<div id="race-track">
  <img src="assets/track-bg.png" id="trackBg" alt="Track Background">
  <img src="assets/car.png" id="playerCar" alt="Player Car">
  <div id="finishLine"></div>
</div>

<div class="question-box" id="question">1 + 2 = ?</div>
<div class="options" id="options">
  <button>3</button>
  <button>7</button>
  <button>16</button>
  <button>13</button>
</div>
<div id="finishMessage">🏁 You Win! 🏁</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const car = document.getElementById('playerCar');
const finishLine = document.getElementById('finishLine');
const optionsDiv = document.getElementById('options');
const finishMessage = document.getElementById('finishMessage');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

let carPosition = 0;
const step = 60; // pixels per correct answer
const trackWidth = document.getElementById('race-track').offsetWidth - car.offsetWidth - 10;

// Sample sums
const questions = [
  {q:"1 + 2", a:3}, {q:"4 + 6", a:10}, {q:"12 + 15", a:27}, {q:"78 + 45", a:123}, {q:"98 + 86", a:184},
  {q:"66 + 96", a:162}, {q:"69 + 83", a:152}, {q:"298 + 375", a:673}, {q:"295 + 343", a:638}
];

function loadQuestion() {
  const item = questions[Math.floor(Math.random() * questions.length)];
  document.getElementById('question').textContent = item.q + " = ?";
  
  const answers = [item.a];
  while (answers.length < 4) {
    let wrong = Math.floor(item.a - 50 + Math.random()*100);
    if (!answers.includes(wrong) && wrong > 0) answers.push(Math.round(wrong));
  }
  answers.sort(() => Math.random() - 0.5);

  optionsDiv.innerHTML = '';
  answers.forEach(ans => {
    const btn = document.createElement('button');
    btn.textContent = ans;
    btn.onclick = () => handleAnswer(ans === item.a);
    optionsDiv.appendChild(btn);
  });
}

function handleAnswer(correct) {
  if(correct) {
    carPosition += step;
    correctSound.play();
    if(carPosition >= trackWidth){
      carPosition = trackWidth;
      finishMessage.style.display = 'block';
      clapSound.play();
      optionsDiv.innerHTML = '';
      document.getElementById('question').innerHTML = '';
    }
  } else {
    carPosition -= step;
    if(carPosition < 0) carPosition = 0;
    wrongSound.play();
  }
  car.style.left = carPosition + 'px';
  loadQuestion();
}

// Initialize
loadQuestion();
</script>

</body>
</html>
