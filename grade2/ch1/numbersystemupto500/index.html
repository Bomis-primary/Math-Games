<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Quest: Grade 2 Math Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle, #2b5876 0%, #4e4376 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #fff;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background: #1a1a2e;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            overflow: hidden;
            border: 6px solid #e94560;
            position: relative;
        }

        .screen {
            display: none;
            padding: 30px;
            text-align: center;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen:not(.active) {
            display: none !important;
        }

        /* Logo Screen */
        #logo-screen {
            background: #0f3460;
        }

        .logo-img {
            max-width: 220px;
            height: auto;
            animation: float 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Intro Screen */
        #intro-screen {
            background: linear-gradient(135deg, #0f3460, #16213e);
        }

        .intro-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #f1c40f;
            text-shadow: 3px 3px 0px #e94560;
            margin-bottom: 15px;
        }

        .intro-desc {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            line-height: 1.6;
            max-width: 500px;
        }

        /* Header Bar */
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f3460;
            color: white;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 800;
            border-bottom: 4px solid #e94560;
        }

        .score-board, .question-tracker {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 15px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            color: #f1c40f;
        }

        /* Question Content */
        .question-box {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            margin: 15px 0;
            color: #fff;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            line-height: 1.4;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.4);
        }

        /* Interactive Zones / Drag Elements */
        .game-play-area {
            width: 100%;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        /* Type 1: Drop Target Container */
        .drop-zone {
            width: 160px;
            height: 75px;
            border: 4px dashed #f1c40f;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 800;
            background: rgba(241, 196, 15, 0.1);
            color: #f1c40f;
            transition: all 0.2s;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.2);
        }

        .drop-zone.highlight {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
            color: #2ecc71;
            transform: scale(1.05);
        }

        .draggable-items-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .drag-item {
            background: linear-gradient(135deg, #ff9f43, #ff6b6b);
            color: white;
            padding: 12px 22px;
            font-size: 1.4rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 18px;
            cursor: grab;
            box-shadow: 0 6px 0 #d9534f, 0 10px 15px rgba(0,0,0,0.3);
            touch-action: none;
            transition: transform 0.1s;
        }

        .drag-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        /* Type 2: Symbol Comparison */
        .comparison-area {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 2.2rem;
            font-family: 'Fredoka One', cursive;
            color: #fff;
        }

        .compare-box {
            background: #16213e;
            padding: 15px 30px;
            border-radius: 20px;
            border: 3px solid #0f3460;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.4);
        }

        .symbol-buttons {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .symbol-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            font-size: 2rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1e8449, 0 10px 15px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .symbol-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #1e8449, 0 12px 20px rgba(0,0,0,0.4);
        }

        .symbol-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1e8449;
        }

        /* Type 3: Abacus Counter Pegs */
        .abacus-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #16213e;
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #0f3460;
            width: 100%;
            justify-content: space-between;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .abacus-label {
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            color: #f1c40f;
            width: 110px;
            text-align: left;
        }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .count-btn {
            background: #f1c40f;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            font-family: 'Fredoka One', cursive;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 4px 0 #d4ac0d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .count-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d4ac0d;
        }

        .count-display {
            font-size: 1.5rem;
            font-family: 'Fredoka One', cursive;
            width: 35px;
            text-align: center;
            color: #fff;
        }

        /* Feedback Message */
        .feedback-msg {
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            min-height: 35px;
            margin-top: 5px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        /* Primary Action Buttons */
        .primary-btn {
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.4rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #962d22, 0 10px 20px rgba(0,0,0,0.4);
            transition: all 0.2s;
            margin-top: 15px;
        }

        .primary-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #962d22, 0 14px 25px rgba(0,0,0,0.5);
        }

        .primary-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #962d22;
        }

        /* End Screen */
        #end-screen h2 {
            font-family: 'Fredoka One', cursive;
            color: #2ecc71;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.4);
        }

        .final-score {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: #f1c40f;
            margin: 15px 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.4);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <!-- Audio Elements -->
    <audio id="correct-audio" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="wrong-audio" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="game-container">
        <canvas id="confetti-canvas"></canvas>

        <!-- 1. LOGO SCREEN (3 seconds) -->
        <div id="logo-screen" class="screen active">
            <img src="assets/logo.png" alt="Logo" class="logo-img">
        </div>

        <!-- 2. INTRO / BRIEF DESCRIPTION SCREEN WITH PLAY BUTTON -->
        <div id="intro-screen" class="screen">
            <div class="intro-title">Number Quest</div>
            <div class="intro-desc">Welcome, brave learner! Embark on a 10-level math journey: build numbers with abacus counters, conquer place-value chests, compare numbers, and master sequences!</div>
            <button class="primary-btn" onclick="startGame()">Play Game!</button>
        </div>

        <!-- 3. GAMEPLAY SCREEN -->
        <div id="game-screen" class="screen" style="justify-content: flex-start; padding: 0;">
            <div class="header-bar">
                <div class="question-tracker" id="tracker">Task: 1/10</div>
                <div class="score-board" id="score">Score: 0</div>
            </div>
            <div style="padding: 20px 25px; width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="question-box" id="question-text">Loading task...</div>
                <div class="game-play-area" id="game-play-area">
                    <!-- Dynamically injected minigame UI -->
                </div>
                <div class="feedback-msg" id="feedback"></div>
            </div>
        </div>

        <!-- 4. END SCREEN -->
        <div id="end-screen" class="screen">
            <h2>Quest Complete! 🎉</h2>
            <div class="final-score" id="final-score-text">Your Score: 100 / 100</div>
            <p style="color: #cbd5e1; font-size: 1.2rem; margin-bottom: 20px;">You are a true Number System Champion!</p>
            <button class="primary-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Sound FX Player
        function playSound(type) {
            if (type === 'correct') {
                const sound = document.getElementById('correct-audio');
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play blocked:", e));
            } else if (type === 'wrong') {
                const sound = document.getElementById('wrong-audio');
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play blocked:", e));
            }
        }

        // Master Interactive Tasks Bank (10 questions)
        const masterTasks = [
            {
                type: 'abacusBuilder',
                question: "Set the Abacus counters to match the number: 345 (3 Hundreds, 4 Tens, 5 Ones)",
                hundreds: 3,
                tens: 4,
                ones: 5
            },
            {
                type: 'comparison',
                question: "Compare the two numbers correctly by clicking the right symbol!",
                num1: 215,
                num2: 189,
                correctSymbol: ">"
            },
            {
                type: 'placeValueChest',
                question: "Drag the correct number matching the expanded form: 200 + 70 + 9 into the chest!",
                targetVal: "279",
                options: ["297", "279", "729", "209"]
            },
            {
                type: 'sequenceFill',
                question: "Drag the missing number that comes after 299 into the empty box!",
                targetVal: "300",
                options: ["298", "300", "301", "200"]
            },
            {
                type: 'abacusBuilder',
                question: "Set the Abacus counters to match the number: 234 (2 Hundreds, 3 Tens, 4 Ones)",
                hundreds: 2,
                tens: 3,
                ones: 4
            },
            {
                type: 'placeValueChest',
                question: "Drag the numeral for: \"Four hundred twelve\" into the chest!",
                targetVal: "412",
                options: ["421", "214", "412", "402"]
            },
            {
                type: 'comparison',
                question: "Compare the two numbers correctly by clicking the right symbol!",
                num1: 450,
                num2: 399,
                correctSymbol: ">"
            },
            {
                type: 'sequenceFill',
                question: "Find the missing number in counting by 5s: 100, 105, 110, ___ , 120",
                targetVal: "115",
                options: ["112", "116", "115", "125"]
            },
            {
                type: 'abacusBuilder',
                question: "Set the Abacus counters to match the number: 405 (4 Hundreds, 0 Tens, 5 Ones)",
                hundreds: 4,
                tens: 0,
                ones: 5
            },
            {
                type: 'placeValueChest',
                question: "Drag the correct number matching the expanded form: 400 + 50 + 8 into the chest!",
                targetVal: "458",
                options: ["485", "458", "548", "408"]
            }
        ];

        let tasks = [];
        let currentTaskIndex = 0;
        let score = 0;
        let lockAnswer = false;

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('logo-screen').classList.remove('active');
                document.getElementById('intro-screen').classList.add('active');
            }, 3000);
        });

        function startGame() {
            document.getElementById('intro-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            tasks = [...masterTasks].sort(() => Math.random() - 0.5);
            currentTaskIndex = 0;
            score = 0;
            loadTask();
        }

        function loadTask() {
            lockAnswer = false;
            document.getElementById('feedback').innerText = "";
            
            if (currentTaskIndex >= tasks.length) {
                endGame();
                return;
            }

            const task = tasks[currentTaskIndex];
            document.getElementById('tracker').innerText = `Task: ${currentTaskIndex + 1}/${tasks.length}`;
            document.getElementById('score').innerText = `Score: ${score}`;
            document.getElementById('question-text').innerText = task.question;

            const area = document.getElementById('game-play-area');
            area.innerHTML = '';

            if (task.type === 'placeValueChest' || task.type === 'sequenceFill') {
                renderDragDropGame(task, area);
            } else if (task.type === 'comparison') {
                renderComparisonGame(task, area);
            } else if (task.type === 'abacusBuilder') {
                renderAbacusGame(task, area);
            }
        }

        // --- MINI-GAME 1: Drag & Drop into Chest / Box ---
        function renderDragDropGame(task, container) {
            const dropZone = document.createElement('div');
            dropZone.className = 'drop-zone';
            dropZone.innerText = "📥 Chest";
            container.appendChild(dropZone);

            const itemsContainer = document.createElement('div');
            itemsContainer.className = 'draggable-items-container';
            
            const shuffledOptions = [...task.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(opt => {
                const dragItem = document.createElement('div');
                dragItem.className = 'drag-item';
                dragItem.innerText = opt;
                
                // Desktop Drag Events
                dragItem.draggable = true;
                dragItem.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', opt);
                });

                // Mobile Touch Drag Simulation
                let initialX = 0, initialY = 0, currentX = 0, currentY = 0;
                dragItem.addEventListener('touchstart', (e) => {
                    if (lockAnswer) return;
                    initialX = e.touches[0].clientX - currentX;
                    initialY = e.touches[0].clientY - currentY;
                });

                dragItem.addEventListener('touchmove', (e) => {
                    if (lockAnswer) return;
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                    dragItem.style.transform = `translate(${currentX}px, ${currentY}px)`;
                    
                    // Check overlap with dropZone
                    const dropRect = dropZone.getBoundingClientRect();
                    const itemRect = dragItem.getBoundingClientRect();
                    if (itemRect.left < dropRect.right && itemRect.right > dropRect.left &&
                        itemRect.top < dropRect.bottom && itemRect.bottom > dropRect.top) {
                        dropZone.classList.add('highlight');
                    } else {
                        dropZone.classList.remove('highlight');
                    }
                });

                dragItem.addEventListener('touchend', (e) => {
                    if (lockAnswer) return;
                    const dropRect = dropZone.getBoundingClientRect();
                    const itemRect = dragItem.getBoundingClientRect();
                    if (itemRect.left < dropRect.right && itemRect.right > dropRect.left &&
                        itemRect.top < dropRect.bottom && itemRect.bottom > dropRect.top) {
                        checkTaskResult(opt === task.targetVal);
                    }
                    dragItem.style.transform = 'translate(0px, 0px)';
                    currentX = 0; currentY = 0;
                    dropZone.classList.remove('highlight');
                });

                itemsContainer.appendChild(dragItem);
            });

            container.appendChild(itemsContainer);

            // Desktop Drop listener
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('highlight');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('highlight');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('highlight');
                if (lockAnswer) return;
                const droppedVal = e.dataTransfer.getData('text/plain');
                checkTaskResult(droppedVal === task.targetVal);
            });
        }

        // --- MINI-GAME 2: Symbol Comparison Game ---
        function renderComparisonGame(task, container) {
            const compArea = document.createElement('div');
            compArea.className = 'comparison-area';

            const box1 = document.createElement('div');
            box1.className = 'compare-box';
            box1.innerText = task.num1;

            const signBox = document.createElement('div');
            signBox.className = 'compare-box';
            signBox.style.color = '#f1c40f';
            signBox.innerText = "?";
            signBox.id = 'sign-placeholder';

            const box2 = document.createElement('div');
            box2.className = 'compare-box';
            box2.innerText = task.num2;

            compArea.appendChild(box1);
            compArea.appendChild(signBox);
            compArea.appendChild(box2);
            container.appendChild(compArea);

            const btnContainer = document.createElement('div');
            btnContainer.className = 'symbol-buttons';

            ['>', '<', '='].forEach(sym => {
                const symBtn = document.createElement('button');
                symBtn.className = 'symbol-btn';
                symBtn.innerText = sym;
                symBtn.onclick = () => {
                    if (lockAnswer) return;
                    document.getElementById('sign-placeholder').innerText = sym;
                    checkTaskResult(sym === task.correctSymbol);
                };
                btnContainer.appendChild(symBtn);
            });

            container.appendChild(btnContainer);
        }

        // --- MINI-GAME 3: Abacus Counter Builder ---
        function renderAbacusGame(task, container) {
            let currentH = 0;
            let currentT = 0;
            let currentO = 0;

            const abacusWrapper = document.createElement('div');
            abacusWrapper.style.display = 'flex';
            abacusWrapper.style.flexDirection = 'column';
            abacusWrapper.style.gap = '8px';
            abacusWrapper.style.width = '100%';

            // Hundreds Row
            abacusWrapper.appendChild(createAbacusRow("Hundreds", currentH, (val) => { currentH = val; }));
            // Tens Row
            abacusWrapper.appendChild(createAbacusRow("Tens", currentT, (val) => { currentT = val; }));
            // Ones Row
            abacusWrapper.appendChild(createAbacusRow("Ones", currentO, (val) => { currentO = val; }));

            container.appendChild(abacusWrapper);

            const verifyBtn = document.createElement('button');
            verifyBtn.className = 'primary-btn';
            verifyBtn.innerText = "Check Abacus";
            verifyBtn.onclick = () => {
                if (lockAnswer) return;
                const isCorrect = (currentH === task.hundreds && currentT === task.tens && currentO === task.ones);
                checkTaskResult(isCorrect);
            };
            container.appendChild(verifyBtn);

            function createAbacusRow(labelName, initialVal, updateCallback) {
                let val = initialVal;
                const row = document.createElement('div');
                row.className = 'abacus-row';

                const label = document.createElement('div');
                label.className = 'abacus-label';
                label.innerText = labelName;

                const controls = document.createElement('div');
                controls.className = 'counter-controls';

                const minusBtn = document.createElement('button');
                minusBtn.className = 'count-btn';
                minusBtn.innerText = "-";

                const display = document.createElement('div');
                display.className = 'count-display';
                display.innerText = val;

                const plusBtn = document.createElement('button');
                plusBtn.className = 'count-btn';
                plusBtn.innerText = "+";

                plusBtn.onclick = () => {
                    if (val < 9) { val++; display.innerText = val; updateCallback(val); }
                };
                minusBtn.onclick = () => {
                    if (val > 0) { val--; display.innerText = val; updateCallback(val); }
                };

                controls.appendChild(minusBtn);
                controls.appendChild(display);
                controls.appendChild(plusBtn);

                row.appendChild(label);
                row.appendChild(controls);
                return row;
            }
        }

        // --- Task Completion Handler ---
        function checkTaskResult(isCorrect) {
            if (lockAnswer) return;
            lockAnswer = true;

            const feedback = document.getElementById('feedback');

            if (isCorrect) {
                feedback.innerText = "Correct! Fantastic! 👏";
                feedback.style.color = "#2ecc71";
                score += 10;
                playSound('correct');
                triggerConfetti();
            } else {
                feedback.innerText = "Oops! That's not quite right.";
                feedback.style.color = "#e94560";
                playSound('wrong');
            }

            setTimeout(() => {
                currentTaskIndex++;
                loadTask();
            }, 1600);
        }

        function endGame() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('end-screen').classList.add('active');
            document.getElementById('final-score-text').innerText = `Your Score: ${score} / ${tasks.length * 10}`;
        }

        function restartGame() {
            document.getElementById('end-screen').classList.remove('active');
            document.getElementById('intro-screen').classList.add('active');
        }

        // Confetti Engine
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.style.display = 'block';
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            let particles = [];
            const colors = ['#e94560', '#2ecc71', '#f1c40f', '#3498db', '#9b59b6'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 3,
                    radius: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3;
                    p.alpha -= p.decay;

                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                        return;
                    }

                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                if (particles.length > 0) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    canvas.style.display = 'none';
                }
            }

            animateConfetti();
        }
    </script>
</body>
</html>
