<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 2 - Chapter 1: Number Systems Interactive</title>
    <style>
        :root {
            --primary: #4A60A1;
            --success: #2ECC71;
            --error: #E74C3C;
            --background: #F5F7FA;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
        }

        /* Splash Screen */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #splash-screen img {
            max-width: 200px;
            height: auto;
        }

        /* Utility Classes */
        .hidden { display: none !important; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.9; }

        /* Question Layout */
        .header-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: #7F8C8D;
            font-weight: bold;
        }

        .timer { color: var(--error); }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            padding: 14px;
            text-align: left;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:active { background: #EDF2F7; }
        
        .option-btn.correct { background: #D4EDDA; border-color: var(--success); color: #155724; }
        .option-btn.wrong { background: #F8D7DA; border-color: var(--error); color: #721C24; }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
            font-weight: 500;
        }
        .feedback-box.hint { background: #FFF3CD; color: #856404; }
        .feedback-box.explanation { background: #E2E3E5; color: #383D41; }
    </style>
</head>
<body>

<div class="container">
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo">
    </div>

    <div id="intro-screen" class="hidden">
        <h2>Grade 2 - Chapter 1</h2>
        <p style="margin: 15px 0; color: #64748B;">Welcome to the Number Systems Challenge! Let's apply what we know about place value, grouping, and number tracking.</p>
        <button class="btn" onclick="startInteractive()">Start Interactive</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="header-meta">
            <span id="score-tracker">Score: 0</span>
            <span id="question-number">Q: 1/15</span>
            <span class="timer">Time left: <span id="timer-count">60</span>s</span>
        </div>
        <div id="question-container" class="question-text"></div>
        <div id="options-container" class="options-list"></div>
        <div id="feedback-container" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Challenge Completed!</h2>
        <h3 style="margin: 15px 0; font-size: 24px;" id="final-score">Your Score: 0/15</h3>
        <p id="result-message" style="font-weight: 500; color: #4A5568;"></p>
        <button class="btn" onclick="location.reload()">Try Chapter Again</button>
    </div>
</div>

<audio id="sound-correct" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>
<audio id="sound-wrong" src="assets/wrong.mp3" preload="auto"></audio>

<script>
    const quizData = [
        { id: 1, q: "Kabir says: 'In 426, 4 is in the ones place.' What is his mistake?", opts: { a: "4 is in the hundreds place", b: "4 is in the tens place", c: "4 is in the ones place", d: "No mistake" }, ans: "a", hint: "Think about where the digits live: Hundreds, Tens, Ones!", exp: "The digit 4 represents four hundreds, meaning it sits in the hundreds place." },
        { id: 2, q: "Arjun says: '300 + 40 + 5 = 3450' What is wrong?", opts: { a: "The sum should be 345", b: "The sum should be 305", c: "The sum is correct", d: "Numbers are too big" }, ans: "a", hint: "Don't just write the numbers side by side with a zero added!", exp: "300 + 40 + 5 combines to make 345, not 3450." },
        { id: 3, q: "Look at the numbers: 345 and 135. Which statement is correct?", opts: { a: "Place value of 3 is 300 in both", b: "Place value of 3 is different in both", c: "Place value of 3 is 30 in both", d: "Place value of 3 is 3 in both" }, ans: "b", hint: "Look closely at the positions of the digit 3 in both numbers.", exp: "In 345, 3 is worth 300. In 135, 3 is worth 30. They are different." },
        { id: 4, q: "A child writes two numbers: 345 and 354. Which number is greater?", opts: { a: "345", b: "354", c: "Both are equal", d: "300" }, ans: "b", hint: "Compare the hundreds place first, then look at the tens place.", exp: "Since both have 3 hundreds, we compare the tens. 5 tens is greater than 4 tens." },
        { id: 5, q: "A child counts 248 objects and then counts 100 more. Is the total more than 300?", opts: { a: "Yes", b: "No", c: "Exactly 300", d: "Less than 300" }, ans: "a", hint: "Add 1 hundred to the hundreds digit of 248.", exp: "248 + 100 equals 348, which is greater than 300." },
        { id: 6, q: "A number is 372. Is it more than 350?", opts: { a: "Yes", b: "No", c: "Exactly 350", d: "Less than 300" }, ans: "a", hint: "Look at the tens digit of both numbers.", exp: "372 has 7 tens, which is greater than 350 which has 5 tens." },
        { id: 7, q: "A number is formed using 5 hundreds, 0 tens, and 8 ones. Is the number more than 500?", opts: { a: "Yes", b: "No", c: "Exactly 500", d: "Less than 100" }, ans: "a", hint: "Write out the digits together to form the number.", exp: "The number is 508, which is slightly more than 500." },
        { id: 8, q: "Which number is closest to 400?", opts: { a: "398", b: "420", c: "450", d: "470" }, ans: "a", hint: "Which number needs the fewest jumps to reach 400?", exp: "398 is only 2 jumps away from 400." },
        { id: 9, q: "(Picture-Based) Image: Number line 100–200 with a point right in the middle at 150. Which statement is correct?", opts: { a: "The number is exactly 150", b: "The number is less than 150", c: "The number is more than 150", d: "The number is 100" }, ans: "a", hint: "Look at where the mark sits between 100 and 200.", exp: "The mark sits exactly halfway, pointing straight to 150." },
        { id: 10, q: "Riya has 3 currency notes of ₹100, 4 notes of ₹10, and 7 coins of ₹1. She wants to buy a toy that costs ₹350. Does she have enough money?", opts: { a: "Yes, she has exactly ₹350", b: "No, she only has ₹347", c: "Yes, she has ₹374", d: "No, she only has ₹304" }, ans: "b", hint: "Count up her total value: 300 + 40 + 7.", exp: "Riya only has ₹347, which is short of the ₹350 price tag." },
        { id: 11, q: "A frog is jumping on a number track. It starts at 120 and jumps forward by 10s. What number will the frog land on after 3 more jumps?", opts: { a: "150", b: "160", c: "170", d: "200" }, ans: "a", hint: "Count up by tens three times: 130, 140...", exp: "Three jumps of 10 add 30 to 120, landing the frog right on 150." },
        { id: 12, q: "Rohan packs sweets into boxes. Each full box holds 100 sweets. He fills 5 boxes completely and has 8 individual sweets left over. Which number represents his total sweets?", opts: { a: "58", b: "580", c: "508", d: "805" }, ans: "c", hint: "Be careful! He has 5 hundreds and 8 ones, but 0 extra tens.", exp: "5 hundreds and 8 ones is written as 508." },
        { id: 13, q: "Section A of Grade 2 has 235 books in its mini-library. Section B has 253 books. Which statement is true about their libraries?", opts: { a: "Section A has more books than Section B", b: "Section B has more books than Section A", c: "Both sections have the exact same number of books", d: "Section A has 300 books" }, ans: "b", hint: "Compare the tens column: 3 tens vs 5 tens.", exp: "253 has 5 tens, making Section B's collection larger than Section A's 235." },
        { id: 14, q: "I am a 3-digit number. My hundreds digit is 6, my tens digit is 0, and my ones digit is greater than 7 but less than 9. What number am I?", opts: { a: "678", b: "607", c: "609", d: "608" }, ans: "d", hint: "What single whole number sits between 7 and 9?", exp: "The number is 608 because 8 is the unique digit between 7 and 9." },
        { id: 15, q: "Meera is writing numbers backwards from 500 by tens. She writes: 500, 490, 480, 460, 450. Which number did she accidentally skip?", opts: { a: "470", b: "440", c: "400", d: "495" }, ans: "a", hint: "What number comes 10 steps below 480?", exp: "Counting backwards by tens means 470 belongs right between 480 and 460." }
    ];

    let currentQIdx = 0;
    let score = 0;
    let attempts = 0;
    let timerInterval;
    let timeLeft = 60;

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
        }, 5000);
    });

    function startInteractive() {
        document.getElementById('intro-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        timeLeft = 60;
        attempts = 0;
        
        document.getElementById('timer-count').textContent = timeLeft;
        document.getElementById('feedback-container').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        
        const qData = quizData[currentQIdx];
        document.getElementById('question-number').textContent = `Q: ${currentQIdx + 1}/15`;
        document.getElementById('question-container').textContent = qData.q;
        
        const optionsDiv = document.getElementById('options-container');
        optionsDiv.innerHTML = '';
        
        Object.keys(qData.opts).forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = `${key.toUpperCase()}) ${qData.opts[key]}`;
            btn.onclick = () => handleAnswer(btn, key);
            optionsDiv.appendChild(btn);
        });

        startTimer();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-count').textContent = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                lockQuestionOnTimeout();
            }
        }, 1000);
    }

    function handleAnswer(selectedBtn, chosenKey) {
        const qData = quizData[currentQIdx];
        const isCorrect = (chosenKey === qData.ans);
        
        if (isCorrect) {
            clearInterval(timerInterval);
            selectedBtn.classList.add('correct');
            document.getElementById('sound-correct').play().catch(()=>{});
            score++;
            document.getElementById('score-tracker').textContent = `Score: ${score}`;
            disableAllOptions();
            showFinalExplanation(qData.exp);
        } else {
            attempts++;
            document.getElementById('sound-wrong').play().catch(()=>{});
            if (attempts === 1) {
                selectedBtn.classList.add('wrong');
                selectedBtn.disabled = true;
                showHint(qData.hint);
            } else {
                clearInterval(timerInterval);
                selectedBtn.classList.add('wrong');
                disableAllOptions();
                highlightCorrectAnswer(qData.ans);
                showFinalExplanation(qData.exp);
            }
        }
    }

    function showHint(hintText) {
        const fb = document.getElementById('feedback-container');
        fb.className = "feedback-box hint";
        fb.textContent = `Hint: ${hintText}`;
        fb.classList.remove('hidden');
    }

    function showFinalExplanation(expText) {
        const fb = document.getElementById('feedback-container');
        fb.className = "feedback-box explanation";
        fb.textContent = `Explanation: ${expText}`;
        fb.classList.remove('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function highlightCorrectAnswer(correctKey) {
        const btns = document.getElementsByClassName('option-btn');
        for(let btn of btns) {
            if(btn.textContent.startsWith(correctKey.toUpperCase())) {
                btn.classList.add('correct');
            }
        }
    }

    function disableAllOptions() {
        const btns = document.getElementsByClassName('option-btn');
        for(let btn of btns) {
            btn.disabled = true;
        }
    }

    function lockQuestionOnTimeout() {
        disableAllOptions();
        const qData = quizData[currentQIdx];
        highlightCorrectAnswer(qData.ans);
        showFinalExplanation(`Time ran out! ${qData.exp}`);
    }

    function nextQuestion() {
        currentQIdx++;
        if(currentQIdx < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        const resultScreen = document.getElementById('result-screen');
        resultScreen.classList.remove('hidden');
        
        document.getElementById('final-score').textContent = `Your Score: ${score}/15`;
        
        const percentage = (score / 15) * 100;
        let msg = "";
        if (percentage >= 75) {
            msg = "Good job!";
        } else if (percentage >= 40) {
            msg = "Review this chapter and try again.";
        } else {
            msg = "Let's practise more.";
        }
        document.getElementById('result-message').textContent = msg;
    }
</script>
</body>
</html>
