<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 2 - Chapter 1: Number Systems Interactive</title>
    <style>
        :root {
            --primary: #4A60A1;
            --success: #2ECC71;
            --error: #E74C3C;
            --background: #F5F7FA;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
        }

        /* Method 2: Fixed Splash Screen to hide logo background blocks */
        #splash-screen {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #FFFFFF; 
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #splash-screen img {
            max-width: 240px;
            height: auto;
        }

        /* Utility Classes */
        .hidden { display: none !important; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.9; }

        /* Question Layout */
        .header-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            color: #7F8C8D;
            font-weight: bold;
        }

        .timer { color: var(--error); }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            padding: 14px;
            text-align: left;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:active { background: #EDF2F7; }
        
        .option-btn.correct { background: #D4EDDA; border-color: var(--success); color: #155724; }
        .option-btn.wrong { background: #F8D7DA; border-color: var(--error); color: #721C24; }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
            font-weight: 500;
        }
        .feedback-box.hint { background: #FFF3CD; color: #856404; }
        .feedback-box.explanation { background: #E2E3E5; color: #383D41; }
    </style>
</head>
<body>

<div class="container">
    <div id="splash-screen">
        <img src="assets/logo.png" alt="Innovine Logo">
    </div>

    <div id="intro-screen" class="hidden">
        <h2>Grade 2 - Chapter 1</h2>
        <p style="margin: 15px 0; color: #64748B;">Welcome to the Number Systems Challenge! Let's apply what we know about place value, grouping, and number tracking.</p>
        <button class="btn" onclick="startInteractive()">Start Interactive</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="header-meta">
            <span id="score-tracker">Score: 0</span>
            <span id="question-number">Q: 1/15</span>
            <span class="timer">Time left: <span id="timer-count">60</span>s</span>
        </div>
        <div id="question-container" class="question-text"></div>
        <div id="options-container" class="options-list"></div>
        <div id="feedback-container" class="feedback-box hidden"></div>
        <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Challenge Completed!</h2>
        <h3 style="margin: 15px 0; font-size: 24px;" id="final-score">Your Score: 0/15</h3>
        <p id="result-message" style="font-weight: 500; color: #4A5568;"></p>
        <button class="btn" onclick="location.reload()">Try Chapter Again</button>
    </div>
</div>

<audio id="sound-correct" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>
<audio id="sound-wrong" src="assets/wrong.mp3" preload="auto"></audio>
