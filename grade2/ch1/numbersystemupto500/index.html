<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 2 Math Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffdeb4 0%, #b2ebf2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .game-container {
            background: white;
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.15);
            text-align: center;
            border: 6px solid #4fc3f7;
            position: relative;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen.active {
            display: flex;
        }

        /* Splash Screen styling */
        #splash-screen img {
            max-width: 220px;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.1));
        }

        /* Header / Controls styling */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #f1f8e9;
            padding: 8px 12px;
            border-radius: 12px;
            border: 2px dashed #8bc34a;
        }

        .level-indicator {
            font-size: 0.95rem;
            color: #2e7d32;
            font-weight: bold;
        }

        .score-board {
            font-size: 0.95rem;
            color: #e65100;
            font-weight: bold;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #e1f5fe;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #0277bd;
            font-weight: bold;
        }

        .volume-control input {
            width: 60px;
            cursor: pointer;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            height: 14px;
            border: 1px solid #ccc;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9800, #ffeb3b);
            transition: width 0.3s ease;
        }

        /* Question & Options */
        .question-box {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 25px;
            font-weight: bold;
            line-height: 1.4;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-container {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        /* Flexbox structure for symbols level */
        .options-container.row-layout {
            grid-template-columns: repeat(3, 1fr);
        }

        .btn {
            background: #fff;
            border: 3px solid #ffb74d;
            border-bottom: 7px solid #ffb74d;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #e65100;
            cursor: pointer;
            transition: all 0.1s ease;
            outline: none;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:active:not(.disabled) {
            border-bottom-width: 3px;
            transform: translateY(4px);
        }

        .btn.correct {
            background-color: #c8e6c9 !important;
            border-color: #4caf50 !important;
            border-bottom-color: #388e3c !important;
            color: #1b5e20 !important;
        }

        .btn.wrong {
            background-color: #ffcdd2 !important;
            border-color: #f44336 !important;
            border-bottom-color: #d32f2f !important;
            color: #b71c1c !important;
        }

        .btn.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Action Buttons (Start, Next, Restart) */
        .action-btn {
            background: #4caf50;
            border: 3px solid #388e3c;
            border-bottom: 7px solid #388e3c;
            color: white;
            font-size: 1.3rem;
            padding: 12px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.1s ease;
        }

        .action-btn:active {
            border-bottom-width: 3px;
            transform: translateY(4px);
        }

        /* Transition Screens */
        .transition-title {
            font-size: 2rem;
            color: #2e7d32;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .transition-text {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 25px;
        }

        /* End Screen values */
        .final-title {
            font-size: 2.2rem;
            color: #e65100;
            margin-bottom: 15px;
        }
        
        .final-score {
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
        <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
        <audio id="audio-applause" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

        <div id="splash-screen" class="screen active">
            <img src="assets/innovine-logo.png" alt="INNOVINE LOGO">
            <button class="action-btn" onclick="startGame()">Start Game</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <div id="level-label" class="level-indicator">Level 1</div>
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.8" onchange="updateVolume()">
                </div>
                <div id="score-label" class="score-board">Score: 0</div>
            </div>

            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div id="question-text" class="question-box">Loading question...</div>
            <div id="options-box" class="options-container"></div>
        </div>

        <div id="clear-screen" class="screen">
            <div class="transition-title">🎉 Level Clear! 🎉</div>
            <div id="clear-msg" class="transition-text">You did an amazing job! Ready for the next challenge?</div>
            <button id="next-level-btn" class="action-btn" onclick="nextLevel()">Next Level</button>
        </div>

        <div id="end-screen" class="screen">
            <div class="final-title">🏆 Superstar! 🏆</div>
            <div class="transition-text">You completed all three levels of the Grade 2 Math Challenge!</div>
            <div id="final-score-text" class="final-score">Total Score: 0 / 30</div>
            <button class="action-btn" style="background:#ff9800; border-color:#f57c00;" onclick="resetToSplash()">Restart Game</button>
        </div>

    </div>

    <script>
        // Game Variables
        let currentLevel = 1;
        let currentQuestionIdx = 0;
        let score = 0;
        let questions = [];
        let canAnswer = true;
        let globalVolume = 0.8;

        // Sound Triggers
        function playSound(id) {
            const sound = document.getElementById(id);
            if (sound) {
                sound.volume = globalVolume;
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio playback waiting for interaction."));
            }
        }

        function updateVolume() {
            globalVolume = document.getElementById('volume-slider').value;
        }

        // Confetti Side Cannons (Correct Answer Reward)
        function triggerCorrectConfetti() {
            let end = Date.now() + (0.4 * 1000);
            let colors = ['#ffeb3b', '#ff9800', '#00ebff', '#ff007f', '#4caf50'];

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.9 },
                    colors: colors
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.9 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Continuous Fireworks Confetti (Level/Game Completion Reward)
        function triggerCompletionConfetti() {
            let duration = 3 * 1000;
            let animationEnd = Date.now() + duration;
            let defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            let interval = setInterval(function() {
                let timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                let particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // Screen Routing
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Initialize and Start Game
        function startGame() {
            currentLevel = 1;
            currentQuestionIdx = 0;
            score = 0;
            setupLevel();
            showScreen('game-screen');
        }

        // Construct Questions dynamic to levels
        function setupLevel() {
            currentQuestionIdx = 0;
            questions = [];
            document.getElementById('level-label').innerText = `Level ${currentLevel}`;
            document.getElementById('score-label').innerText = `Score: ${score}`;

            const optionsBox = document.getElementById('options-box');
            if (currentLevel === 3) {
                optionsBox.classList.add('row-layout');
            } else {
                optionsBox.classList.remove('row-layout');
            }

            for (let i = 0; i < 10; i++) {
                if (currentLevel === 1) {
                    generateLevel1Question();
                } else if (currentLevel === 2) {
                    generateLevel2Question();
                } else if (currentLevel === 3) {
                    generateLevel3Question();
                }
            }
            loadQuestion();
        }

        // Helper randomizer
        function getRandomNum(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function shuffleArray(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        // LEVEL 1 GENERATOR: Before, After, Between
        function generateLevel1Question() {
            let type = getRandomNum(1, 3); // 1=Before, 2=After, 3=Between
            let qText = "";
            let correctAns = 0;
            let baseNum = getRandomNum(100, 490);

            if (type === 1) {
                qText = `What number comes before ${baseNum}?`;
                correctAns = baseNum - 1;
            } else if (type === 2) {
                qText = `What number comes after ${baseNum}?`;
                correctAns = baseNum + 1;
            } else {
                qText = `What number is between ${baseNum} and ${baseNum + 2}?`;
                correctAns = baseNum + 1;
            }

            let choices = [correctAns];
            while (choices.length < 4) {
                let fake = correctAns + getRandomNum(-15, 15);
                if (fake > 0 && fake <= 500 && !choices.includes(fake)) {
                    choices.push(fake);
                }
            }
            questions.push({ question: qText, choices: shuffleArray(choices), answer: correctAns });
        }

        // LEVEL 2 GENERATOR: Place Value & Expanded Form
        function generateLevel2Question() {
            let type = getRandomNum(1, 3); // 1=Standard form, 2=Expanded form, 3=Place Value Identify
            let qText = "";
            let correctAns = "";
            let num = getRandomNum(100, 499);
            
            let h = Math.floor(num / 100);
            let t = Math.floor((num % 100) / 10);
            let o = num % 10;

            let choices = [];

            if (type === 1) {
                qText = `What is ${h * 100} + ${t * 10} + ${o} in standard form?`;
                correctAns = num.toString();
                choices.push(correctAns);
                while (choices.length < 4) {
                    let fake = (num + getRandomNum(-20, 20)).toString();
                    if (!choices.includes(fake)) choices.push(fake);
                }
            } else if (type === 2) {
                qText = `What is the expanded form of ${num}?`;
                correctAns = `${h * 100} + ${t * 10} + ${o}`;
                choices.push(correctAns);
                while (choices.length < 4) {
                    let fh = getRandomNum(1, 4) * 100;
                    let ft = getRandomNum(0, 9) * 10;
                    let fo = getRandomNum(0, 9);
                    let fake = `${fh} + ${ft} + ${fo}`;
                    if (!choices.includes(fake) && fake !== correctAns) choices.push(fake);
                }
            } else {
                let places = ["Ones", "Tens", "Hundreds"];
                let chosenPlaceIdx = getRandomNum(0, 2);
                let targetDigit = [o, t, h][chosenPlaceIdx];
                
                qText = `In the number ${num}, what is the place value of digit ${targetDigit}?`;
                correctAns = places[chosenPlaceIdx];
                choices = ["Ones", "Tens", "Hundreds"];
            }

            questions.push({ question: qText, choices: shuffleArray(choices), answer: correctAns });
        }

        // LEVEL 3 GENERATOR: Comparison
        function generateLevel3Question() {
            let num1 = getRandomNum(100, 500);
            let num2 = getRandomNum(100, 500);
            // Balance out chances of getting exact equal numbers randomly
            if (getRandomNum(1, 4) === 1) {
                num2 = num1;
            }

            let qText = `Compare: ${num1}  ______  ${num2}`;
            let correctAns = "=";
            if (num1 > num2) correctAns = ">";
            if (num1 < num2) correctAns = "<";

            questions.push({ question: qText, choices: ["<", ">", "="], answer: correctAns });
        }

        // Load current Question into UI
        function loadQuestion() {
            canAnswer = true;
            let q = questions[currentQuestionIdx];
            
            // Progress Update
            let progressPercent = (currentQuestionIdx / 10) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            document.getElementById('question-text').innerText = q.question;
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = "";

            q.choices.forEach(choice => {
                let btn = document.createElement('button');
                btn.className = "btn";
                btn.innerText = choice;
                btn.onclick = () => selectAnswer(btn, choice);
                optionsBox.appendChild(btn);
            });
        }

        // Evaluate Answer selections
        function selectAnswer(selectedBtn, choice) {
            if (!canAnswer) return;
            canAnswer = false;

            let q = questions[currentQuestionIdx];
            let buttons = document.getElementById('options-box').children;

            if (choice.toString() === q.answer.toString()) {
                selectedBtn.classList.add('correct');
                score++;
                document.getElementById('score-label').innerText = `Score: ${score}`;
                playSound('audio-correct');
                triggerCorrectConfetti();
            } else {
                selectedBtn.classList.add('wrong');
                playSound('audio-wrong');
                // Reveal the correct answer visually
                for (let btn of buttons) {
                    if (btn.innerText.toString() === q.answer.toString()) {
                        btn.classList.add('correct');
                    }
                }
            }

            // Lock out other buttons
            for (let btn of buttons) {
                btn.classList.add('disabled');
            }

            // Step up question pointer loop
            setTimeout(() => {
                currentQuestionIdx++;
                if (currentQuestionIdx < 10) {
                    loadQuestion();
                } else {
                    handleLevelCompletion();
                }
            }, 2000);
        }

        // Manage Level shifting
        function handleLevelCompletion() {
            document.getElementById('progress-bar').style.width = `100%`;
            triggerCompletionConfetti();

            if (currentLevel < 3) {
                if (currentLevel === 1) {
                    document.getElementById('clear-msg').innerText = "Superb! You solved Before, After, and Between Numbers. Ready for Level 2: Place Value & Expanded Form?";
                } else if (currentLevel === 2) {
                    document.getElementById('clear-msg').innerText = "Fantastic Work! Place values are cleared. Ready for Level 3: The Great Number Comparison?";
                }
                showScreen('clear-screen');
            } else {
                // Game Finished Entirely
                playSound('audio-applause');
                document.getElementById('final-score-text').innerText = `Total Score: ${score} / 30`;
                showScreen('end-screen');
            }
        }

        function nextLevel() {
            currentLevel++;
            setupLevel();
            showScreen('game-screen');
        }

        function resetToSplash() {
            showScreen('splash-screen');
        }
    </script>

</body>
</html>
