<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweet Treats Bakery Party</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            touch-action: none; /* Disables page scrolling completely while interacting */
        }
        body {
            background-color: #fff3e0;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        /* Splash Screen Style */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ff7043;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Intro Screen Style */
        #intro-screen {
            background: white;
            border: 4px solid #ffb74d;
            border-radius: 20px;
            padding: 25px 20px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            display: none;
        }
        .intro-title {
            color: #e65100;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .intro-chef-img {
            max-width: 140px;
            height: auto;
            margin: 10px auto;
            display: block;
        }
        .intro-card {
            background: #fff8e1;
            border: 2px dashed #ffb300;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .intro-level-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .intro-level-row:last-child {
            margin-bottom: 0;
        }
        .intro-icon {
            font-size: 32px;
            min-width: 35px;
            text-align: center;
        }
        .intro-level-text h3 {
            margin: 0;
            color: #d84315;
            font-size: 16px;
        }
