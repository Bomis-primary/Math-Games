<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time & Seasons Adventure</title>
    <!-- Canvas Confetti Library for Celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #1e88e5;
            --secondary: #ffb74d;
            --background: #e3f2fd;
            --card-bg: #ffffff;
            --text: #263238;
            --correct: #4caf50;
            --wrong: #f44336;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border: 4px solid var(--secondary);
            margin-top: 10px;
            display: flex;
            flex-direction: column;
        }

        /* Header & Audio Controls */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 15px;
        }

        .score-lbl {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
        }

        .audio-ctrl {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-ctrl label {
            font-size: 12px;
            font-weight: bold;
        }

        .audio-ctrl input[type="range"] {
            width: 60px;
            accent-color: var(--primary);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffb74d, #ff9800);
            transition: width 0.4s ease;
        }

        /* Question Layout */
        .question-box {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
            line-height: 1.4;
        }

        /* Dynamic Visual Clocks or Context Icons */
        .visual-display {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .clock-svg {
            width: 140px;
            height: 140px;
            background: #fff;
            border-radius: 50%;
            border: 5px solid var(--primary);
            position: relative;
        }

        .scenery-emoji {
            font-size: 70px;
            animation: bounce 2s infinite ease-in-out;
        }

        /* Options Wrapper */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        /* Evaluation States */
        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--correct) !important;
            color: #2e7d32 !important;
        }

        .option-btn.wrong {
            background-color: #ffebee !important;
            border-color: var(--wrong) !important;
            color: #c62828 !important;
        }

        /* End Game Cards */
        .summary-card {
            text-align: center;
            padding: 20px 10px;
        }

        .summary-emoji {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .btn-restart {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(30, 136, 229, 0.3);
            width: 100%;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Top Controls Panel -->
        <div class="header-panel">
            <div class="score-lbl" id="score-display">Score: 0/10</div>
            <div class="audio-ctrl">
                <label for="volumeSlider">🔊 Vol:</label>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
            </div>
        </div>

        <!-- Progress Tracking -->
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Main Dynamic Canvas Area -->
        <div id="game-arena">
            <!-- Dynamic Content Injected via Script -->
        </div>
    </div>

    <script>
        const masterQuestionsList = [
            {
                type: 'clock',
                question: "Look closely at the clock! What time does it show?",
                hour: 3, minute: 0,
                options: ["3 o'clock", "12 o'clock", "Half past 3", "6 o'clock"],
                answer: "3 o'clock"
            },
            {
                type: 'clock',
                question: "The little hand is between 8 and 9. The big hand is on 6. What time is it?",
                hour: 8, minute: 30,
                options: ["8 o'clock", "9 o'clock", "Half past 8", "Half past 9"],
                answer: "Half past 8"
            },
            {
                type: 'clock',
                question: "Look at this clock! Where are the hands pointing?",
                hour: 11, minute: 0,
                options: ["11 o'clock", "12 o'clock", "Half past 11", "1 o'clock"],
                answer: "11 o'clock"
            },
            {
                type: 'clock',
                question: "The clock face shows the long hand on 6 and short hand between 1 and 2. It is...",
                hour: 1, minute: 30,
                options: ["1 o'clock", "Half past 1", "2 o'clock", "Half past 2"],
                answer: "Half past 1"
            },
            {
                type: 'text',
                emoji: '📅',
                question: "If today is Wednesday, what day was it yesterday?",
                options: ["Tuesday", "Thursday", "Monday", "Friday"],
                answer: "Tuesday"
            },
            {
                type: 'text',
                emoji: '☀️',
                question: "If yesterday was Sunday, what day will it be tomorrow?",
                options: ["Monday", "Tuesday", "Saturday", "Wednesday"],
                answer: "Tuesday"
            },
            {
                type: 'text',
                emoji: '❄️',
                question: "Which month comes right after July?",
                options: ["June", "August", "September", "May"],
                answer: "August"
            },
            {
                type: 'text',
                emoji: '🦘',
                question: "How many days are there in February during a Leap Year?",
                options: ["28 Days", "29 Days", "30 Days", "31 Days"],
                answer: "29 Days"
            },
            {
                type: 'text',
                emoji: '🍦',
                question: "Riya is wearing cotton clothes and drinking cold mango juice. What season is it?",
                options: ["Winter Season", "Monsoon Season", "Summer Season", "Autumn Season"],
                answer: "Summer Season"
            },
            {
                type: 'text',
                emoji: '☔',
                question: "The sky is filled with dark clouds and you need an umbrella to go out. What season is this?",
                options: ["Summer Season", "Monsoon Season", "Winter Season", "Spring Season"],
                answer: "Monsoon Season"
            }
        ];

        let activeDeck = [];
        let currentIndex = 0;
        let runningScore = 0;
        let isInputLocked = false;

        function playBeep(isCorrect) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                const currentVol = parseFloat(document.getElementById('volumeSlider').value) || 0.5;
                gainNode.gain.setValueAtTime(currentVol, ctx.currentTime);
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);

                if (isCorrect) {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                }
            } catch (e) {
                console.log("Audio contexts blocked or unsupported.", e);
            }
        }

        function buildClockSVG(h, m) {
            const hrAngle = (h * 30) + (m * 0.5);
            const minAngle = m * 6;

            return `
                <svg class="clock-svg" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="90" fill="#ffffff" stroke="#1e88e5" stroke-width="6"/>
                    <text x="100" y="30" font-size="16" font-weight="bold" text-anchor="middle">12</text>
                    <text x="175" y="106" font-size="16" font-weight="bold" text-anchor="middle">3</text>
                    <text x="100" y="182" font-size="16" font-weight="bold" text-anchor="middle">6</text>
                    <text x="25" y="106" font-size="16" font-weight="bold" text-anchor="middle">9</text>
                    <circle cx="100" cy="100" r="6" fill="#1e88e5" />
                    <line x1="100" y1="100" x2="100" y2="55" stroke="#263238" stroke-width="6" stroke-linecap="round" transform="rotate(${hrAngle} 100 100)" />
                    <line x1="100" y1="100" x2="100" y2="35" stroke="#ff9800" stroke-width="4" stroke-linecap="round" transform="rotate(${minAngle} 100 100)" />
                </svg>
            `;
        }

        function initGameLoop() {
            activeDeck = [...masterQuestionsList].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            runningScore = 0;
            isInputLocked = false;
            
            updateScoreHeader();
            renderQuestionScreen();
        }

        function updateScoreHeader() {
            document.getElementById('score-display').innerText = `Score: ${runningScore}/${activeDeck.length}`;
            const progressBar = document.getElementById('progress-bar');
            const targetPct = (currentIndex / activeDeck.length) * 100;
            progressBar.style.width = `${targetPct}%`;
        }

        function renderQuestionScreen() {
            isInputLocked = false;
            updateScoreHeader();

            if (currentIndex >= activeDeck.length) {
                renderEndGameScreen();
                return;
            }

            const activeQuestionData = activeDeck[currentIndex];
            const arena = document.getElementById('game-arena');

            let visualLayout = '';
            if (activeQuestionData.type === 'clock') {
                visualLayout = buildClockSVG(activeQuestionData.hour, activeQuestionData.minute);
            } else {
                visualLayout = `<div class="scenery-emoji">${activeQuestionData.emoji || '⏰'}</div>`;
            }

            const randomizedChoices = [...activeQuestionData.options].sort(() => Math.random() - 0.5);

            arena.innerHTML = `
                <div class="question-box">${activeQuestionData.question}</div>
                <div class="visual-display">${visualLayout}</div>
                <div class="options-list">
                    ${randomizedChoices.map(choice => `
                        <button class="option-btn" onclick="handleChoiceSubmission(this, '${choice.replace(/'/g, "\\'")}')">
                            <span>⚪</span> ${choice}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function handleChoiceSubmission(selectedBtn, pickedString) {
            if (isInputLocked) return;
            isInputLocked = true;

            const targetQuestion = activeDeck[currentIndex];
            const allOptionNodes = document.querySelectorAll('.option-btn');

            if (pickedString === targetQuestion.answer) {
                selectedBtn.classList.add('correct');
                selectedBtn.querySelector('span').innerText = '🎉';
                runningScore++;
                playBeep(true);

                if (typeof confetti === 'function') {
                    confetti({ particleCount: 40, spread: 50, origin: { y: 0.75 } });
                }
            } else {
                selectedBtn.classList.add('wrong');
                selectedBtn.querySelector('span').innerText = '❌';
                playBeep(false);

                allOptionNodes.forEach(btn => {
                    if (btn.innerText.includes(targetQuestion.answer)) {
                        btn.classList.add('correct');
                        btn.querySelector('span').innerText = '✨';
                    }
                });
            }

            setTimeout(() => {
                currentIndex++;
                renderQuestionScreen();
            }, 1800);
        }

        function renderEndGameScreen() {
            const arena = document.getElementById('game-arena');
            document.getElementById('progress-bar').style.width = '100%';

            let finalMessage = "Keep practicing! You can do it! 💪";
            let celebrationEmoji = "🎈";

            if (runningScore >= 9) {
                finalMessage = "Wow! You are a Time & Seasons Master! 👑🎖️";
                celebrationEmoji = "🏆";
            } else if (runningScore >= 6) {
                finalMessage = "Wonderful Job! Great work tracking the days and seasons! 🌟";
                celebrationEmoji = "🎉";
            }

            arena.innerHTML = `
                <div class="summary-card">
                    <div class="summary-emoji">${celebrationEmoji}</div>
                    <h2>Game Finished!</h2>
                    <p style="font-size: 20px; font-weight: bold; color: var(--primary); margin: 10px 0;">
                        Final Score: ${runningScore} / ${activeDeck.length}
                    </p>
                    <p style="font-size: 15px; color: #37474f; font-style: italic; line-height: 1.4; margin-bottom: 25px;">
                        ${finalMessage}
                    </p>
                    <button class="btn-restart" onclick="initGameLoop()">Play Again 🔄</button>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', initGameLoop);
    </script>
</body>
</html>
