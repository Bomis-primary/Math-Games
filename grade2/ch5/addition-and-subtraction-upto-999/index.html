<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Climb: Vertical Tower - Grade 2</title>
<style>
    :root {
        --sky-blue: #38bdf8;
        --ladder-gold: #fbbf24;
        --snake-red: #ef4444;
        --board-bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
        width: 100%; height: 100%;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #1e293b; overflow: hidden;
        background-color: var(--sky-blue);
    }

    .game-container {
        position: relative; width: 100%; height: 100%;
        background: #38bdf8 url('assets/sky-bg.png') no-repeat center center;
        background-size: cover;
        display: flex; justify-content: center; align-items: center;
        flex-direction: column; padding: 15px;
    }

    /* Brand Splash Overlay */
    #screen-splash {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #ffffff !important; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 1; transition: opacity 0.5s ease;
    }
    .logo-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .logo-img {
        max-width: 260px; max-height: 140px; object-fit: contain;
    }
    .logo-fallback {
        width: 100px; height: 100px; background: linear-gradient(135deg, #0284c7, #38bdf8);
        border-radius: 24px; display: flex; align-items: center; justify-content: center;
        color: white; font-size: 50px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .splash-loader {
        margin-top: 30px; width: 140px; height: 6px; background: #e2e8f0;
        border-radius: 3px; overflow: hidden; position: relative;
    }
    .splash-loader-bar {
        position: absolute; background: #0284c7; width: 100%; height: 100%;
        left: -100%; animation: loadProgress 5s linear forwards; 
    }

    .screen {
        display: none; width: 100%; max-width: 600px;
        flex-direction: column; align-items: center; text-align: center;
        z-index: 5;
    }
    .screen.active { display: flex !important; }

    .card {
        background: rgba(255, 255, 255, 0.98);
        padding: 25px; border-radius: 32px; width: 100%;
        border: 6px solid #0284c7; box-shadow: 0 15px 35px rgba(15, 23, 42, 0.2);
    }
    h1 { font-size: 34px; color: #0284c7; margin-bottom: 10px; font-weight: 800; }
    p { font-size: 17px; line-height: 1.5; color: #475569; margin-bottom: 20px; }

    /* Character Selection Setup */
    .character-select-box {
        display: flex; justify-content: center; gap: 15px; margin: 15px 0;
    }
    .char-card {
        background: white; border: 4px solid #cbd5e1; border-radius: 20px;
        padding: 12px; cursor: pointer; transition: all 0.2s ease; width: 110px;
    }
    .char-card:hover { transform: translateY(-3px); border-color: #38bdf8; }
    .char-card.selected { border-color: #22c55e; background: #f0fdf4; transform: scale(1.05); }
    .char-card img { width: 70px; height: 70px; object-fit: contain; }
    
    .fallback-avatar {
        width: 70px; height: 70px; background: #f97316; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 36px; color: white;
    }

    /* VERTICAL TOWER BOARD DESIGN */
    .board-frame-wrapper {
        position: relative; width: 100%; max-width: 420px; background: #cbd5e1;
        padding: 12px; border-radius: 24px; margin-bottom: 15px; border: 5px solid #94a3b8;
        box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
    }
    .board-grid-tower {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 4 columns across */
        grid-template-rows: repeat(2, 1fr);    /* 2 rows high */
        gap: 10px; width: 100%;
    }
    .board-tile {
        background: white; border: 3px solid #e2e8f0; border-radius: 16px;
        min-height: 85px; display: flex; flex-direction: column; align-items: center;
        justify-content: flex-start; padding: 8px 4px; font-weight: bold; font-size: 16px;
        position: relative; transition: background 0.3s;
    }
    .board-tile.ladder-tile { border-color: var(--ladder-gold); background: #fef8e7; color: #b45309; }
    .board-tile.snake-tile { border-color: var(--snake-red); background: #fef2f2; color: #b91c1c; }
    .board-tile.win-tile { border-color: #22c55e; background: #f0fdf4; color: #16a34a; }

    .tile-decor-tag {
        font-size: 11px; font-weight: 800; background: rgba(0,0,0,0.05);
        padding: 2px 6px; border-radius: 8px; margin-top: auto; text-transform: uppercase;
    }

    /* SMOOTHLY MOVING CHARACTER PAWN */
    .pawn-container-anchor {
        position: absolute; width: 55px; height: 55px;
        transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); /* Makes character slide/climb smoothly */
        z-index: 10; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
    }
