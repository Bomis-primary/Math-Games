<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Party Division</title>
    <!-- Canvas Confetti Library for completion celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }
        body {
            background-color: #fff3e0;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Splash Screen Style */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen img {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ff7043;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Game Container */
        .game-container {
            background: white;
            border: 4px solid #ffb74d;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            display: none; /* Hidden during splash screen */
        }
        h1 {
            color: #e65100;
            margin: 0 0 10px 0;
            font-size: 26px;
        }
        .volume-box {
            background: #fff8e1;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .progress-bar {
            background: #f5f5f5;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            background: #ffb74d;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .story-text {
            font-size: 18px;
            color: #4e342e;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.4;
        }
        .visual-display {
            background: #fafafa;
            border: 2px dashed #bcaaa4;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #8d6e63;
            margin-bottom: 5px;
        }
        .emoji-row {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn {
            background: #ff7043;
            border: none;
            border-bottom: 4px solid #d84315;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .btn.correct {
            background: #4caf50 !important;
            border-color: #2e7d32 !important;
        }
        .btn.wrong {
            background: #f44336 !important;
            border-color: #c62828 !important;
        }
        #restart-btn {
            grid-column: span 2;
            background: #29b6f6;
            border-color: #0288d1;
        }
    </style>
</head>
<body>

    <!-- 5-Second Splash Screen using repository assets -->
    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.style.display='none';">
        <div class="loader"></div>
        <p style="color: #6d4c41; font-weight: bold; margin-top: 15px;">Loading Your Game...</p>
    </div>

    <!-- Audio Elements pointing to repository assets -->
    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="game-container" id="main-game">
        <h1>🍕 Pizza Party Share!</h1>
        
        <div class="volume-box">
            <label for="volume">🔊 Volume: </label>
            <input type="range" id="volume" min="0" max="1" step="0.2" value="0.6">
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="game-content">
            <!-- Questions dynamically go here -->
        </div>
    </div>

    <script>
        const volInput = document.getElementById('volume');
        const sndCorrect = document.getElementById('audio-correct');
        const sndWrong = document.getElementById('audio-wrong');

        function playSound(isCorrect) {
            const currentVolume = volInput.value;
            if (isCorrect) {
                sndCorrect.volume = currentVolume;
                sndCorrect.currentTime = 0;
                sndCorrect.play().catch(e => console.log("Audio play blocked"));
            } else {
                sndWrong.volume = currentVolume;
                sndWrong.currentTime = 0;
                sndWrong.play().catch(e => console.log("Audio play blocked"));
            }
        }

        const questionsList = [
            { total: 4, kids: 2, kidsEmojis: "👦👧", answer: 2, options: [1, 2, 3, 4] },
            { total: 6, kids: 2, kidsEmojis: "👦👧", answer: 3, options: [2, 3, 4, 5] },
            { total: 6, kids: 3, kidsEmojis: "👦👧👶", answer: 2, options: [1, 2, 3, 4] },
            { total: 8, kids: 2, kidsEmojis: "👧👧", answer: 4, options: [2, 3, 4, 6] },
            { total: 9, kids: 3, kidsEmojis: "👦👧👦", answer: 3, options: [2, 3, 4, 5] },
            { total: 10, kids: 2, kidsEmojis: "👦👧", answer: 5, options: [2, 4, 5, 6] },
            { total: 12, kids: 3, kidsEmojis: "👧👧👧", answer: 4, options: [3, 4, 5, 6] },
            { total: 12, kids: 4, kidsEmojis: "👦👧👦👧", answer: 3, options: [2, 3, 4, 6] },
            { total: 15, kids: 3, kidsEmojis: "👦👧👶", answer: 5, options: [3, 4, 5, 6] },
            { total: 16, kids: 4, kidsEmojis: "👦👧👦👧", answer: 4, options: [2, 4, 5, 8] }
        ];

        let activeQuestions = [];
        let index = 0;
        let points = 0;
        let acceptInput = true;

        // Splash Screen Timer Control (5 Seconds)
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const game = document.getElementById('main-game');
            
            splash.style.opacity = 0;
            setTimeout(() => {
                splash.style.display = 'none';
                game.style.display = 'block';
                initGame();
            }, 500);
        }, 5000);

        function initGame() {
            activeQuestions = [...questionsList].sort(() => Math.random() - 0.5);
            index = 0;
            points = 0;
            showQuestion();
        }

        function showQuestion() {
            acceptInput = true;
            const container = document.getElementById('game-content');
            const prog = document.getElementById('progress');
            
            prog.style.width = `${(index / activeQuestions.length) * 100}%`;

            if (index >= activeQuestions.length) {
                endGame();
                return;
            }

            const q = activeQuestions[index];
            
            let pizzaDisplay = "";
            for(let i = 0; i < q.total; i++) {
                pizzaDisplay += "🍕";
            }

            container.innerHTML = `
                <div class="story-text">
                    There are ${q.total} pizza slices. Share them equally among the ${q.kids} children. How many slices does each child get?
                </div>
                <div class="visual-display">
                    <div class="section-title">Pizza Slices</div>
                    <div class="emoji-row">${pizzaDisplay}</div>
                    <div class="section-title">Hungry Children</div>
                    <div class="emoji-row">${q.kidsEmojis}</div>
                </div>
                <div class="options-grid">
                    ${q.options.map(num => `<button class="btn" onclick="submitAnswer(this, ${num})">${num}</button>`).join('')}
                </div>
            `;
        }

        function submitAnswer(element, choice) {
            if (!acceptInput) return;
            acceptInput = false;

            const q = activeQuestions[index];
            if (choice === q.answer) {
                points++;
                element.classList.add('correct');
                playSound(true);
                confetti({ particleCount: 30, spread: 40, origin: { y: 0.75 } });
            } else {
                element.classList.add('wrong');
                playSound(false);
                document.querySelectorAll('.options-grid .btn').forEach(b => {
                    if (parseInt(b.innerText) === q.answer) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                index++;
                showQuestion();
            }, 2000);
        }

        function endGame() {
            document.getElementById('progress').style.width = '100%';
            const container = document.getElementById('game-content');
            
            if (points >= 7) {
                confetti({ particleCount: 120, spread: 70 });
            }

            container.innerHTML = `
                <div class="story-text" style="font-size: 24px; color: #2e7d32;">Party Complete! 🥳</div>
                <div class="story-text">You successfully helped feed everyone! Your score: ${points} / ${activeQuestions.length}</div>
                <div class="options-grid">
                    <button id="restart-btn" class="btn" onclick="initGame()">Play Again 🔄</button>
                </div>
            `;
        }
    </script>
</body>
</html>
