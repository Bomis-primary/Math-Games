<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Party Division</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            touch-action: none; /* Disables page scrolling completely while interacting */
        }
        body {
            background-color: #fff3e0;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        /* Splash Screen Style */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #splash-screen img {
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(0.95); }
            to { transform: scale(1.05); }
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ff7043;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Game Container */
        .game-container {
            background: white;
            border: 4px solid #ffb74d;
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            display: none;
        }
        h1 {
            color: #e65100;
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        .volume-box {
            background: #fff8e1;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .progress-bar {
            background: #f5f5f5;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress {
            background: #ffb74d;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .story-text {
            font-size: 16px;
            color: #4e342e;
            margin-bottom: 10px;
            font-weight: bold;
            line-height: 1.4;
        }
        .instruction-alert {
            font-size: 13px;
            color: #d84315;
            font-weight: bold;
            margin-bottom: 12px;
            background: #fbe9e7;
            padding: 6px;
            border-radius: 6px;
        }
        /* Drag and Drop Sandbox layout */
        .sandbox {
            background: #fafafa;
            border: 2px dashed #bcaaa4;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            position: relative;
        }
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #8d6e63;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .source-zone {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 65px;
            background: #fffde7;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 12px;
        }
        .pizza-piece {
            font-size: 34px;
            cursor: grab;
            user-select: none;
            display: inline-block;
            transition: transform 0.1s;
        }
        .pizza-piece.dragging {
            cursor: grabbing;
            transform: scale(1.2);
            z-index: 1000 !important;
        }
        .targets-container {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin-top: 10px;
        }
        .child-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 85px;
        }
        .child-avatar {
            font-size: 36px;
            margin-bottom: 3px;
        }
        .drop-plate {
            width: 75px;
            height: 75px;
            background: #e0f2f1;
            border: 3px dashed #009688;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 2px;
            padding: 4px;
            transition: background 0.2s, transform 0.2s;
        }
        .drop-plate.hovered {
            background: #b2dfdb;
            transform: scale(1.05);
        }
        /* Options Panel Layout */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .options-grid.unlocked {
            opacity: 1;
            pointer-events: auto;
        }
        .btn {
            background: #ff7043;
            border: none;
            border-bottom: 4px solid #d84315;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .btn.correct {
            background: #4caf50 !important;
            border-color: #2e7d32 !important;
        }
        .btn.wrong {
            background: #f44336 !important;
            border-color: #c62828 !important;
        }
        #restart-btn {
            grid-column: span 2;
            background: #29b6f6;
            border-color: #0288d1;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="assets/innovine-logo.png" alt="Logo" onerror="this.style.display='none';">
        <div class="loader"></div>
        <p style="color: #6d4c41; font-weight: bold; margin-top: 15px;">Setting up Pizza Party...</p>
    </div>

    <audio id="audio-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="game-container" id="main-game">
        <h1>🍕 Pizza Party Share!</h1>
        
        <div class="volume-box">
            <label for="volume">🔊 Volume: </label>
            <input type="range" id="volume" min="0" max="1" step="0.2" value="0.6">
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="game-content">
            </div>
    </div>

    <script>
        const volInput = document.getElementById('volume');

        // Foolproof audio player wrapped inside error-catch zones
        function playSound(isCorrect) {
            try {
                const targetId = isCorrect ? 'audio-correct' : 'audio-wrong';
                const audioEl = document.getElementById(targetId);
                if (audioEl) {
                    audioEl.volume = volInput.value;
                    audioEl.currentTime = 0;
                    audioEl.play().catch(() => {
                        console.log("Audio play prevented by browser safety restrictions.");
                    });
                }
            } catch (err) {
                console.log("Audio elements not found or failed to load cleanly.");
            }
        }

        const questionsList = [
            { total: 4, kids: 2, avatars: ["👦", "👧"], answer: 2, options: [1, 2, 3, 4] },
            { total: 6, kids: 2, avatars: ["👦", "👧"], answer: 3, options: [2, 3, 4, 5] },
            { total: 6, kids: 3, avatars: ["👦", "👧", "👶"], answer: 2, options: [1, 2, 3, 4] },
            { total: 8, kids: 2, avatars: ["👧", "👧"], answer: 4, options: [2, 3, 4, 6] },
            { total: 9, kids: 3, avatars: ["👦", "👧", "👦"], answer: 3, options: [2, 3, 4, 5] },
            { total: 10, kids: 2, avatars: ["👦", "👧"], answer: 5, options: [2, 4, 5, 6] },
            { total: 12, kids: 3, avatars: ["👧", "👧", "👧"], answer: 4, options: [3, 4, 5, 6] },
            { total: 12, kids: 4, avatars: ["👦", "👧", "👦", "👧"], answer: 3, options: [2, 3, 4, 6] }
        ];

        let activeQuestions = [];
        let index = 0;
        let points = 0;
        let acceptInput = true;
        let piecesLeft = 0;

        // SAFE TIMEOUT - Guaranteed to execute and clear the screen after 5 seconds
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            const game = document.getElementById('main-game');
            if (splash && game) {
                splash.style.opacity = 0;
                setTimeout(() => {
                    splash.style.display = 'none';
                    game.style.display = 'block';
                    initGame();
                }, 500);
            }
        }, 5000);

        function initGame() {
            activeQuestions = [...questionsList].sort(() => Math.random() - 0.5);
            index = 0;
            points = 0;
            showQuestion();
        }

        function showQuestion() {
            acceptInput = true;
            const container = document.getElementById('game-content');
            const prog = document.getElementById('progress');
            
            if (prog) {
                prog.style.width = `${(index / activeQuestions.length) * 100}%`;
            }

            if (index >= activeQuestions.length) {
                endGame();
                return;
            }

            const q = activeQuestions[index];
            piecesLeft = q.total;

            let pizzaHTML = "";
            for (let i = 0; i < q.total; i++) {
                pizzaHTML += `<span class="pizza-piece" id="pizza-${i}">🍕</span>`;
            }

            let kidsHTML = "";
            for (let i = 0; i < q.kids; i++) {
                kidsHTML += `
                    <div class="child-profile">
                        <div class="child-avatar">${q.avatars[i]}</div>
                        <div class="drop-plate" id="plate-${i}"></div>
                    </div>
                `;
            }

            if (container) {
                container.innerHTML = `
                    <div class="story-text">
                        There are ${q.total} pizza slices. Share them equally among the ${q.kids} children. How many slices does each child get?
                    </div>
                    <div class="instruction-alert" id="status-msg">👉 Drag ALL pizzas into plates to unlock numbers!</div>
                    
                    <div class="sandbox">
                        <div class="section-title">Pizza Box</div>
                        <div class="source-zone" id="pizza-box">${pizzaHTML}</div>
                        
                        <div class="section-title">Plates</div>
                        <div class="targets-container">${kidsHTML}</div>
                    </div>
                    
                    <div class="options-grid" id="options-panel">
                        ${q.options.map(num => `<button class="btn" onclick="submitAnswer(this, ${num})">${num}</button>`).join('')}
                    </div>
                `;
                attachTouchTracking();
            }
        }

        function attachTouchTracking() {
            const pieces = document.querySelectorAll('.pizza-piece');
            
            pieces.forEach(piece => {
                piece.addEventListener('pointerdown', (e) => {
                    if (!acceptInput) return;
                    
                    e.preventDefault();
                    let currentTargetPlate = null;
                    
                    piece.classList.add('dragging');
                    piece.style.position = 'fixed';
                    piece.setPointerCapture(e.pointerId);
                    
                    function trackMovement(evt) {
                        piece.style.left = (evt.clientX - 20) + 'px';
                        piece.style.top = (evt.clientY - 20) + 'px';
                        
                        piece.style.display = 'none';
                        let elementUnderneath = document.elementFromPoint(evt.clientX, evt.clientY);
                        piece.style.display = 'inline-block';
                        
                        if (elementUnderneath) {
                            let destinationPlate = elementUnderneath.closest('.drop-plate');
                            
                            document.querySelectorAll('.drop-plate').forEach(pl => pl.classList.remove('hovered'));
                            if (destinationPlate) {
                                destinationPlate.classList.add('hovered');
                                currentTargetPlate = destinationPlate;
                            } else {
                                currentTargetPlate = null;
                            }
                        }
                    }

                    trackMovement(e);

                    function releaseTracking(evt) {
                        piece.releasePointerCapture(evt.pointerId);
                        piece.classList.remove('dragging');
                        document.querySelectorAll('.drop-plate').forEach(pl => pl.classList.remove('hovered'));
                        
                        piece.removeEventListener('pointermove', trackMovement);
                        piece.removeEventListener('pointerup', releaseTracking);
                        
                        if (currentTargetPlate) {
                            piece.style.position = 'static';
                            piece.style.fontSize = '22px';
                            currentTargetPlate.appendChild(piece);
                            piecesLeft--;
                            
                            if (piecesLeft === 0) {
                                const panel = document.getElementById('options-panel');
                                if (panel) panel.classList.add('unlocked');
                                
                                const status = document.getElementById('status-msg');
                                if (status) {
                                    status.innerText = "🎉 Unlocked! Count a plate and choose your number.";
                                    status.style.background = "#e8f5e9";
                                    status.style.color = "#2e7d32";
                                }
                            }
                        } else {
                            piece.style.position = 'static';
                        }
                    }

                    piece.addEventListener('pointermove', trackMovement);
                    piece.addEventListener('pointerup', releaseTracking);
                });
            });
        }

        function submitAnswer(element, choice) {
            if (!acceptInput) return;
            acceptInput = false;

            const q = activeQuestions[index];
            if (choice === q.answer) {
                points++;
                element.classList.add('correct');
                playSound(true);
                confetti({ particleCount: 30, spread: 40, origin: { y: 0.75 } });
            } else {
                element.classList.add('wrong');
                playSound(false);
                document.querySelectorAll('.options-grid .btn').forEach(b => {
                    if (parseInt(b.innerText) === q.answer) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                index++;
                showQuestion();
            }, 2500);
        }

        function endGame() {
            const prog = document.getElementById('progress');
            if (prog) prog.style.width = '100%';
            
            const container = document.getElementById('game-content');
            if (container) {
                if (points >= 6) {
                    confetti({ particleCount: 120, spread: 70 });
                }

                container.innerHTML = `
                    <div class="story-text" style="font-size: 24px; color: #2e7d32;">Party Complete! 🥳</div>
                    <div class="story-text">You successfully distributed all pizza slices evenly! Score: ${points} / ${activeQuestions.length}</div>
                    <div class="options-grid unlocked">
                        <button id="restart-btn" class="btn" onclick="initGame()">Play Again 🔄</button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
