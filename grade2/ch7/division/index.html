<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Party Division</title>
    <!-- Canvas Confetti Library for completion celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }
        body {
            background-color: #fff3e0;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background: white;
            border: 4px solid #ffb74d;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #e65100;
            margin: 0 0 10px 0;
            font-size: 26px;
        }
        .volume-box {
            background: #fff8e1;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .progress-bar {
            background: #f5f5f5;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            background: #ffb74d;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .story-text {
            font-size: 18px;
            color: #4e342e;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.4;
        }
        .visual-display {
            background: #fafafa;
            border: 2px dashed #bcaaa4;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #8d6e63;
            margin-bottom: 5px;
        }
        .emoji-row {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn {
            background: #ff7043;
            border: none;
            border-bottom: 4px solid #d84315;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .btn.correct {
            background: #4caf50 !important;
            border-color: #2e7d32 !important;
        }
        .btn.wrong {
            background: #f44336 !important;
            border-color: #c62828 !important;
        }
        #restart-btn {
            grid-column: span 2;
            background: #29b6f6;
            border-color: #0288d1;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🍕 Pizza Party Share!</h1>
        
        <div class="volume-box">
            <label for="volume">🔊 Volume: </label>
            <input type="range" id="volume" min="0" max="1" step="0.2" value="0.6">
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="game-content">
            <!-- Questions dynamically go here -->
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const volInput = document.getElementById('volume');

        function playSound(isCorrect) {
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = volInput.value;
            gainNode.connect(audioCtx.destination);
            
            const osc = audioCtx.createOscillator();
            osc.connect(gainNode);

            if (isCorrect) {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
                osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1); // C#5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2); // E5
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        const questionsList = [
            { total: 4, kids: 2, kidsEmojis: "👦👧", answer: 2, options: [1, 2, 3, 4] },
            { total: 6, kids: 2, kidsEmojis: "👦👧", answer: 3, options: [2, 3, 4, 5] },
            { total: 6, kids: 3, kidsEmojis: "👦👧👶", answer: 2, options: [1, 2, 3, 4] },
            { total: 8, kids: 2, kidsEmojis: "👧👧", answer: 4, options: [2, 3, 4, 6] },
            { total: 9, kids: 3, kidsEmojis: "👦👧👦", answer: 3, options: [2, 3, 4, 5] },
            { total: 10, kids: 2, kidsEmojis: "👦👧", answer: 5, options: [2, 4, 5, 6] },
            { total: 12, kids: 3, kidsEmojis: "👧👧👧", answer: 4, options: [3, 4, 5, 6] },
            { total: 12, kids: 4, kidsEmojis: "👦👧👦👧", answer: 3, options: [2, 3, 4, 6] },
            { total: 15, kids: 3, kidsEmojis: "👦👧👶", answer: 5, options: [3, 4, 5, 6] },
            { total: 16, kids: 4, kidsEmojis: "👦👧👦👧", answer: 4, options: [2, 4, 5, 8] }
        ];

        let activeQuestions = [];
        let index = 0;
        let points = 0;
        let acceptInput = true;

        function initGame() {
            activeQuestions = [...questionsList].sort(() => Math.random() - 0.5);
            index = 0;
            points = 0;
            showQuestion();
        }

        function showQuestion() {
            acceptInput = true;
            const container = document.getElementById('game-content');
            const prog = document.getElementById('progress');
            
            prog.style.width = `${(index / activeQuestions.length) * 100}%`;

            if (index >= activeQuestions.length) {
                endGame();
                return;
            }

            const q = activeQuestions[index];
            
            let pizzaDisplay = "";
            for(let i = 0; i < q.total; i++) {
                pizzaDisplay += "🍕";
            }

            container.innerHTML = `
                <div class="story-text">
                    There are ${q.total} pizza slices. Share them equally among the ${q.kids} children. How many slices does each child get?
                </div>
                <div class="visual-display">
                    <div class="section-title">Pizza Slices</div>
                    <div class="emoji-row">${pizzaDisplay}</div>
                    <div class="section-title">Hungry Children</div>
                    <div class="emoji-row">${q.kidsEmojis}</div>
                </div>
                <div class="options-grid">
                    ${q.options.map(num => `<button class="btn" onclick="submitAnswer(this, ${num})">${num}</button>`).join('')}
                </div>
            `;
        }

        function submitAnswer(element, choice) {
            if (!acceptInput) return;
            acceptInput = false;

            const q = activeQuestions[index];
            if (choice === q.answer) {
                points++;
                element.classList.add('correct');
                playSound(true);
                confetti({ particleCount: 30, spread: 40, origin: { y: 0.75 } });
            } else {
                element.classList.add('wrong');
                playSound(false);
                document.querySelectorAll('.options-grid .btn').forEach(b => {
                    if (parseInt(b.innerText) === q.answer) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                index++;
                showQuestion();
            }, 2000);
        }

        function endGame() {
            document.getElementById('progress').style.width = '100%';
            const container = document.getElementById('game-content');
            
            if (points >= 7) {
                confetti({ particleCount: 120, spread: 70 });
            }

            container.innerHTML = `
                <div class="story-text" style="font-size: 24px; color: #2e7d32;">Party Complete! 🥳</div>
                <div class="story-text">You successfully helped feed everyone! Your score: ${points} / ${activeQuestions.length}</div>
                <div class="options-grid">
                    <button id="restart-btn" class="btn" onclick="initGame()">Play Again 🔄</button>
                </div>
            `;
        }

        window.onload = initGame;
    </script>
</body>
</html>
