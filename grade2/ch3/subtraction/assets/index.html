<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Crystal Quest - Innovine</title>
<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:linear-gradient(to bottom,#87CEEB,#EAF8FF);
    text-align:center;
}
.header{
    background:#fff;
    padding:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.logo{
    max-height:70px;
}
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}
.card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    margin-top:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.question{
    font-size:24px;
    margin-bottom:20px;
}
.option{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    background:#1f7ae0;
    color:white;
    font-size:18px;
    cursor:pointer;
}
.option:hover{opacity:.9;}
#score{
    font-size:22px;
    font-weight:bold;
}
.progress{
    width:100%;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:10px 0 20px;
}
.progressBar{
    width:0%;
    height:22px;
    background:#2ecc71;
}
#crystals{
    font-size:30px;
    min-height:40px;
}
#message{
    font-size:20px;
    font-weight:bold;
    min-height:30px;
}
.win{
    font-size:28px;
}
</style>
</head>
<body>

<div class="header">
    <img src="assets/innovine-logo.png" class="logo" alt="Innovine">
</div>

<div class="container">
    <h1>💎 Number Crystal Quest 💎</h1>
    <p>Collect 10 crystals by solving number challenges!</p>

    <div id="score">Crystals Collected: 0 / 10</div>

    <div class="progress">
        <div id="progressBar" class="progressBar"></div>
    </div>

    <div id="crystals"></div>

    <div class="card">
        <div id="question" class="question"></div>
        <div id="options"></div>
        <div id="message"></div>
    </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="winSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
let crystals=0;
let correctAnswer="";

function random(min,max){
 return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(a){
 return a.sort(()=>Math.random()-0.5);
}

function generateQuestion(){

 document.getElementById("message").innerHTML="";

 if(crystals>=10){
  document.getElementById("winSound").play();
  document.querySelector(".card").innerHTML=`
  <div class="win">
  🎉 Congratulations!<br><br>
  You collected all 10 crystals!<br><br>
  <button class="option" onclick="location.reload()">Play Again</button>
  </div>`;
  return;
 }

 let type=random(1,9);
 let question="", options=[], answer="";

 if(type===1){
  let n=random(100,500);
  answer=Math.floor(n/100).toString();
  question=`How many hundreds are in <b>${n}</b>?`;
  options=[answer,(+answer+1)+"",Math.max(0,+answer-1)+"",random(1,9)+""];
 }

 if(type===2){
  let n=random(101,499);
  answer=(n+1)+"";
  question=`What comes after <b>${n}</b>?`;
  options=[answer,(n-1)+"",(n+2)+"",(n+10)+""];
 }

 if(type===3){
  let n=random(102,500);
  answer=(n-1)+"";
  question=`What comes before <b>${n}</b>?`;
  options=[answer,(n+1)+"",(n-2)+"",(n+10)+""];
 }

 if(type===4){
  let a=random(100,400);
  answer=(a+1)+"";
  question=`Which number is between <b>${a}</b> and <b>${a+2}</b>?`;
  options=[answer,a+"",(a+2)+"",(a+3)+""];
 }

 if(type===5){
  let n=random(100,499);
  let digit=n.toString()[1];
  answer=(digit*10)+"";
  question=`What is the place value of <b>${digit}</b> in <b>${n}</b>?`;
  options=[answer,digit+"",(digit*100)+"",random(1,99)+""];
 }

 if(type===6){
  let n=random(100,499);
  let h=Math.floor(n/100), t=Math.floor((n%100)/10), o=n%10;
  answer=`${h*100} + ${t*10} + ${o}`;
  question=`Choose the expanded form of <b>${n}</b>.`;
  options=[answer,`${h}+${t}+${o}`,`${h*10}+${t*10}+${o}`,`${h*100}+${o}`];
 }

 if(type===7){
  let a=random(100,500), b=random(100,500);
  answer=a>b?">":a<b?"<":"=";
  question=`Choose the correct symbol:<br><br><b>${a} ___ ${b}</b>`;
  options=[">","<","=","≠"];
 }

 if(type===8){
  let n=random(100,500);
  answer=(n%2===0)?"Even":"Odd";
  question=`Is <b>${n}</b> Even or Odd?`;
  options=["Even","Odd","Both","Neither"];
 }

 if(type===9){
  let start=random(1,20)*5;
  answer=(start+15)+"";
  question=`Skip count by 5:<br><b>${start}, ${start+5}, ${start+10}, ___</b>`;
  options=[answer,(start+20)+"",(start+25)+"",(start+10)+""];
 }

 correctAnswer=answer;
 options=shuffle([...new Set(options)]);

 while(options.length<4){
   options.push(random(1,500)+"");
 }

 document.getElementById("question").innerHTML=question;

 let html="";
 options.forEach(o=>{
   html += `<button class="option" onclick="checkAnswer('${o}')">${o}</button>`;
 });

 document.getElementById("options").innerHTML=html;
}

function checkAnswer(selected){

 if(selected==correctAnswer){

  document.getElementById("correctSound").play();
  crystals++;

  document.getElementById("message").innerHTML="✅ Correct! Crystal earned!";
  document.getElementById("score").innerHTML=`Crystals Collected: ${crystals} / 10`;
  document.getElementById("crystals").innerHTML="💎".repeat(crystals);
  document.getElementById("progressBar").style.width=(crystals*10)+"%";

 }else{

  document.getElementById("wrongSound").play();
  document.getElementById("message").innerHTML=`❌ Correct answer: ${correctAnswer}`;
 }

 setTimeout(generateQuestion,1200);
}

generateQuestion();
</script>

</body>
</html>
