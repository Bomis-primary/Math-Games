<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innovine - Reena's Library Rescue</title>
  <style>
    :root {
      --text-dark: #2c3e50;
      --library-blue: #0288d1;
      --wood-brown: #5d4037;
      --chalkboard-green: #1b5e20;
      --forest-green: #2e7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
      background: #e1f5fe;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      user-select: none;
    }

    .game-container {
      width: 100%;
      max-width: 850px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 650px;
      border: 4px solid var(--library-blue);
    }

    /* 4-Second Splash Screen Overlay */
    #screen-splash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.5s ease;
    }
    #screen-splash img {
      max-width: 55%;
      max-height: 55%;
      object-fit: contain;
    }

    /* HUD Header Area */
    .game-header {
      background: var(--library-blue);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-title { font-weight: bold; font-size: 1.2rem; color: #fff9c4; }
    .hud-stats { display: flex; gap: 20px; font-weight: bold; font-size: 1.1rem; }
    
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #01579b;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #fff9c4, #fbc02d);
      transition: width 0.4s ease;
    }

    /* App Screens */
    .screen { display: none; padding: 20px; text-align: center; position: relative; }
    .screen.active { display: block; }

    .story-bubble {
      background: #f1f8e9;
      border: 3px dashed #4caf50;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
      font-size: 1.2rem;
      line-height: 1.4;
      text-align: left;
    }

    /* Classroom Chalkboard Canvas containing the Vertical Columns */
    .chalkboard-canvas {
      min-height: 250px;
      background-color: var(--chalkboard-green); 
      border-radius: 16px;
      position: relative;
      margin-bottom: 20px;
      border: 8px solid var(--wood-brown);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      padding: 20px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.15);
    }

    .helper-avatar {
      font-size: 4.5rem;
      transition: transform 0.2s ease;
    }
    .helper-avatar.happy { animation: jumpCelebrate 0.4s ease infinite alternate; }
    .helper-avatar.sad { animation: headShake 0.4s ease; }

    @keyframes jumpCelebrate {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.05); }
    }
    @keyframes headShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-3deg); }
      75% { transform: translateX(8px) rotate(3deg); }
    }

    /* Vertical Place Value Column System */
    .math-grid-table {
      border-collapse: collapse;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
    }
    .math-grid-table td {
      width: 65px;
      height: 55px;
      padding: 2px;
      position: relative;
    }
    
    /* Place Value Headers (H, T, O) matching textbook format */
    .math-grid-table .header-row td {
      font-family: 'Trebuchet MS', sans-serif;
      font-size: 1.6rem;
      color: #fff9c4;
      border-bottom: 3px dashed rgba(255,255,255,0.25);
      height: 40px;
    }
    
    .math-grid-table .operator-cell {
      text-align: right;
      padding-right: 15px;
      color: #ffb300;
      font-size: 2.3rem;
    }
    
    .math-grid-table .minus-row td {
      border-bottom: 5px solid white;
    }
    
    /* Answer row typography */
    .math-grid-table .result-cell {
      color: #ffeb3b;
    }
    .math-grid-table .result-cell.typing-active {
      color: #ff9800;
      text-decoration: underline;
    }

    /* Input Pad Area */
    .keypad-box {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 5px auto;
      max-width: 520px;
      flex-wrap: wrap;
    }
    .key-btn {
      width: 52px;
      height: 52px;
      font-size: 1.4rem;
      font-weight: bold;
      background: #ffffff;
      border: 3px solid #b0bec5;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b0bec5;
      color: var(--text-dark);
    }
    .key-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b0bec5;
    }
    .key-btn.action-key {
      width: 75px;
      background: #ffb300;
      border-color: #ff8f00;
      box-shadow: 0 4px 0 #ff8f00;
      color: white;
    }
    .key-btn.go-key {
      width: 95px;
      background: var(--forest-green);
      border-color: #1b5e20;
      box-shadow: 0 4px 0 #1b5e20;
      color: white;
    }

    .feedback-banner {
      height: 30px;
      font-size: 1.15rem;
      font-weight: bold;
      margin-top: 5px;
    }

    .action-btn {
      background: var(--library-blue);
      color: white;
      border: none;
      padding: 15px 45px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #01579b;
      margin-top: 10px;
    }
    .action-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #01579b; }
  </style>
</head>
