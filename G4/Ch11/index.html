<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vault Master: Ledger Reconciliation</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #070a12;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: relative;
        }

        /* Splash Screen */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
            gap: 20px;
        }
        
        .splash-content-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 280px;
        }

        .splash-img {
            max-width: 75%;
            height: 80px;
            object-fit: contain;
        }

        #logo-fallback {
            font-size: 2.4rem;
            font-weight: 900;
            color: #111827;
            letter-spacing: -1px;
        }

        .loading-bar-wrapper {
            width: 160px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .loading-bar-progress {
            width: 0%;
            height: 100%;
            background: #0284c7;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        #instruction-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.97);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            text-align: center;
        }
        
        .ins-box {
            background: #111827;
            border: 2px solid #1f2937;
            padding: 20px;
            border-radius: 14px;
        }
        
        .ins-title {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .ins-text {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .bank-display {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .screen-ticker {
            background: #022c22;
            border: 2px solid #10b981;
            border-radius: 6px;
            padding: 8px 10px;
            width: 100%;
        }
        
        .ticker-title {
            font-size: 0.65rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }
        
        .ticker-problem {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 4px;
            line-height: 1.35;
            text-align: left;
        }

        .simulation-frame {
            width: 100%;
            background: #111827;
            border: 2px solid #1e293b;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            flex-grow: 1;
            min-height: 80px;
            max-height: 100px;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .status-banner {
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            min-height: 16px;
        }

        /* Data allocation chip grid */
        .ledger-allocation-matrix {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }
        
        .ledger-chip {
            background: #111827;
            border: 2px dashed #334155;
            color: #94a3b8;
            border-radius: 10px;
            padding: 12px 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
            touch-action: manipulation;
            transition: background-color 0.1s, border-color 0.1s, color 0.1s;
        }
        
        .ledger-chip .chip-meta {
            font-size: 0.6rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .ledger-chip.selected {
            background: #1e3a8a;
            border: 2px solid #3b82f6;
            color: #ffffff;
        }
        
        .ledger-chip.selected .chip-meta {
            color: #93c5fd;
        }

        .ledger-chip.reveal-correct {
            background: #064e3b !important;
            border: 2px solid #10b981 !important;
            color: #ffffff !important;
        }
        .ledger-chip.reveal-correct .chip-meta {
            color: #a7f3d0 !important;
        }

        .action-dispatch-btn {
            width: 100%;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            touch-action: manipulation;
        }
        
        .action-dispatch-btn:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="hard-splash">
        <div class="splash-content-wrapper">
            <div class="splash-logo-container">
                <img src="assets/logo.png" class="splash-img" alt="Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
                <div id="logo-fallback" style="display:none;">innovine</div>
            </div>
        </div>
        <div class="loading-bar-wrapper">
            <div class="loading-bar-progress" id="splash-progress-fill"></div>
        </div>
    </div>

    <div id="viewport-root">
        
        <div id="instruction-modal">
            <div class="ins-box">
                <h2 class="ins-title">Ledger Auditing System</h2>
                <p class="ins-text">
                    Analyze the statement, select the fitting balance asset to reconcile, then submit. You have 2 auditing attempts per payload.
                </p>
                <button class="action-dispatch-btn" id="btn-start-mission">Enter Vault Terminal</button>
            </div>
        </div>

        <!-- Dashboard Entry Monitor -->
        <div class="bank-display">
            <div class="screen-ticker">
                <div class="ticker-title">
                    <span>STATEMENT RECONCILIATION</span>
                    <span id="lbl-chances" style="color: #f59e0b;">ATTEMPTS: 2/2</span>
                </div>
                <div class="ticker-problem" id="lbl-bank-task">Initialising Core Ledger...</div>
            </div>
        </div>

        <div class="simulation-frame">
            <canvas id="bank-canvas"></canvas>
        </div>

        <div class="status-banner" id="lbl-status-toast" style="color: #9ca3af;">Awaiting allocation input...</div>

        <!-- Matrix Panel -->
        <div class="ledger-allocation-matrix">
            <div class="ledger-chip" id="opt-0">
                <span class="chip-meta">Slot A</span>
                <span class="chip-val">--</span>
            </div>
            <div class="ledger-chip" id="opt-1">
                <span class="chip-meta">Slot B</span>
                <span class="chip-val">--</span>
            </div>
            <div class="ledger-chip" id="opt-2">
                <span class="chip-meta">Slot C</span>
                <span class="chip-val">--</span>
            </div>
            <div class="ledger-chip" id="opt-3">
                <span class="chip-meta">Slot D</span>
                <span class="chip-val">--</span>
            </div>
        </div>

        <button class="action-dispatch-btn" id="btn-process">Commit Asset Reconciliation</button>
    </div>

    <script>
        let currentActivePuzzle = null;
        let chosenOptionIndex = 0;
        let shuffledAnswersList = [];
        let executionAttemptsLeft = 2;
        let interactionLockoutActive = false;
        let pastQuestionsQueue = [];

        let canvasElement = null;
        let canvasContext = null;
        let engineLoopId = null;
        let audioCtx = null;

        let securityTruck = {
            progress: 0, isDriving: false, isTumbling: false,
            rotation: 0, offsetX: 0, offsetY: 0, frameTimer: 0
        };

        // 10 distinct currency and ledger auditing questions mapped to image_ee85e3.png
        const questionDatabase = [
            { text: "An itemized bill shows 3 registers bought for ₹120 each and a service tax of ₹40. What is the grand total of this bill?", ans: "₹400", w1: "₹380", w2: "₹420", w3: "₹360" },
            { text: "A deposit bag holds seven ₹500 notes, four ₹100 notes, and three ₹50 notes. Calculate the total Indian currency valuation.", ans: "₹4,050", w1: "₹3,950", w2: "₹4,150", w3: "₹4,200" },
            { text: "An invoice lists a combined bulk purchase of 8 identical office supply kits totaling ₹4,800. What is the unit cost per kit?", ans: "₹600", w1: "₹550", w2: "₹650", w3: "₹700" },
            { text: "Your allocation budget is ₹5,000. If you spend ₹1,450 on security items and ₹2,100 on operations, how much budget remains?", ans: "₹1,450", w1: "₹1,550", w2: "₹1,350", w3: "₹1,600" },
            { text: "A ledger reconciles a starting balance of ₹8,400. After a withdrawal of ₹3,750 and a new deposit of ₹1,200, find the final balance.", ans: "₹5,850", w1: "₹5,950", w2: "₹5,750", w3: "₹4,650" },
            { text: "A transport runner needs to distribute ₹10,000 evenly among 5 secure branches. How much does each branch receive?", ans: "₹2,000", w1: "₹2,500", w2: "₹1,800", w3: "₹2,200" },
            { text: "An audit summary shows an invoice error where ₹3,150 was written instead of ₹3,500. How much additional cash must be added?", ans: "₹350", w1: "₹450", w2: "₹250", w3: "₹300" },
            { text: "A cashier has exactly twelve ₹2,000 currency notes. If they exchange them entirely for ₹500 notes, how many notes will they get?", ans: "48 notes", w1: "24 notes", w2: "40 notes", w3: "50 notes" },
            { text: "A shop billing report displays 4 structural chairs at ₹450 each and 2 side drawers at ₹300 each. What is the gross total amount?", ans: "₹2,400", w1: "₹2,100", w2: "₹2,600", w3: "₹2,250" },
            { text: "A customer sets up a monthly plan of ₹750. If they maintain this exact micro-saving routine for 6 months, what is the final yield?", ans: "₹4,500", w1: "₹4,200", w2: "₹4,800", w3: "₹5,000" }
        ];

        let timeElapsed = 0;
        const totalDuration = 2500; 
        const tickInterval = 50;
        const progressFill = document.getElementById('splash-progress-fill');
        
        const progressTicker = setInterval(() => {
            timeElapsed += tickInterval;
            let percent = Math.min((timeElapsed / totalDuration) * 100, 100);
            if (progressFill) progressFill.style.width = percent + '%';
            
            if (timeElapsed >= totalDuration) {
                clearInterval(progressTicker);
                const splash = document.getElementById('hard-splash');
                const mainApp = document.getElementById('viewport-root');
                if (splash) splash.style.opacity = '0';
                setTimeout(() => {
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    if (mainApp) {
                        mainApp.style.opacity = '1';
                        initSystemContext();
                    }
                }, 300);
            }
        }, tickInterval);

        function initSystemContext() {
            canvasElement = document.getElementById('bank-canvas');
            canvasContext = canvasElement.getContext('2d');
            
            recalculateCanvasDimensions();
            window.addEventListener('resize', recalculateCanvasDimensions);

            setupUniversalClickOrTouch('btn-start-mission', dismissInstructions);
            setupUniversalClickOrTouch('btn-process', processTransaction);
            
            for(let i=0; i<4; i++) {
                setupUniversalClickOrTouch(`opt-${i}`, () => selectBankOption(i));
            }

            generateBankPuzzle();
            runBankSimulationLoop();
        }

        function setupUniversalClickOrTouch(elementId, callback) {
            const el = document.getElementById(elementId);
            if (!el) return;
            
            let triggered = false;
            const handler = (e) => {
                e.preventDefault();
                if (!triggered) {
                    triggered = true;
                    callback();
                    setTimeout(() => { triggered = false; }, 250);
                }
            };
            
            el.addEventListener('touchstart', handler, { passive: false });
            el.addEventListener('click', (e) => {
                if (!e.defaultPrevented) callback();
            });
        }

        function dismissInstructions() {
            const modal = document.getElementById('instruction-modal');
            if (modal) modal.style.display = 'none';
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function recalculateCanvasDimensions() {
            if (!canvasElement) return;
            canvasElement.width = canvasElement.clientWidth;
            canvasElement.height = canvasElement.clientHeight;
        }

        function generateBankPuzzle() {
            interactionLockoutActive = false;
            document.getElementById('lbl-status-toast').innerText = "Select corresponding allocation asset, then submit.";
            document.getElementById('lbl-status-toast').style.color = "#9ca3af";
            document.getElementById('btn-process').disabled = false;
            executionAttemptsLeft = 2;
            updateAttemptsHUD();

            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt-${i}`).classList.remove('reveal-correct');
            }

            // Ensure queue avoids immediate duplicates across all 10 entries
            let availableList = questionDatabase.filter(q => !pastQuestionsQueue.includes(q.text));
            if (availableList.length === 0) {
                pastQuestionsQueue = [];
                availableList = questionDatabase;
            }

            currentActivePuzzle = availableList[Math.floor(Math.random() * availableList.length)];
            pastQuestionsQueue.push(currentActivePuzzle.text);
            if (pastQuestionsQueue.length > 6) pastQuestionsQueue.shift();

            document.getElementById('lbl-bank-task').innerText = currentActivePuzzle.text;

            shuffledAnswersList = [
                { text: currentActivePuzzle.ans, isCorrect: true },
                { text: currentActivePuzzle.w1, isCorrect: false },
                { text: currentActivePuzzle.w2, isCorrect: false },
                { text: currentActivePuzzle.w3, isCorrect: false }
            ].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 4; i++) {
                document.getElementById(`opt-${i}`).querySelector('.chip-val').innerText = shuffledAnswersList[i].text;
            }

            securityTruck.progress = 0;
            securityTruck.isDriving = false;
            securityTruck.isTumbling = false;
            securityTruck.rotation = 0;
            securityTruck.offsetX = 0;
            securityTruck.offsetY = 0;
            securityTruck.frameTimer = 0;

            selectBankOption(0);
        }

        function updateAttemptsHUD() {
            const h = document.getElementById('lbl-chances');
            h.innerText = `ATTEMPTS: ${executionAttemptsLeft}/2`;
            if(executionAttemptsLeft === 1) h.style.color = "#ef4444";
            else h.style.color = "#f59e0b";
        }

        function selectBankOption(idx) {
            if (securityTruck.isDriving || securityTruck.isTumbling || interactionLockoutActive) return;
            chosenOptionIndex = idx;

            for (let i = 0; i < 4; i++) {
                const chip = document.getElementById(`opt-${i}`);
                if (i === idx) chip.classList.add('selected');
                else chip.classList.remove('selected');
            }
        }

        function runBankSimulationLoop() {
            updateSimulationPhysics();
            renderSimulationGraphics();
            engineLoopId = requestAnimationFrame(runBankSimulationLoop);
        }

        function updateSimulationPhysics() {
            if (securityTruck.isDriving) {
                securityTruck.progress += 0.025;
                if (securityTruck.progress >= 1.0) {
                    securityTruck.progress = 1.0;
                    securityTruck.isDriving = false;
                    concludeTransactionRound();
                }
            }

            if (securityTruck.isTumbling) {
                securityTruck.frameTimer += 1;
                securityTruck.rotation += 0.24; 
                securityTruck.offsetX += 1.5;   
                securityTruck.offsetY += Math.sin(securityTruck.frameTimer * 0.45) * 3; 

                if (securityTruck.frameTimer >= 45) {
                    securityTruck.isTumbling = false;
                    handleAuditFailureDrop();
                }
            }
        }

        function renderSimulationGraphics() {
            if (!canvasContext || !canvasElement) return;
            
            const w = canvasElement.width;
            const h = canvasElement.height;
            if (w === 0 || h === 0) return;

            canvasContext.clearRect(0, 0, w, h);

            canvasContext.fillStyle = '#1e293b';
            canvasContext.fillRect(0, h - 16, w, 16);
            
            canvasContext.fillStyle = '#d97706';
            canvasContext.fillRect(0, h - 18, w, 2);

            canvasContext.strokeStyle = '#334155';
            canvasContext.lineWidth = 1;
            for (let x = 0; x < w - 50; x += 15) {
                canvasContext.beginPath();
                canvasContext.moveTo(x, 0);
                canvasContext.lineTo(x, h - 18);
                canvasContext.stroke();
            }

            canvasContext.fillStyle = '#273549';
            canvasContext.fillRect(w - 45, 8, 45, h - 24);

            let startX = -25;
            let targetX = w - 65;
            let currentX = startX + (targetX - startX) * securityTruck.progress;
            let currentY = h / 2 + 2;

            canvasContext.save();
            canvasContext.translate(currentX + securityTruck.offsetX, currentY + securityTruck.offsetY);
            canvasContext.rotate(securityTruck.rotation);

            canvasContext.fillStyle = '#0284c7'; 
            canvasContext.fillRect(-14, -6, 28, 12);

            canvasContext.fillStyle = '#1e3a8a';
            canvasContext.fillRect(7, -6, 6, 12);

            canvasContext.restore();
        }

        function processTransaction() {
            if (securityTruck.isDriving || securityTruck.isTumbling || interactionLockoutActive) return;
            document.getElementById('btn-process').disabled = true;
            securityTruck.isDriving = true;
            document.getElementById('lbl-status-toast').innerText = "Processing automated ledger entry...";
            document.getElementById('lbl-status-toast').style.color = '#38bdf8';
        }

        function concludeTransactionRound() {
            const chosenAnswer = shuffledAnswersList[chosenOptionIndex];
            const feedbackLabel = document.getElementById('lbl-status-toast');

            if (chosenAnswer && chosenAnswer.isCorrect) {
                playSynthesizedFallback('correct');
                feedbackLabel.innerText = "✓ LEDGER BALANCED! Asset logged safely.";
                feedbackLabel.style.color = "#10b981";
                setTimeout(() => { generateBankPuzzle(); }, 1500);
            } else {
                playSynthesizedFallback('wrong');
                executionAttemptsLeft--;
                updateAttemptsHUD();
                securityTruck.isTumbling = true;
                feedbackLabel.innerText = "💥 MISMATCH DETECTED! Re-evaluating payload...";
                feedbackLabel.style.color = "#ef4444";
            }
        }

        function handleAuditFailureDrop() {
            if (executionAttemptsLeft > 0) {
                document.getElementById('btn-process').disabled = false;
                document.getElementById('lbl-status-toast').innerText = "Audit Warning: Adjustment opportunity remaining.";
                document.getElementById('lbl-status-toast').style.color = "#f59e0b";
                securityTruck.progress = 0;
                securityTruck.offsetX = 0;
                securityTruck.offsetY = 0;
                securityTruck.rotation = 0;
                securityTruck.frameTimer = 0;
            } else {
                interactionLockoutActive = true;
                document.getElementById('btn-process').disabled = true;
                document.getElementById('lbl-status-toast').innerText = "❌ FAILED! Showing correct balance context...";
                document.getElementById('lbl-status-toast').style.color = "#ef4444";
                
                let correctIndex = shuffledAnswersList.findIndex(item => item.isCorrect);
                if (correctIndex !== -1) {
                    document.getElementById(`opt-${correctIndex}`).classList.add('reveal-correct');
                }

                setTimeout(() => { generateBankPuzzle(); }, 2200);
            }
        }

        function playSynthesizedFallback(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(type === 'correct' ? 580 : 130, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } catch (e) {}
        }
    </script>
</body>
</html>
