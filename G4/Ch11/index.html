<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vault Master: Cashier Counter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #070a12;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 740px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .bank-display {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            text-align: center;
        }

        .screen-ticker {
            background: #022c22;
            border: 2px solid #10b981;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 4px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }
        .ticker-title {
            font-size: 0.75rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .ticker-problem {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 6px;
            line-height: 1.4;
        }

        .simulation-frame {
            flex-grow: 1;
            background: #111827;
            border: 2px solid #1e293b;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            min-height: 250px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .console-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .option-row-btn {
            width: 100%;
            background: #1f2937;
            border: 1px solid #4b5563;
            color: #e5e7eb;
            border-radius: 12px;
            padding: 14px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .option-row-btn:active {
            background: #374151;
        }
        .option-row-btn.selected {
            background: #1d4ed8;
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        .action-dispatch-btn {
            width: 100%;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }
        .action-dispatch-btn:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-banner {
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            min-height: 22px;
        }
    </style>
</head>
<body>

    <div id="viewport-root">
        <div class="bank-display">
            <div class="screen-ticker">
                <div class="ticker-title">CASHIER LEDGER VERIFICATION</div>
                <div class="ticker-problem" id="lbl-bank-task">Booting Terminal Console...</div>
            </div>
        </div>

        <div class="simulation-frame">
            <canvas id="bank-canvas"></canvas>
        </div>

        <div class="status-banner" id="lbl-status-toast" style="color: #9ca3af;">Awaiting option input...</div>

        <div class="console-grid">
            <button class="option-row-btn" id="opt-0" onclick="selectBankOption(0)">[A] Loading...</button>
            <button class="option-row-btn" id="opt-1" onclick="selectBankOption(1)">[B] Loading...</button>
            <button class="option-row-btn" id="opt-2" onclick="selectBankOption(2)">[C] Loading...</button>
        </div>

        <button class="action-dispatch-btn" id="btn-process" onclick="processTransaction()">Authorize Cashier Deposit</button>
    </div>

    <script>
        let currentActivePuzzle = null;
        let chosenOptionIndex = 0;
        let shuffledAnswersList = [];

        let canvasElement = null;
        let canvasContext = null;
        let engineLoopId = null;

        // Animation Physics Properties
        let securityTruck = {
            progress: 0,
            isDriving: false,
            isTumbling: false,
            rotation: 0,
            offsetX: 0,
            offsetY: 0,
            frameTimer: 0
        };

        window.onload = () => {
            canvasElement = document.getElementById('bank-canvas');
            canvasContext = canvasElement.getContext('2d');
            
            recalculateCanvasDimensions();
            generateBankPuzzle();
            runBankSimulationLoop();
        };

        function recalculateCanvasDimensions() {
            const rect = canvasElement.getBoundingClientRect();
            canvasElement.width = rect.width;
            canvasElement.height = rect.height;
        }

        function generateBankPuzzle() {
            document.getElementById('lbl-status-toast').innerText = "Review money request, click answer, then verify...";
            document.getElementById('lbl-status-toast').style.color = "#9ca3af";
            document.getElementById('btn-process').disabled = false;

            // Pure Chapter 11 Money Operations Database (Invoices, Budgeting, Conversions)
            const branchLogs = [
                { text: "A customer deposits 6 notes of ₹500 and 4 notes of ₹100. Calculate the total currency balance added to the counter.", ans: "₹3,400", w1: "₹3,000", w2: "₹3,200" },
                { text: "An invoice bill lists 5 identical security cash boxes totaling ₹2,500. What is the unit expense price per box?", ans: "₹500", w1: "₹450", w2: "₹600" },
                { text: "A merchant splits an operational store bill of ₹4,800 evenly among 4 business partners. How much must each partner pay?", ans: "₹1,200", w1: "₹1,400", w2: "₹1,100" },
                { text: "You process a transaction of 15 tokens valued at ₹60 each. What is the final total calculated value of the package?", ans: "₹900", w1: "₹850", w2: "₹950" },
                { text: "A vault ledger contains ₹7,250. If an authorized cash payout transaction of ₹1,450 is completed, how much balance remains?", ans: "₹5,800", w1: "₹5,900", w2: "₹5,650" },
                { text: "A business client creates a daily deposit tier plan. Depositing ₹350 every day for 7 consecutive days creates what final amount?", ans: "₹2,450", w1: "₹2,150", w2: "₹2,500" },
                { text: "A bill calculation error shows an extra charge. If the target cost is ₹1,850 and the customer paid ₹2,000, what change is returned?", ans: "₹150", w1: "₹250", w2: "₹100" }
            ];

            currentActivePuzzle = branchLogs[Math.floor(Math.random() * branchLogs.length)];
            document.getElementById('lbl-bank-task').innerText = currentActivePuzzle.text;

            shuffledAnswersList = [
                { text: currentActivePuzzle.ans, isCorrect: true },
                { text: currentActivePuzzle.w1, isCorrect: false },
                { text: currentActivePuzzle.w2, isCorrect: false }
            ].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 3; i++) {
                document.getElementById(`opt-${i}`).innerText = `${String.fromCharCode(65 + i)}.) ${shuffledAnswersList[i].text}`;
            }

            // Reset Animation properties
            securityTruck.progress = 0;
            securityTruck.isDriving = false;
            securityTruck.isTumbling = false;
            securityTruck.rotation = 0;
            securityTruck.offsetX = 0;
            securityTruck.offsetY = 0;
            securityTruck.frameTimer = 0;

            selectBankOption(0);
        }

        function selectBankOption(idx) {
            if (securityTruck.isDriving || securityTruck.isTumbling) return;
            chosenOptionIndex = idx;

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (i === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            }
        }

        function runBankSimulationLoop() {
            updateSimulationPhysics();
            renderSimulationGraphics();
            engineLoopId = requestAnimationFrame(runBankSimulationLoop);
        }

        function updateSimulationPhysics() {
            if (securityTruck.isDriving) {
                securityTruck.progress += 0.018;
                if (securityTruck.progress >= 1.0) {
                    securityTruck.progress = 1.0;
                    securityTruck.isDriving = false;
                    concludeTransactionRound();
                }
            }

            if (securityTruck.isTumbling) {
                securityTruck.frameTimer += 1;
                securityTruck.rotation += 0.24; // Rapid tumble rotation spin
                securityTruck.offsetX += 1.5;   // Kinetic skid sliding motion forward
                securityTruck.offsetY += Math.sin(securityTruck.frameTimer * 0.45) * 6; // Bouncing arc trajectory

                if (securityTruck.frameTimer >= 60) {
                    securityTruck.isTumbling = false;
                    resetRoundAfterAccident();
                }
            }
        }

        function renderSimulationGraphics() {
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const w = canvasElement.width;
            const h = canvasElement.height;

            // 1. Draw Cashier Counter Background Layer
            // Counter Desk wood pane
            canvasContext.fillStyle = '#1e293b';
            canvasContext.fillRect(0, h - 35, w, 35);
            
            // Polished brass counter rail topper
            canvasContext.fillStyle = '#d97706';
            canvasContext.fillRect(0, h - 38, w, 3);

            // 2. Draw Safety Security Grille Partition Windows
            canvasContext.strokeStyle = '#475569';
            canvasContext.lineWidth = 2;
            const barSpacing = 22;
            for (let x = 0; x < w - 80; x += barSpacing) {
                canvasContext.beginPath();
                canvasContext.moveTo(x, 0);
                canvasContext.lineTo(x, h - 38);
                canvasContext.stroke();
            }

            // 3. Draw Heavy Vault Storage Door Unit (Right Side Destination)
            canvasContext.fillStyle = '#334155';
            canvasContext.fillRect(w - 75, 20, 75, h - 58);
            
            // Vault Outer Frame Outline Rim
            canvasContext.strokeStyle = '#64748b';
            canvasContext.lineWidth = 4;
            canvasContext.strokeRect(w - 73, 22, 71, h - 62);

            // Vault Central Lock Wheel Graphic
            canvasContext.strokeStyle = '#94a3b8';
            canvasContext.lineWidth = 3;
            canvasContext.beginPath();
            canvasContext.arc(w - 38, h / 2 - 10, 20, 0, Math.PI * 2);
            canvasContext.stroke();
            // Spokes
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                canvasContext.beginPath();
                canvasContext.moveTo(w - 38, h / 2 - 10);
                canvasContext.lineTo(w - 38 + Math.cos(angle) * 20, h / 2 - 10 + Math.sin(angle) * 20);
                canvasContext.stroke();
            }

            // 4. Draw Transit Transit Runway Track
            canvasContext.fillStyle = '#0f172a';
            canvasContext.fillRect(0, h / 2 + 30, w - 75, 30);
            
            canvasContext.strokeStyle = '#475569';
            canvasContext.lineWidth = 1;
            canvasContext.setLineDash([4, 4]);
            canvasContext.beginPath();
            canvasContext.moveTo(0, h / 2 + 45);
            canvasContext.lineTo(w - 75, h / 2 + 45);
            canvasContext.stroke();
            canvasContext.setLineDash([]);

            // 5. Compute real-time vehicle positioning vectors
            let startX = -40;
            let targetX = w - 115;
            let currentX = startX + (targetX - startX) * securityTruck.progress;
            let currentY = h / 2 + 45;

            // 6. Draw Armored Cash Transport Truck
            canvasContext.save();
            canvasContext.translate(currentX + securityTruck.offsetX, currentY + securityTruck.offsetY);
            canvasContext.rotate(securityTruck.rotation);

            // Chassis Hull Shell
            canvasContext.fillStyle = '#0284c7'; // Corporate blue security coat
            canvasContext.fillRect(-22, -11, 44, 22);

            // Front metal cabin cage windshield
            canvasContext.fillStyle = '#1e3a8a';
            canvasContext.fillRect(12, -11, 10, 22);
            
            // Metallic reinforced side bars
            canvasContext.fillStyle = '#bae6fd';
            canvasContext.fillRect(-10, -8, 18, 2);
            canvasContext.fillRect(-10, 6, 18, 2);

            // Wheels
            canvasContext.fillStyle = '#111827';
            canvasContext.fillRect(-14, -13, 7, 2);
            canvasContext.fillRect(-14, 11, 7, 2);
            canvasContext.fillRect(9, -13, 7, 2);
            canvasContext.fillRect(9, 11, 7, 2);

            canvasContext.restore();

            // 7. Draw Active Crash Particle Sparks if the truck is tumbling out of control
            if (securityTruck.isTumbling) {
                canvasContext.fillStyle = 'rgba(239, 68, 68, 0.4)';
                canvasContext.beginPath();
                canvasContext.arc(currentX + securityTruck.offsetX - 12, currentY + securityTruck.offsetY, 18, 0, Math.PI * 2);
                canvasContext.fill();
            }
        }

        function processTransaction() {
            if (securityTruck.isDriving || securityTruck.isTumbling) return;
            document.getElementById('btn-process').disabled = true;
            
            securityTruck.isDriving = true;
            document.getElementById('lbl-status-toast').innerText = "Verifying bills... Cashier security transit activated.";
            document.getElementById('lbl-status-toast').style.color = '#38bdf8';
        }

        function concludeTransactionRound() {
            const chosenAnswer = shuffledAnswersList[chosenOptionIndex];
            const feedbackLabel = document.getElementById('lbl-status-toast');

            if (chosenAnswer && chosenAnswer.isCorrect) {
                feedbackLabel.innerText = "✓ DEPOSIT SUCCESSFUL! Balance logged into ledger vault.";
                feedbackLabel.style.color = "#10b981";
                
                setTimeout(() => {
                    generateBankPuzzle();
                }, 1600);
            } else {
                // Incorrect submission triggers the skid-tumble mechanism loop
                securityTruck.isTumbling = true;
                feedbackLabel.innerText = "💥 COUNTER ERROR! Mismatched entry triggers tumbling crash!";
                feedbackLabel.style.color = "#ef4444";
            }
        }

        function resetRoundAfterAccident() {
            const feedbackLabel = document.getElementById('lbl-status-toast');
            
            // Reset position variables back to initial parameters safely
            securityTruck.progress = 0;
            securityTruck.offsetX = 0;
            securityTruck.offsetY = 0;
            securityTruck.rotation = 0;
            securityTruck.frameTimer = 0;
            
            document.getElementById('btn-process').disabled = false;
            feedbackLabel.innerText = "Recalculate currency inputs and try again.";
            feedbackLabel.style.color = "#9ca3af";
        }
    </script>
</body>
</html>
