<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vault Master: Cashier Counter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Force a strict single-window layout with no scrolling allowed */
        body, html {
            width: 100%;
            height: 100%;
            background-color: #070a12;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Compact application viewport frame */
        #viewport-root {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            position: relative;
        }

        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
            gap: 20px;
        }
        
        .splash-content-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 280px;
        }

        .splash-img {
            max-width: 75%;
            height: 80px;
            object-fit: contain;
        }

        #logo-fallback {
            font-size: 2.4rem;
            font-weight: 900;
            color: #111827;
            letter-spacing: -1px;
        }

        .loading-bar-wrapper {
            width: 160px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .loading-bar-progress {
            width: 0%;
            height: 100%;
            background: #0284c7;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        #instruction-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.97);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            text-align: center;
        }
        
        .ins-box {
            background: #111827;
            border: 2px solid #1f2937;
            padding: 20px;
            border-radius: 14px;
        }
        
        .ins-title {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .ins-text {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .bank-display {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .hud-logo-container {
            width: auto;
            height: 32px;
            margin-bottom: 6px;
        }
        
        .hud-img {
            height: 100%;
            object-fit: contain;
        }

        .screen-ticker {
            background: #022c22;
            border: 2px solid #10b981;
            border-radius: 6px;
            padding: 10px;
            width: 100%;
        }
        
        .ticker-title {
            font-size: 0.7rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        
        .ticker-problem {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 4px;
            line-height: 1.35;
        }

        /* Micro-scaled animation frame to save precise window workspace */
        .simulation-frame {
            width: 100%;
            background: #111827;
            border: 2px solid #1e293b;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            flex-grow: 1;
            min-height: 120px;
            max-height: 160px;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .status-banner {
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            min-height: 18px;
        }

        .console-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        
        .option-row-btn {
            width: 100%;
            background: #1f2937;
            border: 1.5px solid #374151;
            color: #e5e7eb;
            border-radius: 10px;
            padding: 12px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }
        
        .option-row-btn.selected {
            background: #1d4ed8;
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
        }

        .action-dispatch-btn {
            width: 100%;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            touch-action: manipulation;
        }
        
        .action-dispatch-btn:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="hard-splash">
        <div class="splash-content-wrapper">
            <div class="splash-logo-container">
                <img src="assets/logo.png" class="splash-img" alt="Logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
                <div id="logo-fallback" style="display:none;">innovine</div>
            </div>
        </div>
        <div class="loading-bar-wrapper">
            <div class="loading-bar-progress" id="splash-progress-fill"></div>
        </div>
    </div>

    <div id="viewport-root">
        
        <div id="instruction-modal">
            <div class="ins-box">
                <h2 class="ins-title">Cashier Ledger Rules</h2>
                <p class="ins-text">
                    Review transaction logs. Select the correct corresponding balance below, then authorize the transit payload safely.
                </p>
                <button class="action-dispatch-btn" id="btn-start-mission">Start Mission</button>
            </div>
        </div>

        <div class="bank-display">
            <div class="hud-logo-container">
                <img src="assets/logo.png" class="hud-img" alt="Branding" onerror="this.style.display='none';">
            </div>
            <div class="screen-ticker">
                <div class="ticker-title">CASHIER LEDGER VERIFICATION</div>
                <div class="ticker-problem" id="lbl-bank-task">Booting Terminal Console...</div>
            </div>
        </div>

        <div class="simulation-frame">
            <canvas id="bank-canvas"></canvas>
        </div>

        <div class="status-banner" id="lbl-status-toast" style="color: #9ca3af;">Awaiting layout input...</div>

        <div class="console-grid">
            <button class="option-row-btn" id="opt-0">[A] Loading...</button>
            <button class="option-row-btn" id="opt-1">[B] Loading...</button>
            <button class="option-row-btn" id="opt-2">[C] Loading...</button>
        </div>

        <button class="action-dispatch-btn" id="btn-process">Authorize Cashier Deposit</button>
    </div>

    <script>
        let currentActivePuzzle = null;
        let chosenOptionIndex = 0;
        let shuffledAnswersList = [];

        let canvasElement = null;
        let canvasContext = null;
        let engineLoopId = null;
        let audioCtx = null;

        let securityTruck = {
            progress: 0, isDriving: false, isTumbling: false,
            rotation: 0, offsetX: 0, offsetY: 0, frameTimer: 0
        };

        let timeElapsed = 0;
        const totalDuration = 3000; // Faster loading sequence (3s) to speed up window fit
        const tickInterval = 50;
        const progressFill = document.getElementById('splash-progress-fill');
        
        const progressTicker = setInterval(() => {
            timeElapsed += tickInterval;
            let percent = Math.min((timeElapsed / totalDuration) * 100, 100);
            if (progressFill) progressFill.style.width = percent + '%';
            
            if (timeElapsed >= totalDuration) {
                clearInterval(progressTicker);
                const splash = document.getElementById('hard-splash');
                const mainApp = document.getElementById('viewport-root');
                if (splash) splash.style.opacity = '0';
                setTimeout(() => {
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    if (mainApp) {
                        mainApp.style.opacity = '1';
                        initSystemContext();
                    }
                }, 400);
            }
        }, tickInterval);

        function initSystemContext() {
            canvasElement = document.getElementById('bank-canvas');
            canvasContext = canvasElement.getContext('2d');
            
            recalculateCanvasDimensions();
            window.addEventListener('resize', recalculateCanvasDimensions);

            setupUniversalClickOrTouch('btn-start-mission', dismissInstructions);
            setupUniversalClickOrTouch('btn-process', processTransaction);
            
            for(let i=0; i<3; i++) {
                setupUniversalClickOrTouch(`opt-${i}`, () => selectBankOption(i));
            }

            generateBankPuzzle();
            runBankSimulationLoop();
        }

        function setupUniversalClickOrTouch(elementId, callback) {
            const el = document.getElementById(elementId);
            if (!el) return;
            
            let triggered = false;
            const handler = (e) => {
                e.preventDefault();
                if (!triggered) {
                    triggered = true;
                    callback();
                    setTimeout(() => { triggered = false; }, 250);
                }
            };
            
            el.addEventListener('touchstart', handler, { passive: false });
            el.addEventListener('click', (e) => {
                if (!e.defaultPrevented) callback();
            });
        }

        function dismissInstructions() {
            const modal = document.getElementById('instruction-modal');
            if (modal) modal.style.display = 'none';
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function recalculateCanvasDimensions() {
            if (!canvasElement) return;
            canvasElement.width = canvasElement.clientWidth;
            canvasElement.height = canvasElement.clientHeight;
        }

        function generateBankPuzzle() {
            document.getElementById('lbl-status-toast').innerText = "Review money request, select answer, then verify...";
            document.getElementById('lbl-status-toast').style.color = "#9ca3af";
            document.getElementById('btn-process').disabled = false;

            const branchLogs = [
                { text: "A vault ledger contains ₹7,250. If an authorized cash payout transaction of ₹1,450 is completed, how much balance remains?", ans: "₹5,800", w1: "₹5,900", w2: "₹5,650" },
                { text: "A customer deposits 6 notes of ₹500 and 4 notes of ₹100. Calculate the total currency balance added to the counter.", ans: "₹3,400", w1: "₹3,000", w2: "₹3,200" },
                { text: "An invoice bill lists 5 identical security cash boxes totaling ₹2,500. What is the unit expense price per box?", ans: "₹500", w1: "₹450", w2: "₹600" },
                { text: "A merchant splits an operational store bill of ₹4,800 evenly among 4 business partners. How much must each partner pay?", ans: "₹1,200", w1: "₹1,400", w2: "₹1,100" },
                { text: "You process a transaction of 15 tokens valued at ₹60 each. What is the final total calculated value of the package?", ans: "₹900", w1: "₹850", w2: "₹950" }
            ];

            // Directly lock into the screenshot's exact problem layout
            currentActivePuzzle = branchLogs[0]; 
            document.getElementById('lbl-bank-task').innerText = currentActivePuzzle.text;

            shuffledAnswersList = [
                { text: currentActivePuzzle.ans, isCorrect: true },
                { text: currentActivePuzzle.w1, isCorrect: false },
                { text: currentActivePuzzle.w2, isCorrect: false }
            ].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 3; i++) {
                document.getElementById(`opt-${i}`).innerText = `${String.fromCharCode(65 + i)}.) ${shuffledAnswersList[i].text}`;
            }

            securityTruck.progress = 0;
            securityTruck.isDriving = false;
            securityTruck.isTumbling = false;
            securityTruck.rotation = 0;
            securityTruck.offsetX = 0;
            securityTruck.offsetY = 0;
            securityTruck.frameTimer = 0;

            selectBankOption(0);
        }

        function selectBankOption(idx) {
            if (securityTruck.isDriving || securityTruck.isTumbling) return;
            chosenOptionIndex = idx;

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (i === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            }
        }

        function runBankSimulationLoop() {
            updateSimulationPhysics();
            renderSimulationGraphics();
            engineLoopId = requestAnimationFrame(runBankSimulationLoop);
        }

        function updateSimulationPhysics() {
            if (securityTruck.isDriving) {
                securityTruck.progress += 0.022;
                if (securityTruck.progress >= 1.0) {
                    securityTruck.progress = 1.0;
                    securityTruck.isDriving = false;
                    concludeTransactionRound();
                }
            }

            if (securityTruck.isTumbling) {
                securityTruck.frameTimer += 1;
                securityTruck.rotation += 0.24; 
                securityTruck.offsetX += 1.5;   
                securityTruck.offsetY += Math.sin(securityTruck.frameTimer * 0.45) * 4; 

                if (securityTruck.frameTimer >= 50) {
                    securityTruck.isTumbling = false;
                    resetRoundAfterAccident();
                }
            }
        }

        function renderSimulationGraphics() {
            if (!canvasContext || !canvasElement) return;
            
            const w = canvasElement.width;
            const h = canvasElement.height;
            if (w === 0 || h === 0) return;

            canvasContext.clearRect(0, 0, w, h);

            canvasContext.fillStyle = '#1e293b';
            canvasContext.fillRect(0, h - 25, w, 25);
            
            canvasContext.fillStyle = '#d97706';
            canvasContext.fillRect(0, h - 27, w, 2);

            canvasContext.strokeStyle = '#334155';
            canvasContext.lineWidth = 1;
            for (let x = 0; x < w - 60; x += 18) {
                canvasContext.beginPath();
                canvasContext.moveTo(x, 0);
                canvasContext.lineTo(x, h - 27);
                canvasContext.stroke();
            }

            canvasContext.fillStyle = '#273549';
            canvasContext.fillRect(w - 55, 15, 55, h - 40);

            let startX = -30;
            let targetX = w - 85;
            let currentX = startX + (targetX - startX) * securityTruck.progress;
            let currentY = h / 2 + 10;

            canvasContext.save();
            canvasContext.translate(currentX + securityTruck.offsetX, currentY + securityTruck.offsetY);
            canvasContext.rotate(securityTruck.rotation);

            canvasContext.fillStyle = '#0284c7'; 
            canvasContext.fillRect(-18, -9, 36, 18);

            canvasContext.fillStyle = '#1e3a8a';
            canvasContext.fillRect(10, -9, 8, 18);

            canvasContext.restore();
        }

        function processTransaction() {
            if (securityTruck.isDriving || securityTruck.isTumbling) return;
            document.getElementById('btn-process').disabled = true;
            securityTruck.isDriving = true;
            document.getElementById('lbl-status-toast').innerText = "Verifying bills... Active transit processing.";
            document.getElementById('lbl-status-toast').style.color = '#38bdf8';
        }

        function concludeTransactionRound() {
            const chosenAnswer = shuffledAnswersList[chosenOptionIndex];
            const feedbackLabel = document.getElementById('lbl-status-toast');

            if (chosenAnswer && chosenAnswer.isCorrect) {
                playSynthesizedFallback('correct');
                feedbackLabel.innerText = "✓ DEPOSIT SUCCESSFUL! Balance logged into vault.";
                feedbackLabel.style.color = "#10b981";
                setTimeout(() => { generateBankPuzzle(); }, 1500);
            } else {
                playSynthesizedFallback('wrong');
                securityTruck.isTumbling = true;
                feedbackLabel.innerText = "💥 COUNTER ERROR! Mismatched entry!";
                feedbackLabel.style.color = "#ef4444";
            }
        }

        function resetRoundAfterAccident() {
            document.getElementById('btn-process').disabled = false;
            generateBankPuzzle();
        }

        function playSynthesizedFallback(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(type === 'correct' ? 580 : 130, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } catch (e) {}
        }
    </script>
</body>
</html>
