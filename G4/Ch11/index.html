<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vault Master: Cashier Counter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #070a12;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 740px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: relative;
        }

        /* Pure White 5-Second Splash Screen Loader */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .splash-img-container {
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .splash-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
            z-index: 2;
        }
        .vector-logo-fallback {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Instruction Screen Modal Layer */
        #instruction-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.96);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            border-radius: 16px;
        }
        .ins-box {
            background: #111827;
            border: 2px solid #1f2937;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .ins-title {
            font-size: 1.4rem;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .ins-text {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .bank-display {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-logo-container {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            position: relative;
        }
