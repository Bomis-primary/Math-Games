<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metric Highway: Connection Control</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f17;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            opacity: 0; /* Uncovered after 5-second loading completes */
            transition: opacity 0.5s ease;
        }

        /* Regulated 5-Second Splash Loader Interface Screen */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .splash-img-container {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .splash-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
            z-index: 2;
        }
        /* Programmatic fallback asset styling for the innovine logo */
        .vector-logo-fallback {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .control-panel {
            background: #111827;
            border: 2px solid #1f2937;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-logo-container {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            position: relative;
        }

        .signpost {
            background: #022c22;
            border: 2px solid #059669;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            width: 100%;
        }
        .signpost-title {
            font-size: 0.75rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .signpost-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        }

        .map-frame {
            flex-grow: 1;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            min-height: 300px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .switch-deck {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }
        .btn-switch {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            color: #94a3b8;
            border-radius: 12px;
            padding: 14px 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn-switch.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-submit:disabled {
            background: #344154;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .toast-banner {
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <audio id="s-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="s-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div id="hard-splash">
        <div class="splash-img-container">
            <svg class="vector-logo-fallback" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
                <path d="M25 65 L50 25 L75 65 Z" fill="none" stroke="#34d399" stroke-width="6" stroke-linejoin="round"/>
                <path d="M50 25 L50 65" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="6,4"/>
            </svg>
            <img src="assets/logo.png" class="splash-img" alt="Innovine Logo" onerror="this.style.opacity='0';">
        </div>
    </div>

    <div id="viewport-root">
        <div class="control-panel">
            <div class="hud-logo-container">
                <svg class="vector-logo-fallback" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="#111827" stroke="#38bdf8" stroke-width="5"/>
                    <path d="M25 65 L50 25 L75 65 Z" fill="none" stroke="#34d399" stroke-width="7" stroke-linejoin="round"/>
                </svg>
                <img src="assets/logo.png" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain;" onerror="this.style.opacity='0';">
            </div>
            <div class="signpost">
                <div class="signpost-title">TRAFFIC WEIGHT & TRACK ROUTING</div>
                <div class="signpost-value" id="lbl-highway-directive">Configuring Junctions...</div>
            </div>
            <p style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">
                Select Lane 1, 2, or 3 to realign the asphalt route junctions below.
            </p>
        </div>

        <div class="map-frame">
            <canvas id="highway-canvas"></canvas>
        </div>

        <div class="toast-banner" id="lbl-feedback" style="color: #64748b;">Awaiting route alignment...</div>

        <div class="switch-deck">
            <button class="btn-switch" id="sw-0" onclick="alignRouteLane(0)">Lane 1</button>
            <button class="btn-switch" id="sw-1" onclick="alignRouteLane(1)">Lane 2</button>
            <button class="btn-switch" id="sw-2" onclick="alignRouteLane(2)">Lane 3</button>
        </div>

        <button class="btn-submit" id="btn-dispatch" onclick="dispatchVehicles()">Launch Traffic Flow</button>
    </div>
