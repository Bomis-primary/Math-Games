<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metric Highway</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f17;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }
        
        /* Scalable structural container fitting both Laptop displays and Mobile viewports */
        #viewport-root {
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: 85vh;
            display: none; /* Safely managed by 5s splash screen loader */
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            opacity: 0; 
            transition: opacity 0.5s ease;
            background: #111827;
            border: 2px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* 5-Second Universal Plain Splash Screen Block */
        #hard-splash {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: #ffffff;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .splash-text {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0b0f17;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .control-panel {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .signpost {
            background: #022c22;
            border: 2px solid #059669;
            border-radius: 10px;
            padding: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            width: 100%;
        }
        .signpost-title {
            font-size: 0.75rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .signpost-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        }

        .map-frame {
            flex-grow: 1;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            position: relative;
            min-height: 240px; /* Safeguards canvas layout on shorter windows */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .switch-deck {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }
        .btn-switch {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            color: #94a3b8;
            border-radius: 10px;
            padding: 14px 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }
        .btn-switch:hover {
            background: #273549;
            color: #fff;
        }
        .btn-switch.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }

        .btn-submit {
            width: 100%;
            background: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            transition: background 0.2s;
            touch-action: manipulation;
        }
        .btn-submit:hover:not(:disabled) {
            background: #059669;
        }
        .btn-submit:disabled {
            background: #344154;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .toast-banner {
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            min-height: 20px;
        }
        .device-tips {
            font-size: 0.7rem;
            color: #475569;
            text-align: center;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div id="hard-splash">
        <div class="splash-text">LOADING ENGINE...</div>
    </div>

    <div id="viewport-root">
        <div class="control-panel">
            <div class="signpost">
                <div class="signpost-title">METRIC ROUTING CONTROLLER</div>
                <div class="signpost-value" id="lbl-highway-directive">Booting Lanes...</div>
            </div>
        </div>

        <div class="map-frame">
            <canvas id="highway-canvas"></canvas>
        </div>

        <div class="toast-banner" id="lbl-feedback">Calibrating connection...</div>

        <div class="switch-deck">
            <button class="btn-switch" id="sw-0" onclick="alignRouteLane(0)">Lane 1</button>
            <button class="btn-switch" id="sw-1" onclick="alignRouteLane(1)">Lane 2</button>
            <button class="btn-switch" id="sw-2" onclick="alignRouteLane(2)">Lane 3</button>
        </div>

        <button class="btn-submit" id="btn-dispatch" onclick="dispatchVehicles()">Launch Traffic Flow</button>
        <div class="device-tips">Laptop: Keys [1, 2, 3] to pick lane • [Space/Enter] to launch.<br>Mobile: Tap lane buttons or route targets directly.</div>
    </div>

    <script>
        let currentTargetQuery = null;
        let selectedLaneIndex = 0; 
        let laneOptionsData = [];

        let canvasElement = null;
        let canvasContext = null;
        let animationFrameId = null;
        let audioCtx = null;

        let currentVehicle = {
            progress: 0,       
            isMoving: false,
            isTumbling: false,
            tumbleTimer: 0,
            rotationAngle: 0,
            offsetX: 0,
            offsetY: 0,
            type: 'car',       
            color: '#f43f5e'
        };

        // Regulated 5-Second Transition Sequence Loop
        let timeElapsed = 0;
        const totalDuration = 5000; 
        const tickInterval = 100;
        
        const progressTicker = setInterval(() => {
            timeElapsed += tickInterval;
            if (timeElapsed >= totalDuration) {
                clearInterval(progressTicker);
                const splash = document.getElementById('hard-splash');
                const mainApp = document.getElementById('viewport-root');
                
                if (splash) splash.style.opacity = '0';
                
                setTimeout(() => {
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    if (mainApp) {
                        mainApp.style.display = 'flex';
                        setTimeout(() => mainApp.style.opacity = '1', 50);
                    }
                    initGameEngine();
                }, 500);
            }
        }, tickInterval);

        function initGameEngine() {
            canvasElement = document.getElementById('highway-canvas');
            canvasContext = canvasElement.getContext('2d');
            
            setupCanvasSize();
            window.addEventListener('resize', setupCanvasSize);
            setupInputBinds();
            generateNextHighwayLevel();
            startGameLoop();
        }

        function setupCanvasSize() {
            if (!canvasElement) return;
            // Native fluid width/height bounding for perfect rendering scale on both trackpads and mobile screens
            canvasElement.width = canvasElement.offsetWidth;
            canvasElement.height = canvasElement.offsetHeight;
        }

        function setupInputBinds() {
            // Laptop Keyboard Mapping
            window.addEventListener('keydown', (e) => {
                if (currentVehicle.isMoving || currentVehicle.isTumbling) return;
                if (e.key === '1') alignRouteLane(0);
                if (e.key === '2') alignRouteLane(1);
                if (e.key === '3') alignRouteLane(2);
                if (e.key === ' ' || e.key === 'Enter') {
                    e.preventDefault();
                    dispatchVehicles();
                }
            });

            // Direct Canvas Pointer/Touch Detection
            canvasElement.addEventListener('pointerdown', (e) => {
                if (currentVehicle.isMoving || currentVehicle.isTumbling) return;
                const rect = canvasElement.getBoundingClientRect();
                const clickY = e.clientY - rect.top;
                const h = rect.height;

                // Segment path selectors cleanly by thirds
                if (clickY < h * 0.38) alignRouteLane(0);
                else if (clickY < h * 0.65) alignRouteLane(1);
                else alignRouteLane(2);
            });
        }

        function generateNextHighwayLevel() {
            document.getElementById('lbl-feedback').innerText = "Adjust lanes, then launch traffic...";
            document.getElementById('lbl-feedback').style.color = "#64748b";
            document.getElementById('btn-dispatch').disabled = false;

            // Pure Metric Database Pools
            const basePool = [
                { val: '1/2', unit: 'm', cVal: '50 cm', w1: '5 cm', w2: '500 cm' },
                { val: '1/4', unit: 'km', cVal: '250 m', w1: '25 m', w2: '2500 m' },
                { val: '3/4', unit: 'kg', cVal: '750 g', w1: '75 g', w2: '7500 g' },
                { val: '1/5', unit: 'L', cVal: '200 ml', w1: '20 ml', w2: '2000 ml' },
                { val: '2/5', unit: 'm', cVal: '40 cm', w1: '400 cm', w2: '4 cm' },
                { val: '1/10', unit: 'km', cVal: '100 m', w1: '10 m', w2: '1000 m' },
                { val: '3/10', unit: 'kg', cVal: '300 g', w1: '30 g', w2: '3000 g' },
                { val: '7/10', unit: 'L', cVal: '700 ml', w1: '70 ml', w2: '7000 ml' }
            ];

            let chosen = basePool[Math.floor(Math.random() * basePool.length)];

            currentTargetQuery = {
                directive: `Find: ${chosen.val} ${chosen.unit}`,
                correct: chosen.cVal,
                wrong: [chosen.w1, chosen.w2]
            };

            document.getElementById('lbl-highway-directive').innerText = currentTargetQuery.directive;

            let scrambledPool = [
                { text: currentTargetQuery.correct, isTruePath: true },
                { text: currentTargetQuery.wrong[0], isTruePath: false },
                { text: currentTargetQuery.wrong[1], isTruePath: false }
            ].sort(() => Math.random() - 0.5);

            laneOptionsData = scrambledPool;

            currentVehicle.progress = 0;
            currentVehicle.isMoving = false;
            currentVehicle.isTumbling = false;
            currentVehicle.tumbleTimer = 0;
            currentVehicle.rotationAngle = 0;
            currentVehicle.offsetX = 0;
            currentVehicle.offsetY = 0;
            currentVehicle.type = Math.random() > 0.5 ? 'car' : 'bike';
            currentVehicle.color = ['#f43f5e', '#3b82f6', '#10b981', '#eab308'][Math.floor(Math.random() * 4)];

            alignRouteLane(0); 
        }

        function alignRouteLane(index) {
            if (currentVehicle.isMoving || currentVehicle.isTumbling) return; 
            selectedLaneIndex = index;

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`sw-${i}`);
                if (btn) {
                    if (i === index) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            }
        }

        function getBezierXY(t, p0, p1, p2, p3) {
            let cx = 3 * (p1.x - p0.x);
            let bx = 3 * (p2.x - p1.x) - cx;
            let ax = p3.x - p0.x - cx - bx;
            let cy = 3 * (p1.y - p0.y);
            let by = 3 * (p2.y - p1.y) - cy;
            let ay = p3.y - p0.y - cy - by;
            return {
                x: (ax * t * t * t) + (bx * t * t) + (cx * t) + p0.x,
                y: (ay * t * t * t) + (by * t * t) + (cy * t) + p0.y
            };
        }

        function startGameLoop() {
            function loop() {
                updatePhysics();
                renderCanvasGraphics();
                animationFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        function updatePhysics() {
            if (currentVehicle.isMoving) {
                currentVehicle.progress += 0.016;
                if (currentVehicle.progress >= 0.85) { 
                    evaluateRouteMatch();
                }
            }

            if (currentVehicle.isTumbling) {
                currentVehicle.tumbleTimer += 1;
                currentVehicle.rotationAngle += 0.25; 
                currentVehicle.offsetX += 2;          
                currentVehicle.offsetY += Math.sin(currentVehicle.tumbleTimer * 0.4) * 4; 

                if (currentVehicle.tumbleTimer >= 60) { 
                    currentVehicle.isTumbling = false;
                    resetLevelAfterCrash();
                }
            }
        }

        function renderCanvasGraphics() {
            if (!canvasContext || !canvasElement) return;
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const w = canvasElement.width;
            const h = canvasElement.height;
            const laneYPositions = [h * 0.23, h * 0.5, h * 0.77];

            canvasContext.fillStyle = '#1e293b';
            canvasContext.fillRect(0, h/2 - 22, 50, 44);

            for (let i = 0; i < 3; i++) {
                canvasContext.fillRect(w - 110, laneYPositions[i] - 18, 110, 36);
            }

            canvasContext.lineWidth = 6;
            canvasContext.lineCap = 'round';

            for (let i = 0; i < 3; i++) {
                canvasContext.strokeStyle = (i === selectedLaneIndex) ? '#38bdf8' : '#273549';
                canvasContext.beginPath();
                canvasContext.moveTo(10, h / 2);
                canvasContext.lineTo(50, h / 2);
                canvasContext.bezierCurveTo(w * 0.4, h / 2, w * 0.4, laneYPositions[i], w - 90, laneYPositions[i]);
                canvasContext.lineTo(w, laneYPositions[i]);
                canvasContext.stroke();
            }

            let p0 = { x: 25, y: h / 2 };
            let p1 = { x: w * 0.4, y: h / 2 };
            let p2 = { x: w * 0.4, y: laneYPositions[selectedLaneIndex] };
            let p3 = { x: w - 45, y: laneYPositions[selectedLaneIndex] };
            
            let vehPos = getBezierXY(currentVehicle.progress, p0, p1, p2, p3);

            canvasContext.save();
            canvasContext.translate(vehPos.x + currentVehicle.offsetX, vehPos.y + currentVehicle.offsetY);
            canvasContext.rotate(currentVehicle.rotationAngle);
            canvasContext.fillStyle = currentVehicle.color;

            if (currentVehicle.type === 'car') {
                canvasContext.fillRect(-12, -6, 24, 12);
                canvasContext.fillStyle = '#ffffff';
                canvasContext.fillRect(2, -4, 5, 8);
                canvasContext.fillRect(-7, -4, 5, 8);
            } else {
                canvasContext.fillRect(-9, -3, 18, 6);
                canvasContext.fillStyle = '#000000';
                canvasContext.beginPath(); canvasContext.arc(-6, 3, 2.5, 0, Math.PI*2); canvasContext.fill();
                canvasContext.beginPath(); canvasContext.arc(6, 3, 2.5, 0, Math.PI*2); canvasContext.fill();
            }
            canvasContext.restore();

            for (let i = 0; i < 3; i++) {
                const option = laneOptionsData[i];

                canvasContext.fillStyle = '#0f172a';
                canvasContext.strokeStyle = (i === selectedLaneIndex) ? '#38bdf8' : '#475569';
                canvasContext.lineWidth = 2;
                
                canvasContext.beginPath();
                canvasContext.rect(w - 100, laneYPositions[i] - 14, 90, 28);
                canvasContext.fill();
                canvasContext.stroke();

                canvasContext.fillStyle = '#ffffff';
                canvasContext.font = 'bold 11px sans-serif';
                canvasContext.textAlign = 'center';
                canvasContext.textBaseline = 'middle';
                canvasContext.fillText(option ? option.text : '', w - 55, laneYPositions[i]);

                canvasContext.fillStyle = '#64748b';
                canvasContext.font = '9px monospace';
                canvasContext.fillText(`LANE ${i+1}`, w - 122, laneYPositions[i]);
            }
        }

        function dispatchVehicles() {
            if (currentVehicle.isMoving || currentVehicle.isTumbling) return;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            document.getElementById('btn-dispatch').disabled = true;
            currentVehicle.isMoving = true;
            document.getElementById('lbl-feedback').innerText = "Traffic flow active...";
            document.getElementById('lbl-feedback').style.color = '#38bdf8';
        }

        function evaluateRouteMatch() {
            currentVehicle.isMoving = false; 
            const chosenPath = laneOptionsData[selectedLaneIndex];
            const feedbackText = document.getElementById('lbl-feedback');

            if (chosenPath && chosenPath.isTruePath) {
                currentVehicle.progress = 1.0; 
                triggerSynthesizerFallback('correct');
                feedbackText.innerText = "✓ PASSED! Metric conversion cleared.";
                feedbackText.style.color = "#10b981";
                
                setTimeout(() => {
                    generateNextHighwayLevel();
                }, 1500);
            } else {
                currentVehicle.isTumbling = true;
                triggerSynthesizerFallback('wrong');
                feedbackText.innerText = "💥 COLLISION! Roadblock alignment fault.";
                feedbackText.style.color = "#f43f5e";
            }
        }

        function resetLevelAfterCrash() {
            const feedbackText = document.getElementById('lbl-feedback');
            currentVehicle.progress = 0;
            currentVehicle.offsetX = 0;
            currentVehicle.offsetY = 0;
            currentVehicle.rotationAngle = 0;
            currentVehicle.tumbleTimer = 0;
            
            document.getElementById('btn-dispatch').disabled = false;
            feedbackText.innerText = "Realign connections and try again.";
            feedbackText.style.color = "#64748b";
        }

        function triggerSynthesizerFallback(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); 
                    osc.frequency.setValueAtTime(880.00, now + 0.08); 
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(110, now);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
