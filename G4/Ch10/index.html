<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metric Highway: Connection Control</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f17;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            opacity: 0; /* Uncovered after 5-second loading bar completes */
            transition: opacity 0.5s ease;
        }

        /* Regulated 5-Second Splash Loader Interface Screen */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .splash-img {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
            object-fit: contain;
        }
        .splash-title {
            font-size: 1.8rem;
            color: #38bdf8;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .control-panel {
            background: #111827;
            border: 2px solid #1f2937;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .signpost {
            background: #022c22;
            border: 2px solid #059669;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .signpost-title {
            font-size: 0.75rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .signpost-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        }

        .map-frame {
            flex-grow: 1;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            min-height: 300px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .switch-deck {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }
        .btn-switch {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            color: #94a3b8;
            border-radius: 12px;
            padding: 14px 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn-switch.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-submit:disabled {
            background: #344154;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .toast-banner {
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <audio id="s-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="s-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div id="hard-splash">
        <img src="assets/logo.png" class="splash-img" alt="Logo" onerror="this.style.display='none';">
        <h1 class="splash-title">Metric Highway</h1>
        <div style="width:140px; height:6px; background-color:#1e293b; border-radius:10px; overflow:hidden;">
            <div id="loader-progress-fill" style="width:0%; height:100%; background-color:#38bdf8; transition: width 0.1s ease;"></div>
        </div>
    </div>

    <div id="viewport-root">
        <div class="control-panel">
            <img src="assets/logo.png" style="width:40px; margin-bottom:8px;" onerror="this.style.display='none';">
            <div class="signpost">
                <div class="signpost-title">TRAFFIC WEIGHT & TRACK ROUTING</div>
                <div class="signpost-value" id="lbl-highway-directive">Configuring Junctions...</div>
            </div>
            <p style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">
                Select Lane 1, 2, or 3 to realign the asphalt route junctions below.
            </p>
        </div>

        <div class="map-frame">
            <canvas id="highway-canvas"></canvas>
        </div>

        <div class="toast-banner" id="lbl-feedback" style="color: #64748b;">Awaiting route alignment...</div>

        <div class="switch-deck">
            <button class="btn-switch" id="sw-0" onclick="alignRouteLane(0)">Lane 1</button>
            <button class="btn-switch" id="sw-1" onclick="alignRouteLane(1)">Lane 2</button>
            <button class="btn-switch" id="sw-2" onclick="alignRouteLane(2)">Lane 3</button>
        </div>

        <button class="btn-submit" id="btn-dispatch" onclick="dispatchVehicles()">Launch Traffic Flow</button>
    </div>

    <script>
        let currentTargetQuery = null;
        let selectedLaneIndex = 0; 
        let laneOptionsData = [];

        let canvasElement = null;
        let canvasContext = null;
        let animationFrameId = null;

        // Vehicle State Properties
        let currentVehicle = {
            progress: 0,       
            isMoving: false,
            isTumbling: false,
            tumbleTimer: 0,
            rotationAngle: 0,
            offsetX: 0,
            offsetY: 0,
            type: 'car',       
            color: '#f43f5e'
        };

        // Regulated 5-Second Progress Timeline Engine Loading Sequence
        let progressVal = 0;
        const progressTicker = setInterval(() => {
            progressVal += 2;
            const fillElement = document.getElementById('loader-progress-fill');
            if (fillElement) fillElement.style.width = progressVal + '%';

            if (progressVal >= 100) {
                clearInterval(progressTicker);
                const splash = document.getElementById('hard-splash');
                const mainApp = document.getElementById('viewport-root');
                if (splash) splash.style.opacity = '0';
                setTimeout(() => {
                    if (splash.parentNode) splash.parentNode.removeChild(splash);
                    mainApp.style.opacity = '1';
                    initGameEngine();
                }, 500);
            }
        }, 100);

        function initGameEngine() {
            canvasElement = document.getElementById('highway-canvas');
            canvasContext = canvasElement.getContext('2d');
            
            setupCanvasSize();
            generateNextHighwayLevel();
            startGameLoop();
        }

        function setupCanvasSize() {
            const rect = canvasElement.getBoundingClientRect();
            canvasElement.width = rect.width;
            canvasElement.height = rect.height;
        }

        function generateNextHighwayLevel() {
            document.getElementById('lbl-feedback').innerText = "Adjust lanes, then launch traffic...";
            document.getElementById('lbl-feedback').style.color = "#64748b";
            document.getElementById('btn-dispatch').disabled = false;

            const basePool = [
                { val: 5, unit: 'm', cVal: '500 cm', w1: '50 cm', w2: '5000 cm' },
                { val: 12, unit: 'm', cVal: '1200 cm', w1: '120 cm', w2: '12000 cm' },
                { val: 3.5, unit: 'm', cVal: '350 cm', w1: '35 cm', w2: '3500 cm' },
                { val: 9, unit: 'km', cVal: '9000 m', w1: '900 m', w2: '90 m' },
                { val: 1.5, unit: 'km', cVal: '1500 m', w1: '150 m', w2: '15000 m' },
                { val: 4, unit: 'kg', cVal: '4000 g', w1: '400 g', w2: '40000 g' },
                { val: 6.5, unit: 'kg', cVal: '6500 g', w1: '650 g', w2: '65000 g' },
                { val: 0.5, unit: 'kg', cVal: '500 g', w1: '50 g', w2: '5000 g' },
                { val: 3, unit: 'L', cVal: '3000 ml', w1: '300 ml', w2: '30 ml' },
                { val: 7.5, unit: 'L', cVal: '7500 ml', w1: '750 ml', w2: '75000 ml' },
                { val: 80, unit: 'mm', cVal: '8 cm', w1: '80 cm', w2: '0.8 cm' },
                { val: 250, unit: 'mm', cVal: '25 cm', w1: '250 cm', w2: '2.5 cm' }
            ];

            let chosen = basePool[Math.floor(Math.random() * basePool.length)];
            
            let typeLabel = "WEIGHT";
            if(chosen.unit === 'm' || chosen.unit === 'km' || chosen.unit === 'mm') typeLabel = "LENGTH";
            if(chosen.unit === 'L') typeLabel = "CAPACITY";

            currentTargetQuery = {
                directive: `Route ${typeLabel}: ${chosen.val} ${chosen.unit}`,
                correct: chosen.cVal,
                wrong: [chosen.w1, chosen.w2]
            };

            document.getElementById('lbl-highway-directive').innerText = currentTargetQuery.directive;

            let scrambledPool = [
                { text: currentTargetQuery.correct, isTruePath: true },
                { text: currentTargetQuery.wrong[0], isTruePath: false },
                { text: currentTargetQuery.wrong[1], isTruePath: false }
            ].sort(() => Math.random() - 0.5);

            laneOptionsData = scrambledPool;

            // Reset vehicle variables completely
            currentVehicle.progress = 0;
            currentVehicle.isMoving = false;
            currentVehicle.isTumbling = false;
            currentVehicle.tumbleTimer = 0;
            currentVehicle.rotationAngle = 0;
            currentVehicle.offsetX = 0;
            currentVehicle.offsetY = 0;
            currentVehicle.type = Math.random() > 0.5 ? 'car' : 'bike';
            currentVehicle.color = ['#f43f5e', '#3b82f6', '#10b981', '#eab308'][Math.floor(Math.random() * 4)];

            alignRouteLane(0); 
        }

        function alignRouteLane(index) {
            if (currentVehicle.isMoving || currentVehicle.isTumbling) return; 
            selectedLaneIndex = index;

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`sw-${i}`);
                if (btn) {
                    if (i === index) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            }
        }

        function getBezierXY(t, p0, p1, p2, p3) {
            let cx = 3 * (p1.x - p0.x);
            let bx = 3 * (p2.x - p1.x) - cx;
            let ax = p3.x - p0.x - cx - bx;

            let cy = 3 * (p1.y - p0.y);
            let by = 3 * (p2.y - p1.y) - cy;
            let ay = p3.y - p0.y - cy - by;

            let x = (ax * t * t * t) + (bx * t * t) + (cx * t) + p0.x;
            let y = (ay * t * t * t) + (by * t * t) + (cy * t) + p0.y;

            return { x: x, y: y };
        }

        function startGameLoop() {
            function loop() {
                updatePhysics();
                renderCanvasGraphics();
                animationFrameId = requestAnimationFrame(loop);
            }
            loop();
        }

        function updatePhysics() {
            if (currentVehicle.isMoving) {
                currentVehicle.progress += 0.015;
                if (currentVehicle.progress >= 0.85) { 
                    evaluateRouteMatch();
                }
            }

            if (currentVehicle.isTumbling) {
                currentVehicle.tumbleTimer += 1;
                currentVehicle.rotationAngle += 0.25; 
                currentVehicle.offsetX += 2;          
                currentVehicle.offsetY += Math.sin(currentVehicle.tumbleTimer * 0.4) * 4; 

                if (currentVehicle.tumbleTimer >= 60) { 
                    currentVehicle.isTumbling = false;
                    resetLevelAfterCrash();
                }
            }
        }

        function renderCanvasGraphics() {
            if (!canvasContext) return;
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const w = canvasElement.width;
            const h = canvasElement.height;
            const laneYPositions = [h * 0.23, h * 0.5, h * 0.77];

            canvasContext.fillStyle = '#1e293b';
            canvasContext.fillRect(0, h/2 - 25, 60, 50);

            for (let i = 0; i < 3; i++) {
                canvasContext.fillRect(w - 120, laneYPositions[i] - 20, 120, 40);
            }

            canvasContext.lineWidth = 8;
            canvasContext.lineCap = 'round';

            for (let i = 0; i < 3; i++) {
                const isActive = (i === selectedLaneIndex);
                canvasContext.strokeStyle = isActive ? '#38bdf8' : '#273549';
                
                canvasContext.beginPath();
                canvasContext.moveTo(10, h / 2);
                canvasContext.lineTo(60, h / 2);
                canvasContext.bezierCurveTo(w * 0.4, h / 2, w * 0.4, laneYPositions[i], w - 100, laneYPositions[i]);
                canvasContext.lineTo(w, laneYPositions[i]);
                canvasContext.stroke();
            }

            let p0 = { x: 30, y: h / 2 };
            let p1 = { x: w * 0.4, y: h / 2 };
            let p2 = { x: w * 0.4, y: laneYPositions[selectedLaneIndex] };
            let p3 = { x: w - 50, y: laneYPositions[selectedLaneIndex] };
            
            let vehPos = getBezierXY(currentVehicle.progress, p0, p1, p2, p3);

            canvasContext.save();
            canvasContext.translate(vehPos.x + currentVehicle.offsetX, vehPos.y + currentVehicle.offsetY);
            canvasContext.rotate(currentVehicle.rotationAngle);
            canvasContext.fillStyle = currentVehicle.color;

            if (currentVehicle.type === 'car') {
                canvasContext.fillRect(-14, -7, 28, 14);
                canvasContext.fillStyle = '#ffffff';
                canvasContext.fillRect(2, -5, 6, 10);
                canvasContext.fillRect(-8, -5, 6, 10);
            } else {
                canvasContext.fillRect(-10, -3, 20, 6);
                canvasContext.fillStyle = '#000000';
                canvasContext.beginPath(); canvasContext.arc(-7, 3, 3, 0, Math.PI*2); canvasContext.fill();
                canvasContext.beginPath(); canvasContext.arc(7, 3, 3, 0, Math.PI*2); canvasContext.fill();
            }
            canvasContext.restore();

            if (currentVehicle.isTumbling) {
                canvasContext.fillStyle = 'rgba(244, 63, 94, 0.4)';
                canvasContext.beginPath();
                canvasContext.arc(vehPos.x + currentVehicle.offsetX - 10, vehPos.y + currentVehicle.offsetY, 15, 0, Math.PI*2);
                canvasContext.fill();
            }

            for (let i = 0; i < 3; i++) {
                const option = laneOptionsData[i];

                canvasContext.fillStyle = '#0f172a';
                canvasContext.strokeStyle = (i === selectedLaneIndex) ? '#38bdf8' : '#475569';
                canvasContext.lineWidth = 2;
                canvasContext.beginPath();
                canvasContext.roundRect(w - 110, laneYPositions[i] - 16, 95, 32, 6);
                canvasContext.fill();
                canvasContext.stroke();

                canvasContext.fillStyle = '#ffffff';
                canvasContext.font = 'bold 12px sans-serif';
                canvasContext.textAlign = 'center';
                canvasContext.textBaseline = 'middle';
                canvasContext.fillText(option ? option.text : '', w - 62, laneYPositions[i]);

                canvasContext.fillStyle = '#64748b';
                canvasContext.font = '9px monospace';
                canvasContext.fillText(`LANE ${i+1}`, w - 130, laneYPositions[i]);
            }
        }

        function dispatchVehicles() {
            if (currentVehicle.isMoving || currentVehicle.isTumbling) return;
            document.getElementById('btn-dispatch').disabled = true;
            currentVehicle.isMoving = true;
            document.getElementById('lbl-feedback').innerText = "Traffic flow dispatched...";
            document.getElementById('lbl-feedback').style.color = '#38bdf8';
        }

        function evaluateRouteMatch() {
            currentVehicle.isMoving = false; 
            const chosenPath = laneOptionsData[selectedLaneIndex];
            const feedbackText = document.getElementById('lbl-feedback');

            if (chosenPath && chosenPath.isTruePath) {
                currentVehicle.progress = 1.0; 
                playAudioFile('s-correct');
                feedbackText.innerText = "✓ PASSED TOLL GATE! Conversion cleared.";
                feedbackText.style.color = "#10b981";
                
                setTimeout(() => {
                    generateNextHighwayLevel();
                }, 1500);
            } else {
                currentVehicle.isTumbling = true;
                playAudioFile('s-wrong');
                feedbackText.innerText = "💥 ACCIDENT ROADBLOCK! Vehicle is tumbling!";
                feedbackText.style.color = "#f43f5e";
            }
        }

        function resetLevelAfterCrash() {
            const feedbackText = document.getElementById('lbl-feedback');
            
            currentVehicle.progress = 0;
            currentVehicle.offsetX = 0;
            currentVehicle.offsetY = 0;
            currentVehicle.rotationAngle = 0;
            currentVehicle.tumbleTimer = 0;
            
            document.getElementById('btn-dispatch').disabled = false;
            feedbackText.innerText = "Realign connections to safe values and retry.";
            feedbackText.style.color = "#64748b";
        }

        function playAudioFile(id) {
            try {
                const sound = document.getElementById(id);
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            } catch (err) {}
        }
    </script>
</body>
</html>
