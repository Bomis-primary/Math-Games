<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metric Highway: Connection Control</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f17;
            color: #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 720px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .control-panel {
            background: #111827;
            border: 2px solid #1f2937;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .signpost {
            background: #022c22;
            border: 2px solid #059669;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 6px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .signpost-title {
            font-size: 0.75rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .signpost-value {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        }

        .map-frame {
            flex-grow: 1;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            min-height: 300px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .switch-deck {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }
        .btn-switch {
            flex: 1;
            background: #1e293b;
            border: 1px solid #475569;
            color: #94a3b8;
            border-radius: 12px;
            padding: 14px 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn-switch.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .btn-submit {
            width: 100%;
            background: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .btn-submit:active {
            background: #059669;
        }

        .toast-banner {
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div id="viewport-root">
        <div class="control-panel">
            <div class="signpost">
                <div class="signpost-title">TRAFFIC WEIGHT & TRACK ROUTING</div>
                <div class="signpost-value" id="lbl-highway-directive">Loading Highway Config...</div>
            </div>
            <p style="font-size: 0.75rem; color: #64748b; margin-top: 4px;">
                Select Lane 1, 2, or 3 to realign the asphalt route junctions below.
            </p>
        </div>

        <div class="map-frame">
            <canvas id="highway-canvas"></canvas>
        </div>

        <div class="toast-banner" id="lbl-feedback" style="color: #64748b;">Awaiting route alignment...</div>

        <div class="switch-deck">
            <button class="btn-switch" id="sw-0" onclick="alignRouteLane(0)">Lane 1</button>
            <button class="btn-switch" id="sw-1" onclick="alignRouteLane(1)">Lane 2</button>
            <button class="btn-switch" id="sw-2" onclick="alignRouteLane(2)">Lane 3</button>
        </div>

        <button class="btn-submit" onclick="dispatchVehicles()">Launch Traffic Flow</button>
    </div>

    <script>
        let currentTargetQuery = null;
        let selectedLaneIndex = 0; // Default active lane route configuration
        let laneOptionsData = [];

        let canvasElement = null;
        let canvasContext = null;

        window.onload = () => {
            canvasElement = document.getElementById('highway-canvas');
            canvasContext = canvasElement.getContext('2d');
            
            setupCanvasSize();
            generateNextHighwayLevel();
        };

        function setupCanvasSize() {
            const rect = canvasElement.getBoundingClientRect();
            canvasElement.width = rect.width;
            canvasElement.height = rect.height;
        }

        function generateNextHighwayLevel() {
            document.getElementById('lbl-feedback').innerText = "Adjust lanes, then launch traffic...";
            document.getElementById('lbl-feedback').style.color = "#64748b";

            // Metric curriculum questions directly referencing image_e59501.png
            const conversionDatabase = [
                { directive: "Route vehicles matching 4 meters", correct: "400 cm", wrong: ["40 cm", "4000 cm"] },
                { directive: "Route vehicles matching 7 kilometers", correct: "7000 m", wrong: ["700 m", "70 m"] },
                { directive: "Route vehicles matching 3 kilograms", correct: "3000 g", wrong: ["300 g", "30000 g"] },
                { directive: "Route vehicles matching 2 liters", correct: "2000 ml", wrong: ["200 ml", "20 ml"] },
                { directive: "Route vehicles matching 50 millimeters", correct: "5 cm", wrong: ["500 cm", "0.5 cm"] },
                { directive: "Route vehicles matching 8.5 kilograms", correct: "8500 g", wrong: ["850 g", "85 g"] }
            ];

            currentTargetQuery = conversionDatabase[Math.floor(Math.random() * conversionDatabase.length)];
            document.getElementById('lbl-highway-directive').innerText = currentTargetQuery.directive;

            // Generate options structure and scramble
            let pool = [
                { text: currentTargetQuery.correct, isTruePath: true },
                { text: currentTargetQuery.wrong[0], isTruePath: false },
                { text: currentTargetQuery.wrong[1], isTruePath: false }
            ].sort(() => Math.random() - 0.5);

            laneOptionsData = pool;
            alignRouteLane(0); // Set lane 1 active by default
        }

        function alignRouteLane(index) {
            selectedLaneIndex = index;

            // Manage styling of interactive buttons
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`sw-${i}`);
                if (btn) {
                    if (i === index) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            }

            renderHighwayMap();
        }

        function renderHighwayMap() {
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const w = canvasElement.width;
            const h = canvasElement.height;

            // 1. Draw solid dark asphalt background highway blocks
            canvasContext.fillStyle = '#1e293b';
            
            // Entrance Hub
            canvasContext.fillRect(0, h/2 - 25, 60, 50);

            // Three branching exit highway lanes
            const laneYPositions = [h * 0.25, h * 0.5, h * 0.75];
            for (let i = 0; i < 3; i++) {
                canvasContext.fillRect(w - 120, laneYPositions[i] - 20, 120, 40);
            }

            // 2. Draw procedural neon glowing connectivity lanes
            canvasContext.lineWidth = 6;
            canvasContext.lineCap = 'round';
            canvasContext.lineJoin = 'round';

            for (let i = 0; i < 3; i++) {
                const isActiveConnection = (i === selectedLaneIndex);
                
                // Color lane blue if selected active path, otherwise a subtle dark slate
                canvasContext.strokeStyle = isActiveConnection ? '#38bdf8' : '#334155';
                
                canvasContext.beginPath();
                canvasContext.moveTo(10, h / 2);
                canvasContext.lineTo(60, h / 2);
                // Curve smoothly up or down into target lane
                canvasContext.bezierCurveTo(w * 0.4, h / 2, w * 0.4, laneYPositions[i], w - 100, laneYPositions[i]);
                canvasContext.lineTo(w, laneYPositions[i]);
                canvasContext.stroke();

                // Draw decorative white center dashed line if active route is aligned
                if (isActiveConnection) {
                    canvasContext.strokeStyle = '#ffffff';
                    canvasContext.lineWidth = 1.5;
                    canvasContext.setLineDash([6, 6]);
                    canvasContext.stroke();
                    canvasContext.setLineDash([]);
                    canvasContext.lineWidth = 6;
                }
            }

            // 3. Draw Starting Point Carrier Vehicle Pod
            canvasContext.fillStyle = '#10b981';
            canvasContext.beginPath();
            canvasContext.arc(30, h / 2, 10, 0, Math.PI * 2);
            canvasContext.fill();

            // 4. Draw Toll Gate terminal stations on exit lanes
            for (let i = 0; i < 3; i++) {
                const option = laneOptionsData[i];

                // Station box shell
                canvasContext.fillStyle = '#0f172a';
                canvasContext.strokeStyle = (i === selectedLaneIndex) ? '#38bdf8' : '#475569';
                canvasContext.lineWidth = 2;
                canvasContext.beginPath();
                canvasContext.roundRect(w - 110, laneYPositions[i] - 16, 95, 32, 6);
                canvasContext.fill();
                canvasContext.stroke();

                // Station conversion rate text labels
                canvasContext.fillStyle = '#ffffff';
                canvasContext.font = 'bold 12px sans-serif';
                canvasContext.textAlign = 'center';
                canvasContext.textBaseline = 'middle';
                canvasContext.fillText(option ? option.text : '', w - 62, laneYPositions[i]);

                // Station ID Tag (e.g. "L1")
                canvasContext.fillStyle = '#64748b';
                canvasContext.font = '9px monospace';
                canvasContext.fillText(`GATE ${i+1}`, w - 130, laneYPositions[i]);
            }
        }

        function dispatchVehicles() {
            const chosenPath = laneOptionsData[selectedLaneIndex];
            const feedbackText = document.getElementById('lbl-feedback');

            if (chosenPath && chosenPath.isTruePath) {
                feedbackText.innerText = "✓ ROUTE SUCCESSFUL! Connection configured perfectly.";
                feedbackText.style.color = "#34d399";
                
                // Advance into next highway sequence
                setTimeout(() => {
                    generateNextHighwayLevel();
                }, 1800);
            } else {
                feedbackText.innerText = "✗ TRAFFIC BLOCK! Mismatched metric conversion value at toll gate.";
                feedbackText.style.color = "#f87171";
            }
        }
    </script>
</body>
</html>
