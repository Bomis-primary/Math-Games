<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Cartography: Geometry Sort</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: monospace;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow: hidden;
        }
        
        #viewport-root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
        }

        /* Tech Blueprint Minimal Panels */
        .blueprint-panel {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 25px 20px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }
        
        .btn-action {
            background: #f1f5f9;
            color: #0f172a;
            border: none;
            padding: 12px 36px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-layout {
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .hud-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #94a3b8;
            padding: 6px 2px;
            letter-spacing: 1px;
        }
        .hud-value {
            color: #f1f5f9;
            font-weight: bold;
        }

        .info-panel {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 8px;
        }
        .info-tag {
            font-size: 0.7rem;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .info-text {
            font-size: 1.1rem;
            color: #ffffff;
        }

        .canvas-frame {
            width: 100%;
            background-color: #020617;
            border: 2px solid #334155;
            border-radius: 12px;
            position: relative;
            flex-grow: 1;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Minimal sorting dock steering deck */
        .deck-controls {
            display: flex;
            width: 100%;
            margin-top: 10px;
            height: 55px;
            gap: 12px;
        }
        .deck-btn {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            width: 50%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .deck-btn:active {
            background: #334155;
            color: #38bdf8;
        }

        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
    </style>
</head>
<body>

    <audio id="s-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="s-wrong" src="assets/wrong.mp3" preload="auto"></audio>

    <div id="hard-splash">
        <h1 style="font-size:1.4rem; color:#f1f5f9; letter-spacing:3px;">LOADING MATRIX...</h1>
    </div>

    <div id="viewport-root"></div>

    <script>
        let currentScore = 0;
        let systemErrors = 0;
        const maxAllowedErrors = 3;
        
        let canvasElement = null;
        let canvasContext = null;
        let animationFrameHandle = null;

        // Sorting dock configuration parameters
        let activeTargetShape = null; 
        let currentTargetCategoryA = "";
        let currentTargetCategoryB = "";
        let expectedWinningDockIndex = 0; // 0 = Left Dock, 1 = Right Dock
        let activeCollectorDockIndex = 0; // Current selection index position
        
        let isEngineRunning = false;

        // Force clear layout loading screen state immediately
        setTimeout(() => {
            const splashMask = document.getElementById('hard-splash');
            if (splashMask) splashMask.parentNode.removeChild(splashMask);
            renderMenuScreen();
        }, 600);

        function renderMenuScreen() {
            isEngineRunning = false;
            if (animationFrameHandle) cancelAnimationFrame(animationFrameHandle);
            
            document.getElementById('viewport-root').innerHTML = `
                <div class="blueprint-panel">
                    <h1 style="font-size:1.4rem; color:#ffffff; margin-bottom:12px; letter-spacing:2px;">COSMIC CARTOGRAPHY</h1>
                    <p style="color:#94a3b8; font-size:0.85rem; line-height:1.6; margin-bottom:20px; text-align:justify;">
                        A grid sorting game covering spatial attributes from Curriculum Lesson 07. Analyze geometric properties—ranging from simple curves to solid shape metrics like faces, edges, and vertices—and dynamically sort elements into their designated docks.
                    </p>
                    <button class="btn-action" onclick="initiateGameEngine()">INITIALIZE SORT</button>
                </div>
            `;
        }

        function initiateGameEngine() {
            currentScore = 0;
            systemErrors = 0;
            isEngineRunning = true;
            activeCollectorDockIndex = 0;

            buildGameLayoutDOM();
            generateNextSpatialPuzzle();
            runCanvasGameLoop();
            attachSteeringControls();
        }

        function buildGameLayoutDOM() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="game-layout">
                    <div class="hud-row">
                        <div>DATA LOG: <span id="lbl-score" class="hud-value">0 Sorted</span></div>
                        <div>ERRORS: <span id="lbl-errors" class="hud-value">0/3</span></div>
                    </div>

                    <div class="info-panel">
                        <div class="info-tag">SPATIAL SORT METRIC</div>
                        <div class="info-text" id="lbl-task-text">IDENTIFY GEOMETRY CHARACTERISTICS</div>
                    </div>

                    <div class="canvas-frame">
                        <canvas id="rush-canvas" width="440" height="420"></canvas>
                    </div>

                    <div class="deck-controls">
                        <div class="deck-btn" id="btn-left-press">Dock Left</div>
                        <div class="deck-btn" id="btn-right-press">Dock Right</div>
                    </div>
                </div>
            `;

            canvasElement = document.getElementById('rush-canvas');
            canvasContext = canvasElement.getContext('2d');
        }

        function generateNextSpatialPuzzle() {
            // Evaluates curriculum items from image_e6fdbd.png mapping
            const curriculumPool = [
                {
                    metric: "Classify Lines & Curves",
                    catA: "Straight Line", catB: "Curved Line",
                    variants: [
                        { label: "Ruler-drawn segment", wins: 0, drawType: "straight" },
                        { label: "Wavy path blueprint", wins: 1, drawType: "curved" },
                        { label: "Circle arc trace", wins: 1, drawType: "curved" }
                    ]
                },
                {
                    metric: "Parts of a Circle",
                    catA: "Circle Center", catB: "Circle Diameter",
                    variants: [
                        { label: "Absolute middle point", wins: 0, drawType: "center" },
                        { label: "Line crossing edge-to-edge", wins: 1, drawType: "diameter" }
                    ]
                },
                {
                    metric: "Differentiate Curves",
                    catA: "Open Curve", catB: "Closed Curve",
                    variants: [
                        { label: "Unsealed loop hook", wins: 0, drawType: "open" },
                        { label: "Perfect sealed ring", wins: 1, drawType: "closed" }
                    ]
                },
                {
                    metric: "Solid Shape Properties",
                    catA: "Has 6 Flat Faces", catB: "Has 0 Flat Faces",
                    variants: [
                        { label: "3D Square Cube Block", wins: 0, drawType: "cube" },
                        { label: "Solid Abyssal Sphere", wins: 1, drawType: "sphere" }
                    ]
                }
            ];

            const group = curriculumPool[Math.floor(Math.random() * curriculumPool.length)];
            const chosenVariant = group.variants[Math.floor(Math.random() * group.variants.length)];

            currentTargetCategoryA = group.catA;
            currentTargetCategoryB = group.catB;
            expectedWinningDockIndex = chosenVariant.wins;

            document.getElementById('lbl-task-text').innerText = `${group.metric}`;

            // Initialize the floating target shape dropping into center screen
            activeTargetShape = {
                x: canvasElement.width / 2,
                y: -10,
                label: chosenVariant.label,
                drawType: chosenVariant.drawType,
                fallVelocity: 1.8 + Math.random() * 1.0
            };
        }

        function runCanvasGameLoop() {
            if (!isEngineRunning) return;
            updateFramePhysics();
            renderFrameGraphics();
            animationFrameHandle = requestAnimationFrame(runCanvasGameLoop);
        }

        function updateFramePhysics() {
            if (!activeTargetShape) return;

            // Increment gravity descent tracking
            activeTargetShape.y += activeTargetShape.fallVelocity;

            // Bottom capture baseline check
            if (activeTargetShape.y >= canvasElement.height - 75) {
                // Determine whether the user correctly matched categories with active sorting platform dock location
                if (activeCollectorDockIndex === expectedWinningDockIndex) {
                    playAudioFile('s-correct');
                    currentScore++;
                    document.getElementById('lbl-score').innerText = `${currentScore} Sorted`;
                } else {
                    playAudioFile('s-wrong');
                    systemErrors++;
                    document.getElementById('lbl-errors').innerText = `${systemErrors}/3`;
                }

                if (systemErrors >= maxAllowedErrors) {
                    isEngineRunning = false;
                    renderGameOverScreen();
                } else {
                    generateNextSpatialPuzzle();
                }
            }
        }

        function renderFrameGraphics() {
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw technical structural reference grid layout
            canvasContext.strokeStyle = '#0f172a';
            canvasContext.lineWidth = 1;
            for (let i = 0; i < canvasElement.width; i += 40) {
                canvasContext.beginPath(); canvasContext.moveTo(i, 0); canvasContext.lineTo(i, canvasElement.height); canvasContext.stroke();
            }
            for (let j = 0; j < canvasElement.height; j += 40) {
                canvasContext.beginPath(); canvasContext.moveTo(0, j); canvasContext.lineTo(canvasElement.width, j); canvasContext.stroke();
            }

            // Draw Static Docking Zones at bottom floor
            let dockY = canvasElement.height - 60;
            let dockWidth = canvasElement.width / 2 - 20;

            // Left Sorting Target Dock
            canvasContext.fillStyle = activeCollectorDockIndex === 0 ? '#1e293b' : '#020617';
            canvasContext.strokeStyle = activeCollectorDockIndex === 0 ? '#38bdf8' : '#334155';
            canvasContext.lineWidth = 2;
            canvasContext.beginPath();
            canvasContext.roundRect(10, dockY, dockWidth, 45, 6);
            canvasContext.fill(); canvasContext.stroke();

            // Right Sorting Target Dock
            canvasContext.fillStyle = activeCollectorDockIndex === 1 ? '#1e293b' : '#020617';
            canvasContext.strokeStyle = activeCollectorDockIndex === 1 ? '#38bdf8' : '#334155';
            canvasContext.beginPath();
            canvasContext.roundRect(canvasElement.width / 2 + 10, dockY, dockWidth, 45, 6);
            canvasContext.fill(); canvasContext.stroke();

            // Label text targets inside static docking zone boxes
            canvasContext.fillStyle = activeCollectorDockIndex === 0 ? '#38bdf8' : '#94a3b8';
            canvasContext.font = '11px monospace';
            canvasContext.textAlign = 'center';
            canvasContext.fillText(currentTargetCategoryA, 10 + dockWidth/2, dockY + 26);

            canvasContext.fillStyle = activeCollectorDockIndex === 1 ? '#38bdf8' : '#94a3b8';
            canvasContext.fillText(currentTargetCategoryB, canvasElement.width / 2 + 10 + dockWidth/2, dockY + 26);

            // Draw falling target geometry structure inside the cosmic spatial zone
            if (activeTargetShape) {
                canvasContext.save();
                canvasContext.translate(activeTargetShape.x, activeTargetShape.y);

                // Draw geometric preview vector based on current task requirement mapping
                canvasContext.strokeStyle = '#ffffff';
                canvasContext.lineWidth = 2.5;

                switch(activeTargetShape.drawType) {
                    case "straight":
                        canvasContext.beginPath(); canvasContext.moveTo(-20, 0); canvasContext.lineTo(20, 0); canvasContext.stroke();
                        break;
                    case "curved":
                        canvasContext.beginPath(); canvasContext.arc(0, 0, 16, 0, Math.PI, false); canvasContext.stroke();
                        break;
                    case "center":
                        canvasContext.beginPath(); canvasContext.arc(0, 0, 18, 0, Math.PI*2); canvasContext.stroke();
                        canvasContext.fillStyle = '#38bdf8';
                        canvasContext.beginPath(); canvasContext.arc(0, 0, 4, 0, Math.PI*2); canvasContext.fill();
                        break;
                    case "diameter":
                        canvasContext.beginPath(); canvasContext.arc(0, 0, 18, 0, Math.PI*2); canvasContext.stroke();
                        canvasContext.strokeStyle = '#94a3b8';
                        canvasContext.beginPath(); canvasContext.moveTo(-18, 0); canvasContext.lineTo(18, 0); canvasContext.stroke();
                        break;
                    case "open":
                        canvasContext.beginPath(); canvasContext.arc(0, -4, 14, 0, Math.PI * 1.5, false); canvasContext.stroke();
                        break;
                    case "closed":
                        canvasContext.beginPath(); canvasContext.arc(0, 0, 15, 0, Math.PI*2); canvasContext.stroke();
                        break;
                    case "cube":
                        canvasContext.strokeRect(-14, -14, 28, 28);
                        canvasContext.strokeStyle = 'rgba(255,255,255,0.4)';
                        canvasContext.strokeRect(-8, -8, 28, 28);
                        break;
                    case "sphere":
                        canvasContext.beginPath(); canvasContext.arc(0, 0, 18, 0, Math.PI*2); canvasContext.stroke();
                        canvasContext.beginPath(); canvasContext.ellipse(0, 0, 18, 6, 0, 0, Math.PI*2); canvasContext.stroke();
                        break;
                }

                // Append the clear item descriptor label string
                canvasContext.fillStyle = '#ffffff';
                canvasContext.font = '12px monospace';
                canvasContext.textAlign = 'center';
                canvasContext.fillText(activeTargetShape.label, 0, 42);

                canvasContext.restore();
            }
        }

        function attachSteeringControls() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') activeCollectorDockIndex = 0;
                if (e.key === 'ArrowRight') activeCollectorDockIndex = 1;
            });

            const leftBtn = document.getElementById('btn-left-press');
            const rightBtn = document.getElementById('btn-right-press');

            if (leftBtn && rightBtn) {
                leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); activeCollectorDockIndex = 0; });
                rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); activeCollectorDockIndex = 1; });
                leftBtn.addEventListener('mousedown', () => activeCollectorDockIndex = 0);
                rightBtn.addEventListener('mousedown', () => activeCollectorDockIndex = 1);
            }
        }

        function renderGameOverScreen() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="blueprint-panel" style="border-color: #ef4444;">
                    <h1 style="color:#ef4444; font-size:1.2rem; margin-bottom:10px; letter-spacing:1px;">CALIBRATION COMPLETED</h1>
                    <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:20px;">
                        Successfully Processed: <span style="color:#ffffff; font-weight:bold;">${currentScore} Geometries</span>
                    </p>
                    <button class="btn-action" onclick="renderMenuScreen()">Restart Matrix</button>
                </div>
            `;
        }

        function playAudioFile(id) {
            try {
                const sound = document.getElementById(id);
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            } catch (err) {}
        }
    </script>
</body>
</html>
