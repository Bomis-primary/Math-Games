<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos Diamond Rush</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c081c;
            color: #ffffff;
            overflow: hidden;
        }
        
        #viewport-root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
        }

        .rush-panel {
            background: linear-gradient(145deg, #18113c, #0e0a24);
            border: 2px solid #00f5d4;
            border-radius: 20px;
            padding: 35px 20px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 245, 212, 0.2);
        }
        .btn-mine {
            background: #00f5d4;
            color: #0c081c;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 245, 212, 0.4);
            margin-top: 20px;
            text-transform: uppercase;
        }

        .game-layout {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1rem;
            color: #00f5d4;
            padding: 5px 0;
        }

        .mission-panel {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
        }
        .mission-tag {
            font-size: 0.75rem;
            color: #9d4edd;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .mission-text {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
        }

        /* Cave Mining Grid Frame */
        .cave-frame {
            width: 100%;
            background: #060410;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            flex-grow: 1;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Deck controls */
        .deck-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            height: 55px;
            gap: 8px;
        }
        .deck-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .move-btn { width: 25%; }
        .fire-btn { width: 50%; background: rgba(0, 245, 212, 0.15); border-color: #00f5d4; color: #00f5d4; font-size: 1rem; text-transform: uppercase; }
        .deck-btn:active { background: #00f5d4; color: #060410; }

        /* Managed Launch Cover Panel */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }
        .splash-logo {
            width: 240px;
            max-width: 60%;
            height: auto;
            margin-bottom: 28px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <audio id="s-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="s-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="s-win" src="assets/freesound_community-claps-44774.mp3" preload="auto"></preload>

    <div id="hard-splash">
        <img src="assets/logo.png" class="splash-logo" alt="Innovine Solutions" onerror="this.style.display='none'">
        <div style="width: 200px; height: 8px; background-color: #e2e8f0; border-radius: 20px; overflow: hidden;">
            <div id="loader-progress-fill" style="width: 0%; height: 100%; background-color: #22c55e; border-radius: 20px; transition: width 0.05s linear;"></div>
        </div>
    </div>

    <div id="viewport-root"></div>

    <script>
        let currentScore = 0;
        let livesLeft = 3;
        
        let canvasElement = null;
        let canvasContext = null;
        let animationFrameHandle = null;

        // Harpoon Miner Coordinates
        let minerShipX = 200;
        const minerShipWidth = 60;
        const minerShipHeight = 24;
        let horizontalMovementMode = 0; // -1 = Left, 1 = Right, 0 = Still

        // Diamond Crystals and Harpoon Hooks Arrays
        let activeHarpoonsList = [];
        let crystalDiamondsList = [];
        
        let targetQuestionText = "";
        let expectedCorrectAnswer = "";
        let isEngineRunning = false;
        let inputKeysState = {};

        // Regulated 5-Second (5000ms) Timeline Engine Sequence
        let progressVal = 0;
        const loaderIntervalMs = 50; 
        const totalDurationMs = 5000;
        const stepsCount = totalDurationMs / loaderIntervalMs;
        const percentagePerStep = 100 / stepsCount;

        const progressTicker = setInterval(() => {
            progressVal += percentagePerStep;
            const element = document.getElementById('loader-progress-fill');
            if (element) element.style.width = Math.min(progressVal, 100) + '%';

            if (progressVal >= 100) {
                clearInterval(progressTicker);
                purgeSplashAndBuildMenu();
            }
        }, loaderIntervalMs);

        function purgeSplashAndBuildMenu() {
            const splashMask = document.getElementById('hard-splash');
            if (splashMask) {
                splashMask.style.opacity = '0';
                setTimeout(() => {
                    if (splashMask.parentNode) splashMask.parentNode.removeChild(splashMask);
                    renderMenuScreen();
                }, 500);
            } else {
                renderMenuScreen();
            }
        }

        function renderMenuScreen() {
            isEngineRunning = false;
            if (animationFrameHandle) cancelAnimationFrame(animationFrameHandle);
            
            document.getElementById('viewport-root').innerHTML = `
                <div class="rush-panel">
                    <h1 style="color:#00f5d4; font-size:1.8rem; margin-bottom:12px;">CHRONOS DIAMOND RUSH</h1>
                    <p style="color:#a29dbd; font-size:0.9rem; line-height:1.6; text-align:left; margin-bottom:20px;">
                        Welcome to the time caves! Read the calendar or clock objective prompt at the top, position your mining wagon below the matching diamond value, and shoot your grappling hook to harvest it!
                    </p>
                    <div style="color:#9d4edd; font-size:0.85rem; margin-bottom:20px; font-weight:bold;">
                        ⌨️ Key Controls: Arrow Keys to slide | Spacebar to Fire Hook
                    </div>
                    <button class="btn-mine" onclick="initiateGameEngine()">START RUSH</button>
                </div>
            `;
        }

        function triggerSoundEffect(elementId) {
            try {
                const aud = document.getElementById(elementId);
                if (aud) {
                    aud.currentTime = 0;
                    aud.play().catch(() => {});
                }
            } catch(e) {}
        }

        function initiateGameEngine() {
            currentScore = 0;
            livesLeft = 3;
            crystalDiamondsList = [];
            activeHarpoonsList = [];
            isEngineRunning = true;

            buildGameLayoutDOM();
            generateNextChronosQuestion();
            runCanvasGameLoop();
            attachSteeringControls();
        }

        function buildGameLayoutDOM() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="game-layout">
                    <div class="hud-row">
                        <div>SCORE: <span id="lbl-score">0</span></div>
                        <div>LIVES: <span id="lbl-lives">❤️❤️❤️</span></div>
                    </div>

                    <div class="mission-panel">
                        <div class="mission-tag" id="lbl-task-tag">TIME TARGET LOCK</div>
                        <div class="mission-text" id="lbl-task-text">LOADING...</div>
                    </div>

                    <div class="cave-frame">
                        <canvas id="rush-canvas" width="440" height="420"></canvas>
                    </div>

                    <div class="deck-controls">
                        <div class="deck-btn move-btn" id="btn-left-press">◀</div>
                        <div class="deck-btn fire-btn" id="btn-fire-press">SHOOT HOOK</div>
                        <div class="deck-btn move-btn" id="btn-right-press">▶</div>
                    </div>
                </div>
            `;

            canvasElement = document.getElementById('rush-canvas');
            canvasContext = canvasElement.getContext('2d');
            minerShipX = (canvasElement.width / 2) - (minerShipWidth / 2);
        }

        function generateNextChronosQuestion() {
            const curriculumPool = [
                { tag: "24-Hour Clock conversion", q: "Convert 05:00 PM to 24h", a: "17:00", w: ["05:00", "23:00", "15:00"] },
                { tag: "24-Hour Clock conversion", q: "Convert 10:30 PM to 24h", a: "22:30", w: ["10:30", "20:30", "12:30"] },
                { tag: "Unit Conversion Mapping", q: "Minutes in 2 Hours 15 Mins", a: "135m", w: ["120m", "155m", "95m"] },
                { tag: "Unit Conversion Mapping", q: "Seconds inside 3 Minutes", a: "180s", w: ["120s", "240s", "300s"] },
                { tag: "Elapsed Interval Space", q: "Minutes elapsed from 04:15 to 05:00", a: "45m", w: ["15m", "60m", "30m"] },
                { tag: "Elapsed Interval Space", q: "Hours elapsed from 08:00 AM to 01:00 PM", a: "5h", w: ["4h", "6h", "7h"] }
            ];

            const activeChoice = curriculumPool[Math.floor(Math.random() * curriculumPool.length)];
            targetQuestionText = activeChoice.q;
            expectedCorrectAnswer = activeChoice.a;

            document.getElementById('lbl-task-tag').innerText = activeChoice.tag;
            document.getElementById('lbl-task-text').innerText = targetQuestionText;
            
            spawnDiamondClusters(activeChoice.w);
        }

        function spawnDiamondClusters(wrongPool) {
            crystalDiamondsList = [];
            const segments = 3;
            const segmentWidth = canvasElement.width / segments;
            
            const winColumn = Math.floor(Math.random() * segments);
            let incorrectAnswers = [...wrongPool].sort(() => Math.random() - 0.5);

            for (let i = 0; i < segments; i++) {
                let answerText = "";
                let correctFlag = false;

                if (i === winColumn) {
                    answerText = expectedCorrectAnswer;
                    correctFlag = true;
                } else {
                    answerText = incorrectAnswers.pop() || "60m";
                }

                crystalDiamondsList.push({
                    x: (i * segmentWidth) + (segmentWidth / 2),
                    y: 60 + Math.random() * 40,
                    text: answerText,
                    isCorrect: correctFlag,
                    radius: 28
                });
            }
        }

        function triggerHarpoonDeployment() {
            if (!isEngineRunning || activeHarpoonsList.length > 0) return;
            
            activeHarpoonsList.push({
                x: minerShipX + (minerShipWidth / 2),
                y: canvasElement.height - minerShipHeight - 5,
                speedY: -7
            });
        }

        function runCanvasGameLoop() {
            if (!isEngineRunning) return;

            // Handle Input/Movement States
            if (inputKeysState['ArrowLeft']) {
                minerShipX -= 5;
            }
            if (inputKeysState['ArrowRight']) {
                minerShipX += 5;
            }
            if (horizontalMovementMode === -1) {
                minerShipX -= 4;
            }
            if (horizontalMovementMode === 1) {
                minerShipX += 4;
            }

            // Wall Constraints
            if (minerShipX < 0) minerShipX = 0;
            if (minerShipX > canvasElement.width - minerShipWidth) {
                minerShipX = canvasElement.width - minerShipWidth;
            }

            // Clear Screen Frame
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw Connection Cable Links if hook is in flight
            if (activeHarpoonsList.length > 0) {
                canvasContext.beginPath();
                canvasContext.strokeStyle = "rgba(0, 245, 212, 0.4)";
                canvasContext.lineWidth = 2;
                canvasContext.moveTo(minerShipX + (minerShipWidth / 2), canvasElement.height - minerShipHeight);
                canvasContext.lineTo(activeHarpoonsList[0].x, activeHarpoonsList[0].y);
                canvasContext.stroke();
            }

            // Render Target Floating Crystals
            crystalDiamondsList.forEach((gem) => {
                canvasContext.beginPath();
                canvasContext.fillStyle = "#18113c";
                canvasContext.strokeStyle = "#9d4edd";
                canvasContext.lineWidth = 3;
                
                // Draw Diamond Shape
                canvasContext.moveTo(gem.x, gem.y - gem.radius);
                canvasContext.lineTo(gem.x + gem.radius, gem.y);
                canvasContext.lineTo(gem.x, gem.y + gem.radius);
                canvasContext.lineTo(gem.x - gem.radius, gem.y);
                canvasContext.closePath();
                canvasContext.fill();
                canvasContext.stroke();

                // Typography labels inside crystals
                canvasContext.fillStyle = "#ffffff";
                canvasContext.font = "bold 13px sans-serif";
                canvasContext.textAlign = "center";
                canvasContext.textBaseline = "middle";
                canvasContext.fillText(gem.text, gem.x, gem.y);
            });

            // Update & Draw Harpoon Projectiles
            for (let h = activeHarpoonsList.length - 1; h >= 0; h--) {
                let hook = activeHarpoonsList[h];
                hook.y += hook.speedY;

                // Render Sharp Laser Tip
                canvasContext.beginPath();
                canvasContext.fillStyle = "#00f5d4";
                canvasContext.arc(hook.x, hook.y, 6, 0, Math.PI * 2);
                canvasContext.fill();

                // Out of Bounds Deflection
                if (hook.y < 0) {
                    activeHarpoonsList.splice(h, 1);
                    continue;
                }

                // Mathematical Collision Calculations
                for (let d = 0; d < crystalDiamondsList.length; d++) {
                    let crystal = crystalDiamondsList[d];
                    let dist = Math.hypot(hook.x - crystal.x, hook.y - crystal.y);

                    if (dist < crystal.radius + 6) {
                        activeHarpoonsList.splice(h, 1);
                        evaluateUserSelection(crystal.isCorrect);
                        break;
                    }
                }
            }

            // Draw Bottom Wagon Frame
            canvasContext.fillStyle = "#00f5d4";
            canvasContext.lineJoin = "round";
            canvasContext.fillRect(minerShipX, canvasElement.height - minerShipHeight - 6, minerShipWidth, minerShipHeight);
            
            // Core Cabin Plate Accent
            canvasContext.fillStyle = "#0c081c";
            canvasContext.fillRect(minerShipX + 12, canvasElement.height - minerShipHeight, minerShipWidth - 24, minerShipHeight - 8);

            animationFrameHandle = requestAnimationFrame(runCanvasGameLoop);
        }

        function evaluateUserSelection(isCorrect) {
            if (isCorrect) {
                currentScore += 10;
                document.getElementById('lbl-score').innerText = currentScore;
                triggerSoundEffect('s-correct');
                
                if (currentScore >= 50) {
                    executeVictoryScreen();
                } else {
                    generateNextChronosQuestion();
                }
            } else {
                livesLeft--;
                let liveHearts = "";
                for(let i=0; i<3; i++) {
                    liveHearts += (i < livesLeft) ? "❤️" : "🖤";
                }
                document.getElementById('lbl-lives').innerText = liveHearts;
                triggerSoundEffect('s-wrong');

                if (livesLeft <= 0) {
                    executeGameOverScreen();
                } else {
                    generateNextChronosQuestion();
                }
            }
        }

        function executeVictoryScreen() {
            isEngineRunning = false;
            triggerSoundEffect('s-win');
            document.getElementById('viewport-root').innerHTML = `
                <div class="rush-panel" style="border-color: #22c55e; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);">
                    <h1 style="color:#22c55e; font-size: 2rem; margin-bottom: 12px;">🏆 CAVE CLEARED!</h1>
                    <p style="color:#ffffff; margin-bottom: 20px; font-size:1.05rem;">Chronos Mainframe Chronology Synced Successfully!</p>
                    <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 25px; color: #00f5d4;">FINAL SCORE: ${currentScore} PTS</div>
                    <button class="btn-mine" style="background:#22c55e;" onclick="renderMenuScreen()">Return To Menu</button>
                </div>
            `;
        }

        function executeGameOverScreen() {
            isEngineRunning = false;
            document.getElementById('viewport-root').innerHTML = `
                <div class="rush-panel" style="border-color: #ef4444; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);">
                    <h1 style="color:#ef4444; font-size: 2rem; margin-bottom: 12px;">⚡ CRITICAL FAILURE</h1>
                    <p style="color:#ffffff; margin-bottom: 20px; font-size:1.05rem;">Wagon integrity depleted in the cave timelines.</p>
                    <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 25px; color: #ef4444;">SCORE UNLOCKED: ${currentScore} PTS</div>
                    <button class="btn-mine" style="background:#ef4444; color:#fff;" onclick="renderMenuScreen()">Try Again</button>
                </div>
            `;
        }

        function attachSteeringControls() {
            // Desktop Keyboard Mapping Hookups
            window.addEventListener('keydown', (e) => {
                if(['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                }
                inputKeysState[e.key] = true;
                if (e.key === ' ') {
                    triggerHarpoonDeployment();
                }
            });

            window.addEventListener('keyup', (e) => {
                inputKeysState[e.key] = false;
            });

            // Mobile/Touch Control Node Registrations
            const lBtn = document.getElementById('btn-left-press');
            const rBtn = document.getElementById('btn-right-press');
            const fBtn = document.getElementById('btn-fire-press');

            if (lBtn && rBtn && fBtn) {
                // Left Navigation Handlers
                lBtn.addEventListener('touchstart', (e) => { e.preventDefault(); horizontalMovementMode = -1; });
                lBtn.addEventListener('touchend', (e) => { e.preventDefault(); horizontalMovementMode = 0; });
                lBtn.addEventListener('mousedown', () => { horizontalMovementMode = -1; });
                lBtn.addEventListener('mouseup', () => { horizontalMovementMode = 0; });
                lBtn.addEventListener('mouseleave', () => { horizontalMovementMode = 0; });

                // Right Navigation Handlers
                rBtn.addEventListener('touchstart', (e) => { e.preventDefault(); horizontalMovementMode = 1; });
                rBtn.addEventListener('touchend', (e) => { e.preventDefault(); horizontalMovementMode = 0; });
                rBtn.addEventListener('mousedown', () => { horizontalMovementMode = 1; });
                rBtn.addEventListener('mouseup', () => { horizontalMovementMode = 0; });
                rBtn.addEventListener('mouseleave', () => { horizontalMovementMode = 0; });

                // Harpoon Launch Action Handlers
                fBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerHarpoonDeployment(); });
                fBtn.addEventListener('mousedown', () => { triggerHarpoonDeployment(); });
            }
        }
    </script>
</body>
</html>
