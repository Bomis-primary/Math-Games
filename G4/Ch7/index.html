<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Spatial Vortex</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #060514;
            color: #ffffff;
            overflow: hidden;
        }
        
        #viewport-root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 35px 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .btn-launch {
            background: linear-gradient(135deg, #00bbf9, #ff007f);
            color: #ffffff;
            border: none;
            padding: 14px 40px;
            font-size: 1.15rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 187, 249, 0.3);
            text-transform: uppercase;
        }

        .arena-grid {
            width: 100%;
            max-width: 650px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .hud-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.1rem;
            color: #00bbf9;
            font-weight: bold;
            padding: 10px 0;
        }
        
        .vortex-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 20px;
            flex-grow: 1;
            position: relative;
        }
        .vortex-basket {
            width: 46%;
            height: 85%;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
            line-height: 1.4;
        }
        .basket-left {
            border-color: #00f5d4;
            color: #00f5d4;
            background: rgba(0, 245, 212, 0.02);
        }
        .basket-right {
            border-color: #ff007f;
            color: #ff007f;
            background: rgba(255, 0, 127, 0.02);
        }
        
        .basket-hover-left {
            background: rgba(0, 245, 212, 0.15) !important;
            transform: scale(1.03);
        }
        .basket-hover-right {
            background: rgba(255, 0, 127, 0.15) !important;
            transform: scale(1.03);
        }

        .spawn-deck {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
        }
        .draggable-token {
            width: 135px;
            height: 135px;
            background: #141226;
            border: 3px solid #00bbf9;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            box-shadow: 0 8px 25px rgba(0, 187, 249, 0.4);
            touch-action: none;
            padding: 8px;
        }
        .draggable-token:active {
            cursor: grabbing;
        }
        canvas {
            background: transparent;
            pointer-events: none;
        }
        .text-question-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.4;
        }

        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
    </style>
</head>
<body>

    <audio id="s-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="s-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="s-win" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div id="hard-splash">
        <img src="assets/logo.png" style="max-width:240px; margin-bottom:20px;" id="splash-logo">
        <h1 id="fb-text" style="display:none; font-size:2.4rem; margin-bottom:15px; letter-spacing:1px;">INNOVINE</h1>
        <div style="width:200px; height:6px; background-color:#e2e8f0; border-radius:3px; overflow:hidden;">
            <div id="loader-progress-fill" style="width:0%; height:100%; background-color:#00f5d4;"></div>
        </div>
    </div>

    <div id="viewport-root"></div>

    <script>
        let scoreCounter = 0;
        const scoreLimit = 10;
        
        let puzzleDeckPool = [];
        let deckPointer = 0;
        let activePuzzle = null;
        
        let isDragging = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let elementStartX = 0;
        let elementStartY = 0;

        // Custom Dataset centered on lines, simple 3D properties, and visual grid counting 
        const masterPuzzleDatabase = [
            // --- Circles, Lines, Curves ---
            { displayType: "CANVAS", renderKey: "concentric", labelLeft: "CONCENTRIC\nCIRCLES", labelRight: "INTERSECTING\nCIRCLES", correctSide: "LEFT" },
            { displayType: "CANVAS", renderKey: "intersect_circles", labelLeft: "CONCENTRIC\nCIRCLES", labelRight: "INTERSECTING\nCIRCLES", correctSide: "RIGHT" },
            { displayType: "CANVAS", renderKey: "diameter", labelLeft: "RADIUS", labelRight: "DIAMETER", correctSide: "RIGHT" },
            { displayType: "CANVAS", renderKey: "semicircle", labelLeft: "SEMICIRCLE", labelRight: "CIRCLE", correctSide: "LEFT" },
            { displayType: "CANVAS", renderKey: "open_curve", labelLeft: "OPEN\nCURVE", labelRight: "CLOSED\nCURVE", correctSide: "LEFT" },
            { displayType: "CANVAS", renderKey: "closed_curve", labelLeft: "OPEN\nCURVE", labelRight: "CLOSED\nCURVE", correctSide: "RIGHT" },
            { displayType: "CANVAS", renderKey: "line_segment", labelLeft: "STRAIGHT\nLINE", labelRight: "LINE\nSEGMENT", correctSide: "RIGHT" },
            
            // --- Basic 3D Shape Properties & Nets ---
            { displayType: "TEXT", text: "A solid shape with\n6 square faces", labelLeft: "CUBE", labelRight: "CYLINDER", correctSide: "LEFT" },
            { displayType: "TEXT", text: "A solid shape with\n5 faces and\n1 square base", labelLeft: "PRISM", labelRight: "SQUARE\nPYRAMID", correctSide: "RIGHT" },
            { displayType: "CANVAS", renderKey: "cube_net", labelLeft: "CUBE NET", labelRight: "CONE NET", correctSide: "LEFT" },
            
            // --- Visual Grid Area & Perimeter Questions ---
            { displayType: "CANVAS", renderKey: "grid_area_9", labelLeft: "9 SQUARE\nUNITS", labelRight: "12 SQUARE\nUNITS", correctSide: "LEFT" },
            { displayType: "CANVAS", renderKey: "grid_area_8", labelLeft: "6 SQUARE\nUNITS", labelRight: "8 SQUARE\nUNITS", correctSide: "RIGHT" },
            { displayType: "CANVAS", renderKey: "grid_perimeter_12", labelLeft: "12 UNITS\n(OUTSIDE)", labelRight: "16 UNITS\n(OUTSIDE)", correctSide: "LEFT" },
            { displayType: "CANVAS", renderKey: "grid_perimeter_10", labelLeft: "8 UNITS\n(OUTSIDE)", labelRight: "10 UNITS\n(OUTSIDE)", correctSide: "RIGHT" }
        ];

        document.getElementById('splash-logo').onerror = function() {
            this.style.display = 'none';
            document.getElementById('fb-text').style.display = 'block';
        };

        let progressVal = 0;
        const progressTicker = setInterval(() => {
            progressVal += 5;
            const element = document.getElementById('loader-progress-fill');
            if (element) element.style.width = progressVal + '%';

            if (progressVal >= 100) {
                clearInterval(progressTicker);
                purgeSplashAndBuildMenu();
            }
        }, 35);

        function purgeSplashAndBuildMenu() {
            const splashMask = document.getElementById('hard-splash');
            if (splashMask && splashMask.parentNode) {
                splashMask.parentNode.removeChild(splashMask);
            }
            renderMenuScreen();
        }

        function renderMenuScreen() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="dashboard-card">
                    <h1 style="color:#00f5d4; font-size:1.8rem; margin-bottom:12px;">Spatial Vortex</h1>
                    <p style="color:#b2b2cc; font-size:0.95rem; line-height:1.6; text-align:left; margin-bottom:25px;">
                        Look at the item inside the center card. Count the grid units or identify the shapes, then drag left or right to sort!
                    </p>
                    <button class="btn-launch" onclick="initiateGameEngine()">START GAME</button>
                </div>
            `;
        }

        function initiateGameEngine() {
            scoreCounter = 0;
            puzzleDeckPool = [...masterPuzzleDatabase].sort(() => Math.random() - 0.5);
            deckPointer = 0;
            
            renderGameBoard();
            generateNextPuzzleWave();
        }

        function renderGameBoard() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="arena-grid">
                    <div class="hud-header">
                        <div>Score Tracker: <span id="label-score">0</span> / ${scoreLimit}</div>
                        <div>Geometry and Spatial Shapes</div>
                    </div>
                    
                    <div class="vortex-container">
                        <div class="vortex-basket basket-left" id="v-left">
                            <span style="font-size:0.7rem; letter-spacing:1px; opacity:0.5; margin-bottom:8px;">VORTEX A</span>
                            <div id="text-left-basket">-</div>
                        </div>
                        
                        <div class="spawn-deck" id="spawn-deck">
                            <div class="draggable-token" id="drag-token">
                                </div>
                        </div>
                        
                        <div class="vortex-basket basket-right" id="v-right">
                            <span style="font-size:0.7rem; letter-spacing:1px; opacity:0.5; margin-bottom:8px;">VORTEX B</span>
                            <div id="text-right-basket">-</div>
                        </div>
                    </div>
                </div>
            `;
            setupDragAndDropListeners();
        }

        function generateNextPuzzleWave() {
            const token = document.getElementById('drag-token');
            if (token) {
                token.style.transform = 'translate(0px, 0px)';
                token.style.borderColor = '#00bbf9';
            }

            if (deckPointer >= puzzleDeckPool.length) {
                puzzleDeckPool = [...masterPuzzleDatabase].sort(() => Math.random() - 0.5);
                deckPointer = 0;
            }

            activePuzzle = puzzleDeckPool[deckPointer];
            deckPointer++;

            document.getElementById('text-left-basket').innerText = activePuzzle.labelLeft;
            document.getElementById('text-right-basket').innerText = activePuzzle.labelRight;

            if (activePuzzle.displayType === "CANVAS") {
                token.innerHTML = `<canvas id="vector-canvas" width="115" height="115"></canvas>`;
                drawGeometricTokenGraphics(activePuzzle.renderKey);
            } else {
                token.innerHTML = `<div class="text-question-wrapper">${activePuzzle.text.replace(/\n/g, '<br>')}</div>`;
            }
        }

        // Helper function to render background grid meshes inside the canvas token
        function drawBackgroundGridMesh(ctx, size) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 115; i += size) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 115); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(115, i); ctx.stroke();
            }
        }

        function drawGeometricTokenGraphics(renderKey) {
            const canvas = document.getElementById('vector-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 115, 115);
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3.5;
            ctx.fillStyle = '#ff007f';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Catch Grid types first to overlay grid mesh lines underneath
            if (renderKey.startsWith("grid_")) {
                drawBackgroundGridMesh(ctx, 23); // 5x5 grid environment layout
            }

            switch (renderKey) {
                case "concentric":
                    ctx.beginPath(); ctx.arc(57, 57, 18, 0, Math.PI * 2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(57, 57, 38, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = '#00f5d4';
                    ctx.beginPath(); ctx.arc(57, 57, 4, 0, Math.PI * 2); ctx.fill();
                    break;
                    
                case "intersect_circles":
                    ctx.beginPath(); ctx.arc(40, 57, 24, 0, Math.PI * 2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(75, 57, 24, 0, Math.PI * 2); ctx.stroke();
                    break;
                    
                case "diameter":
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath(); ctx.arc(57, 57, 40, 0, Math.PI * 2); ctx.stroke();
                    ctx.strokeStyle = '#00f5d4';
                    ctx.beginPath(); ctx.moveTo(20, 75); ctx.lineTo(94, 39); ctx.stroke();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(57, 57, 4, 0, Math.PI * 2); ctx.fill();
                    break;
                    
                case "semicircle":
                    ctx.beginPath();
                    ctx.arc(57, 57, 35, 0, Math.PI, true);
                    ctx.closePath();
                    ctx.stroke();
                    break;
                    
                case "open_curve":
                    ctx.beginPath();
                    ctx.arc(57, 57, 32, 0.3, Math.PI * 1.65);
                    ctx.stroke();
                    break;
                    
                case "closed_curve":
                    ctx.beginPath();
                    ctx.ellipse(57, 57, 40, 25, Math.PI / 6, 0, Math.PI * 2);
                    ctx.stroke();
                    break;
                    
                case "line_segment":
                    ctx.beginPath(); ctx.moveTo(25, 57); ctx.lineTo(90, 57); ctx.stroke();
                    ctx.beginPath(); ctx.arc(25, 57, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(90, 57, 5, 0, Math.PI * 2); ctx.fill();
                    break;
                    
                case "cube_net":
                    const w = 18;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(57 - w/2, 57 - w*2, w, w);
                    ctx.strokeRect(57 - w/2, 57 - w, w, w);
                    ctx.strokeRect(57 - w/2, 57, w, w);
                    ctx.strokeRect(57 - w/2, 57 + w, w, w);
                    ctx.strokeRect(57 - w*1.5, 57 - w, w, w);
                    ctx.strokeRect(57 + w/2, 57 - w, w, w);
                    break;

                // --- Grid Configurations (Visual Counting Blocks) ---
                case "grid_area_9": // Count the filled boxes inside (3x3 Square block)
                    ctx.fillStyle = "rgba(0, 245, 212, 0.4)";
                    ctx.fillRect(23, 23, 23*3, 23*3);
                    ctx.strokeStyle = "#00f5d4";
                    ctx.strokeRect(23, 23, 23*3, 23*3);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "11px Arial";
                    ctx.fillText("Count Area", 28, 16);
                    break;

                case "grid_area_8": // Count the filled boxes inside (4x2 Rectangle block)
                    ctx.fillStyle = "rgba(0, 245, 212, 0.4)";
                    ctx.fillRect(23, 34, 23*4, 23*2);
                    ctx.strokeStyle = "#00f5d4";
                    ctx.strokeRect(23, 34, 23*4, 23*2);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "11px Arial";
                    ctx.fillText("Count Area", 28, 22);
                    break;

                case "grid_perimeter_12": // Count outer line segments (3x3 Square block outline)
                    ctx.strokeStyle = "#ff007f";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(23, 23, 23*3, 23*3);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "11px Arial";
                    ctx.fillText("Count Outside Edge", 10, 16);
                    break;

                case "grid_perimeter_10": // Count outer line segments (3x2 Rectangle block outline)
                    ctx.strokeStyle = "#ff007f";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(23, 34, 23*3, 23*2);
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "11px Arial";
                    ctx.fillText("Count Outside Edge", 10, 22);
                    break;
            }
        }

        function setupDragAndDropListeners() {
            const parentDeck = document.getElementById('spawn-deck');
            if (!parentDeck) return;

            parentDeck.addEventListener('mousedown', dragStart);
            parentDeck.addEventListener('touchstart', dragStart, { passive: false });

            window.addEventListener('mousemove', dragMove);
            window.addEventListener('touchmove', dragMove, { passive: false });

            window.addEventListener('mouseup', dragEnd);
            window.addEventListener('touchend', dragEnd);
        }

        function dragStart(e) {
            const token = document.getElementById('drag-token');
            if (!token) return;
            
            isDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            touchStartX = clientX;
            touchStartY = clientY;
            elementStartX = 0;
            elementStartY = 0;
        }

        function dragMove(e) {
            if (!isDragging) return;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (!clientX || !clientY) return;

            const deltaX = clientX - touchStartX;
            const deltaY = clientY - touchStartY;

            elementStartX = deltaX;
            elementStartY = deltaY;

            const token = document.getElementById('drag-token');
            if (token) {
                token.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
            }

            const leftBasket = document.getElementById('v-left');
            const rightBasket = document.getElementById('v-right');

            if (deltaX < -60) {
                leftBasket.classList.add('basket-hover-left');
                rightBasket.classList.remove('basket-hover-right');
            } else if (deltaX > 60) {
                rightBasket.classList.add('basket-hover-right');
                leftBasket.classList.remove('basket-hover-left');
            } else {
                leftBasket.classList.remove('basket-hover-left');
                rightBasket.classList.remove('basket-hover-right');
            }
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;

            document.getElementById('v-left').classList.remove('basket-hover-left');
            document.getElementById('v-right').classList.remove('basket-hover-right');

            if (elementStartX < -75) {
                evaluatePlacementChoice("LEFT");
            } else if (elementStartX > 75) {
                evaluatePlacementChoice("RIGHT");
            } else {
                const token = document.getElementById('drag-token');
                if (token) token.style.transform = 'translate(0px, 0px)';
            }
        }

        function evaluatePlacementChoice(chosenSide) {
            if (chosenSide === activePuzzle.correctSide) {
                scoreCounter++;
                document.getElementById('label-score').innerText = scoreCounter;
                playAudioFile('s-correct');

                if (scoreCounter >= scoreLimit) {
                    playAudioFile('s-win');
                    renderWinScreen();
                } else {
                    generateNextPuzzleWave();
                }
            } else {
                playAudioFile('s-wrong');
                const token = document.getElementById('drag-token');
                if (token) token.style.borderColor = '#ef4444';
                
                setTimeout(() => {
                    generateNextPuzzleWave();
                }, 400);
            }
        }

        function renderWinScreen() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="dashboard-card" style="border-color: rgba(0, 255, 127, 0.3);">
                    <div style="font-size:3.5rem; margin-bottom:10px;">🏆</div>
                    <h1 style="color:#00f5d4; font-size:1.8rem; margin-bottom:10px;">Great Job!</h1>
                    <p style="color:#cfdec9; font-size:0.95rem; margin-bottom:25px; line-height:1.5;">
                        You have successfully sorted the matching lines, curves, 3D shape properties, and grid spaces!
                    </p>
                    <button class="btn-launch" style="background:linear-gradient(135deg, #00f5d4, #7f00ff);" onclick="renderMenuScreen()">Play Again</button>
                </div>
            `;
        }

        function playAudioFile(id) {
            try {
                const sound = document.getElementById(id);
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            } catch (err) {}
        }
    </script>
</body>
</html>
