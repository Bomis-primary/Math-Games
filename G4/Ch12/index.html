<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vault Master: Grade 4 Pattern Verification</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 740px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: relative;
        }

        /* Minimal White Splash Screen */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        
        .splash-content-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        .splash-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .splash-img {
            max-width: 75%;
            height: auto;
            object-fit: contain;
        }

        /* Grade 4 Instructional Modal Layer */
        #instruction-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.98);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 16px;
        }
        .ins-box {
            background: #1e1b4b;
            border: 3px solid #db2777;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(219, 39, 119, 0.25);
            text-align: left;
            width: 100%;
        }
        .ins-header-badge {
            background: #db2777;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .ins-title {
            font-size: 1.4rem;
            color: #fdf2f8;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .ins-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .lab-display {
            background: #111827;
            border: 2px solid #374151;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .control-panel {
            background: #1e1e38;
            border: 2px solid #4f46e5;
            border-radius: 10px;
            padding: 10px;
        }
        .ticker-title {
            font-size: 0.75rem;
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .ticker-problem {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 4px;
            line-height: 1.4;
        }

        .simulation-frame {
            flex-grow: 1;
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            min-height: 260px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .console-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        .option-row-btn {
            width: 100%;
            background: #111827;
            border: 2px solid #374151;
            color: #e5e7eb;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .option-row-btn:active {
            background: #374151;
        }
        .option-row-btn.selected {
            background: #db2777;
            border-color: #f472b6;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(219, 39, 119, 0.4);
        }

        .action-dispatch-btn {
            width: 100%;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .status-banner {
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            min-height: 22px;
        }
    </style>
</head>
<body>

    <div id="hard-splash">
        <div class="splash-content-wrapper">
            <div class="splash-logo-container">
                <img src="assets/logo.png" class="splash-img" alt="Innovine Solutions">
            </div>
        </div>
    </div>

    <div id="viewport-root">
        
        <div id="instruction-modal">
            <div class="ins-box">
                <span class="ins-header-badge">Grade 4 Mathematics</span>
                <h2 class="ins-title">Patterns & Symmetry Quiz</h2>
                <p class="ins-text">
                    Test your pattern detective skills! Find missing line-symmetry shapes, finish multiplying and adding sequences, and break down secret math codes to level up.
                </p>
                <button class="action-dispatch-btn" onclick="dismissInstructions()">Start Quiz</button>
            </div>
        </div>

        <div class="lab-display">
            <div class="control-panel">
                <div class="ticker-title" id="lbl-task-counter">Challenge 1 of 4</div>
                <div class="ticker-problem" id="lbl-question-text">Analyzing grid setup...</div>
            </div>
        </div>

        <div class="simulation-frame">
            <canvas id="diagnostic-canvas"></canvas>
        </div>

        <div class="status-banner" id="lbl-status-toast" style="color: #94a3b8;">Choose the missing part to solve the puzzle.</div>

        <div class="console-grid">
            <button class="option-row-btn" id="opt-0" onclick="selectEvaluationOption(0)">Option A</button>
            <button class="option-row-btn" id="opt-1" onclick="selectEvaluationOption(1)">Option B</button>
            <button class="option-row-btn" id="opt-2" onclick="selectEvaluationOption(2)">Option C</button>
        </div>

        <button class="action-dispatch-btn" id="btn-submit" onclick="verifyDiagnosticAnswer()">Submit Answer</button>
    </div>

    <script>
        let canvasElement = null;
        let canvasContext = null;
        let audioCtx = null;

        let currentTaskIndex = 0;
        let selectedOptionIndex = -1;
        let activeChallengeData = null;
        let challengePool = [];

        let feedbackAnimationTimer = 0;
        let feedbackAnimationType = 'none';

        // 5-Second Splash Ticker Sequence
        let timeElapsed = 0;
        const totalDuration = 5000; 
        const tickInterval = 100;
        
        const progressTicker = setInterval(() => {
            timeElapsed += tickInterval;
            if (timeElapsed >= totalDuration) {
                clearInterval(progressTicker);
                const splash = document.getElementById('hard-splash');
                const mainApp = document.getElementById('viewport-root');
                if (splash) splash.style.opacity = '0';
                setTimeout(() => {
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    if (mainApp) mainApp.style.opacity = '1';
                    initDiagnosticSystem();
                }, 500);
            }
        }, tickInterval);

        function initDiagnosticSystem() {
            canvasElement = document.getElementById('diagnostic-canvas');
            canvasContext = canvasElement.getContext('2d');
            
            recalculateCanvasDimensions();
            populateChallengePool();
            loadCurrentTask();
            runRenderLoop();
        }

        function dismissInstructions() {
            const modal = document.getElementById('instruction-modal');
            if (modal && modal.parentNode) modal.parentNode.removeChild(modal);
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function recalculateCanvasDimensions() {
            const rect = canvasElement.getBoundingClientRect();
            canvasElement.width = rect.width;
            canvasElement.height = rect.height;
        }

        function populateChallengePool() {
            // Grade 4 appropriate structural questions
            challengePool = [
                {
                    type: 'reflective_grid',
                    text: "Find the cell that makes a mirror reflection across the pink line. Which block is missing?",
                    options: ["Row 2, Column 6", "Row 2, Column 5", "Row 3, Column 6"],
                    correctIdx: 0,
                    renderData: { points: [{r: 1, c: 1}], missingReflection: {r: 1, c: 6} }
                },
                {
                    type: 'number_pattern',
                    text: "Follow the multiplication skip pattern on the tiles: 4, 8, 12, 16, __. What number fits in the blank space?",
                    options: ["18 (Add 2)", "20 (Next multiple of 4)", "24 (Multiply by 2)"],
                    correctIdx: 1,
                    renderData: { sequence: [4, 8, 12, 16, '?'] }
                },
                {
                    type: 'pattern_contrast',
                    text: "Look at the pattern grid. If Row 1 adds +3 each step, and Row 2 multiplies by ×2 each step, what is the next value for Row 2 [ 2, 4, 8, __ ]?",
                    options: ["10", "12", "16"],
                    correctIdx: 2,
                    renderData: { sequence: [2, 4, 8, '?'] }
                },
                {
                    type: 'code_decryption',
                    text: "Crack the grid code system! If block code A = 4, B = 8, and C = 12 (Skip-counting by 4), what letters match the code numbers '12 - 4 - 8'?",
                    options: ["C - A - B", "C - B - A", "B - A - C"],
                    correctIdx: 0,
                    renderData: { cipherHint: "Rule: Count by 4s" }
                }
            ];
        }

        function loadCurrentTask() {
            if (currentTaskIndex >= challengePool.length) {
                displayFinalAssessmentResult();
                return;
            }

            activeChallengeData = challengePool[currentTaskIndex];
            document.getElementById('lbl-task-counter').innerText = `Challenge ${currentTaskIndex + 1} of ${challengePool.length}`;
            document.getElementById('lbl-question-text').innerText = activeChallengeData.text;

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerText = activeChallengeData.options[i];
                btn.classList.remove('selected');
            }

            selectedOptionIndex = -1;
            feedbackAnimationTimer = 0;
            feedbackAnimationType = 'none';
            document.getElementById('lbl-status-toast').innerText = "Look closely at the screen layout to solve it!";
            document.getElementById('lbl-status-toast').style.color = "#94a3b8";
            document.getElementById('btn-submit').disabled = false;
        }

        function selectEvaluationOption(idx) {
            selectedOptionIndex = idx;
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (i === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            }
        }

        function verifyDiagnosticAnswer() {
            if (selectedOptionIndex === -1) {
                document.getElementById('lbl-status-toast').innerText = "⚠️ Please tap one option to answer!";
                document.getElementById('lbl-status-toast').style.color = "#f59e0b";
                return;
            }

            document.getElementById('btn-submit').disabled = true;

            if (selectedOptionIndex === activeChallengeData.correctIdx) {
                feedbackAnimationType = 'correct';
                feedbackAnimationTimer = 35;
                document.getElementById('lbl-status-toast').innerText = "Great job! That is completely correct!";
                document.getElementById('lbl-status-toast').style.color = "#34d399";
                playFeedbackTone(523.25, 659.25); // C5 to E5 positive major interval chord
            } else {
                feedbackAnimationType = 'error';
                feedbackAnimationTimer = 35;
                document.getElementById('lbl-status-toast').innerText = "Not quite. Check the pattern rules and try again.";
                document.getElementById('lbl-status-toast').style.color = "#f87171";
                playFeedbackTone(293.66, 220.00); // Negative low interval drop
            }
        }

        function advanceAssessmentRound() {
            if (feedbackAnimationType === 'correct') {
                currentTaskIndex++;
            }
            loadCurrentTask();
        }

        function displayFinalAssessmentResult() {
            document.getElementById('lbl-task-counter').innerText = "Level Completed!";
            document.getElementById('lbl-question-text').innerText = "Awesome! You passed the Grade 4 Symmetry and Patterns Check!";
            document.getElementById('lbl-status-toast').innerText = "You are ready for Level 2 Custom Sandbox Mode!";
            document.getElementById('lbl-status-toast').style.color = "#f472b6";
            
            for (let i = 0; i < 3; i++) {
                document.getElementById(`opt-${i}`).style.display = 'none';
            }
            const submitBtn = document.getElementById('btn-submit');
            submitBtn.innerText = "Play Quiz Again";
            submitBtn.disabled = false;
            submitBtn.onclick = () => { location.reload(); };
        }

        function runRenderLoop() {
            renderAssessmentGraphics();
            if (feedbackAnimationTimer > 0) {
                feedbackAnimationTimer--;
                if (feedbackAnimationTimer === 0) {
                    advanceAssessmentRound();
                }
            }
            requestAnimationFrame(runRenderLoop);
        }

        function renderAssessmentGraphics() {
            if (!canvasContext || !activeChallengeData) return;
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            const w = canvasElement.width;
            const h = canvasElement.height;

            if (activeChallengeData.type === 'reflective_grid') {
                const rows = 8, cols = 8;
                const cellW = w / cols;
                const cellH = h / rows;

                // Simple 8x8 Grid Layout
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        canvasContext.strokeStyle = '#374151';
                        canvasContext.lineWidth = 1;
                        canvasContext.strokeRect(c * cellW, r * cellH, cellW, cellH);
                    }
                }

                // Left hand starting block
                canvasContext.fillStyle = '#60a5fa';
                activeChallengeData.renderData.points.forEach(pt => {
                    canvasContext.fillRect(pt.c * cellW + 4, pt.r * cellH + 4, cellW - 8, cellH - 8);
                });

                // Question mark box on right side mirror node
                canvasContext.fillStyle = 'rgba(219, 39, 119, 0.2)';
                const mRef = activeChallengeData.renderData.missingReflection;
                canvasContext.fillRect(mRef.c * cellW + 2, mRef.r * cellH + 2, cellW - 4, cellH - 4);
                
                canvasContext.fillStyle = '#f472b6';
                canvasContext.font = 'bold 14px sans-serif';
                canvasContext.fillText("?", mRef.c * cellW + (cellW/2) - 4, mRef.r * cellH + (cellH/2) + 5);

                // Central Reflective Line
                canvasContext.strokeStyle = '#db2777';
                canvasContext.lineWidth = 3;
                canvasContext.beginPath();
                canvasContext.moveTo(w / 2, 0);
                canvasContext.lineTo(w / 2, h);
                canvasContext.stroke();
            } 
            else if (activeChallengeData.type === 'number_pattern' || activeChallengeData.type === 'pattern_contrast') {
                // Number Track rendering
                canvasContext.fillStyle = '#111827';
                canvasContext.fillRect(20, h/2 - 40, w - 40, 80);
                canvasContext.strokeStyle = '#4f46e5';
                canvasContext.lineWidth = 2;
                canvasContext.strokeRect(20, h/2 - 40, w - 40, 80);

                canvasContext.fillStyle = '#ffffff';
                canvasContext.font = 'bold 22px monospace';
                canvasContext.textAlign = 'center';
                let seqStr = activeChallengeData.renderData.sequence.join(" , ");
                canvasContext.fillText(seqStr, w / 2, h / 2 + 8);
                canvasContext.textAlign = 'left';
            }
            else if (activeChallengeData.type === 'code_decryption') {
                canvasContext.fillStyle = '#111827';
                canvasContext.fillRect(20, 20, w - 40, h - 40);
                canvasContext.strokeStyle = '#374151';
                canvasContext.strokeRect(20, 20, w - 40, h - 40);

                canvasContext.fillStyle = '#fbbf24';
                canvasContext.font = 'bold 16px sans-serif';
                canvasContext.fillText("Decoder Core Rulebook:", 40, 55);
                
                canvasContext.fillStyle = '#e2e8f0';
                canvasContext.font = '14px monospace';
                canvasContext.fillText("Block A = 4", 40, 95);
                canvasContext.fillText("Block B = 8", 40, 125);
                canvasContext.fillText("Block C = 12", 40, 155);
                
                canvasContext.fillStyle = '#a7f3d0';
                canvasContext.font = 'bold 18px monospace';
                canvasContext.fillText("Find Code: 12 - 4 - 8", 40, h - 45);
            }

            // Quick feedback color overlay
            if (feedbackAnimationTimer > 0) {
                canvasContext.fillStyle = feedbackAnimationType === 'correct' ? 'rgba(52, 211, 153, 0.2)' : 'rgba(248, 113, 113, 0.2)';
                canvasContext.fillRect(0, 0, w, h);
            }
        }

        function playFeedbackTone(f1, f2) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f1, now);
                osc.frequency.setValueAtTime(f2, now + 0.1);
                
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                
                osc.start(now);
                osc.stop(now + 0.3);
            } catch(e) {}
        }
    </script>
</body>
</html>
