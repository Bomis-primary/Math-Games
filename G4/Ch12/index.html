<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patterns & Symmetry Lab</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #070b12;
            color: #f1f5f9;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 740px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: relative;
        }

        /* Plain White Splash Screen */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .splash-content-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }
        .splash-img {
            max-width: 70%;
            height: auto;
            object-fit: contain;
        }

        /* Mode Selector Tabs */
        .level-switcher {
            display: flex;
            background: #111827;
            border: 2px solid #374151;
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }
        .mode-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            color: #94a3b8;
            border: none;
            transition: all 0.2s ease;
        }
        .mode-tab.active {
            background: #db2777;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(219, 39, 119, 0.3);
        }

        /* Panel Visibility Rules */
        .panel {
            display: none;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .panel.active {
            display: flex;
        }

        /* Instruction Header Card */
        .lab-display {
            background: #111827;
            border: 2px solid #374151;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .control-panel {
            background: #1e1e38;
            border: 2px solid #4f46e5;
            border-radius: 10px;
            padding: 10px 14px;
        }
        .ticker-title {
            font-size: 0.7rem;
            color: #818cf8;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
        }
        .ticker-problem {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 2px;
            line-height: 1.4;
        }

        /* Simulation Canvas Containers */
        .simulation-frame {
            flex-grow: 1;
            min-height: 260px;
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Choice Selectors for Quiz (L1) */
        .console-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-row-btn {
            width: 100%;
            background: #111827;
            border: 2px solid #374151;
            color: #e5e7eb;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .option-row-btn.selected {
            background: #db2777;
            border-color: #f472b6;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(219, 39, 119, 0.3);
        }

        /* Control Action Shelves */
        .sandbox-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #111827;
            padding: 12px;
            border-radius: 14px;
            border: 2px solid #374151;
        }
        .tool-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .tool-btn {
            flex: 1;
            background: #374151;
            border: 1px solid #4b5563;
            color: #f1f5f9;
            padding: 10px 4px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }
        .tool-btn.active-mode {
            background: #7c3aed;
            border-color: #a78bfa;
            color: #ffffff;
        }

        /* Footer Submit Triggers */
        .action-dispatch-btn {
            width: 100%;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
        }
        .action-dispatch-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            box-shadow: none;
        }
        .status-banner {
            text-align: center;
            font-weight: 700;
            font-size: 0.8rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- Minimal White Splash Screen -->
    <div id="hard-splash">
        <div class="splash-content-wrapper">
            <div class="splash-logo-container">
                <img src="assets/logo.png" class="splash-img" alt="Innovine Solutions">
            </div>
        </div>
    </div>

    <div id="viewport-root">
        
        <!-- Mode Switcher Header Navigation -->
        <div class="level-switcher">
            <button class="mode-tab active" id="tab-l1" onclick="switchLevelMode(1)">Level 1: Verification Test</button>
            <button class="mode-tab" id="tab-l2" onclick="switchLevelMode(2)">Level 2: Creative Sandbox</button>
        </div>

        <!-- ================= LEVEL 1 PANEL ================= -->
        <div id="panel-l1" class="panel active">
            <div class="lab-display">
                <div class="control-panel">
                    <div class="ticker-title" id="lbl-task-counter">Challenge 1 of 4</div>
                    <div class="ticker-problem" id="lbl-question-text">Loading verification task logs...</div>
                </div>
            </div>
            <div class="simulation-frame">
                <canvas id="l1-canvas"></canvas>
            </div>
            <div class="status-banner" id="lbl-status-toast" style="color: #94a3b8;">Analyze the grid setup and make a choice.</div>
            <div class="console-grid">
                <button class="option-row-btn" id="opt-0" onclick="selectL1Option(0)">Option A</button>
                <button class="option-row-btn" id="opt-1" onclick="selectL1Option(1)">Option B</button>
                <button class="option-row-btn" id="opt-2" onclick="selectL1Option(2)">Option C</button>
            </div>
            <button class="action-dispatch-btn" id="btn-submit-l1" onclick="verifyL1Answer()">Verify Pattern Code</button>
        </div>

        <!-- ================= LEVEL 2 PANEL ================= -->
        <div id="panel-l2" class="panel">
            <div class="lab-display">
                <div class="control-panel">
                    <div class="ticker-title">Symmetry Tile Grid</div>
                    <div class="ticker-problem">Select a axis matrix mode below, then tap any tile to watch the canvas reflect your creation instantly!</div>
                </div>
            </div>

            <div class="simulation-frame">
                <canvas id="l2-canvas"></canvas>
            </div>

            <!-- Simplified Grid Controllers -->
            <div class="sandbox-controls">
                <div class="tool-row">
                    <button class="tool-btn active-mode" id="sym-vertical" onclick="setSymmetryAxis('vertical')">Vertical ↔</button>
                    <button class="tool-btn" id="sym-horizontal" onclick="setSymmetryAxis('horizontal')">Horizontal ↕</button>
                    <button class="tool-btn" id="sym-quad" onclick="setSymmetryAxis('quad')">4-Way ✛</button>
                </div>
                <div class="tool-row">
                    <button class="tool-btn" style="background:#475569; border-color:#64748b;" onclick="clearSandboxCanvas()">Clear All Tiles</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Audio Context Engine
        let audioCtx = null;
        let activeLevel = 1;

        // Level 1 Parameters
        let l1Canvas, l1Ctx;
        let currentL1Task = 0;
        let selectedL1Opt = -1;
        let challengePool = [];
        let l1AnimationTimer = 0;
        let l1AnimationType = 'none';

        // Level 2 Parameters
        let l2Canvas, l2Ctx;
        const gridCols = 12; 
        const gridRows = 10;
        let activeGridMap = []; 
        let symmetryAxisMode = 'vertical'; // 'vertical', 'horizontal', 'quad'

        // Standard 5-Second Splash Screen Clock Ticker
        let splashElapsed = 0;
        const splashInterval = 100;
        const splashTicker = setInterval(() => {
            splashElapsed += splashInterval;
            if (splashElapsed >= 5000) {
                clearInterval(splashTicker);
                const splash = document.getElementById('hard-splash');
                const mainApp = document.getElementById('viewport-root');
                if (splash) splash.style.opacity = '0';
                setTimeout(() => {
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    if (mainApp) mainApp.style.opacity = '1';
                    initLabApplicationSuite();
                }, 500);
            }
        }, splashInterval);

        function initLabApplicationSuite() {
            l1Canvas = document.getElementById('l1-canvas');
            l1Ctx = l1Canvas.getContext('2d');
            l2Canvas = document.getElementById('l2-canvas');
            l2Ctx = l2Canvas.getContext('2d');

            recalculateCanvasResolutions();
            resetGridMapData();
            buildL1QuestionPool();
            loadL1Task();
            initSandboxTileClickHandlers();

            // Core Game Rendering Animation Loop
            function coreAppTick() {
                renderL1Graphics();
                renderL2TileGrid();
                if (l1AnimationTimer > 0) {
                    l1AnimationTimer--;
                    if (l1AnimationTimer === 0) advanceL1Round();
                }
                requestAnimationFrame(coreAppTick);
            }
            requestAnimationFrame(coreAppTick);
        }

        function resetGridMapData() {
            activeGridMap = [];
            for (let r = 0; r < gridRows; r++) {
                activeGridMap.push(new Array(gridCols).fill(false));
            }
        }

        function recalculateCanvasResolutions() {
            [l1Canvas, l2Canvas].forEach(c => {
                const rect = c.parentNode.getBoundingClientRect();
                c.width = rect.width;
                c.height = rect.height;
            });
        }

        function switchLevelMode(lvl) {
            activeLevel = lvl;
            document.getElementById('tab-l1').classList.toggle('active', lvl === 1);
            document.getElementById('tab-l2').classList.toggle('active', lvl === 2);
            document.getElementById('panel-l1').classList.toggle('active', lvl === 1);
            document.getElementById('panel-l2').classList.toggle('active', lvl === 2);
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            setTimeout(recalculateCanvasResolutions, 50);
        }

        // ================= LEVEL 1 SYSTEM ENGINES =================
        function buildL1QuestionPool() {
            challengePool = [
                {
                    type: 'mirror_art',
                    text: "Mirror Symmetry: Look at the left half of the folder layout. Which shape reflects perfectly across the mirror fold to match a 'd'?",
                    options: ["The Letter 'b'", "The Letter 'p'", "The Letter 'q'"],
                    correctIdx: 0
                },
                {
                    type: 'skip_count',
                    text: "Numerical Patterns: Analyze this skip sequence progression block: 3, 6, 12, 24, __. What number completes the code rule?",
                    options: ["30 (Adds 6)", "48 (Multiplies previous number by 2)", "36 (Adds 12)"],
                    correctIdx: 1
                },
                {
                    type: 'number_tower',
                    text: "Number Tower Check: Two brick blocks next to each other add up to create the parent value directly above. If bricks are 3 and 5, what is above?",
                    options: ["2", "15", "8"],
                    correctIdx: 2
                },
                {
                    type: 'word_code',
                    text: "Secret substitution codes: If the color 'Red' is encoded as 'Green', and 'Green' is encoded as 'Yellow', what color matches a ripe tomato?",
                    options: ["Green", "Yellow", "Red"],
                    correctIdx: 0
                }
            ];
        }

        function loadL1Task() {
            if (currentL1Task >= challengePool.length) {
                showL1SuiteCompletion();
                return;
            }
            const task = challengePool[currentL1Task];
            document.getElementById('lbl-task-counter').innerText = `Challenge ${currentL1Task + 1} of ${challengePool.length}`;
            document.getElementById('lbl-question-text').innerText = task.text;

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerText = task.options[i];
                btn.classList.remove('selected');
            }
            selectedL1Opt = -1;
            l1AnimationTimer = 0;
            l1AnimationType = 'none';
            document.getElementById('lbl-status-toast').innerText = "Analyze the pattern context and pick your response.";
            document.getElementById('lbl-status-toast').style.color = "#94a3b8";
            document.getElementById('btn-submit-l1').disabled = false;
        }

        function selectL1Option(idx) {
            selectedL1Opt = idx;
            for (let i = 0; i < 3; i++) {
                document.getElementById(`opt-${i}`).classList.toggle('selected', i === idx);
            }
        }

        function verifyL1Answer() {
            if (selectedL1Opt === -1) {
                document.getElementById('lbl-status-toast').innerText = "⚠️ Select an answer choice first!";
                document.getElementById('lbl-status-toast').style.color = "#fbbf24";
                return;
            }
            document.getElementById('btn-submit-l1').disabled = true;
            if (selectedL1Opt === challengePool[currentL1Task].correctIdx) {
                l1AnimationType = 'correct';
                l1AnimationTimer = 35;
                document.getElementById('lbl-status-toast').innerText = "✓ Pattern verified successfully!";
                document.getElementById('lbl-status-toast').style.color = "#34d399";
                triggerToneOutput(523.25, 659.25);
            } else {
                l1AnimationType = 'error';
                l1AnimationTimer = 35;
                document.getElementById('lbl-status-toast').innerText = "❌ Symmetry verification failed. Try alternative code.";
                document.getElementById('lbl-status-toast').style.color = "#f87171";
                triggerToneOutput(220, 180);
            }
        }

        function advanceL1Round() {
            if (l1AnimationType === 'correct') currentL1Task++;
            loadL1Task();
        }

        function showL1SuiteCompletion() {
            document.getElementById('lbl-task-counter').innerText = "Verification Complete";
            document.getElementById('lbl-question-text').innerText = "Amazing! You verified all pattern parameters and cracked Chapter 12 successfully.";
            document.getElementById('lbl-status-toast').innerText = "Level 1 Verified! Click Level 2 tab above to unleash creative mode.";
            document.getElementById('lbl-status-toast').style.color = "#f472b6";
            for (let i = 0; i < 3; i++) document.getElementById(`opt-${i}`).style.display = 'none';
            const sub = document.getElementById('btn-submit-l1');
            sub.innerText = "Restart Assessment Suite";
            sub.disabled = false;
            sub.onclick = () => { location.reload(); };
        }

        function renderL1Graphics() {
            if (!l1Ctx) return;
            const w = l1Canvas.width, h = l1Canvas.height;
            l1Ctx.clearRect(0, 0, w, h);
            const task = challengePool[currentL1Task];
            if (!task) return;

            if (task.type === 'mirror_art') {
                l1Ctx.strokeStyle = '#db2777';
                l1Ctx.lineWidth = 3;
                l1Ctx.beginPath(); l1Ctx.moveTo(w/2, 20); l1Ctx.lineTo(w/2, h-20); l1Ctx.stroke();
                
                l1Ctx.fillStyle = '#60a5fa'; l1Ctx.font = 'bold 75px monospace';
                l1Ctx.fillText("b", w/4 - 25, h/2 + 25);
                l1Ctx.fillStyle = '#db2777';
                l1Ctx.fillText("d", (w*3/4) - 25, h/2 + 25);
            } else if (task.type === 'skip_count') {
                let sequenceData = [3, 6, 12, 24, "?"];
                let step = w / 6;
                sequenceData.forEach((val, i) => {
                    l1Ctx.fillStyle = val === "?" ? "#db2777" : "#374151";
                    l1Ctx.fillRect(i*step + 12, h/2 - 25, step - 8, 50);
                    l1Ctx.fillStyle = "#ffffff";
                    l1Ctx.font = "bold 18px monospace";
                    l1Ctx.fillText(val, i*step + step/3, h/2 + 7);
                });
            } else if (task.type === 'number_tower') {
                let bw = 65, bh = 35;
                let cx = w/2;
                l1Ctx.fillStyle = '#f59e0b';
                l1Ctx.fillRect(cx - bw/2, h/2 - bh, bw, bh);
                l1Ctx.fillRect(cx - bw - 2, h/2, bw, bh);
                l1Ctx.fillRect(cx + 2, h/2, bw, bh);
                
                l1Ctx.fillStyle = '#0f172a'; l1Ctx.font = 'bold 15px sans-serif';
                l1Ctx.fillText("?", cx - 5, h/2 - bh/3);
                l1Ctx.fillText("3", cx - bw/2 - 5, h/2 + bh*2/3);
                l1Ctx.fillText("5", cx + bw/2 - 5, h/2 + bh*2/3);
            } else {
                l1Ctx.fillStyle = "#111827"; l1Ctx.fillRect(20, 30, w-40, h-60);
                l1Ctx.fillStyle = "#fbbf24"; l1Ctx.font = "bold 16px monospace";
                l1Ctx.fillText("Cipher Matrix Match:", 40, 70);
                l1Ctx.fillStyle = "#e2e8f0"; l1Ctx.font = "15px sans-serif";
                l1Ctx.fillText("Target: RIPE TOMATO", 40, 110);
                l1Ctx.fillText("Code Key: Red → Green", 40, 140);
            }

            if (l1AnimationTimer > 0) {
                l1Ctx.fillStyle = l1AnimationType === 'correct' ? 'rgba(52, 211, 153, 0.25)' : 'rgba(248, 113, 113, 0.25)';
                l1Ctx.fillRect(0, 0, w, h);
            }
        }

        // ================= LEVEL 2 SYSTEM ENGINES =================
        function setSymmetryAxis(mode) {
            symmetryAxisMode = mode;
            document.getElementById('sym-vertical').classList.toggle('active-mode', mode === 'vertical');
            document.getElementById('sym-horizontal').classList.toggle('active-mode', mode === 'horizontal');
            document.getElementById('sym-quad').classList.toggle('active-mode', mode === 'quad');
            resetGridMapData(); // Clear slate when changing symmetry formulas
            if (audioCtx) triggerToneOutput(587.33, 0);
        }

        function initSandboxTileClickHandlers() {
            function processTileClick(clientX, clientY) {
                if (activeLevel !== 2) return;
                const rect = l2Canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const tileW = l2Canvas.width / gridCols;
                const tileH = l2Canvas.height / gridRows;

                const col = Math.floor(x / tileW);
                const row = Math.floor(y / tileH);

                if (row >= 0 && row < gridRows && col >= 0 && col < gridCols) {
                    const targetState = !activeGridMap[row][col];
                    
                    // Toggle targeted block
                    activeGridMap[row][col] = targetState;

                    // Compute complex reflections depending on requested math rules
                    if (symmetryAxisMode === 'vertical' || symmetryAxisMode === 'quad') {
                        const mirrorCol = (gridCols - 1) - col;
                        activeGridMap[row][mirrorCol] = targetState;
                    }
                    if (symmetryAxisMode === 'horizontal' || symmetryAxisMode === 'quad') {
                        const mirrorRow = (gridRows - 1) - row;
                        activeGridMap[mirrorRow][col] = targetState;
                    }
                    if (symmetryAxisMode === 'quad') {
                        const mirrorCol = (gridCols - 1) - col;
                        const mirrorRow = (gridRows - 1) - row;
                        activeGridMap[mirrorRow][mirrorCol] = targetState;
                    }
                    
                    triggerToneOutput(400 + (row * 25), 0);
                }
            }

            l2Canvas.addEventListener('mousedown', (e) => {
                processTileClick(e.clientX, e.clientY);
            });

            l2Canvas.addEventListener('touchstart', (e) => {
                processTileClick(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
        }

        function clearSandboxCanvas() {
            resetGridMapData();
        }

        function renderL2TileGrid() {
            if (!l2Ctx || activeLevel !== 2) return;
            const w = l2Canvas.width, h = l2Canvas.height;
            l2Ctx.clearRect(0, 0, w, h);

            const tileW = w / gridCols;
            const tileH = h / gridRows;

            // Render interactive matrix cells
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    if (activeGridMap[r][c]) {
                        // Dynamically calculate cell fill themes depending on quad quadrant
                        if (symmetryAxisMode === 'vertical') {
                            l2Ctx.fillStyle = (c < gridCols / 2) ? '#38bdf8' : '#e11d48';
                        } else if (symmetryAxisMode === 'horizontal') {
                            l2Ctx.fillStyle = (r < gridRows / 2) ? '#38bdf8' : '#fbbf24';
                        } else { // Quad 4-Way Colors
                            if (c < gridCols / 2 && r < gridRows / 2) l2Ctx.fillStyle = '#38bdf8';
                            else if (c >= gridCols / 2 && r < gridRows / 2) l2Ctx.fillStyle = '#e11d48';
                            else if (c < gridCols / 2 && r >= gridRows / 2) l2Ctx.fillStyle = '#fbbf24';
                            else l2Ctx.fillStyle = '#34d399';
                        }
                    } else {
                        l2Ctx.fillStyle = '#1f2937';
                    }
                    
                    l2Ctx.fillRect(c * tileW + 1, r * tileH + 1, tileW - 2, tileH - 2);
                    
                    // Subtle cell border lines
                    l2Ctx.strokeStyle = '#374151';
                    l2Ctx.lineWidth = 1;
                    l2Ctx.strokeRect(c * tileW, r * tileH, tileW, tileH);
                }
            }

            // Draw axis line dividers
            if (symmetryAxisMode === 'vertical' || symmetryAxisMode === 'quad') {
                l2Ctx.strokeStyle = '#db2777';
                l2Ctx.lineWidth = 4;
                l2Ctx.beginPath(); l2Ctx.moveTo(w / 2, 0); l2Ctx.lineTo(w / 2, h); l2Ctx.stroke();
            }
            if (symmetryAxisMode === 'horizontal' || symmetryAxisMode === 'quad') {
                l2Ctx.strokeStyle = '#db2777';
                l2Ctx.lineWidth = 4;
                l2Ctx.beginPath(); l2Ctx.moveTo(0, h / 2); l2Ctx.lineTo(w, h / 2); l2Ctx.stroke();
            }
        }

        function triggerToneOutput(f1, f2) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const currentPlaybackTime = audioCtx.currentTime;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f1, currentPlaybackTime);
                if (f2) osc.frequency.setValueAtTime(f2, currentPlaybackTime + 0.1);
                gain.gain.setValueAtTime(0.08, currentPlaybackTime);
                gain.gain.exponentialRampToValueAtTime(0.01, currentPlaybackTime + 0.25);
                osc.start(currentPlaybackTime); osc.stop(currentPlaybackTime + 0.25);
            } catch(e) {}
        }
    </script>
</body>
</html>
