<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos Diamond Rush</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c081c;
            color: #ffffff;
            overflow: hidden;
        }
        
        #viewport-root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
        }

        .rush-panel {
            background: linear-gradient(145deg, #18113c, #0e0a24);
            border: 2px solid #00f5d4;
            border-radius: 20px;
            padding: 35px 20px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 245, 212, 0.2);
        }
        .btn-mine {
            background: #00f5d4;
            color: #0c081c;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 245, 212, 0.4);
            margin-top: 20px;
            text-transform: uppercase;
        }

        .game-layout {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #00f5d4;
            padding: 8px 4px;
        }

        .mission-panel {
            background: rgba(24, 17, 60, 0.85);
            border: 2px solid #9d4edd;
            border-radius: 14px;
            padding: 16px 12px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.2);
        }
        .mission-tag {
            font-size: 0.8rem;
            color: #c77dff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .mission-text {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.4;
        }

        /* Cave Grid Frame */
        .cave-frame {
            width: 100%;
            background: #060410;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            flex-grow: 1;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Deck controls */
        .deck-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            height: 55px;
            gap: 8px;
        }
        .deck-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .move-btn { width: 25%; }
        .fire-btn { width: 50%; background: rgba(0, 245, 212, 0.15); border-color: #00f5d4; color: #00f5d4; font-size: 1rem; text-transform: uppercase; }
        .deck-btn:active { background: #00f5d4; color: #060410; }

        /* Managed Launch Cover Panel */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }
        .splash-logo {
            width: 240px;
            max-width: 60%;
            height: auto;
            margin-bottom: 28px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <audio id="s-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="s-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="s-win" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div id="hard-splash">
        <img src="assets/logo.png" class="splash-logo" alt="Innovine Solutions" onerror="this.style.display='none'">
        <div style="width: 200px; height: 8px; background-color: #e2e8f0; border-radius: 20px; overflow: hidden;">
            <div id="loader-progress-fill" style="width: 0%; height: 100%; background-color: #22c55e; border-radius: 20px; transition: width 0.05s linear;"></div>
        </div>
    </div>

    <div id="viewport-root"></div>

    <script>
        let currentScore = 0;
        let livesLeft = 3;
        
        let canvasElement = null;
        let canvasContext = null;
        let animationFrameHandle = null;

        // Harpoon Wagon Coordinates
        let minerShipX = 200;
        const minerShipWidth = 60;
        const minerShipHeight = 24;
        let horizontalMovementMode = 0; 

        // Diamond Crystals and Hooks Arrays
        let activeHarpoonsList = [];
        let crystalDiamondsList = [];
        
        let targetQuestionText = "";
        let expectedCorrectAnswer = "";
        let isEngineRunning = false;
        let inputKeysState = {};

        // Two-chance state variables
        let currentQuestionAttempts = 0;
        let blockInputsTemporarily = false;
        let forceHighlightCorrect = false;

        // Calendar and Time Database Matching image_002dd7.png Outcomes
        let runtimeActivePool = [];
        let poolQuestionPointer = 0;

        const masterQuestionDatabase = [
            { tag: "24-Hour Format", q: "Convert 4:15 PM into 24-hour clock time:", a: "16:15", w: ["04:15", "14:15", "18:15"] },
            { tag: "24-Hour Format", q: "Convert 11:30 PM into 24-hour clock time:", a: "23:30", w: ["11:30", "13:30", "21:30"] },
            { tag: "12-Hour Format", q: "Convert 08:20 into standard 12-hour AM/PM format:", a: "8:20 AM", w: ["8:20 PM", "6:20 AM", "6:20 PM"] },
            { tag: "12-Hour Format", q: "Convert 17:45 into standard 12-hour AM/PM format:", a: "5:45 PM", w: ["7:45 PM", "5:45 AM", "17:45 PM"] },
            { tag: "24-Hour Format", q: "What 24-hour time represents midnight (12:00 AM)?", a: "00:00", w: ["12:00", "24:00", "06:00"] },
            { tag: "Unit Conversion", q: "How many minutes are there in exactly 2.5 hours?", a: "150 min", w: ["120 min", "180 min", "250 min"] },
            { tag: "Unit Conversion", q: "Convert 4 minutes directly into seconds:", a: "240 sec", w: ["180 sec", "400 sec", "300 sec"] },
            { tag: "Unit Conversion", q: "How many total hours are equal to 180 minutes?", a: "3 hours", w: ["2 hours", "4 hours", "1.8 hours"] },
            { tag: "Elapsed Time", q: "A film starts at 14:15 and ends at 16:30. How long was it?", a: "2h 15m", w: ["2h 30m", "1h 45m", "3h 15m"] },
            { tag: "Elapsed Time", q: "If a train departs at 09:10 and arrives at 11:45, find travel time:", a: "2h 35m", w: ["2h 45m", "3h 35m", "1h 55m"] },
            { tag: "Elapsed Time", q: "An event finishes at 1:15 PM. It ran for 45 minutes. When did it start?", a: "12:30 PM", w: ["12:45 PM", "1:00 PM", "12:15 PM"] },
            { tag: "Calendar Math", q: "If May 3rd is a Tuesday, what day of the week is May 10th?", a: "Tuesday", w: ["Wednesday", "Monday", "Thursday"] },
            { tag: "Story Problem", q: "A project takes 3 weeks and 4 days. How many total days is this?", a: "25 days", w: ["21 days", "24 days", "34 days"] },
            { tag: "Calendar Math", q: "How many days are in a regular calendar year (not a leap year)?", a: "365 days", w: ["366 days", "360 days", "355 days"] }
        ];

        // Regulated 5-Second Progress Bar
        let progressVal = 0;
        const loaderIntervalMs = 50; 
        const totalDurationMs = 5000;
        const stepsCount = totalDurationMs / loaderIntervalMs;
        const percentagePerStep = 100 / stepsCount;

        const progressTicker = setInterval(() => {
            progressVal += percentagePerStep;
            const element = document.getElementById('loader-progress-fill');
            if (element) element.style.width = Math.min(progressVal, 100) + '%';

            if (progressVal >= 100) {
                clearInterval(progressTicker);
                purgeSplashAndBuildMenu();
            }
        }, loaderIntervalMs);

        function purgeSplashAndBuildMenu() {
            const splashMask = document.getElementById('hard-splash');
            if (splashMask) {
                splashMask.style.opacity = '0';
                setTimeout(() => {
                    if (splashMask.parentNode) splashMask.parentNode.removeChild(splashMask);
                    renderMenuScreen();
                }, 500);
            } else {
                renderMenuScreen();
            }
        }

        function renderMenuScreen() {
            isEngineRunning = false;
            if (animationFrameHandle) cancelAnimationFrame(animationFrameHandle);
            
            document.getElementById('viewport-root').innerHTML = `
                <div class="rush-panel">
                    <h1 style="color:#00f5d4; font-size:1.6rem; margin-bottom:12px;">CHRONOS TIME RUSH</h1>
                    <p style="color:#a29dbd; font-size:0.95rem; line-height:1.6; text-align:left; margin-bottom:15px;">
                        Master your time and calendar objectives! Move your wagon under the correct target diamond and fire your hook.
                    </p>
                    <p style="color:#ff9e00; font-size:0.95rem; font-weight:bold; margin-bottom:20px;">
                        ⚠️ You have 2 chances per question! Missing twice reveals the right answer before moving on.
                    </p>
                    <div style="color:#9d4edd; font-size:0.85rem; margin-bottom:20px; font-weight:bold;">
                        ⌨️ Key Controls: Arrow Keys to slide | Spacebar to Fire Hook
                    </div>
                    <button class="btn-mine" onclick="initiateGameEngine()">START RUSH</button>
                </div>
            `;
        }

        function triggerSoundEffect(elementId) {
            try {
                const aud = document.getElementById(elementId);
                if (aud) {
                    aud.currentTime = 0;
                    aud.play().catch(() => {});
                }
            } catch(e) {}
        }

        function initiateGameEngine() {
            currentScore = 0;
            livesLeft = 3;
            crystalDiamondsList = [];
            activeHarpoonsList = [];
            blockInputsTemporarily = false;
            forceHighlightCorrect = false;
            
            runtimeActivePool = [...masterQuestionDatabase].sort(() => Math.random() - 0.5);
            poolQuestionPointer = 0;
            
            isEngineRunning = true;
            buildGameLayoutDOM();
            generateNextChronosQuestion();
            runCanvasGameLoop();
            attachSteeringControls();
        }

        function buildGameLayoutDOM() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="game-layout">
                    <div class="hud-row">
                        <div>SCORE: <span id="lbl-score" style="color:#ffffff;">0</span></div>
                        <div>LIVES: <span id="lbl-lives">❤️❤️❤️</span></div>
                    </div>

                    <div class="mission-panel">
                        <div class="mission-tag" id="lbl-task-tag">CHRONO UNIT TARGET</div>
                        <div class="mission-text" id="lbl-task-text">LOADING...</div>
                    </div>

                    <div class="cave-frame">
                        <canvas id="rush-canvas" width="440" height="420"></canvas>
                    </div>

                    <div class="deck-controls">
                        <div class="deck-btn move-btn" id="btn-left-press">◀</div>
                        <div class="deck-btn fire-btn" id="btn-fire-press">SHOOT HOOK</div>
                        <div class="deck-btn move-btn" id="btn-right-press">▶</div>
                    </div>
                </div>
            `;

            canvasElement = document.getElementById('rush-canvas');
            canvasContext = canvasElement.getContext('2d');
            minerShipX = (canvasElement.width / 2) - (minerShipWidth / 2);
        }

        function generateNextChronosQuestion() {
            currentQuestionAttempts = 0;
            blockInputsTemporarily = false;
            forceHighlightCorrect = false;

            if (poolQuestionPointer >= runtimeActivePool.length) {
                runtimeActivePool = [...masterQuestionDatabase].sort(() => Math.random() - 0.5);
                poolQuestionPointer = 0;
            }

            const activeChoice = runtimeActivePool[poolQuestionPointer];
            poolQuestionPointer++;

            targetQuestionText = activeChoice.q;
            expectedCorrectAnswer = activeChoice.a;

            document.getElementById('lbl-task-tag').innerText = activeChoice.tag;
            document.getElementById('lbl-task-text').innerText = targetQuestionText;
            
            spawnDiamondClusters(activeChoice.w);
        }

        function spawnDiamondClusters(wrongPool) {
            crystalDiamondsList = [];
            const segments = 3;
            const segmentWidth = canvasElement.width / segments;
            
            const winColumn = Math.floor(Math.random() * segments);
            let incorrectAnswers = [...wrongPool].sort(() => Math.random() - 0.5);

            for (let i = 0; i < segments; i++) {
                let answerText = "";
                let correctFlag = false;

                if (i === winColumn) {
                    answerText = expectedCorrectAnswer;
                    correctFlag = true;
                } else {
                    answerText = incorrectAnswers.pop() || "00:00";
                }

                crystalDiamondsList.push({
                    x: (i * segmentWidth) + (segmentWidth / 2),
                    y: 75 + Math.random() * 25, 
                    text: answerText,
                    isCorrect: correctFlag,
                    radius: 36,
                    isEliminated: false
                });
            }
        }

        function triggerHarpoonDeployment() {
            if (!isEngineRunning || activeHarpoonsList.length > 0 || blockInputsTemporarily) return;
            
            activeHarpoonsList.push({
                x: minerShipX + (minerShipWidth / 2),
                y: canvasElement.height - minerShipHeight - 5,
                speedY: -8
            });
        }

        function runCanvasGameLoop() {
            if (!isEngineRunning) return;

            // Compute Input Velocities
            if (!blockInputsTemporarily) {
                if (inputKeysState['ArrowLeft']) minerShipX -= 6;
                if (inputKeysState['ArrowRight']) minerShipX += 6;
                if (horizontalMovementMode === -1) minerShipX -= 5;
                if (horizontalMovementMode === 1) minerShipX += 5;
            }

            // Boundary Stops
            if (minerShipX < 0) minerShipX = 0;
            if (minerShipX > canvasElement.width - minerShipWidth) {
                minerShipX = canvasElement.width - minerShipWidth;
            }

            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw Tether Mechanical Wire
            if (activeHarpoonsList.length > 0) {
                canvasContext.beginPath();
                canvasContext.strokeStyle = "#00f5d4";
                canvasContext.lineWidth = 3;
                canvasContext.moveTo(minerShipX + (minerShipWidth / 2), canvasElement.height - minerShipHeight);
                canvasContext.lineTo(activeHarpoonsList[0].x, activeHarpoonsList[0].y);
                canvasContext.stroke();
            }

            // Draw Target Crystals
            crystalDiamondsList.forEach((gem) => {
                if (gem.isEliminated && !forceHighlightCorrect) return;

                canvasContext.beginPath();
                canvasContext.fillStyle = "#110935";
                
                // Determine border highlights dynamically based on current answer state
                if (forceHighlightCorrect) {
                    canvasContext.strokeStyle = gem.isCorrect ? "#22c55e" : "#ef4444";
                    canvasContext.lineWidth = gem.isCorrect ? 6 : 2;
                } else {
                    canvasContext.strokeStyle = gem.isCorrect ? "#00f5d4" : "#9d4edd";
                    canvasContext.lineWidth = 4;
                }
                
                // Construct Diamond Geometry Paths
                canvasContext.moveTo(gem.x, gem.y - gem.radius);
                canvasContext.lineTo(gem.x + (gem.radius + 6), gem.y); 
                canvasContext.lineTo(gem.x, gem.y + gem.radius);
                canvasContext.lineTo(gem.x - (gem.radius + 6), gem.y);
                canvasContext.closePath();
                canvasContext.fill();
                canvasContext.stroke();

                // Text Formatting
                canvasContext.fillStyle = (forceHighlightCorrect && !gem.isCorrect) ? "#64748b" : "#ffffff";
                canvasContext.font = "bold 13px sans-serif";
                canvasContext.textAlign = "center";
                canvasContext.textBaseline = "middle";
                
                canvasContext.shadowColor = "black";
                canvasContext.shadowBlur = 4;
                canvasContext.shadowOffsetX = 1;
                canvasContext.shadowOffsetY = 2;
                
                canvasContext.fillText(gem.text, gem.x, gem.y);
                
                canvasContext.shadowBlur = 0;
                canvasContext.shadowOffsetX = 0;
                canvasContext.shadowOffsetY = 0;
            });

            // Update Hook Movements
            for (let h = activeHarpoonsList.length - 1; h >= 0; h--) {
                let hook = activeHarpoonsList[h];
                hook.y += hook.speedY;

                canvasContext.beginPath();
                canvasContext.fillStyle = "#ff9e00";
                canvasContext.arc(hook.x, hook.y, 7, 0, Math.PI * 2);
                canvasContext.fill();

                if (hook.y < 0) {
                    activeHarpoonsList.splice(h, 1);
                    continue;
                }

                // Intersection Loop
                for (let d = 0; d < crystalDiamondsList.length; d++) {
                    let crystal = crystalDiamondsList[d];
                    if (crystal.isEliminated) continue;

                    let distanceVector = Math.hypot(hook.x - crystal.x, hook.y - crystal.y);

                    if (distanceVector < crystal.radius + 6) {
                        activeHarpoonsList.splice(h, 1);
                        evaluateUserSelection(crystal);
                        break;
                    }
                }
            }

            // Render Mining Wagon Shell
            canvasContext.fillStyle = blockInputsTemporarily ? "#64748b" : "#00f5d4";
            canvasContext.fillRect(minerShipX, canvasElement.height - minerShipHeight - 6, minerShipWidth, minerShipHeight);
            
            canvasContext.fillStyle = "#060410";
            canvasContext.fillRect(minerShipX + 12, canvasElement.height - minerShipHeight, minerShipWidth - 24, minerShipHeight - 6);

            animationFrameHandle = requestAnimationFrame(runCanvasGameLoop);
        }

        function evaluateUserSelection(selectedCrystal) {
            currentQuestionAttempts++;

            if (selectedCrystal.isCorrect) {
                // Correct Choice
                currentScore += 10;
                document.getElementById('lbl-score').innerText = currentScore;
                triggerSoundEffect('s-correct');
                
                blockInputsTemporarily = true;
                forceHighlightCorrect = true;

                setTimeout(() => {
                    if (currentScore >= 60) {
                        executeVictoryScreen();
                    } else {
                        generateNextChronosQuestion();
                    }
                }, 1200);

            } else {
                // Incorrect Choice
                selectedCrystal.isEliminated = true;
                triggerSoundEffect('s-wrong');

                if (currentQuestionAttempts === 1) {
                    // First failure: user gets another chance at the remaining items
                    document.getElementById('lbl-task-text').innerText = "❌ Try Again! " + targetQuestionText;
                } else {
                    // Second failure: out of chances for this question
                    livesLeft--;
                    let liveHearts = "";
                    for(let i=0; i<3; i++) {
                        liveHearts += (i < livesLeft) ? "❤️" : "🖤";
                    }
                    document.getElementById('lbl-lives').innerText = liveHearts;

                    blockInputsTemporarily = true;
                    forceHighlightCorrect = true; // Highlight the correct answer green on screen
                    document.getElementById('lbl-task-text').innerText = "The correct answer was: " + expectedCorrectAnswer;

                    setTimeout(() => {
                        if (livesLeft <= 0) {
                            executeGameOverScreen();
                        } else {
                            generateNextChronosQuestion();
                        }
                    }, 2500); // 2.5 seconds window so player can read the right answer
                }
            }
        }

        function executeVictoryScreen() {
            isEngineRunning = false;
            triggerSoundEffect('s-win');
            document.getElementById('viewport-root').innerHTML = `
                <div class="rush-panel" style="border-color: #22c55e; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);">
                    <h1 style="color:#22c55e; font-size: 2rem; margin-bottom: 12px;">🏆 MISSION COMPLETE</h1>
                    <p style="color:#ffffff; margin-bottom: 20px; font-size:1.05rem;">All chronological metrics mapped perfectly!</p>
                    <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 25px; color: #00f5d4;">FINAL SCORE: ${currentScore} PTS</div>
                    <button class="btn-mine" style="background:#22c55e;" onclick="renderMenuScreen()">Return To Menu</button>
                </div>
            `;
        }

        function executeGameOverScreen() {
            isEngineRunning = false;
            document.getElementById('viewport-root').innerHTML = `
                <div class="rush-panel" style="border-color: #ef4444; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);">
                    <h1 style="color:#ef4444; font-size: 2rem; margin-bottom: 12px;">⚡ TIME UP!</h1>
                    <p style="color:#ffffff; margin-bottom: 20px; font-size:1.05rem;">Wagon timeline integrity fully depleted.</p>
                    <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 25px; color: #ef4444;">SCORE SECURED: ${currentScore} PTS</div>
                    <button class="btn-mine" style="background:#ef4444; color:#fff;" onclick="renderMenuScreen()">Try Again</button>
                </div>
            `;
        }

        function attachSteeringControls() {
            window.addEventListener('keydown', (e) => {
                if(['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                }
                inputKeysState[e.key] = true;
                if (e.key === ' ' && !blockInputsTemporarily) {
                    triggerHarpoonDeployment();
                }
            });

            window.addEventListener('keyup', (e) => {
                inputKeysState[e.key] = false;
            });

            const lBtn = document.getElementById('btn-left-press');
            const rBtn = document.getElementById('btn-right-press');
            const fBtn = document.getElementById('btn-fire-press');

            if (lBtn && rBtn && fBtn) {
                lBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(!blockInputsTemporarily) horizontalMovementMode = -1; });
                lBtn.addEventListener('touchend', (e) => { e.preventDefault(); horizontalMovementMode = 0; });
                lBtn.addEventListener('mousedown', () => { if(!blockInputsTemporarily) horizontalMovementMode = -1; });
                lBtn.addEventListener('mouseup', () => { horizontalMovementMode = 0; });
                lBtn.addEventListener('mouseleave', () => { horizontalMovementMode = 0; });

                rBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(!blockInputsTemporarily) horizontalMovementMode = 1; });
                rBtn.addEventListener('touchend', (e) => { e.preventDefault(); horizontalMovementMode = 0; });
                rBtn.addEventListener('mousedown', () => { if(!blockInputsTemporarily) horizontalMovementMode = 1; });
                rBtn.addEventListener('mouseup', () => { horizontalMovementMode = 0; });
                rBtn.addEventListener('mouseleave', () => { horizontalMovementMode = 0; });

                fBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerHarpoonDeployment(); });
                fBtn.addEventListener('mousedown', () => { triggerHarpoonDeployment(); });
            }
        }
    </script>
</body>
</html>
