<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Time Invaders</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #03010a;
            color: #00ffcc;
            overflow: hidden;
        }
        
        #viewport-root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }

        .cabinet-panel {
            background: rgba(0, 10, 20, 0.7);
            border: 3px solid #00ffcc;
            border-radius: 16px;
            padding: 30px 20px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }
        .btn-arcade {
            background: #00ffcc;
            color: #03010a;
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffcc;
            margin-top: 20px;
            text-transform: uppercase;
        }
        .btn-arcade:active {
            background: #00b38f;
        }

        .game-layout {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1rem;
            padding: 5px 0;
            border-bottom: 1px dashed #00ffcc;
            margin-bottom: 8px;
        }

        .dashboard-header {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
        }
        .dashboard-tag {
            font-size: 0.75rem;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .dashboard-text {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffff00;
        }

        /* Video Game Monitor Display Canvas wrapper */
        .monitor-frame {
            width: 100%;
            background: #010005;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            position: relative;
            flex-grow: 1;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.2);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Tactile Action Control Deck buttons layout */
        .deck-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            height: 55px;
        }
        .deck-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 2px solid #00ffcc;
            border-radius: 6px;
            color: #00ffcc;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .move-btn { width: 26%; }
        .fire-btn { width: 42%; background: rgba(255, 0, 127, 0.15); border-color: #ff007f; color: #ff007f; }
        .deck-btn:active { background: #00ffcc; color: #03010a; }
        .fire-btn:active { background: #ff007f; color: #ffffff; }

        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
    </style>
</head>
<body>

    <!-- Standard Audio Node Components Map -->
    <audio id="s-correct" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="s-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="s-win" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <!-- Self-Cleaning Loading Shield Layout -->
    <div id="hard-splash">
        <img src="assets/logo.png" style="max-width:240px; margin-bottom:20px;" onerror="this.style.display='none'; document.getElementById('fb-text').style.display='block';">
        <h1 id="fb-text" style="display:none; font-size:2.2rem; margin-bottom:15px; letter-spacing:2px; font-weight:bold;">INNOVINE</h1>
        <div style="width:200px; height:6px; background-color:#e2e8f0; border-radius:3px; overflow:hidden;">
            <div id="loader-progress-fill" style="width:0%; height:100%; background-color:#00ffcc;"></div>
        </div>
    </div>

    <div id="viewport-root"></div>

    <script>
        let gameScore = 0;
        let shipShields = 3;
        
        let canvasElement = null;
        let canvasContext = null;
        let animationFrameHandle = null;

        // Space Fighter Variables
        let playerShipX = 200;
        const playerShipWidth = 44;
        const playerShipHeight = 18;
        let movementDirection = 0; // -1 = Left, 1 = Right

        // Active Projectiles Array
        let laserProjectiles = [];
        let invaderShapesList = [];
        
        // Puzzle target types mappings based on image_e623a0.png
        const TIME_MODES = {
            FORMAT_24: "24-HOUR CLOCK MATCH",
            CONVERSION: "UNIT CONVERSION MATCH",
            ELAPSED: "ELAPSED TIME MATCH"
        };
        
        let currentTargetObjectiveType = "";
        let currentQuestionText = "";
        let currentCorrectAnswer = "";
        let waveSpawnTimer = 0;
        let isEngineRunning = false;

        // Fire initialization load step tickers
        let progressVal = 0;
        const progressTicker = setInterval(() => {
            progressVal += 5;
            const element = document.getElementById('loader-progress-fill');
            if (element) element.style.width = progressVal + '%';

            if (progressVal >= 100) {
                clearInterval(progressTicker);
                purgeSplashAndBuildMenu();
            }
        }, 30);

        function purgeSplashAndBuildMenu() {
            const splashMask = document.getElementById('hard-splash');
            if (splashMask) {
                splashMask.parentNode.removeChild(splashMask); // Exits block dynamically out of active DOM frame layout tree execution context
            }
            renderMenuScreen();
        }

        function renderMenuScreen() {
            isEngineRunning = false;
            if (animationFrameHandle) cancelAnimationFrame(animationFrameHandle);
            
            document.getElementById('viewport-root').innerHTML = `
                <div class="cabinet-panel">
                    <h1 style="color:#00ffcc; font-size:1.7rem; margin-bottom:12px; text-shadow:0 0 10px #00ffcc;">SPACE TIME INVADERS</h1>
                    <p style="color:#88aaaa; font-size:0.85rem; line-height:1.6; text-align:left; margin-bottom:20px;">
                        Chronos matrix blocks are invading your coordinate track! Read the calculation query at the top of the deck, track beneath the matching solution value, and open fire!
                    </p>
                    <div style="color:#ff007f; font-size:0.8rem; margin-bottom:20px; font-weight:bold; border:1px dashed #ff007f; padding:8px;">
                        🕹️ KEYBOARD CONTROLS:<br>ARROW KEYS = MOVE | SPACEBAR = FIRE LASER
                    </div>
                    <button class="btn-arcade" onclick="initiateGameEngine()">INSERT COIN</button>
                </div>
            `;
        }

        function initiateGameEngine() {
            gameScore = 0;
            shipShields = 3;
            invaderShapesList = [];
            laserProjectiles = [];
            waveSpawnTimer = 0;
            isEngineRunning = true;

            buildGameLayoutDOM();
            cycleNewTargetObjective();
            runCanvasGameLoop();
            attachSteeringControls();
        }

        function buildGameLayoutDOM() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="game-layout">
                    <div class="hud-row">
                        <div>SCORE: <span id="lbl-score">0000</span></div>
                        <div>SHIELDS: <span id="lbl-shields">███</span></div>
                    </div>

                    <div class="dashboard-header">
                        <div class="dashboard-tag" id="lbl-target-tag">CLOCK COMPUTER LOCK-ON</div>
                        <div class="dashboard-text" id="lbl-target-prompt">LOADING TARGET...</div>
                    </div>

                    <div class="monitor-frame">
                        <canvas id="arcade-canvas" width="440" height="420"></canvas>
                    </div>

                    <div class="deck-controls">
                        <div class="deck-btn move-btn" id="btn-left-press">◀</div>
                        <div class="deck-btn fire-btn" id="btn-fire-press">FIRE</div>
                        <div class="deck-btn move-btn" id="btn-right-press">▶</div>
                    </div>
                </div>
            `;

            canvasElement = document.getElementById('arcade-canvas');
            canvasContext = canvasElement.getContext('2d');
            playerShipX = (canvasElement.width / 2) - (playerShipWidth / 2);
        }

        function cycleNewTargetObjective() {
            // Pick a curriculum concept from image_e623a0.png
            const modes = Object.keys(TIME_MODES);
            const chosenMode = modes[Math.floor(Math.random() * modes.length)];
            currentTargetObjectiveType = TIME_MODES[chosenMode];

            let pool = [];

            if (chosenMode === "FORMAT_24") {
                pool = [
                    { q: "04:00 PM in 24-Hr Clock format", a: "16:00", w: ["04:00", "20:00", "14:00"] },
                    { q: "09:30 PM in 24-Hr Clock format", a: "21:30", w: ["09:30", "19:30", "23:30"] },
                    { q: "11:15 PM in 24-Hr Clock format", a: "23:15", w: ["11:15", "13:15", "22:15"] },
                    { q: "12:20 AM in 24-Hr Clock format", a: "00:20", w: ["12:20", "24:20", "02:20"] }
                ];
            } else if (chosenMode === "CONVERSION") {
                pool = [
                    { q: "Convert 3 Hours into Minutes", a: "180 min", w: ["120 min", "150 min", "240 min"] },
                    { q: "Convert 2 Minutes into Seconds", a: "120 sec", w: ["200 sec", "60 sec", "180 sec"] },
                    { q: "Convert 1 Hr 15 Min into Minutes", a: "75 min", w: ["115 min", "60 min", "150 min"] },
                    { q: "Convert 4 Minutes into Seconds", a: "240 sec", w: ["140 sec", "400 sec", "200 sec"] }
                ];
            } else {
                pool = [
                    { q: "Elapsed time: 03:15 PM to 04:45 PM", a: "1h 30m", w: ["2h 30m", "1h 15m", "0h 45m"] },
                    { q: "Elapsed time: 09:00 AM to 11:15 AM", a: "2h 15m", w: ["1h 15m", "2h 45m", "3h 15m"] },
                    { q: "Elapsed time: 13:00 to 14:40 Hours", a: "1h 40m", w: ["2h 40m", "0h 40m", "1h 20m"] }
                ];
            }

            const activePuzzle = pool[Math.floor(Math.random() * pool.length)];
            currentQuestionText = activePuzzle.q;
            currentCorrectAnswer = activePuzzle.a;

            document.getElementById('lbl-target-tag').innerText = currentTargetObjectiveType;
            document.getElementById('lbl-target-prompt').innerText = currentQuestionText;
            
            spawnInvaderClusterWave(activePuzzle.w);
        }

        function spawnInvaderClusterWave(distractors) {
            invaderShapesList = [];
            const columnsCount = 3;
            const segmentSpacingX = canvasElement.width / columnsCount;
            
            // Randomly select one column position to hold the correct answer
            const targetColumnIndex = Math.floor(Math.random() * columnsCount);

            // Shuffle incorrect answer choices
            let wrongChoices = [...distractors].sort(() => Math.random() - 0.5);

            for (let i = 0; i < columnsCount; i++) {
                let textValue = "";
                let isCorrectNode = false;
                
                if (i === targetColumnIndex) {
                    textValue = currentCorrectAnswer;
                    isCorrectNode = true;
                } else {
                    textValue = wrongChoices.pop() || "10:00";
                }

                invaderShapesList.push({
                    x: (i * segmentSpacingX) + (segmentSpacingX / 2),
                    y: 40,
                    text: textValue,
                    isCorrect: isCorrectNode,
                    width: 76,
                    height: 32,
                    speed: 0.45 + (gameScore * 0.0002) // Gradual scaling
                });
            }
        }

        function runCanvasGameLoop() {
            if (!isEngineRunning) return;

            updateFramePhysics();
            renderFrameGraphics();

            animationFrameHandle = requestAnimationFrame(runCanvasGameLoop);
        }

        function updateFramePhysics() {
            // Ship lateral movement bounds enforcement
            if (movementDirection === -1 && playerShipX > 5) playerShipX -= 5;
            if (movementDirection === 1 && playerShipX < (canvasElement.width - playerShipWidth - 5)) playerShipX += 5;

            // Projectile vector stepping
            for (let i = laserProjectiles.length - 1; i >= 0; i--) {
                let laser = laserProjectiles[i];
                laser.y -= 8;
                
                if (laser.y < 0) {
                    laserProjectiles.splice(i, 1);
                }
            }

            // Descend invaders downward
            let hitLowBoundary = false;
            for (let i = 0; i < invaderShapesList.length; i++) {
                let invader = invaderShapesList[i];
                invader.y += invader.speed;

                if (invader.y > canvasElement.height - 60) {
                    hitLowBoundary = true;
                }

                // Laser contact collision matrix calculation
                for (let j = laserProjectiles.length - 1; j >= 0; j--) {
                    let laser = laserProjectiles[j];
                    
                    // Simple box bounding checking
                    if (laser.x >= invader.x - invader.width/2 && laser.x <= invader.x + invader.width/2) {
                        if (laser.y >= invader.y - invader.height/2 && laser.y <= invader.y + invader.height/2) {
                            laserProjectiles.splice(j, 1);
                            
                            if (invader.isCorrect) {
                                playAudioFile('s-correct');
                                gameScore += 100;
                                document.getElementById('lbl-score').innerText = String(gameScore).padStart(4, '0');
                                cycleNewTargetObjective();
                            } else {
                                playAudioFile('s-wrong');
                                registerShieldDamage();
                            }
                            return;
                        }
                    }
                }
            }

            if (hitLowBoundary) {
                registerShieldDamage();
            }
        }

        function registerShieldDamage() {
            shipShields--;
            let shieldBars = "";
            for (let i = 0; i < shipShields; i++) shieldBars += "█";
            if (shieldBars === "") shieldBars = "EMPTY";
            
            document.getElementById('lbl-shields').innerText = shieldBars;

            if (shipShields <= 0) {
                isEngineRunning = false;
                renderGameOverScreen();
            } else {
                cycleNewTargetObjective();
            }
        }

        function triggerLaserBeamFiringSequence() {
            if (!isEngineRunning) return;
            laserProjectiles.push({
                x: playerShipX + (playerShipWidth / 2),
                y: canvasElement.height - 35
            });
        }

        function renderFrameGraphics() {
            canvasContext.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Perimeter Boundary line
            canvasContext.strokeStyle = '#ff0055';
            canvasContext.lineWidth = 1;
            canvasContext.setLineDash([4, 4]);
            canvasContext.beginPath();
            canvasContext.moveTo(0, canvasElement.height - 50);
            canvasContext.lineTo(canvasElement.width, canvasElement.height - 50);
            canvasContext.stroke();
            canvasContext.setLineDash([]); 

            // Fighter Craft
            canvasContext.fillStyle = '#00ffcc';
            canvasContext.fillRect(playerShipX, canvasElement.height - 30, playerShipWidth, playerShipHeight);
            canvasContext.fillRect(playerShipX + (playerShipWidth / 2) - 3, canvasElement.height - 36, 6, 6);

            // Lasers
            canvasContext.fillStyle = '#ff007f';
            for (let i = 0; i < laserProjectiles.length; i++) {
                canvasContext.fillRect(laserProjectiles[i].x - 2, laserProjectiles[i].y, 4, 10);
            }

            // Time Blocks Invaders
            for (let i = 0; i < invaderShapesList.length; i++) {
                let invader = invaderShapesList[i];
                
                // Draw digital matrix housing box
                canvasContext.strokeStyle = 'rgba(0, 255, 204, 0.3)';
                canvasContext.fillStyle = 'rgba(0, 20, 30, 0.85)';
                canvasContext.lineWidth = 2;
                
                canvasContext.beginPath();
                canvasContext.rect(invader.x - invader.width/2, invader.y - invader.height/2, invader.width, invader.height);
                canvasContext.fill();
                canvasContext.stroke();

                // Draw Text inside block
                canvasContext.fillStyle = '#ffffff';
                canvasContext.font = 'bold 12px monospace';
                canvasContext.textAlign = 'center';
                canvasContext.textBaseline = 'middle';
                canvasContext.fillText(invader.text, invader.x, invader.y);
            }
        }

        function attachSteeringControls() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') movementDirection = -1;
                if (e.key === 'ArrowRight') movementDirection = 1;
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    triggerLaserBeamFiringSequence();
                }
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' && movementDirection === -1) movementDirection = 0;
                if (e.key === 'ArrowRight' && movementDirection === 1) movementDirection = 0;
            });

            const leftBtn = document.getElementById('btn-left-press');
            const rightBtn = document.getElementById('btn-right-press');
            const fireBtn = document.getElementById('btn-fire-press');

            if (leftBtn && rightBtn && fireBtn) {
                leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); movementDirection = -1; });
                leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); if(movementDirection === -1) movementDirection = 0; });
                
                rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); movementDirection = 1; });
                rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); if(movementDirection === 1) movementDirection = 0; });

                fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); triggerLaserBeamFiringSequence(); });

                // Cross platform desktop mouse click checks
                leftBtn.addEventListener('mousedown', () => movementDirection = -1);
                leftBtn.addEventListener('mouseup', () => { if(movementDirection === -1) movementDirection = 0; });
                rightBtn.addEventListener('mousedown', () => movementDirection = 1);
                rightBtn.addEventListener('mouseup', () => { if(movementDirection === 1) movementDirection = 0; });
                fireBtn.addEventListener('mousedown', () => triggerLaserBeamFiringSequence());
            }
        }

        function renderGameOverScreen() {
            document.getElementById('viewport-root').innerHTML = `
                <div class="cabinet-panel" style="border-color: #ff0055; box-shadow: 0 0 30px rgba(255,0,85,0.4);">
                    <h1 style="color:#ff0055; font-size:1.8rem; margin-bottom:10px;">MISSION OVER</h1>
                    <p style="color:#bfa2a8; font-size:0.9rem; margin-bottom:15px;">
                        Final Score: <span style="color:#00ffcc; font-weight:bold;">${gameScore}</span>
                    </p>
                    <p style="color:#8899aa; font-size:0.8rem; line-height:1.4; margin-bottom:20px;">
                        Great defense work interpreting clock differences, configurations, and elapsed tracking intervals from image_e623a0.png!
                    </p>
                    <button class="btn-arcade" onclick="renderMenuScreen()">CONTINUE</button>
                </div>
            `;
        }

        function playAudioFile(id) {
            try {
                const sound = document.getElementById(id);
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            } catch (err) {}
        }
    </script>
</body>
</html>
