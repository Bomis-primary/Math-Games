<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Data Handling & Charts Lab</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #070b12;
            color: #f1f5f9;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #viewport-root {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 740px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: relative;
        }

        /* Plain White Splash Screen */
        #hard-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .splash-content-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }
        .splash-img {
            max-width: 70%;
            height: auto;
            object-fit: contain;
        }

        /* Level Mode Switcher Tabs */
        .level-switcher {
            display: flex;
            background: #111827;
            border: 2px solid #374151;
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }
        .mode-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            color: #94a3b8;
            border: none;
            transition: all 0.2s ease;
        }
        .mode-tab.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        /* Panel Visibility Rules */
        .panel {
            display: none;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .panel.active {
            display: flex;
        }

        /* Instruction Display Card Header */
        .lab-display {
            background: #111827;
            border: 2px solid #374151;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .control-panel {
            background: #1e1e38;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            padding: 10px 14px;
        }
        .ticker-title {
            font-size: 0.7rem;
            color: #60a5fa;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.8px;
        }
        .ticker-problem {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin-top: 2px;
            line-height: 1.4;
        }

        /* Simulation Canvas Frames */
        .simulation-frame {
            flex-grow: 1;
            min-height: 260px;
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Choice Selectors for Quiz (L1) */
        .console-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-row-btn {
            width: 100%;
            background: #111827;
            border: 2px solid #374151;
            color: #e5e7eb;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .option-row-btn.selected {
            background: #2563eb;
            border-color: #60a5fa;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.3);
        }

        /* Control Action Triggers */
        .sandbox-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #111827;
            padding: 12px;
            border-radius: 14px;
            border: 2px solid #374151;
        }
        .tool-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .tool-btn {
            width: 100%;
            background: #475569;
            border: 1px solid #64748b;
            color: #f1f5f9;
            padding: 12px 6px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        /* Bottom Process Dispatch Buttons */
        .action-dispatch-btn {
            width: 100%;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
        }
        .action-dispatch-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            box-shadow: none;
        }
        .status-banner {
            text-align: center;
            font-weight: 700;
            font-size: 0.8rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div id="hard-splash">
        <div class="splash-content-wrapper">
            <div class="splash-logo-container">
                <img src="assets/logo.png" class="splash-img" alt="Innovine Solutions">
            </div>
        </div>
    </div>

    <div id="viewport-root">
        
        <div class="level-switcher">
            <button class="mode-tab active" id="tab-l1" onclick="switchLevelMode(1)">Level 1: Verification Test</button>
            <button class="mode-tab" id="tab-l2" onclick="switchLevelMode(2)">Level 2: Creative Sandbox</button>
        </div>

        <div id="panel-l1" class="panel active">
            <div class="lab-display">
                <div class="control-panel">
                    <div class="ticker-title" id="lbl-task-counter">Challenge 1 of 4</div>
                    <div class="ticker-problem" id="lbl-question-text">Loading verification task logs...</div>
                </div>
            </div>
            <div class="simulation-frame">
                <canvas id="l1-canvas"></canvas>
            </div>
            <div class="status-banner" id="lbl-status-toast" style="color: #94a3b8;">Analyze the data chart and verify the true counts.</div>
            <div class="console-grid">
                <button class="option-row-btn" id="opt-0" onclick="selectL1Option(0)">Option A</button>
                <button class="option-row-btn" id="opt-1" onclick="selectL1Option(1)">Option B</button>
                <button class="option-row-btn" id="opt-2" onclick="selectL1Option(2)">Option C</button>
            </div>
            <button class="action-dispatch-btn" id="btn-submit-l1" onclick="verifyL1Answer()">Verify Data Pack</button>
        </div>

        <div id="panel-l2" class="panel">
            <div class="lab-display">
                <div class="control-panel">
                    <div class="ticker-title">Interactive Bar Graph Studio</div>
                    <div class="ticker-problem">Tap anywhere inside the grid columns to increase or decrease bar heights and map custom data segments manually.</div>
                </div>
            </div>

            <div class="simulation-frame">
                <canvas id="l2-canvas"></canvas>
            </div>

            <div class="sandbox-controls">
                <div class="tool-row">
                    <button class="tool-btn" onclick="clearSandboxCanvas()">Clear Graph Values</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Core Audio Context Infrastructure
        let audioCtx = null;
        let activeLevel = 1;

        // Level 1 Interactive Parameters
        let l1Canvas, l1Ctx;
        let currentL1Task = 0;
        let selectedL1Opt = -1;
        let challengePool = [];
        let l1AnimationTimer = 0;
        let l1AnimationType = 'none';

        // Level 2 Interactive Parameters
        let l2Canvas, l2Ctx;
        const barCategories = ["Red Gems", "Blue Gems", "Green Gems", "Gold Gems"];
        const maxBarValue = 10;
        let activeBarData = [4, 7, 3, 6]; // Live column height tracking configurations

        // Standard 5-Second Splash Screen Clock Ticker
        let splashElapsed = 0;
        const splashInterval = 100;
        const splashTicker = setInterval(() => {
            splashElapsed += splashInterval;
            if (splashElapsed >= 5000) {
                clearInterval(splashTicker);
                const splash = document.getElementById('hard-splash');
                const mainApp = document.getElementById('viewport-root');
                if (splash) splash.style.opacity = '0';
                setTimeout(() => {
                    if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    if (mainApp) mainApp.style.opacity = '1';
                    initLabApplicationSuite();
                }, 500);
            }
        }, splashInterval);

        function initLabApplicationSuite() {
            l1Canvas = document.getElementById('l1-canvas');
            l1Ctx = l1Canvas.getContext('2d');
            l2Canvas = document.getElementById('l2-canvas');
            l2Ctx = l2Canvas.getContext('2d');

            recalculateCanvasResolutions();
            buildL1QuestionPool();
            loadL1Task();
            initSandboxGraphClickHandlers();

            // Core App Tick Loop Animation Routine
            function coreAppTick() {
                renderL1Graphics();
                renderL2BarGraph();
                if (l1AnimationTimer > 0) {
                    l1AnimationTimer--;
                    if (l1AnimationTimer === 0) advanceL1Round();
                }
                requestAnimationFrame(coreAppTick);
            }
            requestAnimationFrame(coreAppTick);
        }

        function recalculateCanvasResolutions() {
            [l1Canvas, l2Canvas].forEach(c => {
                const rect = c.parentNode.getBoundingClientRect();
                c.width = rect.width;
                c.height = rect.height;
            });
        }

        function switchLevelMode(lvl) {
            activeLevel = lvl;
            document.getElementById('tab-l1').classList.toggle('active', lvl === 1);
            document.getElementById('tab-l2').classList.toggle('active', lvl === 2);
            document.getElementById('panel-l1').classList.toggle('active', lvl === 1);
            document.getElementById('panel-l2').classList.toggle('active', lvl === 2);
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            setTimeout(recalculateCanvasResolutions, 50);
        }

        // ================= LEVEL 1 SYSTEM ENGINES =================
        function buildL1QuestionPool() {
            challengePool = [
                {
                    type: 'tally_check',
                    text: "Tally Verification: Look at the tally counts provided on screen. What is the total sum count of the logged cosmic elements?",
                    options: ["12 Elements Total", "14 Elements Total", "11 Elements Total"],
                    correctIdx: 1,
                    data: [5, 6, 3] // Raw numerical data sets representing items
                },
                {
                    type: 'max_bar',
                    text: "Bar Graph Assessment: Inspect the category heights on the grid. Which unique crystal type registered the highest total frequency count?",
                    options: ["Alpha Quartz", "Beta Emerald", "Gamma Ruby"],
                    correctIdx: 0,
                    data: [9, 4, 7]
                },
                {
                    type: 'difference_calc',
                    text: "Data Comparative: Compare the frequencies of Alpha and Gamma groups. How many more items are logged in Alpha than Gamma?",
                    options: ["2 item columns difference", "5 item columns difference", "4 item columns difference"],
                    correctIdx: 0,
                    data: [9, 4, 7]
                },
                {
                    type: 'empty_match',
                    text: "Null Frequency Check: One category completely missed registration markers. What numerical count value matches a flat line category?",
                    options: ["Count value: 1", "Count value: 5", "Count value: 0"],
                    correctIdx: 2,
                    data: [6, 0, 8]
                }
            ];
        }

        function loadL1Task() {
            if (currentL1Task >= challengePool.length) {
                showL1SuiteCompletion();
                return;
            }
            const task = challengePool[currentL1Task];
            document.getElementById('lbl-task-counter').innerText = `Challenge ${currentL1Task + 1} of ${challengePool.length}`;
            document.getElementById('lbl-question-text').innerText = task.text;

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`opt-${i}`);
                btn.innerText = task.options[i];
                btn.classList.remove('selected');
            }
            selectedL1Opt = -1;
            l1AnimationTimer = 0;
            l1AnimationType = 'none';
            document.getElementById('lbl-status-toast').innerText = "Analyze the data chart and verify the true counts.";
            document.getElementById('lbl-status-toast').style.color = "#94a3b8";
            document.getElementById('btn-submit-l1').disabled = false;
        }

        function selectL1Option(idx) {
            selectedL1Opt = idx;
            for (let i = 0; i < 3; i++) {
                document.getElementById(`opt-${i}`).classList.toggle('selected', i === idx);
            }
        }

        function verifyL1Answer() {
            if (selectedL1Opt === -1) {
                document.getElementById('lbl-status-toast').innerText = "⚠️ Select an analysis option first!";
                document.getElementById('lbl-status-toast').style.color = "#fbbf24";
                return;
            }
            document.getElementById('btn-submit-l1').disabled = true;
            if (selectedL1Opt === challengePool[currentL1Task].correctIdx) {
                l1AnimationType = 'correct';
                l1AnimationTimer = 35;
                document.getElementById('lbl-status-toast').innerText = "✓ Data log parameters successfully verified!";
                document.getElementById('lbl-status-toast').style.color = "#34d399";
                triggerToneOutput(587.33, 698.46);
            } else {
                l1AnimationType = 'error';
                l1AnimationTimer = 35;
                document.getElementById('lbl-status-toast').innerText = "❌ Incorrect analysis. Re-tally column configurations.";
                document.getElementById('lbl-status-toast').style.color = "#f87171";
                triggerToneOutput(293.66, 246.94);
            }
        }

        function advanceL1Round() {
            if (l1AnimationType === 'correct') currentL1Task++;
            loadL1Task();
        }

        function showL1SuiteCompletion() {
            document.getElementById('lbl-task-counter').innerText = "Assessment Finalized";
            document.getElementById('lbl-question-text').innerText = "Excellent data reporting! All frequency structures and charts match parameters accurately.";
            document.getElementById('lbl-status-toast').innerText = "Verification complete! Switch to Level 2 tab to sketch custom chart formats.";
            document.getElementById('lbl-status-toast').style.color = "#60a5fa";
            for (let i = 0; i < 3; i++) document.getElementById(`opt-${i}`).style.display = 'none';
            const sub = document.getElementById('btn-submit-l1');
            sub.innerText = "Restart Assessment Loop";
            sub.disabled = false;
            sub.onclick = () => { location.reload(); };
        }

        function renderL1Graphics() {
            if (!l1Ctx) return;
            const w = l1Canvas.width, h = l1Canvas.height;
            l1Ctx.clearRect(0, 0, w, h);
            const task = challengePool[currentL1Task];
            if (!task) return;

            if (task.type === 'tally_check') {
                // Tally Table Visuals
                const rowH = (h - 40) / 3;
                const labels = ["Alpha", "Beta", "Gamma"];
                l1Ctx.lineWidth = 1;
                l1Ctx.strokeStyle = '#4b5563';
                
                for(let i=0; i<3; i++) {
                    let cy = 20 + i*rowH;
                    l1Ctx.fillStyle = '#111827';
                    l1Ctx.fillRect(15, cy, w-30, rowH - 8);
                    l1Ctx.strokeRect(15, cy, w-30, rowH - 8);
                    
                    l1Ctx.fillStyle = '#94a3b8';
                    l1Ctx.font = 'bold 13px sans-serif';
                    l1Ctx.fillText(labels[i], 30, cy + rowH/2 - 10);
                    
                    // Render custom tally grouping bundles
                    l1Ctx.strokeStyle = '#38bdf8';
                    l1Ctx.lineWidth = 3;
                    let count = task.data[i];
                    let startX = 100;
                    
                    for(let t=0; t<count; t++) {
                        if (t > 0 && t % 5 === 0) startX += 20;
                        let tx = startX + (t % 5) * 8;
                        if ((t+1) % 5 === 0) {
                            l1Ctx.beginPath();
                            l1Ctx.moveTo(tx - 32, cy + rowH/2);
                            l1Ctx.lineTo(tx + 4, cy + rowH/2 - 24);
                            l1Ctx.stroke();
                        } else {
                            l1Ctx.beginPath();
                            l1Ctx.moveTo(tx, cy + rowH/2 - 24);
                            l1Ctx.lineTo(tx, cy + rowH/2);
                            l1Ctx.stroke();
                        }
                    }
                }
            } else {
                // Bar Graph Layout Forms
                const padL = 40, padB = 40, padT = 20, padR = 20;
                const gw = w - padL - padR, gh = h - padT - padB;
                
                // Draw Grid Intervals Axis Lines
                l1Ctx.strokeStyle = '#374151';
                l1Ctx.lineWidth = 1;
                for(let i=0; i<=10; i+=2) {
                    let gy = padT + gh - (i / 10) * gh;
                    l1Ctx.beginPath(); l1Ctx.moveTo(padL, gy); l1Ctx.lineTo(w - padR, gy); l1Ctx.stroke();
                    l1Ctx.fillStyle = '#64748b';
                    l1Ctx.font = '10px monospace';
                    l1Ctx.fillText(i, 15, gy + 4);
                }

                // Render Chart Bar Columns
                const labels = ["Alpha", "Beta", "Gamma"];
                const colors = ["#ef4444", "#10b981", "#3b82f6"];
                const colW = gw / 3;

                task.data.forEach((val, idx) => {
                    let barH = (val / 10) * gh;
                    let bx = padL + idx * colW + colW * 0.15;
                    let by = padT + gh - barH;
                    let bw = colW * 0.7;

                    l1Ctx.fillStyle = colors[idx];
                    l1Ctx.fillRect(bx, by, bw, barH);

                    l1Ctx.fillStyle = '#ffffff';
                    l1Ctx.font = 'bold 11px sans-serif';
                    l1Ctx.fillText(labels[idx], bx + bw/2 - 14, padT + gh + 18);
                });
            }

            if (l1AnimationTimer > 0) {
                l1Ctx.fillStyle = l1AnimationType === 'correct' ? 'rgba(52, 211, 153, 0.25)' : 'rgba(248, 113, 113, 0.25)';
                l1Ctx.fillRect(0, 0, w, h);
            }
        }

        // ================= LEVEL 2 CREATIVE SYSTEM ENGINES =================
        function initSandboxGraphClickHandlers() {
            function processCanvasTap(clientX, clientY) {
                if (activeLevel !== 2) return;
                const rect = l2Canvas.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                const padL = 40, padB = 40, padT = 20, padR = 20;
                const gw = l2Canvas.width - padL - padR;
                const gh = l2Canvas.height - padT - padB;

                if (x >= padL && x <= l2Canvas.width - padR && y >= padT && y <= l2Canvas.height - padB) {
                    const colW = gw / barCategories.length;
                    const colIdx = Math.floor((x - padL) / colW);
                    
                    if(colIdx >= 0 && colIdx < barCategories.length) {
                        // Determine proportional height clicked
                        const clickPct = 1 - ((y - padT) / gh);
                        const calculatedVal = Math.round(clickPct * maxBarValue);
                        
                        if(calculatedVal >= 0 && calculatedVal <= maxBarValue) {
                            activeBarData[colIdx] = calculatedVal;
                            triggerToneOutput(300 + (calculatedVal * 40), 0);
                        }
                    }
                }
            }

            l2Canvas.addEventListener('mousedown', (e) => {
                processCanvasTap(e.clientX, e.clientY);
            });

            l2Canvas.addEventListener('touchstart', (e) => {
                processCanvasTap(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
        }

        function clearSandboxCanvas() {
            activeBarData = [0, 0, 0, 0];
            triggerToneOutput(200, 0);
        }

        function renderL2BarGraph() {
            if (!l2Ctx || activeLevel !== 2) return;
            const w = l2Canvas.width, h = l2Canvas.height;
            l2Ctx.clearRect(0, 0, w, h);

            const padL = 40, padB = 45, padT = 25, padR = 20;
            const gw = w - padL - padR, gh = h - padT - padB;

            // Draw Frequency Axis Ticks & Y Gridlines
            l2Ctx.strokeStyle = '#2d3748';
            l2Ctx.lineWidth = 1;
            for (let i = 0; i <= maxBarValue; i++) {
                let gy = padT + gh - (i / maxBarValue) * gh;
                l1Ctx.beginPath(); l1Ctx.moveTo(padL, gy); l1Ctx.lineTo(w - padR, gy); l1Ctx.stroke();
                
                l2Ctx.fillStyle = '#64748b';
                l2Ctx.font = '10px monospace';
                l2Ctx.fillText(i, 15, gy + 4);
            }

            // Draw Active Column Formations
            const colW = gw / barCategories.length;
            const themes = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b"];

            for (let c = 0; c < barCategories.length; c++) {
                let currentVal = activeBarData[c];
                let barH = (currentVal / maxBarValue) * gh;
                let bx = padL + c * colW + colW * 0.15;
                let by = padT + gh - barH;
                let bw = colW * 0.7;

                // Column Rectangle Fill
                l2Ctx.fillStyle = themes[c];
                l2Ctx.fillRect(bx, by, bw, barH);

                // Highlight Outline Border Line
                l2Ctx.strokeStyle = '#ffffff';
                l2Ctx.lineWidth = 1;
                if(currentVal > 0) l2Ctx.strokeRect(bx, by, bw, barH);

                // Category Text Label Strings
                l2Ctx.fillStyle = '#94a3b8';
                l2Ctx.font = 'bold 10px sans-serif';
                let shortLabel = barCategories[c].split(" ")[0];
                l2Ctx.fillText(shortLabel, bx + bw/2 - 12, padT + gh + 18);
            }

            // Central Vertical Baseline Draw
            l2Ctx.strokeStyle = '#475569';
            l2Ctx.lineWidth = 2;
            l2Ctx.beginPath();
            l2Ctx.moveTo(padL, padT + gh);
            l2Ctx.lineTo(w - padR, padT + gh);
            l2Ctx.stroke();
        }

        function triggerToneOutput(f1, f2) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const currentPlaybackTime = audioCtx.currentTime;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f1, currentPlaybackTime);
                if (f2) osc.frequency.setValueAtTime(f2, currentPlaybackTime + 0.1);
                gain.gain.setValueAtTime(0.08, currentPlaybackTime);
                gain.gain.exponentialRampToValueAtTime(0.01, currentPlaybackTime + 0.25);
                osc.start(currentPlaybackTime); osc.stop(currentPlaybackTime + 0.25);
            } catch(e) {}
        }
    </script>
</body>
</html>
