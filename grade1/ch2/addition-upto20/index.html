<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Balloon Rescue & Feast - Grade 1 Addition</title>
<style>
    :root {
        --sky-blue: #bae6fd;
        --grass-green: #22c55e;
        --pop-pink: #f43f5e;
        --gold: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
        width: 100%; height: 100%;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #1e293b; overflow: hidden;
        background-color: #38bdf8;
    }

    .game-container {
        position: relative; width: 100%; height: 100%;
        background: #38bdf8 url('assets/sky-bg.png') no-repeat center center;
        background-size: cover;
        display: flex; justify-content: center; align-items: center;
        flex-direction: column; padding: 20px;
    }

    /* Splash Screen Overlay Layer */
    #screen-splash {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #ffffff !important; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 1; transition: opacity 0.5s ease;
    }
    .logo-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 100%;
    }
    /* Fixed: Increased size variables safely for prominent logo appearance */
    .logo-img {
        max-width: 75%; max-height: 240px; object-fit: contain;
    }
    .logo-fallback {
        width: 140px; height: 140px; background: linear-gradient(135deg, #0284c7, #38bdf8);
        border-radius: 28px; display: flex; align-items: center; justify-content: center;
        color: white; font-size: 65px; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .splash-loader {
        margin-top: 35px; width: 180px; height: 6px; background: #e2e8f0;
        border-radius: 3px; overflow: hidden; position: relative;
    }
    .splash-loader-bar {
        position: absolute; background: #0284c7; width: 100%; height: 100%;
        left: -100%; animation: loadProgress 5s linear forwards;
    }

    /* Content Wrapper prevents background visual parts from peaking prior to initialization */
    #main-game-wrapper {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%; height: 100%;
    }

    .grass-floor {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 16%;
        background: linear-gradient(to bottom, rgba(74, 222, 128, 0.9) 0%, rgba(34, 197, 94, 0.95) 100%);
        z-index: 1; border-top: 8px solid #86efac;
        display: flex; align-items: center; justify-content: space-around;
        font-size: 24px; padding-bottom: 20px; pointer-events: none;
    }

    .screen {
        display: none; width: 100%; max-width: 650px;
        flex-direction: column; align-items: center; text-align: center;
        z-index: 5;
    }
    .screen.active { display: flex !important; }

    .card {
        background: rgba(255, 255, 255, 0.96);
        padding: 35px; border-radius: 32px;
        border: 6px solid #38bdf8; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
    }
    h1 { font-size: 38px; color: #0284c7; margin-bottom: 12px; font-weight: 800; }
    p { font-size: 19px; line-height: 1.5; color: #475569; margin-bottom: 25px; }

    .animal-lineup {
        display: flex; justify-content: center; gap: 25px; margin-bottom: 25px; min-height: 90px;
    }
    .lineup-item {
        width: 90px; height: 90px; display: flex; align-items: center; justify-content: center;
        animation: floatAnimation 3s infinite ease-in-out;
    }
    .lineup-item img { width: 100%; height: 100%; object-fit: contain; }
    .lineup-item:nth-child(2) { animation-delay: 0.4s; }
    .lineup-item:nth-child(3) { animation-delay: 0.8s; }
    
    .fallback-avatar-circle {
        width: 80px; height: 80px; background: #f97316; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 44px;
        color: white;
    }

    .live-companion-box {
        position: absolute; bottom: 8%; left: 8%; z-index: 3;
        display: flex; flex-direction: column; align-items: center; min-height: 130px;
    }
    .companion-wrapper { width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; }
    .companion-img {
        width: 100%; height: 100%; object-fit: contain;
        filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
    }
    
    .falling-snack {
        position: absolute; top: -120px; font-size: 50px;
        display: none; z-index: 4;
    }
    .falling-snack.drop {
        display: block; animation: dropDown 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .btn {
        padding: 16px 36px; font-size: 24px; font-weight: 900;
        color: white; border: none; border-radius: 24px; cursor: pointer;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        box-shadow: 0 8px 0px #15803d, 0 12px 20px rgba(0,0,0,0.2);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 11px 0px #15803d, 0 14px 24px rgba(0,0,0,0.25); }
    .btn:active { transform: translateY(5px); box-shadow: 0 3px 0px #15803d; }
    
    .btn-red {
        background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        box-shadow: 0 8px 0px #9f1239, 0 12px 20px rgba(0,0,0,0.2);
    }
    .btn-red:hover { box-shadow: 0 11px 0px #9f1239, 0 14px 24px rgba(0,0,0,0.25); }
    .btn-red:active { box-shadow: 0 3px 0px #9f1239; }

    .hud {
        width: 100%; max-width: 620px; display: flex; justify-content: space-between; align-items: center;
        background: white; padding: 14px 28px; border-radius: 24px;
        margin-bottom: 20px; font-size: 18px; font-weight: bold;
        border: 4px solid #e2e8f0; box-shadow: 0 6px 12px rgba(0,0,0,0.04);
    }

    .math-banner {
        background: #fef08a; color: #854d0e; font-size: 32px; font-weight: 900;
        padding: 14px 35px; border-radius: 30px; border: 5px solid #facc15;
        margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        display: inline-block; letter-spacing: 1px; max-width: 100%;
    }

    .interaction-canvas {
        position: relative; width: 100%; height: 350px;
        display: flex; justify-content: center; gap: 40px; align-items: center;
    }

    /* LEVEL 1: Balloons */
    .balloon-node { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s, opacity 0.2s; }
    .balloon-body {
        width: 115px; height: 135px; border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%;
        display: flex; justify-content: center; align-items: center;
        font-size: 32px; font-weight: 900; color: white; position: relative;
        text-shadow: 0 2px 5px rgba(0,0,0,0.25);
        box-shadow: inset -12px -12px 0px rgba(0,0,0,0.12), 0 12px 20px rgba(0,0,0,0.1);
    }
    .balloon-node.popped { animation: popBurst 0.25s forwards ease-out; pointer-events: none; }
    .balloon-body::after {
        content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
        border-left: 8px solid transparent; border-right: 8px solid transparent;
        border-bottom: 9px solid currentColor; filter: brightness(0.85);
    }
    .balloon-string { width: 3px; height: 55px; background-color: #cbd5e1; margin-top: 6px; }

    /* LEVEL 2: Baskets */
    .basket-node { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s, opacity 0.2s; }
    .basket-node:hover { transform: scale(1.08); }
    .basket-body { font-size: 75px; position: relative; display: flex; justify-content: center; align-items: center; }
    .basket-label {
        position: absolute; bottom: 5px; background: #ea580c; color: white;
        font-size: 24px; font-weight: 900; padding: 4px 16px; border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.15); border: 2px solid white;
    }
    .basket-node.selected-correct { animation: happyDance 0.5s ease infinite alternate; pointer-events: none; }

    .color-cyan { background-color: #0ea5e9; }
    .color-purple { background-color: #a855f7; }
    .color-orange { background-color: #f97316; }

    .level-badge { font-size: 60px; margin-bottom: 15px; animation: floatAnimation 2s infinite ease-in-out; }

    @keyframes loadProgress { 0% { left: -100%; } 100% { left: 0%; } }
    @keyframes floatAnimation {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
    }
    .float-idle { animation: floatAnimation 4s infinite ease-in-out; }
    .float-idle:nth-child(2) { animation-delay: 0.6s; }
    .float-idle:nth-child(3) { animation-delay: 1.2s; }

    @keyframes popBurst {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.7; }
        100% { transform: scale(0); opacity: 0; }
    }
    @keyframes dropDown {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
        100% { transform: translateY(220px) scale(1); opacity: 0; }
    }
    @keyframes jump {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-30px) scaleY(1.05); }
    }
    .jump-happy { animation: jump 0.4s 2 ease-out; }
    @keyframes happyDance {
        0% { transform: translateY(0) rotate(-5deg); }
        100% { transform: translateY(-15px) rotate(5deg); }
    }
</style>
</head>
<body>

<div id="screen-splash">
    <div class="logo-container">
        <img class="logo-img" src="assets/logo.png" onerror="this.style.display='none'; document.getElementById('brand-fallback').style.display='flex';" alt="Innovine Logo">
        <div id="brand-fallback" class="logo-fallback" style="display:none;">I</div>
    </div>
    <div class="splash-loader">
        <div class="splash-loader-bar"></div>
    </div>
</div>

<div class="game-container">
    
    <div id="main-game-wrapper">
        <div class="grass-floor">
            <span>🌸</span><span>🌼</span><span>🌸</span><span>🌼</span><span>🌸</span><span>🌼</span>
        </div>

        <div id="live-companion" class="live-companion-box" style="display:none;">
            <div id="reward-snack" class="falling-snack">🍌</div>
            <div id="companion-wrapper" class="companion-wrapper">
                <img id="companion-avatar" class="companion-img" src="assets/rabbit.
