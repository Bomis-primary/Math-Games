<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Master: 100 to 200</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    /* Level 1 Default Background Theme */
    background: linear-gradient(to bottom, #ffeb3b 0%, #fffde7 40%, #4fc3f7 40%, #0288d1 100%);
    color: #333;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    position: relative;
    transition: background 0.5s ease;
}

body::before {
    content: "🚀";
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: clamp(50px, 10vw, 80px);
    z-index: 1;
}

#splashScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    transition: opacity 0.3s ease-out;
}
#splashScreen img { max-width: 80%; max-height: 60%; object-fit: contain; }

#gameContainer {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 2;
}

.level-badge {
    background: #e91e63;
    color: white;
    padding: 8px 28px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: background-color 0.3s;
}

h1 {
    margin: 15px 0 5px 0;
    font-size: clamp(28px, 6vw, 42px);
    color: #1a237e;
    text-shadow: 0px 2px 4px rgba(255,255,255,0.8);
}

.instruction {
    margin: 0 0 25px 0;
    font-size: clamp(18px, 4vw, 26px);
    color: #b71c1c;
    font-weight: bold;
    max-width: 90%;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
}

/* Sequence Displays */
.sequence-board {
    background: #283593;
    border: 8px solid #1a237e;
    border-radius: 28px;
    padding: 30px 20px;
    margin-bottom: 35px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    gap: 15px;
    width: 92vw;
    max-width: 600px;
    box-sizing: border-box;
    transition: background-color 0.3s, border-color 0.3s;
}

.number-node {
    flex: 1;
    max-width: 140px;
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 20px;
    border: 5px solid #ffb74d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 5vw, 38px);
    font-weight: bold;
    color: #1565c0;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    position: relative;
    transition: transform 0.2s, background-color 0.3s, border-color 0.3s;
}

.number-node.missing-target {
    background: rgba(255, 255, 255, 0.15);
    border: 5px dashed #fff;
    color: #ffd166;
}

/* Choice Bank Options */
.options-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    width: 94vw;
    max-width: 620px;
    margin-top: 10px;
}

.option-card {
    flex: 1;
    max-width: 130px;
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border: 5px solid #fff;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 5vw, 36px);
    font-weight: bold;
    color: #2e7d32;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    transition: transform 0.2s, background-color 0.2s, color 0.2s;
}
.option-card:hover { transform: scale(1.08); }

/* Playful cartoon animations */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
}
.shake-wrong {
    animation: shake 0.4s ease-in-out;
}

@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
}
.pop-correct {
    animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes bounceText {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}
.bounce-title {
    animation: bounceText 0.8s infinite ease-in-out;
}

.btn {
    padding: 16px 55px;
    margin: 35px 0 20px 0;
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: #ff5722;
    color: white;
    box-shadow: 0 6px 14px rgba(255, 87, 34, 0.4);
    transition: transform 0.1s;
}
.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

#fireworks { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }

#winScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(26, 35, 126, 0.98);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
#winScreen h1 { font-size: clamp(40px, 9vw, 64px); color: #ffd166; margin: 0 0 15px 0; }
</style>
</head>
<body>

<div id="splashScreen">
    <img src="assets/logo.png" alt="💥 Number Quest 100-200 💥" style="font-size: 32px; font-weight: bold; color: #1a237e;">
</div>

<div id="gameContainer">
    <div id="levelBadge" class="level-badge">LEVEL 1</div>
    <h1 id="gameTitle">Number Sequence Machine</h1>
    <p id="gameInstruction" class="instruction">Find the missing sequence value!</p>

    <div class="sequence-board" id="sequenceBoard">
        </div>
    
    <div class="options-container" id="optionsContainer">
        </div>

    <button id="actionControl" class="btn" onclick="advanceNextRound()" disabled>Next ➡️</button>
</div>

<canvas id="fireworks"></canvas>

<div id="winScreen">
    <h1 id="winHeader" class="bounce-title">CHALLENGE MET! 🎉</h1>
    <p id="winMessage" style="font-size:24px; color:#e0f2f1; margin:0 0 30px 0;">Outstanding number sequencing skills!</p>
    <button class="btn" style="background:#e91e63; box-shadow:0 6px 14px rgba(233,30,99,0.4);" onclick="handleOverlayReset()">Play Again 🔄</button>
</div>

<audio id="winMusic" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0b6b6b5c3.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<audio id="correctSound" preload="auto" src="assets/correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="assets/wrong.mp3"></audio>

<script>
const winMusic = document.getElementById("winMusic");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

// Unified Game State Matrix
let currentLevel = 1; // Level 1 (100-130), Level 2 (131-170), Level 3 (171-200)
let currentRound = 0; // 0, 1, 2 rounds per level configuration
const totalRoundsPerLevel = 3;

let correctAnswer = 0;
let winInterval = null;

// Level Dynamic Configuration Sets (Visual themes and math boundaries)
const levelConfigs = {
    1: {
        minRange: 100, maxRange: 128,
        bgStyle: "linear-gradient(to bottom, #ffeb3b 0%, #fffde7 40%, #4fc3f7 40%, #0288d1 100%)",
        boardColor: "#283593", boardBorder: "#1a237e", badgeColor: "#e91e63",
        modeName: "WHAT COMES AFTER?", missingIndex: 2
    },
    2: {
        minRange: 131, maxRange: 168,
        bgStyle: "linear-gradient(to bottom, #a8ff78 0%, #78ffd6 40%, #11998e 40%, #38ef7d 100%)",
        boardColor: "#1b5e20", boardBorder: "#0d5316", badgeColor: "#ff9800",
        modeName: "WHAT COMES BEFORE?", missingIndex: 0
    },
    3: {
        minRange: 171, maxRange: 197,
        bgStyle: "linear-gradient(to bottom, #ff9966 0%, #ff5e62 40%, #8e2de2 40%, #4a00e0 100%)",
        boardColor: "#4a148c", boardBorder: "#310c61", badgeColor: "#9c27b0",
        modeName: "WHAT COMES BETWEEN?", missingIndex: 1
    }
};

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const splash = document.getElementById("splashScreen");
        const container = document.getElementById("gameContainer");
        splash.style.opacity = "0";
        setTimeout(() => {
            splash.style.display = "none";
            container.style.display = "flex";
            initGame();
        }, 300);
    }, 1200); 
});

function initGame() {
    currentLevel = 1;
    currentRound = 0;
    loadRound();
}

function updateVisualTheme(cfg) {
    document.body.style.background = cfg.bgStyle;
    
    const board = document.getElementById("sequenceBoard");
    board.style.backgroundColor = cfg.boardColor;
    board.style.borderColor = cfg.boardBorder;
    
    const badge = document.getElementById("levelBadge");
    badge.style.backgroundColor = cfg.badgeColor;
}

function loadRound() {
    document.getElementById("actionControl").disabled = true;
    const cfg = levelConfigs[currentLevel];
    
    // Update structural layout styling per level configuration
    updateVisualTheme(cfg);
    
    // Update Badge descriptive text
    document.getElementById("levelBadge").innerText = `LEVEL ${currentLevel}: ${cfg.modeName} (${currentRound + 1}/${totalRoundsPerLevel})`;

    // Generate strict boundaries based on calculation parameters
    let startNum = Math.floor(Math.random() * (cfg.maxRange - cfg.minRange)) + cfg.minRange; 
    let sequence = [startNum, startNum + 1, startNum + 2];
    
    let missingIndex = cfg.missingIndex;
    correctAnswer = sequence[missingIndex];

    const board = document.getElementById("sequenceBoard");
    board.innerHTML = "";
    
    sequence.forEach((num, idx) => {
        const node = document.createElement("div");
        if (idx === missingIndex) {
            node.className = "number-node missing-target";
            node.id = "targetSlot";
            node.innerText = "?";
        } else {
            node.className = "number-node";
            node.innerText = num;
        }
        board.appendChild(node);
    });

    let choices = [correctAnswer];
    while (choices.length < 3) {
        let distractor = correctAnswer + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 4) + 1);
        if (distractor >= 100 && distractor <= 200 && !choices.includes(distractor)) {
            choices.push(distractor);
        }
    }
    choices.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById("optionsContainer");
    optionsContainer.innerHTML = "";
    choices.forEach(val => {
        const card = document.createElement("div");
        card.className = "option-card";
        card.innerText = val;
        card.onclick = () => handleChoiceSelection(card, val);
        optionsContainer.appendChild(card);
    });
}

function handleChoiceSelection(selectedCard, chosenValue) {
    if (chosenValue === correctAnswer) {
        correctSound.currentTime = 0;
        correctSound.play().catch(e => {});
        
        const target = document.getElementById("targetSlot");
        target.innerText = correctAnswer;
        target.style.background = "#81c784";
        target.style.color = "#fff";
        target.style.borderColor = "#2e7d32";
        target.style.borderStyle = "solid";
        target.classList.add("pop-correct");
        
        const rect = target.getBoundingClientRect();
        burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 25);
        
        document.querySelectorAll('.option-card').forEach(c => c.onclick = null);
        document.getElementById("actionControl").disabled = false;
    } else {
        wrongSound.currentTime = 0;
        wrongSound.play().catch(e => {});
        
        selectedCard.style.backgroundColor = "#ffcdd2";
        selectedCard.style.color = "#c62828";
        selectedCard.classList.add("shake-wrong");
        
        setTimeout(() => {
            selectedCard.classList.remove("shake-wrong");
            selectedCard.style.backgroundColor = "#ffffff";
            selectedCard.style.color = "#2e7d32";
        }, 500);
    }
}

function advanceNextRound() {
    currentRound++;
    if (currentRound < totalRoundsPerLevel) {
        loadRound();
    } else {
        if (currentLevel < 3) {
            currentLevel++;
            currentRound = 0;
            // Pop transition celebratory fireworks burst between core levels
            burstParticles(window.innerWidth / 2, window.innerHeight / 3, 45);
            loadRound();
        } else {
            triggerWinCelebration();
        }
    }
}

function triggerWinCelebration() {
    document.getElementById("winScreen").style.display = "flex";
    winMusic.currentTime = 0;
    winMusic.play().catch(e => {});
    
    triggerFullRainBurst();
    winInterval = setInterval(triggerFullRainBurst, 600);
}

function handleOverlayReset() {
    document.getElementById("winScreen").style.display = "none";
    if (winInterval) clearInterval(winInterval);
    particles = [];
    initGame();
}

/* Particle engine handling card pop bursts and fullscreen confetti showers */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

function burstParticles(x, y, count) {
    const hues = [0, 45, 120, 200, 280, 320]; 
    for(let i = 0; i < count; i++){
        let angle = Math.random() * 2 * Math.PI;
        let speed = Math.random() * 5 + 2;
        let hue = hues[Math.floor(Math.random() * hues.length)];
        particles.push({ 
            x: x, 
            y: y, 
            vx: Math.cos(angle) * speed, 
            vy: Math.sin(angle) * speed, 
            radius: Math.random() * 3 + 2, 
            alpha: 1, 
            color: `hsla(${hue}, 100%, 60%, `, 
            gravity: 0.06 
        });
    }
}

function triggerFullRainBurst() {
    const randomX = Math.random() * canvas.width;
    const randomY = Math.random() * (canvas.height * 0.4) + (canvas.height * 0.1);
    burstParticles(randomX, randomY, 35);
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { 
        p.x += p.vx; 
        p.y += p.vy; 
        p.vy += p.gravity; 
        p.alpha -= 0.014; 
    });
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => {
        ctx.fillStyle = `${p.color}${p.alpha})`;
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); 
        ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
