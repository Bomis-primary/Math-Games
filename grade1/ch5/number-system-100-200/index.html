<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Number Train 100–200 Quest</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Comic Sans MS',Arial,sans-serif;background:#bdeeff;color:#222;overflow-x:hidden}
.screen{display:none;min-height:100vh;padding:18px;text-align:center}
.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,.93);border-radius:24px;padding:22px;max-width:850px;width:95%;box-shadow:0 10px 25px rgba(0,0,0,.18)}
.logo{max-width:150px;margin-bottom:12px}
h1{color:#174ea6;font-size:clamp(28px,5vw,48px);margin:10px 0}
h2{color:#0b8043;font-size:clamp(22px,4vw,34px)}
button{border:0;border-radius:18px;padding:14px 24px;font-size:20px;font-weight:bold;cursor:pointer;background:#ffbf00;color:#4a2b00;box-shadow:0 5px 0 #c58b00;margin:8px}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c58b00}
.game-area{position:relative;min-height:100vh;background:url("assets/background.png") center/cover no-repeat;padding:12px;overflow:hidden}
.cloud{position:absolute;width:150px;opacity:.9;animation:floatCloud 22s linear infinite}
.cloud.one{top:30px;left:-160px}
.cloud.two{top:90px;left:-300px;animation-delay:7s}
@keyframes floatCloud{to{transform:translateX(130vw)}}
.topbar{display:flex;gap:8px;justify-content:space-between;align-items:center;max-width:950px;margin:0 auto 8px;background:rgba(255,255,255,.9);border-radius:16px;padding:10px;font-weight:bold}
.timer{color:#d93025}.score{color:#188038}.attempts{color:#174ea6}
.progress-wrap{height:18px;background:#fff;border-radius:20px;overflow:hidden;max-width:950px;margin:8px auto}
.progress{height:100%;width:0;background:linear-gradient(90deg,#34a853,#fbbc04);transition:.4s}
.track-zone{position:relative;max-width:950px;height:170px;margin:5px auto}
.track{position:absolute;bottom:0;left:0;width:100%;height:90px;object-fit:cover}
.train{position:absolute;bottom:42px;left:2%;width:180px;transition:.5s ease}
.question-card{max-width:850px;margin:10px auto;background:rgba(255,255,255,.95);border-radius:24px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.qno{font-size:18px;color:#666}
.question{font-size:clamp(22px,4vw,34px);font-weight:bold;margin:12px 0}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.option{background:#fff;border:4px solid #74b9ff;border-radius:18px;padding:18px;font-size:24px;font-weight:bold;cursor:pointer;min-height:70px}
.option:hover{background:#eaf6ff}
.feedback{min-height:44px;font-size:20px;font-weight:bold;margin-top:10px}
.correct{color:#188038}.wrong{color:#d93025}
.final-badge{background:#ffef99;border:3px dashed #fbbc04;padding:8px 14px;border-radius:14px;display:inline-block;margin-bottom:8px;font-weight:bold}
.result-stars{font-size:46px}
@media(max-width:600px){
.options{grid-template-columns:1fr}
.train{width:135px}
.track-zone{height:135px}
.topbar{font-size:14px;flex-wrap:wrap;justify-content:center}
}
.confetti{position:fixed;width:10px;height:10px;top:-10px;animation:fall 1.8s linear forwards;z-index:99}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<section id="start" class="screen active">
  <div class="card">
    <img src="assets/logo.png" class="logo" onerror="this.style.display='none'">
    <h1>🚂 Number Train 100–200 Quest</h1>
    <h2>Grade 1 Maths — Number System 100 to 200</h2>
    <p>Help the train travel through Hundred Town by solving number challenges.</p>
    <p><b>Rules:</b> You get 60 seconds and 2 attempts for each question.</p>
    <button onclick="startGame()">Start Quest</button>
  </div>
</section>

<section id="game" class="screen game-area">
  <img src="assets/clouds.png" class="cloud one">
  <img src="assets/clouds.png" class="cloud two">

  <div class="topbar">
    <div class="timer">⏱ Time: <span id="time">60</span>s</div>
    <div class="score">⭐ Score: <span id="score">0</span></div>
    <div class="attempts">🔁 Attempts Left: <span id="attempts">2</span></div>
  </div>

  <div class="progress-wrap"><div id="progress" class="progress"></div></div>

  <div class="track-zone">
    <img src="assets/track.png" class="track">
    <img src="assets/train.png" id="train" class="train">
  </div>

  <div class="question-card">
    <div id="finalBadge" class="final-badge" style="display:none;">Final Challenge</div>
    <div class="qno">Question <span id="qnum">1</span> of <span id="total"></span></div>
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>
  </div>
</section>

<section id="result" class="screen">
  <div class="card">
    <img src="assets/stars.png" style="max-width:140px" onerror="this.style.display='none'">
    <h1>Quest Complete!</h1>
    <div id="resultStars" class="result-stars"></div>
    <h2 id="finalScore"></h2>
    <p id="resultMsg"></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</section>

<audio id="correctSound" src="assets/freesound_community-claps-44774.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const questions = [
  {q:"The train coaches are 141, __, 143. Which number is missing?",options:["140","142","144","145"],answer:"142",hint:"Count forward from 141."},
  {q:"Which number comes just before 170?",options:["168","169","171","172"],answer:"169",hint:"Before means one less."},
  {q:"Which number comes just after 189?",options:["188","190","191","199"],answer:"190",hint:"After means one more."},
  {q:"A number has 1 hundred, 2 tens and 5 ones. What is the number?",options:["152","125","215","105"],answer:"125",hint:"1 hundred = 100, 2 tens = 20, 5 ones = 5."},
  {q:"What is the expanded form of 146?",options:["100 + 40 + 6","100 + 6 + 40","10 + 40 + 6","100 + 400 + 6"],answer:"100 + 40 + 6",hint:"Look at hundreds, tens and ones."},
  {q:"What is the short form of 100 + 80 + 3?",options:["108","183","138","180"],answer:"183",hint:"100, 80 and 3 together make 183."},
  {q:"Which number is greatest?",options:["158","185","123","146"],answer:"185",hint:"Compare the tens after the hundred."},
  {q:"Choose the correct sign: 124 __ 118",options:["<",">","=","+"],answer:">",hint:"124 is bigger than 118."},
  {q:"Which order is ascending?",options:["109, 123, 146","146, 123, 109","123, 109, 146","146, 109, 123"],answer:"109, 123, 146",hint:"Ascending means smallest to greatest."},
  {q:"Which ordinal number means tenth?",options:["1st","5th","10th","20th"],answer:"10th",hint:"Tenth is written as 10th."},
  {q:"Final: I have 1 in the hundreds place, no tens and 5 ones. Who am I?",options:["105","150","115","100"],answer:"105",hint:"No tens means 0 in the tens place.",final:true},
  {q:"Final: Which statement is correct?",options:["192 < 187","121 > 147","158 = 158","133 > 149"],answer:"158 = 158",hint:"Equal numbers use =.",final:true}
];

let current = 0, score = 0, attempts = 2, timeLeft = 60, timer;

function startGame(){
  document.getElementById("start").classList.remove("active");
  document.getElementById("game").classList.add("active");
  document.getElementById("total").textContent = questions.length;
  loadQuestion();
}

function loadQuestion(){
  clearInterval(timer);
  attempts = 2;
  timeLeft = 60;
  document.getElementById("time").textContent = timeLeft;
  document.getElementById("attempts").textContent = attempts;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("qnum").textContent = current + 1;

  const q = questions[current];
  document.getElementById("question").textContent = q.q;
  document.getElementById("finalBadge").style.display = q.final ? "inline-block" : "none";

  const optionsBox = document.getElementById("options");
  optionsBox.innerHTML = "";
  const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

  shuffledOptions.forEach(opt=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;
    div.onclick = ()=>checkAnswer(opt, div);
    optionsBox.appendChild(div);
  });

  updateProgress();
  moveTrain();
  timer = setInterval(updateTimer,1000);
}

function updateTimer(){
  timeLeft--;
  document.getElementById("time").textContent = timeLeft;
  if(timeLeft<=0){
    clearInterval(timer);
    showCorrect("Time is up!");
  }
}

function checkAnswer(selected, element){
  const q = questions[current];
  if(selected === q.answer){
    clearInterval(timer);
    score++;
    document.getElementById("score").textContent = score;
    element.style.background = "#d7ffd9";
    element.style.borderColor = "#34a853";
    document.getElementById("feedback").textContent = "Correct! The train moves ahead!";
    document.getElementById("feedback").className = "feedback correct";
    playSound("correctSound");
    confetti();
    setTimeout(nextQuestion,1200);
  } else {
    attempts--;
    document.getElementById("attempts").textContent = attempts;
    element.style.background = "#ffe0e0";
    element.style.borderColor = "#d93025";
    playSound("wrongSound");

    if(attempts > 0){
      document.getElementById("feedback").textContent = "Try again! Hint: " + q.hint;
      document.getElementById("feedback").className = "feedback wrong";
    } else {
      clearInterval(timer);
      showCorrect("Good try!");
    }
  }
}

function showCorrect(prefix){
  const q = questions[current];
  document.getElementById("feedback").textContent = `${prefix} Correct answer: ${q.answer}`;
  document.getElementById("feedback").className = "feedback wrong";
  setTimeout(nextQuestion,1800);
}

function nextQuestion(){
  current++;
  if(current >= questions.length){ endGame(); }
  else{ loadQuestion(); }
}

function updateProgress(){
  document.getElementById("progress").style.width = ((current / questions.length) * 100) + "%";
}

function moveTrain(){
  const percent = (current / (questions.length - 1)) * 70;
  document.getElementById("train").style.left = `${2 + percent}%`;
}

function endGame(){
  clearInterval(timer);
  document.getElementById("game").classList.remove("active");
  document.getElementById("result").classList.add("active");
  document.getElementById("finalScore").textContent = `Your Score: ${score} / ${questions.length}`;

  const percent = score / questions.length;
  document.getElementById("resultStars").textContent = percent >= .85 ? "⭐⭐⭐" : percent >= .6 ? "⭐⭐" : "⭐";
  document.getElementById("resultMsg").textContent =
    percent >= .85 ? "Excellent! You are a Hundred Town Champion!" :
    percent >= .6 ? "Good work! Practise a little more and try again." :
    "Nice try! Replay the quest to strengthen your number skills.";
}

function restartGame(){
  clearInterval(timer);
  current = 0;
  score = 0;
  attempts = 2;
  document.getElementById("score").textContent = score;
  document.getElementById("result").classList.remove("active");
  document.getElementById("game").classList.add("active");
  loadQuestion();
}

function playSound(id){
  const sound = document.getElementById(id);
  if(sound){
    sound.currentTime = 0;
    sound.play().catch(()=>{});
  }
}

function confetti(){
  for(let i=0;i<25;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = ["#fbbc04","#34a853","#4285f4","#ea4335","#ff69b4"][Math.floor(Math.random()*5)];
    c.style.animationDelay = Math.random()*0.3 + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}
</script>
</body>
</html>
