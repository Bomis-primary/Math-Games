<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Master Quest: 100 to 200</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #ffeb3b 0%, #fffde7 40%, #4fc3f7 40%, #0288d1 100%);
    color: #333;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    position: relative;
    transition: background 0.6s ease;
}

body::before {
    content: "👑";
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: clamp(50px, 10vw, 80px);
    z-index: 1;
}

#splashScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    transition: opacity 0.3s ease-out;
}
#splashScreen img { max-width: 80%; max-height: 60%; object-fit: contain; }

#gameContainer {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 2;
}

.level-badge {
    background: #e91e63;
    color: white;
    padding: 8px 28px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: background-color 0.3s;
}

h1 {
    margin: 15px 0 5px 0;
    font-size: clamp(28px, 6vw, 42px);
    color: #1a237e;
    text-shadow: 0px 2px 4px rgba(255,255,255,0.8);
    transition: color 0.4s;
}

.instruction {
    margin: 0 0 25px 0;
    font-size: clamp(18px, 4vw, 26px);
    color: #b71c1c;
    font-weight: bold;
    max-width: 90%;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    transition: color 0.4s;
}

/* Master Core Display Boards */
.game-board {
    background: #283593;
    border: 8px solid #1a237e;
    border-radius: 28px;
    padding: 30px 20px;
    margin-bottom: 35px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    width: 92vw;
    max-width: 600px;
    min-height: 160px;
    box-sizing: border-box;
    transition: background-color 0.4s, border-color 0.4s;
}

.number-node {
    flex: 1;
    max-width: 140px;
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 20px;
    border: 5px solid #ffb74d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 5vw, 38px);
    font-weight: bold;
    color: #1565c0;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    position: relative;
    transition: transform 0.2s, background-color 0.3s, border-color 0.3s, color 0.3s, border-style 0.1s;
}

.number-node.missing-target {
    background: rgba(255, 255, 255, 0.15);
    border: 5px dashed #fff;
    color: #ffd166;
}

/* Specialized nodes for comparisons and long formulas */
.expansion-node {
    font-size: clamp(26px, 5vw, 42px);
    color: #fff;
    font-weight: bold;
    text-shadow: 0 3px 6px rgba(0,0,0,0.4);
    transition: color 0.4s;
}

.symbol-slot {
    width: 90px;
    height: 90px;
    background: rgba(255,255,255,0.2);
    border: 4px dashed #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: #ffeb3b;
}

/* Choice Bank Tray */
.options-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    width: 94vw;
    max-width: 620px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.option-card {
    flex: 1;
    min-width: 100px;
    max-width: 180px;
    padding: 15px 10px;
    background: #ffffff;
    border: 5px solid #fff;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(22px, 4.5vw, 34px);
    font-weight: bold;
    color: #2e7d32;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    transition: transform 0.2s, background-color 0.2s, color 0.2s, border-color 0.2s;
}
.option-card:hover { transform: scale(1.06); }

/* Animation triggers */
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
}
.shake-wrong { animation: shake 0.4s ease-in-out; }

@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
}
.pop-correct { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

@keyframes bounceText {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}
.bounce-title { animation: bounceText 0.8s infinite ease-in-out; }

.btn {
    padding: 16px 55px;
    margin: 35px 0 20px 0;
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: #ff5722;
    color: white;
    box-shadow: 0 6px 14px rgba(255, 87, 34, 0.4);
    transition: transform 0.1s, background-color 0.3s;
}
.btn:active { transform: scale(0.95); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

#fireworks { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }

#winScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(26, 35, 126, 0.98);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
#winScreen h1 { font-size: clamp(40px, 9vw, 64px); color: #ffd166; margin: 0 0 15px 0; }
</style>
</head>
<body>

<div id="splashScreen">
    <img src="assets/logo.png" alt="💥 Number Quest 100-200 💥" style="font-size: 32px; font-weight: bold; color: #1a237e;">
</div>

<div id="gameContainer">
    <div id="levelBadge" class="level-badge">LEVEL 1</div>
    <h1 id="gameTitle">Number Quest Machine</h1>
    <p id="gameInstruction" class="instruction">Loading your goal...</p>

    <div class="game-board" id="masterBoard">
        </div>
    
    <div class="options-container" id="optionsContainer">
        </div>

    <button id="actionControl" class="btn" onclick="advanceNextRound()" disabled>Next ➡️</button>
</div>

<canvas id="fireworks"></canvas>

<div id="winScreen">
    <h1 id="winHeader" class="bounce-title">QUEST COMPLETED! 🏆</h1>
    <p id="winMessage" style="font-size:24px; color:#e0f2f1; margin:0 0 30px 0;">You are officially a 100-200 Number Master!</p>
    <button class="btn" style="background:#e91e63; box-shadow:0 6px 14px rgba(233,30,99,0.4);" onclick="handleOverlayReset()">Play Again 🔄</button>
</div>

<audio id="winMusic" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0b6b6b5c3.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<audio id="correctSound" preload="auto" src="assets/correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="assets/wrong.mp3"></audio>

<script>
const winMusic = document.getElementById("winMusic");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

// Global Unified State Architecture
let currentLevel = 1; // 1: Sequence Engine, 2: Expanded Reactor Engine, 3: Crocodile Compare Engine
let currentRound = 0; 
const totalRoundsPerLevel = 3;

let correctAnswerText = "";
let winInterval = null;

// The Configuration Matrix defining visual assets and level paradigms
const levelThemes = {
    1: {
        bgStyle: "linear-gradient(to bottom, #ffeb3b 0%, #fffde7 40%, #4fc3f7 40%, #0288d1 100%)",
        boardColor: "#283593", boardBorder: "#1a237e", badgeColor: "#e91e63",
        title: "Number Sequence Machine", instruction: "Find the missing sequence number!",
        titleColor: "#1a237e", instructionColor: "#b71c1c"
    },
    2: {
        /* Level 2: Vibrant Green Lime Jungle / Laboratory Theme */
        bgStyle: "linear-gradient(to bottom, #d4fc79 0%, #96e6a1 30%, #1b5e20 70%, #0c3311 100%)",
        boardColor: "#114d16", boardBorder: "#39ff14", badgeColor: "#00e676",
        title: "Expanded Form Reactor 🧪", instruction: "Break down the target number into Hundreds, Tens, and Ones!",
        titleColor: "#ccff00", instructionColor: "#ffffff"
    },
    3: {
        bgStyle: "linear-gradient(to bottom, #ff9966 0%, #ff5e62 40%, #8e2de2 40%, #4a00e0 100%)",
        boardColor: "#4a148c", boardBorder: "#310c61", badgeColor: "#9c27b0",
        title: "Number Comparison Arena", instruction: "Choose the correct sign to match the values!",
        titleColor: "#1a237e", instructionColor: "#b71c1c"
    }
};

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const splash = document.getElementById("splashScreen");
        const container = document.getElementById("gameContainer");
        splash.style.opacity = "0";
        setTimeout(() => {
            splash.style.display = "none";
            container.style.display = "flex";
            initGame();
        }, 300);
    }, 1200); 
});

function initGame() {
    currentLevel = 1;
    currentRound = 0;
    loadRoundEngine();
}

function updateLayoutTheme(cfg) {
    document.body.style.background = cfg.bgStyle;
    
    const gameTitle = document.getElementById("gameTitle");
    gameTitle.innerText = cfg.title;
    gameTitle.style.color = cfg.titleColor || "#1a237e";

    const gameInstruction = document.getElementById("gameInstruction");
    gameInstruction.innerText = cfg.instruction;
    gameInstruction.style.color = cfg.instructionColor || "#b71c1c";
    
    const board = document.getElementById("masterBoard");
    board.style.backgroundColor = cfg.boardColor;
    board.style.borderColor = cfg.boardBorder;
    
    const badge = document.getElementById("levelBadge");
    badge.style.backgroundColor = cfg.badgeColor;
}

function loadRoundEngine() {
    document.getElementById("actionControl").disabled = true;
    const cfg = levelThemes[currentLevel];
    updateLayoutTheme(cfg);
    
    // Set informative badge string headers
    document.getElementById("levelBadge").innerText = `LEVEL ${currentLevel} - ROUND ${currentRound + 1}/${totalRoundsPerLevel}`;

    const board = document.getElementById("masterBoard");
    const optionsContainer = document.getElementById("optionsContainer");
    board.innerHTML = "";
    optionsContainer.innerHTML = "";

    // BRANCH: Execute specialized Level Builder Engine depending on active index
    if (currentLevel === 1) {
        buildSequenceRound(board, optionsContainer);
    } else if (currentLevel === 2) {
        buildExpansionRound(board, optionsContainer);
    } else if (currentLevel === 3) {
        buildComparisonRound(board, optionsContainer);
    }
}

/* ==========================================
   LEVEL 1 GENERATOR ENGINE: SEQUENCING
   ========================================== */
function buildSequenceRound(board, optionsContainer) {
    let startNum = Math.floor(Math.random() * 90) + 101; 
    let sequence = [startNum, startNum + 1, startNum + 2];
    
    let missingIndex = currentRound === 0 ? 2 : (currentRound === 1 ? 0 : 1);
    let correctValue = sequence[missingIndex];
    correctAnswerText = correctValue.toString();

    sequence.forEach((num, idx) => {
        const node = document.createElement("div");
        if (idx === missingIndex) {
            node.className = "number-node missing-target";
            node.id = "targetSlot";
            node.innerText = "?";
        } else {
            node.className = "number-node";
            node.innerText = num;
        }
        board.appendChild(node);
    });

    let choices = [correctValue];
    while (choices.length < 3) {
        let distractor = correctValue + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1);
        if (distractor >= 100 && distractor <= 200 && !choices.includes(distractor)) {
            choices.push(distractor);
        }
    }
    choices.sort(() => Math.random() - 0.5);

    choices.forEach(val => {
        const card = document.createElement("div");
        card.className = "option-card";
        card.innerText = val;
        card.onclick = () => verifyPlayerInput(card, val.toString(), () => {
            const target = document.getElementById("targetSlot");
            target.innerText = correctAnswerText;
            target.style.background = "#81c784";
            target.style.color = "#fff";
            target.style.borderColor = "#2e7d32";
            target.style.borderStyle = "solid";
            target.classList.add("pop-correct");
        });
        optionsContainer.appendChild(card);
    });
}

/* ==========================================
   LEVEL 2 GENERATOR ENGINE: EXPANDED FORM (LIME LAB)
   ========================================== */
function buildExpansionRound(board, optionsContainer) {
    let targetNum = Math.floor(Math.random() * 99) + 101; // Range: 101-200
    
    let hundreds = Math.floor(targetNum / 100) * 100;
    let tens = Math.floor((targetNum % 100) / 10) * 10;
    let ones = targetNum % 10;
    
    correctAnswerText = `${hundreds} + ${tens} + ${ones}`;

    // Target visual reactor layout
    const targetNode = document.createElement("div");
    targetNode.className = "number-node";
    targetNode.style.maxWidth = "160px";
    targetNode.style.borderColor = "#39ff14";
    targetNode.style.backgroundColor = "#0d3c11";
    targetNode.style.color = "#fff";
    targetNode.innerText = targetNum;
    board.appendChild(targetNode);

    const equalSign = document.createElement("div");
    equalSign.className = "expansion-node";
    equalSign.style.color = "#39ff14";
    equalSign.innerText = "=";
    board.appendChild(equalSign);

    const slotNode = document.createElement("div");
    slotNode.className = "number-node missing-target";
    slotNode.id = "targetSlot";
    slotNode.style.maxWidth = "280px";
    slotNode.style.aspectRatio = "auto";
    slotNode.style.padding = "10px 25px";
    slotNode.style.borderColor = "#39ff14";
    slotNode.innerText = "? + ? + ?";
    board.appendChild(slotNode);

    // Build unique option selections matching theme architecture
    let choices = [correctAnswerText];
    while (choices.length < 3) {
        let fakeNum = Math.floor(Math.random() * 99) + 101;
        let fH = Math.floor(fakeNum / 100) * 100;
        let fT = Math.floor((fakeNum % 100) / 10) * 10;
        let fO = fakeNum % 10;
        let fakeOption = `${fH} + ${fT} + ${fO}`;
        if (!choices.includes(fakeOption)) {
            choices.push(fakeOption);
        }
    }
    choices.sort(() => Math.random() - 0.5);

    choices.forEach(formula => {
        const card = document.createElement("div");
        card.className = "option-card";
        card.style.maxWidth = "240px";
        card.style.borderColor = "#1b5e20";
        card.style.color = "#1b5e20";
        card.innerText = formula;
        card.onclick = () => verifyPlayerInput(card, formula, () => {
            const target = document.getElementById("targetSlot");
            target.innerText = correctAnswerText;
            target.style.background = "#39ff14";
            target.style.color = "#000";
            target.style.borderColor = "#fff";
            target.style.fontSize = "clamp(18px, 3.5vw, 26px)";
            target.style.borderStyle = "solid";
            target.classList.add("pop-correct");
        });
        optionsContainer.appendChild(card);
    });
}

/* ==========================================
   LEVEL 3 GENERATOR ENGINE: COMPARISONS (<, >)
   ========================================== */
function buildComparisonRound(board, optionsContainer) {
    let numA = Math.floor(Math.random() * 90) + 105;
    let numB = Math.floor(Math.random() * 90) + 105;
    while (numA === numB) {
        numB = Math.floor(Math.random() * 90) + 105;
    }

    correctAnswerText = numA > numB ? ">" : "<";

    const nodeA = document.createElement("div");
    nodeA.className = "number-node";
    nodeA.innerText = numA;
    board.appendChild(nodeA);

    const slotNode = document.createElement("div");
    slotNode.className = "symbol-slot";
    slotNode.id = "targetSlot";
    slotNode.innerText = "?";
    board.appendChild(slotNode);

    const nodeB = document.createElement("div");
    nodeB.className = "number-node";
    nodeB.innerText = numB;
    board.appendChild(nodeB);

    const operationalChoices = [">", "<"];
    operationalChoices.forEach(symbol => {
        const card = document.createElement("div");
        card.className = "option-card";
        card.style.fontSize = "48px";
        card.innerText = symbol;
        card.onclick = () => verifyPlayerInput(card, symbol, () => {
            const target = document.getElementById("targetSlot");
            target.innerText = correctAnswerText;
            target.style.backgroundColor = "#ffeb3b";
            target.style.color = "#e65100";
            target.style.borderColor = "#e65100";
            target.style.borderStyle = "solid";
            target.classList.add("pop-correct");
        });
        optionsContainer.appendChild(card);
    });
}

/* ==========================================
   VALIDATION & STATE STEPPING MANAGEMENT
   ========================================== */
function verifyPlayerInput(selectedCard, alternativeValue, updateUIDelegate) {
    if (alternativeValue === correctAnswerText) {
        correctSound.currentTime = 0;
        correctSound.play().catch(e => {});
        
        updateUIDelegate();
        
        const target = document.getElementById("targetSlot");
        const rect = target.getBoundingClientRect();
        burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 28);
        
        document.querySelectorAll('.option-card').forEach(c => c.onclick = null);
        document.getElementById("actionControl").disabled = false;
    } else {
        wrongSound.currentTime = 0;
        wrongSound.play().catch(e => {});
        
        selectedCard.style.backgroundColor = "#ffcdd2";
        selectedCard.style.color = "#c62828";
        selectedCard.classList.add("shake-wrong");
        
        setTimeout(() => {
            selectedCard.classList.remove("shake-wrong");
            selectedCard.style.backgroundColor = "#ffffff";
            // Return to default active text coloring relative to level type
            selectedCard.style.color = currentLevel === 2 ? "#1b5e20" : "#2e7d32";
        }, 500);
    }
}

function advanceNextRound() {
    currentRound++;
    if (currentRound < totalRoundsPerLevel) {
        loadRoundEngine();
    } else {
        if (currentLevel < 3) {
            currentLevel++;
            currentRound = 0;
            
            // Core Level Transition screen flash celebration burst
            burstParticles(window.innerWidth / 2, window.innerHeight / 3, 50);
            loadRoundEngine();
        } else {
            triggerWinCelebration();
        }
    }
}

function triggerWinCelebration() {
    document.getElementById("winScreen").style.display = "flex";
    winMusic.currentTime = 0;
    winMusic.play().catch(e => {});
    
    triggerFullRainBurst();
    winInterval = setInterval(triggerFullRainBurst, 550);
}

function handleOverlayReset() {
    document.getElementById("winScreen").style.display = "none";
    if (winInterval) clearInterval(winInterval);
    particles = [];
    initGame();
}

/* High-Performance Canvas Confetti Particle Pipeline */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

function burstParticles(x, y, count) {
    // Inject extra bright greens if level 2 is playing to emphasize theme assets
    const hues = currentLevel === 2 ? [95, 120, 145, 60, 45, 135] : [15, 45, 135, 195, 275, 335]; 
    for(let i = 0; i < count; i++){
        let angle = Math.random() * 2 * Math.PI;
        let speed = Math.random() * 6 + 2.5;
        let hue = hues[Math.floor(Math.random() * hues.length)];
        particles.push({ 
            x: x, 
            y: y, 
            vx: Math.cos(angle) * speed, 
            vy: Math.sin(angle) * speed, 
            radius: Math.random() * 3 + 2.5, 
            alpha: 1, 
            color: `hsla(${hue}, 100%, 60%, `, 
            gravity: 0.07 
        });
    }
}

function triggerFullRainBurst() {
    const randomX = Math.random() * canvas.width;
    const randomY = Math.random() * (canvas.height * 0.4) + (canvas.height * 0.1);
    burstParticles(randomX, randomY, 35);
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { 
        p.x += p.vx; 
        p.y += p.vy; 
        p.vy += p.gravity; 
        p.alpha -= 0.013; 
    });
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => {
        ctx.fillStyle = `${p.color}${p.alpha})`;
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); 
        ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
