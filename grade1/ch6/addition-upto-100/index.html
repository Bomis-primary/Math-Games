<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grade 1: Sammy's Acorn Mission!</title>
    <style>
        :root {
            --primary-bg: #F4EBE1; 
            --card-bg: #FFFFFF;
            --text-color: #3E2723; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#D7CCC8 20%, transparent 20%);
            background-size: 20px 20px;
            padding: 10px;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease-in-out, visibility 0.5s;
            visibility: visible;
        }

        .splash-logo {
            max-width: 180px;
            height: auto;
        }

        /* --- RESPONSIVE MAIN CONTAINER --- */
        #game-container {
            width: 100%;
            max-width: 680px; 
            background: var(--card-bg);
            padding: 15px;
            border-radius: 28px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.12);
            border: 5px solid #8D6E63;
            text-align: center;
            display: none; 
            opacity: 0;
            transition: opacity 0.4s ease-in;
            position: relative;
        }

        .actor-img {
            width: 90px;
            height: auto;
            margin-bottom: 10px;
        }

        .mission-text {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            background: #FFE0B2;
            padding: 15px;
            border-radius: 16px;
            border: 2px dashed #FB8C00;
        }

        .start-btn {
            background: linear-gradient(135deg, #8D6E63, #5D4037);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #3E2723;
        }

        /* --- HEADER & PROGRESS --- */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            padding-right: 70px; /* Make space for the absolute corner basket */
        }

        .tracker-badge {
            background: #E8F5E9;
            padding: 5px 12px;
            border-radius: 12px;
            color: #2E7D32;
        }

        /* --- CORNER SCORE STASH BASKET --- */
        .corner-stash-area {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .stash-basket {
            font-size: 2.5rem;
            line-height: 1;
            position: relative;
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.15));
        }

        /* Floating collected acorns grid above/inside the basket */
        .collected-acorns-grid {
            width: 50px;
            min-height: 25px;
            display: flex;
            flex-wrap: wrap-reverse;
            justify-content: center;
            gap: 2px;
            margin-bottom: -5px;
        }

        .mini-stored-acorn {
            width: 12px;
            height: 12px;
            animation: dropIn 0.3s ease-out forwards;
        }

        @keyframes dropIn {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #E0E0E0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1.5px solid #BCAAA4;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #A1887F, #8D6E63);
            transition: width 0.3s ease;
        }

        .outcome-banner {
            font-size: 0.85rem;
            background: #ECEFF1;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: bold;
            color: #546E7A;
            text-transform: uppercase;
            display: inline-block;
        }

        .story-text-container {
            font-size: 1.05rem;
            background: #FFF3E0;
            padding: 12px;
            border-radius: 12px;
            border-left: 5px solid #FF9800;
            margin-bottom: 15px;
            text-align: left;
            line-height: 1.4;
        }

        /* --- PLAY ZONE --- */
        .visual-math-box {
            background: #FFF8E1;
            border: 3px dashed #FFB300;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 120px;
            flex-wrap: wrap; 
        }

        .side-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 5px;
            min-width: 110px;
            max-width: 240px;
        }

        .basket-target {
            position: relative;
            width: 50px;
            height: 50px;
            background: #EFEBE9;
            border: 2.5px solid #8D6E63;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            box-shadow: 0 3px 0 #5D4037;
            transition: transform 0.2s;
        }

        .basket-target.packed-bump {
            animation: packEffect 0.3s ease-out;
        }

        @keyframes packEffect {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); background-color: #FFE082; }
            100% { transform: scale(1); }
        }

        .basket-target::after {
            content: "10";
            position: absolute;
            bottom: -3px;
            right: -3px;
            font-size: 0.65rem;
            background: #D84315;
            color: #FFF;
            padding: 1px 3px;
            border-radius: 4px;
            font-weight: bold;
        }

        .acorn-draggable {
            width: 28px;
            height: auto;
            cursor: pointer;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.15));
            transition: transform 0.2s, opacity 0.2s;
            animation: floatHint 2s infinite alternate ease-in-out;
        }

        @keyframes floatHint {
            from { transform: translateY(0); }
            to { transform: translateY(-3px); }
        }

        .math-sign {
            font-size: 2.2rem;
            font-weight: bold;
            color: #E65100;
        }

        .equation-text {
            font-size: 2.4rem;
            color: #D84315;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #try-again-prompt {
            height: 20px;
            font-size: 1.05rem;
            font-weight: bold;
            color: #D32F2F;
            margin-bottom: 12px;
        }

        /* --- GRID TOUCH TARGETS --- */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-btn {
            background-color: #FFF;
            border: 3.5px solid #8D6E63;
            border-radius: 16px;
            padding: 14px 10px; 
            font-size: 1.6rem;
            font-weight: bold;
            color: #5D4037;
            cursor: pointer;
            box-shadow: 0 4px 0 #5D4037;
            -webkit-tap-highlight-color: transparent;
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5D4037;
        }

        .option-btn.correct {
            background-color: #4CAF50 !important;
            border-color: #2E7D32 !important;
            color: white !important;
            box-shadow: 0 4px 0 #2E7D32 !important;
        }

        .option-btn.wrong {
            background-color: #EF5350 !important;
            border-color: #C62828 !important;
            color: white !important;
            box-shadow: 0 4px 0 #C62828 !important;
        }

        #restart-btn {
            background: linear-gradient(135deg, #8D6E63, #5D4037);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #3E2723;
            display: none;
            margin: 15px auto 0 auto;
        }

        @media (max-width: 480px) {
            .equation-text { font-size: 2rem; }
            .option-btn { font-size: 1.4rem; padding: 12px 6px; }
            .visual-math-box { gap: 8px; }
            .math-sign { font-size: 1.8rem; }
            .game-header { padding-right: 55px; }
            .corner-stash-area { width: 50px; top: 10px; right: 10px; }
            .stash-basket { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Logo" class="splash-logo" onerror="this.src='https://placehold.co/150?text=Innovine'">
    </div>

    <div id="game-container">
        
        <!-- VISUAL CORNER BASKET SYSTEM -->
        <div class="corner-stash-area" id="corner-stash" style="display: none;">
            <div class="collected-acorns-grid" id="acorn-basket-pile"></div>
            <div class="stash-basket">🧺</div>
        </div>

        <!-- START SCREEN -->
        <div id="mission-screen">
            <img src="assets/squirrel.png" class="actor-img" onerror="this.src='https://placehold.co/90?text=🐿️'">
            <h2 style="font-size: 1.7rem; margin-bottom: 8px;">Help Sammy the Squirrel!</h2>
            <p class="mission-text">
                Winter is near! Tap loose acorns to pack them inside the baskets to count them easily, then tap the right answer button!
            </p>
            <button class="start-btn" onclick="startMission()">Let's Go! 🚀</button>
        </div>

        <!-- MAIN GAME PANEL -->
        <div id="play-screen" style="display: none;">
            <div class="game-header">
                <span id="question-number">🧩 Problem: 1/10</span>
                <span class="tracker-badge">Saved: <span id="acorn-count">0</span></span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <div class="outcome-banner" id="outcome-label">Outcome Tracker</div>
            <div class="story-text-container" id="story-container"></div>

            <!-- VISUAL PLAY ZONE -->
            <div class="visual-math-box">
                <div class="side-panel" id="left-panel"></div>
                <div class="math-sign">+</div>
                <div class="side-panel" id="right-panel"></div>
            </div>

            <div class="equation-text" id="equation-display">0 + 0 = ?</div>
            <div id="try-again-prompt"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- RESULTS END SCREEN -->
        <div id="result-screen" style="display:none;">
            <img src="assets/squirrel.png" class="actor-img" onerror="this.src='https://placehold.co/90?text=🐿️'">
            <h1 style="font-size: 2rem; color: #4CAF50; margin-bottom: 10px;">Mission Complete! 🏆</h1>
            <p id="score-display" style="font-size: 1.7rem; font-weight: bold; color: #EF6C00;"></p>
        </div>
        
        <button id="restart-btn" onclick="resetGame()">Play Again! 🌟</button>
    </div>

    <audio id="audio-correct" src="assets/correct.mp3"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3"></audio>

    <script>
        var sndCorrect = document.getElementById('audio-correct');
        var sndWrong = document.getElementById('audio-wrong');

        function playSound(type) {
            try {
                var snd = (type === 'correct') ? sndCorrect : sndWrong;
                if(snd) { snd.currentTime = 0; snd.play().catch(function(){}); }
            } catch(e) {}
        }

        var staticQuestionPool = [
            { outcome: "Groups of Tens", story: "Sammy has 2 boxes of acorns. Each box has 10 acorns. How many does he have?", num1: 20, num2: 10, answer: 30, options: [3, 21, 30, 40] },
            { outcome: "Groups of Tens", story: "Sammy finds 4 baskets of tens, then finds 2 more baskets of tens. Count them up!", num1: 40, num2: 20, answer: 60, options: [6, 42, 50, 60] },
            { outcome: "Arrange & Solve Order", story: "Sammy changes the order! What is the total sum if we calculate 30 + 50?", num1: 30, num2: 50, answer: 80, options: [35, 70, 80, 90] },
            { outcome: "Arrange & Solve Order", story: "Let's arrange these in order. What do you get when you add 10 to 70?", num1: 70, num2: 10, answer: 80, options: [17, 71, 80, 90] },
            { outcome: "Addition without Carry Over", story: "Sammy has 42 acorns in his nest and finds 5 more under a leaf.", num1: 42, num2: 5, answer: 47, options: [45, 47, 49, 52] },
            { outcome: "Addition without Carry Over", story: "There are 51 acorns inside a tree hole and 23 acorns on the grass.", num1: 51, num2: 23, answer: 74, options: [74, 75, 84, 94] },
            { outcome: "Addition with Carry Over", story: "Sammy has 25 brown acorns and gathers 8 shiny gold acorns.", num1: 25, num2: 8, answer: 33, options: [32, 33, 43, 53] },
            { outcome: "Addition with Carry Over", story: "Sammy gathers 48 acorns in the morning and 15 more after lunch.", num1: 48, num2: 15, answer: 63, options: [53, 62, 63, 73] },
            { outcome: "Story Sums", story: '\"I want to save 90 acorns,\" says Sammy. If he has 60 acorns and finds 30 more, what is his total?', num1: 60, num2: 30, answer: 90, options: [63, 80, 90, 100] },
            { outcome: "Story Sums", story: "Sammy hides 36 acorns near an oak tree and 43 acorns near a big pine tree. How many are hidden altogether?", num1: 36, num2: 43, answer: 79, options: [77, 78, 79, 89] }
        ];

        var currentIdx = 0;
        var acornsSaved = 0;
        var optionLocked = false;
        var currentQuestionAttempts = 0;

        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var splash = document.getElementById('splash-screen');
                var gameBox = document.getElementById('game-container');
                if (splash) { splash.style.opacity = '0'; splash.style.visibility = 'hidden'; }
                setTimeout(function() { gameBox.style.display = 'block'; gameBox.style.opacity = '1'; }, 500);
            }, 1000); 
        });

        function startMission() {
            document.getElementById('mission-screen').style.display = 'none';
            document.getElementById('play-screen').style.display = 'block';
            document.getElementById('corner-stash').style.display = 'flex';
            loadQuestion();
        }

        function populateSidePanel(panelId, totalCount) {
            var panel = document.getElementById(panelId);
            panel.innerHTML = "";

            var tens = Math.floor(totalCount / 10);
            var ones = totalCount % 10;

            for (var t = 0; t < tens; t++) {
                var basket = document.createElement('div');
                basket.className = 'basket-target';
                basket.innerText = "🧺";
                panel.appendChild(basket);
            }

            for (var o = 0; o < ones; o++) {
                var acorn = document.createElement('img');
                acorn.className = 'acorn-draggable';
                acorn.src = 'assets/acorn.png';
                acorn.onerror = function() { this.src = 'https://placehold.co/28?text=🌰'; };
                
                acorn.addEventListener('click', function(e) {
                    var targetedAcorn = e.target;
                    targetedAcorn.style.transform = 'scale(0.2)';
                    targetedAcorn.style.opacity = '0';
                    
                    var companionBasket = panel.querySelector('.basket-target');
                    if (companionBasket) {
                        companionBasket.classList.remove('packed-bump');
                        void companionBasket.offsetWidth; 
                        companionBasket.classList.add('packed-bump');
                    }
                    
                    setTimeout(function() { targetedAcorn.remove(); }, 200);
                });

                panel.appendChild(acorn);
            }
        }

        function loadQuestion() {
            optionLocked = false;
            currentQuestionAttempts = 0;
            var currentQuest = staticQuestionPool[currentIdx];
            
            document.getElementById('question-number').innerText = "🧩 Problem: " + (currentIdx + 1) + "/10";
            document.getElementById('acorn-count').innerText = acornsSaved;
            document.getElementById('progress').style.width = (currentIdx * 10) + "%";
            document.getElementById('try-again-prompt').innerText = "";
            document.getElementById('outcome-label').innerText = currentQuest.outcome;
            document.getElementById('story-container').innerText = currentQuest.story;

            populateSidePanel('left-panel', currentQuest.num1);
            populateSidePanel('right-panel', currentQuest.num2);

            document.getElementById('equation-display').innerText = currentQuest.num1 + " + " + currentQuest.num2 + " = ?";

            var optContainer = document.getElementById('options-container');
            optContainer.innerHTML = "";
            
            currentQuest.options.forEach(function(opt) {
                var btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = function() { handleAnswerSelection(btn, opt, currentQuest.answer); };
                optContainer.appendChild(btn);
            });
        }

        /* CORNER BASKET COLLECTION TRIGGER */
        function addAcornToCornerBasket() {
            var pile = document.getElementById('acorn-basket-pile');
            var miniAcorn = document.createElement('img');
            miniAcorn.className = 'mini-stored-acorn';
            miniAcorn.src = 'assets/acorn.png';
            miniAcorn.onerror = function() { this.src = 'https://placehold.co/12?text=🌰'; };
            pile.appendChild(miniAcorn);
        }

        function handleAnswerSelection(selectedBtn, chosenVal, realAnswer) {
            if(optionLocked || selectedBtn.classList.contains('wrong')) return;
            
            currentQuestionAttempts++;

            if(chosenVal === realAnswer) {
                optionLocked = true;
                selectedBtn.classList.add('correct');
                playSound('correct');
                
                acornsSaved++;
                document.getElementById('acorn-count').innerText = acornsSaved;
                
                // Triggers an acorn to drop into the master basket
                addAcornToCornerBasket();

                setTimeout(advanceToNextQuestion, 1500);
            } else {
                selectedBtn.classList.add('wrong');
                playSound('wrong');

                if(currentQuestionAttempts === 1) {
                    document.getElementById('try-again-prompt').innerText = "❌ Not quite! Try one more time! 🤔";
                } else {
                    optionLocked = true;
                    document.getElementById('try-again-prompt').innerText = "Let's see the correct solution! ✨";
                    
                    var buttons = document.querySelectorAll('.option-btn');
                    buttons.forEach(function(b) {
                        if(parseInt(b.innerText) === realAnswer) {
                            b.classList.add('correct');
                        }
                    });

                    setTimeout(advanceToNextQuestion, 2000);
                }
            }
        }

        function advanceToNextQuestion() {
            currentIdx++;
            if(currentIdx < staticQuestionPool.length) {
                loadQuestion();
            } else {
                displayEndScreen();
            }
        }

        function displayEndScreen() {
            document.getElementById('progress').style.width = "100%";
            document.getElementById('try-again-prompt').innerText = "";
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('corner-stash').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('restart-btn').style.display = 'block';
            document.getElementById('score-display').innerText = "Final Score: " + acornsSaved + " / 10!";
        }

        function resetGame() {
            currentIdx = 0;
            acornsSaved = 0;
            currentQuestionAttempts = 0;
            document.getElementById('acorn-basket-pile').innerHTML = "";
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('play-screen').style.display = 'block';
            document.getElementById('corner-stash').style.display = 'flex';
            loadQuestion();
        }
    </script>
</body>
</html>
