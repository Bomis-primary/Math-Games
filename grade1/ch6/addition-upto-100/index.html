<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1: Sammy's Acorn Mission!</title>
    <style>
        :root {
            --primary-bg: #F4EBE1; 
            --card-bg: #FFFFFF;
            --text-color: #3E2723; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#D7CCC8 20%, transparent 20%);
            background-size: 30px 30px;
            padding: 15px;
        }

        /* --- SPLASH SCREEN LAYOUT --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-in-out, visibility 0.6s;
            visibility: visible;
        }

        .splash-logo {
            max-width: 250px;
            height: auto;
        }

        /* --- MAIN GAME CONTAINER --- */
        #game-container {
            width: 100%;
            max-width: 750px; 
            background: var(--card-bg);
            padding: 25px;
            border-radius: 35px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            border: 6px solid #8D6E63;
            text-align: center;
            display: none; 
            opacity: 0;
            transition: opacity 0.4s ease-in;
            position: relative;
        }

        .actor-img {
            width: 120px;
            height: auto;
            margin-bottom: 15px;
        }

        .mission-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
            background: #FFE0B2;
            padding: 20px;
            border-radius: 20px;
            border: 2px dashed #FB8C00;
        }

        .start-btn {
            background: linear-gradient(135deg, #8D6E63, #5D4037);
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #3E2723;
        }

        /* --- GAMEPLAY INTERACTIVE SCREEN --- */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .tracker-badge {
            background: #E8F5E9;
            padding: 6px 14px;
            border-radius: 15px;
            color: #2E7D32;
        }

        .progress-bar {
            width: 100%;
            height: 16px;
            background-color: #E0E0E0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #BCAAA4;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #A1887F, #8D6E63);
            transition: width 0.4s ease;
        }

        .story-text-container {
            font-size: 1.2rem;
            background: #FFF3E0;
            padding: 15px;
            border-radius: 15px;
            border-left: 5px solid #FF9800;
            margin-bottom: 20px;
            text-align: left;
        }

        /* --- VISUAL DISPLAY ZONE (image_36d0ab.png STYLE) --- */
        .visual-math-box {
            background: #FFF8E1;
            border: 4px dashed #FFB300;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            min-height: 150px;
        }

        .side-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px;
            min-width: 120px;
        }

        /* Drop Basket Target */
        .basket-target {
            position: relative;
            width: 60px;
            height: 60px;
            background: #EFEBE9;
            border: 3px solid #8D6E63;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: 0 4px 0 #5D4037;
            transition: transform 0.2s;
        }

        .basket-target.hovered {
            background: #FFE082;
            transform: scale(1.1);
        }

        .basket-target::after {
            content: "10";
            position: absolute;
            bottom: -4px;
            right: -4px;
            font-size: 0.7rem;
            background: #D84315;
            color: #FFF;
            padding: 1px 4px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Draggable Loose Acorn elements */
        .acorn-draggable {
            width: 32px;
            height: auto;
            cursor: grab;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.15));
        }

        .acorn-draggable:active {
            cursor: grabbing;
        }

        .math-sign {
            font-size: 3rem;
            font-weight: bold;
            color: #E65100;
        }

        .equation-text {
            font-size: 3.2rem;
            color: #D84315;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #try-again-prompt {
            height: 24px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #D32F2F;
            margin-bottom: 15px;
        }

        /* --- OPTIONS SELECTION GRID --- */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .option-btn {
            background-color: #FFF;
            border: 4px solid #8D6E63;
            border-radius: 20px;
            padding: 12px;
            font-size: 2rem;
            font-weight: bold;
            color: #5D4037;
            cursor: pointer;
            box-shadow: 0 5px 0 #5D4037;
        }

        .option-btn.correct {
            background-color: #4CAF50 !important;
            border-color: #2E7D32 !important;
            color: white !important;
            box-shadow: 0 5px 0 #2E7D32;
        }

        .option-btn.wrong {
            background-color: #EF5350 !important;
            border-color: #C62828 !important;
            color: white !important;
            box-shadow: 0 5px 0 #C62828;
        }

        #restart-btn {
            background: linear-gradient(135deg, #8D6E63, #5D4037);
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #3E2723;
            display: none;
            margin: 20px auto 0 auto;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Logo" class="splash-logo" onerror="this.src='https://placehold.co/200?text=Innovine'">
    </div>

    <div id="game-container">
        <!-- START SCREEN -->
        <div id="mission-screen">
            <img src="assets/squirrel.png" class="actor-img" onerror="this.src='https://placehold.co/120?text=🐿️'">
            <h2 style="font-size: 2rem; margin-bottom: 10px;">Help Sammy the Squirrel!</h2>
            <p class="mission-text">
                Winter is near! Drag loose acorns directly into the baskets to help count them up, then tap the right answer button!
            </p>
            <button class="start-btn" onclick="startMission()">Let's Go! 🚀</button>
        </div>

        <!-- MAIN GAME PANEL -->
        <div id="play-screen" style="display: none;">
            <div class="game-header">
                <span id="question-number">🧩 Problem: 1/10</span>
                <span class="tracker-badge">Acorns Saved: <span id="acorn-count">0</span></span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <div class="story-text-container" id="story-container"></div>

            <!-- VISUAL PLAY ZONE DISPLAY (image_36d0ab.png DESIGN) -->
            <div class="visual-math-box">
                <div class="side-panel" id="left-panel"></div>
                <div class="math-sign">+</div>
                <div class="side-panel" id="right-panel"></div>
            </div>

            <div class="equation-text" id="equation-display">0 + 0 = ?</div>
            <div id="try-again-prompt"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- RESULTS END SCREEN -->
        <div id="result-screen" style="display:none;">
            <img src="assets/squirrel.png" class="actor-img" onerror="this.src='https://placehold.co/120?text=🐿️'">
            <h1 style="font-size: 2.2rem; color: #4CAF50; margin-bottom: 10px;">Mission Complete! 🏆</h1>
            <p id="score-display" style="font-size: 2rem; font-weight: bold; color: #EF6C00;"></p>
        </div>
        
        <button id="restart-btn" onclick="resetGame()">Play Again! 🌟</button>
    </div>

    <audio id="audio-correct" src="assets/correct.mp3"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3"></audio>

    <script>
        var sndCorrect = document.getElementById('audio-correct');
        var sndWrong = document.getElementById('audio-wrong');

        function playSound(type) {
            try {
                var snd = (type === 'correct') ? sndCorrect : sndWrong;
                if(snd) { snd.currentTime = 0; snd.play().catch(function(){}); }
            } catch(e) {}
        }

        var staticQuestionPool = [
            { story: "Sammy has 10 acorns on the left, and 20 on the right. Count them all!", num1: 10, num2: 20, answer: 30, options: [3, 13, 30, 40] },
            { story: "Sammy has 20 acorns, then finds 10 loose ones. Put them together!", num1: 20, num2: 10, answer: 30, options: [21, 12, 30, 40] },
            { story: "Let's count! There are 30 acorns inside boxes, plus 10 loose acorns.", num1: 30, num2: 10, answer: 40, options: [31, 40, 50, 14] },
            { story: "Sammy gathers 40 acorns, then spots 10 more next to a rock.", num1: 40, num2: 10, answer: 50, options: [41, 50, 60, 90] },
            { story: "Let's pack a total sum! Count 20 acorns added to 20 more.", num1: 20, num2: 20, answer: 40, options: [30, 40, 50, 60] },
            { story: "There are 10 acorns hidden in the grass and 30 acorns in a tree hole.", num1: 10, num2: 30, answer: 40, options: [20, 30, 40, 50] },
            { story: "Sammy counts 30 acorns gathered on Monday and 30 on Tuesday.", num1: 30, num2: 30, answer: 60, options: [50, 60, 70, 80] },
            { story: "Sammy has 50 packed acorns and finds 10 loose ones on the ground.", num1: 50, num2: 10, answer: 60, options: [51, 60, 70, 80] },
            { story: "Look at the panels! Let's find the total sum for 20 plus 30.", num1: 20, num2: 30, answer: 50, options: [40, 45, 50, 60] },
            { story: "Final challenge! Sammy has 40 acorns and collects 20 more.", num1: 40, num2: 20, answer: 60, options: [50, 55, 60, 70] }
        ];

        var currentIdx = 0;
        var acornsSaved = 0;
        var optionLocked = false;
        var currentQuestionAttempts = 0;

        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var splash = document.getElementById('splash-screen');
                var gameBox = document.getElementById('game-container');
                if (splash) { splash.style.opacity = '0'; splash.style.visibility = 'hidden'; }
                setTimeout(function() { gameBox.style.display = 'block'; gameBox.style.opacity = '1'; }, 600);
            }, 1000); 
        });

        function startMission() {
            document.getElementById('mission-screen').style.display = 'none';
            document.getElementById('play-screen').style.display = 'block';
            loadQuestion();
        }

        /* GENERATE PANELS: BASKETS + DRAGGABLE LOOSE ACORNS */
        function populateSidePanel(panelId, totalCount) {
            var panel = document.getElementById(panelId);
            panel.innerHTML = "";

            var tens = Math.floor(totalCount / 10);
            var ones = totalCount % 10;

            // Generate Baskets (Drop targets)
            for (var t = 0; t < tens; t++) {
                var basket = document.createElement('div');
                basket.className = 'basket-target';
                basket.innerText = "🧺";
                
                // Allow elements to drag-drop onto baskets directly
                basket.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('hovered'); });
                basket.addEventListener('dragleave', function() { this.classList.remove('hovered'); });
                basket.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('hovered');
                    var draggedId = e.dataTransfer.getData('text/plain');
                    var item = document.getElementById(draggedId);
                    if(item) item.remove(); // Drops perfectly right into the box!
                });

                panel.appendChild(basket);
            }

            // Generate loose acorns if any exist (Can be dragged into basket boxes)
            for (var o = 0; o < ones; o++) {
                var acorn = document.createElement('img');
                acorn.className = 'acorn-draggable';
                acorn.src = 'assets/acorn.png';
                acorn.id = panelId + '-acorn-' + o;
                acorn.setAttribute('draggable', 'true');
                acorn.onerror = function() { this.src = 'https://placehold.co/32?text=🌰'; };
                
                acorn.addEventListener('dragstart', function(e) {
                    e.dataTransfer.setData('text/plain', e.target.id);
                });

                panel.appendChild(acorn);
            }
        }

        function loadQuestion() {
            optionLocked = false;
            currentQuestionAttempts = 0;
            var currentQuest = staticQuestionPool[currentIdx];
            
            document.getElementById('question-number').innerText = "🧩 Problem: " + (currentIdx + 1) + "/10";
            document.getElementById('acorn-count').innerText = acornsSaved;
            document.getElementById('progress').style.width = (currentIdx * 10) + "%";
            document.getElementById('try-again-prompt').innerText = "";
            document.getElementById('story-container').innerText = currentQuest.story;

            // Render matching visual panels side-by-side
            populateSidePanel('left-panel', currentQuest.num1);
            populateSidePanel('right-panel', currentQuest.num2);

            document.getElementById('equation-display').innerText = currentQuest.num1 + " + " + currentQuest.num2 + " = ?";

            // Render option buttons immediately ready to interact
            var optContainer = document.getElementById('options-container');
            optContainer.innerHTML = "";
            
            currentQuest.options.forEach(function(opt) {
                var btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = function() { handleAnswerSelection(btn, opt, currentQuest.answer); };
                optContainer.appendChild(btn);
            });
        }

        function handleAnswerSelection(selectedBtn, chosenVal, realAnswer) {
            if(optionLocked || selectedBtn.classList.contains('wrong')) return;
            
            currentQuestionAttempts++;

            if(chosenVal === realAnswer) {
                optionLocked = true;
                selectedBtn.classList.add('correct');
                playSound('correct');
                
                acornsSaved++;
                document.getElementById('acorn-count').innerText = acornsSaved;

                setTimeout(advanceToNextQuestion, 1800);
            } else {
                selectedBtn.classList.add('wrong');
                playSound('wrong');

                if(currentQuestionAttempts === 1) {
                    // Gives student exactly 2 chances
                    document.getElementById('try-again-prompt').innerText = "❌ Not quite! Try one more time! 🤔";
                } else {
                    optionLocked = true;
                    document.getElementById('try-again-prompt').innerText = "Let's see the correct solution! ✨";
                    
                    var buttons = document.querySelectorAll('.option-btn');
                    buttons.forEach(function(b) {
                        if(parseInt(b.innerText) === realAnswer) {
                            b.classList.add('correct');
                        }
                    });

                    setTimeout(advanceToNextQuestion, 2200);
                }
            }
        }

        function advanceToNextQuestion() {
            currentIdx++;
            if(currentIdx < staticQuestionPool.length) {
                loadQuestion();
            } else {
                displayEndScreen();
            }
        }

        function displayEndScreen() {
            document.getElementById('progress').style.width = "100%";
            document.getElementById('try-again-prompt').innerText = "";
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('restart-btn').style.display = 'block';
            document.getElementById('score-display').innerText = "Final Score: " + acornsSaved + " / 10!";
        }

        function resetGame() {
            currentIdx = 0;
            acornsSaved = 0;
            currentQuestionAttempts = 0;
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('play-screen').style.display = 'block';
            loadQuestion();
        }
    </script>
</body>
</html>
