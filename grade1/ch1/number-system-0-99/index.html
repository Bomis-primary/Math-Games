<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raju's Train Journey - The Number Express</title>
  <style>
    :root {
      --bg-sky: linear-gradient(to bottom, #90caf9, #e3f2fd);
      --track-grey: #757575;
      --wood-brown: #8d6e63;
      --train-red: #ef5350;
      --train-blue: #42a5f5;
      --text-dark: #263238;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
      background: #cfd8dc;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 500px;
    }

    /* Screen 1: 5-Second White Splash Screen for logo.png */
    #screen-logo-splash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      transition: opacity 0.5s ease;
    }
    #screen-logo-splash img {
      max-width: 60%;
      max-height: 60%;
      object-fit: contain;
    }

    /* Header & Progress HUD */
    .game-header {
      background: #37474f;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-area h1 { font-size: 1.4rem; color: #ffca28; }
    .hud-stats { display: flex; gap: 15px; font-weight: bold; font-size: 1.1rem; }
    
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #263238;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ffb300, #ff6f00);
      transition: width 0.4s ease;
    }

    /* Screen Areas */
    .screen { display: none; padding: 25px; text-align: center; }
    .screen.active { display: block; }

    /* Dialog Box Setup */
    .story-bubble {
      background: #fff9c4;
      border: 3px dashed #fbc02d;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 25px;
      font-size: 1.2rem;
      line-height: 1.5;
    }

    /* Scenery Canvas Area */
    .scenery-canvas {
      height: 180px;
      background: var(--bg-sky);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      margin-bottom: 25px;
      border: 4px solid #b0bec5;
    }

    /* Pure CSS Train Tracks */
    .tracks {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      height: 8px;
      background: var(--track-grey);
    }
    .tracks::before {
      content: '';
      position: absolute;
      top: 6px; left: 0; width: 100%; height: 6px;
      background: repeating-linear-gradient(90deg, var(--wood-brown), var(--wood-brown) 10px, transparent 10px, transparent 30px);
    }

    /* CSS Train Visuals */
    .train-engine {
      position: absolute;
      bottom: 28px;
      left: 20px;
      width: 70px;
      height: 50px;
      background: var(--train-red);
      border-radius: 15px 8px 4px 4px;
      z-index: 5;
    }
    .train-engine::after {
      content: '🚂';
      font-size: 38px;
      position: absolute;
      top: -3px; left: 4px;
      transform: scaleX(-1);
    }

    .train-car {
      position: absolute;
      bottom: 28px;
      width: 60px;
      height: 40px;
      background: var(--train-blue);
      border-radius: 6px;
      border: 2px solid #1e88e5;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      color: white;
      font-size: 1.4rem;
      z-index: 4;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.15);
    }

    /* Question & Input Controls */
    .question-prompt {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #1a237e;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    .game-btn {
      background: linear-gradient(to bottom, #ffca28, #ffb300);
      border: none;
      padding: 18px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #5d4037;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 0 #ff8f00;
      transition: transform 0.1s, box-shadow 0.1s;
      outline: none;
    }
    .game-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #ff8f00;
    }

    /* Feedback Animations */
    .game-btn.correct { background: #66bb6a !important; box-shadow: 0 4px 0 #388e3c !important; color: white; }
    .game-btn.wrong { background: #ef5350 !important; box-shadow: 0 4px 0 #d32f2f !important; color: white; animation: shake 0.3s ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .feedback-banner {
      height: 30px;
      margin-top: 15px;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .action-btn {
      background: #00bcd4;
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #0097a7;
      margin-top: 15px;
    }
    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0097a7;
    }

    /* Confetti Particle FX Elements */
    .particle {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      animation: blow-up 0.8s ease-out forwards;
    }
    @keyframes blow-up {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
