<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Train Number Journey</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Comic Sans MS', Arial, sans-serif; background: #bdeeff; color: #222; overflow-x: hidden; }
.screen { display: none; min-height: 100vh; padding: 20px; text-align: center; justify-content: center; align-items: center; }
.screen.active { display: flex; flex-direction: column; }

.card { background: rgba(255,255,255,0.95); border-radius: 32px; padding: 30px; max-width: 700px; width: 95%; box-shadow: 0 12px 30px rgba(0,0,0,0.15); border: 6px solid #174ea6; animation: popIn 0.5s ease-out;}
@keyframes popIn {0% {transform: scale(0.9); opacity:0;} 100% {transform: scale(1); opacity:1;}}

.innovine-logo { max-width: 220px; width: 100%; height: auto; margin-bottom: 20px; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.1)); animation: pulseLogo 2s infinite ease-in-out; }
@keyframes pulseLogo {0%,100%{transform: scale(1);}50%{transform: scale(1.05);} }

h1{color:#174ea6;font-size:clamp(28px,5vw,44px); margin:10px 0;}
h2{color:#0b8043;font-size:clamp(20px,4vw,30px); margin-top:5px;}
p{font-size:18px; line-height:1.5; color:#444;}

button{ border: 0; border-radius: 20px; padding: 16px 36px; font-size: 22px; font-weight: bold; cursor: pointer; background: #ffbf00; color: #4a2b00; box-shadow: 0 6px 0 #c58b00; margin: 15px 8px; transition: all 0.1s ease;}
button:hover { background: #ffcc33; }
button:active { transform: translateY(4px); box-shadow: 0 2px 0 #c58b00; }

/* Game Layout */
.game-area { position: relative; min-height: 100vh; background: linear-gradient(to bottom, #bdeeff 0%, #e0f7fa 70%, #81c784 100%); padding: 15px; overflow: hidden; display: none; flex-direction: column; justify-content: space-between; }

.cloud { position: absolute; background: #fff; border-radius: 100px; opacity: 0.85; pointer-events: none; }
.cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.cloud.one { width: 120px; height: 40px; top: 40px; left: -150px; animation: floatCloud 22s linear infinite; }
.cloud.one::before { width: 50px; height: 50px; top: -25px; left: 15px; }
.cloud.one::after { width: 60px; height: 60px; top: -30px; left: 45px; }
.cloud.two { width: 160px; height: 50px; top: 110px; left: -200px; animation: floatCloud 38s linear infinite; }
.cloud.two::before { width: 65px; height: 65px; top: -30px; left: 20px; }
.cloud.two::after { width: 80px; height: 80px; top: -40px; left: 60px; }
@keyframes floatCloud {0% {transform: translateX(0);} 100% {transform: translateX(calc(100vw + 250px));}}

.topbar { display: flex; justify-content: space-around; width: 100%; max-width: 850px; margin: 0 auto; background: rgba(255,255,255,0.9); padding: 12px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); font-size: clamp(16px, 3.5vw, 22px); font-weight: bold; z-index: 10; border: 3px solid #74b9ff; }
.timer { color: #d93025; } .score { color: #fbbc04; } .attempts { color: #0b8043; }

.track-zone { position: relative; max-width: 850px; width: 100%; height: 120px; margin: 15px auto; z-index: 5; }
.track { position: absolute; bottom: 10px; left: 0; width: 100%; height: 16px; background: repeating-linear-gradient(90deg, #555, #555 10px, #aaa 10px, #aaa 20px); border-top:4px solid #333; border-bottom:4px solid #333; border-radius: 4px; }
.train { position: absolute; bottom: 22px; left: 5%; font-size: 55px; line-height:1; transition:left 1s ease-in-out; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15)); }

.question-card { max-width: 850px; width: 100%; margin: 5px auto 20px auto; background: rgba(255,255,255,0.96); border-radius: 28px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); border: 5px solid #ffbf00; z-index: 10; }
.question { font-size: clamp(20px, 4.5vw, 30px); font-weight: bold; margin: 12px 0; color: #174ea6; }
.options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 15px; }
@media(max-width: 500px) { .options { grid-template-columns: 1fr; } }
.option { background: #fff; border: 4px solid #74b9ff; border-radius: 20px; padding: 15px; font-size: 26px; font-weight: bold; cursor: pointer; min-height: 65px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #74b9ff; transition: all 0.1s ease; }
.option:hover { background: #eaf6ff; transform: translateY(-2px); } 
.option:active { transform: translateY(2px); box-shadow: 0 1px 0 #74b9ff; }
.option.disabled { pointer-events: none; opacity: 0.6; }
.feedback { min-height: 40px; font-size: 22px; font-weight: bold; margin-top: 12px; }
.wrongAnim { animation: shake 0.4s ease-in-out; border-color:#d93025 !important; box-shadow:0 4px 0 #d93025 !important; background:#fce8e6 !important; color:#d93025; }
.correctAnim { border-color:#188038 !important; box-shadow:0 4px 0 #188038 !important; background:#e6f4ea !important; color:#188038; }
@keyframes shake {0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);} }

.progress-wrap { width: 100%; max-width: 850px; background: #e0e0e0; height: 12px; border-radius: 6px; margin: 10px auto; border: 2px solid #bbb; overflow: hidden; }

#confetti-container { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:9999; }
.confetti { position:absolute; width:10px; height:10px; border-radius:50%; opacity:0.9; animation:fall linear forwards; }
@keyframes fall { 0% { transform: translateY(0) rotate(0deg); opacity:1; } 100% { transform: translateY(100vh) rotate(720deg); opacity:0; } }

</style>
</head>
<body>

<!-- SCREEN 1: LOGO -->
<section id="splash" class="screen active">
  <div class="card splash-container" style="border:none; box-shadow:none;">
    <img src="assets/logo.png" class="innovine-logo" alt="Innovine Logo">
  </div>
</section>

<!-- SCREEN 2: TITLE -->
<section id="start" class="screen">
  <div class="card">
    <h1>🚂 Train Number Journey</h1>
    <h2>Grade 1 Maths — Number System 0–99</h2>
    <p>Help our colorful number train complete its journey through Math Town!</p>
    <button onclick="startGame()">Start Journey 🟢</button>
  </div>
</section>

<!-- SCREEN 3: GAME -->
<section id="game" class="game-area">
  <div class="cloud one"></div>
  <div class="cloud two"></div>

  <div class="topbar">
    <div class="timer">⏱ Time: <span id="time">60</span>s</div>
    <div class="score">⭐ Score: <span id="score">0</span></div>
    <div class="attempts">🔁 Fuel Attempts: <span id="attempts">2</span></div>
  </div>

  <div class="progress-wrap"><div id="progress" class="progress"></div></div>
  <div class="track-zone"><div class="track"></div><div id="train" class="train">🚂</div></div>

  <div class="question-card">
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>
  </div>
</section>

<!-- SCREEN 4: RESULT -->
<section id="result" class="screen">
  <div id="confetti-container"></div>
  <div class="card">
    <h1>🏁 Journey Complete!</h1>
    <div id="resultStars">⭐⭐⭐</div>
    <h2 id="finalScore"></h2>
    <p id="resultMsg"></p>
    <button onclick="restartGame()">Play Again 🔄</button>
  </div>
</section>

<script>
const questions = [
  { q: "What number comes just after 7?", options: ["6","7","8","9"], answer: "8" },
  { q: "What number comes just before 15?", options: ["14","15","16","13"], answer: "14" },
  { q: "Fill the missing number: 23, 24, __, 26", options: ["25","27","24","28"], answer: "25" },
  { q: "Which is the greatest number?", options: ["42","37","50","45"], answer: "50" },
  { q: "Which is the smallest number?", options: ["17","23","19","15"], answer: "15" },
  { q: "What number has 4 tens and 7 ones?", options: ["47","74","40","70"], answer: "47" },
  { q: "What number has 0 tens and 9 ones?", options: ["9","90","19","99"], answer: "9" },
  { q: "Arrange in ascending order: 12, 9, 15", options: ["9,12,15","15,12,9","12,15,9","9,15,12"], answer: "9,12,15" },
  { q: "Arrange in descending order: 22, 18, 25", options: ["25,22,18","18,22,25","22,18,25","25,18,22"], answer: "25,22,18" },
  { q: "Fill the missing number: 30, __, 32", options: ["31","33","30","32"], answer: "31" }
];

let current=0, score=0, attempts=2, timer, timeLeft=60;

window.onload = function(){
  setTimeout(()=>{
    document.getElementById("splash").classList.remove("active");
    document.getElementById("start").classList.add("active");
  },5000); // 5s logo screen
};

function startGame(){
  document.getElementById("start").classList.remove("active");
  document.getElementById("game").classList.add("active");
  current=0; score=0; attempts=2;
  document.getElementById("score").textContent = score;
  document.getElementById("attempts").textContent = attempts;
  document.getElementById("progress").style.width="0%";
  startTimer();
  loadQuestion();
}

function startTimer(){
  timeLeft=60;
  document.getElementById("time").textContent=timeLeft;
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById("time").textContent=timeLeft;
    if(timeLeft<=0){ clearInterval(timer); showResult(); }
  },1000);
}

function loadQuestion(){
  const q=questions[current];
  document.getElementById("question").textContent=q.q;
  const optionsBox=document.getElementById("options");
  optionsBox.innerHTML="";
  q.options.forEach(opt=>{
    const div=document.createElement("div");
    div.className="option";
    div.textContent=opt;
    div.onclick=()=> checkAnswer(opt,div);
    optionsBox.appendChild(div);
  });
  updateTrain();
}

function updateTrain(){
  const train=document.getElementById("train");
  const progressPercent=(current / questions.length)*90;
  train.style.left=`calc(5% + ${progressPercent}%)`;
  document.getElementById("progress").style.width=`${(current / questions.length)*100}%`;
}

function checkAnswer(selected, element){
  const optionsBox=document.getElementById("options");
  Array.from(optionsBox.children).forEach(opt=>opt.classList.add("disabled"));
  const feedback=document.getElementById("feedback");
  if(selected===questions[current].answer){
    element.classList.add("correctAnim");
    feedback.textContent="✅ Good Job!";
    score++; document.getElementById("score").textContent=score;
    setTimeout(()=>{
      element.classList.remove("correctAnim");
      feedback.textContent="";
      current++;
      attempts=2;
      updateTrain();
      if(current<questions.length) loadQuestion(); else showResult();
    },800);
  } else {
    element.classList.add("wrongAnim");
    feedback.textContent="❌ Try Again!";
    attempts--; document.getElementById("attempts").textContent=attempts;
    setTimeout(()=>{
      element.classList.remove("wrongAnim");
      feedback.textContent="";
      Array.from(optionsBox.children).forEach(opt=>opt.classList.remove("disabled"));
      if(attempts<=0){
        const correctOpt=Array.from(optionsBox.children).find(opt=>opt.textContent===questions[current].answer);
        correctOpt.classList.add("correctAnim");
        setTimeout(()=>{
          correctOpt.classList.remove("correctAnim");
          current++; attempts=2;
          updateTrain();
          if(current<questions.length) loadQuestion(); else showResult();
        },1200);
      }
    },400);
  }
}

function launchConfetti(){
  const container=document.getElementById("confetti-container");
  container.innerHTML="";
  const colors=["#ffbf00","#0b8043","#d93025","#174ea6","#fbbc04"];
  const numPieces=80;
  for(let i=0;i<numPieces;i++){
    const conf=document.createElement("div");
    conf.className="confetti";
    conf.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
    conf.style.left=Math.random()*100+"vw";
    conf.style.top="-20px";
    conf.style.width=conf.style.height=(Math.random()*8+6)+"px";
    conf.style.animationDuration=(Math.random()*2+3)+"s";
    conf.style.animationDelay=Math.random()+"s";
    container.appendChild(conf);
  }
  setTimeout(()=>{ container.innerHTML=""; },5000);
}

function showResult(){
  clearInterval(timer);
  document.getElementById("game").classList.remove("active");
  document.getElementById("result").classList.add("active");
  document.getElementById("finalScore").textContent=`Your Score: ${score} / ${questions.length}`;
  launchConfetti();
}

function restartGame(){
  document.getElementById("result").classList.remove("active");
  document.getElementById("start").classList.add("active");
}
</script>
</body>
</html>
