<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplication Level 1 - Dynamic Matrix</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #4834d4;
            --secondary: #ff7043;
            --text-main: #2c3e50;
            --success: #2e7d32;
            --bg-canvas: #f8fafc;
        }

        * {
            box-sizing: border-box;
            font-family: 'Capriola', 'Comic Sans MS', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #dff9fb 0%, #c7ecee 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: white;
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 4px solid #fff;
            text-align: center;
            position: relative;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .level-badge {
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
        }

        .score-badge {
            background: #fff;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
        }

        h1 {
            color: var(--text-main);
            font-size: 24px;
            margin: 0 0 5px 0;
        }

        .instruction {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .stage-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            padding: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .stage-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .matching-board {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .match-card {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 20px;
            padding: 15px;
            min-height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .column-left .match-card {
            background: #e0e7ff;
            border-color: #c7d2fe;
            color: var(--primary-dark);
            font-size: 24px;
        }

        .match-card.selected {
            border-color: var(--primary);
            background: #eeebff;
            transform: scale(1.03);
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.15);
        }

        .match-card.matched {
            background: #e2f0d9 !important;
            border-color: #a9d08e !important;
            color: var(--success) !important;
            cursor: default;
            opacity: 0.8;
            pointer-events: none;
            transform: scale(1);
        }

        .visual-array {
            display: grid;
            gap: 5px;
            padding: 8px;
            background: #fff;
            border: 3px solid #6c5ce7;
            border-radius: 12px;
        }

        .visual-groups {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .theme-basket { background: #fff; border: 2px dashed #ff7043; padding: 6px; border-radius: 12px; }
        .theme-branch { background: linear-gradient(90deg, #8b5a2b, #a0522d); padding: 6px 12px; border-radius: 14px; }
        .theme-chest { background: #b45309; border: 3px solid #78350f; border-radius: 12px; padding: 6px; }
        .theme-rack { border: 3px solid #64748b; background: #f8fafc; border-radius: 10px; padding: 6px; }

        .repeated-addition-text {
            font-size: 20px;
            color: #ff7043;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .item-emoji {
            font-size: 18px;
            display: inline-block;
            margin: 1px;
        }

        .action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="end-overlay" class="stage-overlay">
            <div style="font-size: 65px; margin-bottom: 10px;">👑</div>
            <h2>Chapter 1 Mastered!</h2>
            <p id="final-score-txt" style="font-size: 18px; margin-bottom: 25px;">You cleared all 4 screens with entirely unique equations!</p>
            <button class="action-btn" id="restart-btn" style="display:block; background:white; color:var(--primary);" onclick="restartGame()">Play Again 🔄</button>
        </div>

        <div class="header-meta">
            <div class="level-badge" id="round-badge">Screen 1 / 4</div>
            <div class="score-badge" id="score-badge">Score: 0</div>
        </div>

        <h1>Multiplication Concept Connector</h1>
        <div class="instruction">Connect each multiplication expression to its true graphical layout!</div>

        <div class="matching-board">
            <div class="column column-left" id="left-col"></div>
            <div class="column column-right" id="right-col"></div>
        </div>

        <button class="action-btn" id="next-round-btn" onclick="advanceRound()">Next Screen 🚀</button>
    </div>

    <script>
        const emojis = ["⭐", "🍎", "🦋", "🪙", "🚲", "💎", "🐟", "🎈", "🍪", "🐞"];
        const themes = ["theme-basket", "theme-branch", "theme-chest", "theme-rack"];
        
        let currentScreenIdx = 0;
        let runningScore = 0;
        let selectedLeftNode = null;
        let selectedRightNode = null;
        let matchesClearedOnScreen = 0;
        
        // Dynamic Global Tracking Sets to prevent duplicates completely
        let usedEquations = new Set(); 

        function generateUniquePairs() {
            const concepts = ["array", "repeated-addition", "groups"];
            let screenPairs = [];

            concepts.forEach((type) => {
                let valid = false;
                let factor1, factor2, eqKey;

                // Loop generation pool until a completely unique math puzzle combination is hit
                while (!valid) {
                    factor1 = Math.floor(Math.random() * 4) + 2; // 2 to 5
                    factor2 = Math.floor(Math.random() * 4) + 2; // 2 to 5
                    eqKey = `${factor1}x${factor2}`;

                    if (!usedEquations.has(eqKey)) {
                        usedEquations.add(eqKey);
                        valid = true;
                    }
                }

                let pairObj = {
                    id: Math.random().toString(36).substr(2, 9),
                    expression: `${factor1} × ${factor2}`,
                    type: type,
                    emoji: emojis[Math.floor(Math.random() * emojis.length)],
                    theme: themes[Math.floor(Math.random() * themes.length)]
                };

                if (type === "array") {
                    pairObj.rows = factor1;
                    pairObj.cols = factor2;
                } else if (type === "groups") {
                    pairObj.groups = factor1;
                    pairObj.items = factor2;
                } else if (type === "repeated-addition") {
                    pairObj.text = Array(factor1).fill(factor2).join(" + ");
                }

                screenPairs.push(pairObj);
            });

            return screenPairs;
        }

        function loadScreenMatrix() {
            matchesClearedOnScreen = 0;
            selectedLeftNode = null;
            selectedRightNode = null;
            document.getElementById('next-round-btn').style.display = 'none';
            document.getElementById('round-badge').innerText = `Screen ${currentScreenIdx + 1} / 4`;
            document.getElementById('score-badge').innerText = `Score: ${runningScore}`;

            // Generate procedurally fresh non-repeating configurations
            const currentPairs = generateUniquePairs();

            let leftSideData = currentPairs.map((p, index) => ({ id: p.id, val: p.expression, link: index }));
            let rightSideData = currentPairs.map((p, index) => ({ id: p.id, raw: p, link: index }));

            leftSideData.sort(() => Math.random() - 0.5);
            rightSideData.sort(() => Math.random() - 0.5);

            const leftCol = document.getElementById('left-col');
            const rightCol = document.getElementById('right-col');
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            leftSideData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerText = item.val;
                card.dataset.link = item.link;
                card.onclick = () => selectLeft(card);
                leftCol.appendChild(card);
            });

            rightSideData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.dataset.link = item.link;
                card.onclick = () => selectRight(card);

                if (item.raw.type === "array") {
                    const box = document.createElement('div');
                    box.className = 'visual-array';
                    box.style.gridTemplateColumns = `repeat(${item.raw.cols}, 1fr)`;
                    for (let i = 0; i < (item.raw.rows * item.raw.cols); i++) {
                        box.innerHTML += `<span class="item-emoji">${item.raw.emoji}</span>`;
                    }
                    card.appendChild(box);
                } 
                else if (item.raw.type === "groups") {
                    const wrap = document.createElement('div');
                    wrap.className = 'visual-groups';
                    for (let g = 0; g < item.raw.groups; g++) {
                        const container = document.createElement('div');
                        container.className = item.raw.theme;
                        for (let i = 0; i < item.raw.items; i++) {
                            container.innerHTML += `<span class="item-emoji">${item.raw.emoji}</span>`;
                        }
                        wrap.appendChild(container);
                    }
                    card.appendChild(wrap);
                } 
                else if (item.raw.type === "repeated-addition") {
                    const textNode = document.createElement('div');
                    textNode.className = 'repeated-addition-text';
                    textNode.innerText = item.raw.text;
                    card.appendChild(textNode);
                }

                rightCol.appendChild(card);
            });
        }

        function selectLeft(card) {
            if (card.classList.contains('matched')) return;
            document.querySelectorAll('#left-col .match-card').forEach(c => c.classList.remove('selected'));
            selectedLeftNode = card;
            card.classList.add('selected');
            evaluatePairing();
        }

        function selectRight(card) {
            if (card.classList.contains('matched')) return;
            document.querySelectorAll('#right-col .match-card').forEach(c => c.classList.remove('selected'));
            selectedRightNode = card;
            card.classList.add('selected');
            evaluatePairing();
        }

        function evaluatePairing() {
            if (!selectedLeftNode || !selectedRightNode) return;

            if (selectedLeftNode.dataset.link === selectedRightNode.dataset.link) {
                selectedLeftNode.classList.replace('selected', 'matched');
                selectedRightNode.classList.replace('selected', 'matched');
                runningScore += 10;
                document.getElementById('score-badge').innerText = `Score: ${runningScore}`;
                matchesClearedOnScreen++;

                selectedLeftNode = null;
                selectedRightNode = null;

                if (matchesClearedOnScreen === 3) {
                    confetti({ particleCount: 40, spread: 60 });
                    document.getElementById('next-round-btn').style.display = 'block';
                }
            } else {
                const l = selectedLeftNode;
                const r = selectedRightNode;
                setTimeout(() => {
                    l.classList.remove('selected');
                    r.classList.remove('selected');
                }, 300);
                selectedLeftNode = null;
                selectedRightNode = null;
            }
        }

        function advanceRound() {
            if (currentScreenIdx + 1 < 4) {
                currentScreenIdx++;
                loadScreenMatrix();
            } else {
                document.getElementById('final-score-txt').innerText = `Awesome job! You cleared all 4 screens with completely unique equation signatures. Final Score: ${runningScore}`;
                document.getElementById('end-overlay').classList.add('active');
            }
        }

        function restartGame() {
            currentScreenIdx = 0;
            runningScore = 0;
            usedEquations.clear();
            document.getElementById('end-overlay').classList.remove('active');
            loadScreenMatrix();
        }

        window.onload = loadScreenMatrix;
    </script>
</body>
</html>
