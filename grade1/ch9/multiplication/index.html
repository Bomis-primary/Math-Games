<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Garden Adventure</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; font-family: Arial, sans-serif; overflow:hidden; }
body { display:flex; justify-content:center; align-items:center; background:#fff; }

/* Logo screen */
#logoScreen { width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#fff; z-index:10; }
#logoScreen img { width:200px; }

/* Game screen */
#gameScreen {
  display:none;
  width:100%; height:100%;
  position:relative;
  background: url('assets/garden-bg.png') no-repeat center bottom;
  background-size: cover;
}

/* Question at top */
#question { position:absolute; top:10px; width:100%; text-align:center; font-size:22px; color:#333; }

/* Tree container on left */
#treeContainer { position:absolute; left:20px; bottom:0; }
#tree { width:300px; object-fit:contain; }

/* Example baskets at top-right */
#exampleBaskets { position:absolute; top:50px; right:20px; display:flex; gap:15px; }
.exampleBasket { width:60px; height:60px; background:url('assets/basket.png') no-repeat center center; background-size:contain; display:flex; justify-content:center; align-items:center; font-weight:bold; color:#fff; }

/* Main basket at bottom-right */
#basket { position:absolute; bottom:80px; right:20px; width:120px; height:120px; background:url('assets/basket.png') no-repeat center center; background-size:contain; }

/* Fruits container at bottom */
#fruits { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; flex-wrap: wrap; justify-content:center; max-width:90%; }
.fruit { width:60px; margin:5px; cursor:grab; }

/* Buttons below fruits */
#buttons { position:absolute; bottom:0; left:50%; transform:translateX(-50%); display:flex; gap:20px; }
.btn { padding:10px 20px; font-size:18px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }

/* End screen */
#endScreen { display:none; width:100%; height:100%; background:url('assets/garden-bg.png') no-repeat center bottom; background-size:cover; flex-direction:column; justify-content:center; align-items:center; font-size:32px; color:#4CAF50; }
#endScreen button { padding:12px 24px; font-size:18px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }

</style>
</head>
<body>

<div id="logoScreen">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen">
  <div id="question"></div>
  
  <div id="treeContainer">
    <img id="tree" src="" alt="Fruit Tree">
  </div>
  
  <div id="exampleBaskets"></div>
  <div id="basket"></div>
  <div id="fruits"></div>
  
  <div id="buttons">
    <button id="option1" class="btn"></button>
    <button id="option2" class="btn"></button>
    <button id="nextBtn" class="btn">Next</button>
  </div>
</div>

<div id="endScreen">
  <div>🎉 Good Job! 🎉</div>
  <button id="playAgainBtn" class="btn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// Levels
const levels = [
  { tree:'assets/apple-tree.png', exampleBaskets:3, exampleFruitsPerBasket:2, correctOption:2, options:["2 groups of 3 apples","3 groups of 2 apples"], dragFruits:6, fruitImg:'assets/apple.png', show10Apples:true, basketFullImg:'assets/apples-basket.png' },
  { tree:'assets/mango-tree.png', exampleBaskets:5, exampleFruitsPerBasket:2, correctOption:1, options:["5 baskets of 2 mangoes","2 groups of 5 mangoes"], dragFruits:10, fruitImg:'assets/mango.png', show10Apples:false, basketFullImg:'assets/mango-basket.png' },
  { tree:'assets/orange-tree.png', exampleBaskets:4, exampleFruitsPerBasket:3, correctOption:1, options:["4 baskets of 3 oranges","3 groups of 4 oranges"], dragFruits:12, fruitImg:'assets/orange.png', show10Apples:false, basketFullImg:'assets/orange-basket.png' }
];

let currentLevel=0, taskPhase="MC", draggedFruit=null, collectedFruitCount=0;

// DOM
const logoScreen=document.getElementById('logoScreen');
const gameScreen=document.getElementById('gameScreen');
const endScreen=document.getElementById('endScreen');
const treeImg=document.getElementById('tree');
const exampleBasketsDiv=document.getElementById('exampleBaskets');
const fruitsDiv=document.getElementById('fruits');
const basketDiv=document.getElementById('basket');
const nextBtn=document.getElementById('nextBtn');
const option1=document.getElementById('option1');
const option2=document.getElementById('option2');
const questionDiv=document.getElementById('question');
const playAgainBtn=document.getElementById('playAgainBtn');
const correctSound=document.getElementById('correctSound');
const wrongSound=document.getElementById('wrongSound');
const clapSound=document.getElementById('clapSound');

// Start
function startGame(){
  logoScreen.style.display='flex';
  setTimeout(()=>{
    logoScreen.style.display='none';
    gameScreen.style.display='flex';
    loadLevel();
  },5000);
}

// Load level
function loadLevel(){
  const level=levels[currentLevel];
  taskPhase="MC";
  treeImg.src = level.tree;
  questionDiv.textContent="Which set matches the correct group configuration?";
  nextBtn.disabled=true;
  
  exampleBasketsDiv.innerHTML="";
  for(let i=0;i<level.exampleBaskets;i++){
    let b=document.createElement('div');
    b.className="exampleBasket";
    b.textContent=level.exampleFruitsPerBasket;
    exampleBasketsDiv.appendChild(b);
  }

  basketDiv.style.backgroundImage="url('assets/basket.png')";
  basketDiv.innerHTML="";
  fruitsDiv.innerHTML="";
  collectedFruitCount=0;

  for(let i=0;i<level.dragFruits;i++){
    let f=document.createElement('img');
    f.src=level.fruitImg;
    f.className='fruit';
    f.draggable=true;
    f.addEventListener('dragstart', e=>{ draggedFruit=e.target; });
    fruitsDiv.appendChild(f);
  }

  basketDiv.addEventListener('dragover', e=>e.preventDefault());
  basketDiv.addEventListener('drop', ()=>dropFruit(level));
}

// Drop fruit
function dropFruit(level){
  if(draggedFruit){
    draggedFruit.remove();
    collectedFruitCount++;
    draggedFruit=null;
  }
  if(collectedFruitCount === level.dragFruits){
    basketDiv.style.backgroundImage=`url('${level.basketFullImg}')`;
    questionDiv.textContent="Task complete! Click Next to continue.";
    correctSound.play();
    clapSound.play();
    nextBtn.disabled=false;
  }
}

// MC click
option1.addEventListener('click', ()=>checkMC(1));
option2.addEventListener('click', ()=>checkMC(2));
function checkMC(choice){
  const level=levels[currentLevel];
  if(choice===level.correctOption){
    correctSound.play();
    option1.style.display='none';
    option2.style.display='none';
    if(level.show10Apples){ prepareDragTaskApple(); } else { prepareDragTask(level); }
  } else { wrongSound.play(); }
}

// Drag task for apples
function prepareDragTaskApple(){
  const level=levels[currentLevel];
  taskPhase="Drag";
  questionDiv.textContent="Task: Collect the correct number of fruits in the basket";
  collectedFruitCount=0;
  fruitsDiv.innerHTML="";
  for(let i=0;i<10;i++){
    let f=document.createElement('img');
    f.src=level.fruitImg;
    f.className='fruit';
    f.draggable=true;
    f.addEventListener('dragstart', e=>{ draggedFruit=e.target; });
    fruitsDiv.appendChild(f);
  }
  basketDiv.style.backgroundImage="url('assets/basket.png')";
  basketDiv.addEventListener('dragover', e=>e.preventDefault());
  basketDiv.addEventListener('drop', ()=>dropFruit(level));
  nextBtn.disabled=true;
}

// Generic drag task
function prepareDragTask(level){
  taskPhase="Drag";
  fruitsDiv.innerHTML="";
  collectedFruitCount=0;
  for(let i=0;i<level.dragFruits;i++){
    let f=document.createElement('img');
    f.src=level.fruitImg;
    f.className='fruit';
    f.draggable=true;
    f.addEventListener('dragstart', e=>{ draggedFruit=e.target; });
    fruitsDiv.appendChild(f);
  }
  basketDiv.style.backgroundImage="url('assets/basket.png')";
  basketDiv.addEventListener('dragover', e=>e.preventDefault());
  basketDiv.addEventListener('drop', ()=>dropFruit(level));
  nextBtn.disabled=true;
}

// Next button
nextBtn.addEventListener('click', ()=>{
  collectedFruitCount=0;
  nextBtn.disabled=true;
  currentLevel++;
  if(currentLevel>=levels.length){
    gameScreen.style.display='none';
    endScreen.style.display='flex';
  } else loadLevel();
});

// Play again
playAgainBtn.addEventListener('click', ()=>{
  currentLevel=0;
  endScreen.style.display='none';
  gameScreen.style.display='flex';
  loadLevel();
});

startGame();
</script>
</body>
</html>
