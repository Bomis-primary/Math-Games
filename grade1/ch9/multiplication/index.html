<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Garden Adventure</title>
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%; font-family: Arial, sans-serif; overflow:hidden;
}
body { background:#b3e0ff; }

/* Logo splash */
#logoScreen {
  width:100%; height:100%; display:flex; justify-content:center; align-items:center;
  background:#fff; position:absolute; top:0; left:0; z-index:10;
}
#logoScreen img { width:200px; }

/* Game Screen */
#gameScreen {
  width:100%; height:100%; position:relative; display:none;
  background: url('assets/garden-bg.png') no-repeat center bottom;
  background-size:cover;
}

/* Question */
#question { position:absolute; top:10px; width:100%; text-align:center; font-size:22px; color:#000; }

/* Tree left and grounded */
#treeContainer { position:absolute; left:20px; bottom:20px; }
#tree { width:300px; }

/* Example baskets horizontal at tree base */
#exampleBaskets { position:absolute; bottom:20px; left:340px; display:flex; gap:10px; }
.exampleBasket { width:60px; height:60px; background:url('assets/basket.png') no-repeat center center; background-size:contain; display:flex; justify-content:center; align-items:center; font-weight:bold; color:#fff; }

/* Main basket bottom-right */
#mainBasket { position:absolute; bottom:80px; right:10%; width:120px; height:120px; background:url('assets/basket.png') no-repeat center center; background-size:contain; }

/* Fruits row bottom-center */
#fruitsRow { position:absolute; bottom:10%; left:50%; transform:translateX(-50%); display:flex; gap:10px; flex-wrap:wrap; }
.fruit { width:60px; cursor:grab; }

/* Buttons row */
#buttonsRow { position:absolute; bottom:2%; left:50%; transform:translateX(-50%); display:flex; gap:15px; }
.btn { padding:12px 20px; border:none; border-radius:8px; font-size:16px; background:#ff9999; color:#fff; cursor:pointer; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }

/* Feedback */
#feedback { position:absolute; bottom:12%; left:50%; transform:translateX(-50%); font-size:22px; font-weight:bold; }

/* End screen */
#endScreen { display:none; width:100%; height:100%; background:url('assets/garden-bg.png') no-repeat center bottom; background-size:cover; flex-direction:column; justify-content:center; align-items:center; font-size:32px; color:#4CAF50; }
#endScreen button { padding:12px 24px; font-size:18px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }
</style>
</head>
<body>

<div id="logoScreen">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen">
  <div id="question">There are 3 baskets with 2 apples in each. Which button matches this statement correctly?</div>

  <!-- Tree -->
  <div id="treeContainer">
    <img src="assets/apple-tree.png" id="tree" alt="Tree">
  </div>

  <!-- Example baskets -->
  <div id="exampleBaskets">
    <div class="exampleBasket">2</div>
    <div class="exampleBasket">2</div>
    <div class="exampleBasket">2</div>
  </div>

  <!-- Main basket -->
  <div id="mainBasket"></div>

  <!-- Fruits -->
  <div id="fruitsRow">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
  </div>

  <!-- Buttons -->
  <div id="buttonsRow">
    <button id="option1" class="btn">2 groups of 3 apples</button>
    <button id="option2" class="btn">3 groups of 2 apples</button>
    <button id="nextBtn" class="btn" disabled>Next</button>
  </div>

  <div id="feedback"></div>
</div>

<div id="endScreen">
  <div>🎉 Good Job! 🎉</div>
  <button id="playAgainBtn">Play Again</button>
</div>

<script>
const logoScreen = document.getElementById("logoScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");
const option1 = document.getElementById("option1");
const option2 = document.getElementById("option2");
const nextBtn = document.getElementById("nextBtn");
const feedback = document.getElementById("feedback");
const playAgainBtn = document.getElementById("playAgainBtn");

// Show splash for 5 seconds
logoScreen.style.display='flex';
gameScreen.style.display='none';
setTimeout(()=>{
  logoScreen.style.display='none';
  gameScreen.style.display='flex';
},5000);

// Button click logic
option1.addEventListener('click', ()=>{
  feedback.textContent = "❌ Wrong! Try again.";
  feedback.style.color = "red";
  option1.disabled = true;
  option2.disabled = false;
});

option2.addEventListener('click', ()=>{
  feedback.textContent = "✅ Correct!";
  feedback.style.color = "green";
  option2.disabled = true;
  option1.disabled = true;
  nextBtn.disabled = false;
});

// Next button
nextBtn.addEventListener('click', ()=>{
  alert("Move to next screen or next level here.");
  nextBtn.disabled = true;
});

// Play again reloads
playAgainBtn.addEventListener('click', ()=>{
  location.reload();
});
</script>
</body>
</html>
