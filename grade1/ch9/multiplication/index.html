<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Garden Adventure</title>
<style>
  html, body { margin:0; padding:0; height:100%; width:100%; font-family: Arial, sans-serif; overflow:hidden; }
  body { display:flex; justify-content:center; align-items:center; background:#fff; }
  #logoScreen, #gameScreen, #endScreen { width:100%; height:100%; position:absolute; top:0; left:0; display:flex; justify-content:center; align-items:center; flex-direction:column; }
  #logoScreen img { width:200px; }
  #gameScreen { display:none; background: url('garden-background.png') no-repeat center center; background-size: cover; flex-direction:column; align-items:center; }
  #tree { width:300px; margin-top:20px; }
  #fruits { display:flex; flex-wrap: wrap; justify-content:center; margin:20px 0; }
  .fruit { width:60px; margin:5px; cursor:grab; }
  #basket { width:200px; height:150px; background: url('basket.png') no-repeat center center; background-size: contain; margin-bottom:20px; position:relative; }
  #basket .fruit-in { width:50px; position:absolute; bottom:10px; left:50%; transform:translateX(-50%); }
  #buttons { display:flex; gap:20px; margin-top:10px; }
  .btn { padding:10px 20px; font-size:18px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  #endScreen { display:none; background:#fff; flex-direction:column; justify-content:center; align-items:center; font-size:32px; color:#4CAF50; }
</style>
</head>
<body>

<div id="logoScreen">
  <img src="innovine-logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen">
  <img id="tree" src="" alt="Fruit Tree">
  <div id="fruits"></div>
  <div id="basket"></div>
  <div id="buttons">
    <button id="retryBtn" class="btn">Retry</button>
    <button id="nextBtn" class="btn">Next</button>
  </div>
</div>

<div id="endScreen">
  <div>🎉 Good Job! 🎉</div>
  <button id="playAgainBtn" class="btn">Play Again</button>
</div>

<audio id="correctSound" src="correct.mp3"></audio>
<audio id="wrongSound" src="wrong.mp3"></audio>
<audio id="clapSound" src="clap.mp3"></audio>

<script>
const tasks = [
  {tree:'fruit-tree-1.png', fruit:'apple.png', perGroup:2, groups:2},
  {tree:'fruit-tree-2.png', fruit:'mango.png', perGroup:5, groups:2},
  {tree:'fruit-tree-3.png', fruit:'orange.png', perGroup:10, groups:1},
  {tree:'fruit-tree-1.png', fruit:'apple.png', perGroup:2, groups:5},
  {tree:'fruit-tree-2.png', fruit:'mango.png', perGroup:5, groups:3},
  {tree:'fruit-tree-3.png', fruit:'orange.png', perGroup:10, groups:2},
  {tree:'fruit-tree-1.png', fruit:'apple.png', perGroup:2, groups:4},
  {tree:'fruit-tree-2.png', fruit:'mango.png', perGroup:5, groups:5},
  {tree:'fruit-tree-3.png', fruit:'orange.png', perGroup:10, groups:3},
  {tree:'fruit-tree-1.png', fruit:'apple.png', perGroup:2, groups:1, mixed:[{fruit:'mango.png', perGroup:5},{fruit:'orange.png', perGroup:10}]}
];

let currentTask = 0;
let attempts = 0;

const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const treeImg = document.getElementById('tree');
const fruitsDiv = document.getElementById('fruits');
const basketDiv = document.getElementById('basket');
const nextBtn = document.getElementById('nextBtn');
const retryBtn = document.getElementById('retryBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

function startGame() {
  logoScreen.style.display = 'flex';
  setTimeout(() => {
    logoScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    loadTask();
  }, 5000);
}

function loadTask() {
  attempts = 0;
  nextBtn.disabled = true;
  retryBtn.disabled = false;
  const task = tasks[currentTask];
  treeImg.src = task.tree;
  fruitsDiv.innerHTML = '';
  basketDiv.innerHTML = '';
  let totalFruits = task.perGroup * task.groups;
  for(let i=0;i<totalFruits;i++){
    let f = document.createElement('img');
    f.src = task.fruit;
    f.className = 'fruit';
    f.draggable = true;
    f.addEventListener('dragstart', dragStart);
    fruitsDiv.appendChild(f);
  }
  basketDiv.addEventListener('dragover', dragOver);
  basketDiv.addEventListener('drop', dropFruit);
}

let draggedFruit = null;
function dragStart(e){ draggedFruit = e.target; }
function dragOver(e){ e.preventDefault(); }
function dropFruit(e){
  const task = tasks[currentTask];
  const totalFruits = task.perGroup * task.groups;
  if(fruitsDiv.contains(draggedFruit)){
    basketDiv.appendChild(draggedFruit);
  }
  if(basketDiv.children.length === totalFruits){
    correctSound.play();
    nextBtn.disabled = false;
    retryBtn.disabled = true;
    clapSound.play();
  }
}

nextBtn.addEventListener('click', ()=>{
  currentTask++;
  if(currentTask >= tasks.length){
    gameScreen.style.display='none';
    endScreen.style.display='flex';
  } else {
    loadTask();
  }
});

retryBtn.addEventListener('click', ()=>{
  loadTask();
});

playAgainBtn.addEventListener('click', ()=>{
  currentTask=0;
  endScreen.style.display='none';
  gameScreen.style.display='flex';
  loadTask();
});

startGame();
</script>
</body>
</html>
