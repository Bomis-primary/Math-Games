<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Garden Adventure</title>
<style>
html, body {
    margin:0; padding:0;
    width:100%; height:100%;
    font-family: Arial, sans-serif;
    overflow:hidden;
}
body {
    background:#fff;
}
#logoScreen, #gameScreen, #endScreen {
    width:100%; height:100%;
    position:absolute; top:0; left:0;
    display:flex; justify-content:center; align-items:center;
    flex-direction:column;
}
#logoScreen {
    z-index:10; background:#fff;
}
#logoScreen img { width:200px; }
#gameScreen {
    display:none;
    background:url('assets/garden-bg.png') no-repeat center center;
    background-size: cover;
    flex-direction:column;
}
#question { 
    font-size:22px; color:#333; text-align:center; margin-top:20px; 
}
#treeContainer {
    position: relative; width: 100%; flex:0;
}
#tree {
    position:absolute; left:50px; bottom:0;
    width:300px;
    background: transparent;
    z-index:7;
}
#exampleBaskets {
    position:absolute; bottom:40px; left:370px; display:flex; gap:15px;
    z-index:6;
}
.exampleBasket {
    width:60px; height:60px;
    background: url('assets/basket.png') no-repeat center center;
    background-size: contain;
    display:flex; justify-content:center; align-items:center;
    font-weight:bold; color:#fff; font-size:16px;
}
#basket {
    position:absolute; right:50px; bottom:20px;
    width:120px; height:120px;
    background:url('assets/basket.png') no-repeat center center;
    background-size: contain;
    z-index:8;
}
#fruits {
    position:absolute; bottom:160px; left:50%; transform:translateX(-50%);
    display:flex; flex-wrap: wrap; justify-content:center; gap:8px;
    width:90%;
    z-index:7;
}
.fruit {
    width:60px; cursor:grab;
}
#buttons {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:20px;
}
.btn {
    padding:10px 20px; font-size:18px;
    border:none; border-radius:8px;
    background:#ff9999; color:#fff;
    cursor:pointer;
}
.btn:disabled { opacity:0.5; cursor:not-allowed; }
#endScreen {
    display:none; flex-direction:column;
    justify-content:center; align-items:center;
    font-size:32px; color:#4CAF50; background:#fff;
}
</style>
</head>
<body>

<div id="logoScreen">
    <img src="assets/logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen">
    <div id="question"></div>
    <div id="treeContainer">
        <img id="tree" src="" alt="Fruit Tree">
        <div id="exampleBaskets"></div>
        <div id="basket"></div>
    </div>
    <div id="fruits"></div>
    <div id="buttons">
        <button id="option1" class="btn"></button>
        <button id="option2" class="btn"></button>
        <button id="nextBtn" class="btn">Next</button>
    </div>
</div>

<div id="endScreen">
    <div>🎉 Good Job! 🎉</div>
    <button id="playAgainBtn" class="btn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// Level data - transparent PNGs for trees
const levels = [
    { tree:'assets/apple-tree-transparent.png', exampleBaskets:3, exampleFruitsPerBasket:2, correctOption:2, options:["2 groups of 3 apples","3 groups of 2 apples"], dragFruits:6, fruitImg:'assets/apple.png', basketFullImg:'assets/apples-basket.png' },
    { tree:'assets/mango-tree-transparent.png', exampleBaskets:5, exampleFruitsPerBasket:2, correctOption:1, options:["5 baskets of 2 mangoes","2 groups of 5 mangoes"], dragFruits:10, fruitImg:'assets/mango.png', basketFullImg:'assets/mango-basket.png' },
    { tree:'assets/orange-tree-transparent.png', exampleBaskets:4, exampleFruitsPerBasket:3, correctOption:1, options:["4 baskets of 3 oranges","3 groups of 4 oranges"], dragFruits:12, fruitImg:'assets/orange.png', basketFullImg:'assets/orange-basket.png' }
];

let currentLevel = 0;
let taskPhase = "MC";
let draggedFruit = null;
let collectedFruitCount = 0;

// DOM elements
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const treeImg = document.getElementById('tree');
const exampleBasketsDiv = document.getElementById('exampleBaskets');
const fruitsDiv = document.getElementById('fruits');
const basketDiv = document.getElementById('basket');
const nextBtn = document.getElementById('nextBtn');
const option1 = document.getElementById('option1');
const option2 = document.getElementById('option2');
const questionDiv = document.getElementById('question');
const playAgainBtn = document.getElementById('playAgainBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

// Start game
function startGame(){
    logoScreen.style.display='flex';
    setTimeout(()=>{
        logoScreen.style.display='none';
        gameScreen.style.display='flex';
        loadLevel();
    },2000);
}

// Load level
function loadLevel(){
    const level = levels[currentLevel];
    taskPhase="MC";
    treeImg.src = level.tree;
    exampleBasketsDiv.innerHTML="";
    fruitsDiv.innerHTML="";
    basketDiv.style.backgroundImage = "url('assets/basket.png')";
    questionDiv.textContent="There are "+level.exampleBaskets+" baskets with "+level.exampleFruitsPerBasket+" fruits in each. Which button matches this statement correctly?";
    nextBtn.style.display='inline-block'; nextBtn.disabled = true;
    option1.style.display='inline-block'; option2.style.display='inline-block';
    option1.textContent = level.options[0]; option2.textContent = level.options[1];
    for(let i=0;i<level.exampleBaskets;i++){
        let b = document.createElement('div');
        b.className="exampleBasket";
        b.textContent=level.exampleFruitsPerBasket;
        exampleBasketsDiv.appendChild(b);
    }
}

// MC click
option1.addEventListener('click', ()=>checkMC(1));
option2.addEventListener('click', ()=>checkMC(2));

function checkMC(choice){
    const level = levels[currentLevel];
    if(choice===level.correctOption){
        correctSound.play();
        option1.style.display='none'; option2.style.display='none';
        prepareDragTask(level);
    } else { wrongSound.play(); }
}

// Drag task
function prepareDragTask(level){
    taskPhase="Drag"; fruitsDiv.innerHTML=""; collectedFruitCount=0;
    questionDiv.textContent="Task: Collect the correct number of fruits in the main basket";
    for(let i=0;i<level.dragFruits;i++){
        let f = document.createElement('img');
        f.src=level.fruitImg;
        f.className='fruit';
        f.draggable=true;
        f.addEventListener('dragstart', e=>{ draggedFruit=e.target; });
        fruitsDiv.appendChild(f);
    }
    basketDiv.innerHTML=""; basketDiv.style.backgroundImage = "url('assets/basket.png')";
    basketDiv.addEventListener('dragover', e=>e.preventDefault());
    basketDiv.addEventListener('drop', dropFruit);
    nextBtn.disabled = true;
}

function dropFruit(e){
    if(draggedFruit){ draggedFruit.remove(); collectedFruitCount++; draggedFruit=null; }
    const level = levels[currentLevel];
    if(collectedFruitCount===level.dragFruits){
        basketDiv.style.backgroundImage = `url('${level.basketFullImg}')`;
        questionDiv.textContent="Task complete! Click Next to continue.";
        correctSound.play(); clapSound.play();
        nextBtn.disabled=false;
    }
}

// Next button
nextBtn.addEventListener('click', ()=>{
    collectedFruitCount=0; nextBtn.disabled=true;
    currentLevel++;
    if(currentLevel>=levels.length){
        gameScreen.style.display='none'; endScreen.style.display='flex';
    } else loadLevel();
});

// Play Again
playAgainBtn.addEventListener('click', ()=>{
    currentLevel=0;
    endScreen.style.display='none';
    gameScreen.style.display='flex';
    loadLevel();
});

startGame();
</script>
</body>
</html>
