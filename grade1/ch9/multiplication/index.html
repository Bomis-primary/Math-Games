<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Garden Adventure</title>
<style>
html, body { margin:0; padding:0; height:100%; width:100%; font-family: Arial, sans-serif; overflow:hidden; }
body { display:flex; justify-content:center; align-items:center; background:#fff; }
#logoScreen, #gameScreen, #endScreen { width:100%; height:100%; position:absolute; top:0; left:0; display:flex; justify-content:center; align-items:center; flex-direction:column; }
#logoScreen img { width:200px; }
#logoScreen { z-index:10; background:#fff; }
#gameScreen { display:none; background: url('assets/garden-background.png') no-repeat center center; background-size: cover; flex-direction:column; align-items:center; z-index:1; }
#tree { width:300px; margin-top:20px; }
#exampleBaskets { display:flex; justify-content:center; margin:10px 0; gap:15px; }
.exampleBasket { width:80px; height:60px; background: url('assets/basket.png') no-repeat center center; background-size: contain; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:16px; color:#fff; }
#fruits { display:flex; flex-wrap: wrap; justify-content:center; margin:20px 0; }
.fruit { width:60px; margin:5px; cursor:grab; }
#basket { width:200px; height:150px; background: url('assets/basket.png') no-repeat center center; background-size: contain; margin-bottom:20px; position:relative; }
#buttons { display:flex; gap:20px; margin-top:10px; }
.btn { padding:10px 20px; font-size:18px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
#question { font-size:22px; color:#333; margin-bottom:10px; text-align:center; }
#endScreen { display:none; background:#fff; flex-direction:column; justify-content:center; align-items:center; font-size:32px; color:#4CAF50; }
</style>
</head>
<body>

<!-- Innovine Logo Screen -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <div id="question"></div>
  <img id="tree" src="" alt="Fruit Tree">
  <div id="exampleBaskets"></div>
  <div id="fruits"></div>
  <div id="basket"></div>
  <div id="buttons">
    <button id="option1" class="btn"></button>
    <button id="option2" class="btn"></button>
    <button id="nextBtn" class="btn">Next</button>
  </div>
</div>

<!-- End Screen -->
<div id="endScreen">
  <div>🎉 Good Job! 🎉</div>
  <button id="playAgainBtn" class="btn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clap.mp3"></audio>

<script>
// Level data
const levels = [
  { tree:'assets/apple-tree.png', exampleBaskets:3, exampleFruitsPerBasket:2, correctOption:2, options:["2 groups of 3 apples","3 groups of 2 apples"], dragFruits:6, fruitImg:'assets/apple.png' },
  { tree:'assets/mango-tree.png', exampleBaskets:5, exampleFruitsPerBasket:2, correctOption:1, options:["5 baskets of 2 mangoes","2 groups of 5 mangoes"], dragFruits:10, fruitImg:'assets/mango.png' },
  { tree:'assets/orange-tree.png', exampleBaskets:4, exampleFruitsPerBasket:3, correctOption:1, options:["4 baskets of 3 oranges","3 groups of 4 oranges"], dragFruits:12, fruitImg:'assets/orange.png' }
];

let currentLevel = 0;
let taskPhase = "MC"; // "MC" = multiple choice, "Drag" = drag & drop

// DOM Elements
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const treeImg = document.getElementById('tree');
const exampleBasketsDiv = document.getElementById('exampleBaskets');
const fruitsDiv = document.getElementById('fruits');
const basketDiv = document.getElementById('basket');
const nextBtn = document.getElementById('nextBtn');
const option1 = document.getElementById('option1');
const option2 = document.getElementById('option2');
const questionDiv = document.getElementById('question');
const playAgainBtn = document.getElementById('playAgainBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

// Start game with logo
function startGame(){
  logoScreen.style.display='flex';
  setTimeout(()=>{
    logoScreen.style.display='none';
    gameScreen.style.display='flex';
    loadLevel();
  },5000);
}

// Load current level
function loadLevel(){
  const level = levels[currentLevel];
  taskPhase="MC";
  treeImg.src = level.tree;
  exampleBasketsDiv.innerHTML="";
  fruitsDiv.innerHTML="";
  basketDiv.innerHTML="";
  questionDiv.textContent="Which set matches the correct group configuration?";
  nextBtn.style.display='none';
  option1.style.display='inline-block';
  option2.style.display='inline-block';
  option1.textContent = level.options[0];
  option2.textContent = level.options[1];

  // Draw example baskets
  for(let i=0;i<level.exampleBaskets;i++){
    let b = document.createElement('div');
    b.className="exampleBasket";
    b.textContent=level.exampleFruitsPerBasket;
    exampleBasketsDiv.appendChild(b);
  }
}

// Multiple choice click handlers
option1.addEventListener('click', ()=>checkMC(1));
option2.addEventListener('click', ()=>checkMC(2));

function checkMC(choice){
  const level = levels[currentLevel];
  if(choice===level.correctOption){
    correctSound.play();
    option1.style.display='none';
    option2.style.display='none';
    prepareDragTask();
  } else {
    wrongSound.play();
  }
}

// Prepare Drag task
function prepareDragTask(){
  const level = levels[currentLevel];
  taskPhase="Drag";
  questionDiv.textContent="Task: Collect the correct number of fruits in the basket";

  exampleBasketsDiv.innerHTML="";
  for(let i=0;i<level.exampleBaskets;i++){
    let b = document.createElement('div');
    b.className="exampleBasket";
    b.textContent=level.exampleFruitsPerBasket;
    exampleBasketsDiv.appendChild(b);
  }

  // Generate draggable fruits
  fruitsDiv.innerHTML="";
  for(let i=0;i<level.dragFruits;i++){
    let f = document.createElement('img');
    f.src=level.fruitImg;
    f.className='fruit';
    f.draggable=true;
    f.addEventListener('dragstart', dragStart);
    fruitsDiv.appendChild(f);
  }

  basketDiv.addEventListener('dragover', dragOver);
  basketDiv.addEventListener('drop', dropFruit);
}

// Drag & drop handlers
let draggedFruit=null;
function dragStart(e){ draggedFruit=e.target; }
function dragOver(e){ e.preventDefault(); }
function dropFruit(e){
  const level = levels[currentLevel];
  if(fruitsDiv.contains(draggedFruit)){
    basketDiv.appendChild(draggedFruit);
  }
  if(basketDiv.children.length===level.dragFruits){
    correctSound.play();
    clapSound.play();
    nextBtn.style.display='inline-block';
  }
}

// Next button
nextBtn.addEventListener('click', ()=>{
  currentLevel++;
  if(currentLevel>=levels.length){
    gameScreen.style.display='none';
    endScreen.style.display='flex';
  } else loadLevel();
});

// Play Again
playAgainBtn.addEventListener('click', ()=>{
  currentLevel=0;
  endScreen.style.display='none';
  gameScreen.style.display='flex';
  loadLevel();
});

startGame();
</script>
</body>
</html>
