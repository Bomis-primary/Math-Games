<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Garden Adventure</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; font-family: Arial, sans-serif; overflow:hidden; }
body { background: #b3e0ff; }

#logoScreen {
  width:100%; height:100%;
  display:flex; justify-content:center; align-items:center;
  background:#fff; z-index:10; position:absolute; top:0; left:0;
}
#logoScreen img { width:200px; }

#gameScreen {
  display:none; width:100%; height:100%; position:relative;
  background: url('assets/garden-bg.png') no-repeat center bottom;
  background-size: cover;
}

#question { position:absolute; top:10px; width:100%; text-align:center; font-size:22px; color:#333; }

/* Tree */
#treeContainer { position:absolute; left:2%; bottom:0; }
#tree { width:300px; }

/* Example baskets horizontal at base of tree */
#exampleBaskets {
  position:absolute; bottom:0; left:2%; display:flex; gap:10px; margin-top:5px;
}
.exampleBasket { width:60px; height:60px; background:url('assets/basket.png') no-repeat center center; background-size:contain; display:flex; justify-content:center; align-items:center; font-weight:bold; color:#fff; }

/* Main basket bottom-right */
#mainBasket { position:absolute; bottom:80px; right:10%; width:120px; height:120px; background:url('assets/basket.png') no-repeat center center; background-size:contain; }

/* Fruits bottom-center */
#fruitsRow { position:absolute; bottom:15%; left:50%; transform:translateX(-50%); display:flex; gap:10px; flex-wrap:wrap; }
.fruit { width:60px; cursor:grab; }

/* Buttons */
#buttonsRow { position:absolute; bottom:5%; left:50%; transform:translateX(-50%); display:flex; gap:15px; }
.btn { padding:12px 20px; border:none; border-radius:8px; font-size:16px; background:#ff9999; color:#fff; cursor:pointer; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }

/* End screen */
#endScreen { display:none; width:100%; height:100%; background:url('assets/garden-bg.png') no-repeat center bottom; background-size:cover; flex-direction:column; justify-content:center; align-items:center; font-size:32px; color:#4CAF50; }
#endScreen button { padding:12px 24px; font-size:18px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }
</style>
</head>
<body>

<div id="logoScreen">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen">
  <div id="question">Which set matches the correct group configuration?</div>

  <div id="treeContainer">
    <img id="tree" src="assets/apple-tree.png" alt="Tree">
  </div>

  <div id="exampleBaskets">
    <div class="exampleBasket">2</div>
    <div class="exampleBasket">2</div>
    <div class="exampleBasket">2</div>
  </div>

  <div id="mainBasket"></div>

  <div id="fruitsRow">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
    <img src="assets/apple.png" class="fruit" draggable="true">
  </div>

  <div id="buttonsRow">
    <button id="btn1" class="btn">2 groups of 3 apples</button>
    <button id="btn2" class="btn">3 groups of 2 apples</button>
    <button id="nextBtn" class="btn" disabled>Next</button>
  </div>
</div>

<div id="endScreen">
  <div>🎉 Good Job! 🎉</div>
  <button id="playAgainBtn">Play Again</button>
</div>

<script>
const correctButton = document.getElementById("btn2");
const nextBtn = document.getElementById("nextBtn");

correctButton.addEventListener("click", () => {
  alert("Correct!");
  nextBtn.disabled = false;
});

document.getElementById("btn1").addEventListener("click", () => {
  alert("Try Again!");
});

// Play again
document.getElementById("playAgainBtn").addEventListener("click", ()=>{
  location.reload();
});

// Start logo screen
const logoScreen = document.getElementById("logoScreen");
const gameScreen = document.getElementById("gameScreen");

logoScreen.style.display='flex';
setTimeout(()=>{
  logoScreen.style.display='none';
  gameScreen.style.display='block';
},3000);
</script>

</body>
</html>
