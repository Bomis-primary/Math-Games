<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchard Fruit Game</title>
<style>
body, html { margin:0; padding:0; width:100%; height:100%; font-family:Arial, sans-serif; overflow:hidden; }
#splash, .screen { width:100%; height:100%; position:absolute; top:0; left:0; display:flex; justify-content:center; align-items:center; flex-direction:column; }
#splash { background:#fff; z-index:10; }
#splash img { width:200px; }
.screen { display:none; position:relative; flex-direction:column; justify-content:flex-start; align-items:center; }
#screen2 { background:url('assets/orchard-bg.jpg') no-repeat center bottom; background-size:cover; }
#screen2 .title { position:absolute; top:50px; text-align:center; color:#fff; }
#screen2 .title h1 { font-size:36px; margin:0; font-weight:bold; }
#screen2 .title p { font-size:24px; margin-top:10px; }
#screen3 { background:url('assets/orchard-bg.jpg') no-repeat center bottom; background-size:cover; }
.basket-container { display:flex; gap:30px; margin-top:200px; }
.basket { position:relative; }
.basket img { width:202px; height:202px; }
.basket-label { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); font-size:32px; font-weight:bold; color:white; pointer-events:none; }
#screen3 .instruction { color:#fff; font-size:22px; margin-top:20px; text-align:center; }
#screen3 .buttons { display:flex; gap:20px; margin-top:20px; }
.btn { padding:14px 28px; font-size:25px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
</style>
</head>
<body>

<!-- Screen 1: Splash -->
<div id="splash">
    <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- Screen 2: Title + Mission -->
<div id="screen2" class="screen">
    <div class="title">
        <h1>Orchard Fruit Collector</h1>
        <p>Mission: Collect the fruits into the baskets and complete the challenge!</p>
    </div>
</div>

<!-- Screen 3: 3 baskets with buttons -->
<div id="screen3" class="screen">
    <div class="basket-container">
        <div class="basket">
            <img src="assets/basket.png">
            <div class="basket-label">2</div>
        </div>
        <div class="basket">
            <img src="assets/basket.png">
            <div class="basket-label">2</div>
        </div>
        <div class="basket">
            <img src="assets/basket.png">
            <div class="basket-label">2</div>
        </div>
    </div>
    <div class="instruction">Look at the baskets and click the correct button to continue</div>
    <div class="buttons">
        <button class="btn" id="btn1">2 groups of 3 apples</button>
        <button class="btn" id="btn2">3 groups of 2 apples</button>
    </div>
</div>

<script>
// Show splash screen then move to screen2
setTimeout(()=>{
    document.getElementById('splash').style.display='none';
    document.getElementById('screen2').style.display='flex';
},2000);

// After 2 seconds on screen2, show screen3
setTimeout(()=>{
    document.getElementById('screen2').style.display='none';
    document.getElementById('screen3').style.display='flex';
},4000);

// Button logic on screen3
document.getElementById('btn1').addEventListener('click', ()=>{
    alert("Wrong! Try again.");
});
document.getElementById('btn2').addEventListener('click', ()=>{
    // Move to next screen (screen4, or drag-and-drop in main game)
    alert("Correct! Moving to the next screen.");
    // Replace with: showScreen('screen4'); when next screen is ready
});
</script>

</body>
</html>
