<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Basket Game</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; font-family: Arial, sans-serif; overflow:hidden; background:#4CAF50; }
#gameScreen { width:100%; height:100%; position:relative; display:flex; justify-content:center; align-items:center; flex-direction:column; }
#question { font-size:22px; color:#fff; text-align:center; margin-bottom:20px; }
#basketContainer { position:relative; width:100%; display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px; }
.basket-img { width:202px; height:202px; user-select:none; pointer-events:none; }
#fruits { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.fruit { width:60px; cursor:grab; }
#buttons { display:flex; gap:20px; }
.btn { padding:14px 28px; font-size:25px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
#endScreen { display:none; flex-direction:column; justify-content:center; align-items:center; font-size:32px; color:#fff; background:#4CAF50; height:100%; width:100%; position:absolute; top:0; left:0; }
</style>
</head>
<body>

<div id="gameScreen">
    <div id="question">There are 5 baskets with 2 fruits in each. Which button matches this statement correctly?</div>
    <div id="basketContainer">
        <img class="basket-img" src="assets/basket.png" alt="Basket 1">
        <img class="basket-img" src="assets/basket.png" alt="Basket 2">
        <img class="basket-img" src="assets/basket.png" alt="Basket 3">
        <img class="basket-img" src="assets/basket.png" alt="Basket 4">
        <img class="basket-img" src="assets/basket.png" alt="Basket 5">
    </div>
    <div id="fruits">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
        <img class="fruit" src="assets/mango.png" draggable="true">
    </div>
    <div id="buttons">
        <button class="btn" id="option1">5 baskets of 2 mangoes</button>
        <button class="btn" id="option2">2 groups of 5 mangoes</button>
        <button class="btn" id="nextBtn" disabled>Next</button>
    </div>
</div>

<div id="endScreen">
    🎉 Good Job! 🎉
    <button class="btn" id="playAgainBtn">Play Again</button>
</div>

<script>
const option1 = document.getElementById('option1');
const option2 = document.getElementById('option2');
const nextBtn = document.getElementById('nextBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const endScreen = document.getElementById('endScreen');

option1.addEventListener('click', () => {
    alert("Correct!");
    nextBtn.disabled = false;
});
option2.addEventListener('click', () => {
    alert("Wrong! Try again.");
});

nextBtn.addEventListener('click', () => {
    document.getElementById('gameScreen').style.display = 'none';
    endScreen.style.display = 'flex';
});

playAgainBtn.addEventListener('click', () => {
    endScreen.style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';
    nextBtn.disabled = true;
});
</script>
</body>
</html>
