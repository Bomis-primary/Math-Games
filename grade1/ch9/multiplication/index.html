<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplication Level 1 - Matrix Match</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #4834d4;
            --secondary: #ff7043;
            --text-main: #2c3e50;
            --success: #2e7d32;
        }

        * {
            box-sizing: border-box;
            font-family: 'Capriola', 'Comic Sans MS', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #dff9fb 0%, #c7ecee 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: white;
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 4px solid #fff;
            text-align: center;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .level-badge {
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
        }

        h1 {
            color: var(--text-main);
            font-size: 24px;
            margin: 0 0 5px 0;
        }

        .instruction {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* --- THE SPLIT BOARD GRID --- */
        .matching-board {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- CARD STYLING --- */
        .match-card {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 20px;
            padding: 15px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Mathematical Expressions Layout */
        .column-left .match-card {
            background: #e0e7ff;
            border-color: #c7d2fe;
            color: var(--primary-dark);
            font-size: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        /* Selection States */
        .match-card.selected {
            border-color: var(--primary);
            background: #eeebff;
            transform: scale(1.03);
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.15);
        }

        /* Perfect Match Connection State */
        .match-card.matched {
            background: #e2f0d9 !important;
            border-color: #a9d08e !important;
            color: var(--success) !important;
            cursor: default;
            opacity: 0.8;
            pointer-events: none;
            transform: scale(1);
        }

        /* --- VISUAL MECHANICAL RENDERS --- */
        .visual-array {
            display: grid;
            gap: 5px;
            padding: 8px;
            background: #fff;
            border: 3px solid #6c5ce7;
            border-radius: 12px;
        }

        .visual-groups {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .theme-basket {
            background: #fff;
            border: 2px dashed #ff7043;
            padding: 6px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .repeated-addition-text {
            font-size: 20px;
            color: #ff7043;
            letter-spacing: 1px;
        }

        .item-emoji {
            font-size: 18px;
            display: inline-block;
            margin: 1px;
        }

        .action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header-meta">
            <div class="level-badge">Level 1 Concept Exploration</div>
        </div>

        <h1>Multiplication Concept Connector</h1>
        <div class="instruction">Connect each multiplication expression to its true graphical model!</div>

        <div class="matching-board">
            <div class="column column-left" id="left-col"></div>
            <div class="column column-right" id="right-col"></div>
        </div>

        <button class="action-btn" id="complete-btn" onclick="celebrateFinish()">Finish Chapter Loop 🎉</button>
    </div>

    <script>
        // STRICT LEVEL 1 SETUP: 3 different expressions mapping directly to the distinct concepts
        const level1Data = [
            { id: "pair1", expression: "4 × 5", type: "array", rows: 4, cols: 5, emoji: "⭐" },
            { id: "pair2", expression: "3 × 2", type: "repeated-addition", text: "2 + 2 + 2" },
            { id: "pair3", expression: "2 × 4", type: "groups", groups: 2, items: 4, emoji: "🐟" }
        ];

        let selectedLeftNode = null;
        let selectedRightNode = null;
        let totalMatchesCleared = 0;

        function buildLevel1Matrix() {
            totalMatchesCleared = 0;
            selectedLeftNode = null;
            selectedRightNode = null;

            // Generate structural deep copies to shuffle left expressions independently from right layouts
            let leftCards = level1Data.map((d, index) => ({ id: d.id, val: d.expression, link: index }));
            let rightCards = level1Data.map((d, index) => ({ id: d.id, raw: d, link: index }));

            // High entropy random shuffle
            leftCards.sort(() => Math.random() - 0.5);
            rightCards.sort(() => Math.random() - 0.5);

            const leftColElement = document.getElementById('left-col');
            const rightColElement = document.getElementById('right-col');
            leftColElement.innerHTML = '';
            rightColElement.innerHTML = '';

            // 1. Render Left Blocks (Expressions)
            leftCards.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerText = item.val;
                card.dataset.link = item.link;
                card.onclick = () => triggerLeftSelection(card);
                leftColElement.appendChild(card);
            });

            // 2. Render Right Blocks (Dynamic Visual Layouts)
            rightCards.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.dataset.link = item.link;
                card.onclick = () => triggerRightSelection(card);

                if (item.raw.type === "array") {
                    // Strict Grid Matrix Render
                    const arrayBox = document.createElement('div');
                    arrayBox.className = 'visual-array';
                    arrayBox.style.gridTemplateColumns = `repeat(${item.raw.cols}, 1fr)`;
                    for (let i = 0; i < (item.raw.rows * item.raw.cols); i++) {
                        arrayBox.innerHTML += `<span class="item-emoji">${item.raw.emoji}</span>`;
                    }
                    card.appendChild(arrayBox);
                } 
                else if (item.raw.type === "groups") {
                    // Individual Grouping Baskets Render
                    const groupsBox = document.createElement('div');
                    groupsBox.className = 'visual-groups';
                    for (let g = 0; g < item.raw.groups; g++) {
                        const basket = document.createElement('div');
                        basket.className = 'theme-basket';
                        for (let i = 0; i < item.raw.items; i++) {
                            basket.innerHTML += `<span class="item-emoji">${item.raw.emoji}</span>`;
                        }
                        groupsBox.appendChild(basket);
                    }
                    card.appendChild(groupsBox);
                } 
                else if (item.raw.type === "repeated-addition") {
                    // Pure Repeated Addition Expression Render
                    const textContainer = document.createElement('div');
                    textContainer.className = 'repeated-addition-text';
                    textContainer.innerText = item.raw.text;
                    card.appendChild(textContainer);
                }

                rightColElement.appendChild(card);
            });
        }

        function triggerLeftSelection(card) {
            if (card.classList.contains('matched')) return;
            document.querySelectorAll('#left-col .match-card').forEach(c => c.classList.remove('selected'));
            selectedLeftNode = card;
            card.classList.add('selected');
            verifyConnection();
        }

        function triggerRightSelection(card) {
            if (card.classList.contains('matched')) return;
            document.querySelectorAll('#right-col .match-card').forEach(c => c.classList.remove('selected'));
            selectedRightNode = card;
            card.classList.add('selected');
            verifyConnection();
        }

        function verifyConnection() {
            if (!selectedLeftNode || !selectedRightNode) return;

            if (selectedLeftNode.dataset.link === selectedRightNode.dataset.link) {
                // SUCCESS MATCH MATCH
                selectedLeftNode.classList.replace('selected', 'matched');
                selectedRightNode.classList.replace('selected', 'matched');
                totalMatchesCleared++;

                selectedLeftNode = null;
                selectedRightNode = null;

                if (totalMatchesCleared === level1Data.length) {
                    confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                    document.getElementById('complete-btn').style.display = 'block';
                }
            } else {
                // FAILURE MISMATCH - Reset selected nodes with a subtle delay
                const leftNodeToReset = selectedLeftNode;
                const rightNodeToReset = selectedRightNode;
                setTimeout(() => {
                    leftNodeToReset.classList.remove('selected');
                    rightNodeToReset.classList.remove('selected');
                }, 300);
                selectedLeftNode = null;
                selectedRightNode = null;
            }
        }

        function celebrateFinish() {
            confetti({ particleCount: 150, spread: 100 });
            alert("Chapter 1 Competency Matrix Verified!");
        }

        window.onload = buildLevel1Matrix;
    </script>
</body>
</html>
