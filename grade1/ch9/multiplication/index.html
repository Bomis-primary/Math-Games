<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Garden Adventure</title>
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%; font-family: Arial, sans-serif; overflow:hidden;
}

/* Logo screen */
#logoScreen {
  width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#fff; z-index:10;
}
#logoScreen img { width:200px; }

/* Game screen */
#gameScreen {
  width:100%; height:100%;
  display:none;
  position:relative;
  padding:20px;
  box-sizing:border-box;
  background: url('assets/garden-bg.png') no-repeat center bottom;
  background-size: cover;
}

/* Horizontal row layout */
#gameRow {
  display:flex;
  align-items:flex-end; /* align elements to "ground" */
  gap:20px;
  margin-left:50px; /* spacing from left */
}

/* Tree */
#tree {
  width:200px;
  object-fit:contain;
}

/* Example baskets */
.exampleBasket {
  width:60px; height:60px;
  background: url('assets/basket.png') no-repeat center center;
  background-size: contain;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; color:#fff;
}

/* Big basket */
#basket {
  width:120px; height:120px;
  background: url('assets/basket.png') no-repeat center center;
  background-size: contain;
}

/* Fruits container */
#fruits { display:flex; flex-wrap: wrap; justify-content:center; margin:20px 0 80px 0; }

/* Fruit images */
.fruit { width:60px; margin:5px; cursor:grab; }

/* Question text */
#question { font-size:22px; color:#333; text-align:center; margin-bottom:10px; }

/* Next button */
#nextBtn {
  position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
  padding:12px 24px; font-size:18px; border:none; border-radius:8px;
  background:#ff9999; color:#fff; cursor:pointer;
}

/* End screen */
#endScreen {
  display:none; width:100%; height:100%; background: url('assets/garden-bg.png') no-repeat center bottom;
  background-size:cover; flex-direction:column; justify-content:center; align-items:center;
  font-size:32px; color:#4CAF50;
}
#endScreen button { padding:12px 24px; font-size:18px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }

</style>
</head>
<body>

<!-- Logo screen -->
<div id="logoScreen">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- Game screen -->
<div id="gameScreen">
  <div id="question"></div>
  <div id="gameRow">
    <img id="tree" src="" alt="Fruit Tree">
    <div class="exampleBasket"></div>
    <div class="exampleBasket"></div>
    <div class="exampleBasket"></div>
    <div id="basket"></div>
  </div>
  <div id="fruits"></div>
  <button id="nextBtn" disabled>Next</button>
</div>

<!-- End screen -->
<div id="endScreen">
  <div>🎉 Good Job! 🎉</div>
  <button id="playAgainBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// Level data
const levels = [
  { tree:'assets/apple-tree.png', exampleBaskets:3, exampleFruitsPerBasket:2, correctOption:2, options:["2 groups of 3 apples","3 groups of 2 apples"], dragFruits:6, fruitImg:'assets/apple.png', basketFullImg:'assets/apples-basket.png' },
  { tree:'assets/mango-tree.png', exampleBaskets:5, exampleFruitsPerBasket:2, correctOption:1, options:["5 baskets of 2 mangoes","2 groups of 5 mangoes"], dragFruits:10, fruitImg:'assets/mango.png', basketFullImg:'assets/mango-basket.png' },
  { tree:'assets/orange-tree.png', exampleBaskets:4, exampleFruitsPerBasket:3, correctOption:1, options:["4 baskets of 3 oranges","3 groups of 4 oranges"], dragFruits:12, fruitImg:'assets/orange.png', basketFullImg:'assets/basket-full.png' }
];

let currentLevel=0;
let taskPhase="MC";
let draggedFruit=null;
let collectedFruitCount=0;

// DOM Elements
const logoScreen=document.getElementById('logoScreen');
const gameScreen=document.getElementById('gameScreen');
const endScreen=document.getElementById('endScreen');
const treeImg=document.getElementById('tree');
const exampleBaskets=document.getElementsByClassName('exampleBasket');
const basketDiv=document.getElementById('basket');
const fruitsDiv=document.getElementById('fruits');
const nextBtn=document.getElementById('nextBtn');
const questionDiv=document.getElementById('question');
const playAgainBtn=document.getElementById('playAgainBtn');
const correctSound=document.getElementById('correctSound');
const wrongSound=document.getElementById('wrongSound');
const clapSound=document.getElementById('clapSound');

// Start game
function startGame(){
  logoScreen.style.display='flex';
  setTimeout(()=>{
    logoScreen.style.display='none';
    gameScreen.style.display='block';
    loadLevel();
  },3000);
}

// Load level
function loadLevel(){
  const level=levels[currentLevel];
  taskPhase="MC";
  treeImg.src=level.tree;
  questionDiv.textContent="Which set matches the correct group configuration?";
  nextBtn.disabled=true;

  // Fill small baskets
  for(let i=0;i<exampleBaskets.length;i++){
    exampleBaskets[i].textContent=level.exampleFruitsPerBasket;
    exampleBaskets[i].style.backgroundImage="url('assets/basket.png')";
  }

  // Clear big basket
  basketDiv.style.backgroundImage="url('assets/basket.png')";
  basketDiv.innerHTML="";
  fruitsDiv.innerHTML="";
  collectedFruitCount=0;

  // Add fruit options
  for(let i=0;i<level.dragFruits;i++){
    let f=document.createElement('img');
    f.src=level.fruitImg;
    f.className='fruit';
    f.draggable=true;
    f.addEventListener('dragstart',e=>{ draggedFruit=e.target; });
    fruitsDiv.appendChild(f);
  }

  // Setup basket drop
  basketDiv.addEventListener('dragover', e=>e.preventDefault());
  basketDiv.addEventListener('drop', dropFruit);
}

// Drop fruit
function dropFruit(e){
  if(draggedFruit){
    draggedFruit.remove();
    collectedFruitCount++;
    draggedFruit=null;
  }
  const level=levels[currentLevel];
  if(collectedFruitCount===level.dragFruits){
    basketDiv.style.backgroundImage=`url('${level.basketFullImg}')`;
    correctSound.play();
    clapSound.play();
    nextBtn.disabled=false;
  }
}

// Next button
nextBtn.addEventListener('click', ()=>{
  currentLevel++;
  if(currentLevel>=levels.length){
    gameScreen.style.display='none';
    endScreen.style.display='flex';
  } else loadLevel();
});

// Play again
playAgainBtn.addEventListener('click', ()=>{
  currentLevel=0;
  endScreen.style.display='none';
  gameScreen.style.display='block';
  loadLevel();
});

startGame();
</script>
</body>
</html>
