<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multiplication Island Quest - Fixed Matching</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --secondary: #ff7043; 
            --secondary-dark: #d84315;
            --bg-island: #f7f9fa;
            --text-dark: #2c3e50;
            --text-muted: #5a738e;
            --success: #2e7d32;
        }

        * {
            box-sizing: border-box;
            font-family: 'Capriola', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #dff9fb 0%, #c7ecee 40%, #f7d794 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- SPLASH SCREEN PANEL --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
            padding: 20px;
        }

        .brand-logo-img {
            max-width: 240px;
            max-height: 90px;
            object-fit: contain;
        }

        /* --- STAGE OVERLAYS --- */
        .stage-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9990;
            color: white;
            text-align: center;
            padding: 25px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .stage-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 100%;
        }

        .slide-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        /* --- MAIN GAME CONTAINER --- */
        .game-container {
            background: var(--bg-island);
            border: 6px solid #fff;
            border-radius: 32px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            display: none;
            position: relative;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .level-badge {
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
        }

        .score-badge {
            background: #fff;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
        }

        h1 {
            color: var(--text-dark);
            margin: 0 0 12px 0;
            font-size: 22px;
        }

        .progress-bar {
            background: #e2e8f0;
            border-radius: 50px;
            height: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .instruction-card {
            font-size: 15px;
            color: var(--text-dark);
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.5;
            background: white;
            padding: 15px;
            border-radius: 18px;
            border-left: 6px solid var(--primary);
            text-align: left;
        }

        .hint-box {
            background: #fef9c3;
            border: 2px dashed #facc15;
            color: #713f12;
            padding: 10px 15px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }

        /* --- INTERACTIVE WORKSPACE & CONTAINER ENGINE --- */
        .workspace {
            background: #ffffff;
            border: 3px dashed #cbd5e1;
            border-radius: 24px;
            min-height: 180px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        /* Dynamic Grid Layout for Arrays */
        .array-grid {
            display: grid;
            gap: 8px;
            background: #f8fafc;
            border: 3px solid #6c5ce7; /* Distinct Border for Arrays */
            border-radius: 18px;
            padding: 15px;
        }

        /* Equal Groups Container */
        .groups-layout {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        /* --- THEMED CONTAINERS (FIXES MANAGER FEEDBACK) --- */
        .theme-default {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 10px;
        }

        /* Actual Branch styling for butterflies */
        .theme-branch {
            background: linear-gradient(90deg, #8b5a2b 0%, #a0522d 100%);
            border-radius: 20px;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            min-width: 70px;
        }

        /* Actual Rack styling for bikes */
        .theme-rack {
            border: 4px solid #64748b;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 10px;
            position: relative;
        }
        .theme-rack::after {
            content: '';
            position: absolute;
            bottom: 2px; left: 5%; right: 5%;
            height: 4px; background: #64748b;
        }

        /* Actual Chest styling for gold coins */
        .theme-chest {
            background: #b45309;
            border: 4px solid #78350f;
            border-radius: 14px;
            padding: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .group-item {
            font-size: 24px;
            display: inline-block;
            margin: 2px;
        }

        /* --- DRAG & DROP TARGET ZONE --- */
        .drop-zone {
            width: 100%;
            min-height: 65px;
            background: #edf2f7;
            border: 3px dashed var(--primary-light);
            border-radius: 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            padding: 8px;
        }

        .drop-zone.hovered {
            background: #e0e7ff;
            border-color: var(--primary);
        }

        /* --- DRAGGABLE BENCH ELEMENTS --- */
        .options-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .drag-card {
            background: var(--secondary);
            border-bottom: 5px solid var(--secondary-dark);
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 20px;
            cursor: grab;
            touch-action: none;
        }

        .drag-card.dragging {
            opacity: 0.7;
            position: fixed;
            z-index: 10000;
            pointer-events: none;
        }

        .drop-zone .drag-card {
            cursor: default;
            width: 100%;
            max-width: 260px;
        }

        .drop-zone .drag-card.correct { background: var(--success) !important; border-color: #1b5e20 !important; }
        .drop-zone .drag-card.wrong { background: #c62828 !important; border-color: #5a1212 !important; animation: shake 0.4s ease; }

        .action-btn {
            background: #fff;
            color: var(--primary);
            border: none;
            border-bottom: 5px solid #cbd5e1;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .action-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="assets/logo.png" alt="Logo" class="brand-logo-img">
    </div>

    <div id="intro-screen" class="stage-overlay">
        <div class="overlay-card">
            <div style="font-size: 60px;">🏝️</div>
            <div class="slide-title">Multiplication Match</div>
            <p style="font-size: 15px; margin-bottom: 25px;">
                Drag the correct answer card from the bench and drop it right into the Match Zone.
            </p>
            <button class="action-btn" id="btn-start-game">Begin Expedition 🧭</button>
        </div>
    </div>

    <div class="game-container" id="main-game">
        <div class="header-meta">
            <div class="level-badge" id="level-lbl">Level 1</div>
            <div class="score-badge" id="score-lbl">Score: 0</div>
        </div>
        
        <h1 id="game-title">Multiplication Journey</h1>
        <div class="progress-bar"><div class="progress" id="progress-bar-fill"></div></div>
        <div class="instruction-card" id="instruction-txt">...</div>
        <div class="hint-box" id="hint-display">...</div>
        <div class="workspace" id="interactive-space"></div>
        <div class="drop-zone" id="drop-zone">📥 Drag & Drop Answer Here</div>
        <div class="options-box" id="options-zone"></div>
    </div>

    <div id="appreciation-screen" class="stage-overlay">
        <div class="overlay-card">
            <div style="font-size: 70px;" id="appreciation-emoji">🏆</div>
            <div class="slide-title" id="appreciation-heading">Outstanding!</div>
            <div style="font-size: 24px; font-weight: 800; margin-bottom: 25px;" id="final-score-txt">Score: 0</div>
            <button class="action-btn" id="btn-restart-game">Play Again 🔄</button>
        </div>
    </div>

    <script>
        const rawPuzzleBank = [
            // --- FIXED LEVEL 1: ACCURATE ARRAYS AND REPEATED ADDITION ---
            { level: 1, title: "🧮 Array Multiplication", instruction: "Look at this array of columns and rows. Convert this array into a multiplication sentence!", type: "array", rows: 4, cols: 5, emoji: "⭐", answer: "4 × 5", options: ["5 × 5", "4 × 5", "4 × 4"], hint: "Count the rows downward, then multiply by the number of columns across.", containerClass: "theme-default" },
            { level: 1, title: "➕ Repeated Addition Groups", instruction: "Look at these separate visual groups of apples. Choose the addition sentence that matches them.", type: "groups", groups: 3, items: 2, emoji: "🍎", answer: "2 + 2 + 2", options: ["2 + 2 + 2", "3 + 3", "2 + 2 + 2 + 2"], hint: "Count the number of items inside one group, and add it together for each group.", containerClass: "theme-default" },
            { level: 1, title: "➕ Fish Tank Addition", instruction: "Count the friendly goldfish swimming in separate groups. Find the correct addition matching layout.", type: "groups", groups: 2, items: 4, emoji: "🐟", answer: "4 + 4", options: ["4 + 4", "2 + 2 + 2 + 2", "4 + 4 + 4"], hint: "There are 2 groups. Each group has exactly 4 fishes.", containerClass: "theme-default" },

            // --- FIXED LEVEL 2: DYNAMIC GRAPHICS MATCHING CONTEXT RULES ---
            { level: 2, title: "🔢 Counting Bicycles", instruction: "Count the total number of bicycles parked on each rack. What is 5 groups of 2?", type: "groups", groups: 5, items: 2, emoji: "🚲", answer: "10 bicycles", options: ["8 bicycles", "10 bicycles", "12 bicycles"], hint: "Skip count by 2s for each rack: 2, 4, 6, 8, 10.", containerClass: "theme-rack" },
            { level: 2, title: "🔢 Golden Chest Value", instruction: "Each ancient treasure box contains 10 gold coins. How many coins are there in 2 chests?", type: "groups", groups: 2, items: 10, emoji: "🪙", answer: "20 coins", options: ["15 coins", "20 coins", "30 coins"], hint: "Count the contents of both chests: 10 + 10.", containerClass: "theme-chest" },
            { level: 2, title: "🔢 Singly Grouped Butterflies", instruction: "Look at these unique branches holding 1 butterfly each. What is 6 groups of 1?", type: "groups", groups: 6, items: 1, emoji: "🦋", answer: "6 butterflies", options: ["1 butterfly", "5 butterflies", "6 butterflies"], hint: "Each branch has exactly 1 butterfly. Count the branches!", containerClass: "theme-branch" }
        ];

        let activeSuite = [];
        let currentIndex = 0;
        let score = 0;
        let attempts = 0;
        let lock = false;

        setTimeout(() => {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('intro-screen').classList.add('active');
            }, 600);
        }, 2000);

        document.getElementById('btn-start-game').addEventListener('pointerdown', () => {
            document.getElementById('intro-screen').classList.remove('active');
            document.getElementById('main-game').style.display = 'block';
            activeSuite = [...rawPuzzleBank].sort(() => Math.random() - 0.5);
            loadQuestion();
        });

        function loadQuestion() {
            lock = false;
            attempts = 0;
            
            const space = document.getElementById('interactive-space');
            const bench = document.getElementById('options-zone');
            const dropZone = document.getElementById('drop-zone');
            
            document.getElementById('hint-display').style.display = 'none';
            dropZone.innerHTML = "📥 Drag & Drop Answer Here";
            dropZone.className = "drop-zone";
            
            document.getElementById('score-lbl').innerText = `Score: ${score}`;
            document.getElementById('progress-bar-fill').style.width = `${(currentIndex / activeSuite.length) * 100}%`;

            if (currentIndex >= activeSuite.length) {
                showResults();
                return;
            }

            const node = activeSuite[currentIndex];
            document.getElementById('level-lbl').innerText = `Level ${node.level}`;
            document.getElementById('game-title').innerText = node.title;
            document.getElementById('instruction-txt').innerText = node.instruction;

            space.innerHTML = "";
            bench.innerHTML = "";

            // RENDERING ENGINE (REBUILT ACCORDING TO CONCEPT TYPES)
            if (node.type === "array") {
                // Generates an explicit strict CSS Grid Matrix representing a formal array
                const grid = document.createElement('div');
                grid.className = "array-grid";
                grid.style.gridTemplateColumns = `repeat(${node.cols}, 1fr)`;
                for (let i = 0; i < (node.rows * node.cols); i++) {
                    grid.innerHTML += `<div class="group-item">${node.emoji}</div>`;
                }
                space.appendChild(grid);
            } else if (node.type === "groups") {
                // Generates individual themed objects (Racks, Chests, Branches) containing explicit sub-items
                const wrapper = document.createElement('div');
                wrapper.className = "groups-layout";
                for (let g = 0; g < node.groups; g++) {
                    const groupContainer = document.createElement('div');
                    groupContainer.className = node.containerClass;
                    for (let i = 0; i < node.items; i++) {
                        groupContainer.innerHTML += `<div class="group-item">${node.emoji}</div>`;
                    }
                    wrapper.appendChild(groupContainer);
                }
                space.appendChild(wrapper);
            }

            node.options.forEach(opt => {
                const card = document.createElement('div');
                card.className = "drag-card";
                card.innerText = opt;
                bindDrag(card);
                bench.appendChild(card);
            });
        }

        function bindDrag(el) {
            let startX = 0, startY = 0, clone = null;
            el.addEventListener('pointerdown', e => {
                if (lock || el.parentElement.classList.contains('drop-zone')) return;
                e.preventDefault();
                el.setPointerCapture(e.pointerId);

                const r = el.getBoundingClientRect();
                startX = e.clientX; startY = e.clientY;

                clone = el.cloneNode(true);
                clone.classList.add('dragging');
                clone.style.width = `${r.width}px`; clone.style.height = `${r.height}px`;
                clone.style.left = `${r.left}px`; clone.style.top = `${r.top}px`;
                document.body.appendChild(clone);
                el.style.visibility = 'hidden';

                const move = ev => {
                    if (!clone) return;
                    clone.style.transform = `translate(${ev.clientX - startX}px, ${ev.clientY - startY}px) scale(1.05)`;
                    const dz = document.getElementById('drop-zone').getBoundingClientRect();
                    if (ev.clientX >= dz.left && ev.clientX <= dz.right && ev.clientY >= dz.top && ev.clientY <= dz.bottom) {
                        document.getElementById('drop-zone').classList.add('hovered');
                    } else {
                        document.getElementById('drop-zone').classList.remove('hovered');
                    }
                };

                const up = ev => {
                    el.releasePointerCapture(e.pointerId);
                    document.getElementById('drop-zone').classList.remove('hovered');
                    const dz = document.getElementById('drop-zone').getBoundingClientRect();
                    const inside = (ev.clientX >= dz.left && ev.clientX <= dz.right && ev.clientY >= dz.top && ev.clientY <= dz.bottom);

                    el.removeEventListener('pointermove', move);
                    el.removeEventListener('pointerup', up);
                    document.body.removeChild(clone); clone = null;

                    if (inside && !lock) {
                        el.style.visibility = 'visible';
                        checkAnswer(el.innerText, el);
                    } else {
                        el.style.visibility = 'visible';
                    }
                };
                el.addEventListener('pointermove', move);
                el.addEventListener('pointerup', up);
            });
        }

        function checkAnswer(val, card) {
            const node = activeSuite[currentIndex];
            const dz = document.getElementById('drop-zone');
            let copy = card.cloneNode(true);
            dz.innerHTML = ""; dz.appendChild(copy);
            card.remove();

            if (val === node.answer) {
                lock = true;
                copy.classList.add('correct');
                score += (attempts === 0) ? 2 : 1;
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
                setTimeout(() => { currentIndex++; loadQuestion(); }, 1500);
            } else {
                attempts++;
                copy.classList.add('wrong');
                if (attempts === 1) {
                    const h = document.getElementById('hint-display');
                    h.innerText = `💡 Hint: ${node.hint}`; h.style.display = 'block';
                    setTimeout(() => {
                        dz.innerHTML = "📥 Drag & Drop Answer Here";
                        copy.classList.remove('wrong');
                        bindDrag(copy);
                        document.getElementById('options-zone').appendChild(copy);
                    }, 1200);
                } else {
                    lock = true;
                    dz.innerHTML = `<div class="drag-card correct">${node.answer}</div>`;
                    setTimeout(() => { currentIndex++; loadQuestion(); }, 2000);
                }
            }
        }

        function showResults() {
            document.getElementById('main-game').style.display = 'none';
            document.getElementById('final-score-txt').innerText = `Total Points: ${score}`;
            document.getElementById('appreciation-screen').classList.add('active');
        }

        document.getElementById('btn-restart-game').addEventListener('pointerdown', () => {
            currentIndex = 0; score = 0;
            document.getElementById('appreciation-screen').classList.remove('active');
            document.getElementById('main-game').style.display = 'block';
            activeSuite = [...rawPuzzleBank].sort(() => Math.random() - 0.5);
            loadQuestion();
        });
    </script>
</body>
</html>
