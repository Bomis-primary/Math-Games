<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Garden Adventure</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; font-family: Arial, sans-serif; overflow:hidden; }
body { background: #4CAF50; } /* plain green background */
#logoScreen, #gameScreen, #endScreen { width:100%; height:100%; position:absolute; top:0; left:0; display:flex; justify-content:center; align-items:center; flex-direction:column; }
#logoScreen { z-index:10; background:#fff; }
#logoScreen img { width:200px; }
#gameScreen { display:none; flex-direction:column; }
#question { font-size:22px; color:#fff; text-align:center; margin-top:10px; z-index:10; }
#treeContainer { position:relative; width:100%; height:400px; }
.tree-img { position:absolute; left:5%; bottom:0; z-index:5; }
.exampleBasket-img { position:absolute; bottom:70px; z-index:6; }
#basket-img { position:absolute; right:5%; bottom:40px; z-index:6; }
#fruits { position:absolute; bottom:180px; left:50%; transform:translateX(-50%); display:flex; flex-wrap: wrap; justify-content:center; gap:10px; width:90%; z-index:7; }
.fruit { cursor:grab; }
#buttons { position:absolute; bottom:5%; left:50%; transform:translateX(-50%); display:flex; gap:20px; }
.btn { padding:14px 28px; font-size:25px; border:none; border-radius:8px; background:#ff9999; color:#fff; cursor:pointer; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
#endScreen { display:none; flex-direction:column; justify-content:center; align-items:center; font-size:32px; color:#fff; background:#4CAF50; }
</style>
</head>
<body>

<div id="logoScreen"><img src="assets/logo.png" alt="Innovine Logo"></div>

<div id="gameScreen">
    <div id="question"></div>
    <div id="treeContainer">
        <img id="tree-img" class="tree-img" src="" alt="Fruit Tree">
        <img id="basket-img" src="assets/basket.png" alt="Main Basket">
    </div>
    <div id="fruits"></div>
    <div id="buttons">
        <button id="option1" class="btn"></button>
        <button id="option2" class="btn"></button>
        <button id="nextBtn" class="btn">Next</button>
    </div>
</div>

<div id="endScreen">
    <div>🎉 Good Job! 🎉</div>
    <button id="playAgainBtn" class="btn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// Level data with tree widths
const levels = [
    { tree:'assets/apple-tree.jpg', treeWidth:220, exampleBaskets:3, exampleFruitsPerBasket:2, correctOption:2, options:["2 groups of 3 apples","3 groups of 2 apples"], dragFruits:6, fruitImg:'assets/apple.png', basketFullImg:'assets/apples-basket.png' },
    { tree:'assets/mango-tree.jpg', treeWidth:250, exampleBaskets:5, exampleFruitsPerBasket:2, correctOption:1, options:["5 baskets of 2 mangoes","2 groups of 5 mangoes"], dragFruits:10, fruitImg:'assets/mango.png', basketFullImg:'assets/mango-basket.png' },
    { tree:'assets/orange-tree.jpg', treeWidth:240, exampleBaskets:4, exampleFruitsPerBasket:3, correctOption:1, options:["4 baskets of 3 oranges","3 groups of 4 oranges"], dragFruits:12, fruitImg:'assets/orange.png', basketFullImg:'assets/orange-basket.png' }
];

let currentLevel=0, taskPhase="MC", draggedFruit=null, collectedFruitCount=0;

// DOM Elements
const logoScreen = document.getElementById('logoScreen');
const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const treeImg = document.getElementById('tree-img');
const basketImg = document.getElementById('basket-img');
const fruitsDiv = document.getElementById('fruits');
const option1 = document.getElementById('option1');
const option2 = document.getElementById('option2');
const nextBtn = document.getElementById('nextBtn');
const questionDiv = document.getElementById('question');
const playAgainBtn = document.getElementById('playAgainBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

// Start game
function startGame(){
    logoScreen.style.display='flex';
    setTimeout(()=>{
        logoScreen.style.display='none';
        gameScreen.style.display='flex';
        loadLevel();
    },2000);
}

// Load level
function loadLevel(){
    const level = levels[currentLevel];
    taskPhase="MC";
    treeImg.src = level.tree;
    treeImg.style.width = level.treeWidth+'px';
    questionDiv.textContent=`There are ${level.exampleBaskets} baskets with ${level.exampleFruitsPerBasket} fruits in each. Which button matches this statement correctly?`;
    option1.style.display='inline-block'; option2.style.display='inline-block';
    option1.textContent = level.options[0]; option2.textContent = level.options[1];
    nextBtn.disabled=true;
}

// MC click
option1.addEventListener('click', ()=>checkMC(1));
option2.addEventListener('click', ()=>checkMC(2));

function checkMC(choice){
    const level = levels[currentLevel];
    if(choice===level.correctOption){
        correctSound.play();
        option1.style.display='none'; option2.style.display='none';
        prepareDragTask(level);
    } else { wrongSound.play(); }
}

// Drag task
function prepareDragTask(level){
    taskPhase="Drag"; fruitsDiv.innerHTML=""; collectedFruitCount=0;

    // Place small example baskets as <img>
    const startX = 35; 
    const gap = 10; 
    for(let i=0;i<level.exampleBaskets;i++){
        let img = document.createElement('img');
        img.src='assets/basket.png';
        img.className='exampleBasket-img';
        img.style.width='101px'; 
        img.style.height='101px';
        img.style.left = (startX + i*120)+'px';
        img.style.bottom='70px';
        img.style.position='absolute';
        document.getElementById('treeContainer').appendChild(img);
    }

    // Main basket
    basketImg.src='assets/basket.png';
    basketImg.style.width='202px'; 
    basketImg.style.height='202px';
    basketImg.style.bottom='40px';

    // Draggable fruits
    questionDiv.textContent="Task: Collect the correct number of fruits in the main basket";
    for(let i=0;i<level.dragFruits;i++){
        let f = document.createElement('img');
        f.src=level.fruitImg;
        f.className='fruit';
        f.style.width='60px';
        f.draggable=true;
        f.addEventListener('dragstart', e=>draggedFruit=e.target);
        fruitsDiv.appendChild(f);
    }
    basketImg.addEventListener('dragover', e=>e.preventDefault());
    basketImg.addEventListener('drop', dropFruit);
    nextBtn.disabled=true;
}

function dropFruit(e){
    if(draggedFruit){ draggedFruit.remove(); collectedFruitCount++; draggedFruit=null; }
    const level = levels[currentLevel];
    if(collectedFruitCount===level.dragFruits){
        basketImg.src = level.basketFullImg;
        questionDiv.textContent="Task complete! Click Next to continue.";
        correctSound.play(); clapSound.play();
        nextBtn.disabled=false;
    }
}

// Next button
nextBtn.addEventListener('click', ()=>{
    collectedFruitCount=0; nextBtn.disabled=true;
    currentLevel++;
    if(currentLevel>=levels.length){
        gameScreen.style.display='none'; endScreen.style.display='flex';
    } else loadLevel();
});

// Play Again
playAgainBtn.addEventListener('click', ()=>{
    currentLevel=0; endScreen.style.display='none';
    gameScreen.style.display='flex'; loadLevel();
});

startGame();
</script>
</body>
</html>
