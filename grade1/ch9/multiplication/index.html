<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Basket Question</title>
<style>
  body, html {
    margin:0; padding:0; height:100%; width:100%;
    font-family: Arial, sans-serif; background:#a3e0ff;
    display:flex; justify-content:center; align-items:center;
    overflow:hidden;
  }
  #gameScreen {
    width:100%; height:100%; position:relative;
    display:flex; flex-direction:column; justify-content:flex-start; align-items:center;
    background: url('assets/a_colorful_cartoon_children_s_educational_game_int.png') no-repeat center bottom;
    background-size: cover;
  }
  #question {
    margin-top: 20px;
    font-size: 24px;
    text-align:center;
    color:#000;
    width:90%;
  }
  #buttons {
    display:flex;
    gap:20px;
    margin-top:30px;
  }
  .btn {
    padding:15px 25px;
    font-size:20px;
    border:none;
    border-radius:10px;
    background:#ff9999;
    color:#fff;
    cursor:pointer;
  }
  .btn:disabled {
    opacity:0.5;
    cursor:not-allowed;
  }
  #feedback {
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
  }
</style>
</head>
<body>
  <div id="gameScreen">
    <div id="question">There are 3 baskets with 2 apples in each. Which button matches this statement correctly?</div>
    <div id="buttons">
      <button class="btn" id="option1">2 groups of 3 apples</button>
      <button class="btn" id="option2">3 groups of 2 apples</button>
    </div>
    <div id="feedback"></div>
  </div>

<script>
  const option1 = document.getElementById('option1');
  const option2 = document.getElementById('option2');
  const feedback = document.getElementById('feedback');

  option1.addEventListener('click', ()=>{
    feedback.textContent = "❌ Wrong! Try again.";
    feedback.style.color = "red";
  });

  option2.addEventListener('click', ()=>{
    feedback.textContent = "✅ Correct!";
    feedback.style.color = "green";
  });
</script>
</body>
</html>
