<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 1 Time Game - Wake Up</title>
<style>
body, html {
  margin:0; padding:0;
  font-family: 'Arial', sans-serif;
  height:100%; width:100%;
  display:flex; justify-content:center; align-items:center;
  background:#FDF6EC;
}

#logoScreen, #gameScreen, #endScreen {
  width:100%; height:100%;
  position:absolute; top:0; left:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
}

#logoScreen { background:#fff; z-index:2; }
#logoScreen img { width:200px; }

#gameScreen { display:none; z-index:1; position:relative; }

#bgImg { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1; }

/* Question box on left side */
#question {
  font-size:22px; color:#fff; text-align:left;
  background: rgba(0,0,0,0.6); /* semi-transparent for readability */
  padding: 20px 25px; border-radius:12px;
  position:absolute;
  top:25%; left:3%; max-width:40%;
  z-index:5;
}

/* Buttons stacked vertically below question */
.button-container {
  position:absolute;
  top:50%; left:3%;
  display:flex; flex-direction:column; gap:20px;
  z-index:5;
}

/* Larger buttons with shadow and border for visibility */
button.option-btn {
  padding:20px 30px;      /* bigger size */
  font-size:24px;         /* bigger font */
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#9b59b6;     /* lighter purple for contrast */
  color:white;
  width:100%;
  box-shadow: 2px 4px 6px rgba(0,0,0,0.4); /* drop shadow */
  border: 2px solid #fff; /* white border for contrast */
}

button.option-btn.wrong { background:red; }
button.option-btn.correct { background:green; }

/* Feedback text */
#feedback {
  font-size:26px;           /* larger */
  font-weight:bold;
  color:red;                /* red for wrong feedback */
  position:absolute; top:70%; left:3%; max-width:40%;
  z-index:5;
}

/* Shake animation for wrong button */
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}
button.option-btn.shake { animation: shake 0.3s; }

#nextBtn, #playAgainBtn {
  margin-top:20px; font-size:20px; padding:10px 20px;
  background:#FF69B4; color:#fff; border:none; border-radius:5px;
  cursor:pointer; display:none; position:absolute; top:80%; left:3%;
  z-index:5;
}

#confetti {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; display:none;
}
</style>
</head>
<body>

<!-- Logo Screen -->
<div id="logoScreen">
  <img src="assets/logo.png" alt="Logo">
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <img id="bgImg" src="assets/bedroom-bg.jpg" alt="Bedroom Background">
  <div id="question">Click the correct time as shown on the clock.</div>
  <div class="button-container">
    <button class="option-btn" onclick="checkAnswer(this, true)">7:00 AM</button>
    <button class="option-btn" onclick="checkAnswer(this, false)">6:00 AM</button>
  </div>
  <div id="feedback"></div>
  <button id="nextBtn" onclick="nextTask()">Next</button>
</div>

<!-- End Screen -->
<div id="endScreen">
  <div id="confetti"></div>
  <h1>Well Done!</h1>
  <button id="playAgainBtn" onclick="restartGame()">Play Again</button>
</div>

<script>
let attempts = 0;

// Show logo for 3 seconds
setTimeout(() => {
  document.getElementById('logoScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
}, 3000);

// Check answer
function checkAnswer(button, isCorrect) {
  attempts++;
  const feedback = document.getElementById('feedback');
  if(isCorrect) {
    button.classList.add('correct');
    feedback.textContent = 'Good Job!';
    feedback.style.color = 'green';
    playSound('correct');
    document.getElementById('nextBtn').style.display = 'inline-block';
    disableOptions();
  } else {
    button.classList.add('wrong','shake');
    setTimeout(()=> button.classList.remove('shake'), 300);
    playSound('wrong');
    feedback.style.color = 'red';
    if(attempts < 2){
      feedback.textContent = 'Try again!';
    } else {
      feedback.textContent = 'Correct answer is 7:00 AM';
      document.getElementById('nextBtn').style.display = 'inline-block';
      disableOptions();
    }
  }
}

// Disable buttons after correct / second attempt
function disableOptions(){
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(btn => btn.disabled = true);
}

// Next task (currently only one task)
function nextTask(){
  document.getElementById('gameScreen').style.display="none";
  document.getElementById('endScreen').style.display="flex";
  showConfetti();
}

// Restart game
function restartGame(){
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  attempts = 0;
  document.getElementById('feedback').textContent = '';
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(btn => { btn.disabled = false; btn.classList.remove('wrong','correct'); });
  document.getElementById('nextBtn').style.display = 'none';
}

// Confetti animation
function showConfetti(){
  const conf = document.getElementById("confetti");
  conf.style.display='block';
  for(let i=0;i<100;i++){
    let dot = document.createElement('div');
    dot.style.position='absolute';
    dot.style.width='10px'; dot.style.height='10px';
    dot.style.background=['#FF69B4','#FFD700','#8E44AD','#00CED1'][Math.floor(Math.random()*4)];
    dot.style.left=Math.random()*100+'%';
    dot.style.top=Math.random()*100+'%';
    conf.appendChild(dot);
    setTimeout(()=>dot.remove(),3000);
  }
}

// Play sound
function playSound(type){
  const audio = new Audio(type==='correct'?'assets/correct.mp3':'assets/wrong.mp3');
  audio.play();
}
</script>
</body>
</html>
