<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 1 Time Game</title>
<style>
body, html {
  margin:0; padding:0;
  font-family: 'Arial', sans-serif;
  height:100%; width:100%;
  display:flex; justify-content:center; align-items:center;
  background:#FDF6EC;
}

#logoScreen, #clockScreen, #cardScreen, #endScreen {
  width:100%; height:100%;
  position:absolute; top:0; left:0;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
}

#logoScreen { background:#fff; z-index:5; }
#logoScreen img { width:200px; }

#clockScreen, #cardScreen { display:none; z-index:1; position:relative; }

#bgImg { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1; }

/* Question box left side */
#question {
  font-size:22px; color:#fff; text-align:left;
  background: rgba(0,0,0,0.6);
  padding: 15px 20px; border-radius:10px;
  position:absolute;
  top:10%; left:3%; max-width:40%;
  z-index:5;
}

/* Buttons for clock screen */
.button-container {
  position:absolute;
  top:40%; left:3%;
  display:flex; flex-direction:column; gap:20px;
  z-index:5;
}

button.option-btn {
  padding:20px 30px;
  font-size:24px;
  border:none; border-radius:10px;
  cursor:pointer;
  background:#9b59b6; color:white;
  width:100%;
  box-shadow: 2px 4px 6px rgba(0,0,0,0.4);
  border: 2px solid #fff;
}

button.option-btn.wrong { background:red; }
button.option-btn.correct { background:green; }

/* Card container for next screen */
.card-container {
  position:absolute;
  top:30%; left:3%;
  display:flex; gap:20px;
  z-index:5;
}
.card {
  width:150px; height:150px;
  border:3px solid transparent; border-radius:10px;
  cursor:pointer;
  transition: transform 0.2s, border 0.2s;
}
.card:hover { transform: scale(1.05); }
.card.shake { animation: shake 0.3s; }
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

#feedback {
  font-size:26px; font-weight:bold;
  color:#fff; background-color:#001f4d;
  padding:10px 15px; border-radius:8px;
  position:absolute; top:70%; left:3%; max-width:40%;
  z-index:5; text-align:center;
}

#nextBtn, #playAgainBtn {
  margin-top:20px; font-size:20px; padding:10px 20px;
  background:#FF69B4; color:#fff; border:none; border-radius:5px;
  cursor:pointer; display:none; position:absolute; top:80%; left:3%;
  z-index:5;
}

#confetti {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; display:none;
}
</style>
</head>
<body>

<!-- Logo Screen -->
<div id="logoScreen">
  <img src="assets/logo.png" alt="Logo">
</div>

<!-- Clock Screen (Wake Up) -->
<div id="clockScreen">
  <img id="bgImg" src="assets/bedroom-bg.jpg" alt="Bedroom Background">
  <div id="question">Click the correct time as shown on the clock.</div>
  <div class="button-container">
    <button class="option-btn" onclick="checkClock(this,true)">7:00 AM</button>
    <button class="option-btn" onclick="checkClock(this,false)">6:00 AM</button>
  </div>
  <div id="feedback"></div>
  <button id="nextBtn" onclick="goToCardScreen()">Next</button>
</div>

<!-- Card Screen (What does Riya do next?) -->
<div id="cardScreen">
  <img id="bgImg" src="assets/bedroom-bg.jpg" alt="Background">
  <div id="question">What does Riya do next after waking up?</div>
  <div class="card-container">
    <img src="assets/brushing.png" class="card" onclick="checkCard(this,true)">
    <img src="assets/breakfast.jpg" class="card" onclick="checkCard(this,false)">
    <img src="assets/ready.png" class="card" onclick="checkCard(this,false)">
  </div>
  <div id="feedback"></div>
  <button id="nextBtn" onclick="nextTask()">Next</button>
</div>

<!-- End Screen -->
<div id="endScreen">
  <div id="confetti"></div>
  <h1>Well Done!</h1>
  <button id="playAgainBtn" onclick="restartGame()">Play Again</button>
</div>

<script>
let attempts=0;

// Show logo for 3 seconds
setTimeout(()=>{
  document.getElementById('logoScreen').style.display='none';
  document.getElementById('clockScreen').style.display='flex';
},3000);

// Clock screen logic
function checkClock(button,isCorrect){
  attempts++;
  const feedback = document.getElementById('feedback');
  if(isCorrect){
    button.classList.add('correct');
    feedback.textContent = "Good Job!";
    playSound('correct');
    document.getElementById('nextBtn').style.display='inline-block';
    disableClockButtons();
  } else {
    button.classList.add('wrong');
    feedback.textContent="Try again!";
    playSound('wrong');
    button.classList.add('shake');
    setTimeout(()=>button.classList.remove('shake'),300);
    if(attempts>=2){
      feedback.textContent="Correct answer is 7:00 AM";
      disableClockButtons();
      document.getElementById('nextBtn').style.display='inline-block';
    }
  }
}

function disableClockButtons(){
  const buttons = document.querySelectorAll('#clockScreen .option-btn');
  buttons.forEach(b=>b.disabled=true);
}

function goToCardScreen(){
  document.getElementById('clockScreen').style.display='none';
  document.getElementById('cardScreen').style.display='flex';
  attempts=0;
  document.getElementById('feedback').textContent='';
  const buttons = document.querySelectorAll('#cardScreen .card');
  buttons.forEach(c=>{
    c.style.border='3px solid transparent';
    c.style.pointerEvents='auto';
  });
  document.getElementById('nextBtn').style.display='none';
}

// Card screen logic
function checkCard(card,isCorrect){
  attempts++;
  const feedback = document.getElementById('feedback');
  if(isCorrect){
    card.style.border="3px solid green";
    feedback.textContent="Good Job!";
    playSound('correct');
    document.getElementById('nextBtn').style.display='inline-block';
    disableCards();
  } else {
    card.style.border="3px solid red";
    feedback.textContent="Try again!";
    playSound('wrong');
    card.classList.add('shake');
    setTimeout(()=>card.classList.remove('shake'),300);
    if(attempts>=2){
      feedback.textContent="Correct answer is brushing teeth!";
      disableCards();
      document.getElementById('nextBtn').style.display='inline-block';
    }
  }
}

function disableCards(){
  const cards = document.querySelectorAll('#cardScreen .card');
  cards.forEach(c=>c.style.pointerEvents='none');
}

// End screen
function nextTask(){
  document.getElementById('cardScreen').style.display='none';
  document.getElementById('endScreen').style.display='flex';
  showConfetti();
}

function restartGame(){
  document.getElementById('endScreen').style.display='none';
  document.getElementById('clockScreen').style.display='flex';
  attempts=0;
  const feedback = document.getElementById('feedback');
  feedback.textContent='';
  const buttons = document.querySelectorAll('#clockScreen .option-btn');
  buttons.forEach(b=>{ b.disabled=false; b.classList.remove('wrong','correct'); });
  const cards = document.querySelectorAll('#cardScreen .card');
  cards.forEach(c=>{ c.style.border='3px solid transparent'; c.style.pointerEvents='auto'; });
  document.getElementById('nextBtn').style.display='none';
}

// Confetti
function showConfetti(){
  const conf=document.getElementById("confetti");
  conf.style.display='block';
  for(let i=0;i<100;i++){
    let dot=document.createElement('div');
    dot.style.position='absolute';
    dot.style.width='10px'; dot.style.height='10px';
    dot.style.background=['#FF69B4','#FFD700','#8E44AD','#00CED1'][Math.floor(Math.random()*4)];
    dot.style.left=Math.random()*100+'%';
    dot.style.top=Math.random()*100+'%';
    conf.appendChild(dot);
    setTimeout(()=>dot.remove(),3000);
  }
}

function playSound(type){
  const audio = new Audio(type==='correct'?'assets/correct.mp3':'assets/wrong.mp3');
  audio.play();
}
</script>
</body>
</html>
