<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time  - Show the Time</title>
    <style>
        :root {
            --clock-blue: #0288d1;
            --mint-green: #1ebd9b;
            --bg-gradient-start: #d1fae5;
            --bg-gradient-end: #bbf7d0;
            --text-dark: #2c3e50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Capriola', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .outer-app-wrapper {
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        .game-card {
            background: white;
            border-radius: 24px;
            border: 4px solid #ffeb3b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
            text-align: center;
            width: 100%;
        }

        /* --- QUESTION PROMPT --- */
        .instruction-heading {
            font-size: 20px;
            color: var(--text-dark);
            line-height: 1.4;
            margin: 0 0 20px 0;
            font-weight: bold;
        }

        /* --- ANALOG CLOCK SVG --- */
        .clock-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .clock-svg {
            width: 180px;
            height: 180px;
        }

        /* --- COUNTER INTERFACE --- */
        .time-display-pill {
            display: inline-block;
            border: 2px dashed #29b6f6;
            background-color: #f1f9ff;
            color: #0288d1;
            font-size: 18px;
            font-weight: bold;
            padding: 6px 24px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .circle-step-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background-color: #0288d1;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(2, 136, 209, 0.2);
            transition: transform 0.1s;
        }

        .circle-step-btn:active {
            transform: scale(0.92);
        }

        /* --- ACTION SUBMIT BUTTON --- */
        .submit-btn {
            background-color: var(--mint-green);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(30, 189, 155, 0.3);
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #1aab8c;
        }

        /* --- CUSTOM ALERT POPUP OVERLAY --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            display: none;
            justify-content: center;
            align-items: flex-start;
            z-index: 1000;
        }

        .custom-popup-box {
            background-color: #1e293b;
            color: white;
            width: 90%;
            margin-top: 15px;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .popup-header {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .popup-message {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .popup-actions {
            display: flex;
            justify-content: flex-end;
        }

        .popup-ok-btn {
            background-color: #f1f5f9;
            color: #1e293b;
            border: none;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .popup-ok-btn:hover {
            background-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="outer-app-wrapper">
        <!-- Main Game Card Front -->
        <div class="game-card">
            
            <div class="instruction-heading">
                5:00 o'clock. Show this time on the clock face!
            </div>

            <!-- SVG Vector Analog Dial Clock -->
            <div class="clock-container">
                <svg class="clock-svg" viewBox="0 0 200 200">
                    <!-- Base Rim Frame -->
                    <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#0288d1" stroke-width="7" />
                    
                    <!-- Hours Markers Text Elements -->
                    <text x="100" y="28" text-anchor="middle" font-weight="bold" font-size="15" fill="#2c3e50">12</text>
                    <text x="136" y="44" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">1</text>
                    <text x="160" y="68" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">2</text>
                    <text x="170" y="105" text-anchor="middle" font-weight="bold" font-size="15" fill="#2c3e50">3</text>
                    <text x="160" y="142" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">4</text>
                    <text x="136" y="166" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">5</text>
                    <text x="100" y="178" text-anchor="middle" font-weight="bold" font-size="15" fill="#2c3e50">6</text>
                    <text x="64" y="166" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">7</text>
                    <text x="40" y="142" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">8</text>
                    <text x="30" y="105" text-anchor="middle" font-weight="bold" font-size="15" fill="#2c3e50">9</text>
                    <text x="40" y="68" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">10</text>
                    <text x="64" y="44" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">11</text>

                    <!-- Minute Hand (Locked directly on 12) -->
                    <line x1="100" y1="100" x2="100" y2="36" stroke="#2c3e50" stroke-width="4.5" stroke-linecap="round" />
                    
                    <!-- Hour Hand (Dynamically transformed via JS) -->
                    <line id="hour-hand" x1="100" y1="100" x2="100" y2="52" stroke="#ff4081" stroke-width="6.5" stroke-linecap="round" />
                    
                    <!-- Center Pivot Node -->
                    <circle cx="100" cy="100" r="6" fill="#1ebd9b" />
                </svg>
            </div>

            <!-- Numerical Value Pill Box Wrapper -->
            <div>
                <div class="time-display-pill" id="numerical-display">4:00 O'clock</div>
            </div>

            <!-- Step Adjusters -->
            <div class="controls-row">
                <button class="circle-step-btn" onclick="adjustTime(-1)">−</button>
                <button class="circle-step-btn" onclick="adjustTime(1)">+</button>
            </div>

            <!-- Trigger Validation Bar -->
            <button class="submit-btn" onclick="evaluateAnswer()">Check Answer ✓</button>
        </div>

        <!-- Custom Context Alert Box Element Overlay -->
        <div class="modal-overlay" id="alert-modal">
            <div class="custom-popup-box">
                <div class="popup-header" id="modal-title-host">bomis-primary.github.io says</div>
                <div class="popup-message" id="modal-msg-body">Try again! Change the clock or move the pieces to find the right order! ✨</div>
                <div class="popup-actions">
                    <button class="popup-ok-btn" onclick="dismissModal()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const targetHour = 5; 
        let userCurrentHour = 4; // Mockup default initial state value setup

        // Initial Dynamic Web Audio API Setup Configuration to prevent any sound latency/lag
        let audioCtx = null;

        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Low-latency Synth audio system generator framework
        function playInstantFeedbackSound(isSuccessful) {
            initAudioEngine();
            if (!audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (isSuccessful) {
                // Success Chord
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.35);
            } else {
                // Error Flat Tone
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(146.83, audioCtx.currentTime); // D3
                gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.25);
            }
        }

        function updateUIState() {
            // Adjust loop bounding metrics constraints limits values
            if (userCurrentHour > 12) userCurrentHour = 1;
            if (userCurrentHour < 1) userCurrentHour = 12;

            // Update display pill content text values safely
            document.getElementById('numerical-display').innerText = `${userCurrentHour}:00 O'clock`;

            // Calculate rotational transformation parameters vectors (30 degrees step multiplier)
            const computedDegrees = userCurrentHour * 30;
            document.getElementById('hour-hand').setAttribute('transform', `rotate(${computedDegrees} 100 100)`);
        }

        function adjustTime(directionStep) {
            userCurrentHour += directionStep;
            updateUIState();
        }

        function evaluateAnswer() {
            if (userCurrentHour === targetHour) {
                playInstantFeedbackSound(true);
                showCustomModal("Success! 🎉", "Fantastic job! You matched the target time perfectly.");
            } else {
                playInstantFeedbackSound(false);
                showCustomModal("bomis-primary.github.io says", "Try again! Change the clock or move the pieces to find the right order! ✨");
            }
        }

        function showCustomModal(title, text) {
            document.getElementById('modal-title-host').innerText = title;
            document.getElementById('modal-msg-body').innerText = text;
            document.getElementById('alert-modal').style.display = 'flex';
        }

        function dismissModal() {
            document.getElementById('alert-modal').style.display = 'none';
        }

        // Initialize UI display parameters on initial page load cycle execution
        updateUIState();
    </script>
</body>
</html>
