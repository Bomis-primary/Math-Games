<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Level 3: Daily Routines</title>
    <style>
        :root {
            --primary-green: #2cd49e;
            --text-dark: #2c3e50;
            --border-light: #cbd5e1;
            --card-blue: #23a6f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Capriola', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #f0fdf4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-card {
            background: white;
            border-radius: 24px;
            border: 6px solid #ffcc00;
            box-shadow: 0 12px 24px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 500px;
            padding: 24px;
            text-align: center;
            position: relative;
        }

        /* --- TOP BAR HUD --- */
        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge-level {
            background: #00e676;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .audio-slider-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .audio-slider {
            width: 70px;
            accent-color: #ff4081;
        }

        /* --- PROGRESS BAR --- */
        .progress-container {
            width: 100%;
            background: #e2e8f0;
            height: 12px;
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 80%;
            background: linear-gradient(90deg, #ff7675, #ff4757);
            height: 100%;
        }

        /* --- QUESTION PROMPT --- */
        .prompt-text {
            font-size: 18px;
            color: var(--text-dark);
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 5px;
        }

        .underlined {
            border-bottom: 2px solid var(--card-blue);
            font-weight: bold;
        }

        .sub-caption {
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* --- CONTAINER BOX & CARDS --- */
        .sorting-area {
            border: 2px dashed var(--border-light);
            border-radius: 16px;
            padding: 20px 10px;
            min-height: 130px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            background: #fafafa;
        }

        .draggable-item {
            background: white;
            border: 2px solid var(--card-blue);
            color: var(--text-dark);
            font-weight: bold;
            font-size: 15px;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.15s ease;
        }

        .draggable-item:active {
            cursor: grabbing;
        }

        .draggable-item.ghost-dragging {
            opacity: 0.3;
            transform: scale(0.95);
        }

        /* --- ACTION SUBMIT BUTTON --- */
        .submit-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(44, 212, 158, 0.3);
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #25be8e;
        }
    </style>
</head>
<body>

    <audio id="success-ch" src="assets/claps.mp3" preload="auto"></audio>
    <audio id="fail-ch" src="assets/wrong.mp3" preload="auto"></audio>

    <div class="game-card">
        
        <div class="hud-row">
            <div class="badge-level">Level 3: Daily Routines 🔄</div>
            <div class="audio-slider-container">
                <span>🔊</span>
                <input type="range" class="audio-slider" min="0" max="100" value="85">
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar-fill"></div>
        </div>

        <div class="prompt-text">
            Sequence <span class="underlined">Riya's</span> evening routine! <span class="underlined">Riya</span> loves to play outside right after school, then finishes her homework before eating dinner!
        </div>

        <div class="sub-caption">
            Drag and arrange items in order (Left to Right):
        </div>

        <div class="sorting-area" id="board-arena">
            <div class="draggable-item" draggable="true">Do Homework</div>
            <div class="draggable-item" draggable="true">Eat Dinner</div>
            <div class="draggable-item" draggable="true">Play Outside</div>
            <div class="draggable-item" draggable="true">Go to Bed</div>
        </div>

        <button class="submit-btn" onclick="checkCurrentOrder()">Check Answer ✓</button>
    </div>

    <script>
        // Exact solution array matching chronological parameters
        const correctSequence = ["Play Outside", "Do Homework", "Eat Dinner", "Go to Bed"];
        const arena = document.getElementById('board-arena');

        // Drag and Drop interactive listener matrix
        arena.addEventListener('dragstart', (e) => {
            if(e.target.classList.contains('draggable-item')) {
                e.target.classList.add('ghost-dragging');
            }
        });

        arena.addEventListener('dragend', (e) => {
            if(e.target.classList.contains('draggable-item')) {
                e.target.classList.remove('ghost-dragging');
            }
        });

        arena.addEventListener('dragover', (e) => {
            e.preventDefault();
            const activeCard = document.querySelector('.ghost-dragging');
            if(!activeCard) return;

            const surroundingCards = [...arena.querySelectorAll('.draggable-item:not(.ghost-dragging)')];
            const targetNextSibling = surroundingCards.find(card => {
                const box = card.getBoundingClientRect();
                return e.clientX <= box.left + box.width / 2;
            });

            arena.insertBefore(activeCard, targetNextSibling);
        });

        function checkCurrentOrder() {
            const currentOrder = [...arena.querySelectorAll('.draggable-item')].map(c => c.innerText.trim());
            
            let isCorrect = currentOrder.length === correctSequence.length && 
                            currentOrder.every((val, index) => val === correctSequence[index]);

            if(isCorrect) {
                const successAudio = document.getElementById('success-ch');
                if(successAudio) { successAudio.currentTime = 0; successAudio.play().catch(()=>{}); }
                alert("Correct Answer! 🎉");
            } else {
                const failAudio = document.getElementById('fail-ch');
                if(failAudio) { failAudio.currentTime = 0; failAudio.play().catch(()=>{}); }
                alert("Try again! Move the pieces to find the right order! ✨");
            }
        }
    </script>
</body>
</html>
