<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time & Routines Lesson</title>
    <style>
        :root {
            --clock-blue: #0288d1;
            --mint-green: #1ebd9b;
            --bg-gradient-start: #d1fae5;
            --bg-gradient-end: #bbf7d0;
            --text-dark: #2c3e50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Capriola', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .outer-app-wrapper {
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 40px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 480px;
        }

        .brand-logo-img {
            max-width: 200px;
            object-fit: contain;
        }

        /* --- TITLE SCREEN & TRANSITION SLIDE --- */
        .intro-slide {
            background: linear-gradient(135deg, #0288d1, #01579b);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 480px;
            color: white;
            padding: 30px;
        }

        .action-btn {
            background-color: #ffeb3b;
            color: #01579b;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 235, 59, 0.4);
            transition: transform 0.1s;
            margin-top: 20px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* --- MAIN GAME CARDS CONTAINER --- */
        .game-card {
            background: white;
            border-radius: 24px;
            border: 4px solid #ffeb3b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
            text-align: center;
            width: 100%;
            display: none;
        }

        .progress-indicator {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .instruction-heading {
            font-size: 18px;
            color: var(--text-dark);
            line-height: 1.4;
            margin: 0 0 20px 0;
            font-weight: bold;
        }

        /* --- PART 1: CLOCK GRAPHICS --- */
        .clock-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .clock-svg {
            width: 180px;
            height: 180px;
        }

        .time-display-pill {
            display: inline-block;
            border: 2px dashed #29b6f6;
            background-color: #f1f9ff;
            color: #0288d1;
            font-size: 18px;
            font-weight: bold;
            padding: 6px 24px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .circle-step-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background-color: #0288d1;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- PART 2: DRAG CARDS STYLES --- */
        .drag-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .routine-card {
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            text-align: left;
            font-size: 15px;
            color: #334155;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .routine-card:active {
            cursor: grabbing;
            background-color: #e2e8f0;
        }

        .routine-card .number-badge {
            background-color: #cbd5e1;
            color: #475569;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
        }

        /* --- COMMON SUBMIT BUTTON --- */
        .submit-btn {
            background-color: var(--mint-green);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(30, 189, 155, 0.3);
        }

        /* --- POPUP MODAL --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            display: none;
            justify-content: center;
            align-items: flex-start;
            z-index: 3000;
        }

        .custom-popup-box {
            background-color: #1e293b;
            color: white;
            width: 90%;
            margin-top: 15px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: left;
        }

        .popup-header { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }
        .popup-message { font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
        .popup-actions { display: flex; justify-content: flex-end; }
        .popup-ok-btn { background-color: #f1f5f9; color: #1e293b; border: none; padding: 6px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="outer-app-wrapper">
        
        <div id="splash-screen">
            <img src="assets/logo.png" alt="Logo" class="brand-logo-img">
        </div>

        <div id="title-screen" class="intro-slide">
            <div style="font-size: 60px; margin-bottom: 10px;">⏰</div>
            <h2 style="font-size: 28px; margin: 0 0 10px 0; text-align: center;">Tick Tock Clock</h2>
            <p style="font-size: 15px; text-align: center; max-width: 300px; line-height: 1.5; margin-bottom: 15px;">
                Use the plus (+) and minus (−) buttons to change the pink hand and match the hours!
            </p>
            <button class="action-btn" onclick="startClockGame()">Start Game 🧭</button>
        </div>

        <div id="game-screen-clock" class="game-card">
            <div class="progress-indicator" id="clock-progress-text">Question 1 of 5</div>
            <div class="instruction-heading" id="clock-instruction-text">
                5:00 o'clock. Show this time on the clock face!
            </div>
