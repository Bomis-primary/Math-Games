<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 1 Math - Time Master Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #FFF5CC 0%, #CCFFFA 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #splash-logo {
            max-width: 220px;
            width: 60%;
            height: auto;
            animation: pulse 1.5s infinite ease-in-out;
        }

        #splash-text {
            margin-top: 25px;
            font-size: 24px;
            color: #4A4A4A;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- MAIN GAME CARD --- */
        .game-container {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
            border: 4px solid #FFD166;
            text-align: center;
            display: none;
            position: relative;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #F8F9FA;
            padding: 8px 12px;
            border-radius: 16px;
        }

        .level-badge {
            background-color: #06D6A0;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .volume-slider {
            width: 60px;
            accent-color: #EF476F;
            cursor: pointer;
        }

        .progress-bar {
            background: #E0E0E0;
            border-radius: 12px;
            height: 12px;
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #FFD166, #EF476F);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .prompt-box {
            font-size: 20px;
            color: #2D3436;
            margin-bottom: 15px;
            font-weight: bold;
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- LEVEL 1: INTERACTIVE CLOCKFACE --- */
        .clock-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .clock {
            width: 180px;
            height: 180px;
            border: 8px solid #118AB2;
            border-radius: 50%;
            position: relative;
            background: #FFF;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .clock-center {
            width: 12px;
            height: 12px;
            background: #06D6A0;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hour-hand {
            width: 6px;
            height: 50px;
            background: #EF476F;
            z-index: 5;
            margin-left: -3px;
        }

        .minute-hand {
            width: 4px;
            height: 70px;
            background: #073B4C;
            z-index: 4;
            margin-left: -2px;
        }

        .clock-number {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            width: 20px;
            height: 20px;
            text-align: center;
            line-height: 20px;
        }

        .stepper-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .step-btn {
            background-color: #118AB2;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .step-btn:active { transform: scale(0.95); }

        .time-display-bubble {
            background: #F0F4F8;
            padding: 6px 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            color: #118AB2;
            border: 2px dashed #118AB2;
        }

        /* --- LEVEL 2 & 3: DRAG/DROP & SEQUENCING --- */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            min-height: 75px;
            padding: 10px;
            background: #F8F9FA;
            border-radius: 16px;
            border: 2px dashed #CED4DA;
        }

        .flashcard {
            background: white;
            border: 3px solid #118AB2;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: bold;
            color: #073B4C;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, background-color 0.2s;
            touch-action: none;
        }

        .flashcard.sortable-ghost {
            opacity: 0.4;
            background-color: #E2E8F0;
        }

        /* --- ACTION SUBMIT SYSTEM --- */
        .submit-btn {
            background: linear-gradient(135deg, #06D6A0 0%, #4BF3C5 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(6, 214, 160, 0.3);
            margin-top: 10px;
        }
        .submit-btn:active { transform: scale(0.98); }

        .restart-btn {
            background: linear-gradient(135deg, #118AB2 0%, #06D6A0 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        /* --- CONFETTI CANVAS --- */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
    <!-- Include SortableJS for flawless mobile/tablet touch sequencing drags -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <!-- Splash Screen Layout -->
    <div id="splash-screen">
        <img id="splash-logo" src="assets/logo.png" alt="School Logo" onerror="this.style.display='none'; document.getElementById('splash-text').innerText='⏰ TIME CHAMP ⏰';">
        <div id="splash-text">Loading Game...</div>
    </div>

    <!-- Feedback Particles Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Main Game Window Box -->
    <div class="game-container" id="game-card">
        <div class="header-controls">
            <div class="level-badge" id="level-indicator">Level 1: Set Time</div>
            <div class="volume-container">
                <span>🔊</span>
                <input type="range" class="volume-slider" id="volume-control" min="0" max="1" step="0.1" value="0.8">
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress-indicator"></div>
        </div>

        <div id="game-playground">
            <div class="prompt-box" id="question-prompt">Loading puzzle prompt...</div>

            <!-- VIEW FOR LEVEL 1: CLOCKFACE INTERACTION -->
            <div id="clock-view" class="clock-wrapper">
                <div class="clock" id="analog-clock">
                    <div class="clock-center"></div>
                    <div class="hand hour-hand" id="hour-hand"></div>
                    <div class="hand minute-hand" id="minute-hand"></div>
                </div>
                <div class="time-display-bubble" id="digital-bubble">12:00 O'clock</div>
                <div class="stepper-controls">
                    <button class="step-btn" onclick="adjustClockTime(-1)">−</button>
                    <button class="step-btn" onclick="adjustClockTime(1)">+</button>
                </div>
            </div>

            <!-- VIEW FOR LEVEL 2 & LEVEL 3: SEQUENCING CONTAINER -->
            <div id="sequence-view" style="display: none;">
                <p style="font-size: 14px; color: #666; margin-bottom: 8px;">Drag and arrange items in order (Left to Right / Top to Bottom):</p>
                <div class="cards-container" id="sortable-list"></div>
            </div>

            <button class="submit-btn" onclick="verifyCurrentAnswer()">Check Answer Check ✔</button>
        </div>

        <!-- RESTART & END GAME CONTROLS -->
        <div id="end-view" style="display: none;">
            <h2 style="font-size: 26px; color: #118AB2; margin-bottom: 10px;">You are a Time Master! 🌟</h2>
            <p style="font-size: 18px; color: #4A4A4A;">Fantastic job finishing all levels successfully.</p>
            <button class="restart-btn" onclick="restartEntireGame()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        // Game Mission Structures Across 3 Levels
        const level1Missions = [
            { text: "I get up early for school at _____ o'clock.", target: 7 },
            { text: "I eat my tasty lunch at _____ o'clock.", target: 1 },
            { text: "I return home from school at _____ o'clock.", target: 3 },
            { text: "I go out to play with my friends at _____ o'clock.", target: 5 },
            { text: "It is night! I jump into bed to sleep at _____ o'clock.", target: 9 }
        ];

        const level2Missions = [
            { text: "Arrange these days of the week in correct order!", items: ["Monday", "Tuesday", "Wednesday", "Thursday"], correctOrder: ["Monday", "Tuesday", "Wednesday", "Thursday"] },
            { text: "Put these days starting right after Thursday!", items: ["Saturday", "Friday", "Sunday"], correctOrder: ["Friday", "Saturday", "Sunday"] },
            { text: "Put these early months of the year in order!", items: ["March", "January", "February", "April"], correctOrder: ["January", "February", "March", "April"] },
            { text: "Sort these late months of the year correctly!", items: ["November", "September", "October", "December"], correctOrder: ["September", "October", "November", "December"] }
        ];

        const level3Missions = [
            { text: "Sequence your morning routine activities step-by-step!", items: ["Wake Up", "Brush Teeth", "Eat Breakfast", "Go to School"], correctOrder: ["Wake Up", "Brush Teeth", "Eat Breakfast", "Go to School"] },
            { text: "Sequence your evening routine activities step-by-step!", items: ["Do Homework", "Play Outside", "Eat Dinner", "Go to Bed"], correctOrder: ["Play Outside", "Do Homework", "Eat Dinner", "Go to Bed"] }
        ];

        let currentLevel = 1; 
        let internalStep = 0; 
        let currentLevel1Hour = 12; 
        let sortableInstance = null;
        let volumeLevel = 0.8;
        let runningMission = null;

        // Native Web Audio API Sound Generator Block
        function audioBeep(freq, type, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const amp = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                amp.gain.setValueAtTime(volumeLevel, ctx.currentTime);
                amp.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                osc.connect(amp);
                amp.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) { console.log(e); }
        }

        function playCorrectSound() {
            audioBeep(523.25, 'triangle', 0.15);
            setTimeout(() => audioBeep(659.25, 'triangle', 0.25), 100);
        }

        function playWrongSound() {
            audioBeep(220.00, 'sawtooth', 0.3);
        }

        // Particle Canvas Graphics Layout Control Engine
        const canvas = document.getElementById("confetti-canvas");
        const ctx = canvas.getContext("2d");
        let activeConfetti = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function dropConfetti() {
            for(let i = 0; i < 60; i++) {
                activeConfetti.push({
                    x: canvas.width / 2, y: canvas.height / 2 - 50,
                    vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.7) * 15,
                    color: `hsl(${Math.random() * 360}, 90%, 65%)`,
                    size: Math.random() * 8 + 6, rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10
                });
            }
            animateConfettiStream();
        }

        function animateConfettiStream() {
            if (activeConfetti.length === 0) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = activeConfetti.length - 1; i >= 0; i--) {
                let p = activeConfetti[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.rotation += p.rSpeed;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();
                if(p.y > canvas.height) activeConfetti.splice(i, 1);
            }
            requestAnimationFrame(animateConfettiStream);
        }

        // Set up the app on window load
        window.addEventListener('DOMContentLoaded', () => {
            generateClockTicks();
            
            // Hard hold splash timer matching 'Simple Steps to Create a QR Learning Game.docx' workflow rules
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = 0;
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('game-card').style.display = 'block';
                    launchCoreGameEngine();
                }, 500);
            }, 5000);

            document.getElementById('volume-control').addEventListener('input', (e) => {
                volumeLevel = parseFloat(e.target.value);
            });
        });

        // Procedural Face Layout Rendering for Numbers 1-12
        function generateClockTicks() {
            const face = document.getElementById('analog-clock');
            const radius = 72; 
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30) * Math.PI / 180;
                const num = document.createElement('div');
                num.className = 'clock-number';
                num.innerText = i;
                const x = 90 + radius * Math.sin(angle) - 10;
                const y = 90 - radius * Math.cos(angle) - 10;
                num.style.left = `${x}px`;
                num.style.top = `${y}px`;
                face.appendChild(num);
            }
        }

        // Master Game Session Orchestration
        function launchCoreGameEngine() {
            currentLevel = 1;
            internalStep = 0;
            updateGlobalProgressBar();
            loadCurrentMission();
        }

        function updateGlobalProgressBar() {
            // Total of 9 steps (5 in L1, 2 in L2, 2 in L3)
            let rawProgress = 0;
            if (currentLevel === 1) rawProgress = internalStep;
            else if (currentLevel === 2) rawProgress = 5 + internalStep;
            else if (currentLevel === 3) rawProgress = 7 + internalStep;
            
            document.getElementById('progress-indicator').style.width = `${(rawProgress / 9) * 100}%`;
        }

        function loadCurrentMission() {
            updateGlobalProgressBar();
            
            if (currentLevel === 1) {
                document.getElementById('level-indicator').innerText = "Level 1: Set Clock Time 🕒";
                document.getElementById('clock-view').style.display = 'flex';
                document.getElementById('sequence-view').style.display = 'none';
                
                runningMission = level1Missions[internalStep];
                document.getElementById('question-prompt').innerText = runningMission.text;
                
                // Start with hands pointing to 12 as requested
                currentLevel1Hour = 12; 
                refreshClockHandNodePositions();
            } 
            else if (currentLevel === 2 || currentLevel === 3) {
                document.getElementById('level-indicator').innerText = currentLevel === 2 ? "Level 2: Ordering Time 🗓️" : "Level 3: Daily Routines 🔄";
                document.getElementById('clock-view').style.display = 'none';
                document.getElementById('sequence-view').style.display = 'block';
                
                const setPool = currentLevel === 2 ? level2Missions : level3Missions;
                runningMission = setPool[internalStep];
                document.getElementById('question-prompt').innerText = runningMission.text;
                
                // Shuffle array items securely before presenting to student
                const scrambledItems = [...runningMission.items].sort(() => Math.random() - 0.5);
                const listbox = document.getElementById('sortable-list');
                listbox.innerHTML = '';
                
                scrambledItems.forEach(itemText => {
                    const el = document.createElement('div');
                    el.className = 'flashcard';
                    el.innerText = itemText;
                    listbox.appendChild(el);
                });

                if (sortableInstance) sortableInstance.destroy();
                sortableInstance = new Sortable(listbox, {
                    animation: 150,
                    ghostClass: 'sortable-ghost'
                });
            }
        }

        // Stepper Mechanics controlling + - button interactions
        function adjustClockTime(delta) {
            currentLevel1Hour += delta;
            if (currentLevel1Hour > 12) currentLevel1Hour = 1;
            if (currentLevel1Hour < 1) currentLevel1Hour = 12;
            refreshClockHandNodePositions();
        }

        function refreshClockHandNodePositions() {
            const hrDeg = currentLevel1Hour * 30;
            document.getElementById('hour-hand').style.transform = `translate(-50%, 0) rotate(${hrDeg}deg)`;
            // Keep minute hand at 12 (0 degrees) for direct hourly evaluations
            document.getElementById('minute-hand').style.transform = `translate(-50%, 0) rotate(0deg)`;
            document.getElementById('digital-bubble').innerText = `${currentLevel1Hour}:00 O'clock`;
        }

        // Core Mission Verification Matrix
        function verifyCurrentAnswer() {
            let userIsCorrect = false;

            if (currentLevel === 1) {
                if (currentLevel1Hour === runningMission.target) {
                    userIsCorrect = true;
                }
            } 
            else {
                const currentCards = Array.from(document.getElementById('sortable-list').children);
                const userOrder = currentCards.map(c => c.innerText.trim());
                userIsCorrect = userOrder.length === runningMission.correctOrder.length && 
                                userOrder.every((val, index) => val === runningMission.correctOrder[index]);
            }

            if (userIsCorrect) {
                playCorrectSound();
                dropConfetti();
                advanceGamePipeline();
            } else {
                playWrongSound();
                alert("Try again! Move the pieces or change the clock to find the right order! ✨");
            }
        }

        // Pipeline Advance Route State Machine
        function advanceGamePipeline() {
            internalStep++;
            
            if (currentLevel === 1 && internalStep >= level1Missions.length) {
                currentLevel = 2;
                internalStep = 0;
            } else if (currentLevel === 2 && internalStep >= level2Missions.length) {
                currentLevel = 3;
                internalStep = 0;
            } else if (currentLevel === 3 && internalStep >= level3Missions.length) {
                // Game completely finished! Show end screen
                document.getElementById('progress-indicator').style.width = '100%';
                document.getElementById('game-playground').style.display = 'none';
                document.getElementById('end-view').style.display = 'block';
                return;
            }
            
            setTimeout(loadCurrentMission, 1000);
        }

        function restartEntireGame() {
            document.getElementById('game-playground').style.display = 'block';
            document.getElementById('end-view').style.display = 'none';
            launchCoreGameEngine();
        }
    </script>
</body>
</html>
