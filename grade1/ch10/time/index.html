<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Quiz - Show the Time</title>
    <style>
        :root {
            --clock-blue: #0288d1;
            --mint-green: #1ebd9b;
            --bg-gradient-start: #d1fae5;
            --bg-gradient-end: #bbf7d0;
            --text-dark: #2c3e50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Capriola', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .outer-app-wrapper {
            width: 100%;
            max-width: 440px;
            position: relative;
            min-height: 480px;
        }

        .game-card {
            background: white;
            border-radius: 24px;
            border: 4px solid #ffeb3b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
            text-align: center;
            width: 100%;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
        }

        .brand-logo-img {
            max-width: 200px;
            object-fit: contain;
        }

        /* --- TITLE SCREEN --- */
        #title-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0288d1, #01579b);
            border-radius: 20px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            padding: 30px;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            background-color: #ffeb3b;
            color: #01579b;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 235, 59, 0.4);
            transition: transform 0.1s;
            margin-top: 20px;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        /* --- QUESTION PROMPT --- */
        .instruction-heading {
            font-size: 20px;
            color: var(--text-dark);
            line-height: 1.4;
            margin: 0 0 20px 0;
            font-weight: bold;
        }

        /* --- ANALOG CLOCK SVG --- */
        .clock-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .clock-svg {
            width: 180px;
            height: 180px;
        }

        /* --- COUNTER INTERFACE --- */
        .time-display-pill {
            display: inline-block;
            border: 2px dashed #29b6f6;
            background-color: #f1f9ff;
            color: #0288d1;
            font-size: 18px;
            font-weight: bold;
            padding: 6px 24px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .circle-step-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background-color: #0288d1;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(2, 136, 209, 0.2);
            transition: transform 0.1s;
        }

        .circle-step-btn:active {
            transform: scale(0.92);
        }

        /* --- ACTION SUBMIT BUTTON --- */
        .submit-btn {
            background-color: var(--mint-green);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(30, 189, 155, 0.3);
            transition: background-color 0.2s;
        }

        /* --- CUSTOM ALERT POPUP OVERLAY --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            display: none;
            justify-content: center;
            align-items: flex-start;
            z-index: 3000;
        }

        .custom-popup-box {
            background-color: #1e293b;
            color: white;
            width: 90%;
            margin-top: 15px;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .popup-header { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }
        .popup-message { font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
        .popup-actions { display: flex; justify-content: flex-end; }
        .popup-ok-btn { background-color: #f1f5f9; color: #1e293b; border: none; padding: 6px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

        </div>

                Can you change the clock hands to show the matching target hourly times?
            </p>
            <button class="start-btn" onclick="startGame()">Start Game 🧭</button>

        <div class="game-card">

                5:00 o'clock. Show this time on the clock face!

                    <text x="64" y="44" text-anchor="middle" font-weight="bold" font-size="14" fill="#555">11</text>

                    <line x1="100" y1="100" x2="100" y2="36" stroke="#2c3e50" stroke-width="4.5" stroke-linecap="round" />
                    <line id="hour-hand" x1="100" y1="100" x2="100" y2="52" stroke="#ff4081" stroke-width="6.5" stroke-linecap="round" />
                    <circle cx="100" cy="100" r="6" fill="#1ebd9b" />
                </svg>
            </div>

            <div>
                <div class="time-display-pill" id="numerical-display">4:00 O'clock</div>
            </div>

            <div class="controls-row">
                <button class="circle-step-btn" onclick="adjustTime(-1)">−</button>
                <button class="circle-step-btn" onclick="adjustTime(1)">+</button>
            </div>

            <button class="submit-btn" onclick="evaluateAnswer()">Check Answer ✓</button>
        </div>

        <div class="modal-overlay" id="alert-modal">
            <div class="custom-popup-box">
                <div class="popup-header" id="modal-title-host">bomis-primary.github.io says</div>
                <div class="popup-message" id="modal-msg-body">Try again! Change the clock or move the pieces to find the right order! ✨</div>
                <div class="popup-actions">
                    <button class="popup-ok-btn" onclick="dismissModal()">OK</button>
                </div>
            </div>
        </div>
    </div>
