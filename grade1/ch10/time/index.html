<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Quiz - Hourly Master</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-dark: #3b5984;
            --secondary: #ff9f43;
            --text-main: #2c3e50;
            --success: #2ecc71;
            --error: #e74c3c;
        }

        * {
            box-sizing: border-box;
            font-family: 'Capriola', 'Comic Sans MS', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #ch7dd9 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            background: white;
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 4px solid #fff;
            text-align: center;
            position: relative;
            min-height: 540px;
        }

        /* --- OVERLAYS --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .brand-logo-img {
            max-width: 220px;
            object-fit: contain;
        }

        #title-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4ea8de, #5390d9);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            color: white;
            padding: 30px;
            transition: opacity 0.5s ease;
        }

        #end-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4a6fa5, #3b5984);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 80;
            color: white;
            padding: 25px;
            display: none;
        }

        /* --- HUD META --- */
        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .level-badge {
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
        }

        /* --- CLOCK DESIGN AREA --- */
        .clock-holder {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .clock-svg {
            width: 200px;
            height: 200px;
        }

        /* --- MCQ ENGINE --- */
        .mcq-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.01);
        }

        .option-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-btn.correct {
            background: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724 !important;
        }

        .option-btn.wrong {
            background: #f8d7da !important;
            border-color: var(--error) !important;
            color: #721c24 !important;
        }

        .action-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div id="splash-screen">
            <img src="assets/logo.png" alt="Logo" class="brand-logo-img">
        </div>

        <div id="title-screen">
            <div style="font-size: 60px; margin-bottom: 10px;">⏰</div>
            <h2 style="font-size: 28px; margin: 0 0 10px 0;">Tick Tock Clock</h2>
            <p style="font-size: 15px; margin-bottom: 30px; text-align: center; max-width: 340px;">
                Look closely at the hands of the analog clock face and select the true matching numerical hours!
            </p>
            <button class="action-btn" style="background: white; color: #5390d9;" onclick="startGame()">Start Quiz 🧭</button>
        </div>

        <div class="header-meta">
            <div class="level-badge" id="round-badge">Screen 1 / 4</div>
            <div></div>
        </div>

        <h1 style="font-size: 22px; color: var(--text-main); margin: 5px 0;">What time is shown?</h1>
        <div style="color: #64748b; font-size: 14px; font-weight: bold; margin-bottom: 10px;">
            Analyze the position of the short hour hand.
        </div>

        <div class="clock-holder">
            <svg class="clock-svg" viewBox="0 0 200 200" id="live-clock">
                <circle cx="100" cy="100" r="95" stroke="#4a6fa5" stroke-width="6" fill="#ffffff" />
                <circle cx="100" cy="100" r="88" stroke="#e2e8f0" stroke-width="2" fill="none" />
                
                <text x="100" y="30" text-anchor="middle" font-weight="bold" font-size="16" fill="#2c3e50">12</text>
                <text x="175" y="106" text-anchor="middle" font-weight="bold" font-size="16" fill="#2c3e50">3</text>
                <text x="100" y="182" text-anchor="middle" font-weight="bold" font-size="16" fill="#2c3e50">6</text>
                <text x="25" y="106" text-anchor="middle" font-weight="bold" font-size="16" fill="#2c3e50">9</text>
                
                <text x="138" y="49" text-anchor="middle" font-weight="bold" font-size="13" fill="#64748b">1</text>
                <text x="163" y="74" text-anchor="middle" font-weight="bold" font-size="13" fill="#64748b">2</text>
                <text x="163" y="138" text-anchor="middle" font-weight="bold" font-size="13" fill="#64748b">4</text>
                <text x="138" y="164" text-anchor="middle" font-weight="bold" font-size="13" fill="#64748b">5</text>
                <text x="64" y="164" text-anchor="middle" font-weight="bold" font-size="13" fill="#64748b">7</text>
                <text x="39" y="138" text-anchor="middle" font-weight="bold" font-size="13" fill="#64748b">8</text>
                <text x="39" y="74" text-anchor="middle" font-weight="bold" font-size="13" fill="#64748b">10</text>
                <text x="64" y="49" text-anchor="middle" font-weight="bold" font-size="13" fill="#64748b">11</text>

                <line x1="100" y1="100" x2="100" y2="40" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" />
                
                <line id="hour-hand" x1="100" y1="100" x2="100" y2="55" stroke="#ff9f43" stroke-width="7" stroke-linecap="round" />
                
                <circle cx="100" cy="100" r="6" fill="#2c3e50" />
            </svg>
        </div>

        <div class="mcq-container" id="options-box"></div>

        <div id="end-overlay">
            <div style="font-size: 65px; margin-bottom: 15px;">👑</div>
            <h2 style="font-size: 26px; margin: 0 0 10px 0;">Great Job!</h2>
            <p style="font-size: 18px; margin-bottom: 30px; max-width: 400px; line-height: 1.4;">
                You successfully solved all the analog clock reading challenges accurately!
            </p>
            <button class="action-btn" style="background:white; color:var(--primary);" onclick="restartGame()">Play Again 🔄</button>
        </div>
    </div>

    <script>
        let currentScreenIdx = 0;
        let screenHours = [];
        let canInteract = true;

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 2000);
        };

        function startGame() {
            const title = document.getElementById('title-screen');
            title.style.opacity = '0';
            setTimeout(() => {
                title.style.display = 'none';
                generateScreenHours();
                loadQuizScreen();
            }, 500);
        }

        // Generates 4 strictly distinct hours for each quiz card run
        function generateScreenHours() {
            let hoursSet = new Set();
            while(hoursSet.size < 4) {
                let randomHour = Math.floor(Math.random() * 12) + 1; // 1 to 12
                hoursSet.add(randomHour);
            }
            screenHours = Array.from(hoursSet);
        }

        function loadQuizScreen() {
            canInteract = true;
            document.getElementById('round-badge').innerText = `Screen ${currentScreenIdx + 1} / 4`;
            
            let targetHour = screenHours[currentScreenIdx];
            updateClockFace(targetHour);

            // Construct choices pool with target answer + 2 unique distractors
            let options = new Set([targetHour]);
            while(options.size < 3) {
                let distractor = Math.floor(Math.random() * 12) + 1;
                options.add(distractor);
            }

            let sortedOptions = Array.from(options).sort(() => Math.random() - 0.5);
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';

            sortedOptions.forEach(val => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = `${val}:00 O'clock`;
                button.onclick = () => checkSelection(button, val, targetHour);
                optionsBox.appendChild(button);
            });
        }

        function updateClockFace(hour) {
            // Calculate rotational degrees based on standard circle geometric space
            let angle = hour * 30; 
            let hand = document.getElementById('hour-hand');
            if(hand) {
                hand.setAttribute('transform', `rotate(${angle} 100 100)`);
            }
        }

        function checkSelection(button, pickedValue, correctValue) {
            if (!canInteract) return;
            canInteract = false;

            if (pickedValue === correctValue) {
                button.classList.add('correct');
                confetti({ particleCount: 30, spread: 50 });
                
                setTimeout(() => {
                    if (currentScreenIdx + 1 < 4) {
                        currentScreenIdx++;
                        loadQuizScreen();
                    } else {
                        document.getElementById('end-overlay').style.display = 'flex';
                    }
                }, 1200);
            } else {
                button.classList.add('wrong');
                // Auto highlight correct answer button
                setTimeout(() => {
                    Array.from(document.getElementsByClassName('option-btn')).forEach(btn => {
                        if (btn.innerText.startsWith(correctValue + ':')) {
                            btn.classList.add('correct');
                        }
                    });
                }, 300);

                setTimeout(() => {
                    loadQuizScreen();
                }, 1500);
            }
        }

        function restartGame() {
            currentScreenIdx = 0;
            generateScreenHours();
            document.getElementById('end-overlay').style.display = 'none';
            document.getElementById('title-screen').style.display = 'flex';
            document.getElementById('title-screen').style.opacity = '1';
        }
    </script>
</body>
</html>
