<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measurement Masters: Chapter 8</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    /* Bright, cheerful, sky-to-grass kid-friendly background environment */
    background: linear-gradient(to bottom, #b3e5fc 0%, #e1f5fe 40%, #81c784 40%, #4caf50 100%);
    color: #333;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    position: relative;
}

/* Decorative Sun Element */
body::before {
    content: "☀️";
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: clamp(50px, 10vw, 80px);
    z-index: 1;
    animation: spinSun 20s linear infinite;
}
@keyframes spinSun { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

#splashScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    transition: opacity 0.5s ease-out;
}
#splashScreen img { max-width: 80%; max-height: 60%; object-fit: contain; }

#gameContainer {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 2;
}

.level-badge {
    background: #ff9800;
    color: white;
    padding: 6px 22px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

h1 {
    margin: 10px 0 5px 0;
    font-size: clamp(26px, 6vw, 38px);
    color: #0d47a1;
    text-shadow: 0px 2px 4px rgba(255,255,255,0.8);
}

.instruction {
    margin: 0 0 15px 0;
    font-size: clamp(16px, 3.8vw, 22px);
    color: #d84315;
    font-weight: bold;
    max-width: 90%;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
}

/* ================= ITEM PAIR WORKBOARD AREA ================= */
#sortingArena {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.item-pair-board {
    background: #8d6e63; /* Wooden brown board look */
    border: 8px solid #5d4037;
    border-radius: 24px;
    padding: 15px 25px;
    margin-bottom: 25px;
    box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90vw;
    max-width: 500px;
    box-sizing: border-box;
}

.board-title {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ffecb3;
    font-weight: 900;
    margin-bottom: 12px;
}

.items-scaffold {
    display: flex;
    justify-content: center;
    gap: 40px;
    width: 100%;
}

.draggable-wrapper {
    width: 110px;
    height: 110px;
    background: #fff;
    border-radius: 20px;
    border: 4px solid #ffb74d;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
    cursor: grab;
    touch-action: none; /* Prevents mobile screen scrolling while dragging items */
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    z-index: 10;
}
.draggable-wrapper:active { cursor: grabbing; transform: scale(1.1); box-shadow: 0 12px 20px rgba(0,0,0,0.3); }
.draggable-wrapper img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

/* ================= DRAGGABLE DROPAZONES (BASKETS) ================= */
.bins-container {
    display: flex;
    justify-content: center;
    gap: 25px;
    width: 92vw;
    max-width: 520px;
    margin-top: 10px;
}

.sort-bin {
    flex: 1;
    background: rgba(255, 255, 255, 0.65);
    border: 4px dashed #0288d1;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 15px 10px;
    box-sizing: border-box;
    min-height: 200px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    transition: background-color 0.2s;
}
.sort-bin.drag-over { background-color: rgba(129, 199, 132, 0.85); border-color: #2e7d32; }
.sort-bin .bin-title { font-size: clamp(18px, 4vw, 24px); font-weight: bold; color: #0d47a1; text-shadow: 0 1px 1px white; margin-bottom: 5px; }
.sort-bin img.bin-icon { width: 90%; max-height: 100px; object-fit: contain; pointer-events: none; }

/* ================= LEVEL 2: ORDERING MACHINE ================= */
#orderingArena {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.scrambled-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 35px;
    width: 92vw;
    max-width: 520px;
}

.order-card {
    width: clamp(85px, 22vw, 120px);
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 20px;
    border: 4px solid #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    cursor: pointer;
    padding: 12px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background-color 0.2s;
}
.order-card:hover { transform: scale(1.05); }
.order-card img { width: 100%; height: 100%; object-fit: contain; }

.slots-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    width: 92vw;
    max-width: 520px;
}

.pedestal-slot {
    width: clamp(85px, 22vw, 120px);
    aspect-ratio: 1 / 1;
    background: rgba(0,0,0,0.2);
    border: 3px solid rgba(255,255,255,0.6);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
}
.pedestal-slot img { width: 90%; height: 90%; object-fit: contain; }
.pedestal-label { font-size: 12px; font-weight: bold; color: #0d47a1; margin-top: 6px; text-shadow: 0 1px 1px white; }

/* Global Navigation Actions */
.btn {
    padding: 14px 45px;
    margin: 25px 0 15px 0;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: #ff5722;
    color: white;
    box-shadow: 0 6px 14px rgba(255, 87, 34, 0.4);
    transition: transform 0.1s;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

#fireworks { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }

#winScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(26, 35, 126, 0.98);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
#winScreen h1 { font-size: clamp(36px, 8vw, 56px); color: #ffd166; margin: 0 0 12px 0; text-shadow: none; }
</style>
</head>
<body>

<div id="splashScreen">
    <img src="assets/logo.png" alt="Logo">
</div>

<div id="gameContainer">
    <div id="levelBadge" class="level-badge">LEVEL 1</div>
    <h1 id="gameTitle">Measurement Sorting Zone</h1>
    <p id="gameInstruction" class="instruction">Loading setup...</p>

    <div id="sortingArena">
        <div class="item-pair-board">
            <div class="board-title">Item Pair Area</div>
            <div class="items-scaffold" id="itemsScaffold">
                </div>
        </div>
        
        <div class="bins-container">
            <div class="sort-bin" data-side="left">
                <div id="leftBinTitle" class="bin-title">Heavy</div>
                <img class="bin-icon" src="assets/basket.png" alt="Basket">
            </div>
            <div class="sort-bin" data-side="right">
                <div id="rightBinTitle" class="bin-title">Light</div>
                <img class="bin-icon" src="assets/basket.png" alt="Basket">
            </div>
        </div>
    </div>

    <div id="orderingArena">
        <div id="scrambledRow" class="scrambled-row"></div>
        <div class="slots-row">
            <div class="pedestal-slot"><div id="p1" style="width:100%; height:100%;"></div><div class="pedestal-label">1st (Shortest)</div></div>
            <div class="pedestal-slot"><div id="p2" style="width:100%; height:100%;"></div><div class="pedestal-label">2nd</div></div>
            <div class="pedestal-slot"><div id="p3" style="width:100%; height:100%;"></div><div class="pedestal-label">3rd (Longest)</div></div>
        </div>
    </div>

    <button id="actionControl" class="btn" onclick="advanceNextSequence()" disabled>Next ➡️</button>
</div>

<canvas id="fireworks"></canvas>

<div id="winScreen">
    <h1 id="winHeader">LEVEL CLEAR! 🎉</h1>
    <p id="winMessage" style="font-size:22px; color:#e0f2f1; margin:0 0 25px 0;">Awesome sorting skills!</p>
    <button class="btn" style="background:#e91e63; box-shadow:0 6px 14px rgba(233,30,99,0.4);" onclick="handleOverlayReset()">Next Level ➡️</button>
</div>

<audio id="winMusic" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0b6b6b5c3.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<audio id="correctSound" preload="auto" src="assets/correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="assets/wrong.mp3"></audio>

<script>
const winMusic = document.getElementById("winMusic");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

let currentLevel = 1;
let currentRound = 0;
let winInterval = null;

/* LEVEL 1 PAIRS: Direct configurations matching your GitHub folder extensions */
const sortingRounds = [
    {
        instruction: "Round 1: Which item is Heavy and which is Light?",
        leftLabel: "Heavy", rightLabel: "Light",
        items: [
            { id: "itemA", img: "assets/pink-dino.png", target: "left" },
            { id: "itemB", img: "assets/frog.png", target: "right" }
        ]
    },
    {
        instruction: "Round 2: Which item is Heavy and which is Light?",
        leftLabel: "Heavy", rightLabel: "Light",
        items: [
            { id: "itemA", img: "assets/watermelon.png", target: "left" },
            { id: "itemB", img: "assets/apple.png", target: "right" }
        ]
    },
    {
        instruction: "Round 3: Which item is Heavy and which is Light?",
        leftLabel: "Heavy", rightLabel: "Light",
        items: [
            { id: "itemA", img: "assets/pencil.png", target: "left" },
            { id: "itemB", img: "assets/feather.png", target: "right" }
        ]
    },
    {
        instruction: "Round 4: Which item is Long and which is Short?",
        leftLabel: "Long", rightLabel: "Short",
        items: [
            { id: "itemA", img: "assets/ladder.png", target: "left" },
            { id: "itemB", img: "assets/ribbon.png", target: "right" }
        ]
    },
    {
        instruction: "Round 5: Which item holds More and which holds Less?",
        leftLabel: "Holds More", rightLabel: "Holds Less",
        items: [
            { id: "itemA", img: "assets/milk-carton.png", target: "left" },
            { id: "itemB", img: "assets/cup.png", target: "right" }
        ]
    }
];

let roundSortedCount = 0;

/* LEVEL 2 POOL ASSETS */
const orderingPool = [
    { rank: 1, img: "assets/eraser.jpg" },
    { rank: 2, img: "assets/pencil.png" },
    { rank: 3, img: "assets/ladder.png" }
];
let level2PlacementIndex = 1;

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const splash = document.getElementById("splashScreen");
        const container = document.getElementById("gameContainer");
        splash.style.opacity = "0";
        setTimeout(() => {
            splash.style.display = "none";
            container.style.display = "flex";
            startLevel1();
        }, 500);
    }, 5000);
});

/* ================= LEVEL 1 OPERATORS WITH DRAG & DROP ENGINE ================= */
function startLevel1() {
    currentLevel = 1;
    currentRound = 0;
    document.getElementById("levelBadge").innerText = "LEVEL 1";
    document.getElementById("gameTitle").innerText = "Measurement Sorting Zone";
    document.getElementById("sortingArena").style.display = "flex";
    document.getElementById("orderingArena").style.display = "none";
    initDragAndDropListeners();
    loadSortingRound(currentRound);
}

function loadSortingRound(roundIndex) {
    document.getElementById("actionControl").disabled = true;
    roundSortedCount = 0;
    
    const roundData = sortingRounds[roundIndex];
    document.getElementById("gameInstruction").innerText = roundData.instruction;
    document.getElementById("leftBinTitle").innerText = roundData.leftLabel;
    document.getElementById("rightBinTitle").innerText = roundData.rightLabel;
    
    // Scramble the rendering order inside the wooden board box
    let scrambledPair = [...roundData.items];
    for (let i = scrambledPair.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [scrambledPair[i], scrambledPair[j]] = [scrambledPair[j], scrambledPair[i]];
    }
    
    const scaffold = document.getElementById("itemsScaffold");
    scaffold.innerHTML = "";
    
    scrambledPair.forEach(item => {
        const frame = document.createElement("div");
        frame.className = "draggable-wrapper";
        frame.id = item.id;
        frame.dataset.target = item.target;
        frame.innerHTML = `<img src="${item.img}">`;
        makeElementMobileDraggable(frame);
        scaffold.appendChild(frame);
    });
}

// Comprehensive Touch & Mouse dragging calculations

    let startX = 0, startY = 0;
    let originalLeft = 0, originalTop = 0;
    let isDragging = false;

    el.addEventListener('mousedown', dragStart);
    el.addEventListener('touchstart', dragStart, { passive: false });

    function dragStart(e) {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        startX = clientX;
        startY = clientY;
        
        el.style.transition = "none";
        el.style.zIndex = "1000";

        document.addEventListener('mousemove', dragMove);
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('touchend', dragEnd);
    }

        if (!isDragging) return;
        if(e.cancelable) e.preventDefault(); // Prevents mobile bouncing while dragging
        
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let deltaX = clientX - startX;
        let deltaY = clientY - startY;

        el.style.transform =
