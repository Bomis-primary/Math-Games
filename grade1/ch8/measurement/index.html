<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measurement Masters: Chapter 8</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #134e5e, #71b280);
    color: white;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
}

#splashScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    transition: opacity 0.5s ease-out;
}
#splashScreen img { max-width: 80%; max-height: 60%; object-fit: contain; }

#gameContainer {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.level-badge {
    background: rgba(0, 0, 0, 0.4);
    padding: 6px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 15px;
    border: 1px solid rgba(255,255,255,0.2);
}

h1 {
    margin: 10px 0 5px 0;
    font-size: clamp(24px, 6vw, 36px);
    text-shadow: 0px 4px 8px rgba(0,0,0,0.4);
    color: #ffd166;
}

.instruction {
    margin: 0 0 20px 0;
    font-size: clamp(16px, 3.8vw, 20px);
    color: #fffb00;
    font-weight: bold;
    max-width: 90%;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}

/* ================= LEVEL 1: DYNAMIC TWIN BASKETS ================= */
#sortingArena {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

#itemDispenser {
    width: 130px;
    height: 130px;
    background: white;
    border-radius: 24px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
    border: 5px solid #ffd166;
    position: relative;
    animation: bounceItem 2s infinite alternate;
}

@keyframes bounceItem {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
}

#itemDispenser img { width: 100%; height: 100%; object-fit: contain; }

.bins-container {
    display: flex;
    justify-content: center;
    gap: 25px;
    width: 92vw;
    max-width: 500px;
}

.sort-bin {
    flex: 1;
    background: rgba(255, 255, 255, 0.15);
    border: 3.5px dashed rgba(255, 255, 255, 0.5);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    padding: 15px 10px;
    box-sizing: border-box;
    min-height: 190px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}
.sort-bin:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.04); }
.sort-bin .bin-title { font-size: clamp(16px, 3.5vw, 22px); font-weight: bold; color: #ffd166; text-shadow: 0 2px 4px rgba(0,0,0,0.4); margin-bottom: 5px; }
.sort-bin img.bin-icon { width: 95%; max-height: 95px; object-fit: contain; }

/* ================= LEVEL 2: ARRANGEMENT PEDESTALS ================= */
#orderingArena {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.scrambled-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 35px;
    width: 92vw;
    max-width: 520px;
}

.order-card {
    width: clamp(85px, 22vw, 120px);
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 20px;
    border: 4px solid #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    cursor: pointer;
    padding: 12px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background-color 0.2s;
}
.order-card:hover { transform: scale(1.05); }
.order-card img { width: 100%; height: 100%; object-fit: contain; }

.slots-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    width: 92vw;
    max-width: 520px;
}

.pedestal-slot {
    width: clamp(85px, 22vw, 120px);
    aspect-ratio: 1 / 1;
    background: rgba(0,0,0,0.35);
    border: 3px solid rgba(255,255,255,0.25);
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
}
.pedestal-slot img { width: 90%; height: 90%; object-fit: contain; }
.pedestal-label { font-size: 11px; font-weight: bold; color: #ffd166; margin-top: 6px; }

/* Global System Controls */
.btn {
    padding: 14px 40px;
    margin: 25px 0 15px 0;
    font-size: 18px;
    font-weight: bold;
    border: 2px solid #fff;
    border-radius: 50px;
    cursor: pointer;
    background: #023e8a;
    color: white;
    box-shadow: 0 5px 15px rgba(2, 62, 138, 0.4);
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

#fireworks { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }

#winScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(12, 28, 22, 0.97);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
#winScreen h1 { font-size: clamp(34px, 8vw, 56px); color: #ffd166; margin: 0 0 12px 0; }
</style>
</head>
<body>

<div id="splashScreen">
    <img src="assets/logo.png" alt="Logo">
</div>

<div id="gameContainer">
    <div id="levelBadge" class="level-badge">LEVEL 1</div>
    <h1 id="gameTitle">Measurement Sorting Zone</h1>
    <p id="gameInstruction" class="instruction">Loading setup...</p>

    <div id="sortingArena">
        <div id="itemDispenser"></div>
        
        <div class="bins-container">
            <div class="sort-bin" onclick="evaluateSort('left')">
                <div id="leftBinTitle" class="bin-title">Heavy</div>
                <img class="bin-icon" src="assets/basket.png" alt="Basket">
            </div>
            <div class="sort-bin" onclick="evaluateSort('right')">
                <div id="rightBinTitle" class="bin-title">Light</div>
                <img class="bin-icon" src="assets/basket.png" alt="Basket">
            </div>
        </div>
    </div>

    <div id="orderingArena">
        <div id="scrambledRow" class="scrambled-row"></div>
        <div class="slots-row">
            <div class="pedestal-slot"><div id="p1" style="width:100%; height:100%;"></div><div class="pedestal-label">1st (Shortest)</div></div>
            <div class="pedestal-slot"><div id="p2" style="width:100%; height:100%;"></div><div class="pedestal-label">2nd</div></div>
            <div class="pedestal-slot"><div id="p3" style="width:100%; height:100%;"></div><div class="pedestal-label">3rd (Longest)</div></div>
        </div>
    </div>

    <button id="actionControl" class="btn" onclick="advanceNextSequence()" disabled>Next ➡️</button>
</div>

<canvas id="fireworks"></canvas>

<div id="winScreen">
    <h1 id="winHeader">LEVEL CLEAR! 🎉</h1>
    <p id="winMessage" style="font-size:20px; color:#e0f2f1; margin:0 0 25px 0;">Awesome sorting skills!</p>
    <button class="btn" style="background:#ff006e; box-shadow:0 5px 15px rgba(255,0,110,0.4); border:none;" onclick="handleOverlayReset()">Next Level ➡️</button>
</div>

<audio id="winMusic" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0b6b6b5c3.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<audio id="correctSound" preload="auto" src="assets/correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="assets/wrong.mp3"></audio>

<script>
const winMusic = document.getElementById("winMusic");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

let currentLevel = 1;
let currentRound = 0;
let winInterval = null;

/* LEVEL 1 DEFINITIONS: 5 custom curriculum rounds */
const sortingRounds = [
    {
        instruction: "Round 1: Which item is Heavy and which is Light?",
        leftLabel: "Heavy", rightLabel: "Light",
        items: [
            { img: "assets/pink-dino.png", target: "left" },
            { img: "assets/frog.png", target: "right" }
        ]
    },
    {
        instruction: "Round 2: Which item is Heavy and which is Light?",
        leftLabel: "Heavy", rightLabel: "Light",
        items: [
            { img: "assets/watermelon.png", target: "left" },
            { img: "assets/apple.png", target: "right" }
        ]
    },
    {
        instruction: "Round 3: Which item is Heavy and which is Light?",
        leftLabel: "Heavy", rightLabel: "Light",
        items: [
            { img: "assets/pencil.png", target: "left" },
            { img: "assets/feather.png", target: "right" }
        ]
    },
    {
        instruction: "Round 4: Which item is Long and which is Short?",
        leftLabel: "Long", rightLabel: "Short",
        items: [
            { img: "assets/ladder.png", target: "left" },
            { img: "assets/ribbon.png", target: "right" }
        ]
    },
    {
        instruction: "Round 5: Which item holds More and which holds Less?",
        leftLabel: "Holds More", rightLabel: "Holds Less",
        items: [
            { img: "assets/milk-carton.png", target: "left" },
            { img: "assets/cup.png", target: "right" }
        ]
    }
];

let level1ActiveItems = [];
let level1CurrentItem = null;

/* LEVEL 2 ORDERING SETS */
const orderingPool = [
    { rank: 1, img: "assets/eraser.jpg" },
    { rank: 2, img: "assets/pencil.png" },
    { rank: 3, img: "assets/ladder.png" }
];
let level2PlacementIndex = 1;

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const splash = document.getElementById("splashScreen");
        const container = document.getElementById("gameContainer");
        splash.style.opacity = "0";
        setTimeout(() => {
            splash.style.display = "none";
            container.style.display = "flex";
            startLevel1();
        }, 500);
    }, 5000);
});

/* ================= LEVEL 1 OPERATORS ================= */
function startLevel1() {
    currentLevel = 1;
    currentRound = 0;
    document.getElementById("levelBadge").innerText = "LEVEL 1";
    document.getElementById("gameTitle").innerText = "Measurement Sorting Zone";
    document.getElementById("sortingArena").style.display = "flex";
    document.getElementById("orderingArena").style.display = "none";
    loadSortingRound(currentRound);
}

function loadSortingRound(roundIndex) {
    document.getElementById("actionControl").disabled = true;
    const roundData = sortingRounds[roundIndex];
    
    document.getElementById("gameInstruction").innerText = roundData.instruction;
    document.getElementById("leftBinTitle").innerText = roundData.leftLabel;
    document.getElementById("rightBinTitle").innerText = roundData.rightLabel;
    
    level1ActiveItems = [...roundData.items];
    // Scramble current pair
    for (let i = level1ActiveItems.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [level1ActiveItems[i], level1ActiveItems[j]] = [level1ActiveItems[j], level1ActiveItems[i]];
    }
    dispenseNextItem();
}

function dispenseNextItem() {
    if (level1ActiveItems.length === 0) {
        document.getElementById("itemDispenser").innerHTML = "<div style='font-size:38px;'>✅</div>";
        document.getElementById("actionControl").disabled = false;
        level1CurrentItem = null;
        return;
    }
    level1CurrentItem = level1ActiveItems.pop();
    document.getElementById("itemDispenser").innerHTML = `<img src="${level1CurrentItem.img}">`;
}

function evaluateSort(chosenSide) {
    if (!level1CurrentItem) return;
    
    if (chosenSide === level1CurrentItem.target) {
        correctSound.currentTime = 0;
        correctSound.play().catch(e => {});
        dispenseNextItem();
    } else {
        wrongSound.currentTime = 0;
        wrongSound.play().catch(e => {});
        
        const d = document.getElementById("itemDispenser");
        d.style.transform = "translateX(12px)";
        setTimeout(() => d.style.transform = "translateX(-12px)", 80);
        setTimeout(() => d.style.transform = "translateX(0)", 160);
    }
}

/* ================= LEVEL 2 OPERATORS ================= */
function startLevel2() {
    currentLevel = 2;
    document.getElementById("levelBadge").innerText = "LEVEL 2";
    document.getElementById("gameTitle").innerText = "The Ordering Machine";
    document.getElementById("gameInstruction").innerText = "Arrange items in order: Tap items from Shortest to Longest!";
    document.getElementById("sortingArena").style.display = "none";
    document.getElementById("orderingArena").style.display = "flex";
    document.getElementById("actionControl").disabled = true;

    level2PlacementIndex = 1;
    document.getElementById("p1").innerHTML = "";
    document.getElementById("p2").innerHTML = "";
    document.getElementById("p3").innerHTML = "";

    let itemsToScramble = [...orderingPool];
    for (let i = itemsToScramble.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [itemsToScramble[i], itemsToScramble[j]] = [itemsToScramble[j], itemsToScramble[i]];
    }

    const row = document.getElementById("scrambledRow");
    row.innerHTML = "";
    itemsToScramble.forEach(item => {
        const card = document.createElement("div");
        card.className = "order-card";
        card.innerHTML = `<img src="${item.img}">`;
        card.onclick = () => evaluateOrderClick(card, item);
        row.appendChild(card);
    });
}

function evaluateOrderClick(cardElement, itemData) {
    if (itemData.rank === level2PlacementIndex) {
        correctSound.currentTime = 0;
        correctSound.play().catch(e => {});
        
        document.getElementById(`p${level2PlacementIndex}`).innerHTML = `<img src="${itemData.img}" style="width:100%; height:100%; object-fit:contain;">`;
        cardElement.style.visibility = "hidden";
        
        level2PlacementIndex++;
        if (level2PlacementIndex > 3) {
            document.getElementById("actionControl").disabled = false;
        }
    } else {
        wrongSound.currentTime = 0;
        wrongSound.play().catch(e => {});
        cardElement.style.backgroundColor = "#ffcdd2";
        setTimeout(() => cardElement.style.backgroundColor = "#ffffff", 500);
    }
}

/* ================= CORE FLOW CONTROL ================= */
function advanceNextSequence() {
    if (currentLevel === 1) {
        currentRound++;
        if (currentRound < sortingRounds.length) {
            loadSortingRound(currentRound);
        } else {
            triggerCelebrationOverlay("LEVEL 1 MET! 🏆", "Splendid sorting! Ready for the sequencing machine?", "Next Level ➡️");
        }
    } else {
        triggerCelebrationOverlay("CHAPTER COMPLETE! 👑", "Outstanding! You have mastered all Chapter 8 measurement criteria!", "Play Again 🔄");
    }
}

function triggerCelebrationOverlay(head, msg, btnTxt) {
    document.getElementById("winHeader").innerText = head;
    document.getElementById("winMessage").innerText = msg;
    const overlayBtn = document.querySelector("#winScreen .btn");
    overlayBtn.innerText = btnTxt;
    
    document.getElementById("winScreen").style.display = "flex";
    winMusic.currentTime = 0;
    winMusic.play().catch(e => {});
    
    burst();
    winInterval = setInterval(burst, 700);
}

function handleOverlayReset() {
    document.getElementById("winScreen").style.display = "none";
    if (winInterval) clearInterval(winInterval);
    particles = [];

    if (currentLevel === 1) {
        startLevel2();
    } else {
        startLevel1();
    }
}

// FIREWORKS OPERATORS
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

function burst() {
    const ox = Math.random() * canvas.width;
    const oy = Math.random() * (canvas.height * 0.6) + (canvas.height * 0.1);
    const hue = Math.floor(Math.random() * 360);
    for(let i=0; i<35; i++){
        let a = Math.random() * 2 * Math.PI;
        let s = Math.random() * 4 + 1.5;
        particles.push({ x: ox, y: oy, vx: Math.cos(a)*s, vy: Math.sin(a)*s, radius: Math.random()*2+1, alpha: 1, color: `hsla(${hue}, 100%, 60%, `, gravity: 0.04 });
    }
}
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.alpha -= 0.015; });
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => {
        ctx.fillStyle = `${p.color}${p.alpha})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
