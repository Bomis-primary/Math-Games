<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measurement Masters: Chapter 8</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #b3e5fc 0%, #e1f5fe 40%, #81c784 40%, #4caf50 100%);
    color: #333;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
    position: relative;
}

body::before {
    content: "☀️";
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: clamp(60px, 12vw, 100px);
    z-index: 1;
}

#splashScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    transition: opacity 0.3s ease-out;
}
#splashScreen img { max-width: 80%; max-height: 60%; object-fit: contain; }

#gameContainer {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    z-index: 2;
}

.level-badge {
    background: #ff9800;
    color: white;
    padding: 8px 28px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

h1 {
    margin: 15px 0 5px 0;
    font-size: clamp(28px, 6vw, 42px);
    color: #0d47a1;
    text-shadow: 0px 2px 4px rgba(255,255,255,0.8);
}

.instruction {
    margin: 0 0 20px 0;
    font-size: clamp(18px, 4vw, 26px);
    color: #d84315;
    font-weight: bold;
    max-width: 90%;
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
}

#sortingArena {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.item-pair-board {
    background: #8d6e63;
    border: 8px solid #5d4037;
    border-radius: 28px;
    padding: 30px 35px;
    margin-bottom: 30px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 92vw;
    max-width: 600px;
    box-sizing: border-box;
}

.items-scaffold {
    display: flex;
    justify-content: center;
    gap: 50px;
    width: 100%;
    min-height: 160px;
}

.draggable-wrapper {
    width: 150px;
    height: 150px;
    background: #fff;
    border-radius: 24px;
    border: 5px solid #ffb74d;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    box-sizing: border-box;
    cursor: grab;
    touch-action: none;
    position: relative;
    left: 0;
    top: 0;
    z-index: 10;
}
.draggable-wrapper:active { cursor: grabbing; }
.draggable-wrapper img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; transition: transform 0.2s; }

.bins-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    width: 94vw;
    max-width: 620px;
    margin-top: 10px;
}

.sort-bin {
    flex: 1;
    background: rgba(255, 255, 255, 0.7);
    border: 5px dashed #0288d1;
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px 15px;
    box-sizing: border-box;
    min-height: 250px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.12);
}
.sort-bin.drag-over { background-color: rgba(129, 199, 132, 0.9); border-color: #2e7d32; }
.sort-bin .bin-title { font-size: clamp(22px, 4.5vw, 28px); font-weight: bold; color: #0d47a1; text-shadow: 0 1px 1px white; margin-bottom: 10px; }
.sort-bin img.bin-icon { width: 95%; max-height: 140px; object-fit: contain; pointer-events: none; }

#orderingArena {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.scrambled-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    width: 94vw;
    max-width: 620px;
}

.order-card {
    width: clamp(105px, 26vw, 145px);
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border-radius: 24px;
    border: 5px solid #fff;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    cursor: pointer;
    padding: 15px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
}
.order-card:hover { transform: scale(1.05); }
.order-card img { width: 100%; height: 100%; object-fit: contain; }

.slots-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    width: 94vw;
    max-width: 620px;
}

.pedestal-slot {
    width: clamp(105px, 26vw, 145px);
    aspect-ratio: 1 / 1;
    background: rgba(0,0,0,0.25);
    border: 4px solid rgba(255,255,255,0.7);
    border-radius: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
}
.pedestal-slot img { width: 95%; height: 95%; object-fit: contain; }
.pedestal-label { font-size: 13px; font-weight: bold; color: #0d47a1; margin-top: 8px; text-shadow: 0 1px 1px white; }

.btn {
    padding: 16px 55px;
    margin: 30px 0 20px 0;
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: #ff5722;
    color: white;
    box-shadow: 0 6px 14px rgba(255, 87, 34, 0.4);
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

#fireworks { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }

#winScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(26, 35, 126, 0.98);
    display: none;
    flex-direction: column;
    justify-content: center;
