<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bomis Primary - Multiplication Journey</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5b4cd8;
            --primary-light: #f1f0fe;
            --secondary: #e84393; 
            --secondary-dark: #d63031;
            --bg-island: #f8f9fa;
            --text-dark: #2d3436;
            --text-muted: #636e72;
            --accent-yellow: #fdcb6e;
            --card-shadow: 0 10px 30px rgba(108, 92, 231, 0.1);
            --interface-border: #dfe6e9;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #dfe6e9 0%, #b2bec3 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- STAGE 1: EXCLUSIVE BRANDING PANEL --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .logo-display {
            width: 160px;
            height: auto;
            margin-bottom: 25px;
            animation: floatLogo 2.5s ease-in-out infinite alternate;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        .bar-loader {
            width: 240px;
            height: 6px;
            background: #e9ecef;
            border-radius: 50px;
            overflow: hidden;
            position: relative;
        }

        .bar-loader-progress {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transform: translateX(-100%);
            animation: fillLoadingBar 5s linear forwards;
        }

        @keyframes fillLoadingBar {
            to { transform: translateX(0%); }
        }

        /* --- STAGE 2: INTRO SCREEN PANEL --- */
        #intro-screen {
            background: var(--bg-island);
            border-radius: 28px;
            padding: 30px 24px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            text-align: center;
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .intro-title {
            color: var(--primary-dark);
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .intro-body {
            color: var(--text-dark);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
            text-align: left;
            background: #ffffff;
            padding: 20px;
            border-radius: 18px;
            box-shadow: var(--card-shadow);
        }

        /* --- STAGE 3: MAIN APP PANEL --- */
        .game-container {
            background: var(--bg-island);
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            text-align: center;
            display: none;
            position: relative;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            border: 1px solid rgba(255,255,255,0.8);
        }

        @keyframes popIn {
            from { transform: scale(0.93); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .dashboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .ui-badge {
            background: #ffffff;
            color: var(--primary-dark);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--interface-border);
        }

        .score-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
        }

        .star-icon {
            width: 20px;
            height: 20px;
        }

        .progress-bar {
            background: #e9ecef;
            border-radius: 50px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .instruction-card {
            font-size: 18px;
            color: var(--text-dark);
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.5;
            background: #ffffff;
            padding: 18px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            border-left: 6px solid var(--primary);
            text-align: left;
        }

        .hint-alert {
            background: #fff9db;
            border-left: 5px solid #f59f00;
            color: #f08c00;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            font-weight: 600;
            display: none;
            text-align: left;
        }

        /* --- INTERACTIVE WORKSPACES --- */
        .workspace {
            background: #ffffff;
            border-radius: 20px;
            min-height: 260px;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid var(--interface-border);
        }

        /* Tap Layout */
        .tap-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }

        .tap-option {
            background: #ffffff;
            border: 2px solid var(--interface-border);
            border-bottom: 5px solid #dee2e6;
            border-radius: 18px;
            padding: 16px;
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-dark);
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
        }

        .tap-option:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* Fixed Drag and Drop Layout Mechanics */
        .drag-workspace-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .drop-zones-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .target-slot {
            flex: 1;
            background: #ffffff;
            border: 2px dashed var(--primary);
            border-radius: 16px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 8px;
            transition: background 0.2s, border-color 0.2s;
        }

        .target-slot.drag-over {
            background: var(--primary-light);
            border-color: var(--secondary);
        }

        .slot-rank-label {
            position: absolute;
            bottom: 4px;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .items-deck {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 100px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 16px;
            border: 2px dashed #ced4da;
            width: 100%;
            flex-wrap: wrap;
        }

        .draggable-asset {
            cursor: grab;
            touch-action: none; /* Disables standard scrolling behavior while moving blocks */
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            border: 2px solid var(--interface-border);
            border-bottom: 4px solid #ced4da;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 18px;
            color: var(--text-dark);
            z-index: 10;
        }

        .draggable-asset:active {
            cursor: grabbing;
        }

        .draggable-asset.dragging {
            opacity: 0.4;
            border-style: dashed;
        }

        /* Action Buttons */
        .btn-action {
            background: #ffffff;
            border: 2px solid var(--interface-border);
            border-bottom: 5px solid #dee2e6;
            border-radius: 16px;
            color: var(--text-dark);
            font-size: 16px;
            font-weight: 700;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.1s ease;
            width: 100%;
        }

        .btn-action:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        .btn-primary-action {
            background: #20bf6b;
            border: 2px solid #26de81;
            border-bottom: 5px solid #059669;
            color: white;
            font-size: 18px;
        }

        .btn-primary-action:hover {
            background: #1abc9c;
        }

        /* Success & Failure Flashes */
        .tap-option.correct-flash, .target-slot.correct-flash {
            background-color: #20bf6b !important;
            color: white !important;
            border-color: #059669 !important;
        }

        .tap-option.wrong-flash, .target-slot.wrong-flash {
            animation: shakeNo 0.4s ease;
            background-color: #ff4d4d !important;
            color: white !important;
            border-color: #c23616 !important;
        }

            25% { transform: translateX(-
