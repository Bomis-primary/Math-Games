<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measurement Explorer Camp</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Comic Sans MS',Arial,sans-serif;background:#b7f5c8;color:#222}
.screen{display:none;min-height:100vh;text-align:center;padding:16px}
.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,.95);border-radius:24px;padding:22px;max-width:880px;width:94%;box-shadow:0 10px 25px rgba(0,0,0,.2)}
.logo{max-width:140px}
h1{color:#137333;font-size:clamp(28px,5vw,46px)}
h2{color:#174ea6;font-size:clamp(21px,4vw,32px)}
button{border:0;border-radius:18px;padding:14px 24px;font-size:20px;font-weight:bold;cursor:pointer;background:#ffbf00;color:#4a2b00;box-shadow:0 5px 0 #c58b00;margin:8px}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c58b00}

.game-area{
  min-height:100vh;
  background:url("assets/jungle-bg.png") center/cover no-repeat;
  padding:12px;
}

.topbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.badge{background:white;border-radius:15px;padding:9px 14px;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.timer{color:#d93025}.score{color:#188038}.attempts{color:#174ea6}

.progress-wrap{height:16px;background:white;border-radius:20px;overflow:hidden;max-width:900px;margin:8px auto}
.progress{height:100%;width:0;background:linear-gradient(90deg,#34a853,#fbbc04);transition:.4s}

.question-card{background:rgba(255,255,255,.96);max-width:900px;margin:10px auto;border-radius:24px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.level{font-weight:bold;color:#555}
.question{font-size:clamp(23px,4vw,36px);font-weight:bold;color:#0b3d21;margin:10px}

.play-zone{display:flex;align-items:flex-end;justify-content:center;gap:20px;max-width:1000px;margin:10px auto}
.explorer{width:170px;animation:bounce .8s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}

.options{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;flex:1;max-width:720px}
.option{background:rgba(255,255,255,.95);border:6px solid white;border-radius:24px;padding:16px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.22);transition:.2s;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.option:hover{transform:scale(1.03)}
.option img{max-width:170px;max-height:135px;object-fit:contain}
.option-name{font-size:24px;font-weight:bold;margin-top:8px}

.feedback{min-height:48px;font-size:22px;font-weight:bold;background:rgba(255,255,255,.92);border-radius:16px;padding:8px 14px;max-width:800px;margin:8px auto}
.correct{color:#188038}
.wrong{color:#d93025}
.result-stars{font-size:46px}

.confetti{position:fixed;width:10px;height:10px;top:-10px;animation:fall 1.8s linear forwards;z-index:99}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media(max-width:700px){
.play-zone{flex-direction:column;align-items:center}
.explorer{width:120px}
.options{grid-template-columns:1fr;width:100%}
.option{min-height:160px}
.option img{max-width:130px;max-height:100px}
.option-name{font-size:20px}
}
</style>
</head>

<body>

<section id="start" class="screen active">
  <div class="card">
    <img src="assets/logo.png" class="logo" onerror="this.style.display='none'">
    <h1>🧭 Measurement Explorer Camp</h1>
    <h2>Grade 1 Maths — Measurement</h2>
    <p>Help the explorer choose the correct object.</p>
    <p><b>Topics:</b> Length, Weight and Capacity</p>
    <button onclick="startGame()">Start Game</button>
  </div>
</section>

<section id="game" class="screen game-area">
  <div class="topbar">
    <div class="badge timer">⏱ Time: <span id="time">60</span>s</div>
    <div class="badge score">⭐ Score: <span id="score">0</span></div>
    <div class="badge attempts">🔁 Attempts Left: <span id="attempts">2</span></div>
  </div>

  <div class="progress-wrap"><div id="progress" class="progress"></div></div>

  <div class="question-card">
    <div class="level" id="levelText"></div>
    <div class="question" id="question"></div>
  </div>

  <div class="play-zone">
    <img src="assets/explorer.png" class="explorer">
    <div class="options" id="options"></div>
  </div>

  <div id="feedback" class="feedback"></div>
</section>

<section id="result" class="screen">
  <div class="card">
    <img src="assets/stars.png" style="max-width:140px" onerror="this.style.display='none'">
    <h1>Adventure Complete!</h1>
    <div id="resultStars" class="result-stars"></div>
    <h2 id="finalScore"></h2>
    <p id="resultMsg"></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</section>

<audio id="correctSound" src="assets/freesound_community-claps-44774.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const questions = [
  {
    level:"Level 1: Length",
    q:"Which object is longer?",
    options:[{name:"Ladder",img:"ladder.png"},{name:"Pencil",img:"pencil.png"}],
    answer:"Ladder",
    hint:"The ladder is longer than the pencil."
  },
  {
    level:"Level 1: Length",
    q:"Which object is shorter?",
    options:[{name:"Pencil",img:"pencil.png"},{name:"Ladder",img:"ladder.png"}],
    answer:"Pencil",
    hint:"The pencil is shorter than the ladder."
  },
  {
    level:"Level 2: Weight",
    q:"Which object is heavier?",
    options:[{name:"Watermelon",img:"watermelon.png"},{name:"Feather",img:"feather.png"}],
    answer:"Watermelon",
    hint:"A watermelon is heavier than a feather."
  },
  {
    level:"Level 2: Weight",
    q:"Which object is lighter?",
    options:[{name:"Feather",img:"feather.png"},{name:"Watermelon",img:"watermelon.png"}],
    answer:"Feather",
    hint:"A feather is very light."
  },
  {
    level:"Level 2: Weight",
    q:"Which animal is heavier?",
    options:[{name:"Frog",img:"frog.png"},{name:"Turtle",img:"turtle.png"}],
    answer:"Frog",
    hint:"In this game picture, the frog is bigger and heavier."
  },
  {
    level:"Level 2: Weight",
    q:"Which animal is lighter?",
    options:[{name:"Turtle",img:"turtle.png"},{name:"Frog",img:"frog.png"}],
    answer:"Turtle",
    hint:"The turtle is smaller and lighter here."
  },
  {
    level:"Level 3: Capacity",
    q:"Which container can hold more water?",
    options:[{name:"Bucket",img:"bucket.png"},{name:"Cup",img:"cup.png"}],
    answer:"Bucket",
    hint:"A bucket can hold more water."
  },
  {
    level:"Level 3: Capacity",
    q:"Which container can hold less water?",
    options:[{name:"Cup",img:"cup.png"},{name:"Bucket",img:"bucket.png"}],
    answer:"Cup",
    hint:"A cup holds less water than a bucket."
  },
  {
    level:"Final Challenge",
    q:"Choose the object with more capacity.",
    options:[{name:"Bucket",img:"bucket.png"},{name:"Cup",img:"cup.png"}],
    answer:"Bucket",
    hint:"More capacity means it can hold more."
  },
  {
    level:"Final Challenge",
    q:"Choose the light object.",
    options:[{name:"Feather",img:"feather.png"},{name:"Watermelon",img:"watermelon.png"}],
    answer:"Feather",
    hint:"Light objects are easy to lift."
  }
];

let current = 0;
let score = 0;
let attempts = 2;
let timeLeft = 60;
let timer;

function startGame(){
  document.getElementById("start").classList.remove("active");
  document.getElementById("game").classList.add("active");
  loadQuestion();
}

function loadQuestion(){
  clearInterval(timer);
  attempts = 2;
  timeLeft = 60;

  document.getElementById("time").textContent = timeLeft;
  document.getElementById("attempts").textContent = attempts;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";

  const q = questions[current];
  document.getElementById("levelText").textContent = `${q.level} | Question ${current + 1} of ${questions.length}`;
  document.getElementById("question").textContent = q.q;

  const optionsBox = document.getElementById("options");
  optionsBox.innerHTML = "";

  const shuffled = [...q.options].sort(() => Math.random() - 0.5);

  shuffled.forEach(opt => {
    const card = document.createElement("div");
    card.className = "option";
    card.innerHTML = `
      <img src="assets/${opt.img}" alt="${opt.name}">
      <div class="option-name">${opt.name}</div>
    `;
    card.onclick = () => checkAnswer(opt.name, card);
    optionsBox.appendChild(card);
  });

  updateProgress();
  timer = setInterval(updateTimer, 1000);
}

function updateTimer(){
  timeLeft--;
  document.getElementById("time").textContent = timeLeft;
  if(timeLeft <= 0){
    clearInterval(timer);
    showCorrect("Time is up!");
  }
}

function checkAnswer(selected, card){
  const q = questions[current];

  if(selected === q.answer){
    clearInterval(timer);
    score++;
    document.getElementById("score").textContent = score;

    card.style.borderColor = "#34a853";
    card.style.background = "#d7ffd9";

    document.getElementById("feedback").textContent = "Correct! Great exploring!";
    document.getElementById("feedback").className = "feedback correct";

    playSound("correctSound");
    confetti();

    setTimeout(nextQuestion, 1200);
  } else {
    attempts--;
    document.getElementById("attempts").textContent = attempts;

    card.style.borderColor = "#d93025";
    card.style.background = "#ffe0e0";

    playSound("wrongSound");

    if(attempts > 0){
      document.getElementById("feedback").textContent = "Try again! Hint: " + q.hint;
      document.getElementById("feedback").className = "feedback wrong";
    } else {
      clearInterval(timer);
      showCorrect("Good try!");
    }
  }
}

function showCorrect(prefix){
  const q = questions[current];
  document.getElementById("feedback").textContent = `${prefix} Correct answer: ${q.answer}`;
  document.getElementById("feedback").className = "feedback wrong";
  setTimeout(nextQuestion, 1700);
}

function nextQuestion(){
  current++;
  if(current >= questions.length){
    endGame();
  } else {
    loadQuestion();
  }
}

function updateProgress(){
  document.getElementById("progress").style.width = ((current / questions.length) * 100) + "%";
}

function endGame(){
  clearInterval(timer);

  document.getElementById("game").classList.remove("active");
  document.getElementById("result").classList.add("active");

  document.getElementById("finalScore").textContent = `Your Score: ${score} / ${questions.length}`;

  const percent = score / questions.length;
  document.getElementById("resultStars").textContent = percent >= .85 ? "⭐⭐⭐" : percent >= .6 ? "⭐⭐" : "⭐";

  document.getElementById("resultMsg").textContent =
    percent >= .85 ? "Excellent! You are a Measurement Explorer!" :
    percent >= .6 ? "Good work! Practise length, weight and capacity once more." :
    "Nice try! Replay to strengthen measurement concepts.";
}

function restartGame(){
  clearInterval(timer);
  current = 0;
  score = 0;
  attempts = 2;
  document.getElementById("score").textContent = score;

  document.getElementById("result").classList.remove("active");
  document.getElementById("game").classList.add("active");

  loadQuestion();
}

function playSound(id){
  const sound = document.getElementById(id);
  if(sound){
    sound.currentTime = 0;
    sound.play().catch(()=>{});
  }
}

function confetti(){
  for(let i=0;i<25;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = ["#fbbc04","#34a853","#4285f4","#ea4335","#ff69b4"][Math.floor(Math.random()*5)];
    c.style.animationDelay = Math.random()*0.3 + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}
</script>
</body>
</html>
