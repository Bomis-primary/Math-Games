<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 1 Shapes & Objects Factory Match</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: url('factory-bg.png') no-repeat center center fixed, linear-gradient(135deg, #2c3e50, #000000);
    background-size: cover;
    color: white;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

/* INTRO SPLASH SCREEN LOGIC */
#splashScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ffffff; /* Clean blank white canvas */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    transition: opacity 0.5s ease-out;
}

#splashScreen img {
    max-width: 80%;
    max-height: 60%;
    object-fit: contain;
}

/* MAIN GAME CONTAINER (HIDDEN INITIALLY) */
#gameContainer {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

/* HEADER STYLE */
h1 {
    margin: 20px 0 5px 0;
    font-size: clamp(22px, 5vw, 36px);
    text-shadow: 0px 4px 8px rgba(0,0,0,0.8);
    background: rgba(0, 0, 0, 0.4);
    padding: 5px 15px;
    border-radius: 10px;
}

p {
    margin: 0 0 15px 0;
    font-size: clamp(14px, 3vw, 18px);
    color: #ffd166;
    font-weight: bold;
    text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 10px;
    border-radius: 8px;
}

/* GAMEBOARD GRID */
.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    justify-content: center;
    margin: 10px auto;
    padding: 15px;
    width: 90vw;
    max-width: 500px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 20px;
    backdrop-filter: blur(4px);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
}

@media(min-width: 480px) {
    .board {
        grid-template-columns: repeat(4, 1fr); /* Expands cleanly if screen space allows */
    }
}

/* CARD STATES */
.card {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
    user-select: none;
    box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    padding: 8px;
    box-sizing: border-box;
}

.card-img {
    width: 85%;
    height: 85%;
    object-fit: contain;
    pointer-events: none;
}

.card-text {
    font-size: clamp(11px, 2.5vw, 13px);
    margin-top: 4px;
    text-align: center;
    color: #fff;
    text-shadow: 0 1px 2px #000;
}

.normal {
    background: linear-gradient(135deg, #ffb703, #fb8500);
    border: 3px solid #fff;
}

.card-back-icon {
    width: 75%;
    height: 75%;
    object-fit: contain;
}

.flipped {
    background: linear-gradient(135deg, #ffffff, #e0f2f1);
    border: 3px solid #219ebc;
    transform: scale(1.02);
}

.flipped .card-text {
    color: #023e8a;
    text-shadow: none;
    font-weight: 800;
}

.matched {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    border: 3px solid #06d6a0;
    cursor: default;
    box-shadow: 0 0 15px rgba(6, 214, 160, 0.6);
    transform: scale(0.98);
}

.matched .card-text {
    color: #1b5e20;
    text-shadow: none;
    font-weight: 800;
}

/* PRIMARY BUTTONS */
.btn {
    padding: 12px 28px;
    margin: 15px 0;
    font-size: 16px;
    font-weight: bold;
    border: 2px solid #fff;
    border-radius: 50px;
    cursor: pointer;
    background: #023e8a;
    color: white;
    box-shadow: 0 4px 15px rgba(2, 62, 138, 0.6);
    transition: transform 0.1s, box-shadow 0.1s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(2, 62, 138, 0.8);
}

/* CELEBRATION EFFECT LAYER */
#fireworks {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
}

/* OVERLAY WIN CONTAINER */
#winScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 20, 30, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

#winScreen h1 {
    font-size: clamp(36px, 8vw, 64px);
    color: #ffd166;
    margin: 0 0 10px 0;
    animation: pop 0.6s ease-in-out infinite alternate;
    text-shadow: 0 0 20px rgba(255, 209, 102, 0.5);
}

#winScreen p {
    font-size: clamp(16px, 3.5vw, 24px);
    color: #fff;
    margin-bottom: 25px;
}

@keyframes pop {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}
</style>
</head>

<body>

<div id="splashScreen">
    <img src="assets/logo.png" alt="Logo">
</div>

<div id="gameContainer">
    <h1>🎯 Shape Sorting Factory</h1>
    <p>Match the Geometric Shapes with Real Objects!</p>

    <div id="board" class="board"></div>
    <button class="btn" onclick="startGame()">Restart Game</button>
</div>

<canvas id="fireworks"></canvas>

<div id="winScreen">
    <h1>FACTORY CLEAR! 🎉</h1>
    <p>Outstanding! You matched every single shape perfectly!</p>
    <button class="btn" style="background:#ff006e; box-shadow: 0 4px 15px rgba(255,0,110,0.6);" onclick="startGame()">Play Again 🔄</button>
</div>

<audio id="winMusic" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0b6b6b5c3.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<audio id="correctSound" preload="auto" src="assets/correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="assets/wrong.mp3"></audio>

<script>
const winMusic = document.getElementById("winMusic");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

[winMusic, correctSound, wrongSound].forEach(track => { track.volume = 0.5; });

// Mapping arrays utilizing the exact names from your uploaded repository list
const fullFactoryPool = [
    { id: 1, imgFile: "assets/circle.png", text: "Circle" },
    { id: 1, imgFile: "assets/coin.png", text: "Coin" },
    
    { id: 2, imgFile: "assets/triangle.png", text: "Triangle" },
    { id: 2, imgFile: "assets/pizza-slice.png", text: "Pizza" },
    
    { id: 3, imgFile: "assets/square.png", text: "Square" },
    { id: 3, imgFile: "assets/window.png", text: "Window" },
    
    { id: 4, imgFile: "assets/sphere.png", text: "Sphere" },
    { id: 4, imgFile: "assets/ball.png", text: "Ball" },
    
    { id: 5, imgFile: "assets/cone.png", text: "Cone" },
    { id: 5, imgFile: "assets/party-hat.png", text: "Party Hat" }
];

let cards = [];
let flipped = [];
let matched = [];
let lock = false;
let winTimerInterval = null; 

// Initial splash screen handler script
window.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
        const splash = document.getElementById("splashScreen");
        const gameUI = document.getElementById("gameContainer");
        
        splash.style.opacity = "0";
        setTimeout(() => {
            splash.style.display = "none";
            gameUI.style.display = "flex";
            startGame(); // Start the card load sequence once open
        }, 500);
    }, 5000); // 5000 milliseconds = 5 Seconds static display hold
});

function startGame(){
    if(winTimerInterval) {
        clearInterval(winTimerInterval);
        winTimerInterval = null;
    }
    
    document.getElementById("winScreen").style.display = "none";
    particles = []; 

    flipped = [];
    matched = [];
    lock = false;

    // Load copies cleanly
    cards = JSON.parse(JSON.stringify(fullFactoryPool));

    shuffle(cards);
    render();
}

function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function render(){
    let board = document.getElementById("board");
    board.innerHTML = "";

    cards.forEach((c, i)=>{
        let div = document.createElement("div");
        let isMatched = matched.includes(i);
        let isFlipped = flipped.includes(i);

        if(isMatched){
            div.className = "card matched";
            div.innerHTML = `<img class="card-img" src="${c.imgFile}" alt="${c.text}"><div class="card-text">${c.text}</div>`;
        }
        else if(isFlipped){
            div.className = "card flipped";
            div.innerHTML = `<img class="card-img" src="${c.imgFile}" alt="${c.text}"><div class="card-text">${c.text}</div>`;
        }
        else {
            div.className = "card normal";
            // Uses your custom shape-machine card-back design illustration
            div.innerHTML = `<img class="card-back-icon" src="assets/shape-machine.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                             <div style="display:none; font-size:32px;">❓</div>`;
        }

        div.onclick = () => flip(i);
        board.appendChild(div);
    });
}

function flip(i){
    if(lock) return;
    if(flipped.includes(i) || matched.includes(i)) return;

    flipped.push(i);
    render();

    if(flipped.length === 2){
        lock = true;
        let i1 = flipped[0];
        let i2 = flipped[1];

        if(cards[i1].id === cards[i2].id && i1 !== i2){
            matched.push(i1, i2);
            
            correctSound.currentTime = 0;
            correctSound.play().catch(e => console.log("Audio play error handled"));

            setTimeout(() => {
                flipped = [];
                lock = false;
                render();
                checkWin();
            }, 500);
        } else {
            wrongSound.currentTime = 0;
            wrongSound.play().catch(e => console.log("Audio play error handled"));

            setTimeout(() => {
                flipped = [];
                lock = false;
                render();
            }, 900);
        }
    }
}

function checkWin(){
    if(matched.length === cards.length){
        showWinScreen();
    }
}

function showWinScreen(){
    document.getElementById("winScreen").style.display = "flex";
    
    winMusic.currentTime = 0;
    winMusic.play().catch(e => console.log("Audio stream blocked by engine runtime"));

    burstFireworks();
    winTimerInterval = setInterval(burstFireworks, 700);
}

// EXPLOSIVE GRAPHICS ENGINE LOGIC
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function burstFireworks(){
    const originX = Math.random() * canvas.width;
    const originY = Math.random() * (canvas.height * 0.6) + (canvas.height * 0.1);
    const hue = Math.floor(Math.random() * 360);
    const colorString = `hsla(${hue}, 100%, 60%, `;

    for(let i = 0; i < 40; i++){
        let angle = Math.random() * 2 * Math.PI;
        let speed = Math.random() * 4 + 1.5;
        particles.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 2 + 1,
            alpha: 1,
            color: colorString,
            gravity: 0.04
        });
    }
}

function animate(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= 0.015;
    });

    particles = particles.filter(p => p.alpha > 0);

    particles.forEach(p => {
        ctx.fillStyle = `${p.color}${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
