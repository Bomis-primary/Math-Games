<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 1 Shapes Match Game</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: white;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    width: 100vw;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
}

/* HEADER STYLE */
h1 {
    margin: 20px 0 5px 0;
    font-size: clamp(24px, 5vw, 36px);
    text-shadow: 0px 4px 6px rgba(0,0,0,0.2);
}

p {
    margin: 0 0 15px 0;
    font-size: clamp(14px, 3vw, 18px);
    color: #ffffcc;
    font-weight: bold;
}

/* GAMEBOARD GRID */
.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    justify-content: center;
    margin: 10px auto;
    padding: 10px;
    width: 90vw;
    max-width: 450px;
}

@media(min-width: 400px) {
    .board {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* CARD STATES */
.card {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    cursor: pointer;
    font-weight: bold;
    font-size: clamp(12px, 3.2vw, 16px);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
    user-select: none;
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    word-break: break-word;
    padding: 6px;
    box-sizing: border-box;
}

.normal {
    background: #ffb703;
    color: #000;
    font-size: 28px;
}

.flipped {
    background: #219ebc;
    color: white;
    transform: scale(1.02);
}

.matched {
    background: #ff006e;
    color: white;
    cursor: default;
    box-shadow: 0 0 15px #ff006e;
    transform: scale(0.98);
}

/* INTERACTION BUTTONS */
.btn {
    padding: 12px 28px;
    margin: 15px 0;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: #023e8a;
    color: white;
    box-shadow: 0 4px 15px rgba(2, 62, 138, 0.4);
    transition: transform 0.1s, box-shadow 0.1s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(2, 62, 138, 0.6);
}

.btn:active {
    transform: scale(0.98);
}

/* CELEBRATION EFFECTS LAYER */
#fireworks {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
}

/* WIN OVERLAY SCREEN */
#winScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 25, 15, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

#winScreen h1 {
    font-size: clamp(36px, 8vw, 64px);
    color: #ffd166;
    margin: 0 0 10px 0;
    animation: pop 0.6s ease-in-out infinite alternate;
    text-shadow: 0 0 20px rgba(255, 209, 102, 0.5);
}

#winScreen p {
    font-size: clamp(16px, 3.5vw, 24px);
    color: #fff;
    margin-bottom: 25px;
}

@keyframes pop {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
}
</style>
</head>

<body>

<h1>📐 Shapes Matching Game</h1>
<p>Match the Shapes with their Correct Names!</p>

<div id="board" class="board"></div>
<button class="btn" onclick="startGame()">Restart Game</button>

<canvas id="fireworks"></canvas>

<div id="winScreen">
    <h1>SUPER JOB! 🎉</h1>
    <p>You know your shapes perfectly!</p>
    <button class="btn" style="background:#ff006e; box-shadow: 0 4px 15px rgba(255,0,110,0.4);" onclick="startGame()">Play Again 🔄</button>
</div>

<audio id="winMusic" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d0b6b6b5c3.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
<audio id="correctSound" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9bcd1a.mp3?filename=correct-2-46134.mp3"></audio>
<audio id="wrongSound" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_9c6d4d1c57.mp3?filename=error-2-126514.mp3"></audio>

<script>
const winMusic = document.getElementById("winMusic");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

// Balance volume for classroom environment
[winMusic, correctSound, wrongSound].forEach(track => {
    track.volume = 0.6;
});

// Primary Shape Pool covering all Learning Outcomes (2D, 3D, and Lines)
const shapePool = [
    { visual: "🔺", name: "Triangle" },
    { visual: "🟩", name: "Square" },
    { visual: "🟡", name: "Circle" },
    { visual: "⬡", name: "Hexagon" },
    { visual: "📦", name: "Cube (3D)" },
    { visual: "⚽", name: "Sphere (3D)" },
    { visual: "🍦", name: "Cone (3D)" },
    { visual: "🛢️", name: "Cylinder (3D)" },
    { visual: "➖", name: "Straight Line" },
    { visual: "〰️", name: "Curved Line" }
];

let cards = [];
let flipped = [];
let matched = [];
let lock = false;
let winTimerInterval = null; 

function startGame(){
    if(winTimerInterval) {
        clearInterval(winTimerInterval);
        winTimerInterval = null;
    }
    
    document.getElementById("winScreen").style.display = "none";
    particles = []; 

    cards = [];
    flipped = [];
    matched = [];
    lock = false;

    // Pick 6 random items from our pool to make 12 cards total
    let selectedShapes = [];
    let poolCopy = [...shapePool];
    
    while(selectedShapes.length < 6 && poolCopy.length > 0) {
        let randomIndex = Math.floor(Math.random() * poolCopy.length);
        selectedShapes.push(poolCopy.splice(randomIndex, 1)[0]);
    }

    // Split items into visual cards and name cards to create matching pairs
    selectedShapes.forEach(item => {
        cards.push({ value: item.visual, match: item.name });
        cards.push({ value: item.name, match: item.visual });
    });

    shuffle(cards);
    render();
}

function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function render(){
    let board = document.getElementById("board");
    board.innerHTML = "";

    cards.forEach((c, i)=>{
        let div = document.createElement("div");
        let isMatched = matched.includes(i);
        let isFlipped = flipped.includes(i);

        if(isMatched){
            div.className = "card matched";
            div.innerText = c.value;
        }
        else if(isFlipped){
            div.className = "card flipped";
            div.innerText = c.value;
        }
        else{
            div.className = "card normal";
            div.innerText = "❓";
        }

        div.onclick = () => flip(i);
        board.appendChild(div);
    });
}

function flip(i){
    if(lock) return;
    if(flipped.includes(i) || matched.includes(i)) return;

    flipped.push(i);
    render();

    if(flipped.length === 2){
        lock = true;
        let i1 = flipped[0];
        let i2 = flipped[1];

        // Check if item 1 matches the value of item 2
        if(cards[i1].match === cards[i2].value){
            matched.push(i1, i2);
            
            correctSound.currentTime = 0;
            correctSound.play().catch(e => console.log("Audio block handled"));

            setTimeout(()=>{
                flipped = [];
                lock = false;
                render();
                checkWin();
            }, 500);
        } else {
            wrongSound.currentTime = 0;
            wrongSound.play().catch(e => console.log("Audio block handled"));

            setTimeout(()=>{
                flipped = [];
                lock = false;
                render();
            }, 900);
        }
    }
}

function checkWin(){
    if(matched.length === cards.length){
        showWinScreen();
    }
}

function showWinScreen(){
    document.getElementById("winScreen").style.display = "flex";
    
    winMusic.currentTime = 0;
    winMusic.play().catch(e => console.log("Audio play blocked by device context"));

    burstFireworks();
    winTimerInterval = setInterval(burstFireworks, 700);
}

// PARTICLE CELEBRATION ENGINE
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

function burstFireworks(){
    const originX = Math.random() * canvas.width;
    const originY = Math.random() * (canvas.height * 0.6) + (canvas.height * 0.1);
    const hue = Math.floor(Math.random() * 360);
    const colorString = `hsla(${hue}, 100%, 60%, `;

    for(let i = 0; i < 40; i++){
        let angle = Math.random() * 2 * Math.PI;
        let speed = Math.random() * 4 + 1.5;
        particles.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: Math.random() * 2 + 1,
            alpha: 1,
            color: colorString,
            gravity: 0.04
        });
    }
}

function animate(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= 0.015;
    });

    particles = particles.filter(p => p.alpha > 0);

    particles.forEach(p => {
        ctx.fillStyle = `${p.color}${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}
animate();

// INITIAL START
startGame();
</script>

</body>
</html>
