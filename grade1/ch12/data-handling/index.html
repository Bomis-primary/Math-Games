<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milo's Toy Party</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: Arial, sans-serif; overflow: hidden; }
  
  /* General screen */
  .screen { display: none; height: 100vh; width: 100vw; justify-content: center; align-items: center; flex-direction: column; }
  .screen.active { display: flex; }

  /* Splash screen */
  #splash { background: #ffffff; }
  .logo { max-width: 250px; animation: pulse 2s infinite ease-in-out; }
  @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.05); } }

  /* Start screen */
  #start { background: #ffffff; text-align: center; }
  #start button { padding: 16px 36px; font-size: 22px; font-weight: bold; border-radius: 12px; border:none; background:#ffbf00; cursor:pointer; margin-top:20px; }

  /* Game screen */
  #game { position: relative; background: url('/mnt/data/1a0e5a8d-e751-4262-a323-cee05ae5d4cb.png') center/cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100vh; }

  /* Game HUD */
  .topbar { width: 100%; display: flex; justify-content: space-around; margin-bottom: 10px; font-weight: bold; font-size: 20px; color: #fff; text-shadow: 1px 1px 2px #000; }
</style>
</head>
<body>

<!-- Splash screen -->
<section id="splash" class="screen active">
  <img src="assets/logo.png" class="logo" alt="Innovine Logo">
</section>

<!-- Start screen -->
<section id="start" class="screen">
  <h1>Milo's Toy Party</h1>
  <button onclick="startGame()">Start Game 🟢</button>
</section>

<!-- Game screen -->
<section id="game" class="screen">
  <div class="topbar">
    <div>Score: <span id="score">0</span></div>
    <div>Time: <span id="time">60</span>s</div>
  </div>
  <!-- Toys and interactive elements will go here -->
</section>

<script>
  // Show splash screen for 5 seconds
  window.onload = function() {
    setTimeout(() => {
      document.getElementById('splash').classList.remove('active');
      document.getElementById('start').classList.add('active');
    }, 5000);
  }

  function startGame() {
    document.getElementById('start').classList.remove('active');
    document.getElementById('game').classList.add('active');
    // Initialize game logic here
    alert('Game starts now!');
  }
</script>

</body>
</html>
