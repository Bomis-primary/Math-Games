<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Sam's Blueprint Tracker</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    background: linear-gradient(to bottom, #e3f2fd 0%, #bbdefb 100%);
    color: #333;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
}

#gameContainer {
    width: 100%;
    max-width: 900px;
    background: #ffffff;
    border-radius: 24px;
    padding: 25px;
    box-shadow: 0 12px 24px rgba(0,0,0,0.1);
    box-sizing: border-box;
}

/* Character Dialogue Box */
.character-box {
    background: #ffffff;
    border: 4px solid #ffb74d;
    border-radius: 20px;
    padding: 15px;
    margin: 15px 0 25px 0;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    text-align: left;
}

.char-avatar {
    font-size: 44px;
    background: #fff3e0;
    border-radius: 50%;
    padding: 8px;
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #ffa726;
    flex-shrink: 0;
}

.char-text {
    font-size: 16px;
    font-weight: bold;
    color: #4e342e;
    line-height: 1.4;
    margin: 0;
}

.level-badge {
    background: #ec407a;
    color: white;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 10px;
}

h1 {
    margin: 5px 0;
    font-size: clamp(24px, 4vw, 32px);
    color: #0d47a1;
}

/* Scrambled Pile Container */
.scrambled-inventory-box {
    background: #f5f5f5;
    border: 3px dashed #b0bec5;
    border-radius: 16px;
    padding: 20px;
    min-height: 120px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.scrambled-item {
    cursor: pointer;
    background: #ffffff;
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    transition: transform 0.2s, box-shadow 0.2s;
}
.scrambled-item:hover {
    transform: scale(1.15);
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
}
.scrambled-item img {
    width: 50px;
    height: 50px;
    object-fit: contain;
}

/* Tracking Pictograph Grid */
.chart-container {
    width: 100%;
    overflow-x: auto;
    margin-bottom: 25px;
    border: 3px solid #b39ddb;
    border-radius: 16px;
    background: #fff;
}

.chart-row {
    display: flex;
    align-items: center;
    border-bottom: 3px solid #b39ddb;
    min-width: 800px;
}
.chart-row:last-child {
    border-bottom: none;
}

.category-lead-cell {
    width: 100px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3e5f5;
    border-right: 3px solid #b39ddb;
    flex-shrink: 0;
}
.category-lead-cell img {
    width: 55px;
    height: 55px;
    object-fit: contain;
}

.grid-track {
    display: flex;
    flex-grow: 1;
    background-image: linear-gradient(to right, #b39ddb 2px, transparent 2px);
    background-size: 70px 100%;
    min-height: 90px;
    align-items: center;
    padding-left: 2px;
}

.grid-cell-slot {
    width: 70px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.grid-cell-slot img {
    width: 50px;
    height: 50px;
    object-fit: contain;
}

.input-answer-zone {
    width: 130px;
    min-height: 90px;
    background: #fff9c4;
    border-left: 3px solid #b39ddb;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    gap: 5px;
}

.count-input {
    width: 65px;
    height: 45px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    border: 2px solid #fbc02d;
    border-radius: 8px;
    color: #5d4037;
}
.count-input:disabled {
    background: #e8f5e9;
    border-color: #4caf50;
    color: #2e7d32;
}

.status-indicator {
    font-size: 24px;
    width: 30px;
}

.btn {
    padding: 14px 45px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: #2e7d32;
    color: white;
    box-shadow: 0 6px 14px rgba(46, 125, 50, 0.3);
    transition: transform 0.1s;
    margin-top: 10px;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { background: #b0bec5; cursor: not-allowed; box-shadow: none; }

#fireworks { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }

@keyframes dropIn {
    0% { transform: translateY(-30px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-5px); }
    40%, 80% { transform: translateX(5px); }
}
.error-shake { animation: shake 0.4s ease-in-out; }
</style>
</head>
<body>

<div id="gameContainer">
    <div class="level-badge">THINKING SKILLS HOTS</div>
    <h1>Sam's Workshop Grid Alignment</h1>

    <div class="character-box">
        <div class="char-avatar">🤖</div>
        <div>
            <p class="char-text" id="dialogueText">
                Greetings, data assistant! My inventory box spilled! Click each item to arrange them neatly into rows on our blueprint chart, then count them!
            </p>
        </div>
    </div>

    <div class="scrambled-inventory-box" id="scrambledPile"></div>

    <div class="chart-container">
        <div class="chart-row" id="row-ball">
            <div class="category-lead-cell"><img src="assets/ball.png" alt="Ball"></div>
            <div class="grid-track" id="track-ball"></div>
            <div class="input-answer-zone">
                <input type="number" id="input-ball" class="count-input" min="0" placeholder="?" disabled>
                <span id="status-ball" class="status-indicator"></span>
            </div>
        </div>

        <div class="chart-row" id="row-bear">
            <div class="category-lead-cell"><img src="assets/bear.png" alt="Bear"></div>
            <div class="grid-track" id="track-bear"></div>
            <div class="input-answer-zone">
                <input type="number" id="input-bear" class="count-input" min="0" placeholder="?" disabled>
                <span id="status-bear" class="status-indicator"></span>
            </div>
        </div>

        <div class="chart-row" id="row-car">
            <div class="category-lead-cell"><img src="assets/car.png" alt="Car"></div>
            <div class="grid-track" id="track-car"></div>
            <div class="input-answer-zone">
                <input type="number" id="input-car" class="count-input" min="0" placeholder="?" disabled>
                <span id="status-car" class="status-indicator"></span>
            </div>
        </div>
    </div>

    <button id="verifyBtn" class="btn" onclick="verifyCalculations()" disabled>Verify Grid Data 🎯</button>
</div>

<canvas id="fireworks"></canvas>

<audio id="clickSound" preload="auto" src="assets/click.mp3"></audio>
<audio id="correctSound" preload="auto" src="assets/correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="assets/wrong.mp3"></audio>

<script>
const targetsCount = { ball: 0, bear: 0, car: 0 };
let currentSortedTotal = 0;
let grandTotalPopulation = 0;

function generateScrambledDeck() {
    // Generate dynamic item quantities between 3 and 7 to fit nicely in rows
    targetsCount.ball = Math.floor(Math.random() * 5) + 3;
    targetsCount.bear = Math.floor(Math.random() * 5) + 3;
    targetsCount.car = Math.floor(Math.random() * 5) + 3;
    
    grandTotalPopulation = targetsCount.ball + targetsCount.bear + targetsCount.car;

    let totalPool = [];
    for (let i = 0; i < targetsCount.ball; i++) totalPool.push({ type: 'ball', src: 'assets/ball.png' });
    for (let i = 0; i < targetsCount.bear; i++) totalPool.push({ type: 'bear', src: 'assets/bear.png' });
    for (let i = 0; i < targetsCount.car; i++) totalPool.push({ type: 'car', src: 'assets/car.png' });

    // Scramble the array placement
    totalPool.sort(() => Math.random() - 0.5);

    const pile = document.getElementById("scrambledPile");
    pile.innerHTML = "";

    totalPool.forEach((item, index) => {
        const element = document.createElement("div");
        element.className = "scrambled-item";
        element.id = `inv-${index}`;
        element.innerHTML = `<img src="${item.src}" alt="${item.type}">`;
        element.onclick = () => sendToGridTrack(index, item.type, item.src);
        pile.appendChild(element);
    });
}

function sendToGridTrack(index, type, src) {
    const activeItem = document.getElementById(`inv-${index}`);
    if (!activeItem) return;

    // Optional audio handling feedback loop
    document.getElementById("clickSound").currentTime = 0;
    document.getElementById("clickSound").play().catch(()=>{});

    // Drop clean thumbnail asset into the row
    const targetTrack = document.getElementById(`track-${type}`);
    const cellSlot = document.createElement("div");
    cellSlot.className = "grid-cell-slot";
    cellSlot.innerHTML = `<img src="${src}" alt="${type}">`;
    targetTrack.appendChild(cellSlot);

    activeItem.remove();
    currentSortedTotal++;

    // Switch step context when whole canvas is sorted row-wise
    if (currentSortedTotal === grandTotalPopulation) {
        document.getElementById("input-ball").disabled = false;
        document.getElementById("input-bear").disabled = false;
        document.getElementById("input-car").disabled = false;
        document.getElementById("verifyBtn").disabled = false;
        document.getElementById("dialogueText").innerHTML = "Splendid arrangement! Now count up each row, write the total numbers in the gold boxes, and click Verify! 📝";
    }
}

function verifyCalculations() {
    const valBall = parseInt(document.getElementById("input-ball").value);
    const valBear = parseInt(document.getElementById("input-bear").value);
    const valCar = parseInt(document.getElementById("input-car").value);

    let rowBallCorrect = (valBall === targetsCount.ball);
    let rowBearCorrect = (valBear === targetsCount.bear);
    let rowCarCorrect = (valCar === targetsCount.car);

    document.getElementById("status-ball").innerText = rowBallCorrect ? "✅" : "❌";
    document.getElementById("status-bear").innerText = rowBearCorrect ? "✅" : "❌";
    document.getElementById("status-car").innerText = rowCarCorrect ? "✅" : "❌";

    if (rowBallCorrect && rowBearCorrect && rowCarCorrect) {
        document.getElementById("correctSound").play().catch(()=>{});
        document.getElementById("input-ball").disabled = true;
        document.getElementById("input-bear").disabled = true;
        document.getElementById("input-car").disabled = true;
        document.getElementById("verifyBtn").disabled = true;
        
        document.getElementById("dialogueText").innerHTML = "Mission Successful! 🏆 You correctly sorted and analyzed the whole workshop ledger. Sam is proud of you!";
        triggerWinCelebration();
    } else {
        document.getElementById("wrongSound").play().catch(()=>{});
        const container = document.getElementById("gameContainer");
        container.classList.add("error-shake");
        setTimeout(() => container.classList.remove("error-shake"), 400);
    }
}

/* Confetti Pipeline */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

function triggerWinCelebration() {
    let duration = 3000;
    let end = Date.now() + duration;
    (function frame() {
        burstParticles(Math.random() * canvas.width, Math.random() * canvas.height * 0.4, 8);
        if (Date.now() < end) requestAnimationFrame(frame);
    }());
}

function burstParticles(x, y, count) {
    for(let i = 0; i < count; i++){
        let angle = Math.random() * 2 * Math.PI;
        let speed = Math.random() * 4 + 2;
        particles.push({ 
            x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, 
            radius: Math.random() * 3 + 2, alpha: 1, gravity: 0.05,
            color: `hsla(${Math.random() * 360}, 100%, 60%, `
        });
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.alpha -= 0.015; });
    particles = particles.filter(p => p.alpha > 0);
    particles.forEach(p => {
        ctx.fillStyle = `${p.color}${p.alpha})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(animate);
}
animate();

window.onload = generateScrambledDeck;
</script>
</body>
</html>
