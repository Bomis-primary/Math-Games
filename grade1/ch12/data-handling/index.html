<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Milo's Toy Party</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow-x:hidden;
background:#f4f4f4;
}

#game{
width:100vw;
min-height:100vh;
background:url("assets/bg.png") center center/cover no-repeat;
position:relative;
}

/* ---------- COMMON ---------- */

.screen{
display:none;
min-height:100vh;
padding:20px;
}

.active{
display:flex;
}

.center{
justify-content:center;
align-items:center;
flex-direction:column;
}

h1{
font-size:clamp(2rem,5vw,4rem);
color:#ff6b00;
text-align:center;
margin-bottom:15px;
}

h2{
font-size:clamp(1.5rem,4vw,3rem);
text-align:center;
margin-bottom:15px;
}

button{
padding:15px 30px;
font-size:1.2rem;
border:none;
border-radius:12px;
cursor:pointer;
background:#ffd93d;
font-weight:bold;
margin-top:20px;
}

button:hover{
transform:scale(1.05);
}

/* ---------- SCORE ---------- */

#scoreBoard{
position:fixed;
top:10px;
right:10px;
background:white;
padding:10px 20px;
border-radius:12px;
font-size:1.2rem;
font-weight:bold;
z-index:999;
}

/* ---------- WELCOME ---------- */

#monkey{
width:min(250px,60vw);
margin-bottom:20px;
}

.storyBox{
max-width:700px;
background:rgba(255,255,255,.9);
padding:25px;
border-radius:20px;
text-align:center;
font-size:1.2rem;
line-height:1.6;
}

/* ---------- SORTING ---------- */

#sortingScreen{
flex-direction:column;
}

#toyBox{
width:100%;
min-height:220px;
background:rgba(255,255,255,.9);
border:4px dashed #555;
border-radius:20px;

display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:center;
gap:15px;
padding:15px;
}

.toy{
width:90px;
height:90px;
object-fit:contain;
cursor:pointer;
}

#basketContainer{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:30px;
}

.basketWrap{
text-align:center;
position:relative;
}

.basketLabel{
font-size:1.2rem;
font-weight:bold;
margin-bottom:8px;
background:white;
padding:5px 10px;
border-radius:8px;
display:inline-block;
}

.basket{
width:min(220px,35vw);
height:min(220px,35vw);
background:url("assets/basket.png") center center/contain no-repeat;
}

.dropZone{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:75%;
height:100px;
}

/* ---------- COUNT ---------- */

#countCards{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:white;
padding:20px;
border-radius:20px;
width:220px;
text-align:center;
}

.card img{
width:100px;
height:100px;
object-fit:contain;
}

.countValue{
font-size:3rem;
font-weight:bold;
}

/* ---------- PICTOGRAPH ---------- */

#pictographBoard{
width:min(900px,95%);
background:white;
padding:20px;
border-radius:20px;
}

.graphRow{
display:flex;
align-items:center;
flex-wrap:wrap;
margin-bottom:20px;
}

.graphLabel{
width:140px;
font-weight:bold;
font-size:1.2rem;
}

.graphIcons{
display:flex;
flex-wrap:wrap;
gap:6px;
}

.graphIcons img{
width:45px;
height:45px;
}

/* ---------- QUESTIONS ---------- */

#questionBox{
width:min(800px,95%);
background:white;
padding:25px;
border-radius:20px;
text-align:center;
}

#questionText{
font-size:1.6rem;
margin-bottom:20px;
}

.option{
background:#d8f0ff;
padding:15px;
margin:10px auto;
border-radius:10px;
cursor:pointer;
font-size:1.2rem;
max-width:400px;
}

.option:hover{
background:#bce7ff;
}

/* ---------- CHALLENGE ---------- */

.challengeCard{
background:white;
padding:25px;
border-radius:20px;
width:min(800px,95%);
text-align:center;
}

/* ---------- CELEBRATION ---------- */

#stars{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
}

.star{
width:80px;
}

.badge{
font-size:2rem;
font-weight:bold;
color:#ff8800;
margin-top:20px;
}

/* ---------- MOBILE ---------- */

@media(max-width:768px){

.toy{
width:70px;
height:70px;
}

.graphLabel{
width:100%;
margin-bottom:8px;
}

#questionText{
font-size:1.3rem;
}

.option{
font-size:1rem;
}

}

</style>
</head>

<body>

<div id="scoreBoard">
⭐ <span id="score">0</span>
</div>

<div id="game">

<!-- WELCOME -->

<div id="welcomeScreen" class="screen active center">

<img src="assets/monkey.png" id="monkey">

<h1>Milo's Toy Party</h1>

<div class="storyBox">
Milo is planning a toy party for his friends.
The toys are all mixed up!
Help Milo sort, count and organize the toys.
</div>

<button id="startBtn">
Start Game
</button>

</div>

<!-- SORTING -->

<div id="sortingScreen" class="screen">

<h2>Sort the Toys</h2>

<div id="toyBox"></div>

<div id="basketContainer">

<div class="basketWrap">
<div class="basketLabel">Bears</div>
<div class="basket"></div>
<div id="bearZone" class="dropZone"></div>
</div>

<div class="basketWrap">
<div class="basketLabel">Cars</div>
<div class="basket"></div>
<div id="carZone" class="dropZone"></div>
</div>

<div class="basketWrap">
<div class="basketLabel">Balls</div>
<div class="basket"></div>
<div id="ballZone" class="dropZone"></div>
</div>

</div>

</div>

<!-- COUNT -->

<div id="countScreen" class="screen center">

<h1>Count the Toys</h1>

<div id="countCards">

<div class="card">
<img src="assets/bear.png">
<div id="bearCount" class="countValue">0</div>
</div>

<div class="card">
<img src="assets/car.png">
<div id="carCount" class="countValue">0</div>
</div>

<div class="card">
<img src="assets/ball.png">
<div id="ballCount" class="countValue">0</div>
</div>

</div>

<button id="countNextBtn">
Next
</button>

</div>

<!-- PICTOGRAPH -->

<div id="pictographScreen" class="screen center">

<h1>Pictograph</h1>

<div id="pictographBoard">

<div class="graphRow">
<div class="graphLabel">Bears</div>
<div id="bearGraph" class="graphIcons"></div>
</div>

<div class="graphRow">
<div class="graphLabel">Cars</div>
<div id="carGraph" class="graphIcons"></div>
</div>

<div class="graphRow">
<div class="graphLabel">Balls</div>
<div id="ballGraph" class="graphIcons"></div>
</div>

</div>

<button id="graphNextBtn">
Next
</button>

</div>

<!-- QUESTIONS -->

<div id="questionScreen" class="screen center">

<div id="questionBox">

<div id="questionText">
Question
</div>

<div id="optionsContainer"></div>

</div>

</div>

<!-- CHALLENGE -->

<div id="challengeScreen" class="screen center">

<div class="challengeCard">

<h1>Final Challenge</h1>

<p id="challengeQuestion"></p>

<div id="challengeOptions"></div>

</div>

</div>

<!-- CELEBRATION -->

<div id="celebrationScreen" class="screen center">

<h1>Great Job!</h1>

<div id="stars">

<img src="assets/star.png" class="star">
<img src="assets/star.png" class="star">
<img src="assets/star.png" class="star">

</div>

<div class="badge">
Party Helper Award
</div>

<button onclick="location.reload()">
Play Again
</button>

</div>

</div>

<script>

let score = 0;

let bearTotal = 0;
let carTotal = 0;
let ballTotal = 0;

let sortedBears = 0;
let sortedCars = 0;
let sortedBalls = 0;

let questions = [];
let currentQuestion = 0;

function generateCounts(){

do{

bearTotal=Math.floor(Math.random()*8)+1;
carTotal=Math.floor(Math.random()*8)+1;
ballTotal=Math.floor(Math.random()*8)+1;

}
while(
bearTotal===carTotal ||
bearTotal===ballTotal ||
carTotal===ballTotal
);

}

function showScreen(id){

document
.querySelectorAll(".screen")
.forEach(screen=>{
screen.classList.remove("active");
});

document
.getElementById(id)
.classList.add("active");

}

function updateScore(){

document
.getElementById("score")
.textContent=score;

}

generateCounts();

document
.getElementById("startBtn")
.addEventListener("click",()=>{

showScreen("sortingScreen");

});

function createToy(type){

const toy=document.createElement("img");

toy.classList.add("toy");

toy.dataset.type=type;

if(type==="bear"){
toy.src="assets/bear.png";
}

if(type==="car"){
toy.src="assets/car.png";
}

if(type==="ball"){
toy.src="assets/ball.png";
}

return toy;

}
  /* ------------------ */
/* CREATE ALL TOYS */
/* ------------------ */

function loadToys(){

const toyBox =
document.getElementById("toyBox");

toyBox.innerHTML="";

for(let i=0;i<bearTotal;i++){

const toy=createToy("bear");

attachToyEvents(toy);

toyBox.appendChild(toy);

}

for(let i=0;i<carTotal;i++){

const toy=createToy("car");

attachToyEvents(toy);

toyBox.appendChild(toy);

}

for(let i=0;i<ballTotal;i++){

const toy=createToy("ball");

attachToyEvents(toy);

toyBox.appendChild(toy);

}

shuffleToys();

}

/* ------------------ */
/* SHUFFLE */
/* ------------------ */

function shuffleToys(){

const toyBox=
document.getElementById("toyBox");

const toys=
Array.from(toyBox.children);

for(let i=toys.length-1;i>0;i--){

const j=
Math.floor(Math.random()*(i+1));

[toys[i],toys[j]]=
[toys[j],toys[i]];

}

toyBox.innerHTML="";

toys.forEach(toy=>{
toyBox.appendChild(toy);
});

}

/* ------------------ */
/* TOUCH + DRAG */
/* ------------------ */

let selectedToy=null;

/* ------------------ */
/* ATTACH EVENTS */
/* ------------------ */

function attachToyEvents(toy){

/* DESKTOP */

toy.draggable=true;

toy.addEventListener(
"dragstart",
e=>{

selectedToy=toy;

}
);

/* TABLET / MOBILE */

toy.addEventListener(
"click",
()=>{

selectedToy=toy;

highlightSelectedToy();

}
);

}

/* ------------------ */
/* HIGHLIGHT */
/* ------------------ */

function highlightSelectedToy(){

document
.querySelectorAll(".toy")
.forEach(t=>{

t.style.outline="none";

});

if(selectedToy){

selectedToy.style.outline=
"4px solid orange";

selectedToy.style.borderRadius=
"10px";

}

}

/* ------------------ */
/* DROP ZONES */
/* ------------------ */

const bearZone=
document.getElementById("bearZone");

const carZone=
document.getElementById("carZone");

const ballZone=
document.getElementById("ballZone");

/* ------------------ */
/* DESKTOP DROP */
/* ------------------ */

[
bearZone,
carZone,
ballZone

].forEach(zone=>{

zone.addEventListener(
"dragover",
e=>{

e.preventDefault();

}
);

zone.addEventListener(
"drop",
e=>{

e.preventDefault();

if(!selectedToy)
return;

handleDrop(
selectedToy,
zone.id
);

}
);

});

/* ------------------ */
/* TAP TO SORT */
/* ------------------ */

bearZone.addEventListener(
"click",
()=>{

if(selectedToy){

handleDrop(
selectedToy,
"bearZone"
);

}

}
);

carZone.addEventListener(
"click",
()=>{

if(selectedToy){

handleDrop(
selectedToy,
"carZone"
);

}

}
);

ballZone.addEventListener(
"click",
()=>{

if(selectedToy){

handleDrop(
selectedToy,
"ballZone"
);

}

}
);

/* ------------------ */
/* SORT LOGIC */
/* ------------------ */

function handleDrop(
toy,
zoneId
){

const type=
toy.dataset.type;

let correct=false;

if(
type==="bear" &&
zoneId==="bearZone"
){

correct=true;

sortedBears++;

}

if(
type==="car" &&
zoneId==="carZone"
){

correct=true;

sortedCars++;

}

if(
type==="ball" &&
zoneId==="ballZone"
){

correct=true;

sortedBalls++;

}

if(correct){

score++;

updateScore();

toy.remove();

selectedToy=null;

checkSortingComplete();

}else{

toy.style.transform=
"rotate(-8deg)";

setTimeout(()=>{

toy.style.transform=
"rotate(0deg)";

},250);

}

}

/* ------------------ */
/* CHECK COMPLETE */
/* ------------------ */

function checkSortingComplete(){

const totalSorted=

sortedBears+
sortedCars+
sortedBalls;

const totalNeeded=

bearTotal+
carTotal+
ballTotal;

if(
totalSorted===
totalNeeded
){

setTimeout(()=>{

showCountScreen();

},800);

}

}

/* ------------------ */
/* COUNT SCREEN */
/* ------------------ */

function showCountScreen(){

document
.getElementById("bearCount")
.textContent=
bearTotal;

document
.getElementById("carCount")
.textContent=
carTotal;

document
.getElementById("ballCount")
.textContent=
ballTotal;

showScreen(
"countScreen"
);

}

/* ------------------ */
/* START GAME */
/* ------------------ */

loadToys();
  /* ------------------ */
/* COUNT NEXT */
/* ------------------ */

document
.getElementById("countNextBtn")
.addEventListener(
"click",
()=>{

buildPictograph();

showScreen(
"pictographScreen"
);

}
);

/* ------------------ */
/* BUILD PICTOGRAPH */
/* ------------------ */

function buildPictograph(){

const bearGraph=
document.getElementById(
"bearGraph"
);

const carGraph=
document.getElementById(
"carGraph"
);

const ballGraph=
document.getElementById(
"ballGraph"
);

bearGraph.innerHTML="";
carGraph.innerHTML="";
ballGraph.innerHTML="";

/* Bears */

for(
let i=0;
i<bearTotal;
i++
){

const img=
document.createElement(
"img"
);

img.src=
"assets/bear.png";

bearGraph
.appendChild(img);

}

/* Cars */

for(
let i=0;
i<carTotal;
i++
){

const img=
document.createElement(
"img"
);

img.src=
"assets/car.png";

carGraph
.appendChild(img);

}

/* Balls */

for(
let i=0;
i<ballTotal;
i++
){

const img=
document.createElement(
"img"
);

img.src=
"assets/ball.png";

ballGraph
.appendChild(img);

}

generateQuestions();

}

/* ------------------ */
/* GRAPH NEXT */
/* ------------------ */

document
.getElementById("graphNextBtn")
.addEventListener(
"click",
()=>{

currentQuestion=0;

showQuestion();

showScreen(
"questionScreen"
);

}
);

/* ------------------ */
/* HELPERS */
/* ------------------ */

function getMostToy(){

const data=[
{
name:"Bears",
value:bearTotal
},
{
name:"Cars",
value:carTotal
},
{
name:"Balls",
value:ballTotal
}
];

data.sort(
(a,b)=>
b.value-a.value
);

return data[0].name;

}

function getLeastToy(){

const data=[
{
name:"Bears",
value:bearTotal
},
{
name:"Cars",
value:carTotal
},
{
name:"Balls",
value:ballTotal
}
];

data.sort(
(a,b)=>
a.value-b.value
);

return data[0].name;

}

/* ------------------ */
/* QUESTIONS */
/* ------------------ */

function generateQuestions(){

questions=[];

questions.push({

question:
"How many Bears are there?",

correct:
String(
bearTotal
),

options:[
String(
bearTotal
),
String(
bearTotal+1
),
String(
Math.max(
0,
bearTotal-1
)
)
]

});

questions.push({

question:
"How many Cars are there?",

correct:
String(
carTotal
),

options:[
String(
carTotal
),
String(
carTotal+1
),
String(
Math.max(
0,
carTotal-1
)
)
]

});

questions.push({

question:
"How many Balls are there?",

correct:
String(
ballTotal
),

options:[
String(
ballTotal
),
String(
ballTotal+1
),
String(
Math.max(
0,
ballTotal-1
)
)
]

});

questions.push({

question:
"Which toy has the MOST?",

correct:
getMostToy(),

options:[
"Bears",
"Cars",
"Balls"
]

});

questions.push({

question:
"Which toy has the LEAST?",

correct:
getLeastToy(),

options:[
"Bears",
"Cars",
"Balls"
]

});

/* shuffle questions */

questions.sort(
()=>Math.random()-0.5
);

}

/* ------------------ */
/* SHOW QUESTION */
/* ------------------ */

function showQuestion(){

const q=
questions[
currentQuestion
];

document
.getElementById(
"questionText"
)
.textContent=
q.question;

const container=
document
.getElementById(
"optionsContainer"
);

container.innerHTML="";

let options=
[...q.options];

options.sort(
()=>Math.random()-0.5
);

options.forEach(
option=>{

const div=
document
.createElement(
"div"
);

div.className=
"option";

div.textContent=
option;

div.addEventListener(
"click",
()=>{

checkAnswer(
option
);

}
);

container
.appendChild(
div
);

}
);

}
  /* ------------------ */
/* CHECK ANSWER */
/* ------------------ */

function checkAnswer(
selectedAnswer
){

const current =
questions[
currentQuestion
];

if(
selectedAnswer ===
current.correct
){

score += 5;

updateScore();

}

currentQuestion++;

if(
currentQuestion <
questions.length
){

showQuestion();

}else{

showChallenge();

}

}

/* ------------------ */
/* FINAL CHALLENGE */
/* ------------------ */

function showChallenge(){

showScreen(
"challengeScreen"
);

const challengeQuestion=
document.getElementById(
"challengeQuestion"
);

const challengeOptions=
document.getElementById(
"challengeOptions"
);

challengeOptions.innerHTML="";

const totalToys=
bearTotal+
carTotal+
ballTotal;

challengeQuestion.innerHTML=
`How many toys are there altogether?`;

let options=[
totalToys,
totalToys+1,
totalToys+2
];

options.sort(
()=>Math.random()-0.5
);

options.forEach(
option=>{

const btn=
document.createElement(
"div"
);

btn.className=
"option";

btn.textContent=
option;

btn.addEventListener(
"click",
()=>{

checkChallenge(
option,
totalToys
);

}
);

challengeOptions
.appendChild(
btn
);

}
);

}

/* ------------------ */
/* CHALLENGE CHECK */
/* ------------------ */

function checkChallenge(
answer,
correct
){

if(
answer===correct
){

score+=10;

updateScore();

}

showCelebration();

}

/* ------------------ */
/* CELEBRATION */
/* ------------------ */

function showCelebration(){

showScreen(
"celebrationScreen"
);

const badge=
document.querySelector(
".badge"
);

if(score>=35){

badge.textContent=
"Toy Party Champion!";

}
else if(score>=25){

badge.textContent=
"Toy Party Helper!";

}
else{

badge.textContent=
"Toy Party Friend!";

}

}

/* ------------------ */
/* INITIAL SETUP */
/* ------------------ */

updateScore();

</script>

</body>
</html>
