<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milo's Toy Party</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; overflow: hidden; }

  .screen { display: none; height: 100vh; width: 100vw; justify-content: center; align-items: center; flex-direction: column; }
  .screen.active { display: flex; }

  /* Splash screen */
  #splash { background: #ffffff; }
  .logo { max-width: 250px; }

  /* Start screen with uploaded background */
  #start {
    background: url('/mnt/data/ac01eba0-2313-4c93-8e1c-7d42c3c30614.png') center/cover no-repeat;
    width: 100%;
    height: 100%;
    position: relative;
    text-align: center;
  }
  #start h1 {
    font-size: 3em;
    margin-top: 50px;
    color: #fff;
    text-shadow: 2px 2px 4px #000;
  }
  #start button {
    padding: 16px 36px;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    background: #ffbf00;
    cursor: pointer;
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Game screen */
  #game {
    display: none;
    height: 100vh;
    width: 100vw;
    background: #e0f7fa;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    position: relative;
  }
</style>
</head>
<body>

<!-- Splash screen -->
<section id="splash" class="screen active">
  <img src="assets/logo.png" class="logo" alt="Innovine Logo">
</section>

<!-- Start screen -->
<section id="start" class="screen">
  <h1>Milo's Toy Party</h1>
  <button id="startBtn">Start Game 🟢</button>
</section>

<!-- Game screen -->
<section id="game" class="screen">
  <h2>Game Started!</h2>
</section>

<script>
window.onload = function() {
  // Splash screen for 5 seconds
  setTimeout(() => {
    document.getElementById("splash").classList.remove("active");
    document.getElementById("start").classList.add("active");
  }, 5000);

  // Start button functionality
  document.getElementById("startBtn").addEventListener("click", function() {
    document.getElementById("start").classList.remove("active");
    document.getElementById("game").classList.add("active");
  });
};
</script>

</body>
</html>
